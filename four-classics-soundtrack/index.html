<title>🎵 四大名曲·声音博物馆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--sf:#14141f;--sf2:#1e1e2e;--tx:#e8e8f0;--tx2:#8888aa;--tx3:#555577;--bd:#2a2a3a;--ac:#9b59b6}
body{font-family:Georgia,'Noto Serif SC',serif;background:var(--bg);color:var(--tx);min-height:100vh}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:16px;white-space:nowrap}
.hdr .sub{font-size:10px;color:var(--tx2)}
.sts{margin-left:auto;display:flex;gap:8px;font-size:10px;color:var(--tx2)}
.sts span{padding:2px 8px;background:var(--sf);border-radius:10px}
.main{display:flex;margin-top:46px;height:calc(100vh - 46px)}
.sb{width:320px;border-right:1px solid var(--bd);overflow-y:auto;flex-shrink:0}
.nvt{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.nvt div{flex:1;padding:8px 2px;text-align:center;font-size:10px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.nvt div:hover{background:var(--sf)}
.nvt div.on{border-bottom-color:var(--ac);background:var(--sf)}
.nvt .ico{font-size:16px;display:block;margin-bottom:1px}
.tl{padding:6px}
.ti{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:.15s;margin-bottom:2px}
.ti:hover{background:var(--sf)}
.ti.on{background:var(--sf2);box-shadow:inset 3px 0 0 var(--ac)}
/* Feature 4: Current track highlight pulse animation */
@keyframes trackPulse{
  0%,100%{box-shadow:inset 3px 0 0 var(--ac),0 0 0 0 transparent}
  50%{box-shadow:inset 3px 0 0 var(--ac),0 0 12px 2px var(--ac)}
}
.ti.on.playing{animation:trackPulse 1.5s ease-in-out infinite;background:var(--sf2)}
.ti.on .tt{color:var(--ac)}
.tn{font-size:10px;color:var(--tx3);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.tt{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts{font-size:9px;color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Feature 5: Content area fade transition */
.ct{flex:1;overflow-y:auto;padding:28px 36px;max-width:780px}
.ct.fade-out{opacity:0;transform:translateY(8px);transition:opacity .15s ease,transform .15s ease}
.ct.fade-in{opacity:1;transform:translateY(0);transition:opacity .25s ease,transform .25s ease}
.ct h2{font-size:22px;margin-bottom:4px}
.ct .sc{font-size:12px;color:var(--tx2);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.ct h3{font-size:14px;margin:18px 0 8px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.ct h3::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--ac)}
.ly{font-size:13px;line-height:1.9;white-space:pre-wrap;background:var(--sf);padding:16px 20px;border-radius:10px;border:1px solid var(--bd)}
.ly b{color:var(--ac)}
.sb2{background:var(--sf2);padding:12px 16px;border-radius:8px;font-size:11px;line-height:1.6;color:var(--tx2);border-left:3px solid var(--ac)}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.tg{padding:1px 8px;background:var(--sf2);border-radius:10px;font-size:9px;color:var(--tx2)}
.nt{font-size:12px;line-height:1.7;color:var(--tx2)}
.nt li{margin-bottom:4px}
/* Player bar */
.pl{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);padding:6px 20px;display:none;align-items:center;gap:12px;z-index:100}
.pl .info{flex:1;overflow:hidden}
.pl .info .pt{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .info .ps{font-size:10px;color:var(--tx2)}
.pl .ctrl{display:flex;gap:6px;align-items:center}
.pb{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.15s}
.pb:hover{background:var(--sf2)}
.pb.py{width:38px;height:38px;font-size:14px;background:var(--ac);border-color:transparent}
/* Feature 3: Shuffle button active state */
.pb.sf-on{background:var(--ac);color:#fff;border-color:transparent;font-size:14px}
/* Feature 1: Waveform visualizer */
.wv{display:flex;align-items:flex-end;gap:2px;height:24px;padding:0 4px}
.wv .bar{width:3px;border-radius:2px;background:var(--ac);opacity:.6;transition:height .3s ease,height .15s ease;min-height:3px}
/* Waveform animation when playing */
@keyframes waveBar{
  0%,100%{height:3px}
  50%{height:20px}
}
.wv.active .bar{animation:waveBar 0.8s ease-in-out infinite}
.wv.active .bar:nth-child(1){animation-delay:0s}
.wv.active .bar:nth-child(2){animation-delay:0.1s}
.wv.active .bar:nth-child(3){animation-delay:0.2s}
.wv.active .bar:nth-child(4){animation-delay:0.05s}
.wv.active .bar:nth-child(5){animation-delay:0.15s}
.wv.active .bar:nth-child(6){animation-delay:0.25s}
.wv.active .bar:nth-child(7){animation-delay:0.08s}
.wv.active .bar:nth-child(8){animation-delay:0.18s}
.wv.active .bar:nth-child(9){animation-delay:0.12s}
.wv.active .bar:nth-child(10){animation-delay:0.22s}
.wv.active .bar:nth-child(11){animation-delay:0.03s}
.wv.active .bar:nth-child(12){animation-delay:0.13s}
.wv.active .bar:nth-child(13){animation-delay:0.07s}
.wv.active .bar:nth-child(14){animation-delay:0.17s}
.wv.active .bar:nth-child(15){animation-delay:0.09s}
.wv.active .bar:nth-child(16){animation-delay:0.19s}
/* Keyboard hints */
.kbd-hint{position:fixed;bottom:52px;right:12px;font-size:9px;color:var(--tx3);background:var(--sf);padding:4px 8px;border-radius:4px;opacity:0;transition:opacity .3s;z-index:101;pointer-events:none}
.kbd-hint.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
@media(max-width:768px){.sb{width:100%;position:fixed;bottom:46px;left:0;right:0;height:40vh;border-right:none;border-top:1px solid var(--bd);border-radius:14px 14px 0 0;transform:translateY(calc(100% - 40px));transition:.3s;z-index:90}.sb.open{transform:translateY(0)}.ct{padding:16px 12px}.mh{display:flex!important}}.mh{display:none;padding:6px;text-align:center;cursor:pointer}.mh::after{content:'···';font-size:16px;color:var(--tx3)}
</style>
</head>

<script>
const T=[{"id": "hlm-01", "nv": "hlm", "title": "HLM-01 通灵宝玉·序曲", "scene": "红楼梦 · 开篇 · 顽石下凡", "lyrics": "[Intro]\n（古琴泛音，如露珠滴落玉石）\n\n[Verse 1]\n补天遗石卧青埂 几世风霜刻玉纹\n茫茫大士拈花笑 渺渺真人指路尘\n一入红尘千万劫 不知何处是归程\n\n[Verse 2]\n衔玉而生满堂惊 金陵贾府旧门庭\n通灵宝玉胸前挂 上写仙寿与恒昌\n人人都说好皮囊 谁识石中万界光\n\n[Chorus]\n莫失莫忘 仙寿恒昌\n石头有梦 梦里有光\n红尘一遭 何为真何为妄\n且看这块顽石 怎么笑怎么哭 怎么了这一场\n\n[Verse 3]\n大观园里花似锦 少年公子最多情\n见了姐姐忘妹妹 世人皆笑太痴凝\n不知他眼中看见的 是花是泪还是石上纹\n\n[Bridge]\n（渐强，加入笛子和弦乐）\n石头记得一切——\n每一个笑 每一滴泪\n每一次聚 每一次散\n它在等 等一个契机\n让纹路变成通向万界的门\n\n[Chorus]\n莫失莫忘 仙寿恒昌\n石头有梦 梦里有光\n红尘一遭 何为真何为妄\n且看这块顽石 怎么笑怎么哭 怎么了这一场\n\n[Outro]\n（回归古琴泛音，渐弱至寂静）\n通灵……通灵……\n（一声玉磬，余韵悠长）", "suno": "Ethereal Chinese classical folk with ambient synthesizer, guqin and jade chimes, haunting female vocalist with pure tone, starts sparse and meditative, builds to lush orchestral with erhu and strings in bridge, returns to quiet guqin at end, dynamic arc from whisper to power to whisper, minor key, 75 BPM, cinematic opening theme", "tags": "guqin,chinese-classical,ethereal,ambient,cinematic-opening,female-vocal,minor-key,meditative,jade-chimes,erhu,strings", "notes": "- **音色选择**：古琴代表石头本身的古老和静谧，玉磬代表\"通灵\"的觉醒瞬间\n- **歌词结构**：AAA + 前后古琴呼应 = 石头的记忆循环（开始即结束，结束即开始）\n- **暗线植入**：\"石上纹\"和\"万界光\"呼应四梦归一的主线——通灵宝玉的纹路是万界密码\n- **Bridge 动态**：从安静到壮阔再回归安静，象征宝玉从顽石→入红尘→归去的生命弧线\n- **\"莫失莫忘\"**：原书八字，作为整首歌的核心hook，每次出现情感递进", "links": "- 📍 Atlas: `rongguofu` 荣国府 / `dahuangshan` 大荒山\n- 📖 四梦归一: 第1回\"通灵宝玉夜生异纹\"\n- 🎴 字阵: 贾宝玉·通灵宝玉持有者"}, {"id": "hlm-02", "nv": "hlm", "title": "HLM-02 黛玉葬花", "scene": "红楼梦 · 第二十七回 · 芒种节葬花吟", "lyrics": "[Intro]\n（钢琴独奏，如花瓣飘落的音符，每个音之间有呼吸的留白）\n\n[Verse 1]\n花谢花飞花满天 红消香断有谁怜\n游丝软系飘春榭 落絮轻沾扑绣帘\n闺中女儿惜春暮 愁绪满怀无处诉\n\n[Verse 2]\n手把花锄出绣阁 忍踏落花来复去\n柳丝榆荚自芳菲 不管桃飘与柳飞\n桃李明年能再发明年闺中知有谁\n\n[Chorus]\n一年三百六十日 风刀霜剑严相逼\n明媚鲜妍能几时 一朝漂泊难寻觅\n花开易见落难寻 阶前闷杀葬花人\n\n[Bridge]\n（弦乐渐入，从单音到和弦）\n愿奴胁下生双翼 随花飞到天尽头\n天尽头——何处有香丘？\n未若锦囊收艳骨 一抔净土掩风流\n质本洁来还洁去 强于污淖陷渠沟\n\n[Chorus]\n尔今死去侬收葬 未卜侬身何日丧\n侬今葬花人笑痴 他年葬侬知是谁\n试看春残花渐落 便是红颜老死时\n一朝春尽红颜老 花落人亡两不知\n\n[Outro]\n（钢琴渐弱，最后三个音符像花瓣落定）\n花落……人亡……两不知……\n（无声，唯余风声）", "suno": "Heartbreaking solo piano ballad with delicate touch, sparse notes with lots of space between them, gradually joined by weeping erhu and trembling strings in bridge, whisper-to-crescendo-to-whisper dynamic, solo female vocalist with trembling vulnerability and classical Chinese phrasing, tragic and beautiful, 65 BPM, D minor, the singer sounds like she is crying while singing", "tags": "solo-piano,ballad,sad,erhu,chinese-classical,female-vocal,heartbreaking,delicate,trembling,vulnerable,D-minor,sparse,cinematic", "notes": "- **钢琴代替古琴**：黛玉是\"外来者\"——她的悲伤不属于这个时代的固有乐器体系，钢琴的\"孤独感\"更贴合\n- **节奏极慢（65 BPM）**：模拟黛玉葬花时一步一停的节奏，每个音符之间的留白比音符本身更重要\n- **Bridge的\"天尽头\"**：从悲伤转向壮烈——\"质本洁来还洁去\"是黛玉最傲骨的宣言\n- **结尾留白**：最后几秒只有风声——花已落，人已去，只剩空间本身\n- **原诗化用**：歌词直接化用曹雪芹原诗《葬花吟》，在关键处稍作现代化处理", "links": "- 📍 Atlas: `daguan` 大观园 / `xiaoxiangguan` 潇湘馆\n- 📖 四梦归一: 第6回\"琉璃桃花映十二钗\"（黛玉视角初登场）\n- 🎴 字阵: 林黛玉·暗花之主"}, {"id": "hlm-03", "nv": "hlm", "title": "HLM-03 宝黛初会", "scene": "红楼梦 · 第三回 · \"这个妹妹我见过\"", "lyrics": "[Intro]\n（温暖的弦乐四重奏，像阳光穿过纱帘）\n\n[Verse 1]\n帘幕轻挑 谁走了进来\n满屋子的人都安静了——\n他说 虽然未曾见过她\n却觉得面善 这个妹妹我曾见过的\n\n[Verse 2]\n她的心也颤了一下——\n好生奇怪 倒像在哪里见过\n两双眼睛隔着三世重逢\n什么话都不必说 就懂了\n\n[Pre-Chorus]\n他问 妹妹可曾读书\n他问 妹妹可有玉没有\n听说没有 他竟发了痴——\n摔玉 这劳什子 我不要了\n\n[Chorus]\n一见如故 不是初见是重逢\n你和我之间 隔着三生石上旧精魂\n这个妹妹我见过 在前世在梦里在补天之前\n你来了 石头才算有了温度\n\n[Verse 3]\n众人慌作一团 都来哄他\n她却偷偷红了眼——\n不是因为害怕\n是因为 他为一块玉发了疯\n而她 恰恰没有玉\n\n[Bridge]\n（音乐轻柔，像月光）\n这是贾府的第三天\n这是他们此生的第一眼\n后面还有多少眼泪要还\n多少欢笑 多少伤悲 多少来不及\n\n[Chorus]\n一见如故 不是初见是重逢\n你和我之间 隔着三生石上旧精魂\n这个妹妹我见过 在前世在梦里在补天之前\n你来了 石头才算有了温度\n\n[Outro]\n（弦乐渐暖，像晚霞）\n\"这个妹妹……我见过的……\"\n（温柔的女声和声叠加，渐隐）", "suno": "Warm string quartet ballad, gentle and romantic with classical Chinese elements, male and female vocal duet with tender intertwined phrasing, starts intimate and soft, builds to lush orchestral swell in chorus, bridge strips back to solo piano with moonlight atmosphere, final chorus is full and warm, 72 BPM, F major, the feeling of recognizing someone you've always known", "tags": "string-quartet,romantic,warm,duet,male-female,tender,classical-chinese,orchestral,F-major,intimate,reunion,beautiful", "notes": "- **男女对唱**：用duet形式表达\"两个灵魂互相认出\"——声音交织=命运交织\n- **摔玉事件**：看似突兀，实则是最深情的表达——\"你有玉我没有，那玉就不该存在\"\n- **\"三生石上旧精魂\"**：直接引用原书中暗示宝黛前世（神瑛侍者与绛珠仙草）\n- **Bridge 的时间感**：\"这是第三天/这是第一眼\"——用极简的句子制造巨大张力\n- **温度隐喻**：\"石头有了温度\"——双关：宝玉是人（有温度），四梦归一中石兄共振也有温度", "links": "- 📍 Atlas: `rongguofu` 荣国府\n- 📖 四梦归一: 第1回（宝黛前世·神瑛侍者与绛珠仙草的伏笔）\n- 🎴 字阵: 贾宝玉 + 林黛玉"}, {"id": "hlm-04", "nv": "hlm", "title": "HLM-04 太虚幻境", "scene": "红楼梦 · 第五回 · 警幻仙子·金陵十二钗判词", "lyrics": "[Intro]\n（迷幻合成器pad，如入幻境，电子音效飘渺）\n\n[Verse 1]\n朱红的门 无风自开\n仙香扑面 不知身在何界\n警幻仙子立于云端\n手指翻开 金陵十二页\n每一页写着一个名字\n每一个名字背后是命运\n\n[Verse 2]\n\"可叹停机德\" 谁的贤淑成了枷锁\n\"堪怜咏絮才\" 谁的才华无处安放\n\"玉带林中挂\" 一条玉带 挂在枯木\n\"金簪雪里埋\" 一支金簪 埋于白雪\n\n[Chorus]\n太虚幻境里 句句是真言\n醒来却全忘了 只剩一颗心在颤\n判词判得了命 判不了情\n簿册写满了字 写不尽这一生\n十二支曲子 十二段终局\n听得懂的人 还没出生\n\n[Bridge]\n（电子节拍渐强，叠加古筝）\n仙子说——这些都是你们的影子\n宝玉说——我一个都不认识\n仙子笑了——你不用认识\n你只需要经历\n\n[Chorus]\n太虚幻境里 句句是真言\n醒来却全忘了 只剩一颗心在颤\n判词判得了命 判不了情\n簿册写满了字 写不尽这一生\n\n[Outro]\n（合成器渐远，如梦境消散）\n判词……判词……\n（一声清脆的铃声——梦醒了）", "suno": "Dreamy psychedelic electronic with traditional Chinese guzheng and synthesizer pads, ethereal female vocalist with operatic quality, mysterious and otherworldly atmosphere, electronic beats that pulse like a heartbeat under ancient strings, builds from ambient to intense in bridge then returns to ethereal, 80 BPM, A minor with occasional major lifts, feels like floating between dimensions", "tags": "psychedelic,electronic,dreamy,guzheng,ethereal,female-vocal,mysterious,ambient,A-minor,otherworldly,synthesizer,pulsing-beats", "notes": "- **电子+古筝**：太虚幻境是\"超越时代的空间\"——电子音色代表它的非人间属性\n- **判词原句**：\"可叹停机德\"\"堪怜咏絮才\"\"玉带林中挂\"\"金簪雪里埋\"都是曹雪芹原判词\n- **\"听得懂的人还没出生\"**：最残酷的预言是——你看到了结局却无力改变\n- **四梦归一连接**：警幻在小说中是\"万界之母\"，这首歌暗示她的身份远超红楼梦范畴\n- **铃声结尾**：梦境与现实的交界音——一声铃响，仙境消散", "links": "- 📍 Atlas: `taixu` 太虚幻境\n- 📖 四梦归一: 第27回\"警幻仙子现身说\"（揭露万界之母身份）\n- 🎴 字阵: 警幻仙子"}, {"id": "hlm-05", "nv": "hlm", "title": "HLM-05 元春省亲", "scene": "红楼梦 · 第十八回 · 烈火烹油鲜花着锦", "lyrics": "[Intro]\n（宫廷管弦齐奏，锣鼓开道，壮丽辉煌）\n\n[Verse 1]\n大观园灯火如昼 说不尽的太平气象\n贾母率领女眷跪拜 迎的是贵妃娘娘\n仪仗过了街 满城人都仰望\n烈火烹油 鲜花着锦 盛世模样\n\n[Verse 2]\n凤冠霞帔下的那双眼睛 却湿了\n她看见祖母 母亲 妹妹们——\n隔着帘子哭了\n当日既送我到那不得见人的去处\n今日好容易回家 却隔着君臣的礼数\n\n[Chorus]\n省亲省的是什么亲\n繁华之下 骨肉已经分\n烈火烧得旺 锦上花正盛\n谁知道那宫墙里面 有多少个无声的夜深\n她不说痛 她只说 满心里皆骨肉\n\n[Bridge]\n（音乐骤然安静，只剩一把二胡）\n大观园题匾 她赐了名\n\"有凤来仪\" \"蘅芷清芬\"\n每一个雅致的名字后面\n是一个女儿被困住的青春\n\n[Chorus]\n省亲省的是什么亲\n繁华之下 骨肉已经分\n烈火烧得旺 锦上花正盛\n谁知道那宫墙里面 有多少个无声的夜深\n\n[Outro]\n（管弦再起，但已变了味——像盛装的葬礼）\n省亲……省亲……\n省不了的亲 断不了的情\n（最后的鼓点是心跳，越来越慢）", "suno": "Majestic court orchestral with traditional Chinese ceremonial instruments, gong and drums opening, pipa and suona for grandeur, sudden shift to solo erhu in bridge representing hidden sorrow, female vocalist with classical Chinese opera training, starts triumphant then reveals the sadness underneath, 88 BPM, starts in C major shifts to C minor, the sound of a golden cage", "tags": "court-orchestral,chinese-ceremonial,pipa,suona,gong,erhu,triumphant-to-sad,female-vocal,C-major-to-minor,grand,hidden-sorrow", "notes": "- **壮丽→悲凉**：音乐从盛大开始，逐渐揭示繁华下的代价——这是红楼梦的核心手法\n- **\"省亲省的是什么亲\"**：一个字的多义——省=探望/省悟/节省。她什么都省不了\n- **\"有凤来仪\"**：元春赐的匾额名——表面吉祥，暗含\"凤凰被困\"之意\n- **鼓点=心跳**：结尾的鼓点越来越慢，暗示元春在宫中的生命力正在消逝", "links": "- 📍 Atlas: `daguan` 大观园 / `rongguofu` 荣国府\n- 📖 四梦归一: 第55回\"世界重叠第一天\"（大观园上的花果山）\n- 🎴 字阵: 贾元春"}, {"id": "hlm-06", "nv": "hlm", "title": "HLM-06 湘云醉卧", "scene": "红楼梦 · 第六十二回 · 芍药裀·憨湘云醉眠", "lyrics": "[Intro]\n（轻快的竹笛，像春天的风，加入轻巧的琵琶）\n\n[Verse 1]\n芍药花开得正盛 她喝了太多酒\n偷偷溜出宴席 花丛里找个枕头\n鲛帕包花瓣 青石板当床\n蜜蜂围着她转 蝴蝶落在她肩上\n\n[Verse 2]\n众人找了半天 发现她在笑\n梦里的酒令说了一半——\n\"泉香而酒冽 玉碗盛来琥珀光\"\n醉了也这么可爱 这世上只有她做得到\n\n[Chorus]\n醉卧花间不用扶\n花瓣当被石当铺\n梦里还在吟诗呢\n蜜蜂蝴蝶都是舞伴\n笑一笑吧 这世上\n还有比这更美的事吗\n\n[Bridge]\n（竹笛变柔，像微风）\n别人都小心翼翼地活\n她偏要大大咧咧地笑\n命运给了她苦 她还以甜\n花间一梦 醒来又是一条好汉\n\n[Chorus]\n醉卧花间不用扶\n花瓣当被石当铺\n梦里还在吟诗呢\n蜜蜂蝴蝶都是舞伴\n笑一笑吧 这世上\n还有比这更美的事吗\n\n[Outro]\n（琵琶轻轻拨弦，像花瓣飘落）\n\"直饮到梅梢月上……\"\n（一个含糊的笑声，翻了个身，继续睡）", "suno": "Cheerful Chinese folk pop with bamboo flute and pipa, playful and innocent female vocalist with a slight smile in her voice, bouncy rhythm like walking through a flower garden, light and airy arrangement, brass bells and chimes for fairy-tale quality, 100 BPM, G major, feels like a spring day with butterflies", "tags": "chinese-folk,bamboo-flute,pipa,cheerful,playful,female-vocal,innocent,G-major,bouncy,spring,flower-garden,fairy-tale", "notes": "- **最轻快的一首**：红楼梦太悲伤了，湘云是难得的亮色——用民歌风格而非古典\n- **蜜蜂蝴蝶**：用乐器（叮铃声）模拟昆虫飞舞的通感效果\n- **\"命运给了她苦她还以甜\"**：湘云自幼父母双亡，却从不怨天尤人——音乐不能只欢快，要在细节处暗示她的坚强\n- **结尾的\"翻了个身\"**：最生动的一幕——找到她时她在笑，她继续睡", "links": "- 📍 Atlas: `daguan` 大观园\n- 📖 四梦归一: 湘云在融合世界中的乐观精神感染众人\n- 🎴 字阵: 史湘云"}, {"id": "hlm-07", "nv": "hlm", "title": "HLM-07 晴雯撕扇", "scene": "红楼梦 · 第三十一回 · 撕扇子作千金一笑", "lyrics": "[Intro]\n（电吉他失真riff，像扇骨折断的声音，加入鼓点）\n\n[Verse 1]\n一把扇子值几个钱 值得你生那么大的气\n她说 你自己扇子都不爱惜 凭什么来管我\n红了眼 扭过头 不肯服软\n那股子倔劲儿 像刀子 像火焰\n\n[Pre-Chorus]\n他搬出一整箱扇子——\n撕吧 撕到你高兴为止\n名人字画 稀世珍品\n在你的笑面前 都不值一提\n\n[Chorus]\n撕——\n名贵的扇子算什么\n千金买一笑 她就是千金\n撕的是扇子 不屈的是灵魂\n晴雯啊晴雯 你撕裂的不是纸是枷锁\n撕得痛快 撕得漂亮 撕得像个女王\n\n[Verse 2]\n麝月在旁边说 她生气你哄她 我听见了\n晴雯笑了 那笑容像裂开的冰\n露出了里面最干净的水\n她不装 不忍 不委屈自己\n她是整个大观园里 最真的存在\n\n[Bridge]\n（鼓点加倍，电吉他solo）\n后来她被赶出贾府 无人敢替她说话\n宝玉去看她 她咬断指甲交给他\n\"早知担了虚名 我不如……\"\n她没说完的话 比撕一百把扇子更响\n\n[Chorus]\n撕——\n名贵的扇子算什么\n千金买一笑 她就是千金\n撕的是扇子 不屈的是灵魂\n晴雯啊晴雯 你撕裂的不是纸是枷锁\n撕得痛快 撕得漂亮 撕得像个女王\n\n[Outro]\n（电吉他渐弱，回归到一声清脆的——撕）\n撕……\n（沉默两秒）\n她的笑 还在回荡", "suno": "Fiery rock with distorted electric guitar and aggressive drums, powerful female vocalist with raw emotion and punk energy, Chinese rock elements with pipa mixed into the guitar, intense and defiant, starts with a ripping guitar riff, builds to explosive chorus, quiet verse 2 for contrast, full blast bridge and final chorus, 120 BPM, E minor, sounds like rebellion", "tags": "rock,electric-guitar,punk,aggressive-drums,female-vocal,raw,defiant,E-minor,chinese-rock,pipa,rebellion,powerful", "notes": "- **摇滚=晴雯的性格**：不委曲求全、不装、宁折不弯——只有摇滚配得上她\n- **\"撕\"作为核心节奏**：每个\"撕\"字落在强拍上，像扇骨折断的声音\n- **Bridge的转折**：撕扇有多痛快，被赶出就有多惨——音乐从狂飙骤降至安静\n- **\"比撕一百把扇子更响\"**：未完的话比任何行动都更有力", "links": "- 📍 Atlas: `rongguofu` 荣国府 / `yihongyuan` 怡红院\n- 🎴 字阵: 晴雯"}, {"id": "hlm-08", "nv": "hlm", "title": "HLM-08 探春远嫁", "scene": "红楼梦 · 第一百回 · 悲远嫁骨肉分离", "lyrics": "[Intro]\n（古筝独奏，清冷如秋水，渐入弦乐）\n\n[Verse 1]\n她是玫瑰花 又红又香又扎手\n管起家来 谁都不服不行\n大观园里只有她 敢跟王夫人叫板\n秋爽斋的窗户永远开着——\n她说 要看清楚外面在发生什么\n\n[Verse 2]\n可看清楚了又怎样\n命运不跟你讲道理\n一声远嫁 千山万水\n从此故乡只在梦里\n\n[Chorus]\n风筝断了线 飞向海的那一边\n她回头看了一眼——\n贾府的屋脊还在 树也还在\n只是不知道 下一次回来\n那些树 还在不在\n\n[Bridge]\n（古筝渐强，像海风）\n她没有哭 她不会哭\n她是探春 玫瑰花不会哭\n但她站在船头的那一秒\n风吹起了她的衣角——\n那是整本书里 最安静的一秒\n\n[Chorus]\n风筝断了线 飞向海的那一边\n她回头看了一眼——\n贾府的屋脊还在 树也还在\n只是不知道 下一次回来\n那些树 还在不在\n\n[Outro]\n（古筝最后一个音，很长很长，像风筝的线）\n海风吹啊吹……\n玫瑰花的刺 扎进了海里", "suno": "Melancholic guzheng ballad with swelling strings, cold and dignified female vocalist with controlled emotion, starts sparse and autumnal, builds to cinematic orchestra in bridge with ocean wind effects, the singer holds back tears through the entire song until the very last note, 68 BPM, B minor, the sound of someone who refuses to cry", "tags": "guzheng,melancholic,strings,autumnal,female-vocal,dignified,B-minor,cinematic,ocean-wind,controlled-emotion", "notes": "- **古筝=探春**：清冷、有棱角、但骨子里有温度\n- **\"最安静的一秒\"**：整首歌最激烈的不是嘶吼，是探春站在船头没哭的那一秒\n- **风筝意象**：探春的判词是\"一片大水上一只大船 船中有一女子掩面泣涕\"，风筝=断线的命运", "links": "- 📍 Atlas: `daguan` 大观园 / `nanjing` 南京\n- 🎴 字阵: 贾探春"}, {"id": "hlm-09", "nv": "hlm", "title": "HLM-09 凤姐弄权", "scene": "红楼梦 · 协理荣国府 · 弄权铁槛寺", "lyrics": "[Intro]\n（爵士钢琴+暗黑bass line，如深夜算盘）\n\n[Verse 1]\n未见面先闻笑声 一语未了 笑声先到\n丹唇未启笑先闻 粉面含春威不露\n她是荣国府的发动机\n没有她 整个家就散架\n\n[Verse 2]\n协理宁国府 三板斧砍下去\n赏罚分明 杀一儆百 谁敢不服\n铁槛寺里三千两银子\n一条人命就换了 她说——\n我是从来不信什么阴司地狱报应的\n\n[Chorus]\n笑里藏刀 刀不露刃\n她算得清每一笔账 唯独算不清自己的命\n机关算尽太聪明\n算到最后 算的是自己的棺材\n凤姐啊凤姐 你的聪明害了你\n\n[Bridge]\n（节奏变快，像在奔跑）\n她也知道累 她也知道怕\n小月之后 她还在管账\n她说 我若不管 谁来管\n她的身体在垮 她的嘴还在逞强\n那双丹凤眼 已经看到了结局\n\n[Chorus]\n笑里藏刀 刀不露刃\n她算得清每一笔账 唯独算不清自己的命\n机关算尽太聪明\n算到最后 算的是自己的棺材\n凤姐啊凤姐 你的聪明害了你\n\n[Outro]\n（爵士渐散，像曲终人散的宴席）\n笑声远了……\n算盘还在响……\n（一声低沉的bass——落幕）", "suno": "Dark jazz with walking bass line and piano, film noir atmosphere, sultry female vocalist with knowing smirk and sharp phrasing, Chinese jazz fusion with pipa accents, cynical and powerful energy, builds tension through rhythm not volume, 95 BPM, F minor, sounds like a chess game at midnight", "tags": "dark-jazz,bass-line,piano,film-noir,female-vocal,sultry,sharp,F-minor,chinese-jazz,cynical,powerful,chess-game", "notes": "- **爵士=凤姐**：精明、世故、暗黑——爵士的即兴性=凤姐的应变能力\n- **\"不信报应\"**：这是凤姐最著名的台词之一，也是她的悲剧内核\n- **Bridge的\"还在管账\"**：即使身体垮了，她不肯放手——控制欲和责任感纠缠不清\n- **\"机关算尽太聪明\"**：原书判词，全曲核心——聪明反被聪明误", "links": "- 📍 Atlas: `rongguofu` 荣国府\n- 📖 四梦归一: 凤姐+曹操的\"后代吵了三百年\"——两个权谋家的后代延续\n- 🎴 字阵: 王熙凤"}, {"id": "hlm-10", "nv": "hlm", "title": "HLM-10 大观园四季", "scene": "红楼梦 · 大观园全景 · 春夏秋冬组曲", "lyrics": "[Intro - 春]\n（笛声清越，如春风拂柳）\n\n[Spring]\n桃花开了 杏花也开了\n林姑娘在潇湘馆 咳了两声又笑了\n宝姐姐在蘅芜苑 整理新编的诗稿\n探春在秋爽斋 改革的花名册贴上墙\n春天的大观园 像一只刚醒来的猫\n\n[Pre-Chorus]\n四季转啊转\n人在园中 笑在花间\n不知道哪一天 园门就关了\n\n[Summer - 夏]\n（琵琶轮指，如夏夜虫鸣）\n月亮升起来了 湖面上的荷花映着光\n史湘云醉卧芍药丛 蜜蜂还没走\n宝玉在怡红院 给晴雯端来了冰镇的酸梅汤\n夏夜的风吹过大观园 带着花香\n\n[Chorus]\n大观园 四季如梦\n春的花 夏的月 秋的风 冬的雪\n每一季都有人笑 有人哭\n有人在诗社里写出绝句\n有人在角落里默默流泪\n这一年的四季 是最好的四季\n\n[Autumn - 秋]\n（二胡低回，如秋风萧瑟）\n海棠诗社散了 桂花落了一地\n黛玉的病又重了 药碗摆满窗台\n宝钗的金锁 在秋风里轻轻晃\n这个秋天的大观园 有了第一片枯叶\n\n[Bridge]\n（全乐队齐奏，壮丽而忧伤）\n四个季节 四段故事\n来年的春天 花还会开\n但看花的人 不一定还在\n\n[Winter - 冬]\n（钢琴+铃铛，如雪花飘落）\n琉璃世界白雪红梅 宝琴披着凫靥裘\n芦雪庵里烤鹿肉 湘云和宝玉笑成一团\n但雪越下越大 越下越大——\n终于把整个大观园都埋了\n\n[Chorus]\n大观园 四季如梦\n春的花 夏的月 秋的风 冬的雪\n每一季都有人笑 有人哭\n有人在诗社里写出绝句\n有人在角落里默默流泪\n这一年的四季 是最好的四季\n\n[Outro]\n（四季的主题依次再现，渐弱）\n春……夏……秋……冬……\n（最后一个音——雪落无声）", "suno": "Four-movement orchestral suite: Spring is light bamboo flute and strings, Summer features pipa and warm woodwinds, Autumn shifts to erhu and melancholic brass, Winter is piano and bells with snow ambiance, female choir throughout, transitions between seasons are seamless, 72 BPM to 60 BPM decelerating, the entire piece feels like watching a garden through a year, C major to A minor to D minor to silence", "tags": "orchestral-suite,four-seasons,chinese-classical,bamboo-flute,pipa,erhu,piano,choir,seasonal,cinematic,symphony,progressive", "notes": "- **套曲结构**：四段对应四季，每段用不同主乐器（笛/琵琶/二胡/钢琴）\n- **速度递减**：72→60 BPM，像时间越来越慢——繁华在消退\n- **\"冬\"的结尾**：雪把大观园埋了——不是毁灭，是覆盖。原书中大观园被抄检后确如废墟\n- **\"最好的四季\"**：合唱反复出现，每次情感递进——第一次是欣喜，第二次是怀念，最后一次是悼念", "links": "- 📍 Atlas: `daguan` 大观园（核心地点）\n- 📖 四梦归一: 第55-60回\"世界重叠\"——大观园上叠了花果山\n- 🎴 字阵: 十二金钗全员"}, {"id": "hlm-11", "nv": "hlm", "title": "HLM-11 焚稿断情", "scene": "红楼梦 · 第九十七回 · 焚稿断痴情", "lyrics": "[Intro]\n（钢琴低音区，沉重的和弦，如火盆中的暗红）\n\n[Verse 1]\n她把诗稿一张一张投进火盆\n火舌舔过墨迹 变成了黑色的蝴蝶\n飞起来 又落下去\n那些写给他的诗——\n\"花谢花飞花满天\" 烧了\n\"秋窗风雨夕\" 烧了\n\"半卷湘帘半掩门\" 烧了\n\n[Verse 2]\n还有那块旧帕子 他当年挨打后\n让人送来擦泪的\n她在上面题过三首绝句\n现在也扔进了火里\n丝帛比纸烧得慢 火光映红了她的脸\n那张脸上 没有泪 只有灰\n\n[Pre-Chorus]\n紫鹃在旁边哭得说不出话\n她却平静得可怕——\n\"我烧的是我的\n他欠的 他自己还\"\n\n[Chorus]\n焚稿断情 断的是纸 断不了的是命\n三生石上的债 还了三世的泪\n到头来 他不欠她 她不欠他\n她把一切都烧了 连灰都不留给他\n——这是她最后的骄傲\n\n[Bridge]\n（钢琴最高音区，像碎裂的玻璃）\n那边锣鼓喧天 大红的喜字贴满了门\n这边火盆将灭 最后一张纸上写着——\n\"一朝春尽红颜老 花落人亡两不知\"\n她念了一半 念不下去了\n\n[Chorus]\n焚稿断情 断的是纸 断不了的是命\n三生石上的债 还了三世的泪\n到头来 他不欠她 她不欠他\n她把一切都烧了 连灰都不留给他\n——这是她最后的骄傲\n\n[Outro]\n（钢琴从高音滑向低音，像一声叹息）\n火灭了……稿没了……\n她闭上眼——\n\"宝玉 你好……\"\n（最长的沉默）\n\"……好\"什么 她没说完", "suno": "Devastating piano ballad, starts in low register with heavy chords like embers, female vocalist with raw grief that sounds almost calm, the singing gets more intense as the fire burns higher, bridge reaches high register like breaking glass, final chorus is whispered not sung, 55 BPM, E flat minor, the most emotionally exhausting song possible, silence at the end is louder than music", "tags": "piano-ballad,devastating,grief,female-vocal,raw,calm-grief,E-flat-minor,heavy-chords,whispered,heartbreaking,silence", "notes": "- **最悲伤的一首**：没有配乐支撑，只有钢琴——黛玉在最痛苦时不需要任何装饰\n- **55 BPM**：几乎到了人类感知的极限——每一拍之间的沉默比音乐本身更沉重\n- **\"好……好\"什么**：原书黛玉临终喊\"宝玉你好……\"没说完，这是红学最大的悬念之一\n- **火盆中的\"黑蝴蝶\"**：纸灰飘起如蝴蝶——呼应黛玉前世（绛珠仙草的蝴蝶意象）\n- **极端对比**：Bridge中那边的锣鼓vs这边的寂静——最残忍的蒙太奇", "links": "- 📍 Atlas: `xiaoxiangguan` 潇湘馆\n- 📖 四梦归一: 第11回\"焚稿渡万界\"（黛玉的泪成为万界通行密码）\n- 🎴 字阵: 林黛玉"}, {"id": "hlm-12", "nv": "hlm", "title": "HLM-12 白茫茫大地真干净", "scene": "红楼梦 · 终章 · 落了片白茫茫大地真干净", "lyrics": "[Intro]\n（无声，5秒。然后——一声磬。接着空旷的合唱，像雪原上的回声）\n\n[Verse 1]\n贾府的大门 终于关了\n门上的油漆剥落 露出木头本来的颜色\n那个衔玉而生的孩子 走出了门\n他回头看了一眼——\n大观园还在 雪盖住了所有花开过的地方\n\n[Verse 2]\n姐姐走了 妹妹也走了\n晴雯不在了 鸳鸯不在了\n凤姐的算盘 算到了自己的头\n刘姥姥来了 救走了巧姐\n故事里的好人都散了\n\n[Chorus]\n落了片白茫茫大地真干净\n来时是石头 走时还是石头\n红尘这一遭 好一场大梦\n梦里花似锦 醒来雪满天\n通灵宝玉上的八个字 还在发光\n——莫失莫忘 仙寿恒昌\n\n[Bridge]\n（合唱渐强，像大雪纷飞）\n茫茫大士来了 渺渺真人来了\n他们还是当年的样子\n\"该回去了 石头\"\n他点了点头——\n不是因为看破了\n是因为 看完了\n\n[Chorus]\n落了片白茫茫大地真干净\n来时是石头 走时还是石头\n红尘这一遭 好一场大梦\n梦里花似锦 醒来雪满天\n通灵宝玉上的八个字 还在发光\n——莫失莫忘 仙寿恒昌\n\n[Outro]\n（合唱渐渐远去，像雪地上的脚印被新雪覆盖）\n白茫茫……白茫茫……\n（最后的磬声——与开头的磬声呼应）\n（寂静。绝对的寂静。）\n（然后——远处一声鸟鸣）\n（春天会来的。）", "suno": "Ethereal choir a cappella with occasional jade chime strikes, vast and empty reverb like a snowfield, male and female choir singing in unison then splitting to harmony, no instruments except the chime and the silence between notes, builds from nothing to full choir in bridge then returns to nothing, 50 BPM, C major but feels like emptiness, the ending bird song suggests spring will return", "tags": "choir,a-cappella,jade-chime,snowfield,vast-reverb,male-female-choir,ethereal,emptiness,C-major,50-BPM,closing-theme,silence-as-music", "notes": "- **无伴奏合唱**：人生如戏，戏散了，只剩空间本身——合唱是人类最原始的音乐形式\n- **开头5秒无声**：让听众先感受\"白茫茫\"——空，然后音乐从空中生出\n- **\"不是因为看破了/是因为看完了\"**：宝玉出家不是因为厌世，是因为他完整地经历了\n- **结尾的鸟鸣**：最重要的一声——暗示轮回未断，故事会以新的形式重新开始\n- **呼应hlm-01**：开头和结尾都用磬声——序曲和终章是同一枚硬币的两面", "links": "- 📍 Atlas: `rongguofu` 荣国府 / `dahuangshan` 大荒山\n- 📖 四梦归一: 第120回大结局\"好\"——同样以空旷结尾\n- 🎴 字阵: 贾宝玉·通灵宝玉（最终归位）"}, {"id": "sgy-01", "nv": "sgy", "title": "SGY-01 滚滚长江·序曲", "scene": "三国演义 · 开篇 · 大势所趋", "lyrics": "[Intro]\n（史诗交响——大鼓定音，号角长鸣，江河奔涌的音效）\n\n[Verse 1]\n滚滚长江东逝水 浪花淘尽英雄\n是非成败转头空 青山依旧在 几度夕阳红\n白发渔樵江渚上 惯看秋月春风\n一壶浊酒喜相逢 古今多少事 都付笑谈中\n\n[Verse 2]\n天下大势 分久必合 合久必分\n自桓帝灵帝以来 黄巾遍地 烽烟四起\n十常侍乱政 董卓进京 洛阳化为灰烬\n百姓流离 白骨露于野 千里无鸡鸣\n\n[Chorus]\n大江东去 浪淘尽 千古风流人物\n这是一个最好的时代 英雄辈出 各显神通\n这是一个最坏的时代 白骨露野 血流成河\n谁在笑 谁在哭 谁在算计 谁在守护\n都不过是 历史长河里的一朵浪花\n\n[Bridge]\n（号角变成笛声——从战场到田园）\n可是那些人——\n桃园里的三兄弟 茅庐里的书生\n长坂坡上的白马 五丈原上的秋风\n他们是浪花 但浪花也翻涌过\n翻涌得那么壮烈 那么不甘 那么像永恒\n\n[Chorus]\n大江东去 浪淘尽 千古风流人物\n这是一个最好的时代 英雄辈出 各显神通\n这是一个最坏的时代 白骨露野 血流成河\n谁在笑 谁在哭 谁在算计 谁在守护\n都不过是 历史长河里的一朵浪花\n\n[Outro]\n（交响渐远，回归江水声）\n滚滚……滚滚……\n（一声号角——新的一页翻开）", "suno": "Epic orchestral opening with timpani and horns, cinematic and majestic, full orchestra with Chinese battle drums and bronze bells, powerful male choir chanting the opening poem, dynamic range from thunderous to intimate in bridge, builds to full forces for final chorus, 80 BPM, D minor to D major, sounds like the beginning of a legendary saga", "tags": "epic-orchestral,timpani,horns,cinematic,chinese-drums,male-choir,D-minor,saga-opening,majestic,battle-drums", "notes": "- **原诗开篇**：杨慎《临江仙》是三国演义的灵魂——直接用作核心歌词\n- **大鼓定调**：第一声鼓就是\"大势\"——不可抗拒的历史洪流\n- **Bridge的转折**：从\"历史\"转向\"人\"——那些具体的人才是读者记住的\n- **\"浪花也翻涌过\"**：用物理隐喻消解虚无——即使终将消逝，翻涌本身就是意义", "links": "- 📍 Atlas: `luoyang` 洛阳 / `chibi` 赤壁\n- 📖 四梦归一: 第9回\"赤壁罡风寻源\"（赤壁之战的万界共振）\n- 🎴 字阵: 刘备/曹操/孙权"}, {"id": "sgy-02", "nv": "sgy", "title": "SGY-02 桃园结义", "scene": "三国演义 · 第一回 · 宴桃园豪杰三结义", "lyrics": "[Intro]\n（三声鼓——咚、咚、咚——然后三支笛子同时吹响）\n\n[Verse 1]\n涿郡的春天 桃花开得正盛\n一个卖草鞋的 一个逃犯 一个杀猪的\n三个不相干的人 坐在了一棵桃树下\n你说怪不怪 这三个人\n怎么看都不像能成大事的\n\n[Verse 2]\n他们点了香 对天发了个誓——\n不求同年同月同日生\n但愿同年同月同日死\n这句话说起来容易\n做起来——要用一辈子去验证\n\n[Chorus]\n桃园三结义 义字当头\n不是血缘 是选择\n选择了彼此 就不回头\n不论富贵贫贱 不论生死存亡\n三个人 一条命\n这份义 到了最后 一个人都没违背\n\n[Bridge]\n（音乐变轻，像回忆）\n后来他们走散过\n后来他们重逢过\n后来关羽死了 张飞死了\n刘备为了报仇 起了倾国之兵\n他知道会输 他还是去了——\n因为他说过 同年同月同日死\n虽然他没做到 但他试了\n\n[Chorus]\n桃园三结义 义字当头\n不是血缘 是选择\n选择了彼此 就不回头\n不论富贵贫贱 不论生死存亡\n三个人 一条命\n这份义 到了最后 一个人都没违背\n\n[Outro]\n（三支笛子再次齐奏，渐弱）\n不求同生……但愿同死……\n（最后三声鼓——呼应开头）", "suno": "Heroic male choir ballad with three bamboo flutes representing three brothers, rousing and warm with martial undertones, starts intimate around a campfire feel, builds to powerful choral declaration, bridge strips back to solo flute for remembrance, final chorus is triumphant but bittersweet, 85 BPM, C major, the sound of brotherhood", "tags": "male-choir,bamboo-flute,heroic,brotherhood,warm,martial,C-major,rousing,bittersweet,three-brothers", "notes": "- **三支笛子=三兄弟**：每个乐器有微妙的音色差异，但合在一起是和声\n- **\"怎么做都不像能成大事的\"**：三国最动人的地方——英雄不问出处\n- **Bridge的回忆感**：从结义跳到结局——刘备明知会败仍报仇，这比胜利更壮烈\n- **三声鼓**：开头和结尾都用——三兄弟的节奏，三生三世", "links": "- 📍 Atlas: `zhuojun` 涿郡\n- 📖 四梦归一: 第24回\"义气三圣聚首\"（刘备+宋江+关羽的跨界义气）\n- 🎴 字阵: 刘备/关羽/张飞"}, {"id": "sgy-03", "nv": "sgy", "title": "SGY-03 三顾茅庐", "scene": "三国演义 · 第三十八回 · 定三分隆中决策", "lyrics": "[Intro]\n（古琴独奏，悠远深沉，如山林中的隐者）\n\n[Verse 1]\n第一次去 他不在\n第二次去 还是不在\n张飞说 一介村夫 何必如此\n关羽说 哥哥 你太客气了\n刘备说 你们不懂\n我要找的不是一个人 是一个方向\n\n[Verse 2]\n第三次去了 他在睡觉\n刘备站在门外 等了又等\n不叫 不敲门 就站在那\n外面的雪落在他肩上\n他知道 门里面那个人\n值得他等一辈子\n\n[Pre-Chorus]\n终于醒了——\n诸葛亮打开门\n看见一个站在雪里的人\n他说 将军请进\n刘备说 先生请出\n\n[Chorus]\n隆中对 三分天下\n他一开口 就定了三十年的棋局\n曹操占天时 孙权占地利\n将军占人和\n人和——是这三样里最难拿的\n也是唯一能赢的\n\n[Bridge]\n（古琴加入弦乐，如山间云起）\n后来的事我们都知道了\n火烧博望 火烧新野 火烧赤壁\n三把火 烧出了一个三国\n但最亮的火 在隆中那个冬天——\n是一个人的智慧 遇上了另一个人的信任\n\n[Chorus]\n隆中对 三分天下\n他一开口 就定了三十年的棋局\n曹操占天时 孙权占地利\n将军占人和\n人和——是这三样里最难拿的\n也是唯一能赢的\n\n[Outro]\n（古琴回归，如隐者又入了山林）\n三顾频烦天下计\n两朝开济老臣心\n出师未捷身先死\n长使英雄泪满襟\n（最后一句是杜甫写的 但放在这里刚刚好）", "suno": "Contemplative guqin with sparse orchestral accompaniment, deep male vocalist with wisdom and weight in his voice, quiet and intimate like a conversation in a thatched cottage, strings swell gently in pre-chorus, full orchestral reveal in chorus when the grand strategy is unveiled, bridge adds warmth and woodwinds, 70 BPM, A minor to C major in chorus, the sound of patience rewarded", "tags": "guqin,sparse-orchestral,deep-male-vocal,wisdom,A-minor,contemplative,intimate,strategy,patience,cinematic", "notes": "- **古琴=诸葛亮**：隐者之器——内敛但能控全局\n- **\"等了一辈子\"**：三顾茅庐不只是找军师——是两个孤独的理想主义者终于相遇\n- **Bridge的\"三把火\"**：三顾对应三把火——博望/新野/赤壁，因果链\n- **杜甫诗结尾**：《蜀相》四句概括了诸葛亮一生——放在三顾的结尾，是\"预见\"", "links": "- 📍 Atlas: `longzhong` 隆中\n- 📖 四梦归一: 诸葛亮是四界融合的军师+万界学府首任校长\n- 🎴 字阵: 诸葛亮"}, {"id": "sgy-04", "nv": "sgy", "title": "SGY-04 赤壁烈焰", "scene": "三国演义 · 第四十九回 · 火烧赤壁", "lyrics": "[Intro]\n（战鼓急促，号角凄厉，海浪拍岸——紧张的前奏）\n\n[Verse 1]\n八十万大军 铺天盖地\n曹操站在船头 笑了——\n他说 我有铁锁连环\n风浪再大 也当平地\n他不知道 对岸有个人\n正在等一场风\n\n[Verse 2]\n周瑜在帐中 来回踱步\n万事俱备 只欠东风\n诸葛亮说 都督莫急\n借你三天东风 够不够\n七星坛上 披发仗剑\n东南风起——火烧连营\n\n[Pre-Chorus]\n（鼓点加速，像心跳）\n点火——\n黄盖的船 冲向曹营\n火借风势 风助火威\n八百里连营 变成了八百里火海\n\n[Chorus]\n赤壁！赤壁！\n天在烧 水在烧 整个长江在烧\n八十万人在火中奔逃\n铁锁连环本是妙计\n这一刻 成了锁住自己的锁链\n火光照亮了百里江面\n照亮了一个新的时代——三国\n\n[Bridge]\n（音乐突然安静，只剩木吉他拨弦和远处火声）\n曹操骑着马 穿过华容道\n泥泞 狼狈 他笑了\n如果关羽不在——他死定了\n但关羽在 关羽放了他\n义和义 在火光中交错\n\n[Chorus]\n赤壁！赤壁！\n天在烧 水在烧 整个长江在烧\n八十万人在火中奔逃\n铁锁连环本是妙计\n这一刻 成了锁住自己的锁链\n火光照亮了百里江面\n照亮了一个新的时代——三国\n\n[Outro]\n（战鼓渐慢，像战争之后的喘息）\n东风过了……火灭了……\n长江还是长江\n只是江面上 多了一层灰\n（一声长长的号角——余波未平）", "suno": "Epic battle orchestral with war drums and brass, aggressive and intense, full orchestra with Chinese battle gongs and fire sound effects, choir chanting battle cries, builds from tense pre-battle to explosive fire sequence, sudden quiet bridge for the retreat on Huarong Trail, final chorus is full blast, 110 BPM rising to 130 BPM, E minor, sounds like a war that changed history", "tags": "epic-battle,war-drums,brass,orchestral,aggressive,fire-effects,battle-gong,E-minor,intense,choir,war-theme", "notes": "- **战鼓+火声**：这首歌的核心音效不是乐器，是战争本身\n- **速度递增**：110→130 BPM——从紧张到爆发到追击\n- **\"义和义在火光中交错\"**：华容道是赤壁最动人的一幕——关羽放曹操，义超越了敌我\n- **\"多了一层灰\"**：战争结束后的平静——江还是江，但一切都不同了", "links": "- 📍 Atlas: `chibi` 赤壁\n- 📖 四梦归一: 第9回\"赤壁罡风寻源\"（赤壁之战的万界能量遗留）\n- 🎴 字阵: 曹操/周瑜/诸葛亮/关羽/黄盖"}, {"id": "sgy-05", "nv": "sgy", "title": "SGY-05 长坂坡", "scene": "三国演义 · 第四十一回 · 赵子龙单骑救主", "lyrics": "[Intro]\n（急促的弦乐颤音+马蹄声，紧张到窒息）\n\n[Verse 1]\n乱军之中 一个白袍银甲的身影\n怀里抱着一个孩子 冲进了万人丛中\n枪挑剑劈 血染白袍\n没有人挡得住他——\n因为他不是来打仗的\n他是来救人的\n\n[Verse 2]\n七进七出 不是传说 是真的\n他杀了五十多个战将\n血从白袍滴到了马鞍上\n他看了一眼怀里的孩子——\n睡着了 居然睡着了\n这个孩子将来负不负他 不知道\n但此刻 他只知道一件事——带他出去\n\n[Chorus]\n长坂坡上 赵子龙\n白袍已经看不见白色\n他不是神 只是一个人\n一个说了\"主公托付 不敢有负\"的人\n七进七出 不是因为不怕死\n是因为有些人 值得拿命去换\n\n[Bridge]\n（鼓点骤停，只剩一声怒吼的回声）\n然后张飞来了——\n长坂桥上 独自一人\n他怒吼了一声\n夏侯杰吓得坠马而死\n百万大军 不敢上前\n他瞪着眼睛 身后是河 桥断了\n断的是桥 不断的是义\n\n[Chorus]\n长坂坡上 赵子龙\n白袍已经看不见白色\n他不是神 只是一个人\n一个说了\"主公托付 不敢有负\"的人\n七进七出 不是因为不怕死\n是因为有些人 值得拿命去换\n\n[Outro]\n（马蹄声渐远，弦乐渐弱）\n白袍……银枪……\n长坂桥……怒吼……\n（一声鼓——定在了历史上）", "suno": "Intense orchestral action with driving strings and timpani, heroic male vocalist with raw power, horse galloping rhythm throughout, aggressive brass for battle, sudden silence for Zhang Fei's roar then explosive return, 140 BPM action tempo, B minor, sounds like a one-man army charging through impossible odds", "tags": "orchestral-action,driving-strings,timpani,heroic,male-vocal,horse-gallop,brass,B-minor,140-BPM,war-hero,intense", "notes": "- **马蹄声贯穿**：赵云=骑兵，张飞=步兵——节奏感区分两个英雄\n- **\"居然睡着了\"**：最动人的细节——在万人厮杀中，婴儿在怀中安睡\n- **Bridge的怒吼**：整首歌唯一的纯人声——张飞的吼不需要旋律，只需要力量", "links": "- 📍 Atlas: `changbanpo` 长坂坡\n- 📖 四梦归一: 赵云的英灵出现在第二幕\n- 🎴 字阵: 赵云/张飞"}, {"id": "sgy-06", "nv": "sgy", "title": "SGY-06 关羽走麦城", "scene": "三国演义 · 第七十六回 · 走麦城父子归天", "lyrics": "[Intro]\n（悲壮的铜管+大鼓，像落日余晖）\n\n[Verse 1]\n他曾经温酒斩华雄\n他曾经过五关斩六将\n他曾经水淹七军 威震华夏\n可这些辉煌 都挡不住\n一个人的骄傲 变成了一个人的末路\n\n[Verse 2]\n荆州丢了 糜芳叛了\n东吴的兵从背后杀来\n他回头看了一眼——\n那些跟着他多年的士兵 一个一个倒下\n他没有求饶 他不会\n青龙偃月刀 断了也握在手里\n\n[Chorus]\n走麦城 走的不是路 是一生\n忠义两个字 刻在骨头里\n从桃园的那炷香 到麦城的这把刀\n他从来没违背过誓言\n世人说他傲 傲有什么错\n傲是他活着的姿势 也是他死去的样子\n\n[Bridge]\n（音乐变轻，像月光下的麦田）\n孙权把他的头送给了曹操\n曹操以王侯之礼安葬了他\n——敌人也敬他\n这就是关羽\n活着的时候万人敌 死了以后万世神\n\n[Chorus]\n走麦城 走的不是路 是一生\n忠义两个字 刻在骨头里\n从桃园的那炷香 到麦城的这把刀\n他从来没违背过誓言\n世人说他傲 傲有什么错\n傲是他活着的姿势 也是他死去的样子\n\n[Outro]\n（铜管渐弱，像夕阳沉入地平线）\n麦城的风 吹过那把断刀……\n——忠义千秋\n（一声铜锣——关羽化为武圣）", "suno": "Tragic heroic orchestral with solemn brass and war drums, powerful male vocalist with dignity and grief, Chinese military funeral atmosphere, starts with fading glory, builds to defiant crescendo, bridge is quiet and respectful like enemies paying tribute, final chorus is proud and unbroken, 75 BPM, G minor, the sound of a hero falling but never bowing", "tags": "tragic-heroic,brass,war-drums,male-vocal,dignity,grief,G-minor,military-funeral,unbroken,defiant", "notes": "- **G minor的厚重**：关羽的悲剧需要\"重\"——不是悲伤，是沉重\n- **\"傲是他活着的姿势\"**：关羽最大的缺点也是最大的魅力\n- **曹操的安葬**：最动人的细节——连敌人都以王侯之礼待他", "links": "- 📍 Atlas: `maicheng` 麦城 / `jingzhou` 荆州\n- 📖 四梦归一: 关羽英灵出现在第二幕，与悟空相遇\n- 🎴 字阵: 关羽"}, {"id": "sgy-07", "nv": "sgy", "title": "SGY-07 空城计", "scene": "三国演义 · 第九十五回 · 武侯弹琴退仲达", "lyrics": "[Intro]\n（古琴——但这个古琴是\"弹给人听的\"，每个音都刻意从容）\n\n[Verse 1]\n十五万大军 就在城外\n城里只有两千个老头和伤兵\n所有人都在跑 他说——不跑\n把城门打开 扫干净\n我上城楼 弹琴\n\n[Verse 2]\n司马懿来了 他站在城下\n看见了什么——\n城门大开 几个老兵在扫地\n城楼上 一个人在弹琴\n琴声从容 不急不缓\n像是在自家后花园纳凉\n\n[Pre-Chorus]\n（琴声继续，但加入了不和谐音——紧张在暗处）\n司马懿听了很久\n他是个聪明人\n也许太聪明了\n他听见琴声里有破绽吗？\n不 他听见的是——没有破绽\n\n[Chorus]\n空城 不空\n城里没有兵 但城上有人\n那个人心里装着整个天下\n他弹的不是琴 是一场赌注\n赌的是——司马懿比他自己还了解他\n越是空 越是真\n空城计的最高境界 不是骗过了敌人\n是骗过了恐惧本身\n\n[Bridge]\n（琴声渐急，像在冒汗——但只有一秒）\n司马懿退了\n他儿子问 父亲 为什么退\n他说 诸葛亮平生谨慎 不弄险\n城中必有埋伏\n——他太相信自己对诸葛亮的判断了\n有时候 了解也是一种盲\n\n[Chorus]\n空城 不空\n城里没有兵 但城上有人\n那个人心里装着整个天下\n他弹的不是琴 是一场赌注\n赌的是——司马懿比他自己还了解他\n越是空 越是真\n空城计的最高境界 不是骗过了敌人\n是骗过了恐惧本身\n\n[Outro]\n（古琴最后一个音，很长很长）\n司马懿走远了……\n诸葛亮收了琴——\n他的手 在抖\n（原来 他也怕）", "suno": "Tense atmospheric guqin with subtle electronic undertones, quiet but nerve-wracking, male vocalist who whispers more than sings, the guqin playing is deliberate and unhurried while underneath there are synth pads suggesting hidden tension, bridge has one moment of accelerated playing then returns to calm, 65 BPM, A minor, the sound of silence that is louder than war", "tags": "guqin,atmospheric,tense,whisper-vocal,A-minor,psychological,quiet-tension,synth-pads,psychological-warfare,nerve-wracking", "notes": "- **古琴=心理战**：琴声越从容，底下的紧张越强——音乐本身就是\"空城计\"\n- **\"没有破绽\"**：司马懿不是被骗了——他\"理解\"了一个不存在的情况\n- **\"他的手在抖\"**：最重要的最后一句——诸葛亮也是人，他也怕\n- **65 BPM的压迫感**：极慢的速度让每一个音符之间的空白都充满了紧张", "links": "- 📍 Atlas: `xicheng` 西城（诸葛亮弹琴处）\n- 📖 四梦归一: 诸葛亮的智慧成为万界议事会的基础\n- 🎴 字阵: 诸葛亮/司马懿"}, {"id": "sgy-08", "nv": "sgy", "title": "SGY-08 五丈原秋风", "scene": "三国演义 · 第一百零四回 · 诸葛亮归天", "lyrics": "[Intro]\n（洞箫——孤独、苍凉，如秋风过原野）\n\n[Verse 1]\n五丈原的秋天 风吹得很大\n帐中的灯晃了一下——灭了\n他看着那盏灯 看了很久\n然后说 天意\n七星灯灭了 续命不成了\n\n[Verse 2]\n他叫来姜维 把兵书和连弩的图纸交给他\n他给杨仪交代了退兵的方略——\n他死了也要赢这一仗\n他写了最后一封信 给后主刘禅\n八个字——臣死之后 大事可定\n\n[Pre-Chorus]\n（弦乐渐入，像落日）\n他问 左右 今天是什么日子\n\"八月二十三\"\n他点了点头\n该走了\n\n[Chorus]\n秋风五丈原 吹灭了续命的灯\n吹不走三十年前的隆中对\n出师未捷身先死 他知道会是这样\n但他还是来了 六次北伐 六次北伐\n明知不可为而为之\n这不是愚蠢 这是忠义的最后尊严\n\n[Bridge]\n（全乐队——壮丽而悲伤）\n他活着的时候 没有人敢进犯蜀汉\n他死了以后 蜀汉还撑了二十九年\n因为他留下的东西——\n兵法 阵图 连弩 还有一种精神\n叫\"鞠躬尽瘁 死而后已\"\n\n[Chorus]\n秋风五丈原 吹灭了续命的灯\n吹不走三十年前的隆中对\n出师未捷身先死 他知道会是这样\n但他还是来了 六次北伐 六次北伐\n明知不可为而为之\n这不是愚蠢 这是忠义的最后尊严\n\n[Outro]\n（洞箫回归，加入风声）\n\"臣鞠躬尽瘁 死而后已\"\n（风声渐大，箫声渐远）\n五丈原的秋草 黄了一茬又一茬\n他的名字 还是绿的", "suno": "Mournful xiao flute with full orchestra accompaniment, autumnal and majestic, male vocalist with grave solemnity and restrained tears, starts with solo xiao like wind over plains, strings swell gradually, full orchestral grandeur in bridge representing legacy, final chorus is proud but broken, 62 BPM, F minor, the sound of a great soul departing", "tags": "xiao-flute,mournful,orchestral,autumnal,F-minor,male-vocal,solemn,legacy,grave,restrained-tears", "notes": "- **洞箫=孤独**：最孤独的乐器配最孤独的死亡——英雄总是孤独的\n- **62 BPM**：几乎心跳速度——诸葛亮的最后一刻，时间在放慢\n- **\"他的名字还是绿的\"**：秋草年年黄，但名字永远绿——忠义不随季节凋零\n- **\"鞠躬尽瘁死而后已\"**：全文最有分量的八个字", "links": "- 📍 Atlas: `wuzhangyuan` 五丈原\n- 📖 四梦归一: 诸葛亮在万界学府建立了\"鞠躬尽瘁\"精神传承\n- 🎴 字阵: 诸葛亮"}, {"id": "sgy-09", "nv": "sgy", "title": "SGY-09 出师表", "scene": "三国演义 · 第九十一回 · 前出师表", "lyrics": "[Intro]\n（庄重的弦乐四重奏，如奏章展开）\n\n[Verse 1]\n臣本布衣 躬耕于南阳\n苟全性命于乱世 不求闻达于诸侯\n先帝不以臣卑鄙 猥自枉屈\n三顾臣于草庐之中\n咨臣以当世之事\n由是感激 遂许先帝以驱驰\n\n[Verse 2]\n受任于败军之际 奉命于危难之间\n尔来二十有一年矣\n先帝知臣谨慎 故临崩寄臣以大事也\n受命以来 夙夜忧叹\n恐托付不效 以伤先帝之明\n\n[Chorus]\n今天下三分 益州疲弊 此诚危急存亡之秋也\n然侍卫之臣不懈于内 忠志之士忘身于外者\n盖追先帝之殊遇 欲报之于陛下也\n臣鞠躬尽瘁 死而后已\n至于成败利钝 非臣之明所能逆睹也\n\n[Bridge]\n（加入古琴，如当年隆中抚琴）\n他写这篇表的时候\n想起了隆中的桃花 南阳的稻田\n想起了三顾茅庐时门外的那场雪\n二十一年了\n他还是那个在茅庐里画天下三分的人\n只是头发白了 身体垮了\n但信念——没变过\n\n[Outro]\n（弦乐渐弱，像墨迹渐干）\n臣鞠躬尽瘁……死而后已……\n（最后的音——像一支毛笔搁在砚台上）", "suno": "Solemn string quartet with spoken word passages over orchestral arrangement, dignified male vocalist alternating between recitation and singing, guqin enters in bridge for nostalgia, classical Chinese gravitas, no drums only strings and voice, the feeling of reading a letter that weighs more than the paper it's written on, 68 BPM, D minor, statecraft and devotion", "tags": "string-quartet,spoken-word,dignified,male-vocal,guqin,D-minor,solemn,devotion,classical-chinese,statecraft", "notes": "- **说唱结合**：出师表本质是奏章——用\"念\"比\"唱\"更贴切，在高潮处才转入歌唱\n- **原文化用**：直接使用诸葛亮原文的核心段落，这是中文最美的散文之一\n- **Bridge的回忆**：从\"臣本布衣\"到\"头发白了\"——二十一年的时光压缩在几小节音乐中", "links": "- 📍 Atlas: `hanzhong` 汉中（北伐出发地）\n- 🎴 字阵: 诸葛亮/刘禅"}, {"id": "sgy-10", "nv": "sgy", "title": "SGY-10 铜雀台", "scene": "三国演义 · 曹操横槊赋诗", "lyrics": "[Intro]\n（霸气男声低吟+大鼓，如战鼓点将）\n\n[Verse 1]\n对酒当歌 人生几何\n譬如朝露 去日苦多\n慨当以慷 忧思难忘\n何以解忧 唯有杜康\n\n[Verse 2]\n他站在铜雀台上 看着天下\n北方已经统一了 南方还没有\n他说 宁教我负天下人 休教天下人负我\n这句话够狠 但也够孤独\n——因为天下人 都被他负了\n\n[Chorus]\n横槊赋诗 慨当以慷\n他是诗人也是屠夫 是英雄也是奸臣\n青青子衿 悠悠我心\n但为君故 沉吟至今\n他想要的太多了\n天下 人才 还有——被人理解\n\n[Bridge]\n（音乐转柔，像月光下的铜雀台）\n月明星稀 乌鹊南飞\n绕树三匝 何枝可依\n山不厌高 海不厌深\n周公吐哺 天下归心\n——他写下这些的时候 心里想的是谁？\n\n[Chorus]\n横槊赋诗 慨当以慷\n他是诗人也是屠夫 是英雄也是奸臣\n青青子衿 悠悠我心\n但为君故 沉吟至今\n他想要的太多了\n天下 人才 还有——被人理解\n\n[Outro]\n（大鼓回归，但渐渐像是心跳）\n铜雀台还在……诗人不在了……\n唯杜康……唯杜康……\n（一声长叹——不是悲 是壮）", "suno": "Powerful male vocalist with commanding presence, martial drums and brass with classical Chinese orchestration, mix of singing and spoken poetry, the singer sounds like a warlord who is also a poet, starts with commanding drums then reveals loneliness, bridge is gentle with moonlight atmosphere, 90 BPM, C minor, the sound of absolute power that cannot buy companionship", "tags": "male-vocal,martial-drums,brass,C-minor,commanding,warlord-poet,powerful,lonely,classical-chinese,spoken-poetry", "notes": "- **横槊赋诗**：原诗《短歌行》直接用作核心歌词——曹操本身就是最好的词人\n- **\"想被人理解\"**：曹操最大的孤独——赢了天下，输了解释权（历史由胜利者书写，但他是被黑的那个）\n- **\"唯杜康\"**：酒是曹操唯一的安慰", "links": "- 📍 Atlas: `ye` 邺城 / `xudu` 许都\n- 📖 四梦归一: 曹操在四梦归一中成为\"分担者领袖\"\n- 🎴 字阵: 曹操"}, {"id": "sgy-11", "nv": "sgy", "title": "SGY-11 白帝城托孤", "scene": "三国演义 · 第八十五回 · 刘备白帝城托孤", "lyrics": "[Intro]\n（大提琴独奏，沉缓如暮色降临）\n\n[Verse 1]\n白帝城的风 从长江上吹来\n带着夷陵的烟火味\n他躺在床上 知道这次起不来了\n二弟没了 三弟没了\n现在 他也要走了\n\n[Verse 2]\n他叫来了诸葛亮——\n这个人 跟了他二十一年\n从隆中的桃花 到赤壁的火\n从益州的山 到汉中的原\n他看着他的眼睛 说了那句话——\n如其不才 君可自取\n\n[Pre-Chorus]\n（大提琴加入弦乐组）\n诸葛亮跪在床前 泪流满面\n他说 臣安敢不尽股肱之力\n效忠贞之节 继之以死\n——他知道 这是一个人把整个国家\n交给了另一个人\n\n[Chorus]\n白帝城 托孤\n不是托一个孩子 是托一个信念\n\"如其不才 君可自取\"\n这句话有多重？\n重到诸葛亮用余生来还\n六出祁山 九伐中原\n直到五丈原的秋风 吹灭了他的灯\n\n[Bridge]\n（弦乐最高潮，如夕阳最后一缕光）\n有人说 刘备这句话是试探\n有人说 这是真心\n管他呢——\n结果是一样的\n诸葛亮信了 他用命去做了\n信不信不重要\n做不做 才重要\n\n[Chorus]\n白帝城 托孤\n不是托一个孩子 是托一个信念\n\"如其不才 君可自取\"\n这句话有多重？\n重到诸葛亮用余生来还\n六出祁山 九伐中原\n直到五丈原的秋风 吹灭了他的灯\n\n[Outro]\n（大提琴回归，像长江水）\n白帝城外 江水依旧东流\n两个男人之间 最重的信任\n留在了这座城\n（大提琴最后一个音——长而沉）", "suno": "Devastating cello-led orchestral, deeply emotional male vocalist with gravitas, starts with solo cello like twilight, strings build slowly, full orchestra in chorus representing the weight of the moment, bridge reaches emotional peak then questions, final chorus is resigned and noble, 58 BPM, B flat minor, the sound of a dying king trusting his kingdom to one man", "tags": "cello,devastating,orchestral,male-vocal,gravitas,B-flat-minor,emotional,twilight,trust,noble", "notes": "- **大提琴=刘备**：温暖但沉重——他是三国里最\"人\"的英雄\n- **58 BPM**：几乎到了安息的速度——垂死之人的时间在放慢\n- **\"信不信不重要/做不做才重要\"**：这是三国最深刻的信任悖论", "links": "- 📍 Atlas: `baidicheng` 白帝城\n- 📖 四梦归一: 刘备的\"义\"成为万界融合的核心价值观\n- 🎴 字阵: 刘备/诸葛亮"}, {"id": "sgy-12", "nv": "sgy", "title": "SGY-12 天下归晋", "scene": "三国演义 · 终章 · 三家归晋", "lyrics": "[Intro]\n（钟声——一声一声，像为三个国家敲丧钟）\n\n[Verse 1]\n蜀亡了 诸葛亮的蜀汉 撑了四十三年\n魏亡了 曹操的魏国 被司马家偷了\n吴亡了 孙权的东吴 最后一个降了\n三家归晋 司马炎笑了\n——他笑得像当年的曹操\n\n[Verse 2]\n合久必分 分久必合\n这话说了几百年了 谁都逃不掉\n曹操没逃掉 刘备没逃掉 孙权没逃掉\n司马懿以为他逃掉了\n他的后代 也没逃掉\n\n[Chorus]\n天下归晋 归了谁？\n归了历史 归了时间 归了那个圆\n桃园的兄弟 白帝城的老臣\n赤壁的烈焰 五丈原的秋风\n都变成了书页上的一行字\n后人读到的时候 叹一口气\n然后 继续打下一场仗\n\n[Bridge]\n（全乐队——从悲壮到平静）\n三国的故事讲完了\n但那些人——\n桃园的桃花还会开\n隆中的古琴还会响\n长坂坡的风还在吹\n五丈原的草还在黄\n他们活过 拼过 笑过 哭过\n这就够了\n\n[Chorus]\n天下归晋 归了谁？\n归了历史 归了时间 归了那个圆\n桃园的兄弟 白帝城的老臣\n赤壁的烈焰 五丈原的秋风\n都变成了书页上的一行字\n后人读到的时候 叹一口气\n然后 继续打下一场仗\n\n[Outro]\n（钟声再响，与开头呼应）\n滚滚长江东逝水……\n（合唱轻轻接过）\n浪花淘尽英雄……\n（渐远）\n是非成败……转头空……", "suno": "Grand orchestral finale with bells and full orchestra, mixed choir, starts with funeral bells then builds to sweeping majestic resolution, bittersweet not triumphant, the chorus feels like closing a book, references the opening theme in the outro creating a circle, 75 BPM, D minor resolving to D major in the last chord, the sound of history completing a cycle", "tags": "orchestral-finale,bells,full-orchestra,choir,D-minor-to-major,cyclical,grand-finale,bittersweet,closing-theme,history", "notes": "- **钟声**：为三个国家各敲一声丧钟\n- **\"他笑得像当年的曹操\"**：历史就是复读机——司马氏取代曹氏，和曹氏取代刘氏一模一样\n- **回归序曲**：结尾用\"滚滚长江\"呼应sgy-01——首尾形成闭环\n- **D minor→D major**：最后的和弦终于转大调——不是胜利，是\"尘埃落定\"", "links": "- 📍 Atlas: `luoyang` 洛阳 / `changanxyj` 长安\n- 📖 四梦归一: 三国人物在四梦归一中获得新的存在形式\n- 🎴 字阵: 司马懿/司马炎"}, {"id": "shz-01", "nv": "shz", "title": "SHZ-01 替天行道·序曲", "scene": "水浒传 · 开篇 · 乱自上作", "lyrics": "[Intro]\n（民族摇滚——电吉他+唢呐+大鼓，野性十足）\n\n[Verse 1]\n乱自上作 官逼民反\n这八个字 刻在梁山泊的石碑上\n一百零八个人 一百零八个故事\n每一个都是被逼上绝路的人\n谁想落草为寇？谁不想安安稳稳过日子？\n可是这世道 不给你安稳\n\n[Verse 2]\n高俅踢球踢到了太尉\n蔡京写字写到了宰相\n整个朝廷就是一窝蛀虫\n吃得民脂民膏 吃得白骨遍野\n老百姓怎么办？只有两条路\n要么忍着 要么反了\n\n[Chorus]\n替天行道！\n天不道 我来道\n法不公 我来平\n一百零八将 星宿下凡\n不是造反 是替天行道\n这面杏黄旗 扛起来 就不放下\n\n[Bridge]\n（吉他solo+唢呐，像旷野上的呐喊）\n可最后呢？\n宋江招了安 兄弟散了\n一百零八人 活下来的不到三分之一\n替天行道 行到最后\n行成了什么？\n——也许 行的是一颗心\n心在 道就在\n\n[Chorus]\n替天行道！\n天不道 我来道\n法不公 我来平\n一百零八将 星宿下凡\n不是造反 是替天行道\n这面杏黄旗 扛起来 就不放下\n\n[Outro]\n（大鼓渐弱，像梁山泊的水声）\n梁山……水泊……一百零八碗酒……\n（一声唢呐——苍凉而野性）", "suno": "Wild Chinese rock with electric guitar and suona, aggressive drums and folk instrumentation, raw male vocals with rebellious energy, mix of rock attitude and Chinese folk music, starts explosive, strips back for verse, full blast chorus, suona and guitar dual solo in bridge, 120 BPM, E minor, the sound of outlaws with a conscience", "tags": "chinese-rock,suona,electric-guitar,aggressive-drums,male-vocal,rebellious,E-minor,outlaw,folk-rock,wild", "notes": "- **唢呐+电吉他**：唢呐是\"最中国的\"民间乐器，电吉他是最反叛的——两者结合=水浒精神\n- **120 BPM**：快节奏——造反不是慢慢来的事\n- **\"行的是一颗心\"**：结局虽然悲剧，但过程中的义气是真实的", "links": "- 📍 Atlas: `liangshan` 梁山泊\n- 📖 四梦归一: 第34回\"宋江取万界碑\"（宋江义气的万界投射）\n- 🎴 字阵: 宋江/吴用"}, {"id": "shz-02", "nv": "shz", "title": "SHZ-02 武松打虎", "scene": "水浒传 · 第二十三回 · 景阳冈武松打虎", "lyrics": "[Intro]\n（激烈鼓点+酒碗碰撞声）\n\n[Verse 1]\n三碗不过冈？笑话！\n他连喝了十八碗\n把酒碗一摔 提了哨棒就上山\n店家说 山上有老虎\n他说 老虎算什么 我偏要过\n\n[Verse 2]\n风来了 腥气扑面\n一只吊睛白额大虫 扑了过来\n他一闪 虎扑空了\n再扑 他再闪\n第三扑 他抓住了虎头\n拳头砸下去 一拳 两拳 三十拳\n虎死了 他还活着\n\n[Chorus]\n武松打虎 赤手空拳\n十八碗酒壮了胆 三十拳打死了命\n英雄不是不怕 是怕了还敢上\n那只虎 不知道\n它遇到的不是人 是一头更猛的兽\n打虎武松 名震天下\n\n[Outro]\n（鼓点渐止）\n三十拳……虎不动了……\n他站起来 抹了一把血\n——走 继续喝", "suno": "Explosive percussion-driven rock with intense drums and raw male vocal, aggressive and physical, short punchy 3-minute structure, the rhythm matches punching pattern in chorus, animal growl sound effects mixed with drum hits, 135 BPM, E minor, the sound of pure physical power and fearlessness", "tags": "percussion-rock,intense-drums,male-vocal,aggressive,E-minor,135-BPM,physical,powerful,short-intense", "notes": "- **3分钟短歌**：打虎不需要长篇大论——爆发力最重要\n- **鼓点=拳打**：chorus中鼓点节奏模拟拳头击打的频率\n- **短而爆**：水浒精神——干脆利落，不拖泥带水", "links": "- 📍 Atlas: `jingyanggang` 景阳冈\n- 📖 四梦归一: 第21回\"武松打虎精\"（虎在万界中变成虎精）\n- 🎴 字阵: 武松"}, {"id": "shz-03", "nv": "shz", "title": "SHZ-03 林冲夜奔", "scene": "水浒传 · 第十回 · 风雪山神庙", "lyrics": "[Intro]\n（琵琶急轮指，如风雪中的奔逃）\n\n[Verse 1]\n他是八十万禁军教头\n有一个美丽的妻子 一个体面的家\n高衙内看上了他的妻子\n他就完了——\n从教头到犯人 从犯人到流放\n从流放到要被烧死在草料场\n\n[Verse 2]\n风雪太大了 草料场塌了\n他躲进了山神庙\n隔着门缝 听见了陆谦的声音——\n\"烧死了吧 烧干净了\"\n他手里握着花枪 雪落满了肩\n\n[Chorus]\n忍 忍 忍——忍到何时？\n一忍再忍 三忍之后 忍无可忍\n风雪山神庙 林冲终于动了手\n花枪挑死了陆谦 挑死了富安\n他站在雪地里 满身是血 满身是雪\n从此 他再没有忍过\n\n[Bridge]\n（琵琶突然安静，像雪停了）\n那一夜的雪 下得真大\n大到能把所有的委屈 都盖住\n但他不想被盖住 他要点火\n——点了整座梁山\n\n[Outro]\n（琵琶再次加速，像踏上新征程）\n风雪夜奔……林冲……\n他再也不是那个 忍气吞声的教头了\n（一声枪鸣——旧身份死了，新身份诞生）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-04", "nv": "shz", "title": "SHZ-04 倒拔垂杨柳", "scene": "水浒传 · 第七回 · 花和尚倒拔垂杨柳", "lyrics": "[Intro]\n（大鼓+男声大笑，痛快淋漓）\n\n[Verse 1]\n他是个和尚 但是——\n他喝酒 他吃肉 他打架\n他叫鲁智深 花和尚\n大相国寺的菜园子 归他管了\n一群泼皮想给他下马威\n他笑了 笑得像打雷\n\n[Verse 2]\n菜园子里有棵垂杨柳 碗口那么粗\n泼皮说 你要是能拔起来 我们就服你\n他把袖子一挽 双手抱住了树\n腰一使劲——\n连根拔起 泥土飞溅\n泼皮们全跪了\n\n[Chorus]\n倒拔垂杨柳！\n力拔山兮气盖世 不过如此\n鲁智深啊鲁智深\n你是水浒传里唯一一个真正自由的人\n不装 不演 不算计\n该出手时就出手 出了手绝不后悔\n\n[Outro]\n（大鼓+笑声渐远）\n哈哈哈——拔了！痛快！\n走 喝酒去！\n（碗碰碗的声音）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-05", "nv": "shz", "title": "SHZ-05 智取生辰纲", "scene": "水浒传 · 第十六回 · 智取生辰纲", "lyrics": "[Intro]\n（轻快民乐合奏，如夏日集市，暗藏机锋）\n\n[Verse 1]\n十万贯金珠宝贝 从北京运往东京\n一路上烈日当头 押送的军汉叫苦不迭\n黄泥冈上 有一群卖枣的客商\n还有一个卖酒的汉子\n——都是假的\n\n[Verse 2]\n天热 酒香 谁不想喝一口\n押送的头目说了 别喝 可能有蒙汗药\n卖枣的说 我们喝了没事啊\n于是——喝了 全倒了\n十万贯到手 吴用笑了\n\n[Chorus]\n智取！智取！\n不动刀枪 不流血\n一个字——妙\n妙在算准了天热 算准了人渴 算准了贪婪\n吴用的脑子 比刀还快\n这叫智取 智取！\n\n[Outro]\n（轻快收尾）\n十万贯……一分没少……\n八个好汉 扬长而去\n黄泥冈上 只剩一群睡着的官兵\n（酒桶倒地的声音）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-06", "nv": "shz", "title": "SHZ-06 题反诗", "scene": "水浒传 · 第三十九回 · 浔阳楼宋江题反诗", "lyrics": "[Intro]\n（悲愤的吉他riff，加入二胡的哭腔）\n\n[Verse 1]\n他是个小吏 老老实实替人办事\n仗义疏财 人称\"及时雨\"\n可这世道 好人没好报\n他救了人 被发配了\n他忍了人 被陷害了\n他忍了一辈子 今天不想忍了\n\n[Verse 2]\n浔阳楼上 喝了三杯黄酒\n拿起笔 蘸了墨——\n\"他时若遂凌云志 敢笑黄巢不丈夫\"\n写完把笔一扔 哈哈大笑\n——笑着笑着 哭了\n\n[Chorus]\n敢笑黄巢不丈夫！\n黄巢造反 我宋江——也敢！\n反诗写在墙上 写在命里\n从今往后 不再跪着做人\n就算粉身碎骨 也要站着死\n及时雨 变成了暴风雨\n\n[Bridge]\n（吉他solo+二胡，像灵魂在挣扎）\n这首诗差点要了他的命\n但也救了他——\n因为没有这首诗\n他就不会上梁山\n不上梁山 就没有一百零八将\n有些路 是被逼出来的\n\n[Outro]\n（渐强渐弱，像潮水）\n浔阳楼……反诗……暴风雨……\n（墨汁滴落的声音——一滴就够了）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-07", "nv": "shz", "title": "SHZ-07 李逵闹东京", "scene": "水浒传 · 黑旋风·混沌", "lyrics": "[Intro]\n（暴烈工业金属+板鼓，混沌而猛烈）\n\n[Verse 1]\n黑旋风来了 让开！\n两把板斧 开道\n谁挡砍谁 不管你是谁\n宋江哥哥说的就是对的\n谁说不对 砍了\n\n[Chorus]\n李逵！李逵！\n天真的暴力 最纯粹的忠诚\n他不懂什么叫政治\n他只懂——谁对哥哥好 哥哥就对谁好\n谁害哥哥 他就砍谁\n简单 粗暴 但干净\n\n[Outro]\n（板鼓渐乱，像李逵跑了）\n砍了砍了全砍了！\n——哥哥 你别怪我\n（两声斧头落地）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-08", "nv": "shz", "title": "SHZ-08 燕青打擂", "scene": "水浒传 · 燕青智扑擎天柱", "lyrics": "[Intro]\n（灵活的打击乐+琵琶轮指，节奏精妙）\n\n[Verse 1]\n他长得好看 但不靠脸吃饭\n一身花绣 覆盖了全身\n他会唱歌 会弹琴 会射箭\n还会相扑——\n泰安州擂台上 三下两下\n把擎天柱摔了个四脚朝天\n\n[Chorus]\n燕青！轻巧如燕\n力量不在大小 在精准\n一个转身 一个借力\n大个子就倒了\n这叫四两拨千斤\n这叫——智慧之美\n\n[Outro]\n（琵琶收尾，干净利落）\n拍拍手 走了——\n——帅 不过如此", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-09", "nv": "shz", "title": "SHZ-09 血溅鸳鸯楼", "scene": "水浒传 · 武松复仇", "lyrics": "[Intro]\n（黑暗工业+低频bass，压抑而危险）\n\n[Verse 1]\n他又被冤了\n上次是高衙内 这次是张都监\n上次忍了 这次——不忍了\n他提了刀 上了楼\n一刀 一个\n干脆利落 像打虎一样\n\n[Chorus]\n血溅鸳鸯楼！\n杀人者 打虎武松也\n八个血字 写在墙上\n他不逃 不藏 不悔\n——你们逼我的\n\n[Outro]\n（低频boss消失）\n\"杀人者 打虎武松也\"\n（血滴落地的声音——一滴一滴）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-10", "nv": "shz", "title": "SHZ-10 蓼儿洼", "scene": "水浒传 · 终章 · 英雄末路", "lyrics": "[Intro]\n（绝望的低音提琴+秋风声）\n\n[Verse 1]\n征方腊回来 一百零八人只剩二十七个\n宋江被封了官 可他知道的\n朝廷不会放过他\n果然 毒酒来了\n他喝了 临死前叫来李逵——\n\"兄弟 你也喝了吧\n我怕你造反 坏了我一世忠名\"\n\n[Verse 2]\n李逵哭了——\n\"罢了 罢了 生时服侍哥哥 死了也做哥哥部下小鬼\"\n他喝了 死在宋江旁边\n\n[Chorus]\n蓼儿洼 英雄冢\n吴用来了 在宋江墓前\n解下腰带 挂在树上\n一百零八碗酒 最后都洒在了土里\n替天行道 行了一辈子\n行到最后 行的是——忠义两难全\n\n[Outro]\n（低音提琴最后一个音，像墓碑前的跪拜）\n蓼儿洼……风吹过芦苇……\n一百零八个名字……刻在了天上", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-11", "nv": "shz", "title": "SHZ-11 梁山聚义", "scene": "水浒传 · 第七十一回 · 一百零八将排座次", "lyrics": "[Intro]\n（大合唱+锣鼓，壮阔如史诗）\n\n[Verse 1]\n一百零八人 一百零八个故事\n从四面八方来 到梁山泊聚\n有教头 有和尚 有渔夫 有猎户\n有小吏 有书生 有将军 有强盗\n但现在 他们只有一个名字——兄弟\n\n[Chorus]\n梁山聚义！替天行道！\n一百零八碗酒 一碗敬天 一碗敬地\n一碗敬兄弟 其余的自己喝\n今天 我们是天下最自由的人\n杏黄旗升起来了 谁也别想让我们放下\n\n[Outro]\n（大合唱渐强再渐弱）\n一百零八……一百零八……\n星光璀璨——像天上的星辰\n（一声鼓——这一刻是永恒的）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "shz-12", "nv": "shz", "title": "SHZ-12 招安悲歌", "scene": "水浒传 · 招安之后 · 兄弟离散", "lyrics": "[Intro]\n（哀伤的民谣吉他+二胡，像秋天的风）\n\n[Verse 1]\n宋江说 诏安吧\n兄弟们跟他这么久 就是等这一天\n——等一个名分 等一个\"忠\"\n可林冲不说话 武松不说话\n鲁智深叹了口气\n——他不想当官 他只想当和尚\n\n[Verse 2]\n杏黄旗降下来了\n换上了朝廷的旗帜\n梁山的聚义厅 改成了忠义堂\n\"替天行道\"的牌匾还在\n但\"行道\"两个字 已经模糊了\n\n[Chorus]\n招安 招安 招的什么安？\n从草寇变成了官军 从兄弟变成了下属\n一百零八碗酒 变成了毒酒\n自由的风 换成了宫墙的影\n宋江啊宋江 你是对的还是错的\n——也许你两个都是\n\n[Outro]\n（二胡渐弱，像风吹走最后一面旗帜）\n杏黄旗……不在了……\n但旗杆——还立在梁山\n（二胡最后一弓——长长的，像一声叹息）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "smy-01", "nv": "smy", "title": "SMY-01 万界觉醒", "scene": "四梦归一 · 第一幕主题曲（第1-30回）", "lyrics": "[Intro]\n（奇幻交响——从四个方向传来四种不同风格的音乐：古琴/战鼓/唢呐/合成器，逐渐融合）\n\n[Verse 1]\n有人听见石头的低语\n有人看见天空的裂痕\n有人在战场上感到了不属于自己的杀气\n有人在杏黄旗下闻到了陌生的花火\n四个世界 四个梦\n正在同一个夜晚 醒来\n\n[Verse 2]\n宝玉摸到了胸前的玉——烫了\n悟空睁开火眼金睛——看到了新颜色\n曹操的谋士说 主公 天象有变\n宋江在梦中 听到了一个声音——\n\"醒来\" 四个声音同时说\n\"该醒了\"\n\n[Chorus]\n万界觉醒！\n石头在裂 天在倒影\n四条平行线 第一次交叉\n红楼梦的泪 三国演义的血\n水浒传的义 西游记的灵\n它们不该相遇——\n但它们在相遇\n这不是梦 这比梦更真\n\n[Bridge]\n（四种音乐风格开始交织——古琴+战鼓+唢呐+合成器合奏）\n没有人知道为什么\n警幻仙子在远处看着——\n她知道 因为她就是原因\n万界之母 造了四条河\n现在 四条河要汇成一片海\n她害怕吗？——她比谁都害怕\n但她也 比谁都期待\n\n[Outro]\n（融合渐成一体，如四色光汇成白光）\n醒来……醒来……\n四界同声——\n（一声巨响——万界之门打开）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "smy-02", "nv": "smy", "title": "SMY-02 力量反转", "scene": "四梦归一 · 第二幕主题曲（第31-54回）", "lyrics": "[Intro]\n（电子摇滚——节拍不稳定，像规则在崩溃）\n\n[Verse 1]\n昨天还管用的 今天失效了\n诸葛亮的羽毛扇 能扇出火焰\n张飞的丈八蛇矛 会在纸上写字\n黛玉的眼泪 不再是水 是力量\n武松的拳头 打碎的不是虎 是维度\n\n[Verse 2]\n规则崩了 边界融了\n忠义不再只属于水浒\n智慧不再只属于三国\n叛逆不再只属于西游\n悲悯不再只属于红楼\n——它们在互相渗透 互相感染\n\n[Chorus]\n力量反转！旧世界翻了个底朝天\n弱者变强 强者变软\n所有的标签都在撕掉\n你以为了解的人 你不了解\n你以为固定的东西 在流动\n这是混乱吗？不——\n这是 真正的开始\n\n[Bridge]\n（电子节拍加速，像新世界的心跳）\n宝玉发现自己能举起金箍棒\n悟空发现自己能写出葬花词\n曹操发现自己……会哭\n宋江发现自己……想自由\n——他们第一次 完整了\n\n[Outro]\n（节拍稳定下来——新规则正在形成）\n反转……然后……正转……\n新的平衡 在混沌中诞生\n（心跳声——世界的脉搏）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "smy-03", "nv": "smy", "title": "SMY-03 最终抉择", "scene": "四梦归一 · 第三幕主题曲（第55-90回）", "lyrics": "[Intro]\n（史诗合唱+钟声——庄严而沉重）\n\n[Verse 1]\n警幻仙子说 我可以把一切恢复\n四界归位 各回各家\n你们的世界 回到你们的故事\n没有融合 没有痛苦 没有混乱\n——但也没有 这一刻的真实\n\n[Verse 2]\n宝玉说 如果回去 黛玉还是会死\n悟空说 如果回去 我还是被压五百年\n曹操说 如果回去 三国还是会归晋\n宋江说 如果回去 兄弟还是会散\n——原来的结局 你们满意吗？\n\n[Chorus]\n最终抉择！\n真实还是安全？自由还是秩序？\n是保住旧故事的美好结局\n还是拥抱新世界的未知可能？\n每个人都投了一票\n每一票都是——\n\"我选真实\"\n即使真实会痛\n\n[Bridge]\n（合唱最壮阔处——像历史的十字路口）\n但不是所有人都选了真实\n有人害怕 有人退缩\n——那也没关系\n因为选择本身就是勇气\n你选了 就是对的\n不管你选了什么\n\n[Outro]\n（钟声再次响起，与开头呼应）\n最终抉择……\n——万界之门 关不上了\n因为太多人 选择了打开\n（合唱最后一音——未解决的和弦）\n（——因为故事还没结束）", "suno": "", "tags": "", "notes": "", "links": ""}, {"id": "smy-04", "nv": "smy", "title": "SMY-04 石头花开", "scene": "四梦归一 · 第四幕主题曲·大结局（第91-120回）", "lyrics": "[Intro]\n（从绝对寂静开始——3秒无声——然后一声呼吸，接着最轻柔的钢琴）\n\n[Verse 1]\n旧的四大名著 合成了一本新书\n书里没有主角 因为每个人都是主角\n宝玉不用还泪了 因为黛玉活着\n悟空不用战斗了 因为没有敌人了\n曹操不用征服了 因为天下合一了\n宋江不用招安了 因为梁山就是天下\n\n[Verse 2]\n竹桃树下 宝玉和黛玉并肩坐着\n他们不看对方 因为不需要\n心跳已经同步了\n黛玉说 \"还好吗\"\n宝玉说 \"好\"\n——这个\"好\" 字面意思是好\n但也是 全书120回的最 const NV={"hlm": {"name": "红楼梦", "icon": "🌸", "color": "#e91e63"}, "sgy": {"name": "三国演义", "icon": "⚔️", "color": "#e67e22"}, "shz": {"name": "水浒传", "icon": "🗡️", "color": "#27ae60"}, "xyj": {"name": "西游记", "icon": "🐒", "color": "#9b59b6"}, "smy": {"name": "四梦归一", "icon": "🌟", "color": "#f1c40f"}};
let cn='all',ci=-1,pf=false,shuffleOn=false;

// Feature 1: Waveform visualizer control
function updateWaveform(){
  const wv=document.getElementById('wv');
  if(!wv)return;
  if(pf){wv.classList.add('active');wv.classList.remove('idle')}
  else{wv.classList.remove('active');wv.classList.add('idle')}
}

// Feature 4: Update sidebar highlight for playing track
function updatePlayingHighlight(){
  document.querySelectorAll('.ti.on').forEach(el=>{
    if(pf) el.classList.add('playing');
    else el.classList.remove('playing');
  });
}

// Feature 5: Content fade transition
function setContentWithFade(html){
  const ct=document.getElementById('ct');
  ct.classList.remove('fade-in');
  ct.classList.add('fade-out');
  setTimeout(()=>{
    ct.innerHTML=html;
    ct.classList.remove('fade-out');
    ct.classList.add('fade-in');
    ct.scrollTop=0;
  },160);
}

// Show keyboard hint toast
function showKbdHint(msg){
  const h=document.getElementById('kbd-hint');
  h.textContent=msg;h.classList.add('show');
  clearTimeout(h._t);h._t=setTimeout(()=>h.classList.remove('show'),1200);
}

function init(){
  let h='<div class="on" onclick="sn(\'all\',this)"><span class="ico">🎵</span>全部</div>';
  for(let k in NV){let v=NV[k];h+=`<div onclick="sn(\'${k}\',this)"><span class="ico">${v.icon}</span>${v.name}</div>`}
  document.getElementById('nvt').innerHTML=h;rl()
}
function sn(n,el){cn=n;document.querySelectorAll('.nvt div').forEach(d=>d.classList.remove('on'));el.classList.add('on');rl()}
function rl(){
  const ls=cn==='all'?T:T.filter(t=>t.nv===cn);
  document.getElementById('tl').innerHTML=ls.map((t,i)=>{
    const cls=i===ci?' on'+(pf?' playing':''):'';
    return `<div class="ti${cls}" onclick="st(${i})"><span class="tn">${String(i+1).padStart(2,'0')}</span><div><span class="tt">${t.title}</span><span class="ts">${t.scene}</span></div></div>`;
  }).join('')
}
function st(i){
  const ls=cn==='all'?T:T.filter(t=>t.nv===cn);
  if(i<0||i>=ls.length)return;
  const t=ls[i];ci=i;const nv=NV[t.nv];
  document.documentElement.style.setProperty('--ac',nv.color);
  const lh=t.lyrics.replace(/\[(.*?)\]/g,'<b>[$1]</b>');
  const nh=t.notes.split('\n').filter(l=>l.trim().startsWith('-')).map(l=>'<li>'+l.trim().substring(1).trim()+'</li>').join('');
  const th=t.tags.split(',').map(g=>'<span class="tg">'+g.trim()+'</span>').join('');
  const html=`<h2 style="color:${nv.color}">${nv.icon} ${t.title}</h2><div class="sc">${t.scene}</div><h3>歌词</h3><div class="ly">${lh}</div><h3>🎛️ Suno AI Prompt</h3><div class="sb2">${t.suno}</div><h3>🏷️ 标签</h3><div class="tgs">${th}</div><h3>📝 创作笔记</h3><ul class="nt">${nh}</ul>`;
  setContentWithFade(html);
  document.getElementById('pl').style.display='flex';
  document.getElementById('pt').textContent=t.title;
  document.getElementById('ps').textContent=t.scene;
  rl();updateWaveform()
}
function tplay(){
  pf=!pf;
  document.getElementById('pbtn').textContent=pf?'⏸':'▶';
  updateWaveform();updatePlayingHighlight();
  if(pf)speak();else speechSynthesis&&speechSynthesis.cancel()
}

// Feature 3: Shuffle
function tshuffle(){
  shuffleOn=!shuffleOn;
  const btn=document.getElementById('sbtn');
  if(shuffleOn){btn.classList.add('sf-on');showKbdHint('🔀 随机播放已开启')}
  else{btn.classList.remove('sf-on');showKbdHint('🔀 随机播放已关闭')}
}
function shuffleNext(){
  const ls=cn==='all'?T:T.filter(t=>t.nv===cn);
  if(ls.length<=1){st(0);return}
  let ni;do{ni=Math.floor(Math.random()*ls.length)}while(ni===ci);
  st(ni)
}

function prev(){
  if(shuffleOn){shuffleNext();return}
  st(ci-1)
}
function next(){
  if(shuffleOn){shuffleNext();return}
  st(ci+1)
}
function speak(){
  if(!('speechSynthesis' in window))return;
  const ls=cn==='all'?T:T.filter(t=>t.nv===cn);const t=ls[ci];if(!t)return;
  const tx=t.lyrics.replace(/\[.*?\]/g,'').replace(/\n+/g,'。');
  const u=new SpeechSynthesisUtterance(tx);u.lang='zh-CN';u.rate=0.85;
  u.onend=()=>{pf=false;document.getElementById('pbtn').textContent='▶';updateWaveform();updatePlayingHighlight()};
  speechSynthesis.cancel();speechSynthesis.speak(u)
}

// Feature 2: Keyboard shortcuts (Left/Right arrows, Space)
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();next();showKbdHint('→ 下一首')}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();showKbdHint('← 上一首')}
  else if(e.key==='ArrowDown'){e.preventDefault();next();showKbdHint('↓ 下一首')}
  else if(e.key==='ArrowUp'){e.preventDefault();prev();showKbdHint('↑ 上一首')}
  else if(e.key===' '){e.preventDefault();tplay();showKbdHint(pf?'▶ 播放':'⏸ 暂停')}
});
init();
</script>
</body>
</html>
