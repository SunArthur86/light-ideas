<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中文文学库 · 两千年文脉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--text2:#666;--accent:#c0392b;--accent2:#e74c3c;--border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:12px;--gold:#f39c12}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ===== Hero ===== */
.hero{position:relative;min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 20px 36px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:300;letter-spacing:.1em;margin-bottom:10px}
.hero h1 span{font-weight:700;background:linear-gradient(90deg,#e74c3c,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .subtitle{font-size:clamp(.85rem,2vw,1.1rem);opacity:.7;margin-bottom:24px;font-weight:300}
.stats-row{display:flex;gap:36px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:var(--gold)}
.stat .label{font-size:.75rem;opacity:.6;margin-top:2px}
.brush-line{width:120px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:18px auto;border-radius:2px}

/* ===== Discover Section ===== */
.discover{max-width:1200px;margin:-40px auto 0;padding:0 20px;position:relative;z-index:10}
.discover-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dtab{padding:6px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:.85rem;cursor:pointer;transition:all .25s;color:var(--text2);box-shadow:var(--shadow)}
.dtab:hover{border-color:var(--accent);color:var(--accent)}
.dtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.discover-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dcard{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start}
.dcard:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.1);border-color:var(--accent)}
.dcard-color{width:4px;min-height:48px;border-radius:2px;flex-shrink:0}
.dcard-body{flex:1;min-width:0}
.dcard h4{font-size:.95rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .dca{font-size:.8rem;color:var(--accent);margin-bottom:4px}
.dcard .dcd{font-size:.78rem;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .dcbadge{position:absolute;top:8px;right:8px;font-size:.65rem;padding:2px 8px;border-radius:10px;color:#fff}

/* ===== Era Nav ===== */
.era-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;transition:box-shadow .3s}
.era-nav.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.08)}
.era-nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.era-nav-inner::-webkit-scrollbar{display:none}
.era-btn{flex-shrink:0;padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text2);font-size:.82rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.era-btn:hover{border-color:var(--accent);color:var(--accent)}
.era-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.era-btn .count{display:inline-block;background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;font-size:.7rem;margin-left:4px}
.era-btn.active .count{background:rgba(255,255,255,.25)}

/* ===== Filter bar ===== */
.filter-bar{max-width:1200px;margin:20px auto 0;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius);font-size:.92rem;background:var(--card);outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.85rem}
.genre-filters{display:flex;gap:6px;flex-wrap:wrap}
.genre-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--card);font-size:.78rem;cursor:pointer;transition:all .2s;color:var(--text2)}
.genre-btn:hover{border-color:var(--accent);color:var(--accent)}
.genre-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-btn{padding:8px 14px;background:var(--card);border:none;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.view-btn.active{background:var(--text);color:#fff}
.view-btn:not(:last-child){border-right:1px solid var(--border)}

/* ===== Tag cloud ===== */
.tag-cloud{max-width:1200px;margin:12px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap}
.tag-chip{padding:3px 10px;border-radius:12px;font-size:.72rem;background:#f0f0f0;color:var(--text2);cursor:pointer;transition:all .2s}
.tag-chip:hover{background:var(--accent);color:#fff}
.tag-chip.active{background:var(--accent);color:#fff}

/* ===== Bookmark bar ===== */
.bookmark-bar{max-width:1200px;margin:10px auto 0;padding:0 20px;display:none;align-items:center;gap:8px}
.bookmark-bar.show{display:flex}
.bookmark-bar .blabel{font-size:.82rem;color:var(--accent);font-weight:600}
.bookmark-bar .bcount{font-size:.75rem;color:var(--text2);background:#f5f5f5;padding:2px 8px;border-radius:10px}
.bookmark-bar .bclear{font-size:.75rem;color:var(--text2);cursor:pointer;text-decoration:underline;margin-left:auto}

/* ===== Main content ===== */
.main{max-width:1200px;margin:20px auto 60px;padding:0 20px}
.result-info{color:var(--text2);font-size:.82rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.result-actions{display:flex;gap:8px}
.result-actions button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:.75rem;cursor:pointer;color:var(--text2);transition:all .2s}
.result-actions button:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Grid view ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .era-tag{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:.68rem;padding:3px 10px;border-radius:0 0 0 var(--radius)}
.card .card-bookmark{position:absolute;top:8px;right:8px;font-size:1.1rem;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .card-bookmark{opacity:1}
.card .card-bookmark.bookmarked{opacity:1;color:var(--gold)}
.card h3{font-size:1.02rem;font-weight:600;margin-bottom:3px;padding-right:60px}
.card .author{color:var(--accent);font-size:.82rem;margin-bottom:6px}
.card .desc{color:var(--text2);font-size:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .meta span{font-size:.68rem;padding:2px 7px;border-radius:10px;background:#f5f5f5;color:var(--text2)}
.card-excerpt{font-size:.75rem;color:#8e44ad;font-style:italic;margin:6px 0;padding:6px 10px;background:linear-gradient(135deg,#f5eef8,#ede7f6);border-radius:6px;border-left:3px solid #8e44ad;line-height:1.5}
/* Reading status */
.card .read-badge{position:absolute;top:0;left:0;background:#27ae60;color:#fff;font-size:.65rem;padding:2px 8px;border-radius:0 0 var(--radius) 0}

/* ===== Timeline view ===== */
.timeline{position:relative;padding-left:40px}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),#f39c12,var(--accent))}
.tl-item{position:relative;margin-bottom:18px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .3s}
.tl-item:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.tl-item::before{content:'';position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tl-item .year{font-size:.72rem;color:var(--accent);font-weight:600;margin-bottom:3px}
.tl-item h3{font-size:.92rem;font-weight:600;margin-bottom:2px}
.tl-item .author{font-size:.78rem;color:var(--text2)}
.tl-item .desc{font-size:.78rem;color:var(--text2);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Chart view ===== */
.chart-section{display:none}
.chart-section.show{display:block}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:14px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.chart-card h3{font-size:.92rem;font-weight:600;margin-bottom:14px;color:var(--text)}
canvas.chart{width:100%!important;height:260px!important}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 32px;position:relative;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:10px;right:14px;font-size:1.5rem;cursor:pointer;color:var(--text2);border:none;background:none;line-height:1}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:1.3rem;font-weight:700;margin-bottom:3px;padding-right:60px}
.modal .m-author{color:var(--accent);font-size:.95rem;margin-bottom:14px}
.modal .m-desc{line-height:1.8;color:var(--text);margin-bottom:14px}
.modal .m-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal .m-tags span{padding:3px 10px;border-radius:14px;font-size:.75rem;background:#f5f5f5;color:var(--text2)}
.modal .m-tags span:first-child{background:var(--accent);color:#fff}
.modal .m-actions{display:flex;gap:8px;margin-top:14px}
.modal .m-actions button{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:.82rem;cursor:pointer;transition:all .2s}
.modal .m-actions button:hover{border-color:var(--accent);color:var(--accent)}
.modal .m-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.m-section{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f8f9fa}
.m-section-title{font-size:.78rem;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:1px}
.m-intro{font-size:.85rem;line-height:1.8;color:#333;text-indent:2em}
.m-thought{font-size:.85rem;line-height:1.8;color:#2c3e50;padding-left:12px;border-left:3px solid #e67e22}
.m-excerpt{font-size:.85rem;line-height:2;color:#6c3483;font-style:italic;padding:8px 12px;background:linear-gradient(135deg,#fdf2f8,#f5eef8);border-radius:8px}
/* Related recommendations in modal */
.m-related{margin-top:16px;padding:14px;background:#f8f9fa;border-radius:10px}
.m-related-title{font-size:.78rem;font-weight:700;color:#555;margin-bottom:10px;letter-spacing:1px}
.m-related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.m-related-item{padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.m-related-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.m-related-item h5{font-size:.82rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-related-item .mri-a{font-size:.72rem;color:var(--accent)}
.m-related-item .mri-e{font-size:.68rem;color:var(--text2)}

/* ===== Scroll top ===== */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(192,57,43,.3);transition:all .3s;z-index:50}
.scroll-top:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(192,57,43,.4)}
.scroll-top.show{display:flex}

/* ===== Toast ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:8px;font-size:.85rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ===== Responsive ===== */
@media(max-width:768px){
.hero{min-height:45vh;padding:36px 16px 24px}
.stats-row{gap:20px}
.grid{grid-template-columns:1fr}
.chart-grid{grid-template-columns:1fr}
.filter-bar{flex-direction:column}
.genre-filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
.discover-cards{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
.hero h1{font-size:1.5rem}
.stat .num{font-size:1.3rem}
.era-btn{padding:5px 10px;font-size:.78rem}
.discover-cards{grid-template-columns:1fr}
}
@media(max-width:640px){
.card-excerpt{font-size:.7rem;padding:4px 8px}
.m-section{padding:10px 12px}
.m-intro,.m-thought,.m-excerpt{font-size:.8rem;line-height:1.7}
}
</style>
</head>
<body>
<!-- Hero -->
<div class="hero">
<h1>中文文学库 · <span>两千年文脉</span></h1>
<p class="subtitle">从诗经到长安的荔枝，200部作品纵览中华文明</p>
<div class="brush-line"></div>
<div class="stats-row" id="statsRow"></div>
</div>

<!-- Discover / Recommendations -->
<div class="discover" id="discoverSection">
<div class="discover-tabs">
<button class="dtab active" data-dtab="picks">🎯 每日精选</button>
<button class="dtab" data-dtab="random">🎲 随机发现</button>
<button class="dtab" data-dtab="bookmarks">⭐ 我的收藏</button>
<button class="dtab" data-dtab="unread">📖 未读清单</button>
</div>
<div class="discover-cards" id="discoverCards"></div>
</div>

<!-- Era Nav -->
<div class="era-nav" id="eraNav">
<div class="era-nav-inner" id="eraBtns"></div>
</div>

<!-- Filter -->
<div class="filter-bar">
<div class="search-box"><input id="searchInput" placeholder="搜索作品名、作者、关键词… （按 / 快捷搜索）"></div>
<div class="genre-filters" id="genreBtns"></div>
<div class="view-toggle">
<button class="view-btn active" data-view="grid">⊞</button>
<button class="view-btn" data-view="timeline">◷</button>
<button class="view-btn" data-view="chart">▧</button>
</div>
</div>

<!-- Tag Cloud -->
<div class="tag-cloud" id="tagCloud"></div>

<!-- Bookmark bar -->
<div class="bookmark-bar" id="bookmarkBar">
<span class="blabel">⭐ 已收藏</span>
<span class="bcount" id="bmCount">0</span>
<button class="bclear" id="bmClear">清除筛选</button>
</div>

<!-- Main -->
<div class="main">
<div class="result-info">
<span id="resultInfo"></span>
<div class="result-actions">
<button id="btnShuffle" title="随机排序">🔀 随机</button>
<button id="btnReset" title="重置筛选">↺ 重置</button>
</div>
</div>
<div id="gridView" class="grid"></div>
<div id="timelineView" class="timeline" style="display:none"></div>
<div id="chartView" class="chart-section"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modal">
<button class="modal-close" id="modalClose">×</button>
<div id="modalBody"></div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<button class="scroll-top" id="scrollTop">↑</button>

{id:85,t:"杨万里诗集",a:"杨万里",y:1180,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋四大家之一，'诚斋体'自然活泼，'小荷才露尖尖角'家喻户晓。",p:"江西"},
{id:86,t:"朱熹文集",a:"朱熹",y:1180,e:"宋代",g:"哲学",ty:"理学",d:"理学集大成者，四书集注为科举标准教材，影响中国思想史七百年。",p:"福建/江西"},
{id:87,t:"东京梦华录",a:"孟元老",y:1147,e:"宋代",g:"笔记",ty:"笔记",d:"追忆北宋汴京繁华盛景，城市生活的百科全书，珍贵的社会史料。",p:"河南"},
{id:88,t:"梦溪笔谈",a:"沈括",y:1088,e:"宋代",g:"科学",ty:"笔记",d:"北宋科学百科全书，涵盖天文数学物理化学等领域，被李约瑟称为'中国科学史里程碑'。",p:"浙江"},
{id:89,t:"文天祥诗集",a:"文天祥",y:1280,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋民族英雄，正气歌过零丁洋等慷慨悲壮，'人生自古谁无死'浩然正气。",p:"江西"},
{id:90,t:"岳飞诗词",a:"岳飞",y:1140,e:"宋代",g:"词",ty:"词集",d:"南宋名将词作，满江红'怒发冲冠'壮怀激烈，千古传诵。",p:"河南"},
{id:91,t:"元好问集",a:"元好问",y:1230,e:"辽金元",g:"诗歌",ty:"诗集",d:"金代文学代表，'问世间情是何物直教生死相许'千古名句。",p:"山西"},
{id:92,t:"关汉卿杂剧",a:"关汉卿",y:1290,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之首，窦娥冤为中国古典悲剧巅峰之作，千古奇冤感天动地。",p:"北京"},
{id:93,t:"西厢记",a:"王实甫",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧巅峰之作，张生与崔莺莺的爱情故事，'愿天下有情人终成眷属'。",p:"北京"},
{id:94,t:"窦娥冤",a:"关汉卿",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧悲剧代表，窦娥含冤而死六月飞雪，揭露社会黑暗伸张正义。",p:"北京"},
{id:95,t:"马致远杂剧",a:"马致远",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，汉宫秋等历史剧悲壮苍凉，天净沙·秋思被誉为'秋思之祖'。",p:"北京"},
{id:96,t:"赵氏孤儿",a:"纪君祥",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧名作，程婴救孤故事，忠义精神感人，最早被译介到欧洲的中国戏剧。",p:"北京"},
{id:97,t:"白朴杂剧",a:"白朴",y:1280,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，墙头马上梧桐雨等作品，文采斐然情感真挚。",p:"北京"},
{id:98,t:"张养浩散曲",a:"张养浩",y:1320,e:"辽金元",g:"散曲",ty:"散曲集",d:"元代散曲大家，山坡羊·潼关怀古'兴百姓苦亡百姓苦'千古名句。",p:"山东"},
{id:99,t:"崔颢黄鹤楼",a:"崔颢",y:740,e:"隋唐",g:"诗歌",ty:"七言诗",d:"黄鹤楼一诗传诵千古，据传李白见之亦搁笔叹'眼前有景道不得'。",p:"河南"},
{id:100,t:"李之仪词",a:"李之仪",y:1090,e:"宋代",g:"词",ty:"词集",d:"北宋词人，'我住长江头君住长江尾'朴素深情广为传唱。",p:"河北"},
{id:101,t:"西厢记诸宫调",a:"董解元",y:1200,e:"辽金元",g:"说唱",ty:"诸宫调",d:"金代说唱文学代表作，为王实甫西厢记的蓝本，保存了珍贵的音乐文学形式。",p:"北京"},
{id:102,t:"三国演义",a:"罗贯中",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部长篇历史演义小说，描写东汉末年至西晋近百年的历史风云，桃园三结义等故事家喻户晓。",p:"浙江"},
{id:103,t:"水浒传",a:"施耐庵",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部歌颂农民起义的长篇小说，一百零八位好汉替天行道的故事流传千古。",p:"江苏"},
{id:104,t:"西游记",a:"吴承恩",y:1592,e:"明代",g:"小说",ty:"长篇小说",d:"中国古典神魔小说巅峰，唐僧师徒四人西天取经的奇幻旅程，想象力惊天动地。",p:"江苏"},
{id:105,t:"金瓶梅",a:"兰陵笑笑生",y:1610,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部由文人独立创作的长篇世情小说，深刻揭示明代社会百态，文学价值极高。",p:"山东"},
{id:106,t:"牡丹亭",a:"汤显祖",y:1598,e:"明代",g:"戏剧",ty:"传奇",d:"明代戏剧巅峰，杜丽娘因梦而死又因情复生，'情不知所起一往而深'传诵千古。",p:"江西"},
{id:107,t:"封神演义",a:"许仲琳",y:1620,e:"明代",g:"小说",ty:"神魔小说",d:"以武王伐纣为背景的神魔小说，哪吒杨戬姜子牙等形象深入人心。",p:"江苏"},
{id:108,t:"徐霞客游记",a:"徐霞客",y:1640,e:"明代",g:"地理",ty:"游记",d:"明代地理名著，三十余年实地考察记录，对喀斯特地貌的研究早于西方两百年。",p:"江苏"},
{id:109,t:"三言",a:"冯梦龙",y:1620,e:"明代",g:"小说",ty:"话本集",d:"喻世明言警世通言醒世恒言三部白话短篇小说集，反映明代市井生活百态。",p:"江苏"},
{id:110,t:"二拍",a:"凌濛初",y:1630,e:"明代",g:"小说",ty:"话本集",d:"初刻拍案惊奇二刻拍案惊奇，与三言合称'三言二拍'，白话小说经典。",p:"浙江"},
{id:111,t:"临川四梦",a:"汤显祖",y:1600,e:"明代",g:"戏剧",ty:"传奇",d:"汤显祖四部传奇剧：牡丹亭紫钗记邯郸记南柯记，以梦为线索探讨人生。",p:"江西"},
{id:112,t:"归有光文集",a:"归有光",y:1560,e:"明代",g:"散文",ty:"文集",d:"明代散文家，项脊轩志为名篇，以家常琐事抒发深情淡而有味。",p:"江苏"},
{id:113,t:"张岱文集",a:"张岱",y:1650,e:"明代",g:"散文",ty:"小品文",d:"晚明小品文大家，陶庵梦忆西湖梦寻追忆往昔繁华，文字清隽风雅。",p:"浙江"},
{id:114,t:"袁宏道文集",a:"袁宏道",y:1600,e:"明代",g:"散文",ty:"小品文",d:"公安派代表，提倡'独抒性灵不拘格套'，反对复古拟古之风。",p:"湖北"},
{id:115,t:"天工开物",a:"宋应星",y:1637,e:"明代",g:"科技",ty:"科技著作",d:"中国古代科技百科全书，系统记载农业手工业技术，被誉为'中国17世纪的工艺百科全书'。",p:"江西"},
{id:116,t:"红楼梦",a:"曹雪芹",y:1791,e:"清代",g:"小说",ty:"长篇小说",d:"中国古典小说最高成就，以贾府兴衰为线索展现封建社会全貌，被誉为'中国封建社会的百科全书'。",p:"北京"},
{id:117,t:"聊斋志异",a:"蒲松龄",y:1690,e:"清代",g:"小说",ty:"文言小说",d:"中国文言短篇小说巅峰，四百余篇鬼狐故事，借鬼神讽世情想象瑰丽。",p:"山东"},
{id:118,t:"儒林外史",a:"吴敬梓",y:1750,e:"清代",g:"小说",ty:"讽刺小说",d:"中国讽刺小说巅峰之作，描绘科举制度下知识分子的众生相，辛辣幽默。",p:"安徽"},
{id:119,t:"桃花扇",a:"孔尚任",y:1699,e:"清代",g:"戏剧",ty:"传奇",d:"清代传奇剧代表，以秦淮名妓李香君与侯方域的爱情反映南明兴亡。",p:"山东"},
{id:120,t:"长生殿",a:"洪昇",y:1688,e:"清代",g:"戏剧",ty:"传奇",d:"清代传奇剧代表，写唐玄宗与杨贵妃爱情故事，与桃花扇并称'南洪北孔'。",p:"浙江"},
{id:121,t:"纳兰性德词集",a:"纳兰性德",y:1680,e:"清代",g:"词",ty:"词集",d:"清代第一词人，'人生若只如初见何事秋风悲画扇'凄美动人。",p:"北京"},
{id:122,t:"阅微草堂笔记",a:"纪昀",y:1790,e:"清代",g:"小说",ty:"笔记小说",d:"纪晓岚所著志怪小说集，与聊斋并称清代笔记小说双璧。",p:"北京"},
{id:123,t:"镜花缘",a:"李汝珍",y:1820,e:"清代",g:"小说",ty:"长篇小说",d:"奇幻冒险小说，描绘海外奇国异俗，寓讽刺于幻想之中。",p:"江苏"},
{id:124,t:"老残游记",a:"刘鹗",y:1903,e:"清代",g:"小说",ty:"长篇小说",d:"晚清四大谴责小说之一，通过江湖医生老残的游历揭露晚清社会黑暗。",p:"江苏"},
{id:125,t:"官场现形记",a:"李伯元",y:1903,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，全面揭露晚清官场腐败丑态，笔锋犀利。",p:"江苏"},
{id:126,t:"二十年目睹之怪现状",a:"吴趼人",y:1905,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，以见闻录形式记录晚清社会的种种怪现状。",p:"广东"},
{id:127,t:"孽海花",a:"曾朴",y:1905,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，以赛金花故事为线索反映晚清外交与社会。",p:"江苏"},
{id:128,t:"浮生六记",a:"沈复",y:1808,e:"清代",g:"散文",ty:"自传",d:"清代自传体散文，记录与妻子芸娘的平凡生活，真挚感人林语堂誉为中国文学最美之作。",p:"江苏"},
{id:129,t:"龚自珍集",a:"龚自珍",y:1830,e:"清代",g:"诗文",ty:"文集",d:"晚清思想先驱，'我劝天公重抖擞不拘一格降人才'开启近代思想启蒙。",p:"浙江"},
{id:130,t:"郑板桥集",a:"郑燮",y:1750,e:"清代",g:"诗文",ty:"文集",d:"扬州八怪之一，诗书画三绝，'难得糊涂'四字流传天下。",p:"江苏"},
{id:131,t:"袁枚集",a:"袁枚",y:1770,e:"清代",g:"诗文",ty:"文集",d:"清代才子，随园诗话倡导性灵说，小仓山房诗文集文采斐然。",p:"浙江"},
{id:132,t:"曾国藩家书",a:"曾国藩",y:1860,e:"清代",g:"散文",ty:"书信",d:"晚清名臣曾国藩的家书集，修身齐家治国的智慧结晶，影响至今。",p:"湖南"},
{id:133,t:"说岳全传",a:"钱彩",y:1750,e:"清代",g:"小说",ty:"历史小说",d:"讲述岳飞精忠报国的故事，民间影响深远，岳飞形象的文学定型之作。",p:"浙江"},
{id:134,t:"隋唐演义",a:"褚人获",y:1700,e:"清代",g:"小说",ty:"历史小说",d:"隋唐历史演义，从隋文帝到唐明皇的历史故事，英雄美人传奇荟萃。",p:"江苏"},
{id:135,t:"东周列国志",a:"冯梦龙",y:1650,e:"清代",g:"小说",ty:"历史小说",d:"系统讲述春秋战国历史的长篇小说，各诸侯国兴亡故事精彩纷呈。",p:"江苏"},
{id:136,t:"鲁迅全集",a:"鲁迅",y:1923,e:"民国",g:"小说/杂文",ty:"全集",d:"中国现代文学奠基人，狂人日记为中国第一篇白话小说，阿Q正传深刻揭示国民性。",p:"浙江/北京"},
{id:137,t:"骆驼祥子",a:"老舍",y:1937,e:"民国",g:"小说",ty:"长篇小说",d:"老舍代表作，描写北平人力车夫祥子的悲惨命运，京味文学的经典。",p:"北京"},
{id:138,t:"家",a:"巴金",y:1933,e:"民国",g:"小说",ty:"长篇小说",d:"巴金激流三部曲之一，描写封建家庭的崩溃，青年一代的觉醒与反抗。",p:"四川"},
{id:139,t:"子夜",a:"茅盾",y:1933,e:"民国",g:"小说",ty:"长篇小说",d:"茅盾代表作，描绘20世纪30年代上海的社会全景，中国现代长篇小说里程碑。",p:"浙江"},
{id:140,t:"边城",a:"沈从文",y:1934,e:"民国",g:"小说",ty:"中篇小说",d:"沈从文代表作，描绘湘西边城茶峒的纯美爱情，田园牧歌式的文学净土。",p:"湖南"},
{id:141,t:"雷雨",a:"曹禺",y:1934,e:"民国",g:"戏剧",ty:"话剧",d:"中国现代话剧奠基之作，两个家庭三十年的恩怨纠葛，戏剧冲突激烈震撼。",p:"天津"},
{id:142,t:"围城",a:"钱钟书",y:1947,e:"民国",g:"小说",ty:"长篇小说",d:"钱钟书唯一长篇，以幽默讽刺笔法描绘知识分子群像，'围在城里的人想逃出来'。",p:"江苏"},
{id:143,t:"张爱玲全集",a:"张爱玲",y:1944,e:"民国",g:"小说",ty:"作品集",d:"民国才女作家，倾城之恋金锁记等小说以冷艳笔触描绘都市男女，风格独特。",p:"上海"},
{id:144,t:"呼兰河传",a:"萧红",y:1940,e:"民国",g:"小说",ty:"长篇小说",d:"萧红代表作，描绘东北呼兰河小城的风土人情，笔调苍凉寂寞而深情。",p:"黑龙江"},
{id:145,t:"徐志摩诗集",a:"徐志摩",y:1928,e:"民国",g:"诗歌",ty:"诗集",d:"新月派代表诗人，再别康桥'轻轻的我走了正如我轻轻的来'浪漫唯美。",p:"浙江"},
{id:146,t:"闻一多诗集",a:"闻一多",y:1925,e:"民国",g:"诗歌",ty:"诗集",d:"新月派诗人，死水红烛等诗篇关注现实格律严整，后为民主运动献身。",p:"湖北"},
{id:147,t:"朱自清散文",a:"朱自清",y:1928,e:"民国",g:"散文",ty:"散文集",d:"现代散文大家，背影荷塘月色等名篇情感细腻真挚动人。",p:"江苏"},
{id:148,t:"郁达夫文集",a:"郁达夫",y:1930,e:"民国",g:"小说/散文",ty:"文集",d:"创造社创始人之一，沉沦等作品大胆暴露内心，文风清丽哀婉。",p:"浙江"},
{id:149,t:"冰心散文",a:"冰心",y:1923,e:"民国",g:"散文",ty:"散文集",d:"中国现代儿童文学先驱，繁星春水等作品以母爱童真自然为主题温暖动人。",p:"福建"},
{id:150,t:"林语堂散文",a:"林语堂",y:1937,e:"民国",g:"散文",ty:"散文集",d:"'两脚踏中西文化一心评宇宙文章'，吾国与吾民向世界介绍中国文化。",p:"福建"},
{id:151,t:"彷徨",a:"鲁迅",y:1926,e:"民国",g:"小说",ty:"短篇小说集",d:"鲁迅第二部小说集，祝福伤逝等名篇深刻揭示旧社会的压迫与人性的挣扎。",p:"北京"},
{id:152,t:"茶馆",a:"老舍",y:1957,e:"当代",g:"戏剧",ty:"话剧",d:"老舍戏剧杰作，通过裕泰茶馆五十年的变迁展现中国社会沧桑巨变。",p:"北京"},
{id:153,t:"活着",a:"余华",y:1993,e:"当代",g:"小说",ty:"长篇小说",d:"余华代表作，福贵一生的苦难与坚韧，以平静笔调书写命运无常感动千万读者。",p:"浙江"},
{id:154,t:"平凡的世界",a:"路遥",y:1988,e:"当代",g:"小说",ty:"长篇小说",d:"路遥代表作，描写黄土高原上普通人奋斗的人生故事，激励无数青年。",p:"陕西"},
{id:155,t:"白鹿原",a:"陈忠实",y:1993,e:"当代",g:"小说",ty:"长篇小说",d:"陈忠实代表作，描绘白鹿原上两个家族的恩怨与变迁，渭河平原的史诗。",p:"陕西"},

const EXT={
1:{in:"《诗经》是中国第一部诗歌总集，收录西周初年至春秋中叶约五百年间305篇诗歌。分风雅颂三部分：风为各地民歌，雅为宫廷乐歌，颂为祭祀颂歌。赋比兴的修辞手法影响中国诗歌数千年，是中国现实主义的源头。",th:"现实主义精神，以诗歌反映社会生活真实情感。思无邪的教化功能，诗可以兴观群怨。",ex:"关关雎鸠，在河之洲。窈窕淑女，君子好逑。参差荇菜，左右流之。窈窕淑女，寤寐求之。\n\n昔我往矣，杨柳依依。今我来思，雨雪霏霏。行道迟迟，载渴载饥。我心伤悲，莫知我哀。\n\n蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。\n\n知我者谓我心忧，不知我者谓我何求。悠悠苍天，此何人哉！\n\n死生契阔，与子成说。执子之手，与子偕老。于嗟阔兮，不我活兮。于嗟洵兮，不我信兮。\n\n青青子衿，悠悠我心。纵我不往，子宁不嗣音？\n\n呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。"},
2:{in:"《楚辞》以屈原作品为核心，收宋玉等人作品。楚辞体打破诗经四言格局，以参差错落句式表达丰富情感想象。香草美人意象体系、瑰丽奇绝的神话世界，开创中国文学浪漫主义传统。",th:"浪漫主义传统，以奇绝想象和浓烈情感对抗现实黑暗。香草美人是忠贞高洁的永恒隐喻。",ex:"路漫漫其修远兮，吾将上下而求索。\n\n亦余心之所善兮，虽九死其犹未悔。\n\n悲哉秋之为气也！萧瑟兮草木摇落而变衰。\n\n风飒飒兮木萧萧，思公子兮徒离忧。\n\n鸟飞返故乡兮，狐死必首丘。\n\n举世皆浊我独清，众人皆醉我独醒。\n\n沧浪之水清兮，可以濯吾缨；沧浪之水浊兮，可以濯吾足。\n\n悲莫悲兮生别离，乐莫乐兮新相知。\n\n与天地兮同寿，与日月兮齐光。"},
3:{in:"《离骚》是屈原被流放后创作的长篇政治抒情诗，全诗373句，2400余字，是中国古代最长的抒情诗。以香草美人象征高洁理想与政治抱负，在楚地神话的瑰丽想象中倾诉忠君爱国之情。",th:"忠贞不屈的品格与理想主义的坚守。在黑暗现实中不妥协、不放弃的精神力量。",ex:"帝高阳之苗裔兮，朕皇考曰伯庸。摄提贞于孟陬兮，惟庚寅吾以降。\n\n朝饮木兰之坠露兮，夕餐秋菊之落英。\n\n长太息以掩涕兮，哀民生之多艰。\n\n亦余心之所善兮，虽九死其犹未悔。\n\n路漫漫其修远兮，吾将上下而求索。\n\n日月忽其不淹兮，春与秋其代序。惟草木之零落兮，恐美人之迟暮。\n\n制芰荷以为衣兮，集芙蓉以为裳。不吾知其亦已兮，苟余情其信芳。\n\n吾令凤鸟飞腾兮，继之以日夜。"},
4:{in:"《道德经》是老子所著的哲学经典，仅五千言却蕴含天地万物运行的根本法则。道可道非常道，名可名非常名——以最简洁的语言揭示最深刻的宇宙真理，影响中国文化乃至世界思想两千余年。",th:"道法自然，无为而治。万物负阴而抱阳，冲气以为和。上善若水，柔弱胜刚强。",ex:"道可道，非常道；名可名，非常名。无名天地之始，有名万物之母。\n\n上善若水。水善利万物而不争，处众人之所恶，故几于道。\n\n天下万物生于有，有生于无。\n\n道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。\n\n祸兮福之所倚，福兮祸之所伏。\n\n合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。\n\n天之道，不争而善胜，不言而善应，不召而自来，然而善谋。\n\n知人者智，自知者明。胜人者有力，自胜者强。\n\n大音希声，大象无形。"},
5:{in:"《论语》是记录孔子及其弟子言行的语录集，儒家思想的核心载体。以仁为核心，以礼为规范，以中庸为方法，塑造了中国人的价值观、行为准则和思维方式两千余年。",th:"仁者爱人，克己复礼。学而不思则罔，思而不学则殆。中庸之道是人生最高智慧。",ex:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？\n\n三人行，必有我师焉。择其善者而从之，其不善者而改之。\n\n己所不欲，勿施于人。\n\n学而不思则罔，思而不学则殆。\n\n温故而知新，可以为师矣。\n\n朝闻道，夕死可矣。\n\n岁寒，然后知松柏之后凋也。\n\n知之为知之，不知为不知，是知也。\n\n逝者如斯夫，不舍昼夜。\n\n志士仁人，无求生以害仁，有杀身以成仁。"},
6:{in:"《庄子》是庄周及其后学所著的道家哲学巨著，以汪洋恣肆的文风和天马行空的寓言故事，阐发逍遥自由、齐物等量的精神境界。庄子的想象力与哲思深度在中国哲学史上无出其右。",th:"逍遥自在的人生态度，万物齐一的哲学洞见。破除执念，回归自然，追求精神的绝对自由。",ex:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。\n\n庄生晓梦迷蝴蝶，望帝春心托杜鹃。不知周之梦为蝴蝶与，蝴蝶之梦为周与？\n\n天地与我并生，而万物与我为一。\n\n子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？\n\n吾生也有涯，而知也无涯。以有涯随无涯，殆矣。\n\n至人无己，神人无功，圣人无名。\n\n相濡以沫，不如相忘于江湖。"},
7:{in:"《孟子》记录孟子及其弟子的言行与论辩，是儒家经典之一。孟子主张性善论，提倡仁政王道，以雄辩滔滔的气势和严密的逻辑，发展了孔子思想中关于人性与政治的论述。",th:"性善论是人性之本的信念。仁政王道是政治理想，民为贵社稷次之君为轻。养浩然之气。",ex:"天时不如地利，地利不如人和。\n\n生于忧患，死于安乐。\n\n老吾老以及人之老，幼吾幼以及人之幼，天下可运于掌。\n\n富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。\n\n民为贵，社稷次之，君为轻。\n\n故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。\n\n我善养吾浩然之气。其为气也，至大至刚，以直养而无害，则塞于天地之间。\n\n穷则独善其身，达则兼善天下。"},
8:{in:"《左传》是中国第一部叙事详细的编年体史书，记载春秋时期各国政治军事外交大事。以简洁凝练的笔法刻画人物，以跌宕起伏的叙事再现历史，开创了中国历史散文的辉煌传统。",th:"以史为鉴的史观传统。叙事中蕴含礼义廉耻的价值判断，善恶自有公论。",ex:"一鼓作气，再而衰，三而竭。彼竭我盈，故克之。\n\n居安思危，思则有备，有备无患。\n\n多行不义必自毙，子姑待之。\n\n人谁无过？过而能改，善莫大焉。\n\n皮之不存，毛将安傅？\n\n辅车相依，唇亡齿寒。\n\n俭，德之共也；侈，恶之大也。\n\n太上有立德，其次有立功，其次有立言，虽久不废，此之谓不朽。\n\n国之兴也，视民如伤，是其福也；其亡也，以民为土芥，是其祸也。"},
9:{in:"《战国策》记载战国时期纵横家谋略的史书，以纵横捭阖的外交策略和精彩纷呈的人物对话著称。苏秦合纵、张仪连横等故事至今流传，人物描写生动，语言气势纵横。",th:"纵横捭阖的外交智慧。以口舌为剑，以谋略为盾，在乱世中求生存图霸业。",ex:"风萧萧兮易水寒，壮士一去兮不复还！\n\n狡兔有三窟，仅得免其死耳。今君有一窟，未得高枕而卧也，请为君复凿二窟。\n\n前事之不忘，后事之师。\n\n鹬蚌相争，渔翁得利。\n\n亡羊而补牢，未为迟也。\n\n士为知己者死，女为悦己者容。\n\n以地事秦，犹抱薪救火，薪不尽，火不灭。\n\n虎怒决蹯——见兔而顾犬，未为晚也。\n\n猫颈系铃——谁去系？众鼠默然。"},
10:{in:"《孙子兵法》是世界最古老的军事著作之一，十三篇涵盖战争全貌。从战略谋划到战术运用，从情报搜集到地形分析，以简洁精辟的语言构建了完整的军事理论体系，影响遍及全球军事与商业领域。",th:"知己知彼，百战不殆。战争的最高境界是不战而屈人之兵，以谋略取胜而非蛮力。",ex:"兵者，国之大事，死生之地，存亡之道，不可不察也。\n\n知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼不知己，每战必殆。\n\n兵者，诡道也。能而示之不能，用而示之不用，近而示之远，远而示之近。\n\n是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也。\n\n故上兵伐谋，其次伐交，其次伐兵，其下攻城。\n\n出其不意，攻其不备。\n\n兵无常势，水无常形。能因敌变化而取胜者，谓之神。\n\n投之亡地然后存，陷之死地然后生。\n\n善战者，求之于势，不责于人。"},
11:{in:"《山海经》是中国最古老的神话地理志，记载山川河流、神灵异兽、奇闻异事。全书十八卷，描绘了一个瑰丽奇绝的上古神话世界，开中国奇幻文学之先河，也是后世志怪小说的源头。",th:"中华上古神话的宝库。在奇幻想象中蕴含先民对自然的敬畏与探索精神。",ex:"又东五百里，曰丹穴之山。有鸟焉，其状如鸡，五采而文，名曰凤凰。是鸟也，饮食自然，自歌自舞，见则天下安宁。\n\n夸父与日逐走，入日，渴欲得饮，饮于河渭，河渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。\n\n刑天与帝争神，帝断其首，葬之于常羊之山。乃以乳为目，以脐为口，操干戚以舞。\n\n精卫衔微木，将以填沧海。\n\n钟山之神，名曰烛阴，视为昼，瞑为夜，吹为冬，呼为夏，不饮不食不息，身长千里。"},
12:{in:"《周易》是中华文明的思想源头，以六十四卦和三百八十四爻构建宇宙变化的符号体系。易有三义：简易、变易、不易，在变化中寻求恒常之道，深刻影响了中国的哲学、文学、艺术和日常生活。",th:"阴阳变化之道，万物生生不息。穷则变，变则通，通则久。在不确定中寻找确定的规律。",ex:"天行健，君子以自强不息。地势坤，君子以厚德载物。\n\n一阴一阳之谓道。\n\n穷则变，变则通，通则久。\n\n积善之家，必有余庆；积不善之家，必有余殃。\n\n君子终日乾乾，夕惕若厉，无咎。\n\n二人同心，其利断金。同心之言，其臭如兰。\n\n仁者见之谓之仁，知者见之谓之知。\n\n居上位而不骄，在下位而不忧。\n\n善不积不足以成名，恶不积不足以灭身。"},
13:{in:"《尚书》是中国最早的历史文献汇编，记载上古至周代的政令文告。尚书者，上古之书也，被视为政书之祖。其文辞古奥庄严，是了解上古政治制度和文化传统的重要典籍。",th:"以史鉴今的政治智慧。敬天保民，明德慎罚，是中国政治思想的重要源头。",ex:"民惟邦本，本固邦宁。\n\n满招损，谦受益，时乃天道。\n\n克明俊德，以亲九族。九族既睦，平章百姓。百姓昭明，协和万邦。\n\n皇天无亲，惟德是辅。民心无常，惟惠之怀。\n\n为山九仞，功亏一篑。\n\n若网在纲，有条而不紊。\n\n非知之艰，行之惟艰。\n\n惟事事乃其有备，有备无患。\n\n功崇惟志，业广惟勤。"},
14:{in:"《荀子》是儒家重要典籍，荀子提出性恶论，认为人之性恶，其善者伪也。以礼治为核心，强调后天教化的重要性。逻辑严密，文采斐然，其思想对法家有深远影响，弟子韩非和李斯皆为一代人杰。",th:"性恶论与礼治思想。人之初性本恶，需要后天教化以成善。礼是社会秩序的根基。",ex:"学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。\n\n故不登高山，不知天之高也；不临深溪，不知地之厚也。\n\n吾尝终日而思矣，不如须臾之所学也。\n\n锲而舍之，朽木不折；锲而不舍，金石可镂。\n\n不积跬步，无以至千里；不积小流，无以成江海。\n\n天行有常，不为尧存，不为桀亡。\n\n人之性恶，其善者伪也。\n\n蓬生麻中，不扶而直；白沙在涅，与之俱黑。"},
15:{in:"《韩非子》是法家集大成之作，融法、术、势为一体，建立了完整的专制主义理论体系。以寓言精妙、论证雄辩著称。韩非虽死于秦国牢狱，其思想却成为秦帝国治国的理论基础。",th:"法术势三位一体的治国方略。以法治国，以术驭臣，以势立威，冷酷而高效的权力哲学。",ex:"千里之堤，毁于蚁穴。\n\n以子之矛，陷子之盾，何如？其人弗能应也。\n\n守株待兔——因释耕而守株，冀复得兔，兔不可复得，而身为宋国笑。\n\n滥竽充数——齐宣王使人吹竽，必三百人。南郭处士请为王吹竽，宣王说之。\n\n世有伯乐，然后有千里马。千里马常有，而伯乐不常有。\n\n法不阿贵，绳不挠曲。\n\n削足适履——举事必循法以动，变法者因时而化。\n\n长袖善舞，多钱善贾。"},
16:{in:"《墨子》是墨家学派经典，墨子主张兼爱、非攻、尚贤、节用等思想。墨家不仅是哲学流派，更是严密的社会组织和军事技术团体，其逻辑学和科学思想在当时极为超前。",th:"兼爱非攻的博大胸怀。人人平等相爱，反对不义战争，崇尚实用与节约。",ex:"天下之人皆相爱，强不执弱，众不劫寡，富不侮贫，贵不敖贱，诈不欺愚。\n\n夫爱人者，人必从而爱之；利人者，人必从而利之。\n\n俭节则昌，淫佚则亡。\n\n志不强者智不达，言不信者行不果。\n\n仁人之所以为事者，必兴天下之利，除去天下之害。\n\n食者，国之宝也；兵者，国之爪也；城者，所以自守也。\n\n染于苍则苍，染于黄则黄，所入者变，其色亦变。\n\n万事莫贵于义。"},
17:{in:"《列子》是道家重要经典，以寓言故事阐发万物齐一、顺其自然之理。愚公移山、杞人忧天、歧路亡羊等成语皆出此书，想象奇瑰，寓意深远，被视为仅次于《庄子》的道家文学杰作。",th:"万物齐一，顺其自然。超越生死得失的达观态度，在寓言中领悟人生大智慧。",ex:"太行、王屋二山，方七百里，高万仞。北山愚公者，年且九十，面山而居，惩山北之塞，出入之迂也，聚室而谋曰：吾与汝毕力平险，可乎？\n\n杞国有人忧天地崩坠，身亡所寄，废寝食者。\n\n杨朱之弟曰布，衣素衣而出，天雨，脱素衣，服缁衣而反。\n\n歧路之中又有歧焉，吾不知所之，所以反也。\n\n天地无全功，万物无全用，人无全能。\n\n生非贵之所能存，身非爱之所能厚。"},
18:{in:"《晏子春秋》记载齐国名相晏婴的言行事迹，展现春秋时期卓越的外交智慧与政治风骨。晏子使楚、二桃杀三士等故事脍炙人口，以其机智善辩、不畏强权的人格魅力流传千古。",th:"以智慧和勇气捍卫国家尊严。外交辞令的艺术，进退有度的政治智慧。",ex:"橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。\n\n晏子使楚。楚人以晏子短，为小门于大门之侧而延晏子。晏子不入，曰：使狗国者从狗门入。\n\n国有三不祥：有贤而不知，一不祥；知而不用，二不祥；用而不任，三不祥。\n\n智者之举事必因理，理之所存，势之所就。\n\n谋度于义者必得，事因于民者必成。"},
19:{in:"《九歌》是屈原在楚地民间祭祀歌谣基础上加工创作的诗歌共十一篇，描绘楚地神话世界的瑰丽意境。东皇太一、湘君、湘夫人、山鬼等形象神秘华美，是中国祭祀文学的巅峰之作。",th:"人神之恋的美丽想象。在祭祀仪式中寄托对超越现实的美好向往，浪漫而神圣。",ex:"浴兰汤兮沐芳，华采衣兮若英。灵偃蹇兮姣服，芳菲菲兮满堂。\n\n帝子降兮北渚，目眇眇兮愁予。袅袅兮秋风，洞庭波兮木叶下。\n\n若有人兮山之阿，被薜荔兮带女萝。既含睇兮又宜笑，子慕予兮善窈窕。\n\n悲莫悲兮生别离，乐莫乐兮新相知。\n\n秋兰兮麋芜，罗生兮堂下。绿叶兮素华，芳菲菲兮袭予。\n\n青云衣兮白霓裳，举长矢兮射天狼。"},
20:{in:"《天问》是屈原创作的奇绝长诗，通篇以一百七十余个问题对天地万物的起源发出追问。从宇宙形成到历史传说，从自然现象到神话故事，展现了中国先秦时期最宏大深邃的哲学思考。",th:"对宇宙万物的大胆追问与怀疑精神。在不懈追问中展现的独立思考和探索勇气。",ex:"遂古之初，谁传道之？上下未形，何由考之？冥昭瞢暗，谁能极之？冯翼惟像，何以识之？\n\n圜则九重，孰营度之？惟兹何功，孰初作之？\n\n日月安属？列星安陈？\n\n女娲有体，孰制匠之？\n\n天命反侧，何罚何佑？\n\n薄暮雷电，归何忧？厥严不奉，帝何求？\n\n何所冬暖？何所夏寒？焉有石林？何兽能言？"},
21:{in:"《吕氏春秋》是吕不韦召集门客编纂的百科全书式著作，以道家思想为主干，兼收儒法墨兵各家之说。全书一百六十篇，二十余万言，体例宏大，是先秦杂家的集大成之作。",th:"兼收并蓄的学术胸怀。以务本思想为核心，融合各家之长，构建完整的治国理论体系。",ex:"流水不腐，户枢不蠹，动也。\n\n察己则可以知人，察今则可以知古。古今一也，人与我同耳。\n\n不知理义，生于不学。\n\n石可破也，而不可夺其坚；丹可磨也，而不可夺其赤。\n\n得言不可以不察。数传而白为黑，黑为白。\n\n天下非一人之天下也，天下之天下也。\n\n欲胜人者必先自胜，欲论人者必先自论，欲知人者必先自知。\n\n言之易，行之难。"},
22:{in:"《史记》是司马迁所著的中国第一部纪传体通史，记载上起黄帝下至汉武帝约三千年历史。被鲁迅誉为史家之绝唱，无韵之离骚，其叙事艺术与人物刻画达到了历史散文的最高峰。",th:"究天人之际，通古今之变，成一家之言。以史为镜，照见人性善恶与历史规律。",ex:"人固有一死，或重于泰山，或轻于鸿毛。\n\n王侯将相宁有种乎！\n\n风萧萧兮易水寒，壮士一去兮不复还！\n\n项庄舞剑，意在沛公。\n\n大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方。\n\n力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！\n\n桃李不言，下自成蹊。\n\n飞鸟尽，良弓藏；狡兔死，走狗烹。\n\n燕雀安知鸿鹄之志哉！\n\n不鸣则已，一鸣惊人。"},
23:{in:"《汉书》是班固所著的中国第一部纪传体断代史，记载西汉二百三十年历史。体例严谨，文辞雅正，与史记并称史汉，是中国正史写作的典范之作。",th:"以严谨的史笔记述一代兴衰，在客观叙事中寓褒贬于文字之间。",ex:"水至清则无鱼，人至察则无徒。\n\n百里不同风，千里不同俗。\n\n遗子黄金满籯，不如一经。\n\n过而不改，是谓过矣。\n\n前车之覆，后车之鉴。\n\n临渊羡鱼，不如退而结网。\n\n行百里者半九十。\n\n先发制人，后发制于人。\n\n难于古人交臂失之，是以临事而惧，好谋而成者也。"},
24:{in:"《古诗十九首》是汉代文人五言诗的代表作，作者不详，被刘勰誉为五言之冠冕。以朴素自然的语言抒发人生短暂、离愁别绪、功名渺茫等深沉感慨，标志着中国文人诗歌的成熟。",th:"人生苦短的深沉感慨。在离别与思念中体悟生命的无常与珍贵。",ex:"行行重行行，与君生别离。相去万余里，各在天一涯。道路阻且长，会面安可知？\n\n涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。\n\n人生天地间，忽如远行客。\n\n生年不满百，常怀千岁忧。昼短苦夜长，何不秉烛游！\n\n青青河畔草，郁郁园中柳。盈盈楼上女，皎皎当窗牖。\n\n明月何皎皎，照我罗床帏。忧愁不能寐，揽衣起徘徊。\n\n思君令人老，岁月忽已晚。弃捐勿复道，努力加餐饭。"},
25:{in:"《论衡》是王充所著的哲学著作，以唯物主义立场批判当时流行的天人感应和谶纬迷信。王充以怀疑精神和实证态度，对自然现象和社会问题提出了独特见解，是中国古代思想解放的先驱。",th:"追求真理的怀疑精神。不迷信权威，不盲从经书，以理性审视一切。",ex:"处尊居显，未必贤也；在下位卑，未必不肖也。\n\n实事疾妄，是对一切虚妄之说的有力反驳。\n\n人之死，犹火之灭也。火灭而耀不照，人死而知不慧。\n\n不学自知，不问自晓，古今行事，未之有也。\n\n知古不知今，谓之陆沉；知今不知古，谓之盲瞽。\n\n凡论事者，违实不引效验，则虽甘义繁说，众不见信。\n\n天道自然，非或为之。"},
26:{in:"《说文解字》是许慎编纂的中国第一部系统分析汉字字形的字书，收录九千三百余字，以小篆为标准字形，按照部首分类编排。是中国文字学的奠基之作，理解中华文明的钥匙。",th:"文字是文明的载体。每一个汉字都蕴含着先民的智慧与文化记忆。",ex:"仓颉之初作书，盖依类象形，故谓之文；其后形声相益，即谓之字。文者，物象之本；字者，言孳乳而浸多也。\n\n一，惟初太极，道立于一，造分天地，化成万物。\n\n天，颠也，至高无上，从一大。\n\n人，天地之性最贵者也。\n\n信，诚也。从人从言。\n\n武，楚庄王曰：夫武，定功戢兵，故止戈为武。\n\n明，照也。从月从囧。"},
27:{in:"《汉乐府》是汉代官方音乐机构采集整理的民歌，内容广泛，反映社会各阶层的生活面貌。长篇叙事诗《孔雀东南飞》是乐府诗的最高成就，以朴实的语言展现深刻的社会矛盾。",th:"以民歌反映民间疾苦与社会现实。乐府诗的现实主义精神是中国诗歌的重要传统。",ex:"上邪！我欲与君相知，长命无绝衰。山无陵，江水为竭，冬雷震震，夏雨雪，天地合，乃敢与君绝！\n\n江南可采莲，莲叶何田田。鱼戏莲叶间。\n\n青青园中葵，朝露待日晞。阳春布德泽，万物生光辉。\n\n少壮不努力，老大徒伤悲。\n\n客从远方来，遗我双鲤鱼。呼儿烹鲤鱼，中有尺素书。\n\n日出而作，日入而息。凿井而饮，耕田而食。帝力于我何有哉！"},
28:{in:"《出师表》是诸葛亮北伐前上呈后主刘禅的奏表，以恳切真挚的言辞表达忠诚报国之心。前后两表，一表恳切劝谏，一表慷慨悲壮，被誉为千古第一名文。",th:"鞠躬尽瘁，死而后已的忠贞品格。以恳切之言陈报国之志，千古忠臣的典范。",ex:"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。\n\n受任于败军之际，奉命于危难之间。\n\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。\n\n鞠躬尽瘁，死而后已。至于成败利钝，非臣之明所能逆睹也。\n\n今当远离，临表涕零，不知所言。"},
29:{in:"《过秦论》是贾谊所著的政论文名篇，以上中下三篇论述秦朝兴亡的历史教训。以磅礴的气势和深刻的分析，揭示了仁义不施而攻守之势异也的核心观点，是中国古代政论文的巅峰之作。",th:"以史为鉴的深刻教训。攻与守的战略转换，仁政是长治久安的根本。",ex:"及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。\n\n一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。\n\n秦人不暇自哀而后人哀之，后人哀之而不鉴之，亦使后人而复哀后人也。\n\n斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。\n\n仁义不施，攻守异势。"},
30:{in:"《盐铁论》是桓宽根据西汉盐铁会议记录整理的著作，记载了以桑弘羊为代表的政府官员与贤良文学之士之间关于盐铁专营等经济政策的大辩论，是研究汉代经济思想的重要文献。",th:"义利之辨的经济哲学。国家干预与自由民生的平衡，至今仍有现实意义。",ex:"富者田连阡陌，贫者无立锥之地。\n\n用约者国强，用奢者国亡。\n\n欲影正者端其表，欲下廉者先之身。\n\n世不患无法，而患无必行之法。\n\n治国者圆不失规，方不失矩。\n\n善为政者，弊则补之，倾则扶之。\n\n是以古者尚力务本而种树繁，躬耕趋时而衣食足。"},
31:{in:"《洛神赋》是曹植创作的辞赋名篇，描写人神相恋的凄美故事。以华美绝伦的辞藻描写洛神宓妃的绝世容颜，翩若惊鸿，婉若游龙，成为中国文学史上最美的女性形象描写。",th:"人神之恋的唯美想象。以绝世之美寄托理想与追求，在遗憾中升华情感。",ex:"翩若惊鸿，婉若游龙。荣曜秋菊，华茂春松。仿佛兮若轻云之蔽月，飘飖兮若流风之回雪。\n\n远而望之，皎若太阳升朝霞；迫而察之，灼若芙蕖出渌波。\n\n秾纤得衷，修短合度。肩若削成，腰如约素。延颈秀项，皓质呈露。\n\n凌波微步，罗袜生尘。动无常则，若危若安。进止难期，若往若还。\n\n恨人神之道殊兮，怨盛年之莫当。抗罗袂以掩涕兮，泪流襟之浪浪。\n\n悼良会之邈绝兮，哀一逝而异乡。无微情以效爱兮，献江南之明珰。"},
32:{in:"《文心雕龙》是刘勰所著的中国文学理论巨著，五十篇系统论述文学创作的原理方法。从文体辨析到创作技巧，从修辞艺术到审美标准，是中国古代最完整最深刻的文学理论体系。",th:"文学创作的系统理论。文以载道的文学观，追求内容与形式的完美统一。",ex:"登山则情满于山，观海则意溢于海。我才之多少，将与风云而并驱矣。\n\n操千曲而后晓声，观千剑而后识器。\n\n情者文之经，辞者理之纬。经正而后纬成，理定而后辞畅。\n\n意翻空而易奇，言征实而难巧。\n\n句有可削，足见其疏；字不得减，乃知其密。\n\n是以陶钧文思，贵在虚静，疏悰理秽，澡雪精神。\n\n情以物迁，辞以情发。"},
33:{in:"《诗品》是钟嵘所著的诗歌评论著作，将两汉至梁代的一百二十二位诗人分为上中下三品加以评述。以品第论高下，开创了中国诗歌批评的品评传统。",th:"以审美标准评判诗歌高下。推崇自然清新的诗风，反对过分用典和声律束缚。",ex:"气之动物，物之感人，故摇荡性情，形诸舞咏。\n\n干之以风力，润之以丹彩，使味之者无极，闻之者动心，是诗之至也。\n\n观古今胜语，多非补假，皆由直寻。\n\n思君如流水，既是即目；高台多悲风，亦惟所见。\n\n陈思之于文章也，譬人伦之有周孔，鳞羽之有龙凤。\n\n曹公古直，甚有悲凉之句。"},
34:{in:"《世说新语》是刘义庆编纂的志人笔记小说，记载东汉末至东晋间士族名人的轶闻趣事。以简洁精妙的文笔刻画魏晋名士的风度才情，是魏晋风流的生动画卷。",th:"魏晋风度与名士精神。率真洒脱、不拘礼法的人生态度，追求精神的自由与超越。",ex:"王子猷居山阴，夜大雪，眠觉，开室，命酌酒。四望皎然，因起彷徨，咏左思招隐诗。忽忆戴安道，时戴在剡，即便夜乘小船就之。经宿方至，造门不前而返。人问其故，王曰：吾本乘兴而行，兴尽而返，何必见戴？\n\n小时了了，大未必佳。\n\n飘若游云，矫若惊龙。\n\n吾本乘兴而来，兴尽而返，何必见戴？\n\n胸中块垒，故须酒浇之。"},
35:{in:"《搜神记》是干宝所著的志怪小说集，记载神仙鬼怪、灵异奇闻。以文学笔法记录民间传说和神话故事，是中国志怪小说的代表作，对后世聊斋等影响深远。",th:"在怪力乱神中寄托人间真情。超越生死的人鬼之恋，奇幻想象中的人性光辉。",ex:"盘瓠衔人头造王门，王怪之。\n\n东海孝妇，冤死之后，郡中枯旱三年，后太守至，杀牛祭妇冢，大雨倾盆。\n\n吴王小女紫玉与韩重相悦，未成婚而亡。重往吊之，玉魂从墓中出，流涕而歌。\n\n天下之理，不可穷诘；鬼神之事，圣人存而不论。\n\n虽涉神怪，亦以见民情风俗，非徒为怪诞之说也。"},
36:{in:"《陶渊明集》收录东晋大诗人陶渊明的诗文作品。陶渊明不为五斗米折腰，归隐田园，以质朴自然的诗风开创田园诗派，其桃花源记构建了中国文人的理想家园。",th:"归隐田园的超脱人生。不为五斗米折腰的独立人格，桃花源中的乌托邦理想。",ex:"结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。\n\n归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。\n\n土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n\n不为五斗米折腰。"},
37:{in:"《阮籍咏怀诗》是阮籍创作的八十二首五言诗，以隐晦曲折的笔法表达对现实的不满与内心的苦闷。阮籍为竹林七贤之一，其诗作被誉为旷代绝作。",th:"在压抑中寻找心灵自由。以酒和诗对抗虚伪的礼教，维护内心最后的精神领地。",ex:"夜中不能寐，起坐弹鸣琴。薄帷鉴明月，清风吹我襟。孤鸿号外野，翔鸟鸣北林。徘徊将何见？忧思独伤心。\n\n天网弥四野，六翮掩不舒。\n\n终身履薄冰，谁知我心焦。\n\n嘉时在今辰，零雨洒尘埃。临路望所思，日夕复不来。\n\n人生若尘露，天道邈悠悠。\n\n繁华有憔悴，堂上生荆杞。"},
38:{in:"《嵇康集》收录竹林七贤之首嵇康的诗文作品。嵇康以不羁的才华和刚直的品格著称，因不满司马氏统治而被杀，临刑前从容弹奏广陵散，成为中国文人风骨的永恒象征。",th:"宁折不弯的文人风骨。以独立人格对抗强权，以艺术追求超越政治压迫。",ex:"目送归鸿，手挥五弦。俯仰自得，游心太玄。嘉彼钓叟，得鱼忘筌。郢人逝矣，谁与尽言。\n\n养生之法，莫先于养神。精神之于形骸，犹国之有君也。\n\n非汤武而薄周孔，越名教而任自然。\n\n广陵散于今绝矣！\n\n越名教而任自然，审贵贱而通物情。\n\n夫称君子者，心无措乎是非，而行不违乎道者也。"},
39:{in:"《水经注》是郦道元为《水经》所作的注释，实际是一部以水道为纲的地理名著。以优美的文笔描述各地山川风物、历史传说，既是地理学巨著，也是文学游记的典范。",th:"以地理为脉络的文化记忆。在山川河流中追寻历史足迹，科学与文学完美融合。",ex:"自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。\n\n每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：巴东三峡巫峡长，猿鸣三声泪沾裳。\n\n春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间。清荣峻茂，良多趣味。"},
40:{in:"《木兰辞》是北朝乐府民歌中的杰作，讲述花木兰女扮男装替父从军的故事。以简练生动的语言塑造了勇敢、孝顺、坚强的巾帼英雄形象，千百年来广为传颂。",th:"孝与忠的完美结合。巾帼不让须眉的女性力量，打破性别藩篱的英雄传奇。",ex:"唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。\n\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n\n开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。\n\n出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。\n\n雄兔脚扑朔，雌兔眼迷离。双兔傍地走，安能辨我是雄雌？"},
41:{in:"《孔雀东南飞》是中国文学史上第一部长篇叙事诗，讲述焦仲卿与刘兰芝的爱情悲剧。以五言诗的形式展现了一对青年男女在封建礼教压迫下的悲惨命运，深刻控诉了旧制度的罪恶。",th:"对封建礼教的血泪控诉。真挚爱情与残酷现实的冲突，自由意志与命运的抗争。",ex:"孔雀东南飞，五里一徘徊。十三能织素，十四学裁衣，十五弹箜篌，十六诵诗书。\n\n鸡鸣入机织，夜夜不得息。三日断五匹，大人故嫌迟。\n\n君当作磐石，妾当作蒲苇。蒲苇纫如丝，磐石无转移。\n\n揽裙脱丝履，举身赴清池。\n\n徘徊庭树下，自挂东南枝。\n\n多谢后世人，戒之慎勿忘。"},
42:{in:"《昭明文选》是南朝梁昭明太子萧统编纂的中国现存最早的诗文总集，收录先秦至梁代一百三十余位作家的七百余篇作品。以其严格的选文标准影响了千余年的文学审美。",th:"文学选本的典范之作。事出于沉思，义归乎翰藻的选文标准，确立了纯文学的观念。",ex:"事出于沉思，义归乎翰藻。\n\n赋者，铺也。铺采摛文，体物写志也。\n\n选文以雅正为宗，辞采为辅，义理为本。\n\n文章者，盖情性之风标，神明之律吕也。\n\n历观文苑，泛览辞林，未尝不心游目想，移晷忘倦。"},
43:{in:"《陈情表》是李密上呈晋武帝的奏表，以恳切真挚的言辞请求辞官赡养祖母。文章情真意切，感人肺腑，被誉为读之不哭者不孝的千古名篇。",th:"以孝道为核心的真情告白。在忠孝之间寻找人性化的平衡，亲情胜过功名。",ex:"臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。\n\n茕茕孑立，形影相吊。\n\n但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。\n\n乌鸟私情，愿乞终养。\n\n是臣尽节于陛下之日长，报养刘之日短也。"},
44:{in:"《归园田居》是陶渊明辞官归隐后创作的组诗，共五首，描绘田园生活的宁静与美好。以朴素自然的语言表达回归自然的喜悦，是中国田园诗的开山之作。",th:"回归自然的人生选择。在田园劳作中找到心灵的安宁与生命的本真。",ex:"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。\n\n方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。\n\n户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。"},
45:{in:"《饮酒·其五》是陶渊明饮酒组诗中最著名的一首，以结庐在人境开篇，以欲辨已忘言收束，展现了诗人超然物外的精神境界。采菊东篱下，悠然见南山成为千古绝唱。",th:"物我两忘的超然境界。在平凡生活中领悟宇宙真意，以宁静之心对抗喧嚣尘世。",ex:"结庐在人境，而无车马喧。问君何能尔？心远地自偏。\n\n采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。\n\n秋菊有佳色，裛露掇其英。泛此忘忧物，远我遗世情。\n\n日入群动息，归鸟趋林鸣。啸傲东轩下，聊复得此生。"},
46:{in:"《滕王阁序》是王勃在洪州滕王阁宴会上即兴创作的骈文名篇。全篇文采斐然，辞藻华美，以落霞与孤鹜齐飞，秋水共长天一色的千古名句描绘了赣江秋景的壮美。",th:"少年天才的旷世才华。在华丽骈文中寄托人生感慨与建功立业的雄心壮志。",ex:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。\n\n老当益壮，宁移白首之心？穷且益坚，不坠青云之志。\n\n天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。\n\n关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。\n\n物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。\n\n东隅已逝，桑榆非晚。\n\n无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。"},
47:{in:"《春江花月夜》是张若虚仅存的两首诗之一，却被闻一多誉为诗中的诗，顶峰上的顶峰。以春江花月夜五种意象交织，构建了一个空灵澄澈的诗意世界，被誉为孤篇压全唐。",th:"宇宙意识与人生感悟的完美融合。在永恒的江月面前，人类情感显得既渺小又珍贵。",ex:"春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明！\n\n江天一色无纤尘，皎皎空中孤月轮。江畔何人初见月？江月何年初照人？\n\n人生代代无穷已，江月年年望相似。不知江月待何人，但见长江送流水。\n\n此时相望不相闻，愿逐月华流照君。鸿雁长飞光不度，鱼龙潜跃水成文。\n\n不知乘月几人归，落月摇情满江树。"},
48:{in:"《李白全集》收录诗仙李白近千首诗歌。李白以豪放飘逸的诗风、天马行空的想象、蔑视权贵的傲骨，成为中国浪漫主义诗歌的巅峰。将进酒、静夜思、蜀道难等名篇家喻户晓。",th:"自由不羁的灵魂与超越凡俗的想象。在酒与诗中追求精神的绝对解放。",ex:"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。\n\n床前明月光，疑是地上霜。举头望明月，低头思故乡。\n\n长风破浪会有时，直挂云帆济沧海。\n\n两岸猿声啼不住，轻舟已过万重山。\n\n举杯邀明月，对影成三人。\n\n安能摧眉折腰事权贵，使我不得开心颜！\n\n飞流直下三千尺，疑是银河落九天。"},
49:{in:"《杜甫全集》收录诗圣杜甫一千四百余首诗歌。杜甫以沉郁顿挫的笔调记录安史之乱前后唐代社会的真实面貌，被称为诗史。其忧国忧民的情怀与精湛的诗歌技艺，使之成为中国现实主义的最高峰。",th:"忧国忧民的深沉情怀。以诗歌记录时代苦难，在悲天悯人中展现人性的光辉。",ex:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。\n\n安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！\n\n无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。\n\n会当凌绝顶，一览众山小。\n\n星垂平野阔，月涌大江流。\n\n出师未捷身先死，长使英雄泪满襟。\n\n此曲只应天上有，人间能得几回闻。"},
50:{in:"《白居易集》收录唐代大诗人白居易三千余首诗歌。白居易主张文章合为时而著，歌诗合为事而作，以通俗易懂的语言反映民间疾苦和社会问题，是新乐府运动的倡导者。",th:"文章合为时而著的现实主义精神。以平易近人的语言传递深刻的人文关怀。",ex:"离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。\n\n同是天涯沦落人，相逢何必曾相识！\n\n千呼万唤始出来，犹抱琵琶半遮面。\n\n在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。\n\n卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。\n\n乱花渐欲迷人眼，浅草才能没马蹄。最爱湖东行不足，绿杨阴里白沙堤。\n\n上穷碧落下黄泉，两处茫茫皆不见。"},
51:{in:"《王维集》收录诗佛王维的诗文作品。王维以诗中有画、画中有诗的艺术境界著称，其山水田园诗空灵澄澈，充满禅意。红豆生南国、独在异乡为异客等名句广为传唱。",th:"诗中有画的空灵境界。以禅意入诗，在山水之间体悟生命的宁静与超脱。",ex:"独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。\n\n空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。\n\n红豆生南国，春来发几枝。愿君多采撷，此物最相思。\n\n大漠孤烟直，长河落日圆。\n\n行到水穷处，坐看云起时。\n\n渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。"},
52:{in:"《孟浩然集》收录唐代山水田园诗人孟浩然的诗歌作品。孟浩然一生未仕，以布衣终身，其诗清淡自然，与王维并称王孟。春眠不觉晓、野旷天低树等名句意境深远。",th:"以布衣之身写山水之真。在淡泊中见深远，于自然中得真趣。",ex:"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。\n\n故人具鸡黍，邀我至田家。绿树村边合，青山郭外斜。开轩面场圃，把酒话桑麻。待到重阳日，还来就菊花。\n\n野旷天低树，江清月近人。\n\n微云淡河汉，疏雨滴梧桐。\n\n人事有代谢，往来成古今。江山留胜迹，我辈复登临。"},
53:{in:"《李商隐诗集》收录晚唐诗人李商隐的诗歌作品。以无题诗著称，意境朦胧迷离，情感缠绵悱恻。春蚕到死丝方尽、蜡炬成灰泪始干等名句成为千古爱情绝唱。",th:"朦胧唯美的情感世界。以隐晦曲折的笔法表达深沉复杂的内心体验。",ex:"相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。\n\n锦瑟无端五十弦，一弦一柱思华年。庄生晓梦迷蝴蝶，望帝春心托杜鹃。\n\n此情可待成追忆，只是当时已惘然。\n\n昨夜星辰昨夜风，画楼西畔桂堂东。身无彩凤双飞翼，心有灵犀一点通。\n\n夕阳无限好，只是近黄昏。\n\n嫦娥应悔偷灵药，碧海青天夜夜心。\n\n何当共剪西窗烛，却话巴山夜雨时。"},
54:{in:"《杜牧诗集》收录晚唐诗人杜牧的诗歌作品。杜牧诗风清丽俊逸，咏史绝句尤为出色。千里莺啼绿映红、东风不与周郎便等名句将写景与咏史完美结合。",th:"以史入诗的深沉感慨。在清丽俊逸中寄托对历史兴亡的深刻思考。",ex:"远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。\n\n折戟沉沙铁未销，自将磨洗认前朝。东风不与周郎便，铜雀春深锁二乔。\n\n千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。\n\n烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。\n\n二十四桥明月夜，玉人何处教吹箫。"},
55:{in:"《长恨歌》是白居易创作的长篇叙事诗，讲述唐明皇与杨贵妃的爱情悲剧。以天长地久有时尽、此恨绵绵无绝期收束全篇，将帝妃之恋升华为永恒的爱情绝唱。",th:"帝王爱情的千古悲歌。在历史悲剧中歌颂永恒的爱情，在遗憾中升华人性之美。",ex:"汉皇重色思倾国，御宇多年求不得。杨家有女初长成，养在深闺人未识。天生丽质难自弃，一朝选在君王侧。回眸一笑百媚生，六宫粉黛无颜色。\n\n在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。\n\n春风桃李花开日，秋雨梧桐叶落时。\n\n蜀江水碧蜀山青，圣主朝朝暮暮情。行宫见月伤心色，夜雨闻铃肠断声。\n\n玉容寂寞泪阑干，梨花一枝春带雨。"},
56:{in:"《琵琶行》是白居易创作的长篇叙事诗，以浔阳江头夜送客为背景，通过琵琶女的演奏和身世自述，引发诗人同是天涯沦落人的深切共鸣。",th:"天涯沦落人的心灵共鸣。音乐之美与人生之悲的完美交融，艺术家的孤独与知音。",ex:"浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。\n\n千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。\n\n大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。\n\n别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。\n\n同是天涯沦落人，相逢何必曾相识！\n\n座中泣下谁最多？江州司马青衫湿。"},
57:{in:"《韩愈文集》收录唐宋八大家之首韩愈的散文作品。韩愈是古文运动的倡导者，以文从字顺的散体文反对骈文的浮华，其散文气势磅礴、说理透彻，被苏轼誉为文起八代之衰。",th:"古文运动的革新精神。以质朴刚健的散文对抗浮华骈文，恢复文章的载道功能。",ex:"世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祇辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n\n师者，所以传道受业解惑也。\n\n闻道有先后，术业有专攻。\n\n业精于勤，荒于嬉；行成于思，毁于随。\n\n大凡物不得其平则鸣。\n\n文以载道，辞必己出。\n\n书山有路勤为径，学海无涯苦作舟。"},
58:{in:"《柳宗元文集》收录唐宋八大家之一柳宗元的散文作品。柳宗元以永州八记为代表的山水游记达到了情景交融的艺术高峰，其寓言散文如黔之驴、捕蛇者说寓意深刻。",th:"以山水寄托贬谪之悲。在自然中寻找心灵的慰藉，以寓言讽喻社会现实。",ex:"潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽，似与游者相乐。\n\n捕蛇者说——苛政猛于虎也。\n\n黔无驴，有好事者船载以入。至则无可用，放之山下。虎见之，庞然大物也，以为神。\n\n孤舟蓑笠翁，独钓寒江雪。\n\n城上高楼接大荒，海天愁思正茫茫。\n\n千山鸟飞绝，万径人踪灭。"},
59:{in:"《刘禹锡集》收录唐代诗人刘禹锡的诗文作品。刘禹锡因参与永贞革新被贬谪二十余年，却始终保持着积极乐观的精神。沉舟侧畔千帆过、自古逢秋悲寂寥等名句豪迈旷达。",th:"在逆境中保持乐观豁达。以坚定的信念和不屈的精神面对命运的挫折。",ex:"自古逢秋悲寂寥，我言秋日胜春朝。晴空一鹤排云上，便引诗情到碧霄。\n\n沉舟侧畔千帆过，病树前头万木春。\n\n旧时王谢堂前燕，飞入寻常百姓家。\n\n东边日出西边雨，道是无晴却有晴。\n\n山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。\n\n莫道桑榆晚，为霞尚满天。\n\n千淘万漉虽辛苦，吹尽狂沙始到金。"},
60:{in:"《寒山诗》收录唐代隐士寒山的诗歌作品。寒山隐居天台山，以通俗直白的语言写作禅诗三百余首，在唐代并不受重视，却在日本和欧美产生了深远影响，成为禅宗文学的瑰宝。",th:"以诗悟道的禅宗精神。在山林隐居中体悟生命的本真，以朴素语言传达深刻哲理。",ex:"吾心似秋月，碧潭清皎洁。无物堪比伦，教我如何说。\n\n杳杳寒山道，落落冷涧滨。啾啾常有鸟，寂寂更无人。淅淅风吹面，纷纷雪积身。朝朝不见日，岁岁不知春。\n\n有人来骂我，分明了了知。虽然不应对，却是得便宜。\n\n吾家好隐沦，居处绝嚣尘。伐木丁丁响，空山寂寂春。\n\n可贵天然物，独一无伴侣。觅他不可见，出入无门户。"},
61:{in:"《王昌龄诗集》收录唐代边塞诗人王昌龄的诗歌，以七绝著称，被誉为七绝圣手。出塞秦时明月汉时关被誉为唐人七绝压卷之作，以雄浑壮阔的笔调描绘边塞风光与征人情怀。",th:"边塞诗的雄浑壮美。在烽火边关中抒发家国情怀，以壮阔笔调歌颂英雄气概。",ex:"秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。\n\n闺中少妇不曾愁，春日凝妆上翠楼。忽见陌头杨柳色，悔教夫婿觅封侯。\n\n寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。\n\n黄沙百战穿金甲，不破楼兰终不还。\n\n大漠风尘日色昏，红旗半卷出辕门。前军夜战洮河北，已报生擒吐谷浑。"},
62:{in:"《岑参诗集》收录唐代边塞诗人岑参的诗歌。岑参两度出塞，亲历西域风光，以奇峭瑰丽的笔触描绘大漠雪山。忽如一夜春风来，千树万树梨花开成为咏雪千古绝唱。",th:"以奇绝想象描绘壮美边塞。在极端自然环境中感受生命的壮烈与诗意。",ex:"北风卷地白草折，胡天八月即飞雪。忽如一夜春风来，千树万树梨花开。散入珠帘湿罗幕，狐裘不暖锦衾薄。\n\n轮台东门送君去，去时雪满天山路。山回路转不见君，雪上空留马行处。\n\n火山云雾烘然在，征马到边秋草白。\n\n功名只向马上取，真是英雄一丈夫。\n\n故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安。"},
63:{in:"《高适诗集》收录唐代边塞诗人高适的诗歌。高适以慷慨悲壮的笔调描写边塞生活和征人思乡，燕歌行是其代表作，以战士军前半死生，美人帐下犹歌舞的对比揭露军中不平。",th:"以沉雄笔调描写边塞之苦。在壮烈与悲凉之间展现真实的人性与社会矛盾。",ex:"汉家烟尘在东北，汉将辞家破残贼。男儿本自重横行，天子非常赐颜色。\n\n战士军前半死生，美人帐下犹歌舞。大漠穷秋塞草腓，孤城落日斗兵稀。\n\n莫愁前路无知己，天下谁人不识君！\n\n故乡今夜思千里，霜鬓明朝又一年。\n\n千里黄云白日曛，北风吹雁雪纷纷。"},
64:{in:"《李贺诗集》收录唐代诗人李贺的诗歌作品。李贺被称为诗鬼，以奇诡瑰丽的想象和浓烈幽艳的色彩著称。其诗意境独特，黑云压城城欲摧、天若有情天亦老等名句震撼人心。",th:"鬼才诗人的奇幻想象。以超现实的意象和浓烈色彩构建独特的诗境，在死亡与美之间徘徊。",ex:"黑云压城城欲摧，甲光向日金鳞开。角声满天秋色里，塞上燕脂凝夜紫。\n\n衰兰送客咸阳道，天若有情天亦老。携盘独出月荒凉，渭城已远波声小。\n\n大漠沙如雪，燕山月似钩。何当金络脑，快走踏清秋。\n\n我有迷魂招不得，雄鸡一声天下白。\n\n女娲炼石补天处，石破天惊逗秋雨。\n\n报君黄金台上意，提携玉龙为君死。"},
65:{in:"《唐传奇》是唐代文言短篇小说的统称，标志着中国小说艺术的成熟。从爱情传奇如莺莺传、李娃传到豪侠传奇如虬髯客传、聂隐娘，唐传奇以文采斐然的叙事开创了中国小说的黄金时代。",th:"中国小说艺术的成熟与自觉。以虚构叙事探索人性深度，爱情、侠义、志怪三大主题影响深远。",ex:"崔莺莺与张生的爱情故事——待月西厢下，迎风户半开。拂墙花影动，疑是玉人来。\n\n虬髯客传——虬髯客见李世民真命天子，遂放弃逐鹿中原之志，以全部家财赠李靖夫妇，远赴海外另立王国。\n\n南柯一梦——淳于棼醉梦入槐安国，历经荣华富贵，醒来方知不过蚁穴之中。\n\n红线女——田承嗣欲夺潞州，红线夜行数百里，盗其枕边金盒以警示之。"},
66:{in:"《游子吟》是孟郊创作的五言古诗，以慈母手中线、游子身上衣的朴素比喻，表达了母亲对远行儿女的深沉爱意。短短六句三十字，却成为歌颂母爱的千古绝唱。",th:"母爱的伟大与无私。以最朴素的语言表达最深沉的情感，人间至情莫过于此。",ex:"慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。\n\n孟郊一生坎坷，五十岁方中进士。此诗作于他赴任溧阳尉时，将母亲接到任上，有感而发。诗以寸草与春晖为喻，言子女微薄之心意，难以报答母亲如春日阳光般深厚的恩情。\n\n千百年来，此诗打动了无数游子的心灵，成为中国歌颂母爱的经典之作。"},
67:{in:"《阿房宫赋》是杜牧创作的辞赋名篇，以秦始皇修建阿房宫的奢华为题材，以夸张铺陈的手法描写宫殿的壮美与人民的苦难，最终得出后人哀之而不鉴之，亦使后人而复哀后人也的历史教训。",th:"以古喻今的深刻警示。奢华亡国的历史教训，对当政者的警钟长鸣。",ex:"六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁。\n\n燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。\n\n灭六国者六国也，非秦也。族秦者秦也，非天下也。\n\n后人哀之而不鉴之，亦使后人而复哀后人也。"},
68:{in:"《师说》是韩愈论述教师作用和从师之道的著名散文，针对当时士大夫耻于从师的社会风气而作。以犀利的议论和严密的逻辑阐述了道之所存、师之所存的道理。",th:"尊师重道的教育理念。学无止境，不耻下问，知识面前人人平等。",ex:"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。\n\n生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。\n\n是故无贵无贱，无长无少，道之所存，师之所存也。\n\n闻道有先后，术业有专攻，如是而已。\n\n弟子不必不如师，师不必贤于弟子。"},
69:{in:"《花间集》是五代后蜀赵崇祚编纂的词集，收录温庭筠、韦庄等十八位词人的五百首词作。以婉约绮丽的风格描写花前月下、儿女情长，是婉约词的源头和典范。",th:"婉约词的开山之作。以精致的语言描写细腻的情感，开创中国词学的柔美传统。",ex:"小山重叠金明灭，鬓云欲度香腮雪。懒起画蛾眉，弄妆梳洗迟。照花前后镜，花面交相映。\n\n人人尽说江南好，游人只合江南老。春水碧于天，画船听雨眠。垆边人似月，皓腕凝霜雪。\n\n梧桐树，三更雨，不道离情正苦。一叶叶，一声声，空阶滴到明。\n\n花间一壶酒，独酌无相亲。举杯邀明月，对影成三人。\n\n满目山河空念远，落花风雨更伤春。不如怜取眼前人。"},
70:{in:"《李煜词集》收录南唐后主李煜的词作。李煜以亡国之君的身份写出千古绝唱，把词从花间樽前的娱乐文体提升为抒发深沉人生感慨的文学形式，被誉为千古词帝。",th:"亡国之痛铸就千古词章。以血泪写就的词作，将个人悲剧升华为永恒的艺术。",ex:"春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。\n\n帘外雨潺潺，春意阑珊。罗衾不耐五更寒。梦里不知身是客，一晌贪欢。\n\n剪不断，理还乱，是离愁。别是一般滋味在心头。\n\n无言独上西楼，月如钩。寂寞梧桐深院锁清秋。\n\n林花谢了春红，太匆匆。无奈朝来寒雨晚来风。"},
71:{in:"《花蕊夫人宫词》是五代前蜀花蕊夫人徐氏所作的宫词百首，以细腻的笔触描写蜀宫生活的奢华与幽雅。花蕊夫人以女性特有的敏感和细腻，记录了一个消逝王朝最后的繁华。",th:"以女性视角书写宫廷生活。在华美描写的背后，是对时光易逝、繁华难驻的深沉感慨。",ex:"龙池九曲远相通，杨柳丝牵两岸风。长似江南好风景，画船来去碧波中。\n\n初离碧海银蟾跃，已到青天玉斗横。且待夜深明月去，试看涵泳几多星。\n\n月头支给买花钱，满殿宫人近数千。遇着唱名多不语，含羞走过御床前。\n\n春日龙池春水平，几枝杨柳近宫城。莫教惊起鸳鸯去，水上新来好听声。"},
72:{in:"《苏轼全集》收录北宋文豪苏轼的诗文词作品。苏轼是中国文学史上罕见的全才，诗词文书画皆精。其词开豪放一派，大江东去的磅礴气势与但愿人长久的温情细腻完美共存。",th:"旷达超然的人生态度。在挫折中保持乐观，以豁达胸襟包容人生的起伏与无常。",ex:"大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。\n\n明月几时有？把酒问青天。不知天上宫阙，今夕是何年。但愿人长久，千里共婵娟。\n\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。回首向来萧瑟处，归去，也无风雨也无晴。\n\n十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。\n\n横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。\n\n拣尽寒枝不肯栖，寂寞沙洲冷。"},
73:{in:"《李清照集》收录宋代女词人李清照的诗词作品。李清照被誉为千古第一才女，以婉约词著称。前期词作清新明媚，后期因国破家亡而沉郁凄苦，寻寻觅觅冷冷清清道尽了人间悲凉。",th:"女性文学的巅峰之作。以细腻敏锐的感受力捕捉情感的微妙变化，从闺阁之雅到家国之悲。",ex:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。\n\n知否，知否？应是绿肥红瘦。\n\n此情无计可消除，才下眉头，却上心头。\n\n生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。\n\n莫道不销魂，帘卷西风，人比黄花瘦。\n\n只恐双溪舴艋舟，载不动许多愁。\n\n花自飘零水自流。一种相思，两处闲愁。"},
74:{in:"《辛弃疾词集》收录南宋爱国词人辛弃疾的词作。辛弃疾以武将之身写文人词章，将豪放词推向极致。其词气势雄浑，意境开阔，既有醉里挑灯看剑的豪迈，又有蓦然回首那人却在灯火阑珊处的柔情。",th:"壮志未酬的英雄情怀。以词为剑，在豪迈与悲壮中抒发报国无门的愤懑。",ex:"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声。沙场秋点兵。\n\n众里寻他千百度，蓦然回首，那人却在灯火阑珊处。\n\n千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。\n\n少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。\n\n想当年，金戈铁马，气吞万里如虎。\n\n青山遮不住，毕竟东流去。\n\n了却君王天下事，赢得生前身后名。可怜白发生！"},
75:{in:"《陆游诗集》收录南宋爱国诗人陆游近万首诗歌，是中国诗歌史上存诗最多的诗人。陆游一生以北伐中原、统一祖国为志，王师北定中原日，家祭无忘告乃翁成为千古绝唱。",th:"至死不渝的爱国情怀。以诗歌为武器，一生呐喊着收复故土的信念。",ex:"死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。\n\n红酥手，黄縢酒，满城春色宫墙柳。东风恶，欢情薄。一怀愁绪，几年离索。错、错、错！\n\n驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。\n\n山重水复疑无路，柳暗花明又一村。\n\n小楼一夜听春雨，深巷明朝卖杏花。\n\n夜阑卧听风吹雨，铁马冰河入梦来。"},
76:{in:"《柳永词集》收录北宋词人柳永的词作。柳永是第一位大量创作慢词的词人，以市井平民的视角描写都市繁华与儿女情长。凡有井水饮处，皆能歌柳词，其影响力在当时无出其右。",th:"市民文化的代言者。以通俗流畅的语言歌咏市井生活与男女之情，开创词的新天地。",ex:"寒蝉凄切，对长亭晚，骤雨初歇。都门帐饮无绪，留恋处，兰舟催发。执手相看泪眼，竟无语凝噎。念去去，千里烟波，暮霭沉沉楚天阔。\n\n多情自古伤离别，更那堪冷落清秋节！今宵酒醒何处？杨柳岸，晓风残月。\n\n衣带渐宽终不悔，为伊消得人憔悴。\n\n有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。\n\n想佳人妆楼颙望，误几回天际识归舟。"},
77:{in:"《欧阳修文集》收录北宋文坛领袖欧阳修的散文作品。欧阳修是宋代古文运动的核心人物，其散文平易自然、流畅婉转。醉翁之意不在酒，在乎山水之间也成为千古名句。",th:"文坛领袖的革新精神。以平易自然的文风变革散文创作，知山水之乐亦知人文之忧。",ex:"醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n\n环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。\n\n人生自是有情痴，此恨不关风与月。\n\n庭院深深深几许，杨柳堆烟，帘幕无重数。\n\n去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。\n\n泪眼问花花不语，乱红飞过秋千去。"},
78:{in:"《王安石文集》收录北宋政治家、文学家王安石的诗文作品。王安石以变法著称于世，其诗文既有政治家的锐气，又有文学家的才情。春风又绿江南岸，明月何时照我还传诵至今。",th:"变革者的文学表达。以诗文寄托改革理想和人生感慨，在雄健中见细腻。",ex:"春风又绿江南岸，明月何时照我还？\n\n飞来山上千寻塔，闻说鸡鸣见日升。不畏浮云遮望眼，自缘身在最高层。\n\n千门万户曈曈日，总把新桃换旧符。\n\n墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。\n\n世之奇伟、瑰怪、非常之观，常在于险远，而人之所罕至焉，故非有志者不能至也。\n\n天变不足畏，祖宗不足法，人言不足恤。"},
79:{in:"《黄庭坚诗集》收录北宋诗人黄庭坚的诗歌作品。黄庭坚是江西诗派的开创者，以拗折峭拔的诗风和学问为诗的创作方法著称，与苏轼齐名并称苏黄。",th:"以学问入诗的创新精神。在诗歌创作中追求独特的语言风格和深厚的文化底蕴。",ex:"落木千山天远大，澄江一道月分明。\n\n桃李春风一杯酒，江湖夜雨十年灯。\n\n我居北海君南海，寄雁传书谢不能。\n\n痴儿了却公家事，快阁东西倚晚晴。\n\n春未老，风细柳斜斜。半壕春水一城花。烟雨暗千家。\n\n闭门觅句陈无己，对客挥毫秦少游。"},
80:{in:"《范仲淹文集》收录北宋名臣范仲淹的诗文作品。范仲淹以先天下之忧而忧、后天下之乐而乐的胸怀著称，其岳阳楼记是中国散文史上的不朽名篇。",th:"先忧后乐的家国情怀。以天下为己任的政治理想，是中国士大夫精神的最高表达。",ex:"先天下之忧而忧，后天下之乐而乐乎！\n\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯。\n\n不以物喜，不以己悲。居庙堂之高则忧其民，处江湖之远则忧其君。\n\n塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。\n\n碧云天，黄叶地。秋色连波，波上寒烟翠。\n\n浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地。人不寐，将军白发征夫泪。"},
81:{in:"《晏殊词集》收录北宋词人晏殊的词作。晏殊官至宰相，其词多写富贵闲适的生活情趣，以温润秀洁的格调著称。无可奈何花落去、似曾相识燕归来是其最具代表性的名句。",th:"富贵闲雅中的淡淡忧伤。以含蓄蕴藉的笔法表达对时光流逝的感慨。",ex:"一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。\n\n昨夜西风凋碧树，独上高楼，望尽天涯路。欲寄彩笺兼尺素，山长水阔知何处！\n\n满目山河空念远，落花风雨更伤春。不如怜取眼前人。\n\n绿杨芳草长亭路，年少抛人容易去。楼头残梦五更钟，花底离愁三月雨。"},
82:{in:"《周邦彦词集》收录北宋词人周邦彦的词作。周邦彦被尊为词家之冠，以精巧的章法结构和富丽的语言技巧著称。其词音律和谐、用典精妙，是婉约词集大成者。",th:"词学技巧的集大成者。以精工密丽的语言和复杂的章法结构，将婉约词推向艺术巅峰。",ex:"叶上初阳干宿雨。水面清圆，一一风荷举。\n\n并刀如水，吴盐胜雪，纤手破新橙。锦幄初温，兽香不断，相对坐调笙。\n\ntelecommunications长亭路，年去岁来，应折柔条过千尺。\n\n月皎惊乌栖不定。更漏将残，辘轳牵金井。\n\n怨怀无托。嗟情人断来，信音辽邈。\n\n当时相候赤阑桥，今日独寻黄叶路。"},
83:{in:"《姜夔词集》收录南宋词人姜夔的词作。姜夔精通音律，以清空骚雅的风格在词坛独树一帜。其自度曲暗香、疏影以梅花为题，被誉为咏物词的绝唱。",th:"清雅绝俗的审美追求。以音乐家的敏感和诗人的才情创造独特的词境。",ex:"旧时月色，算几番照我，梅边吹笛。唤起玉人，不管清寒与攀摘。\n\n苔枝缀玉，有翠禽小小，枝上同宿。客里相逢，篱角黄昏，无言自倚修竹。\n\n二十四桥仍在，波心荡、冷月无声。念桥边红药，年年知为谁生！\n\n肥水东流无尽期，当初不合种相思。\n\n暗香浮动月黄昏——疏影横斜水清浅。"},
84:{in:"《秦观词集》收录北宋词人秦观的词作。秦观为苏门四学士之一，其词情真意切、语言优美。两情若是久长时，又岂在朝朝暮暮成为歌颂坚贞爱情的名句。",th:"以真挚情感打动人心。婉约词中最纯粹的抒情，以情动人而非以技巧取胜。",ex:"纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。柔情似水，佳期如梦，忍顾鹊桥归路。两情若是久长时，又岂在朝朝暮暮！\n\n漠漠轻寒上小楼，晓阴无赖似穷秋。淡烟流水画屏幽。自在飞花轻似梦，无边丝雨细如愁。\n\n郴江幸自绕郴山，为谁流下潇湘去。\n\n春去也，飞红万点愁如海。"},
85:{in:"《杨万里诗集》收录南宋诗人杨万里的诗歌。杨万里创立诚斋体，以清新活泼、自然灵动的诗风著称。小荷才露尖尖角，早有蜻蜓立上头是其最广为人知的名句。",th:"自然天成的诗学追求。以活泼生动的语言捕捉生活中的诗意瞬间。",ex:"泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。\n\n毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。\n\n篱落疏疏一径深，树头新绿未成阴。儿童急走追黄蝶，飞入菜花无处寻。\n\n正入万山圈子里，一山放过一山拦。\n\n月子弯弯照九州，几家欢乐几家愁。"},
86:{in:"《朱熹文集》收录南宋理学家朱熹的诗文作品。朱熹是宋代理学的集大成者，其思想影响中国数百年。问渠那得清如许，为有源头活水来既是说理也是诗境。",th:"理学思想与诗学表达的融合。以诗说理，在学术追求中不失文学之美。",ex:"半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。\n\n少年易老学难成，一寸光阴不可轻。未觉池塘春草梦，阶前梧叶已秋声。\n\n胜日寻芳泗水滨，无边光景一时新。等闲识得东风面，万紫千红总是春。\n\n读书之法，在循序而渐进，熟读而精思。\n\n存天理，灭人欲。\n\n格物致知，诚意正心。"},
87:{in:"《东京梦华录》是孟元老追忆北宋都城汴京繁华的笔记体著作，详细记载了汴京的城市布局、市井风情、节庆风俗。是了解宋代都市文化的珍贵文献。",th:"盛世繁华的最后挽歌。以追忆的笔触记录一个已经消逝的黄金时代。",ex:"正当辇毂之下，太平日久，人物繁阜。垂髫之童，但习鼓舞；斑白之老，不识干戈。时节相次，各有观赏。\n\n灯宵月夕，雪际花时，乞巧登高，教池游苑。举目则青楼画阁，绣户珠帘。雕车竞驻于天街，宝马争驰于御路。\n\n金翠耀目，罗绮飘香。新声巧笑于柳陌花衢，按管调弦于茶坊酒肆。\n\n八荒争凑，万国咸通。集四海之珍奇，皆归市易。"},
88:{in:"《梦溪笔谈》是北宋科学家沈括的百科全书式著作，涵盖天文、地理、数学、物理、化学、生物、医学等各领域。被英国学者李约瑟誉为中国科学史上的里程碑。",th:"科学精神的古代典范。以实证态度和精密观察记录自然现象，中国科学史上的不朽巨著。",ex:"磁石之指南，犹柏之指西，莫可原其理。\n\n日月之形如丸。何以知之？以月盈亏可验也。\n\n天地之变，寒暑风雨，水旱螟蝗，率皆有法。\n\n医者意也，思虑精则得之。\n\n大凡物有定形，而事有定理。\n\n造微之妙，存乎其人。\n\n以气相色谱之理观天地万物，各循其道。"},
89:{in:"《文天祥诗集》收录南宋民族英雄文天祥的诗歌。文天祥以生命践行了留取丹心照汗青的誓言，在狱中作正气歌、过零丁洋等诗篇，以慷慨悲壮的笔调书写了忠贞不渝的民族气节。",th:"视死如归的民族气节。以诗歌铸就不屈的灵魂，是中华民族精神的永恒丰碑。",ex:"辛苦遭逢起一经，干戈寥落四周星。山河破碎风飘絮，身世浮沉雨打萍。惶恐滩头说惶恐，零丁洋里叹零丁。人生自古谁无死？留取丹心照汗青！\n\n天地有正气，杂然赋流形。下则为河岳，上则为日星。于人曰浩然，沛乎塞苍冥。\n\n时穷节乃见，一一垂丹青。\n\n臣心一片磁针石，不指南方不肯休。"},
90:{in:"《岳飞诗词》收录南宋名将岳飞的诗词作品。岳飞以精忠报国的赤诚和满江红的壮烈名垂千古。怒发冲冠、三十功名尘与土，字字如金石，激励了无数仁人志士。",th:"精忠报国的赤诚之心。以满腔热血铸就不朽的民族英雄形象。",ex:"怒发冲冠，凭栏处、潇潇雨歇。抬望眼、仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切！\n\n靖康耻，犹未雪。臣子恨，何时灭！驾长车，踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙！\n\n欲将心事付瑶琴，知音少，弦断有谁听？\n\n莫等闲，白了少年头，空悲切。"},
91:{in:"《元好问集》收录金末元初文学家元好问的诗文作品。元好问以丧乱诗著称，真实记录了金元易代之际的社会动荡和民生疾苦。问世间情是何物，直教生死相许是其千古名句。",th:"乱世文人的悲悯之心。以诗歌记录历史巨变中的苦难，丧乱诗中见真情。",ex:"问世间，情是何物，直教生死相许？天南地北双飞客，老翅几回寒暑。欢乐趣，离别苦，就中更有痴儿女。君应有语，渺万里层云，千山暮雪，只影向谁去？\n\n丧乱诗——白骨纵横似乱麻，几年桑梓变龙沙。\n\n论诗三十首——一语天然万古新，豪华落尽见真淳。\n\n心画心声总失真，文章宁复见为人。"},
92:{in:"《关汉卿杂剧》收录元代杂剧大家关汉卿的戏剧作品。关汉卿被誉为东方莎士比亚，现存作品十八种，其中窦娥冤最为著名。其曲词本色当行，以普通人的视角揭示深刻的社会矛盾。",th:"为底层人民发声的戏剧力量。以杂剧为武器批判社会不公，展现小人物的命运与抗争。",ex:"地也，你不分好歹何为地！天也，你错勘贤愚枉做天！\n\n关汉卿自称：我是个蒸不烂、煮不熟、捶不扁、炒不爆、响珰珰一粒铜豌豆。\n\n窦娥临刑三桩誓愿：血溅白练、六月飞雪、亢旱三年，一一应验，终得昭雪。\n\n望江亭中秋切脍旦——谭记儿智取杨衙内，以智慧和勇气战胜强权。\n\n救风尘——赵盼儿设计解救姐妹，女性互助的智慧与勇气。"},
93:{in:"《西厢记》是元代王实甫创作的杂剧，讲述张生与崔莺莺的爱情故事。以愿普天下有情的都成了眷属的民主爱情观对抗封建礼教，被誉为中国古典爱情喜剧的巅峰。",th:"愿天下有情人终成眷属。以爱情的力量对抗封建礼教，追求自由恋爱的权利。",ex:"碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。\n\n花落水流红，闲愁万种，无语怨东风。\n\n待月西厢下，迎风户半开。拂墙花影动，疑是玉人来。\n\n愿普天下有情的都成了眷属。\n\n地生连理枝，水出并头莲。\n\n恨相见得迟，怨归去得疾。柳丝长玉骢难系，恨不倩疏林挂住斜晖。"},
94:{in:"《窦娥冤》是关汉卿的代表作，讲述窦娥被冤杀的悲剧故事。窦娥临刑前发下三桩誓愿——血溅白练、六月飞雪、亢旱三年，最终全部应验，成为中国古典悲剧的巅峰之作。",th:"冤屈与正义的终极拷问。以超自然力量控诉人间不公，弱者的呐喊穿越时空。",ex:"有日月朝暮悬，有鬼神掌着生死权。天地也！只合把清浊分辨，可怎生糊突了盗跖、颜渊？为善的受贫穷更命短，造恶的享富贵又寿延。天地也！做得个怕硬欺软，却原来也这般顺水推船！地也，你不分好歹何为地！天也，你错勘贤愚枉做天！哎，只落得两泪涟涟。\n\n没来由犯王法，不提防遭刑宪。\n\n做甚么三年不见甘霖降？也只为东海曾经孝妇冤。"},
95:{in:"《马致远杂剧》收录元代杂剧作家马致远的戏剧作品。马致远以神仙道化剧著称，其汉宫秋、黄粱梦等作品以清俊的曲词和深刻的哲理闻名。秋思被誉为秋思之祖。",th:"神仙道化中的出世思想。在梦幻与现实之间探索人生的真谛与虚无。",ex:"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。\n\n百岁光阴一梦蝶，重回首往事堪嗟。\n\n和露摘黄花，带霜烹紫蟹，煮酒烧红叶。\n\n想人生有限杯，浑几个重阳节？\n\n不因打鱼啊，也做不得官。\n\n月明闲照白苹洲，从此扁舟日夜留。"},
96:{in:"《赵氏孤儿》是元代纪君祥创作的杂剧，讲述春秋时期程婴舍子救孤的壮烈故事。以自我牺牲的精神和忠义两全的信念，展现了中国传统文化中义的最高境界。",th:"舍生取义的壮烈抉择。在忠义与亲情的冲突中，以自我牺牲成全大义。",ex:"程婴为救赵氏孤儿，以己子代之赴死，忍痛割爱，抚养孤儿二十年。\n\n老臣程婴，誓死保护赵氏遗孤，虽粉身碎骨亦在所不辞。\n\n搜孤救孤——为保存忠良血脉，义士们前赴后继、视死如归。\n\n大报仇——孤儿长大成人，终于得知身世，誓报灭门之仇。\n\n忠臣不怕死，怕死不忠臣。"},
97:{in:"《白朴杂剧》收录元代杂剧作家白朴的戏剧作品。白朴与关汉卿、马致远、郑光祖并称元曲四大家，其墙头马上、梧桐雨等作品以文采斐然的曲词著称。",th:"以爱情主题对抗封建礼教。在文采与情感的交融中展现人性的光辉。",ex:"墙头马上——李千金墙头偶见裴少俊，一见钟情，冲破礼教束缚，勇敢追求爱情。\n\n梧桐雨——唐明皇秋夜听雨打梧桐，思念杨贵妃，凄凉孤寂。\n\n从来不语伤春事，暗觉年华似水流。\n\n从来好梦最难真，惹得牵愁惹恨人。\n\n一点萤灯数点萤，半窗明月一窗星。"},
98:{in:"《张养浩散曲》收录元代散曲作家张养浩的作品。张养浩以山坡羊·潼关怀古最为著名，兴，百姓苦；亡，百姓苦八个个字道尽千年历史的残酷真相。",th:"心系苍生的忧患意识。以散曲直面历史的残酷，为苦难中的百姓发出呐喊。",ex:"峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦！\n\n云来山更佳，云去山如画。山因云晦明，云共山高下。\n\n万言书当一线悬，且休要望三台显。\n\n不知身在秋风里，只觉寒生毛发间。"},
99:{in:"《崔颢黄鹤楼》是唐代诗人崔颢的七言律诗，被誉为唐人七律第一。昔人已乘黄鹤去，此地空余黄鹤楼的苍茫意境，连李白都感叹眼前有景道不得，崔颢题诗在上头。",th:"登高望远的时空感慨。在历史与现实的交汇处体悟人生的无常与惆怅。",ex:"昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。晴川历历汉阳树，芳草萋萋鹦鹉洲。日暮乡关何处是？烟波江上使人愁。\n\n李白见此诗，叹曰：眼前有景道不得，崔颢题诗在上头。遂搁笔不赋。\n\n此诗以一去不返的黄鹤起兴，以日暮乡关的乡愁收束，将空间的苍茫与时间的悠远融为一体。"},
100:{in:"《李之仪词》收录北宋词人李之仪的词作。李之仪以卜算子·我住长江头最为著名，以质朴无华的语言表达深沉的相思之情，只愿君心似我心，定不负相思意成为爱情名句。",th:"以朴素语言表达真挚情感。长江为喻，将相思之情写得既深沉又纯净。",ex:"我住长江头，君住长江尾。日日思君不见君，共饮长江水。此水几时休，此恨何时已。只愿君心似我心，定不负相思意。\n\n全词以长江水为线索，将相隔千山万水的两地恋人联系在一起，语言质朴却情深意切。\n\n共饮一江水，虽不见亦如见。\n\n相思之深，不在于誓言的华丽，而在于心意的相通。"},
101:{in:"《西厢记诸宫调》是金代董解元创作的说唱文学作品，是王实甫西厢记的前身。以诸宫调的形式讲述张生与崔莺莺的爱情故事，篇幅宏大，曲词优美，是金代文学的代表作。",th:"西厢故事的金代版本。以说唱文学的形式开创爱情叙事的先河，为元杂剧奠定基础。",ex:"莫道男儿心如铁，君不见满川红叶，尽是离人眼中血。\n\n风流忒煞，好一似猛虎当道。\n\n从来自古，才子佳人合当好。\n\n岂不闻卓文君夜奔司马相如，红拂女私奔李药师。\n\n好事多磨，良缘难遂——前有诸宫调，后有王实甫。"},
102:{in:"《三国演义》是罗贯中创作的中国第一部长篇章回体历史演义小说，以三国时期魏蜀吴三国的政治军事斗争为题材。天下大势，分久必合，合久必分的宏阔叙事影响深远。",th:"智谋与忠义的史诗叙事。在群雄逐鹿中展现人性的光辉与阴暗，忠义精神的永恒丰碑。",ex:"滚滚长江东逝水，浪花淘尽英雄。是非成败转头空，青山依旧在，几度夕阳红。\n\n天下大势，分久必合，合久必分。\n\n话说天下大势——话说曹操、刘备、孙权三足鼎立，英雄辈出，智者争锋。\n\n既生瑜，何生亮！\n\n宁教我负天下人，休教天下人负我。\n\n鞠躬尽瘁，死而后已——诸葛亮的千古忠义。\n\n温酒斩华雄、三顾茅庐、草船借箭、空城计、七擒孟获——一个个故事家喻户晓。\n\n天下英雄谁敌手？曹刘。生子当如孙仲谋。"},
103:{in:"《水浒传》是施耐庵创作的长篇章回体小说，讲述北宋末年一百零八位好汉聚义梁山、替天行道的故事。以鲜明的个性塑造和跌宕起伏的情节，展现了一个劫富济贫的侠义世界。",th:"官逼民反的社会批判。一百零八将的忠义豪情与悲剧命运的深刻矛盾。",ex:"大河向东流哇，天上的星星参北斗哇。\n\n路见不平一声吼，该出手时就出手。\n\n武松打虎——三碗不过冈，景阳冈上赤手空拳打死猛虎，英雄本色。\n\n林冲夜奔——八十万禁军教头被逼上梁山，风雪山神庙手刃仇人。\n\n鲁智深倒拔垂杨柳——力大无穷，义薄云天。\n\n智取生辰纲——吴用巧计，七星聚义，劫不义之财。\n\n逼上梁山——一个好汉三个帮，一百零八将聚义，替天行道。\n\n招安之后，征方腊损兵折将，英雄末路令人唏嘘。"},
104:{in:"《西游记》是吴承恩创作的长篇神魔小说，讲述唐僧师徒四人西天取经的奇幻冒险。孙悟空大闹天宫、三打白骨精、火焰山等故事深入人心，是中国浪漫主义文学的巅峰之作。",th:"以奇幻想象寄托人生哲理。在取经路上磨炼心性，降妖除魔隐喻修行成长。",ex:"皇帝轮流做，明年到我家。\n\n俺老孙来也！——齐天大圣的豪迈与不羁。\n\n大闹天宫——花果山上一块仙石迸裂，石猴出世，学七十二变，闹龙宫、搅地府、偷蟠桃、砸丹炉，一根金箍棒打遍天庭。\n\n三打白骨精——火眼金睛识破妖魔变化，却被师父误解驱逐，忠心不改。\n\n火焰山——借芭蕉扇灭火焰山，三调芭蕉扇的曲折故事。\n\n敢问路在何方？路在脚下。\n\n踏平坎坷成大道，斗罢艰险又出发。"},
105:{in:"《金瓶梅》是明代兰陵笑笑生创作的长篇小说，以西门庆的家庭生活为线索，展现明代中晚期的社会百态。被认为是中国第一部以家庭生活为题材的世情小说，对红楼梦等影响深远。",th:"世情小说的开山之作。以冷峻写实的笔触揭露人性欲望与社会黑暗，批判现实的力量。",ex:"世情小说之祖——以西门庆一家为中心，辐射整个社会的欲望与沉沦。\n\n潘金莲——从被出卖到主动谋划，一个女性在男权社会中的挣扎与扭曲。\n\n李瓶儿——从富商遗孀到西门庆妾室，温柔贤淑却难逃悲剧命运。\n\n春梅——丫鬟出身，最终成为正室，人生际遇的跌宕起伏。\n\n以家庭琐事写时代风云，以儿女私情写社会百态。\n\n满纸荒唐言，一把辛酸泪。金瓶梅开红楼梦先河。"},
106:{in:"《牡丹亭》是明代汤显祖创作的传奇剧本，讲述杜丽娘因梦生情、死而复生的爱情故事。情不知所起，一往而深，生者可以死，死可以生，是中国浪漫主义戏剧的巅峰。",th:"情不知所起，一往而深。以生死之恋对抗封建礼教，情可以超越生死的力量。",ex:"原来姹紫嫣红开遍，似这般都付与断井颓垣。良辰美景奈何天，赏心乐事谁家院！\n\n情不知所起，一往而深。生者可以死，死可以生。生而不可与死，死而不可复生者，皆非情之至也。\n\n惊觉相思不露，原来只因已入骨。\n\n梦短梦长俱是梦，年来年去是何年。\n\n牡丹亭上三生路——杜丽娘梦中与柳梦梅相遇，因情而死，因情而复生。\n\n不到园林，怎知春色如许！"},
107:{in:"《封神演义》是明代许仲琳创作的长篇神魔小说，以武王伐纣为历史背景，融合大量神话传说和仙道斗法。姜子牙封神、哪吒闹海、杨戬救母等故事广为流传。",th:"神话与历史的瑰丽交织。在神仙斗法中展现正邪之战，英雄辈出的史诗叙事。",ex:"哪吒闹海——七岁哪吒在海中洗澡，打死夜叉和龙王三太子，大闹龙宫。\n\n姜子牙钓鱼——愿者上钩，八十岁出山辅佐武王。\n\n封神榜——三百六十五位正神，各司其职。\n\n杨戬劈山救母——沉香救母的前传，二郎神的孝义传说。\n\n九曲黄河阵——阐教与截教的终极对决，神仙大战天地变色。\n\n天道无常，顺之者昌，逆之者亡。\n\n道生一，一生二，二生三，三生万物。"},
108:{in:"《徐霞客游记》是明代地理学家徐霞客的旅行日记，记录其三十余年间游历大半个中国的见闻。以精细的观察和优美的文笔描述山川地貌，是中国地理学和游记文学的双重经典。",th:"以脚步丈量山河的探索精神。在危险与孤独中追寻地理真相，科学与文学的完美结合。",ex:"五岳归来不看山，黄山归来不看岳。\n\n丈夫当朝碧海而暮苍梧，岂以一隅自限。\n\n徐霞客三十年间，足迹遍及大半个中国，翻山越岭，九死一生。\n\n自宁海出西门，云散日朗，人意山光，俱有喜态。\n\n一缕界破青山——对瀑布的精妙描写。\n\n水流其间，怪石森然，奇态万状，俱不可名。"},
109:{in:"《三言》是明代冯梦龙编纂的三部短篇小说集——喻世明言、警世通言、醒世恒言的合称。共收话本小说一百二十篇，题材广泛，以市井百态和儿女情长为主要内容。",th:"市井百态的生动画卷。以通俗文学反映民间疾苦和人性善恶，醒世喻世的教化功能。",ex:"杜十娘怒沉百宝箱——名妓杜十娘倾心于李甲，却被其转卖。十娘打开百宝箱，将价值万金的珠宝一一投入江中，随后投江自尽。\n\n卖油郎独占花魁——小商贩秦重以真诚打动花魁娘子莘瑶琴，终成眷属。\n\n蒋兴哥重会珍珠衫——一个关于宽容与重圆的动人故事。\n\n灌园叟晚逢仙女——秋先爱花成痴，感动花仙。\n\n人不可貌相，海水不可斗量。"},
110:{in:"《二拍》是明代凌濛初编纂的两部短篇小说集——初刻拍案惊奇、二刻拍案惊奇的合称。共收小说七十八篇，与三言并称三言二拍，代表了明代话本小说的最高成就。",th:"以奇案故事折射社会现实。在曲折情节中展现人性的复杂与命运的无常。",ex:"转运汉巧遇洞庭红——文若虚落魄经商，意外得宝转运，命运转折的奇妙故事。\n\n叠居奇程客得助——程宰困顿之际，得海神相助，商海沉浮中的奇遇。\n\n满少卿饥附饱飏——一个关于忘恩负义与报应不爽的故事。\n\n恶船户计赚假尸——真假难辨的奇案，悬念迭起。\n\n世间奇事何曾少，善恶到头终有报。\n\n天道好还，报应不爽。"},
111:{in:"《临川四梦》是明代汤显祖的四部传奇剧本——牡丹亭、紫钗记、南柯记、邯郸记的合称。四部作品皆以梦境为线索，在梦幻与现实之间探索人生真谛。",th:"以梦为马的戏剧哲学。在四场大梦中思考爱情、权力、人生的终极意义。",ex:"牡丹亭——情不知所起，一往而深，生可以死，死可以生。\n\n紫钗记——霍小玉与李益的爱情悲欢，紫钗为信物串联两颗心。\n\n南柯记——淳于棼梦入槐安国，历经荣华富贵终归虚幻，南柯一梦。\n\n邯郸记——卢生邯郸客店遇吕洞宾，一枕黄粱梦尽一生功名。\n\n四梦之中，牡丹亭写情，紫钗记写义，南柯记写权，邯郸记写仙。\n\n梦中之情，何必非真。"},
112:{in:"《归有光文集》收录明代散文家归有光的散文作品。归有光以抒情散文著称，项脊轩志以质朴真挚的笔调描写书斋生活和对亡妻的怀念，被誉为明代第一文。",th:"以真情写散文的文学典范。在朴素文字中蕴含深沉的亲情与哀思。",ex:"项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注。\n\n妪每谓余曰：某所，而母立于兹。妪又曰：汝姊在吾怀，呱呱而泣。\n\n轩东故尝为厨，人往，从轩前过。余扃牖而居，遭呼声即啸不止。\n\n庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。\n\n借书满架，偃仰啸歌，冥然兀坐，万籁有声。\n\n三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。"},
113:{in:"《张岱文集》收录明末清初文学家张岱的散文作品。张岱以陶庵梦忆和西湖梦寻著称，以精致的文笔追忆晚明的繁华风雅，在鼎革之际写下亡国之痛与文化之殇。",th:"故国之思与文化遗产的追忆。以小品文记录一个消逝时代的风雅与哀伤。",ex:"湖心亭看雪——大雪三日，湖中人鸟声俱绝。是日更定，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n\n西湖七月半——五类看月之人，写尽世态。\n\n不二斋——高楼四望，山色湖光，尽在目中。\n\n国破家亡，无所归止，披发入山，駴駴为野人。"},
114:{in:"《袁宏道文集》收录明代文学家袁宏道的散文作品。袁宏道是公安派的核心人物，主张独抒性灵、不拘格套，反对前后七子的拟古主义，推动了明代文学的革新。",th:"独抒性灵的文学革新。反对拟古，提倡真实自然的文学表达。",ex:"独抒性灵，不拘格套。非从自己胸臆流出，不肯下笔。\n\n满井游记——高柳夹堤，土膏微润，一望空阔，若脱笼之鹄。\n\n晚游六桥待月记——西湖最盛，为春为月。一日之盛，为朝烟，为夕岚。\n\n人生贵在行乐，何必拘拘于世俗。\n\n天下之物，孤行则必不可无，雷同则可以不有。\n\n率性而行，不必效颦。"},
115:{in:"《天工开物》是明代科学家宋应星编纂的科技百科全书，详细记载了农业和手工业的生产技术。被西方学者誉为中国十七世纪的百科全书，是中国古代科技文献的集大成之作。",th:"古代科技的全面记录。以实证精神记录生产技术，科学与实用的完美结合。",ex:"天工开物——盖人巧造成异物，乃夺天工之巧。\n\n乃粒——凡稻种最多，有粳有糯，有早有晚。\n\n乃服——凡丝微细，比于蚕丝。凡帛轻重，以两计之。\n\n彰施——五色彰施于布帛，以夺造化之功。\n\n冶铸——凡铁之化，铸为钟鼎，化为刀剑。\n\n锤锻——凡铁兵薄者为刀剑，背厚面薄。\n\n此书于功命进取毫不相关，实乃一技之微，亦有可观。"},
116:{in:"《红楼梦》是曹雪芹创作的中国古典小说巅峰之作，以贾宝玉与林黛玉的爱情悲剧为主线，描绘贾府由盛转衰的全景画卷。被誉为中国封建社会的百科全书，中国文学的最高成就。",th:"繁华落尽的人生大梦。在家族兴衰中展现人性的复杂与生命的无常，千古奇书。",ex:"满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味？\n\n一个是阆苑仙葩，一个是美玉无瑕。若说没奇缘，今生偏又遇着他；若说有奇缘，如何心事终虚化？\n\n黛玉葬花——花谢花飞花满天，红消香断有谁怜？侬今葬花人笑痴，他年葬侬知是谁？一朝春尽红颜老，花落人亡两不知。\n\n宝玉挨打——不是冤家不聚头，一场痛打道尽家族矛盾。\n\n好了歌——好便是了，了便是好。世人都晓神仙好，惟有功名忘不了。\n\n假作真时真亦假，无为有处有还无。"},
117:{in:"《聊斋志异》是清代蒲松龄创作的文言短篇小说集，以狐鬼花妖的故事寄托人间真情与社会批判。全书近五百篇，以奇幻瑰丽的想象和精炼优美的文笔，达到了中国文言小说的艺术高峰。",th:"以鬼狐世界映射人间百态。在超自然故事中寄托对社会黑暗的批判和对真情的歌颂。",ex:"写鬼写妖高人一等，刺贪刺虐入骨三分。\n\n婴宁——爱笑的狐女婴宁，天真烂漫，以笑声对抗世俗的虚伪。\n\n聂小倩——女鬼聂小倩与书生宁采臣的人鬼之恋，超越生死。\n\n促织——为上贡一只蟋蟀，家破人亡，讽刺封建统治的残暴。\n\n画皮——恶鬼披人皮迷惑人心，美丑善恶不在皮囊。\n\n考弊司——阴间考场的故事，影射科场腐败。\n\n世上本无鬼，鬼在人心。"},
118:{in:"《儒林外史》是清代吴敬梓创作的长篇讽刺小说，以科举制度下文人群体的百态为题材，以犀利的讽刺笔法揭露科举对人性的扭曲和士林的虚伪。是中国古代讽刺文学的最高成就。",th:"对科举制度的深刻批判。以讽刺为武器揭露文人百态，嬉笑怒骂皆是文章。",ex:"范进中举——范进考了大半辈子，终于中了举人，却因大喜过望而疯了。丈人胡屠户一巴掌打醒了他，从此旁人前呼后拥。\n\n王冕——画荷花的隐士，不求功名，远离官场。\n\n严监生——临死前伸出两根手指，只因灯里点了两茎灯草，心疼不已。\n\n功名富贵无凭据，费尽心情，总把流光误。\n\n说到底，一部儒林外史，写尽了功名二字如何扭曲人心。"},
119:{in:"《桃花扇》是清代孔尚任创作的传奇剧本，以明末侯方域与李香君的爱情故事为线索，借离合之情写兴亡之感。以桃花扇底送南朝，将个人命运与国家兴亡交织在一起。",th:"借离合之情写兴亡之感。在爱情悲剧中映射王朝更迭的历史巨变。",ex:"桃花扇底送南朝——南明覆亡之际，侯方域与李香君的爱情也随之凋零。\n\n李香君血溅诗扇——宁死不屈的青楼女子，以鲜血染红扇面，后由杨龙友点染为桃花。\n\n眼见他起朱楼，眼见他宴宾客，眼见他楼塌了。\n\n这青苔碧瓦堆，俺曾睡风流觉，将五十年兴亡看饱。\n\n白骨青灰长艾萧，桃花扇子送南朝。\n\n金陵烟雨几回肠，不管兴亡只管妆。"},
120:{in:"《长生殿》是清代洪昇创作的传奇剧本，以唐明皇与杨贵妃的爱情故事为题材。与桃花扇并称清代戏曲双璧，在天上人间两相望的深情中歌颂永恒的爱情。",th:"帝妃之恋的千古深情。在历史与传说之间歌颂超越生死的爱情。",ex:"在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。\n\n七月七日长生殿，夜半无人私语时。\n\n定情——唐明皇与杨贵妃于七夕在长生殿许下白头之约。\n\n惊变——安史之乱爆发，马嵬坡前六军不发，杨贵妃含泪赐死。\n\n闻铃——雨夜闻铃，明皇思念贵妃，肠断声声。\n\n重圆——天上人间，终得重圆。\n\n昭阳殿里恩爱绝，蓬莱宫中日月长。"},
121:{in:"《纳兰性德词集》收录清代词人纳兰性德的词作。纳兰性德以纯真深情的词风著称，人生若只如初见、当时只道是寻常等名句打动了无数读者。英年早逝使其词作更添凄美。",th:"以真情写词的贵族词人。在显贵身份背后是一颗敏感多情的心灵，词作凄美绝伦。",ex:"人生若只如初见，何事秋风悲画扇。等闲变却故人心，却道故人心易变。\n\n谁念西风独自凉，萧萧黄叶闭疏窗，沉思往事立残阳。被酒莫惊春睡重，赌书消得泼茶香，当时只道是寻常。\n\n我是人间惆怅客，知君何事泪纵横。断肠声里忆平生。\n\n一生一代一双人，争教两处销魂。相思相望不相亲，天为谁春？\n\n山一程，水一程，身向榆关那畔行，夜深千帐灯。"},
122:{in:"《阅微草堂笔记》是清代纪昀创作的笔记体小说集，以简洁古雅的文笔记录狐鬼神怪的故事。与聊斋志异的文采斐然不同，纪昀以学者之笔记故事，文字质朴而意味深长。",th:"以笔记体记录奇闻异事。在简洁叙事中寄寓人生哲理，学者小说的独特魅力。",ex:"沧州城南有一河干，河干之上有古墓。\n\n狐仙报恩——知恩图报的狐仙，比人更懂得情义。\n\n鬼讼——阴间的审案，比阳间更公正。\n\n因果报应之说，非尽无稽。\n\n人心之变幻，实非鬼神所能测。\n\n世间的因果，往往比小说更离奇。\n\n阅微知著，草堂秋夜，一灯如豆。"},
123:{in:"《镜花缘》是清代李汝珍创作的长篇小说，前半部讲述唐敖游历海外各国的奇幻经历，后半部描写百位才女的文采风流。以奇特的想象和博学的知识著称。",th:"以海外奇闻寄托社会理想。在奇幻故事中展现对女性才华的赞美和对社会问题的思考。",ex:"君子国——人皆谦让，买卖之间争相退让，以利他为荣。\n\n女儿国——男子穿耳缠足，女子治国理政，以反转映射性别不公。\n\n两面国——人前一面、背后一面，讽刺虚伪世态。\n\n无肠国——食而不化，讽刺富贵人家的奢靡。\n\n以海外奇闻写人间百态，以幻想世界寄寓社会理想。\n\n百位才女各展才华，以诗词歌赋竞风流。"},
124:{in:"《老残游记》是清末刘鹗创作的长篇小说，以老残的游历见闻为线索，揭露晚清官场的黑暗腐败。被认为是晚清四大谴责小说之一，兼有游记的优美和小说的深刻。",th:"对晚清社会的深刻揭露。在游历见闻中展现官场黑暗与民生疾苦。",ex:"一路秋山红叶，老残骑驴而行。\n\n大明湖——四面荷花三面柳，一城山色半城湖。\n\n白妞说书——王小玉说书一段，声音描写登峰造极，被誉为中国文学中最美的声音描写。\n\n酷吏以清官自居，实则残民以逞——揭清廉之名，行贪暴之实。\n\n天下事误于奸佞者十之三四，误于不通世故之君子者十之六七。\n\n此书可与晚清社会为写照，不独为小说也。"},
125:{in:"《官场现形记》是清末李伯元创作的长篇谴责小说，以犀利的笔触揭露晚清官场的各种丑态。是中国近代第一部全面批判官场腐败的小说，开创了谴责小说的先河。",th:"官场百丑图的全面展示。以讽刺批判的笔触揭露官僚体系的腐败与荒谬。",ex:"一年清知府，十万雪花银——买官卖官，明码标价。\n\n官场如戏场——台上演戏台下看戏，升官发财全靠演技。\n\n千里做官只为财——为官一任，搜刮一空。\n\n官大一级压死人——上下级之间的关系，就是赤裸裸的权力游戏。\n\n以笔为刀，解剖晚清官场的毒瘤。\n\n一部官场现形记，写尽了封建末世的官场丑态。"},
126:{in:"《二十年目睹之怪现状》是清末吴沃尧创作的长篇谴责小说，以二十年间的见闻为线索，记录晚清社会的种种怪现状。以讽刺的笔法展现了一个即将崩溃的帝国的众生相。",th:"晚清社会的百丑图。以怪现状揭示末世乱象，记录一个时代的荒诞与悲哀。",ex:"二十年之间，怪现状层出不穷。\n\n什么叫做怪？不合常理便是怪。什么叫做现状？眼前所见的便是现状。\n\n官场怪——贪官污吏横行，清廉者反被排挤。\n\n商场怪——奸商勾结官府，以次充好。\n\n考场怪——代考作弊，花样百出。\n\n一部怪现状，写尽了晚清社会方方面面的荒唐。\n\n不是我不明白，这世界变化快。"},
127:{in:"《孽海花》是清末曾朴创作的长篇小说，以金雯青与傅彩云的故事为线索，展现晚清外交官的生活和社会变迁。融合历史与小说，是晚清文学中艺术成就较高的作品。",th:"在个人命运中映照国家兴衰。以历史小说的形式记录晚清社会的巨变。",ex:"孽海茫茫，回头是岸。\n\n金雯青出使欧洲——晚清外交官在东西方文化碰撞中的见闻与困惑。\n\n傅彩云——从青楼女子到公使夫人，人生际遇的传奇与沧桑。\n\n一部孽海花，半部晚清史。\n\n在历史的洪流中，个人的命运如同浮萍。\n\n旧世界在崩塌，新世界尚未到来。"},
128:{in:"《浮生六记》是清代沈复追忆与妻子陈芸的婚姻生活而作的自传体散文。以真挚细腻的笔触描写夫妻之间的相濡以沫，被林语堂誉为中国文学中最美好的爱情故事。",th:"平凡而真挚的爱情颂歌。在柴米油盐中展现夫妻深情，浮生若梦的真实感动。",ex:"情之所钟，虽丑不嫌。\n\n布衣菜饭，可乐终身，不必作远游计也。\n\n余与芸娘，年幼相契，及长成婚，恩爱异常。\n\n秋月春风，等闲度过。良辰美景，不放空过。\n\n芸虽衰，余终不忍弃。\n\n恩爱夫妻不到头——芸娘病逝，沈复悲痛欲绝。浮生若梦，为欢几何？\n\n人珍我弃，人弃我取——芸娘的豁达与智慧。"},
129:{in:"《龚自珍集》收录清末思想家龚自珍的诗文作品。龚自珍是近代中国的启蒙思想家，以犀利深刻的诗文批判封建制度的腐朽。九州生气恃风雷、我劝天公重抖擞是其千古名句。",th:"近代中国的启蒙之声。以诗文为号角呼唤变革，是中国近代思想解放的先驱。",ex:"九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才！\n\n落红不是无情物，化作春泥更护花。\n\n浩荡离愁白日斜，吟鞭东指即天涯。\n\n青山处处埋忠骨，何须马革裹尸还。\n\n一箫一剑平生意，负尽狂名十五年。\n\n不是逢人苦誉君，亦狂亦侠亦温文。\n\n龚自珍被誉为中国近代思想第一人。"},
130:{in:"《郑板桥集》收录清代书画家郑板桥的诗文书画作品。郑板桥以诗书画三绝著称，其诗质朴率真，其文关心民生。难得糊涂、咬定青山不放松等名言广为传颂。",th:"难得糊涂的人生智慧。以艺术家的率真和文人的良知关注社会民生。",ex:"咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。\n\n难得糊涂——聪明难，糊涂难，由聪明而转入糊涂更难。\n\n衙斋卧听萧萧竹，疑是民间疾苦声。些小吾曹州县吏，一枝一叶总关情。\n\n室雅何须大，花香不在多。\n\n吃亏是福——满者损之机，亏者盈之渐。\n\n删繁就简三秋树，领异标新二月花。"},
131:{in:"《袁枚集》收录清代诗人袁枚的诗文作品。袁枚是性灵派诗论的代表人物，主张写诗要抒发性灵、独出心裁。其随园诗话和随园食单展现了多才多艺的文人生活。",th:"性灵说的文学主张。追求真实自然的文学表达，反对模拟和形式主义。",ex:"牧童骑黄牛，歌声振林樾。意欲捕鸣蝉，忽然闭口立。\n\n苔花如米小，也学牡丹开。\n\n性灵说——凡诗之传者，都是性灵，不关堆垛。\n\n随园食单——须知单、戒单，中国饮食文化的经典之作。\n\n不依古法但横行，自有云雷绕膝生。\n\n爱好由来落笔难，一诗千改始心安。"},
132:{in:"《曾国藩家书》收录清末名臣曾国藩写给家人的书信。曾国藩以修身齐家治国平天下的儒家理想为指导，其家书内容涵盖读书、修身、处世、治军等方面，被视为家教典范。",th:"修身齐家的儒家实践。以家书传递人生智慧和道德修养，近代中国家庭教育的圣经。",ex:"天下古今之庸人，皆以一惰字致败；天下古今之才人，皆以一傲字致败。\n\n凡人做一事，便须全副精神注在此一事。首尾不懈，不可见异思迁。\n\n勤勉则兴，懒惰则废。\n\n家勤则兴，人勤则健，能勤能俭，永不贫贱。\n\n凡事皆用困知勉行工夫，不可求名太骤、求效太捷。\n\n修身十二课：敬、静坐、早起、读书不二、读史、谨言、养气、保身、日知所亡、月无忘所能、作字、夜不出门。"},
133:{in:"《说岳全传》是清代钱彩编写的长篇小说，讲述南宋名将岳飞精忠报国的一生。以民间喜闻乐见的形式再现岳母刺字、十二道金牌、风波亭等历史故事。",th:"精忠报国的英雄传奇。以通俗小说弘扬民族气节和爱国精神。",ex:"岳母刺字——岳母在岳飞背上刺下精忠报国四字，母训如山。\n\n十二道金牌——十二道金牌催岳飞班师，十年之功毁于一旦。\n\n风波亭——岳飞父子含冤而死，天日昭昭，天日昭昭！\n\n莫须有——韩世忠质问秦桧：莫须有三字，何以服天下？\n\n怒发冲冠——满江红一词，壮怀激烈，千古传诵。\n\n青山有幸埋忠骨，白铁无辜铸佞臣。"},
134:{in:"《隋唐演义》是清代褚人获创作的长篇历史小说，以隋唐两朝的历史故事为题材，从隋文帝开国写到唐明皇驾崩。融合正史与民间传说，是隋唐系列小说的代表作。",th:"以通俗文学再现隋唐风云。在历史演义中展现英雄辈出的时代气象。",ex:"隋炀帝下江南——龙舟画舫，奢靡无度。\n\n秦琼卖马——英雄落魄时的无奈与坚守。\n\n程咬金三板斧——粗中有细，勇中有谋。\n\n尉迟恭单鞭夺槊——勇冠三军的武将风采。\n\n罗成大破一字长蛇阵——少年英雄的传奇故事。\n\n兴衰更替，朝代轮转，盛极而衰的历史规律。"},
135:{in:"《东周列国志》是清代冯梦龙改编、蔡元放评注的长篇历史小说，讲述东周五百余年的历史故事。以春秋战国时期的诸侯争霸为背景，展现了百家争鸣的恢弘时代。",th:"春秋战国的历史长卷。在诸侯争霸中展现智慧谋略和历史规律。",ex:"烽火戏诸侯——周幽王为博褒姒一笑，点燃烽火台，失信于天下。\n\n管仲相齐——管仲辅佐齐桓公，尊王攘夷，九合诸侯，一匡天下。\n\n卧薪尝胆——越王勾践忍辱负重，十年生聚，十年教训。\n\n退避三舍——晋文公信守承诺，以退为进。\n\n纸上谈兵——赵括空有理论，终致长平惨败。\n\n合纵连横——苏秦合纵六国抗秦，张仪连横破纵。"},
136:{in:"《鲁迅全集》收录中国现代文学奠基人鲁迅的小说、散文、杂文作品。狂人日记是中国第一篇白话小说，阿Q正传塑造了中国文学最经典的形象。鲁迅以笔为匕首投枪，是中国现代思想解放的先驱。",th:"以文学唤醒国民的灵魂。对封建礼教和国民劣根性的深刻批判，铁屋中的呐喊。",ex:"横眉冷对千夫指，俯首甘为孺子牛。\n\n阿Q精神——精神胜利法：被打了便想，我总算被儿子打了。\n\n狂人日记——我翻开历史一查，这历史没有年代，歪歪斜斜的每页上都写着仁义道德几个字。我横竖睡不着，仔细看了半夜，才从字缝里看出字来，满本都写着两个字是吃人！\n\n故乡——希望本是无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。\n\n真正的猛士，敢于直面惨淡的人生，敢于正视淋漓的鲜血。\n\n不在沉默中爆发，就在沉默中灭亡。"},
137:{in:"《骆驼祥子》是老舍创作的长篇小说，讲述北平人力车夫祥子的悲剧命运。祥子从一个勤劳朴实的青年沦为自暴自弃的行尸走肉，揭示了旧社会如何将好人逼成鬼。",th:"对旧社会的血泪控诉。在个人悲剧中展现社会制度对底层人民的碾压。",ex:"他没有什么模样，使他可爱的是脸上的精神。头不很大，圆眼，肉鼻子，两条眉很短很粗，头上永远剃得发亮。腮上没有多余的肉，脖子可是几乎与头一边儿粗。\n\n祥子的车被大兵抢了——他的车，他的血汗，他的命。\n\n虎妞——泼辣而又可悲的女人，嫁给了祥子却死于难产。\n\n小福子——黑暗中唯一的温暖，却被逼入白房子上吊自杀。\n\n体面的，要强的，好梦想的，利己的，个人的，健壮的，伟大的，祥子，不知陪着人家送了多少回殡；不知道何时何地会埋起他自己来，埋起这堕落的，自私的，不幸的，社会病胎里的产儿，个人主义的末路鬼！"},
138:{in:"《家》是巴金创作的激流三部曲之一，以高家这个封建大家庭为背景，描写了五四运动前后青年一代的觉醒与抗争。觉慧的反叛、觉新的妥协、梅的悲剧，写尽了新旧交替时代的矛盾。",th:"封建家庭的崩溃与青年一代的觉醒。以个体的抗争对抗旧制度的压迫。",ex:"我是青年，我不是畸人，我不是愚人，我要给自己把幸福争过来！\n\n觉慧——高家的叛逆者，冲出封建家庭的樊笼，走向新生活。\n\n觉新——在传统与新潮之间痛苦挣扎，做了旧制度的牺牲品。\n\n鸣凤——被迫嫁给冯老太爷，投湖自尽，以死抗争。\n\n梅表姐——与觉新青梅竹马，却被迫嫁人，郁郁而终。\n\n春天是我们的——觉慧离开高家，奔向自由的春天。"},
139:{in:"《子夜》是茅盾创作的长篇小说，以1930年代的上海为背景，描绘了中国民族资本家在帝国主义和买办资本夹击下的命运。以宏阔的叙事和精密的结构，被誉为中国现代文学的里程碑。",th:"民族资产阶级的命运悲剧。在时代巨变中展现中国社会的复杂面貌和阶级矛盾。",ex:"上海滩的夜——霓虹灯闪烁，证券交易所人声鼎沸，十里洋场的繁华与黑暗并存。\n\n吴荪甫——民族资本家的代表，雄心勃勃却在帝国主义和买办资本的夹击下节节败退。\n\n赵伯韬——买办资本家的典型，与帝国主义勾结，打压民族工业。\n\n吴荪甫试图建立自己的工业王国，却最终败于外国资本和国内投机。\n\n子夜已过，黎明何在——在黑暗中摸索前行的一代人。"},
140:{in:"《边城》是沈从文创作的中篇小说，以湘西边城茶峒为背景，讲述翠翠与傩送兄弟的纯美爱情。以诗意的笔触描绘了一个纯净美好的世外桃源，被誉为中国现代最美的小说。",th:"田园牧歌中的人性之美。在湘西山水间歌颂纯朴善良的民风和真挚的情感。",ex:"由四川过湖南去，靠东有一条官路。这官路将近湘西边境到了一个地方名为茶峒的小山城时，有一小溪，溪边有座白色小塔，塔下住了一户单独的人家。这人家只一个老人，一个女孩子，一只黄狗。\n\n翠翠在风日里长养着，把皮肤变得黑黑的，触目为青山绿水，一对眸子清明如水晶。\n\n这个人也许永远不回来了，也许明天回来！\n\n一切充满了善，然而到处是不凑巧。"},
141:{in:"《雷雨》是曹禺创作的四幕话剧，以一个资本家的家庭悲剧为题材，在一天之内集中展现了三十年的恩怨纠葛。被认为是中现代话剧的奠基之作。",th:"命运的不可抗力与阶级矛盾。在密闭空间中爆发压抑已久的人性冲突。",ex:"周朴园——伪善的资本家家长，三十年前抛弃了侍女侍萍。\n\n繁漪——被压抑的继母，在窒息的家庭中爆发疯狂的反抗。\n\n周萍与四凤——同母异父的兄妹，不知情的情况下相爱，最终触犯伦理。\n\n一场雷雨，洗刷了所有的伪装——伪善、虚伪、压抑在雷雨中彻底崩溃。\n\n我是你儿子的母亲，你是我的前夫——侍萍与周朴园三十年后的重逢。\n\n命运的齿轮一旦开始转动，无人能够逃脱。"},
142:{in:"《围城》是钱锺书创作的长篇小说，以方鸿渐的人生经历为线索，描绘了抗战时期知识分子的群像。婚姻是一座围城，城外的人想冲进去，城里的人想逃出来成为广为流传的名言。",th:"人生处处是围城。以幽默讽刺的笔触揭示知识分子群体的虚荣与困境。",ex:"婚姻是一座围城，城外的人想冲进去，城里的人想逃出来。\n\n方鸿渐——留洋归来，文凭是买来的，在人生的围城中越陷越深。\n\n苏文纨、唐晓芙、孙柔嘉——三个女人代表了三种爱情困境。\n\n人生处处是围城——职业是围城，爱情是围城，婚姻是围城，一切都是围城。\n\n对于丑人，细看是一种残忍。\n\n忠厚老实人的恶毒，像饭里的砂砾或者出骨鱼片里未净的刺，会给人一种不期待的伤痛。"},
143:{in:"《张爱玲全集》收录民国才女张爱玲的小说散文作品。以倾城之恋、金锁记、红玫瑰与白玫瑰等作品描绘上海和香港都市男女的情感世界。华丽而苍凉，是中国现代都市文学的经典。",th:"华丽苍凉的都市文学。以冷静透彻的目光审视人性的欲望与挣扎，在世俗中见深刻。",ex:"生命是一袭华美的袍，爬满了蚤子。\n\n倾城之恋——香港的沦陷成全了白流苏与范柳原的爱情。在这兵荒马乱的时代，个人主义者是无处容身的，可是总有地方容得下一对平凡的夫妻。\n\n金锁记——曹七巧戴着黄金的枷锁，用枷角劈杀了好几个人。三十年前的月亮早已沉下去，三十年前的人也死了，然而三十年前的故事还没完——完不了。\n\n红玫瑰与白玫瑰——娶了红玫瑰，久而久之，红的变了墙上的一抹蚊子血，白的还是床前明月光。\n\n因为懂得，所以慈悲。"},
144:{in:"《呼兰河传》是萧红创作的自传体长篇小说，以童年视角描绘东北小城呼兰河的风土人情。以诗意的语言和独特的叙事结构，记录了一个落后、麻木而又充满生命力的小城。",th:"小城往事中的生命叹息。在荒凉中寻找温暖，在麻木中发现生命的韧劲。",ex:"呼兰河这小城里边，以前住着我的祖父，现在埋着我的祖父。\n\n满天星光，满屋月亮，人生何如，为什么这么悲凉。\n\n花开了，就像睡醒了似的。鸟飞了，就像在天上逛似的。虫子叫了，就像虫子在说话似的。一切都活了，要做什么，就做什么。要怎么样，就怎么样，都是自由的。\n\n祖父浇菜，我也抢过来浇。他从来不骂我。\n\n黄瓜愿意开一个花，就开一个花，愿意结一个瓜，就结一个瓜。\n\n小城故事多，充满喜和乐——然而萧红笔下的呼兰河，却是一个寂寞的小城。"},
145:{in:"《徐志摩诗集》收录民国诗人徐志摩的诗歌作品。徐志摩是中国新诗运动的先驱，以轻灵飘逸的诗风和浪漫主义情怀著称。再别康桥是其不朽名篇，成为中国现代诗歌的经典。",th:"轻灵飘逸的浪漫主义诗风。以自由不羁的灵魂歌咏爱情、自由与美的理想。",ex:"轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。那河畔的金柳，是夕阳中的新娘；波光里的艳影，在我的心头荡漾。\n\n悄悄的我走了，正如我悄悄的来；我挥一挥衣袖，不带走一片云彩。\n\n我是天空里的一片云，偶尔投影在你的波心。\n\n最是那一低头的温柔，像一朵水莲花不胜凉风的娇羞。\n\n我将于茫茫人海中访我唯一灵魂之伴侣；得之，我幸；不得，我命。\n\n爱，就得给他自由。"},
146:{in:"《闻一多诗集》收录民国诗人闻一多的诗歌作品。闻一多是新格律诗的倡导者，以三美理论（音乐美、绘画美、建筑美）构建现代诗歌的形式。死水以其独特的意象和深沉的批判成为经典。",th:"以格律诗的形式承载深沉的爱国情怀。在诗歌的形式美与思想深度之间寻找平衡。",ex:"死水——这是一沟绝望的死水，清风吹不起半点漪沦。不如多扔些破铜烂铁，爽性泼你的剩菜残羹。也许铜的要绿成翡翠，铁罐上锈出几瓣桃花；再让油腻织一层罗绮，霉菌给他蒸出些云霞。\n\n红烛——红烛啊！这样红的烛！诗人啊！吐出你的心来比比，可是一般颜色？\n\n七子之歌——你可知macau不是我真姓？我离开你太久了，母亲！"},
147:{in:"《朱自清散文》收录现代散文家朱自清的散文作品。背影、荷塘月色、匆匆等名篇以真挚的情感和精致的文字成为现代散文的典范。父亲的背影和时光的匆匆打动了无数读者。",th:"以真情写散文的艺术典范。在平实的文字中蕴含深沉的亲情与对时光的感悟。",ex:"背影——我与父亲不相见已二年余了，我最不能忘记的是他的背影。他用两手攀着上面，两脚再向上缩；他肥胖的身子向左微倾，显出努力的样子。这时我看见他的背影，我的泪很快地流下来了。\n\n荷塘月色——月光如流水一般，静静地泻在这一片叶子和花上。薄薄的青雾浮起在荷塘里。叶子和花仿佛在牛乳中洗过一样；又像笼着轻纱的梦。\n\n燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？"},
148:{in:"《郁达夫文集》收录民国作家郁达夫的小说散文作品。郁达夫以自传体小说著称，以沉沦、春风沉醉的晚上等作品展现了知识分子的苦闷与彷徨。其散文写景抒情兼具，才气纵横。",th:"知识分子的苦闷与自我剖析。以直白的自传体写作展现内心的矛盾与挣扎。",ex:"沉沦——他觉得自己是一个世界上最不幸的人。他不知道他为什么活在这世上。\n\n春风沉醉的晚上——在贫民窟的阁楼上，两个落魄灵魂的相遇。烟厂的女工和失业的知识分子，在春风沉醉的夜晚分享彼此的寂寞。\n\n故都的秋——秋天，无论在什么地方的秋天，总是好的；可是啊，北国的秋，却特别地来得清，来得静，来得悲凉。\n\n一个人的孤独不是孤独，一个人找另一个人，一句话找另一句话，才是真正的孤独。"},
149:{in:"《冰心散文》收录民国女作家冰心的散文作品。冰心以爱的哲学著称，以母爱、童真、自然为主题。纸船、繁星·春水等作品以温柔细腻的笔触歌咏人间大爱。",th:"爱的哲学的温柔表达。以母爱、童心和自然之美构建温馨纯净的文学世界。",ex:"繁星闪烁着——深蓝的太空，何曾听得见它们对话？沉默中，微光里，它们深深的互相颂赞了。\n\n成功的花，人们只惊羡她现时的明艳！然而当初她的芽儿，浸透了奋斗的泪泉，洒遍了牺牲的血雨。\n\n母亲啊！你是荷叶，我是红莲。心中的雨点来了，除了你，谁是我在无遮拦天空下的荫蔽？\n\n墙角的花！你孤芳自赏时，天地便小了。\n\n童年啊！是梦中的真，是真中的梦，是回忆时含泪的微笑。"},
150:{in:"《林语堂散文》收录民国学者林语堂的散文作品。林语堂学贯中西，以幽默闲适的文风著称。生活的艺术以英文写就向西方介绍中国文化，其闲适哲学影响了东西方读者。",th:"闲适幽默的生活哲学。以中西文化比较的视角，倡导享受人生的艺术。",ex:"人生的幸福，不过是一种自我满足罢了。\n\n享受悠闲生活当然比享受奢侈生活便宜得多。要享受悠闲的生活只要一种艺术家的性情，在一种全然悠然的情绪中，去消遣一个闲暇无事的下午。\n\n读书或书籍的享受等素来被视为有修养的生活中的一种雅事。\n\n世界大同的理想生活，就是住在英国的乡村，屋子安装有美国的水电煤气等管子，有个中国厨子，有个日本太太，还有个法国的情妇。\n\n幽默是一种心理状态，一种人生观。"},
151:{in:"《彷徨》是鲁迅的第二部小说集，收录祝福、在酒楼上、伤逝等十一篇小说。与呐喊的战斗姿态不同，彷徨更多体现了鲁迅在寻找出路过程中的迷茫与深沉思考。",th:"在彷徨中寻找出路。对旧社会的批判更加深沉，对新道路的探求更加迫切。",ex:"祝福——祥林嫂的悲剧：她不是鲁镇人，死了丈夫后到鲁四老爷家帮佣，被婆家绑架卖到山里，第二个丈夫也死了，儿子被狼吃了，再回到鲁镇却被视为不祥之人，在祝福的爆竹声中孤独地死去。\n\n伤逝——涓生与子君的爱情悲剧：同居后的困顿生活消磨了爱情，子君回到娘家后死去。\n\n在酒楼上——吕纬甫的颓唐：当年锐意革新的青年，如今教人读孟子。\n\n路漫漫其修远兮，吾将上下而求索——这就是彷徨。"},
152:{in:"《茶馆》是老舍创作的三幕话剧，以北京裕泰茶馆为舞台，展现了从清末到抗战胜利五十年间中国社会的巨大变迁。以小茶馆写大时代，被誉为东方舞台上的奇迹。",th:"小茶馆里的大时代。以茶馆为缩影展现五十年社会变迁，各色人等粉墨登场。",ex:"王利发——茶馆掌柜，精明圆滑，处处逢迎，最终却被时代碾碎。\n\n常四爷——爱大清国，可谁爱我啊！一辈子不服软，到老还在挣扎。\n\n我爱咱们的国呀，可是谁爱我呢？\n\n秦仲义——实业救国的资本家，开了一辈子工厂，最终被没收。\n\n改良改良，越改越凉——王利发的无奈与讽刺。\n\n三个老头撒纸钱——给自己送葬，给自己的时代送葬。\n\n这是一面时代的镜子，照见了五十年的风云变幻。"},
153:{in:"《活着》是余华创作的长篇小说，讲述农民福贵经历内战、大跃进、文革等历史动荡，亲人一个接一个离世，最终只剩一头老牛相伴。以平静的笔调写出了最深刻的苦难。",th:"活着本身就是最大的意义。在极端苦难中展现生命的韧劲与承受力。",ex:"我知道黄昏正在转瞬即逝，黑夜从天而降了。我看到广阔的土地袒露着结实的胸膛，那是召唤的姿态。\n\n福贵的一生——从地主少爷到一贫如洗，经历了中国近代史上所有的苦难。\n\n亲人一个接一个离去——妻子家珍、儿子有庆、女儿凤霞、女婿二喜、外孙苦根，每失去一个亲人，福贵都变得更加沉默。\n\n人是为了活着本身而活着的，而不是为了活着之外的任何事物所活着。\n\n最后，一个老人和一头老牛，在黄昏的田野里慢慢走着。\n\n少年去游荡，中年想掘藏，老年做和尚。"},
154:{in:"《平凡的世界》是路遥创作的百万字长篇小说，以孙少安、孙少平兄弟为中心，展现了1975至1985年间中国城乡社会生活的巨大变迁。以朴实的笔调歌颂了普通人奋斗不屈的精神。",th:"平凡人的不平凡人生。在苦难与奋斗中展现生命的尊严和价值。",ex:"孙少平——一个不甘于平凡的农村青年，揽工、下矿、读书，在苦难中追求精神的富足。\n\n孙少安——十三岁辍学挑起家庭重担，开砖窑、办企业，在责任与梦想之间艰难抉择。\n\n生活不能等待别人来安排，要自己去争取和奋斗。\n\n人只有劳动才能活得有价值。\n\n一个平凡而普通的人，时时都会感到被生活的波涛巨浪所淹没。你会被淹没吗？除非你甘心就此沉沦！\n\n命运总是不如人愿，但往往是在无数的痛苦中，在重重的矛盾和艰辛中，才使人成熟起来。"},
155:{in:"《白鹿原》是陈忠实创作的长篇小说，以陕西白鹿原上白嘉轩和鹿子霖两个家族的恩怨纠葛为主线，展现了从清末到建国五十年间中国农村的历史巨变。被誉为民族的秘史。",th:"民族的秘史与土地的记忆。在家族恩怨中展现中国农村的沧桑巨变。",ex:"白嘉轩后来引以豪壮的是一生里娶过七回女人。\n\n白鹿原上白家和鹿家——两个家族三代人的恩怨情仇，映照着时代的风云变幻。\n\n朱先生——白鹿原上最后一个圣人，以其智慧和正气守护着乡土文明。\n\n田小娥——被侮辱与被损害的女性，死后化为厉鬼，是对男权社会的控诉。\n\n白鹿原——一个原上的悲欢，就是一部民族的近代史。\n\n世事你不经它，你就磨不高。"},
156:{in:"《红高粱家族》是莫言创作的长篇小说，以山东高密东北乡为背景，讲述抗日战争时期我爷爷余占鳌和我奶奶的传奇故事。以魔幻现实主义的笔法开创了中国乡土叙事的新境界。",th:"魔幻现实主义的乡土叙事。以瑰丽想象和原始生命力歌颂高密东北乡的英雄传奇。",ex:"一九三九年古历八月初九，我父亲这个土匪种十四岁多一点。他跟着后来名满天下的传奇英雄余占鳌司令去伏击日本人的汽车队。\n\n我奶奶戴凤莲——那一年她十六岁，坐进花轿嫁给了高密东北乡的酿酒作坊掌柜。\n\n红高粱——漫天遍野的红高粱，是这片土地上最野性的生命。\n\n高密东北乡无疑是地球上最美丽最丑陋、最超脱最世俗、最圣洁最龌龊、最英雄好汉最王八蛋的地方。\n\n莫言以狂欢式的叙事，为当代中国文学注入了原始的野性力量。"},
157:{in:"《蛙》是莫言创作的长篇小说，以计划生育政策为背景，讲述乡村女医生姑姑万心的一生。姑姑从接生无数婴儿的送子观音，到执行计划生育政策的铁腕干部，一生的转变令人唏嘘。",th:"生命与政策的深刻矛盾。在历史大潮中个人的无奈与罪恶感。",ex:"姑姑万心——她一生接生了近万个婴儿，是高密东北乡的送子观音。\n\n然而当计划生育政策推行时，姑姑成了铁腕执行者，引产了无数胎儿。\n\n姑姑的忏悔——晚年的姑姑陷入深深的忏悔，那个曾经在乡村田间奔跑的少女，被时代的洪流裹挟前行。\n\n每一个未出世的婴儿，都是姑姑心头的一块石头。\n\n蛙与娃同音，蛙声如婴儿啼哭——这是生命的呼唤，也是良知的追问。\n\n历史的对错由后人评说，个人的苦难却要自己承担。"},
158:{in:"《三体》是刘慈欣创作的科幻长篇小说三部曲，讲述地球文明与三体文明的生死博弈。以硬科幻的笔法构建宏大的宇宙图景，黑暗森林法则、降维打击等概念影响深远，被誉为中国科幻的里程碑。",th:"宇宙社会学的深邃思考。在硬科幻的宏大叙事中探讨文明的命运与生存法则。",ex:"给岁月以文明，而不是给文明以岁月。\n\n黑暗森林法则——宇宙就是一座黑暗森林，每个文明都是带枪的猎人。如果他发现了别的生命，能做的只有一件事：开枪消灭之。\n\n不要回答！不要回答！不要回答！——叶文洁收到了来自宇宙的警告。\n\n降维打击——用二向箔将太阳系从三维降到二维，碾成一幅画。\n\n面壁者罗辑——在宇宙的黑暗中，他以一己之力建立威慑，守护了人类最后的希望。\n\n弱小和无知不是生存的障碍，傲慢才是。\n\n失去人性，失去很多；失去兽性，失去一切。"},
159:{in:"《许三观卖血记》是余华创作的长篇小说，讲述丝厂工人许三观靠卖血度过人生一个个难关的故事。以黑色幽默的笔调描绘了底层小人物的辛酸命运。",th:"小人物的辛酸人生。在苦难中以幽默和坚韧活出尊严。",ex:"许三观第一次卖血，娶了许玉兰。\n\n一乐闯了祸，许三观去卖血赔钱。\n\n饥荒年，许三观去卖血带全家吃面条。\n\n一乐生病，许三观一路卖血到上海。\n\n许三观对许玉兰说：我这辈子就是靠卖血活过来的。\n\n卖血是一种痛——在针管插入静脉的那一刻，许三观觉得自己的命在一点一点流走。\n\n最后一章，年老的许三观想吃猪肝黄酒，却发现再也没有人要他的血了。他哭了——因为他的血卖不出去了。\n\n泪水里的笑，笑声里的泪。"},
160:{in:"《长恨歌》是王安忆创作的长篇小说，以上海小姐王琦瑶的一生为线索，描绘了上海从四十年代到九十年代的城市变迁。以细腻的笔触写尽了一个女人与一座城市的半世情缘。",th:"一座城市的女性记忆。在个人命运的浮沉中映射上海的时代变迁。",ex:"王琦瑶——四十年代的上海小姐，选美冠军，一生在上海弄堂中浮沉。\n\n上海的弄堂——那是城市的毛细血管，流淌着无数小人物的悲欢。\n\n程先生——王琦瑶生命中的第一个男人，为她拍照、为她心动，却始终未能如愿。\n\n从爱丽丝公寓到平安里的弄堂房子，王琦瑶的命运随着上海的时代而起伏。\n\n鸽子从弄堂上空飞过，带着这座城市半世纪的记忆。\n\n旧上海如梦，新上海如歌，长恨的是逝去的岁月和不再来的青春。"},
161:{in:"《城南旧事》是林海音创作的自传体短篇小说集，以小女孩英子的视角追忆二十年代北京城南的往事。惠安馆、我们看海去、爸爸的花儿落了等篇章温暖感人。",th:"童年记忆中的北京往事。以纯真的目光注视成人世界的悲欢离合。",ex:"爸爸的花儿落了，我也不再是小孩子。\n\n惠安馆——英子认识了疯女人秀贞，帮她找到了失散的女儿小桂子，却迎来了悲惨的结局。\n\n我们看海去——英子在草丛里认识了一个小偷，他偷东西是为了供弟弟上学。\n\n骆驼队来了，停在我家的门前。它们排列成一长串，沉默地站着，等候人们的安排。\n\n我对自己说，把它们写下来吧，让实际的童年过去，心灵的童年永存下来。\n\n夏天过去，秋天过去，冬天又来了，骆驼队又来了，但是童年却一去不还。"},
162:{in:"《北岛诗集》收录当代诗人北岛的诗歌作品。北岛是朦胧诗的代表人物，以回答、一切等诗作震撼文坛。卑鄙是卑鄙者的通行证，高尚是高尚者的墓志铭成为一代人的精神宣言。",th:"朦胧诗的精神叛逆。以冷峻的诗句对抗荒诞，在怀疑中寻找信念。",ex:"卑鄙是卑鄙者的通行证，高尚是高尚者的墓志铭。看吧，在那镀金的天空中，飘满了死者弯曲的倒影。\n\n我不相信天是蓝的，我不相信雷的回声，我不相信梦是假的，我不相信死无报应。\n\n一切命运都是烟雾，一切火焰都是泪水。\n\n一切都是命运，一切都是烟云。\n\n归途——沿着一条看不见的路，我走向你。\n\n在充满了声音的世界上，沉默是一种力量。\n\n也许最后的时刻到了，我没有留下遗嘱，只留下笔，给我的母亲。"},
163:{in:"《顾城诗集》收录当代诗人顾城的诗歌作品。顾城以纯真的童话诗风被称为童话诗人。黑夜给了我黑色的眼睛，我却用它寻找光明成为新时期诗歌最具代表性的名句。",th:"童话诗人的纯真与悲剧。以孩童般的目光观察世界，在纯真与黑暗之间挣扎。",ex:"黑夜给了我黑色的眼睛，我却用它寻找光明。\n\n你，一会看我，一会看云。我觉得，你看我时很远，你看云时很近。\n\n我是一个任性的孩子，我想涂去一切不幸。我想在大地上，画满窗子。让所有习惯黑暗的眼睛，都习惯光明。\n\n草在结它的种子，风在摇它的叶子。我们站着，不说话，就十分美好。\n\n避免，又避免不了。命运在敲门。\n\n一代人——一个被黑暗囚禁的人，用黑暗赋予的眼睛去寻找光明。"},
164:{in:"《海子诗集》收录当代诗人海子的诗歌作品。海子以纯粹的抒情诗风和燃烧般的生命激情著称。面朝大海，春暖花开成为中国人最向往的生活图景。",th:"以诗歌燃烧生命的歌者。在纯粹与狂热中追寻理想，用生命献祭诗歌。",ex:"从明天起，做一个幸福的人，喂马、劈柴，周游世界。从明天起，关心粮食和蔬菜。我有一所房子，面朝大海，春暖花开。\n\n我只愿面朝大海，春暖花开。\n\n姐姐，今夜我在德令哈，夜色笼罩。姐姐，今夜我只有戈壁。\n\n草原尽头我两手空空，悲痛时握不住一颗泪滴。\n\n以梦为马——我要做远方的忠诚的儿子，和物质的短暂情人。\n\n万人都要将火熄灭，我一人独将此火高高举起。\n\n你来人间一趟，你要看看太阳。"},
165:{in:"《我与地坛》是史铁生的长篇散文，讲述作者双腿瘫痪后在ize地坛公园的沉思与感悟。以深沉的笔调思考生死、命运与母爱，被誉为中国当代最动人的散文。",th:"在苦难中思考生命的意义。残疾的身体与丰盈的精神，母爱与生命的终极追问。",ex:"要是有些事我没说，地坛，你别以为是我忘了，我什么也没忘，但是有些事只适合收藏。\n\n我常觉得这中间有着宿命的味道：仿佛这古园就是为了等我，而历尽沧桑在那儿等待了四百多年。\n\n多年来我头一次意识到，这园中不单是处处都有过我的车辙，有过我的车辙的地方也都有过母亲的脚印。\n\n死是一件不必急于求成的事，死是一个必然会降临的节日。\n\n宇宙以其不息的欲望将一个歌舞炼为永恒。这欲望有怎样一个人间的姓名，大可忽略不计。\n\n命运中有一种错误是只能犯一次的，并没有改正的机会。"},
166:{in:"《文化苦旅》是余秋雨的文化散文集，以游历中国各地文化遗迹为线索，书写对中华文明的深沉思考。道士塔、莫高窟等篇章以优美的文笔和深沉的文化忧思打动了无数读者。",th:"行走中的文化反思。在山水古迹间追寻文明的足迹，以散文承载历史的厚重。",ex:"莫高窟——看莫高窟，不是看死了一千年的标本，而是看活了一千年的生命。\n\n道士塔——王圆箓，那个将敦煌经卷卖给斯坦因的道士。余秋雨写道：这是一个巨大的民族悲剧。\n\n废墟——没有废墟就无所谓昨天，没有昨天就无所谓今天和明天。\n\n我在这里看到了历史的每一个脚印，或深或浅，或正或斜，都是人类走过来的。\n\n山水本是自然之物，因了人的足迹和记忆，便有了文化的温度。\n\n中国文化的真实步履，落在这山重水复、莽莽苍苍的大地上。"},
167:{in:"《额尔古纳河右岸》是迟子建创作的长篇小说，以鄂温克族最后一位酋长女人的口吻，讲述这个游牧民族百年来的沧桑变迁。以诗意的笔触描绘了一个即将消逝的文明。",th:"消逝中的游牧文明挽歌。在自然与现代化的碰撞中守护民族记忆。",ex:"我是雨和雪的老熟人了，我有九十岁了。雨雪看老了我，我也把它们给看老了。\n\n驯鹿——它们是鄂温克人的伙伴，跟着季节迁徙，在兴安岭的森林中自由行走。\n\n萨满——族人的精神领袖，在鼓声中与天地对话。\n\n森林在缩小，驯鹿在减少，年轻人离开了山林。\n\n我守着这团火，无论遇到多大的风雪，都不让它熄灭。\n\n鄂温克的故事，就像额尔古纳河的水，缓缓流淌，不知归处。\n\n一个民族的百年，浓缩在一个老人的回忆里。"},
168:{in:"《尘埃落定》是阿来创作的长篇小说，以一个傻子土司少爷的视角，讲述四川阿坝地区土司制度的兴衰。以独特的叙事角度和诗性的语言，展现了藏地文明的变迁。",th:"一个傻子眼中的历史变迁。以天真之眼透视权力、欲望和文明的冲突。",ex:"我是一个傻子，但我看到了聪明人看不到的东西。\n\n麦其土司——在四川阿坝的群山之中，麦其土司是最大的领主。鸦片、银子和权力交织在这片土地上。\n\n傻子少爷——别人叫他傻子，但他却比所有人都更清楚地看到了即将到来的变化。\n\n罂粟花开了——土司们种下鸦片，种下了自己的毁灭。\n\n尘埃落定——当历史的车轮碾过，一切都化为尘土。\n\n我看到了明天，但明天不属于我。"},
169:{in:"《繁花》是金宇澄创作的长篇小说，以上海话为叙事语言，讲述六七十年代和九十年代上海的城市生活。以不厌其烦的细节描写和独特的口语叙事，被誉为上海城市文学的里程碑。",th:"上海城市记忆的文学重构。以方言叙事还原真实的市井生活，细节之美。",ex:"阿宝、沪生、小毛——三个上海男人，从小弄堂到改革开放，经历了上海半个世纪的变迁。\n\n饭局——上海的饭桌上，永远有说不完的故事。\n\n姝华说：人生是一次荒凉的旅行。\n\n不响——金宇澄最常用的词。上海人碰到事情，最多的反应就是不响。不响是一种态度，是一种智慧。\n\n男女之事，源自天理地利，花繁叶茂，桌面上不响，下面已经开满花。\n\n一部繁花，写尽了上海的声色犬马和人情冷暖。\n\n城市在变，人在老去，记忆永不褪色。"},
170:{in:"《黄金时代》是王小波创作的中篇小说，以文革时期云南插队知青王二的经历为题材。以黑色幽默的笔调对抗荒诞的现实，时代是荒谬的，但人可以在荒谬中保持自我的尊严。",th:"以黑色幽默对抗荒诞。在压抑的时代中保持个体的自由与尊严。",ex:"那一天我二十一岁，在我一生的黄金时代，我有好多奢望。我想爱，想吃，还想在一瞬间变成天上半明半暗的云。\n\n后来我才知道，生活就是个缓慢受锤的过程，人一天天老下去，奢望也一天天消失，最后变得像挨了锤的牛一样。\n\n王二和陈清扬——在荒谬的年代里，用爱情和性对抗虚伪和压迫。\n\n一切都在不可避免地走向庸俗。\n\n我的灵魂里有很多地方玩世不恭，对人傲慢无礼，但是它有一个核心，这个核心里只有爱。"},
171:{in:"《穆斯林的葬礼》是霍达创作的长篇小说，以北京一个回族家庭六十年间的兴衰为主线，讲述了玉器世家梁亦清一家三代人的命运。以深沉的笔触描绘了信仰、爱情与民族身份的交织。",th:"信仰与爱情的永恒冲突。在民族身份与文化交融中展现人性的光辉与挣扎。",ex:"新月——一个美丽而聪慧的女孩，在北大读书时与老师楚雁潮相恋，却因家族秘密和心脏病而天人永隔。\n\n韩子奇——玉器大师，一生痴迷于玉，守护着梁家的玉器铺子，却在爱情与责任之间痛苦抉择。\n\n梁君璧与梁冰玉——姐妹因同一个男人而反目，一个留在北京，一个远走海外。\n\n玉与月——韩子奇爱玉，新月爱月。玉器与月光，交织着一个回族家庭六十年间的悲欢。\n\n最干净的是信仰，最不干净的是人心。"},
172:{in:"《废都》是贾平凹创作的长篇小说，以西安古城为背景，描写了文化名人庄之碟的精神危机和生活沉沦。以大胆直白的笔触展现了转型期知识分子的精神困境。",th:"转型期知识分子的精神废墟。在物欲横流中寻找灵魂的出路。",ex:"庄之碟——西京四大文化名人之一，才华横溢却在欲望中迷失自我。\n\n废都——曾经辉煌的西京古城，如今在商品经济的冲击下，文化变成了商品，理想变成了笑话。\n\n城墙根下，剃头的、下棋的、卖狗皮膏药的——古城的市井烟火中弥漫着文化的没落。\n\n满纸荒唐言，一把辛酸泪——贾平凹以删节号的隐喻，写出了这个时代最隐秘的欲望与荒诞。\n\n一个城市的精神废墟，映射着一个时代的精神困境。"},
173:{in:"《秦腔》是贾平凹创作的长篇小说，以陕西清风街为背景，讲述了乡村在城市化进程中逐渐凋敝的故事。以细密的写实笔法和方言叙事，展现了中国农村在巨变中的阵痛。",th:"乡土文明的挽歌。在城市化浪潮中农村的凋敝与坚守，清风街上的悲欢。",ex:"清风街——陕西的一个普通村庄，在改革开放的浪潮中逐渐失去了往日的生机。\n\n夏天义——老支书，一辈子为清风街操劳，最后死于山体滑坡，被埋在他深爱的土地里。\n\n引生——村里的傻子，他看到了所有人的悲欢，却无力改变任何事。\n\n白雪——唱秦腔的好手，她的命运就是清风街命运的缩影——从繁华走向落寞。\n\n秦腔还在唱，但听的人越来越少了。\n\n土地是农民的命根子，可年轻人都进城了，谁来种地？"},
174:{in:"《青春之歌》是杨沫创作的长篇小说，讲述女知识分子林道静从迷茫到觉醒的成长历程。以五四运动到一二九运动为背景，展现了一代青年在民族危亡之际的抉择与担当。",th:"一代青年的觉醒与成长。在民族危亡之际寻找人生方向，以青春书写信仰。",ex:"林道静——从一个迷茫的小资产阶级女性，成长为坚定的革命者。\n\n卢嘉川——引领林道静走上革命道路的引路人，最终为信仰献出了生命。\n\n青春是美丽的，但在一个风雨飘摇的年代，青春的美丽必须与信仰和牺牲联系在一起。\n\n一个时代有一个时代的青春，一个时代有一个时代的歌。\n\n青春不是年华，而是心境；青春不是桃面，而是深沉的意志。"},
175:{in:"《林海雪原》是曲波创作的长篇小说，讲述解放战争时期东北剿匪的故事。以杨子荣、少剑波等英雄人物的传奇经历，展现了一段惊心动魄的革命历史。",th:"革命英雄主义的传奇叙事。在冰天雪地中书写惊心动魄的剿匪故事。",ex:"杨子荣——孤胆英雄，只身潜入匪巢威虎山，智斗座山雕。\n\n穿林海，跨雪原，气冲霄汉——京剧《智取威虎山》的经典唱段。\n\n天王盖地虎，宝塔镇河妖——土匪黑话中的接头暗号。\n\n少剑波——年轻指挥员，带领小分队深入林海雪原剿匪。\n\n百鸡宴——杨子荣在威虎山上以机智勇敢化解危机，最终在百鸡宴上活捉座山雕。\n\n林海茫茫，雪原无际，英雄的足迹永留大地。"},
176:{in:"《棋王》是阿城创作的中篇小说，讲述文革时期知青王一生痴迷下棋的故事。以极简的白描笔法和禅意境界，展现了在物质极度匮乏中精神世界的丰盈。",th:"在苦难中坚守精神世界。以棋道悟人生，物质虽匮乏精神不可穷。",ex:"王一生——在知青下乡的艰苦岁月里，唯一让他痴迷的就是下棋。\n\n吃不饱的时候，一顿饱饭就是天堂。\n\n他对我说：天下的事，不在乎，就是了。\n\n九盘连环棋——王一生以一敌九，盲棋大战，棋盘上风云变幻。\n\n棋道即是人道——棋盘虽小，方寸之间却有天地。\n\n做棋的尊严——王一生说：我下棋，是因为我要下棋，不为别的。\n\n文字简洁如白描，却字字千钧。"},
177:{in:"《动物凶猛》是王朔创作的中篇小说，以文革时期北京大院子弟的青春往事为题材。以痞子文学的风格和肆无忌惮的语言，刻画了一群在特殊年代里野蛮生长的少年。",th:"大院子弟的青春记忆。以不羁的笔调书写特殊年代里的青春躁动与叛逆。",ex:"我迷恋那些在阳光下奔跑的身影，迷恋那种肆无忌惮的欢笑。\n\n大院里的少年——不上学、不读书、打架泡妞、游泳爬墙，在混乱的年代里野蛮生长。\n\n那个夏天——阳光猛烈，空气里弥漫着青春的躁动和不可名状的欲望。\n\n青春是一种病，得过了才知道痛。\n\n姜文将此作改编为电影《阳光灿烂的日子》，银幕上马小军在屋顶上奔跑的画面成为经典。\n\n记忆是不可靠的，但你永远无法确定哪些是真实的，哪些是你编造的。"},
178:{in:"《妻妾成群》是苏童创作的中篇小说，讲述女大学生颂莲被迫嫁给陈佐千做四太太的故事。以阴郁华美的笔触描绘了封建家庭中女性的悲剧命运。",th:"封建庭院中的女性悲剧。在权力与欲望的牢笼中，女性的挣扎与毁灭。",ex:"颂莲——十九岁的女大学生，因家道中落被迫嫁入陈府做四姨太。\n\n陈府的深宅大院——高墙之内，四个女人为争宠而明争暗斗。\n\n井——后花园那口枯井，是绝望的象征。最终颂莲疯了，对着枯井不断地喊：有人跳井了。\n\n灯笼——每晚谁院里挂灯笼，谁就得宠。颂莲从争灯笼到厌恶灯笼，最终精神崩溃。\n\n一个年轻的生命，在封建家庭的高墙之内慢慢枯萎。\n\n张艺谋改编电影《大红灯笼高高挂》，使苏童蜚声国际。"},
179:{in:"《一地鸡毛》是刘震云创作的中篇小说，以小公务员小林的一天为线索，描写了都市小人物的日常生活琐事。以平淡写实的笔法揭示了生活的本质就是一地鸡毛。",th:"小人物的日常生活哲学。在鸡毛蒜皮中看到生活的真相，平凡即真实。",ex:"小林的一天——从早起排队买豆腐开始，到单位上班、分大白菜、处理各种琐事结束。\n\n一块馊了的豆腐——引发了一场家庭战争。生活的鸡毛蒜皮就是如此荒诞而真实。\n\n老婆、孩子、保姆、单位领导——每一个都是生活的课题，每一个都是鸡毛。\n\n生活就是一堆鸡毛，但谁也不能不去面对它。\n\n刘震云以不动声色的幽默，写出了小人物在大时代中的渺小与坚韧。\n\n一地鸡毛中也有温暖，那是因为生活还在继续。"},
180:{in:"《一句顶一万句》是刘震云创作的长篇小说，以寻找一个能说得上话的人为主题，讲述三代人在孤独中寻找理解与沟通的故事。被誉为中国版的百年孤独。",th:"中国式的百年孤独。在茫茫人海中寻找一个能说得上话的人。",ex:"一个人的孤独不是孤独，一个人找另一个人，一句话找另一句话，才是真正的孤独。\n\n杨百顺——为了找一个能说得上话的人，改名换姓，走遍千里。\n\n牛爱国——为了找一个能说得上话的人，放弃一切，踏上寻访之路。\n\n三代人的寻找——从杨百顺到牛爱国，三代人都在寻找那个能听懂自己说话的人。\n\n世上的事情，原来件件藏着委屈。\n\n人活着，就是为了找一个能说话的人。"},
181:{in:"《人生》是路遥创作的中篇小说，讲述农村青年高加林在城乡之间的人生抉择。以朴实的笔调展现了个人命运与时代环境之间的深刻矛盾。",th:"个人命运与时代困境。在理想与现实的夹缝中，人生的抉择往往充满无奈。",ex:"人生的道路虽然漫长，但紧要处常常只有几步。\n\n高加林——一个有才华的农村青年，在城乡之间来回摇摆。\n\n刘巧珍——善良纯朴的农村姑娘，深爱高加林却无法留住他的心。\n\n黄亚萍——城市姑娘，代表着高加林向往的城市生活。\n\n高加林选择了城市，却最终失去了一切，回到了原点。\n\n生活总是这样，不能叫人处处都满意。但我们还要热情地活下去。\n\n土地养育了他，他最终也回到了土地。"},
182:{in:"《暗算》是麦家创作的长篇小说，以中国情报部门701单位为背景，讲述天才密码破译者的传奇故事。以悬疑紧张的叙事和独特的题材，开创了谍战文学的新领域。",th:"无名英雄的传奇故事。在密码与情报的世界中展现天才的孤独与奉献。",ex:"阿炳——一个瞎子，却拥有超乎常人的听力，凭借这种天赋破译了敌方密码。\n\n黄依依——天才数学家，从海外归来为祖国破译密码，却最终死于一场意外。\n\n701——一个不存在的单位，一群不存在的人，做着最隐秘的工作。\n\n他们没有名字，只有代号；没有墓碑，只有绝密档案。\n\n天才与疯子只有一线之隔，他们在这条线上走了一辈子。\n\n密码是锁，人心是钥匙。最难破译的不是密码，而是人心。"},
