<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中文文学库 · 两千年文脉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--text2:#666;--accent:#c0392b;--accent2:#e74c3c;--border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:12px;--gold:#f39c12}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ===== Hero ===== */
.hero{position:relative;min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 20px 36px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:300;letter-spacing:.1em;margin-bottom:10px}
.hero h1 span{font-weight:700;background:linear-gradient(90deg,#e74c3c,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .subtitle{font-size:clamp(.85rem,2vw,1.1rem);opacity:.7;margin-bottom:24px;font-weight:300}
.stats-row{display:flex;gap:36px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:var(--gold)}
.stat .label{font-size:.75rem;opacity:.6;margin-top:2px}
.brush-line{width:120px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:18px auto;border-radius:2px}

/* ===== Discover Section ===== */
.discover{max-width:1200px;margin:-40px auto 0;padding:0 20px;position:relative;z-index:10}
.discover-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dtab{padding:6px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:.85rem;cursor:pointer;transition:all .25s;color:var(--text2);box-shadow:var(--shadow)}
.dtab:hover{border-color:var(--accent);color:var(--accent)}
.dtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.discover-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dcard{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start}
.dcard:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.1);border-color:var(--accent)}
.dcard-color{width:4px;min-height:48px;border-radius:2px;flex-shrink:0}
.dcard-body{flex:1;min-width:0}
.dcard h4{font-size:.95rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .dca{font-size:.8rem;color:var(--accent);margin-bottom:4px}
.dcard .dcd{font-size:.78rem;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .dcbadge{position:absolute;top:8px;right:8px;font-size:.65rem;padding:2px 8px;border-radius:10px;color:#fff}

/* ===== Era Nav ===== */
.era-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;transition:box-shadow .3s}
.era-nav.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.08)}
.era-nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.era-nav-inner::-webkit-scrollbar{display:none}
.era-btn{flex-shrink:0;padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text2);font-size:.82rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.era-btn:hover{border-color:var(--accent);color:var(--accent)}
.era-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.era-btn .count{display:inline-block;background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;font-size:.7rem;margin-left:4px}
.era-btn.active .count{background:rgba(255,255,255,.25)}

/* ===== Filter bar ===== */
.filter-bar{max-width:1200px;margin:20px auto 0;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius);font-size:.92rem;background:var(--card);outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.85rem}
.genre-filters{display:flex;gap:6px;flex-wrap:wrap}
.genre-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--card);font-size:.78rem;cursor:pointer;transition:all .2s;color:var(--text2)}
.genre-btn:hover{border-color:var(--accent);color:var(--accent)}
.genre-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-btn{padding:8px 14px;background:var(--card);border:none;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.view-btn.active{background:var(--text);color:#fff}
.view-btn:not(:last-child){border-right:1px solid var(--border)}

/* ===== Tag cloud ===== */
.tag-cloud{max-width:1200px;margin:12px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap}
.tag-chip{padding:3px 10px;border-radius:12px;font-size:.72rem;background:#f0f0f0;color:var(--text2);cursor:pointer;transition:all .2s}
.tag-chip:hover{background:var(--accent);color:#fff}
.tag-chip.active{background:var(--accent);color:#fff}

/* ===== Bookmark bar ===== */
.bookmark-bar{max-width:1200px;margin:10px auto 0;padding:0 20px;display:none;align-items:center;gap:8px}
.bookmark-bar.show{display:flex}
.bookmark-bar .blabel{font-size:.82rem;color:var(--accent);font-weight:600}
.bookmark-bar .bcount{font-size:.75rem;color:var(--text2);background:#f5f5f5;padding:2px 8px;border-radius:10px}
.bookmark-bar .bclear{font-size:.75rem;color:var(--text2);cursor:pointer;text-decoration:underline;margin-left:auto}

/* ===== Main content ===== */
.main{max-width:1200px;margin:20px auto 60px;padding:0 20px}
.result-info{color:var(--text2);font-size:.82rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.result-actions{display:flex;gap:8px}
.result-actions button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:.75rem;cursor:pointer;color:var(--text2);transition:all .2s}
.result-actions button:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Grid view ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .era-tag{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:.68rem;padding:3px 10px;border-radius:0 0 0 var(--radius)}
.card .card-bookmark{position:absolute;top:8px;right:8px;font-size:1.1rem;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .card-bookmark{opacity:1}
.card .card-bookmark.bookmarked{opacity:1;color:var(--gold)}
.card h3{font-size:1.02rem;font-weight:600;margin-bottom:3px;padding-right:60px}
.card .author{color:var(--accent);font-size:.82rem;margin-bottom:6px}
.card .desc{color:var(--text2);font-size:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .meta span{font-size:.68rem;padding:2px 7px;border-radius:10px;background:#f5f5f5;color:var(--text2)}
.card-excerpt{font-size:.75rem;color:#8e44ad;font-style:italic;margin:6px 0;padding:6px 10px;background:linear-gradient(135deg,#f5eef8,#ede7f6);border-radius:6px;border-left:3px solid #8e44ad;line-height:1.5}
/* Reading status */
.card .read-badge{position:absolute;top:0;left:0;background:#27ae60;color:#fff;font-size:.65rem;padding:2px 8px;border-radius:0 0 var(--radius) 0}

/* ===== Timeline view ===== */
.timeline{position:relative;padding-left:40px}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),#f39c12,var(--accent))}
.tl-item{position:relative;margin-bottom:18px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .3s}
.tl-item:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.tl-item::before{content:'';position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tl-item .year{font-size:.72rem;color:var(--accent);font-weight:600;margin-bottom:3px}
.tl-item h3{font-size:.92rem;font-weight:600;margin-bottom:2px}
.tl-item .author{font-size:.78rem;color:var(--text2)}
.tl-item .desc{font-size:.78rem;color:var(--text2);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Chart view ===== */
.chart-section{display:none}
.chart-section.show{display:block}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:14px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.chart-card h3{font-size:.92rem;font-weight:600;margin-bottom:14px;color:var(--text)}
canvas.chart{width:100%!important;height:260px!important}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 32px;position:relative;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:10px;right:14px;font-size:1.5rem;cursor:pointer;color:var(--text2);border:none;background:none;line-height:1}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:1.3rem;font-weight:700;margin-bottom:3px;padding-right:60px}
.modal .m-author{color:var(--accent);font-size:.95rem;margin-bottom:14px}
.modal .m-desc{line-height:1.8;color:var(--text);margin-bottom:14px}
.modal .m-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal .m-tags span{padding:3px 10px;border-radius:14px;font-size:.75rem;background:#f5f5f5;color:var(--text2)}
.modal .m-tags span:first-child{background:var(--accent);color:#fff}
.modal .m-actions{display:flex;gap:8px;margin-top:14px}
.modal .m-actions button{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:.82rem;cursor:pointer;transition:all .2s}
.modal .m-actions button:hover{border-color:var(--accent);color:var(--accent)}
.modal .m-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.m-section{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f8f9fa}
.m-section-title{font-size:.78rem;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:1px}
.m-intro{font-size:.85rem;line-height:1.8;color:#333;text-indent:2em}
.m-thought{font-size:.85rem;line-height:1.8;color:#2c3e50;padding-left:12px;border-left:3px solid #e67e22}
.m-excerpt{font-size:.85rem;line-height:2;color:#6c3483;font-style:italic;padding:8px 12px;background:linear-gradient(135deg,#fdf2f8,#f5eef8);border-radius:8px}
/* Related recommendations in modal */
.m-related{margin-top:16px;padding:14px;background:#f8f9fa;border-radius:10px}
.m-related-title{font-size:.78rem;font-weight:700;color:#555;margin-bottom:10px;letter-spacing:1px}
.m-related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.m-related-item{padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.m-related-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.m-related-item h5{font-size:.82rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-related-item .mri-a{font-size:.72rem;color:var(--accent)}
.m-related-item .mri-e{font-size:.68rem;color:var(--text2)}

/* ===== Scroll top ===== */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(192,57,43,.3);transition:all .3s;z-index:50}
.scroll-top:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(192,57,43,.4)}
.scroll-top.show{display:flex}

/* ===== Toast ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:8px;font-size:.85rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ===== Responsive ===== */
@media(max-width:768px){
.hero{min-height:45vh;padding:36px 16px 24px}
.stats-row{gap:20px}
.grid{grid-template-columns:1fr}
.chart-grid{grid-template-columns:1fr}
.filter-bar{flex-direction:column}
.genre-filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
.discover-cards{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
.hero h1{font-size:1.5rem}
.stat .num{font-size:1.3rem}
.era-btn{padding:5px 10px;font-size:.78rem}
.discover-cards{grid-template-columns:1fr}
}
@media(max-width:640px){
.card-excerpt{font-size:.7rem;padding:4px 8px}
.m-section{padding:10px 12px}
.m-intro,.m-thought,.m-excerpt{font-size:.8rem;line-height:1.7}
}
</style>
</head>
<body>
<!-- Hero -->
<div class="hero">
<h1>中文文学库 · <span>两千年文脉</span></h1>
<p class="subtitle">从诗经到长安的荔枝，200部作品纵览中华文明</p>
<div class="brush-line"></div>
<div class="stats-row" id="statsRow"></div>
</div>

<!-- Discover / Recommendations -->
<div class="discover" id="discoverSection">
<div class="discover-tabs">
<button class="dtab active" data-dtab="picks">🎯 每日精选</button>
<button class="dtab" data-dtab="random">🎲 随机发现</button>
<button class="dtab" data-dtab="bookmarks">⭐ 我的收藏</button>
<button class="dtab" data-dtab="unread">📖 未读清单</button>
</div>
<div class="discover-cards" id="discoverCards"></div>
</div>

<!-- Era Nav -->
<div class="era-nav" id="eraNav">
<div class="era-nav-inner" id="eraBtns"></div>
</div>

<!-- Filter -->
<div class="filter-bar">
<div class="search-box"><input id="searchInput" placeholder="搜索作品名、作者、关键词… （按 / 快捷搜索）"></div>
<div class="genre-filters" id="genreBtns"></div>
<div class="view-toggle">
<button class="view-btn active" data-view="grid">⊞</button>
<button class="view-btn" data-view="timeline">◷</button>
<button class="view-btn" data-view="chart">▧</button>
</div>
</div>

<!-- Tag Cloud -->
<div class="tag-cloud" id="tagCloud"></div>

<!-- Bookmark bar -->
<div class="bookmark-bar" id="bookmarkBar">
<span class="blabel">⭐ 已收藏</span>
<span class="bcount" id="bmCount">0</span>
<button class="bclear" id="bmClear">清除筛选</button>
</div>

<!-- Main -->
<div class="main">
<div class="result-info">
<span id="resultInfo"></span>
<div class="result-actions">
<button id="btnShuffle" title="随机排序">🔀 随机</button>
<button id="btnReset" title="重置筛选">↺ 重置</button>
</div>
</div>
<div id="gridView" class="grid"></div>
<div id="timelineView" class="timeline" style="display:none"></div>
<div id="chartView" class="chart-section"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modal">
<button class="modal-close" id="modalClose">×</button>
<div id="modalBody"></div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<button class="scroll-top" id="scrollTop">↑</button>

{id:85,t:"杨万里诗集",a:"杨万里",y:1180,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋四大家之一，'诚斋体'自然活泼，'小荷才露尖尖角'家喻户晓。",p:"江西"},
{id:86,t:"朱熹文集",a:"朱熹",y:1180,e:"宋代",g:"哲学",ty:"理学",d:"理学集大成者，四书集注为科举标准教材，影响中国思想史七百年。",p:"福建/江西"},
{id:87,t:"东京梦华录",a:"孟元老",y:1147,e:"宋代",g:"笔记",ty:"笔记",d:"追忆北宋汴京繁华盛景，城市生活的百科全书，珍贵的社会史料。",p:"河南"},
{id:88,t:"梦溪笔谈",a:"沈括",y:1088,e:"宋代",g:"科学",ty:"笔记",d:"北宋科学百科全书，涵盖天文数学物理化学等领域，被李约瑟称为'中国科学史里程碑'。",p:"浙江"},
{id:89,t:"文天祥诗集",a:"文天祥",y:1280,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋民族英雄，正气歌过零丁洋等慷慨悲壮，'人生自古谁无死'浩然正气。",p:"江西"},
{id:90,t:"岳飞诗词",a:"岳飞",y:1140,e:"宋代",g:"词",ty:"词集",d:"南宋名将词作，满江红'怒发冲冠'壮怀激烈，千古传诵。",p:"河南"},
{id:91,t:"元好问集",a:"元好问",y:1230,e:"辽金元",g:"诗歌",ty:"诗集",d:"金代文学代表，'问世间情是何物直教生死相许'千古名句。",p:"山西"},
{id:92,t:"关汉卿杂剧",a:"关汉卿",y:1290,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之首，窦娥冤为中国古典悲剧巅峰之作，千古奇冤感天动地。",p:"北京"},
{id:93,t:"西厢记",a:"王实甫",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧巅峰之作，张生与崔莺莺的爱情故事，'愿天下有情人终成眷属'。",p:"北京"},
{id:94,t:"窦娥冤",a:"关汉卿",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧悲剧代表，窦娥含冤而死六月飞雪，揭露社会黑暗伸张正义。",p:"北京"},
{id:95,t:"马致远杂剧",a:"马致远",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，汉宫秋等历史剧悲壮苍凉，天净沙·秋思被誉为'秋思之祖'。",p:"北京"},
{id:96,t:"赵氏孤儿",a:"纪君祥",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧名作，程婴救孤故事，忠义精神感人，最早被译介到欧洲的中国戏剧。",p:"北京"},
{id:97,t:"白朴杂剧",a:"白朴",y:1280,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，墙头马上梧桐雨等作品，文采斐然情感真挚。",p:"北京"},
{id:98,t:"张养浩散曲",a:"张养浩",y:1320,e:"辽金元",g:"散曲",ty:"散曲集",d:"元代散曲大家，山坡羊·潼关怀古'兴百姓苦亡百姓苦'千古名句。",p:"山东"},
{id:99,t:"崔颢黄鹤楼",a:"崔颢",y:740,e:"隋唐",g:"诗歌",ty:"七言诗",d:"黄鹤楼一诗传诵千古，据传李白见之亦搁笔叹'眼前有景道不得'。",p:"河南"},
{id:100,t:"李之仪词",a:"李之仪",y:1090,e:"宋代",g:"词",ty:"词集",d:"北宋词人，'我住长江头君住长江尾'朴素深情广为传唱。",p:"河北"},
{id:101,t:"西厢记诸宫调",a:"董解元",y:1200,e:"辽金元",g:"说唱",ty:"诸宫调",d:"金代说唱文学代表作，为王实甫西厢记的蓝本，保存了珍贵的音乐文学形式。",p:"北京"},
{id:102,t:"三国演义",a:"罗贯中",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部长篇历史演义小说，描写东汉末年至西晋近百年的历史风云，桃园三结义等故事家喻户晓。",p:"浙江"},
{id:103,t:"水浒传",a:"施耐庵",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部歌颂农民起义的长篇小说，一百零八位好汉替天行道的故事流传千古。",p:"江苏"},
{id:104,t:"西游记",a:"吴承恩",y:1592,e:"明代",g:"小说",ty:"长篇小说",d:"中国古典神魔小说巅峰，唐僧师徒四人西天取经的奇幻旅程，想象力惊天动地。",p:"江苏"},
{id:105,t:"金瓶梅",a:"兰陵笑笑生",y:1610,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部由文人独立创作的长篇世情小说，深刻揭示明代社会百态，文学价值极高。",p:"山东"},
{id:106,t:"牡丹亭",a:"汤显祖",y:1598,e:"明代",g:"戏剧",ty:"传奇",d:"明代戏剧巅峰，杜丽娘因梦而死又因情复生，'情不知所起一往而深'传诵千古。",p:"江西"},
{id:107,t:"封神演义",a:"许仲琳",y:1620,e:"明代",g:"小说",ty:"神魔小说",d:"以武王伐纣为背景的神魔小说，哪吒杨戬姜子牙等形象深入人心。",p:"江苏"},
{id:108,t:"徐霞客游记",a:"徐霞客",y:1640,e:"明代",g:"地理",ty:"游记",d:"明代地理名著，三十余年实地考察记录，对喀斯特地貌的研究早于西方两百年。",p:"江苏"},
{id:109,t:"三言",a:"冯梦龙",y:1620,e:"明代",g:"小说",ty:"话本集",d:"喻世明言警世通言醒世恒言三部白话短篇小说集，反映明代市井生活百态。",p:"江苏"},
{id:110,t:"二拍",a:"凌濛初",y:1630,e:"明代",g:"小说",ty:"话本集",d:"初刻拍案惊奇二刻拍案惊奇，与三言合称'三言二拍'，白话小说经典。",p:"浙江"},
{id:111,t:"临川四梦",a:"汤显祖",y:1600,e:"明代",g:"戏剧",ty:"传奇",d:"汤显祖四部传奇剧：牡丹亭紫钗记邯郸记南柯记，以梦为线索探讨人生。",p:"江西"},
{id:112,t:"归有光文集",a:"归有光",y:1560,e:"明代",g:"散文",ty:"文集",d:"明代散文家，项脊轩志为名篇，以家常琐事抒发深情淡而有味。",p:"江苏"},
{id:113,t:"张岱文集",a:"张岱",y:1650,e:"明代",g:"散文",ty:"小品文",d:"晚明小品文大家，陶庵梦忆西湖梦寻追忆往昔繁华，文字清隽风雅。",p:"浙江"},
{id:114,t:"袁宏道文集",a:"袁宏道",y:1600,e:"明代",g:"散文",ty:"小品文",d:"公安派代表，提倡'独抒性灵不拘格套'，反对复古拟古之风。",p:"湖北"},
{id:115,t:"天工开物",a:"宋应星",y:1637,e:"明代",g:"科技",ty:"科技著作",d:"中国古代科技百科全书，系统记载农业手工业技术，被誉为'中国17世纪的工艺百科全书'。",p:"江西"},
{id:116,t:"红楼梦",a:"曹雪芹",y:1791,e:"清代",g:"小说",ty:"长篇小说",d:"中国古典小说最高成就，以贾府兴衰为线索展现封建社会全貌，被誉为'中国封建社会的百科全书'。",p:"北京"},
{id:117,t:"聊斋志异",a:"蒲松龄",y:1690,e:"清代",g:"小说",ty:"文言小说",d:"中国文言短篇小说巅峰，四百余篇鬼狐故事，借鬼神讽世情想象瑰丽。",p:"山东"},
{id:118,t:"儒林外史",a:"吴敬梓",y:1750,e:"清代",g:"小说",ty:"讽刺小说",d:"中国讽刺小说巅峰之作，描绘科举制度下知识分子的众生相，辛辣幽默。",p:"安徽"},
{id:119,t:"桃花扇",a:"孔尚任",y:1699,e:"清代",g:"戏剧",ty:"传奇",d:"清代传奇剧代表，以秦淮名妓李香君与侯方域的爱情反映南明兴亡。",p:"山东"},
{id:120,t:"长生殿",a:"洪昇",y:1688,e:"清代",g:"戏剧",ty:"传奇",d:"清代传奇剧代表，写唐玄宗与杨贵妃爱情故事，与桃花扇并称'南洪北孔'。",p:"浙江"},
{id:121,t:"纳兰性德词集",a:"纳兰性德",y:1680,e:"清代",g:"词",ty:"词集",d:"清代第一词人，'人生若只如初见何事秋风悲画扇'凄美动人。",p:"北京"},
{id:122,t:"阅微草堂笔记",a:"纪昀",y:1790,e:"清代",g:"小说",ty:"笔记小说",d:"纪晓岚所著志怪小说集，与聊斋并称清代笔记小说双璧。",p:"北京"},
{id:123,t:"镜花缘",a:"李汝珍",y:1820,e:"清代",g:"小说",ty:"长篇小说",d:"奇幻冒险小说，描绘海外奇国异俗，寓讽刺于幻想之中。",p:"江苏"},
{id:124,t:"老残游记",a:"刘鹗",y:1903,e:"清代",g:"小说",ty:"长篇小说",d:"晚清四大谴责小说之一，通过江湖医生老残的游历揭露晚清社会黑暗。",p:"江苏"},
{id:125,t:"官场现形记",a:"李伯元",y:1903,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，全面揭露晚清官场腐败丑态，笔锋犀利。",p:"江苏"},
{id:126,t:"二十年目睹之怪现状",a:"吴趼人",y:1905,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，以见闻录形式记录晚清社会的种种怪现状。",p:"广东"},
{id:127,t:"孽海花",a:"曾朴",y:1905,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，以赛金花故事为线索反映晚清外交与社会。",p:"江苏"},
{id:128,t:"浮生六记",a:"沈复",y:1808,e:"清代",g:"散文",ty:"自传",d:"清代自传体散文，记录与妻子芸娘的平凡生活，真挚感人林语堂誉为中国文学最美之作。",p:"江苏"},
{id:129,t:"龚自珍集",a:"龚自珍",y:1830,e:"清代",g:"诗文",ty:"文集",d:"晚清思想先驱，'我劝天公重抖擞不拘一格降人才'开启近代思想启蒙。",p:"浙江"},
{id:130,t:"郑板桥集",a:"郑燮",y:1750,e:"清代",g:"诗文",ty:"文集",d:"扬州八怪之一，诗书画三绝，'难得糊涂'四字流传天下。",p:"江苏"},
{id:131,t:"袁枚集",a:"袁枚",y:1770,e:"清代",g:"诗文",ty:"文集",d:"清代才子，随园诗话倡导性灵说，小仓山房诗文集文采斐然。",p:"浙江"},
{id:132,t:"曾国藩家书",a:"曾国藩",y:1860,e:"清代",g:"散文",ty:"书信",d:"晚清名臣曾国藩的家书集，修身齐家治国的智慧结晶，影响至今。",p:"湖南"},
{id:133,t:"说岳全传",a:"钱彩",y:1750,e:"清代",g:"小说",ty:"历史小说",d:"讲述岳飞精忠报国的故事，民间影响深远，岳飞形象的文学定型之作。",p:"浙江"},
{id:134,t:"隋唐演义",a:"褚人获",y:1700,e:"清代",g:"小说",ty:"历史小说",d:"隋唐历史演义，从隋文帝到唐明皇的历史故事，英雄美人传奇荟萃。",p:"江苏"},
{id:135,t:"东周列国志",a:"冯梦龙",y:1650,e:"清代",g:"小说",ty:"历史小说",d:"系统讲述春秋战国历史的长篇小说，各诸侯国兴亡故事精彩纷呈。",p:"江苏"},
{id:136,t:"鲁迅全集",a:"鲁迅",y:1923,e:"民国",g:"小说/杂文",ty:"全集",d:"中国现代文学奠基人，狂人日记为中国第一篇白话小说，阿Q正传深刻揭示国民性。",p:"浙江/北京"},
{id:137,t:"骆驼祥子",a:"老舍",y:1937,e:"民国",g:"小说",ty:"长篇小说",d:"老舍代表作，描写北平人力车夫祥子的悲惨命运，京味文学的经典。",p:"北京"},
{id:138,t:"家",a:"巴金",y:1933,e:"民国",g:"小说",ty:"长篇小说",d:"巴金激流三部曲之一，描写封建家庭的崩溃，青年一代的觉醒与反抗。",p:"四川"},
{id:139,t:"子夜",a:"茅盾",y:1933,e:"民国",g:"小说",ty:"长篇小说",d:"茅盾代表作，描绘20世纪30年代上海的社会全景，中国现代长篇小说里程碑。",p:"浙江"},
{id:140,t:"边城",a:"沈从文",y:1934,e:"民国",g:"小说",ty:"中篇小说",d:"沈从文代表作，描绘湘西边城茶峒的纯美爱情，田园牧歌式的文学净土。",p:"湖南"},
{id:141,t:"雷雨",a:"曹禺",y:1934,e:"民国",g:"戏剧",ty:"话剧",d:"中国现代话剧奠基之作，两个家庭三十年的恩怨纠葛，戏剧冲突激烈震撼。",p:"天津"},
{id:142,t:"围城",a:"钱钟书",y:1947,e:"民国",g:"小说",ty:"长篇小说",d:"钱钟书唯一长篇，以幽默讽刺笔法描绘知识分子群像，'围在城里的人想逃出来'。",p:"江苏"},
{id:143,t:"张爱玲全集",a:"张爱玲",y:1944,e:"民国",g:"小说",ty:"作品集",d:"民国才女作家，倾城之恋金锁记等小说以冷艳笔触描绘都市男女，风格独特。",p:"上海"},
{id:144,t:"呼兰河传",a:"萧红",y:1940,e:"民国",g:"小说",ty:"长篇小说",d:"萧红代表作，描绘东北呼兰河小城的风土人情，笔调苍凉寂寞而深情。",p:"黑龙江"},
{id:145,t:"徐志摩诗集",a:"徐志摩",y:1928,e:"民国",g:"诗歌",ty:"诗集",d:"新月派代表诗人，再别康桥'轻轻的我走了正如我轻轻的来'浪漫唯美。",p:"浙江"},
{id:146,t:"闻一多诗集",a:"闻一多",y:1925,e:"民国",g:"诗歌",ty:"诗集",d:"新月派诗人，死水红烛等诗篇关注现实格律严整，后为民主运动献身。",p:"湖北"},
{id:147,t:"朱自清散文",a:"朱自清",y:1928,e:"民国",g:"散文",ty:"散文集",d:"现代散文大家，背影荷塘月色等名篇情感细腻真挚动人。",p:"江苏"},
{id:148,t:"郁达夫文集",a:"郁达夫",y:1930,e:"民国",g:"小说/散文",ty:"文集",d:"创造社创始人之一，沉沦等作品大胆暴露内心，文风清丽哀婉。",p:"浙江"},
{id:149,t:"冰心散文",a:"冰心",y:1923,e:"民国",g:"散文",ty:"散文集",d:"中国现代儿童文学先驱，繁星春水等作品以母爱童真自然为主题温暖动人。",p:"福建"},
{id:150,t:"林语堂散文",a:"林语堂",y:1937,e:"民国",g:"散文",ty:"散文集",d:"'两脚踏中西文化一心评宇宙文章'，吾国与吾民向世界介绍中国文化。",p:"福建"},
{id:151,t:"彷徨",a:"鲁迅",y:1926,e:"民国",g:"小说",ty:"短篇小说集",d:"鲁迅第二部小说集，祝福伤逝等名篇深刻揭示旧社会的压迫与人性的挣扎。",p:"北京"},
{id:152,t:"茶馆",a:"老舍",y:1957,e:"当代",g:"戏剧",ty:"话剧",d:"老舍戏剧杰作，通过裕泰茶馆五十年的变迁展现中国社会沧桑巨变。",p:"北京"},
{id:153,t:"活着",a:"余华",y:1993,e:"当代",g:"小说",ty:"长篇小说",d:"余华代表作，福贵一生的苦难与坚韧，以平静笔调书写命运无常感动千万读者。",p:"浙江"},
{id:154,t:"平凡的世界",a:"路遥",y:1988,e:"当代",g:"小说",ty:"长篇小说",d:"路遥代表作，描写黄土高原上普通人奋斗的人生故事，激励无数青年。",p:"陕西"},
{id:155,t:"白鹿原",a:"陈忠实",y:1993,e:"当代",g:"小说",ty:"长篇小说",d:"陈忠实代表作，描绘白鹿原上两个家族的恩怨与变迁，渭河平原的史诗。",p:"陕西"},

const EXT={
1:{in:"《诗经》是中国第一部诗歌总集，收录西周初年至春秋中叶约五百年间305篇诗歌。分风雅颂三部分：风为各地民歌，雅为宫廷乐歌，颂为祭祀颂歌。赋比兴的修辞手法影响中国诗歌数千年，是中国现实主义的源头。",th:"现实主义精神，以诗歌反映社会生活真实情感。思无邪的教化功能，诗可以兴观群怨。",ex:"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n昔我往矣，杨柳依依。今我来思，雨雪霏霏。\n蒹葭苍苍，白露为霜。所谓伊人，在水一方。"},
2:{in:"《楚辞》以屈原作品为核心，收宋玉等人作品。楚辞体打破诗经四言格局，以参差错落句式表达丰富情感想象。香草美人意象体系、瑰丽奇绝的神话世界，开创中国文学浪漫主义传统。",th:"浪漫主义传统，以奇绝想象和浓烈情感对抗现实黑暗。香草美人是忠贞高洁的永恒隐喻。",ex:"路漫漫其修远兮，吾将上下而求索。\n亦余心之所善兮，虽九死其犹未悔。"},
3:{in:"《离骚》是屈原被流放后创作的长篇政治抒情诗，373句2400余字。屈原自叙身世，驰骋想象遨游天界，最终不忍离弃故土而决心殉国。以香草美人比喻高洁理想，构建中国文学最宏大的象征体系。",th:"忠贞不渝的人格理想，在浊世中坚持高洁宁死不愿同流合污。个人命运与国家兴亡的深刻关联。",ex:"长太息以掩涕兮，哀民生之多艰。\n路漫漫其修远兮，吾将上下而求索。"},
4:{in:"《道德经》约五千言分上下两篇共81章，以道为核心概念论述宇宙本源、万物规律、治国修身之术。文字简约含义深远，影响遍及哲学宗教政治军事艺术各领域，被译成数百种文字。",th:"道法自然，万物运行的根本规律是道。主张无为而治、柔弱胜刚强、知足知止，物极必反的辩证思维。",ex:"道可道，非常道。名可名，非常名。\n上善若水，水善利万物而不争。\n知人者智，自知者明。"},
5:{in:"《论语》由孔子弟子及再传弟子编纂，20篇492章。内容涵盖仁义礼智信等核心概念，涉及教育政治修身处世。语言简练隽永，是中国人精神世界的基础文本，影响东亚文明两千余年。",th:"仁为核心，以仁为人格理想以礼为社会规范。有教无类的教育理念，中庸之道的处世哲学。",ex:"学而时习之，不亦说乎？\n己所不欲，勿施于人。\n三人行，必有我师焉。"},
6:{in:"《庄子》现存33篇，以寓言重言卮言的独特笔法构建自由无待的精神世界。庖丁解牛、庄周梦蝶、鹏程万里等寓言已成为中国文化的基本意象。其文汪洋恣肆，被誉为先秦诸子散文之冠。",th:"逍遥游的精神自由，超越世俗功名利禄追求心灵绝对自由。齐物论打破二元对立主张万物平等。",ex:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。\n天地与我并生，而万物与我为一。\n子非鱼，安知鱼之乐？"},
7:{in:"《孟子》七篇记录孟子言行论辩。继承发展孔子思想，提出性善论主张仁政民贵君轻。以雄辩气势和生动比喻阐述政治理想，大丈夫人格准则影响千古。",th:"性善论与仁政，人性本善人皆可以为尧舜。政治上民贵君轻，养浩然之气的人格修养。",ex:"生于忧患，死于安乐。\n富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。"},
8:{in:"《左传》记载自鲁隐公元年至鲁哀公二十七年共255年历史。叙事生动翔实，尤善描写战争和外交辞令。人物刻画栩栩如生，是先秦叙事散文巅峰之作。",th:"以史为鉴，通过春秋霸业兴衰揭示政治得失与道德教训。礼制秩序与政治智慧并重。",ex:"一鼓作气，再而衰，三而竭。\n居安思危，思则有备，有备无患。\n人谁无过？过而能改，善莫大焉。"},
9:{in:"《战国策》记述战国纵横家的政治主张和策略，按十二国编排。文章气势奔放辩丽恣肆，苏秦张仪等策士形象跃然纸上，是中国古代散文典范。",th:"纵横捭阖的政治智慧，弱肉强食时代以智谋口才取胜，强调审时度势灵活应变。",ex:"风萧萧兮易水寒，壮士一去兮不复还。\n亡羊而补牢，未为迟也。\n前事不忘，后事之师。"},
10:{in:"《孙子兵法》十三篇约六千字，系统论述战争的战略战术。从始计到用间涵盖战争全貌，强调知己知彼百战不殆。其思想超越军事领域，广泛应用于商业管理外交等。",th:"全胜战略，最高境界是不战而屈人之兵。兵者诡道、因敌制胜的辩证思维。",ex:"知彼知己，百战不殆。\n不战而屈人之兵，善之善者也。\n出其不意，攻其不备。"},
11:{in:"《山海经》是中国最古老的神话地理文献，18卷记载约100个邦国550座山300条水道及无数神兽异物。夸父逐日、精卫填海、女娲补天等神话出此书，是中国神话体系基石。",th:"远古先民对世界的想象与探索，以神话解释自然现象，体现面对未知世界的勇气和想象力。",ex:"夸父与日逐走，入日。渴欲得饮，饮于河渭。\n精卫衔微木，将以填沧海。"},
12:{in:"《周易》由易经和易传组成，以六十四卦的符号系统和卦爻辞构建解释宇宙万物变化的理论框架。被称为群经之首大道之源，阴阳对立统一思想渗透中国文化每个层面。",th:"变易、简易、不易——万物永恒变化但变化有规律可循，阴阳对立统一的核心思维。",ex:"天行健，君子以自强不息。地势坤，君子以厚德载物。\n穷则变，变则通，通则久。"},
13:{in:"《尚书》是中国最古老史书，记载从尧舜到春秋秦穆公时期的重要政治文献。包括训辞诰命誓词等，是研究上古历史和政治思想的核心文献。",th:"以史为鉴的治国理念，强调敬天保民、明德慎罚的政治智慧。",ex:"满招损，谦受益。\n民惟邦本，本固邦宁。"},
14:{in:"《荀子》32篇是先秦儒家集大成之作。提出性恶论，强调须以礼义教化。劝学篇论述学习方法，天论篇提出制天命而用之，逻辑严密气势雄辩。",th:"性恶论与礼治，人性本恶需礼义教化。强调后天学习和制度规范，礼法并用。",ex:"青取之于蓝而青于蓝，冰水为之而寒于水。\n锲而不舍，金石可镂。"},
15:{in:"《韩非子》55篇集法家思想之大成，融法术势三派之长。守株待兔、滥竽充数、自相矛盾等成语出此书。以大量寓言说理，论证雄辩。",th:"法术势三位一体，以法治国以术驭臣以势固权。强调严刑峻法和中央集权。",ex:"千里之堤，溃于蚁穴。\n以子之矛陷子之盾，何如？"},
16:{in:"《墨子》现存53篇，墨子主张兼爱非攻尚贤节用。其逻辑学墨辩和科学思想在先秦独树一帜，在光学力学几何学等领域有超前发现。",th:"兼爱非攻，无差别爱一切人反对不义战争。尚贤使能节用节葬的务实主张。",ex:"天下之人皆相爱，强不执弱，众不劫寡。\n兼相爱，交相利。"},
17:{in:"《列子》8篇以寓言故事阐发道家思想。愚公移山、杞人忧天等脍炙人口的寓言出此书。文体近似庄子而更朴素，想象力丰富哲理深刻。",th:"万物齐一，超越生死有无大小的二元对立，以达观态度面对人生。",ex:"太行王屋二山，方七百里，高万仞。\n杞国有人忧天地崩坠，废寝食者。"},
18:{in:"《晏子春秋》记载齐国名相晏婴言行事迹，8篇215章。通过大量生动故事展现晏婴智慧节俭和敢于直谏的政治品格。",th:"以智谏君，强调节俭爱民礼贤下士，以幽默智慧劝谏君王修正过失。",ex:"橘生淮南则为橘，生于淮北则为枳。\n为者常成，行者常至。"},
19:{in:"《九歌》是屈原在楚地民间祭歌基础上加工创作的祭祀诗歌，11篇。描写东皇太一云中君湘君湘夫人等神灵形象，融宗教神话爱情于一体，意境瑰丽。",th:"人神交融的浪漫想象，通过祭祀仪式沟通人神，表达对美好事物的渴望。",ex:"悲莫悲兮生别离，乐莫乐兮新相知。\n身既死兮神以灵，魂魄毅兮为鬼雄。"},
20:{in:"《天问》全诗通篇设问，从天地开辟问到人类历史共170余个问题。涉及天文地理历史神话等各领域，体现先民对宇宙万物的强烈好奇和理性探索精神。",th:"求索精神，以根本性问题质疑传统认知，体现理性思辨和对真理的不懈追求。",ex:"遂古之初，谁传道之？上下未形，何由考之？"},
21:{in:"《吕氏春秋》26卷160篇，战国末年吕不韦集合门客编撰的百科全书式著作。兼收儒道法墨兵农各家学说，以道家思想为主干构建宏大理论体系。一字千金出此。",th:"杂家融合，兼收并蓄各家之长以道统摄百家。强调顺应自然注重实效的治国理念。",ex:"流水不腐，户枢不蠹。\n竭泽而渔，岂不获得？而明年无鱼。"},
22:{in:"《史记》是中国第一部纪传体通史，记载上起黄帝下至汉武帝三千年历史。130篇52万余字，分本纪世家列传书表五种体例。首创以人物为中心的史学方法，叙事生动人物鲜明，被鲁迅誉为史家之绝唱无韵之离骚。",th:"究天人之际，通古今之变，成一家之言。以纪传体开创史学新范式，人物描写寄寓褒贬，史识史才史德兼具。",ex:"人固有一死，或重于泰山，或轻于鸿毛。\n桃李不言，下自成蹊。\n飞鸟尽，良弓藏；狡兔死，走狗烹。"},
23:{in:"《汉书》是中国第一部纪传体断代史，100卷记载西汉230年历史。文笔洗练条理清晰，创立了断代为史的编纂方法，后世正史多沿其体例。",th:"断代为史的开创性贡献，以严谨笔法记录一朝兴衰。强调正统观念和历史鉴戒功能。",ex:"水至清则无鱼，人至察则无徒。\n绳锯木断，水滴石穿。"},
24:{in:"《古诗十九首》是汉代无名氏所作的五言诗，标志着五言诗的成熟。内容多写离愁别恨、人生无常，情感真挚语言朴素，被誉为五言之冠冕。",th:"对生命短暂的深切感悟，在乱世中追求真情和人生意义。语言质朴而情味深远，开了抒情诗新境界。",ex:"行行重行行，与君生别离。\n人生天地间，忽如远行客。\n思君令人老，岁月忽已晚。"},
25:{in:"《论衡》是东汉王充所著的唯物主义哲学巨著，30卷85篇。批判天人感应与谶纬迷信，提倡实知求真，以理性思辨挑战当时的思想主流。",th:"唯物主义批判精神，反对迷信提倡实证。疾虚妄求实真的理性态度，在思想史上独树一帜。",ex:"知实者，必验之以物。\n事莫明于有效，论莫定于有证。"},
26:{in:"《说文解字》是中国第一部系统分析汉字字形的字书，收九千余字。许慎以小篆为正字，按偏旁部首排列，首创540部首的分类法，为文字学奠基之作。",th:"以字形分析探求文字本义，建立部首分类体系。奠定了中国文字学的基础框架，影响至今。",ex:"盖文字者，经艺之本，王政之始。"},
27:{in:"《汉乐府》是汉代官方采集的民歌，反映社会各阶层的生活。感于哀乐缘事而发的现实主义精神，上邪、陌上桑、十五从军征等名篇至今传诵。",th:"缘事而发的现实主义传统，以民歌形式反映社会生活。叙事性与抒情性并重，开创了乐府诗体。",ex:"上邪！我欲与君相知，长命无绝衰。\n采葵持作羹，不知心中伤。"},
28:{in:"《出师表》是诸葛亮北伐前上书后主刘禅的表文。全文以恳切言辞表达忠诚之心，分析天下形势提出治国建议。情理兼备，被誉为千古第一名表。",th:"忠贞报国之心，鞠躬尽瘁死而后已。以恳切言辞表达对国家的忠诚和对后主的期望。",ex:"臣鞠躬尽瘁，死而后已。\n亲贤臣，远小人，此先汉所以兴隆也。"},
29:{in:"《过秦论》是西汉贾谊的政论名篇，分上中下三篇。通过分析秦朝兴亡的教训，指出仁义不施而攻守之势异也，警醒千古。",th:"以史为鉴的政治思考，总结秦亡教训指出施行仁政的重要性。攻守之势异也的核心论断。",ex:"仁义不施而攻守之势异也。\n斩木为兵，揭竿为旗，天下云集响应。"},
30:{in:"《盐铁论》记录西汉盐铁会议争论，反映汉朝经济政策辩论。60篇涵盖经济政治军事文化等议题，是中国经济思想史的重要文献。",th:"国家干预与自由放任的经济辩论，反映汉代对经济政策的不同立场。以对话体记录真实历史争论。",ex:"富在术数，不在劳身；利在势居，不在力耕。"},
31:{in:"《洛神赋》是曹植代表作，描绘洛水女神宓妃之美。全赋以人神之恋为线索，辞采华美想象奇绝。翩若惊鸿婉若游龙等句成为描写女性之美的经典。",th:"以人神之恋寄托理想与现实的矛盾，表现对美好事物的追求和失落的惆怅。辞赋艺术的巅峰。",ex:"翩若惊鸿，婉若游龙。荣曜秋菊，华茂春松。\n凌波微步，罗袜生尘。"},
32:{in:"《文心雕龙》是中国第一部系统文学理论专著，50篇涵盖创作论批评论。刘勰以骈文写成，体大思精，从文体流变到创作规律均有精辟论述。",th:"系统全面的文学理论，探讨文体源流创作规律和批评标准。以道统文、文以载道的文学观。",ex:"操千曲而后晓声，观千剑而后识器。\n情者文之经，辞者理之纬。"},
33:{in:"《诗品》是中国第一部诗歌批评专著，品评五言诗人一百二十余人分三品论高下。钟嵘以简洁精当的评语评价诗人风格特色和艺术成就。",th:"以品第方式建立诗歌评价体系，注重诗人个性和风格特色。诗言志的批评传统。",ex:"气之动物，物之感人，故摇荡性情，形诸舞咏。"},
34:{in:"《世说新语》记载魏晋名士言行的笔记小说，按德行言语政事等36门分类。展现魏晋风度与名士精神，谢安、王羲之等人物形象鲜活生动。",th:"魏晋风度的生动写照，展现名士的个性自由和精神追求。以简约笔法刻画人物性格。",ex:"未能免俗，聊复尔耳。\n吾本乘兴而行，兴尽而返，何必见戴？"},
35:{in:"《搜神记》是魏晋志怪小说代表作，记载神仙鬼怪故事。干宝以此书开中国小说志怪传统，很多故事成为后世文学戏剧的素材来源。",th:"以志怪形式反映民间信仰和社会心理。虚构叙事中蕴含对现实的折射和思考。",ex:"干将莫邪的故事、韩凭夫妇的故事等，为后世文学提供了丰富的想象资源。"},
36:{in:"《陶渊明集》是田园诗派开创者的诗集。陶渊明归隐田园后写下大量描写乡村生活和自然风光的诗文，采菊东篱下悠然见南山成千古名句。桃花源记构建的理想社会影响深远。",th:"田园理想与自然人生，在隐逸生活中追求精神自由。不为五斗米折腰的独立人格。",ex:"采菊东篱下，悠然见南山。\n不戚戚于贫贱，不汲汲于富贵。\n结庐在人境，而无车马喧。"},
37:{in:"《阮籍咏怀诗》82首，是正始文学代表作。阮籍以隐晦曲折的笔法表达对现实的不满与忧虑，诗风深沉含蓄，在司马氏高压下以诗寄愤。",th:"在政治高压下以隐晦笔法表达不满，反映乱世知识分子的苦闷与彷徨。",ex:"夜中不能寐，起坐弹鸣琴。薄帷鉴明月，清风吹我襟。"},
38:{in:"《嵇康集》是竹林七贤领袖嵇康的文集。与山巨源绝交书等名篇展现独立人格精神，嵇康以激烈言行反抗虚伪礼教，最终被司马氏杀害。",th:"独立人格与反抗精神，追求真性情反对虚伪礼教。越名教而任自然的哲学立场。",ex:"非汤武而薄周孔，越名教而任自然。"},
39:{in:"《水经注》是综合性地理著作，详细记载河流山川。郦道元以优美文笔描写自然风光，三峡篇尤为著名。既是地理学经典，又是文学佳作。",th:"以实地考察为基础的地理记述，辅以优美的文学描写。科学与文学的完美结合。",ex:"自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日。\n巴东三峡巫峡长，猿鸣三声泪沾裳。"},
40:{in:"《木兰辞》是北朝乐府民歌，讲述花木兰代父从军的故事。全诗节奏明快语言质朴，塑造了巾帼英雄的经典形象，流传千古。",th:"孝道与爱国精神的结合，打破性别偏见的女性英雄主义。质朴刚健的北方民歌风格。",ex:"唧唧复唧唧，木兰当户织。\n万里赴戎机，关山度若飞。\n雄兔脚扑朔，雌兔眼迷离。"},
41:{in:"《孔雀东南飞》是中国文学史上第一部长篇叙事诗，讲述焦仲卿与刘兰芝的悲剧爱情。全诗350余句，情节曲折人物鲜明，控诉封建礼教对人性的摧残。",th:"对封建礼教的控诉，追求自由爱情的悲剧力量。双飞鸟的意象象征对爱情永恒的向往。",ex:"孔雀东南飞，五里一徘徊。\n君当作磐石，妾当作蒲苇。蒲苇韧如丝，磐石无转移。"},
42:{in:"《昭明文选》是中国现存最早的诗文总集，选录先秦至梁代七百余篇。萧统以事出于沉思义归乎翰藻为选文标准，是文学选本的典范。",th:"文学自觉时代的选本标准，注重文采与思想并重。确立文学独立于学术的地位。",ex:"选文以事出于沉思，义归乎翰藻为标准。"},
43:{in:"《陈情表》是李密辞不赴任的表文，以孝道动人。全文情真意切言辞恳切，与出师表并称两大名表。",th:"以孝道为辞的忠孝两全之术，以真情实感动人的文章典范。",ex:"臣无祖母，无以至今日；祖母无臣，无以终余年。"},
44:{in:"《归园田居》五首是陶渊明田园诗代表，描绘归隐田园的闲适生活。诗中榆柳荫后檐桃李罗堂前的意象成为中国田园诗的经典画面。",th:"回归自然的生命选择，在田园生活中找到心灵的安宁与自由。",ex:"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。"},
45:{in:"《饮酒·其五》是陶渊明最著名的诗篇之一。采菊东篱下悠然见南山，意境高远物我两忘，被誉为中国诗歌中最具禅意的名句。",th:"物我两忘的哲学境界，在日常生活中体悟生命真谛。心远地自偏的精神自由。",ex:"结庐在人境，而无车马喧。问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。"},
46:{in:"《滕王阁序》是初唐四杰王勃的名篇，全称秋日登洪府滕王阁饯别序。以骈文写就，辞藻华丽对仗工整。落霞与孤鹜齐飞秋水共长天一色传诵千古。",th:"以华丽的骈文抒发怀才不遇的感慨，在壮美景色中寄寓人生感悟。",ex:"落霞与孤鹜齐飞，秋水共长天一色。\n老当益壮，宁移白首之心？穷且益坚，不坠青云之志。"},
47:{in:"《春江花月夜》被闻一多赞为诗中的诗顶峰上的顶峰，以月为主线贯穿全诗36句。意境空灵幽美，孤篇盖全唐。",th:"宇宙意识与人生感悟的融合，在春江花月的美景中思考永恒与短暂。",ex:"春江潮水连海平，海上明月共潮生。\n人生代代无穷已，江月年年望相似。\n不知乘月几人归，落月摇情满江树。"},
48:{in:"《李白全集》收录诗仙李太白的全部诗作。李白以浪漫主义诗歌的巅峰成就照耀千年，将进酒、蜀道难、静夜思等名篇家喻户晓。诗风豪放飘逸想象奇绝。",th:"浪漫主义精神的极致表达，追求自由蔑视权贵的独立人格。诗与酒的狂欢精神。",ex:"君不见黄河之水天上来，奔流到海不复回。\n天生我材必有用，千金散尽还复来。\n床前明月光，疑是地上霜。"},
49:{in:"《杜甫全集》收录诗圣杜子美的全部诗作。杜甫以现实主义诗歌的顶峰成就反映社会现实，三吏三别等深刻揭示民间疾苦。被称为诗史。",th:"忧国忧民的现实主义精神，以诗歌记录时代苦难。沉郁顿挫的风格中蕴含深厚人道关怀。",ex:"国破山河在，城春草木深。\n安得广厦千万间，大庇天下寒士俱欢颜。\n无边落木萧萧下，不尽长江滚滚来。"},
50:{in:"《白居易集》收录新乐府运动倡导者的全部诗文。长恨歌琵琶行是长篇叙事名篇，语言通俗老妪能解。主张文章合为时而著歌诗合为事而作。",th:"文章合为时而著的现实主义文学主张，以平易语言表达深刻社会关怀。",ex:"在天愿作比翼鸟，在地愿为连理枝。\n同是天涯沦落人，相逢何必曾相识。\n离离原上草，一岁一枯荣。"},
51:{in:"《王维集》收录诗佛王摩诘的全部诗作。王维是山水田园诗派代表，诗中有画画中有诗。晚年笃信佛教，诗境空灵禅意深远。",th:"诗画合一的艺术境界，以禅入诗的空灵美学。物我交融的审美追求。",ex:"明月松间照，清泉石上流。\n行到水穷处，坐看云起时。\n大漠孤烟直，长河落日圆。"},
52:{in:"《孟浩然集》收录盛唐山水田园诗人孟浩然的诗作。春晓过故人庄等名篇清新自然淡远悠长，与王维并称王孟。",th:"自然淡远的诗歌美学，在田园山水中寻找心灵的宁静。",ex:"春眠不觉晓，处处闻啼鸟。\n绿树村边合，青山郭外斜。"},
53:{in:"《李商隐诗集》收录晚唐诗人李商隐的全部诗作。无题诗朦胧凄美意境深幽，春蚕到死丝方尽等句传诵千年。诗风华丽幽微为晚唐一绝。",th:"朦胧美的诗学追求，以隐晦意象表达难以言说的情感。对爱情和命运深沉的思考。",ex:"春蚕到死丝方尽，蜡炬成灰泪始干。\n此情可待成追忆，只是当时已惘然。\n夕阳无限好，只是近黄昏。"},
54:{in:"《杜牧诗集》收录晚唐杰出诗人杜牧的诗作。咏史怀古诗独步一时，停车坐爱枫林晚家喻户晓。诗风清丽俊逸在晚唐别具一格。",th:"咏史怀古的历史意识，在繁华与衰败的对比中寄寓深沉感慨。",ex:"停车坐爱枫林晚，霜叶红于二月花。\n东风不与周郎便，铜雀春深锁二乔。\n商女不知亡国恨，隔江犹唱后庭花。"},
55:{in:"《长恨歌》是白居易代表作，以叙事诗形式讲述唐玄宗与杨贵妃的爱情悲剧。天长地久有时尽此恨绵绵无绝期成为千古爱情名句。",th:"爱情与政治的双重悲剧，对帝妃之恋的同情与批判并存。以美人的悲剧折射历史的无情。",ex:"回眸一笑百媚生，六宫粉黛无颜色。\n在天愿作比翼鸟，在地愿为连理枝。\n天长地久有时尽，此恨绵绵无绝期。"},
56:{in:"《琵琶行》是白居易贬谪江州时所作。通过听琵琶女弹奏引出身世之感，同是天涯沦落人相逢何必曾相识成为千古名句。",th:"天涯沦落的深切共情，以音乐为媒介表达人生失意的感慨。",ex:"千呼万唤始出来，犹抱琵琶半遮面。\n同是天涯沦落人，相逢何必曾相识。\n大弦嘈嘈如急雨，小弦切切如私语。"},
57:{in:"《韩愈文集》收录唐宋八大家之首韩愈的散文。古文运动倡导者，师说进学解等名篇气势磅礴。文起八代之衰而道济天下之溺。",th:"古文运动的文学革新，反对骈文恢复散体文。文以载道、不平则鸣的文学主张。",ex:"师者，所以传道受业解惑也。\n业精于勤荒于嬉，行成于思毁于随。\n世有伯乐，然后有千里马。"},
58:{in:"《柳宗元文集》收录唐宋八大家之一柳宗元的散文。山水游记与寓言散文成就极高，永州八记为其代表作。被贬永州后寄情山水写出传世名篇。",th:"以山水寓言寄寓政治感慨，被贬中的精神坚守。游记散文的文学革新。",ex:"潭中鱼可百许头，皆若空游无所依。\n醉翁之意不在酒，在乎山水之间也。"},
59:{in:"《刘禹锡集》收录中唐诗人刘禹锡的诗文。沉舟侧畔千帆过病树前头万木春乐观豁达，被称为诗豪。多次被贬而诗风不改乐观本色。",th:"在逆境中保持乐观的精神力量，以辩证眼光看待人生沉浮。",ex:"沉舟侧畔千帆过，病树前头万木春。\n旧时王谢堂前燕，飞入寻常百姓家。\n自古逢秋悲寂寥，我言秋日胜春朝。"},
60:{in:"《寒山诗》收录唐代隐僧寒山的诗作，融合佛道思想，白话诗风独特。在海外尤其是日本和美国影响巨大，成为禅宗文化的代表。",th:"以通俗语言表达禅宗哲理，打破诗律束缚的自由表达。",ex:"吾心似秋月，碧潭清皎洁。无物堪比伦，教我如何说。"},
61:{in:"《王昌龄诗集》收录边塞诗派代表王昌龄的诗作。被誉为七绝圣手，秦时明月汉时关气魄雄浑。以精炼的七绝形式书写边塞壮丽与悲凉。",th:"边塞诗的壮美与悲凉，以精炼语言书写战争的残酷和思乡的深情。",ex:"秦时明月汉时关，万里长征人未还。\n黄沙百战穿金甲，不破楼兰终不还。"},
62:{in:"《岑参诗集》收录边塞诗派代表岑参的诗作。忽如一夜春风来千树万树梨花开写雪奇绝。以雄奇瑰丽的笔调描写西北边疆的壮美风光。",th:"以雄奇笔调描绘边塞风光和军旅生活，将艰苦化为壮美。",ex:"忽如一夜春风来，千树万树梨花开。\n马上相逢无纸笔，凭君传语报平安。"},
63:{in:"《高适诗集》收录边塞诗派代表高适的诗作。燕歌行气势豪迈，与岑参并称高岑。以深沉笔调反映边塞军旅生活的艰苦和壮烈。",th:"边塞诗的现实主义精神，既写壮志豪情也反映军旅苦难。",ex:"莫愁前路无知己，天下谁人不识君。"},
64:{in:"《李贺诗集》收录被称为诗鬼的李贺的诗作。诗风奇诡瑰丽想象惊人，黑云压城城欲摧为其名句。27岁英年早逝，留下诗坛奇才的传说。",th:"以奇诡想象突破传统诗美，营造幽冷瑰丽的独特意境。天才的早夭与诗艺的极致。",ex:"黑云压城城欲摧，甲光向日金鳞开。\n女娲炼石补天处，石破天惊逗秋雨。"},
65:{in:"《唐传奇》收录唐代文言短篇小说的精华。莺莺传、霍小玉传、南柯记等名篇标志中国小说走向成熟。情节曲折人物鲜明，对后世小说戏剧影响深远。",th:"中国小说的成熟标志，以虚构叙事探讨爱情命运和社会问题。标志着文学从实用走向审美自觉。",ex:"唐传奇开创了中国小说的传统，爱情题材、侠义题材、神怪题材并存发展。"},
66:{in:"《游子吟》是孟郊所作五言诗，歌颂母爱的千古绝唱。慈母手中线游子身上衣，以朴实无华的语言表达深厚的母子之情，感人至深。",th:"以朴素语言歌颂母爱，从日常细节中提炼人间最真挚的情感。",ex:"慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。"},
67:{in:"《阿房宫赋》是杜牧借秦灭之史讽谏当朝的辞赋。秦人不暇自哀而后人哀之警醒千古，是辞赋与政论完美结合的典范。",th:"以古讽今的政治警示，借秦之亡谏唐朝之弊。骄奢淫逸必亡的历史规律。",ex:"秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"},
68:{in:"《师说》是韩愈名篇，论述从师学习的重要性。师者所以传道受业解惑也成为千古教育名言，是古文运动的标志性作品。",th:"尊师重道的教育理念，反对耻学于师的社会风气。道之所存师之所存也。",ex:"师者，所以传道受业解惑也。\n道之所存，师之所存也。\n弟子不必不如师，师不必贤于弟子。"},
69:{in:"《花间集》是中国最早的词总集，收录晚唐五代十八家词五百首。以温庭筠韦庄为代表，多写男女情爱，是婉约词的源头。",th:"婉约词的开创与定型，以精致的意象表达细腻的情感。词为艳科的传统由此确立。",ex:"小山重叠金明灭，鬓云欲度香腮雪。\n春日游，杏花吹满头。"},
70:{in:"《李煜词集》收录南唐后主李煜的词作。亡国后词风沉痛凄美，问君能有几多愁恰似一江春水向东流传诵千古。以血泪写词成为词史上独特现象。",th:"以亡国之痛写出人类共通的情感体验。词从歌舞升平的工具变为抒发人生悲哀的文学形式。",ex:"问君能有几多愁？恰似一江春水向东流。\n流水落花春去也，天上人间。\n剪不断，理还乱，是离愁。"},
71:{in:"《花蕊夫人宫词》是后蜀花蕊夫人的百首宫词，描绘蜀宫生活细节。既是珍贵的宫廷史料，又具文学价值，笔触细腻纤丽。",th:"以女性视角记录宫廷生活，在华丽描写中隐含对权力与命运的感受。",ex:"三月樱桃乍熟时，内人争插玩芳枝。"},
72:{in:"《苏轼全集》收录北宋文学全才苏东坡的诗文词赋。诗书画三绝，念奴娇赤壁怀古、水调歌头等名篇光照千古。豪放与婉约并兼，开创宋词新境界。",th:"旷达乐观的人生态度，在挫折中保持精神自由。豪放词的开创与诗词文的全面成就。",ex:"大江东去，浪淘尽，千古风流人物。\n但愿人长久，千里共婵娟。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"},
73:{in:"《李清照集》收录婉约词派宗师的全部词作。寻寻觅觅冷冷清清千古第一才女，词作凄美动人在南宋词坛独树一帜。前期明快后期凄婉，以血泪写成。",th:"以女性独特感受书写人生悲欢，婉约词的艺术巅峰。将个人命运与时代苦难融为一体。",ex:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n知否知否？应是绿肥红瘦。\n莫道不销魂，帘卷西风，人比黄花瘦。"},
74:{in:"《辛弃疾词集》收录豪放词派代表辛弃疾的词作。醉里挑灯看剑梦回吹角连营雄浑悲壮。与苏轼并称苏辛，将词的境界推向新的高度。",th:"以词抒写报国壮志和恢复中原的理想，在豪放中寓含深沉的悲壮和愤慨。",ex:"醉里挑灯看剑，梦回吹角连营。\n众里寻他千百度，蓦然回首，那人却在灯火阑珊处。\n青山遮不住，毕竟东流去。"},
75:{in:"《陆游诗集》收录南宋爱国诗人陆游的九千余首诗。王师北定中原日家祭无忘告乃翁表达至死不渝的爱国之心。是中国诗歌史上存诗最多的诗人之一。",th:"至死不渝的爱国精神，以诗歌表达恢复中原的坚定信念。兼有田园诗和爱情诗的多重面貌。",ex:"王师北定中原日，家祭无忘告乃翁。\n山重水复疑无路，柳暗花明又一村。\n夜阑卧听风吹雨，铁马冰河入梦来。"},
76:{in:"《柳永词集》收录北宋词人柳永的词作。创制大量慢词，杨柳岸晓风残月广为传唱。凡有井水饮处即能歌柳词，是宋代最受欢迎的词人。",th:"慢词的创制与市井文化的繁荣，以通俗语言写都市生活与离愁别绪。",ex:"杨柳岸，晓风残月。\n衣带渐宽终不悔，为伊消得人憔悴。\n多情自古伤离别，更那堪冷落清秋节。"},
77:{in:"《欧阳修文集》收录北宋文坛领袖欧阳修的散文。醉翁亭记为山水散文极品，唐宋八大家之一。领导北宋诗文革新运动影响深远。",th:"诗文革新的文学主张，文道并重。以流畅自然的散文风格反对浮华。",ex:"醉翁之意不在酒，在乎山水之间也。\n人生自是有情痴，此恨不关风与月。"},
78:{in:"《王安石文集》收录北宋政治家兼文学家王安石的诗文。游褒禅山记等名篇传诵不衰，诗文革新运动重要人物。以政治家的眼光写诗文别有深意。",th:"改革精神贯穿文学创作，以诗文表达政治理想和人生感悟。文如其人的刚直风格。",ex:"不畏浮云遮望眼，自缘身在最高层。\n春风又绿江南岸，明月何时照我还。"},
79:{in:"《黄庭坚诗集》收录江西诗派开创者黄庭坚的诗作。讲究点铁成金夺胎换骨，与苏轼并称苏黄。诗风瘦硬生新自成一家。",th:"以学问为诗的创作方法，强调诗歌技法的锤炼和创新。",ex:"桃李春风一杯酒，江湖夜雨十年灯。"},
80:{in:"《范仲淹文集》收录北宋名臣范仲淹的诗文。岳阳楼记为千古名篇，先天下之忧而忧后天下之乐而乐激励无数仁人志士。",th:"以天下为己任的担当精神，忧乐天下的政治理想和人格境界。",ex:"先天下之忧而忧，后天下之乐而乐。\n不以物喜，不以己悲。"},
81:{in:"《晏殊词集》收录北宋宰相词人晏殊的词作。无可奈何花落去似曾相识燕归来意境浑然天成，是北宋前期婉约词的代表。",th:"以宰相之身写细腻之情，在富贵气象中寓含人生哲思。",ex:"无可奈何花落去，似曾相识燕归来。\n昨夜西风凋碧树，独上高楼望尽天涯路。"},
82:{in:"《周邦彦词集》收录北宋词集大成者周邦彦的词作。格律精严音韵和谐，被视为词家正宗。对宋词的艺术规范做出重要贡献。",th:"词的格律化和艺术规范化，以精工典雅的风格集北宋词之大成。",ex:"叶上初阳干宿雨，水面清圆，一一风荷举。"},
83:{in:"《姜夔词集》收录南宋格律派词人姜夔的词作。二十四桥仍在波心荡冷月无声清空骚雅。精通音律能自度曲，是宋词雅化的代表。",th:"清空骚雅的审美追求，以精纯技法营造空灵意境。词乐合一的艺术理想。",ex:"二十四桥仍在，波心荡，冷月无声。\n念桥边红药，年年知为谁开。"},
84:{in:"《秦观词集》收录苏门四学士之一秦观的词作。两情若是久长时又岂在朝朝暮暮为词中名句。词风柔婉细腻情致深长。",th:"以柔婉笔触书写爱情与离愁，将情感表达推向细腻深微的境界。",ex:"两情若是久长时，又岂在朝朝暮暮。\n郴江幸自绕郴山，为谁流下潇湘去。"},
85:{in:"《杨万里诗集》收录南宋四大家之一杨万里的诗作。诚斋体自然活泼，小荷才露尖尖角家喻户晓。以通俗活泼的语言写日常生活。",th:"诚斋体的活泼自然，以浅白语言捕捉生活中的诗意。反对雕琢提倡自然天成。",ex:"小荷才露尖尖角，早有蜻蜓立上头。\n接天莲叶无穷碧，映日荷花别样红。"},
86:{in:"《朱熹文集》收录理学集大成者朱熹的诗文。四书集注为科举标准教材，影响中国思想史七百年。理学体系严密逻辑清晰。",th:"理学的集大成，以天理论为核心构建哲学体系。存天理灭人欲的道德主张影响深远。",ex:"问渠那得清如许？为有源头活水来。\n等闲识得东风面，万紫千红总是春。"},
87:{in:"《东京梦华录》追忆北宋汴京繁华盛景，是城市生活的百科全书。孟元老以细腻笔触记录了北宋都城的市井风情和社会百态，是珍贵的社会史料。",th:"以追忆保存一座逝去城市的文化记忆，在繁华追忆中寄托故国之思。",ex:"记录了北宋都城开封的城市面貌、市井生活、节庆风俗等珍贵细节。"},
88:{in:"《梦溪笔谈》是北宋科学百科全书，涵盖天文数学物理化学等领域。沈括以其广博学识记录了当时的科技成就，被李约瑟称为中国科学史的里程碑。",th:"中国古代科学的集大成，以实证精神记录自然现象和技术发明。",ex:"指南针、活字印刷等重大发明的最早记录之一。"},
89:{in:"《文天祥诗集》收录南宋民族英雄文天祥的诗作。正气歌过零丁洋等慷慨悲壮，人生自古谁无死留取丹心照汗青浩然正气永存。",th:"舍生取义的民族气节，以诗歌表达视死如归的坚定信念。浩然正气的人格力量。",ex:"人生自古谁无死，留取丹心照汗青。\n天地有正气，杂然赋流形。"},
90:{in:"《岳飞诗词》收录南宋名将岳飞的诗词。满江红怒发冲冠壮怀激烈，是中华民族精神的象征。千古传诵的爱国篇章。",th:"精忠报国的爱国精神，以诗词抒写收复中原的壮志和壮志未酬的悲愤。",ex:"怒发冲冠，凭栏处，潇潇雨歇。\n三十功名尘与土，八千里路云和月。\n莫等闲，白了少年头，空悲切。"},
91:{in:"《元好问集》收录金代文学代表元好问的诗作。问世间情是何物直教生死相许千古名句。金亡后以诗存史被誉为一代文宗。",th:"以诗存史的文化担当，在金元易代之际以文学保存民族文化记忆。",ex:"问世间情是何物，直教生死相许。\n伤心秦汉经行处，宫阙万间都做了土。"},
92:{in:"《关汉卿杂剧》收录元曲四大家之首关汉卿的戏剧作品。窦娥冤为中国古典悲剧巅峰之作，千古奇冤感天动地。关汉卿以杂剧反映社会黑暗伸张正义。",th:"以杂剧揭露社会黑暗，为底层人民呐喊。窦娥冤的悲剧力量震撼人心。",ex:"地也，你不分好歹何为地！天也，你错勘贤愚枉做天！"},
93:{in:"《西厢记》是元杂剧巅峰之作，讲述张生与崔莺莺的爱情故事。愿天下有情人终成眷属的美好愿望，打破封建礼教对爱情的束缚。文采斐然曲词优美。",th:"反对封建礼教追求自由爱情，愿天下有情人终成眷属的人文主义精神。",ex:"碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。"},
94:{in:"《窦娥冤》是元杂剧悲剧代表，窦娥含冤而死六月飞雪。以超现实的浪漫手法控诉社会不公，是中国古典悲剧的巅峰。",th:"对社会黑暗的深刻揭露，以悲剧力量呼唤正义和天理。",ex:"为善的受贫穷更命短，造恶的享富贵又寿延。"},
95:{in:"《马致远杂剧》收录元曲四大家之一马致远的作品。汉宫秋等历史剧悲壮苍凉，天净沙秋思被誉为秋思之祖。",th:"以简练语言营造深远的抒情意境。天涯沦落的孤独感与历史兴亡的苍凉感。",ex:"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。"},
96:{in:"《赵氏孤儿》是元杂剧名作，讲述程婴救孤的忠义故事。最早被译介到欧洲的中国戏剧，伏尔泰曾据此改编。忠义精神感人至深。",th:"忠义精神的极致表达，为正义牺牲自我的崇高品格。",ex:"忠臣不怕死，怕死不忠臣。"},
97:{in:"《白朴杂剧》收录元曲四大家之一白朴的作品。墙头马上梧桐雨等，文采斐然情感真挚。以清丽的曲词书写历史与爱情。",th:"以优雅笔触融合历史感与抒情性，在元杂剧中别具文人气质。",ex:"梧桐叶上三更雨，叶叶声声是别离。"},
98:{in:"《张养浩散曲》收录元代散曲大家张养浩的作品。山坡羊潼关怀古兴百姓苦亡百姓苦千古名句。以散曲形式表达忧国忧民之思。",th:"对人民苦难的深切同情，兴亡百姓皆苦的历史洞见。",ex:"兴，百姓苦；亡，百姓苦。\n峰峦如聚，波涛如怒，山河表里潼关路。"},
99:{in:"《崔颢黄鹤楼》是唐诗七律名篇。黄鹤一去不复返白云千载空悠悠，据传李白见之亦搁笔叹眼前有景道不得崔颢题诗在上头。",th:"以登楼远眺引发古今之思，在空间与时间的交织中表达深沉的乡愁。",ex:"昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。\n日暮乡关何处是？烟波江上使人愁。"},
100:{in:"《李之仪词》收录北宋词人李之仪的词作。我住长江头君住长江尾朴素深情广为传唱。以最简洁的语言表达最深沉的思念。",th:"以长江为媒介表达相思之情，朴素语言中蕴含深厚情感。",ex:"我住长江头，君住长江尾。日日思君不见君，共饮长江水。"},
101:{in:"《西厢记诸宫调》是金代说唱文学代表作，为王实甫西厢记的蓝本。保存了珍贵的音乐文献和说唱艺术传统。",th:"说唱文学的过渡形态，从诸宫调发展为成熟杂剧的重要环节。",ex:"以说唱形式演绎张生与莺莺的爱情故事，开戏曲先河。"},
102:{in:"《三国演义》是中国第一部长篇历史演义小说，描写东汉末年至西晋近百年的历史风云。以刘备曹操孙权三方势力为主线，塑造了诸葛亮关羽张飞等经典形象。",th:"拥刘反曹的正统观念，忠义智勇的价值取向。天下大势分久必合合久必分的历史循环观。",ex:"天下大势，分久必合，合久必分。\n滚滚长江东逝水，浪花淘尽英雄。\n鞠躬尽瘁，死而后已。"},
103:{in:"《水浒传》是中国第一部歌颂农民起义的长篇小说。一百零八位好汉替天行道的故事，塑造了武松林冲鲁智深等鲜活形象。反映官逼民反的社会现实。",th:"官逼民反的反抗精神，替天行道的正义追求。对忠义精神的复杂思考。",ex:"路见不平一声吼，该出手时就出手。\n逼上梁山。\n四海之内皆兄弟。"},
104:{in:"《西游记》是中国古典神魔小说巅峰，讲述唐僧师徒四人西天取经的奇幻旅程。孙悟空的形象家喻户晓，想象力丰富情节曲折，是中国文学最受欢迎的作品之一。",th:"以取经之旅隐喻人生修行，降妖除魔象征战胜内心贪嗔痴。追求真理不畏艰难的精神。",ex:"敢问路在何方？路在脚下。\n皇帝轮流做，明年到我家。\n心生，种种魔生；心灭，种种魔灭。"},
105:{in:"《金瓶梅》是中国第一部由文人独立创作的长篇世情小说。以西门庆家庭生活为中心，深刻揭示明代社会百态。在中国小说史上首次将视线从英雄转向普通人。",th:"对晚明社会的深刻暴露，以家庭生活折射社会黑暗。从英雄叙事转向日常叙事的文学革新。",ex:"以冷静笔触描绘市井生活的方方面面，开中国世情小说先河。"},
106:{in:"《牡丹亭》是明代戏剧巅峰，汤显祖代表作。杜丽娘因梦而死又因情复生，情不知所起一往而深。以浪漫手法歌颂爱情的力量超越生死。",th:"至情论——情不知所起一往而深，生者可以死死可以生。以情抗理的人文主义精神。",ex:"情不知所起，一往而深。生者可以死，死可以生。\n原来姹紫嫣红开遍，似这般都付与断井残垣。"},
107:{in:"《封神演义》以武王伐纣为背景的神魔小说。哪吒杨戬姜子牙等形象深入人心，将历史与神话巧妙融合。构建了庞大的神仙体系。",th:"以神魔之战隐喻人间正义与邪恶的较量。天命观与个人反抗的张力。",ex:"道高一尺，魔高一丈。\n天下非一人之天下，乃天下人之天下。"},
108:{in:"《徐霞客游记》是明代地理名著，徐霞客三十余年实地考察的记录。对喀斯特地貌的研究早于西方，既是科学著作又是文学佳作。",th:"实地考察的科学精神，以亲身经历纠正古代地理记载的错误。求真务实的探索态度。",ex:"以脚步丈量大地，以笔墨记录山川。三十余年旅行考察的珍贵记录。"},
109:{in:"《三言》是冯梦龙编纂的三部白话短篇小说集：喻世明言、警世通言、醒世恒言。反映明代市井生活百态，是中国古代白话小说的经典。",th:"以通俗文学教化人心，在市井故事中寓含警世劝善之意。白话小说的成熟与繁荣。",ex:"话须通俗方传远，语必关风始动人。\n天下没有不散的筵席。"},
110:{in:"《二拍》是凌濛初编纂的两部白话短篇小说集，与三言合称三言二拍。初刻拍案惊奇、二刻拍案惊奇，白话小说的经典之作。",th:"以新奇故事吸引读者，在通俗叙事中寄寓道德教化。市民文学的繁荣。",ex:"世间万物皆有情，人情冷暖在其中。"},
111:{in:"《临川四梦》是汤显祖四部传奇剧：牡丹亭、紫钗记、邯郸记、南柯记。以梦为线索探讨人生真谛，是明代戏剧的最高成就。",th:"以梦为镜照见人生，四部剧以不同梦境探讨功名爱情权势人生的虚幻与真实。",ex:"梦中之情，何必非真。\n一生爱好是天然。"},
112:{in:"《归有光文集》收录明代散文家归有光的文章。项脊轩志为名篇，以家常琐事抒发深情淡而有味。唐宋派散文的代表作家。",th:"以家常琐事书写深沉情感，平淡中见真情的散文美学。",ex:"庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。"},
113:{in:"《张岱文集》收录晚明小品文大家张岱的文章。陶庵梦忆、西湖梦寻追忆往昔繁华，文字清隽风雅。在亡国之痛中以文字保存文化记忆。",th:"以小品文保存文化记忆，在追忆中寄托故国之思和人生感怀。",ex:"湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。"},
114:{in:"《袁宏道文集》收录公安派代表袁宏道的文章。提倡独抒性灵不拘格套，反对复古拟古之风。公安派的理论开创了晚明小品文的新局面。",th:"独抒性灵的文学主张，反对拟古强调个性表达。性灵说的文学革新。",ex:"独抒性灵，不拘格套。\n物之传者必以奇。"},
115:{in:"《天工开物》是中国古代科技百科全书，系统记载农业手工业技术。宋应星以图文并茂的方式记录了各项生产技术，被誉为中国17世纪的工艺百科全书。",th:"实学精神——以实证方法记录生产技术，强调经世致用。",ex:"贵五谷而贱金玉。\n此书于功名进取毫不相关也。"},
116:{in:"《红楼梦》是中国古典小说最高成就，以贾府兴衰为线索展现封建社会全貌。被誉为中国封建社会的百科全书。人物塑造性格鲜明，叙事结构宏大精密，语言优美精纯。",th:"对封建社会全面而深刻的批判，以爱情悲剧揭示社会悲剧。色空观念与人生如梦的哲学思考。",ex:"满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味？\n一个是阆苑仙葩，一个是美玉无瑕。\n假作真时真亦假，无为有处有还无。"},
117:{in:"《聊斋志异》是中国文言短篇小说巅峰，四百余篇鬼狐故事。蒲松龄借鬼神讽世情想象瑰丽，以花妖狐魅的故事反映社会现实批判科举弊端。",th:"借鬼狐之口写人间真情，以幻写真批判社会黑暗。对科举制度和礼教束缚的深刻反思。",ex:"写鬼写妖高人一等，刺贪刺虐入骨三分。"},
118:{in:"《儒林外史》是中国讽刺小说巅峰之作，描绘科举制度下知识分子的众生相。吴敬梓以辛辣幽默的笔法讽刺科举制度的腐朽和知识分子的虚伪。",th:"对科举制度的深刻批判，揭示功名利禄对人性的扭曲。讽刺小说的典范。",ex:"功名富贵无凭据，费尽心情总把流光误。"},
119:{in:"《桃花扇》是清代传奇剧代表，以秦淮名妓李香君与侯方域的爱情反映南明兴亡。借离合之情写兴亡之感，是中国古典戏剧的杰作。",th:"借离合之情写兴亡之感，以个人爱情折射国家兴亡。",ex:"桃花扇底送南朝，不独伤心是小朝廷。"},
120:{in:"《长生殿》是清代传奇剧代表，写唐玄宗与杨贵妃爱情故事。与桃花扇并称南洪北孔。以优美的曲词和宏大的结构再现盛唐爱情悲剧。",th:"爱情与政治的永恒矛盾，在盛唐悲剧中寄托兴亡之感。",ex:"天长地久有时尽，此恨绵绵无绝期。\n七月七日长生殿，夜半无人私语时。"},
121:{in:"《纳兰性德词集》收录清代第一词人纳兰性德的词作。人生若只如初见何事秋风悲画扇凄美动人。词风真挚自然在清初词坛独树一帜。",th:"以真挚情感书写人生无常，在富贵中对生命流逝的深切感悟。",ex:"人生若只如初见，何事秋风悲画扇。\n当时只道是寻常。\n一生一代一双人，争教两处销魂。"},
122:{in:"《阅微草堂笔记》是纪晓岚所著的志怪小说集，与聊斋并称清代笔记小说双璧。以简洁文笔记录奇闻异事，风格不同于聊斋的华丽而趋于质朴。",th:"以笔记形式记录民间传说和奇闻异事，在朴素的叙事中寄寓人生哲理。",ex:"以学者眼光记录民间怪谈，文笔简洁而有深意。"},
123:{in:"《镜花缘》是清代奇幻冒险小说，描绘海外奇国异俗。李汝珍以丰富的想象力创造了各种奇异的国度，寓讽刺于幻想之中。",th:"以幻想形式讽刺现实，在海外奇国中寄托社会理想。女性才能的肯定与赞赏。",ex:"以海外游记的形式，影射和批判现实社会的种种弊病。"},
124:{in:"《老残游记》是晚清四大谴责小说之一，通过江湖医生老残的游历揭露晚清社会黑暗。刘鹗以优美的散文笔法描写山水风景，是谴责小说中文学性最高的作品。",th:"对晚清社会黑暗的全面揭露，以游记形式串联社会百态。谴责中蕴含对国家前途的忧虑。",ex:"一路秋山红叶，老残自思：这等好山水，不知何时才能常在眼中。"},
125:{in:"《官场现形记》是晚清四大谴责小说之一，全面揭露晚清官场腐败丑态。李伯元以犀利笔锋描绘官场群丑，笔锋犀利入木三分。",th:"对晚清官场的全面暴露和尖锐讽刺，揭示腐败是封建制度必然产物。",ex:"以官场为舞台，演绎一幕幕丑态百出的闹剧。"},
126:{in:"《二十年目睹之怪现状》是晚清四大谴责小说之一，以见闻录形式记录晚清社会的种种怪现状。吴趼人以亲身经历般的笔触描绘社会的荒诞与黑暗。",th:"以见闻录形式记录社会百态，在荒诞中见真实的批判精神。",ex:"二十年间所见所闻，无非怪现状。"},
127:{in:"《孽海花》是晚清四大谴责小说之一，以赛金花故事为线索反映晚清外交与社会。曾朴以历史小说的笔法展现晚清的政治外交和社会风貌。",th:"以人物命运折射时代风云，在中西碰撞中展现晚清社会的复杂面貌。",ex:"一代名妓的命运沉浮，折射出晚清社会的风云变幻。"},
128:{in:"《浮生六记》是清代自传体散文，记录沈复与妻子芸娘的平凡生活。真挚感人，林语堂誉为中国文学中最可爱的女人。以家常笔触写深情。",th:"以平凡生活书写真挚爱情，在琐碎日常中发现人生之美。",ex:"布衣菜饭，可乐终身，不必作远游计也。"},
129:{in:"《龚自珍集》收录晚清思想先驱龚自珍的诗文。我劝天公重抖擞不拘一格降人才开启近代思想启蒙。以诗文为武器批判时政呼吁变革。",th:"思想启蒙的先驱，以诗文呼唤社会变革。批判时政倡导改革。",ex:"我劝天公重抖擞，不拘一格降人才。\n落红不是无情物，化作春泥更护花。\n九州生气恃风雷，万马齐喑究可哀。"},
130:{in:"《郑板桥集》收录扬州八怪之一郑板桥的诗文书画。难得糊涂四字流传天下，诗书画三绝。以通俗语言表达对民生的关切。",th:"难得糊涂的人生哲学，在清醒与糊涂之间寻找平衡。以诗文关怀民生疾苦。",ex:"难得糊涂。\n咬定青山不放松，立根原在破岩中。\n些小吾曹州县吏，一枝一叶总关情。"},
131:{in:"《袁枚集》收录清代才子袁枚的诗文。随园诗话倡导性灵说，反对格调说拟古之风。小仓山房诗文集文采斐然，是清中叶文坛的大家。",th:"性灵说的文学主张，强调诗歌应表达真实情感和个人性情。",ex:"苔花如米小，也学牡丹开。"},
132:{in:"《曾国藩家书》是晚清名臣曾国藩的家书集，记录其修身齐家治国的智慧。以家常语言谈论人生道理，影响至今被奉为处世经典。",th:"修身齐家治国的实践智慧，以家书形式传递人生经验和道德教诲。",ex:"天下古今之庸人，皆以一惰字致败；天下古今之才人，皆以一傲字致败。"},
133:{in:"《说岳全传》讲述岳飞精忠报国的故事，民间影响深远。岳飞形象的文学定型之作，以通俗小说形式传播岳飞的忠义精神。",th:"精忠报国的忠义精神，以小说形式塑造民族英雄的典范形象。",ex:"怒发冲冠，精忠报国。\n还我河山。"},
134:{in:"《隋唐演义》是隋唐历史演义，从隋文帝到唐明皇的历史故事。英雄美人传奇荟萃，以演义形式再现隋唐盛世的风云。",th:"以演义形式讲述历史，在英雄传奇中寄寓对盛世的向往。",ex:"隋唐英雄辈出，各显神通。"},
135:{in:"《东周列国志》系统讲述春秋战国历史的长篇小说，各诸侯国兴亡故事精彩纷呈。是了解先秦历史最通俗的文学读本。",th:"以小说形式普及历史知识，在列国争霸中展现政治智慧和人生哲理。",ex:"春秋战国五百年的风云变幻，尽在一书之中。"},
136:{in:"《鲁迅全集》收录中国现代文学奠基人的全部著作。狂人日记为中国第一篇白话小说，阿Q正传深刻揭示国民性。杂文如匕首投枪直刺黑暗。",th:"对国民性的深刻批判和对封建礼教的彻底否定。以文学为武器唤醒国民。",ex:"横眉冷对千夫指，俯首甘为孺子牛。\n不在沉默中爆发，就在沉默中灭亡。\n其实地上本没有路，走的人多了，也便成了路。"},
137:{in:"《骆驼祥子》是老舍代表作，描写北平人力车夫祥子的悲惨命运。以地道的京味语言描绘底层人民的挣扎与绝望，是京味文学的经典。",th:"对底层人民命运的深切关注，个人奋斗在黑暗社会中的必然失败。京味语言的艺术魅力。",ex:"雨下给富人，也下给穷人。苦难不只是物质的贫乏，更是精神的摧毁。"},
138:{in:"《家》是巴金激流三部曲之一，描写封建家庭的崩溃和青年一代的觉醒反抗。以真挚笔触描绘封建家庭的窒息和青年的叛逆。",th:"反封建的青春宣言，封建家庭制度对人性的压抑和青年一代的觉醒。",ex:"青春是美丽的东西，而且对我来说它永远是鼓舞的源泉。"},
139:{in:"《子夜》是茅盾代表作，描绘20世纪30年代上海的社会全景。以宏大的叙事结构展现中国民族资本家的命运和都市社会的复杂面貌。",th:"对半殖民地中国社会的全景描绘，民族资本家的困境和都市社会的矛盾。",ex:"以史诗般的笔触描绘了旧上海的繁华与黑暗。"},
140:{in:"《边城》是沈从文代表作，描绘湘西边城茶峒的纯美爱情。田园牧歌式的文学净土，以质朴纯净的文字构建理想的人性世界。",th:"对纯真人性的讴歌，在湘西净土中寻找理想的人性之美。田园牧歌式的文学理想。",ex:"这个人也许永远不回来了，也许明天回来。\n溪流如弓背，山路如弓弦。"},
141:{in:"《雷雨》是中国现代话剧奠基之作，两个家庭三十年的恩怨纠葛。戏剧冲突激烈人物关系复杂，被誉为中国的俄狄浦斯王。",th:"命运悲剧与阶级压迫的双重主题，封建家庭的罪恶和人性扭曲。",ex:"一阵雷雨过后，一切真相大白。命运的不可抗拒和人性的复杂纠葛。"},
142:{in:"《围城》是钱钟书唯一长篇，以幽默讽刺笔法描绘知识分子群像。围在城里的人想逃出来城外的人想冲进去，是对婚姻和人生的经典隐喻。",th:"围城困境——人生处处是围城，知识分子精神的困境和人生的荒诞。幽默讽刺的文学智慧。",ex:"城外的人想冲进去，城里的人想逃出来。\n对于丑人，细看是一种残忍。"},
143:{in:"《张爱玲全集》收录民国才女张爱玲的小说。倾城之恋金锁记等以冷艳笔触描绘都市男女。文字精致意象丰富，在华丽中见苍凉。",th:"在华丽与苍凉之间书写都市男女的爱情与命运。人性的洞察和文字的极致。",ex:"生命是一袭华美的袍，爬满了蚤子。\n因为懂得，所以慈悲。\n遇见你我变得很低很低，一直低到尘埃里去。"},
144:{in:"《呼兰河传》是萧红代表作，描绘东北呼兰河小城的风土人情。笔调苍凉寂寞而深情，在琐碎日常中写出生命的顽强与无奈。",th:"以苍凉笔调书写故乡记忆，在寂寞中表达对生命的深情。",ex:"满天星光，满屋月亮，人生何如，为什么这么悲凉。"},
145:{in:"《徐志摩诗集》收录新月派代表诗人徐志摩的诗作。再别康桥轻轻的我走了正如我轻轻的来浪漫唯美，是中国现代诗歌的经典。",th:"浪漫主义的诗学追求，以优美韵律和意象表达对自由和美的向往。",ex:"轻轻的我走了，正如我轻轻的来。\n我是天空里的一片云，偶尔投影在你的波心。"},
146:{in:"《闻一多诗集》收录新月派诗人闻一多的诗作。死水红烛等诗篇关注现实格律严整，后为民主运动献身。",th:"格律严谨的诗歌形式与炽热的爱国情怀。诗歌的建筑美理论。",ex:"死水酵成一沟绿酒，漂满了珍珠似的白沫。\n红烛啊！这样红的烛！"},
147:{in:"《朱自清散文》收录现代散文大家朱自清的散文。背影荷塘月色等名篇情感细腻真挚动人。是中国现代散文的经典。",th:"以细腻笔触书写亲情和自然之美，真挚情感和优美文笔的完美结合。",ex:"这时最热闹的，要数树上的蝉声与水里的蛙声。\n但热闹是它们的，我什么也没有。"},
148:{in:"《郁达夫文集》收录创造社创始人之一郁达夫的作品。沉沦等作品大胆暴露内心，文风清丽哀婉。以自传体小说开创现代文学的新风格。",th:"以暴露内心的勇气书写知识分子的苦闷，自传体小说的文学创新。",ex:"曾因酒醉鞭名马，生怕情多累美人。"},
149:{in:"《冰心散文》收录中国现代儿童文学先驱冰心的散文。繁星春水等作品以母爱童真自然为主题温暖治愈。",th:"爱的哲学——以母爱童真和自然之爱构建温暖的人生观。",ex:"成功的花，人们只惊羡她现时的明艳！然而当初她的芽儿，浸透了奋斗的泪泉。"},
150:{in:"《林语堂散文》收录两脚踏中西文化的林语堂的散文。吾国与吾民向世界介绍中国文化，以幽默闲适的笔调谈人生。",th:"中西文化交融的视野，以幽默闲适的笔调介绍中国文化和人生哲学。",ex:"人生在世，还不是有时笑笑人家，有时给人家笑笑。"},
151:{in:"《彷徨》是鲁迅第二部小说集，收录祝福伤逝等名篇。深刻揭示旧社会的压迫与人性的挣扎。",th:"在彷徨中坚持批判，以小说揭示封建社会的吃人本质。",ex:"凡是愚弱的国民，即使体格如何健全，也只能做毫无意义的示众的材料和看客。"},
152:{in:"《茶馆》是老舍戏剧杰作，通过裕泰茶馆五十年的变迁展现中国社会沧桑巨变。三幕剧跨越三个时代，以小见大反映社会变迁。",th:"以小见大的历史书写，一个茶馆就是一部中国近代史。对社会变迁的深刻思考。",ex:"我爱咱们的国呀，可是谁爱我呢？"},
153:{in:"《活着》是余华代表作，讲述福贵一生的苦难与坚韧。以平静笔调书写命运无常感动全球读者，是中国当代文学走向世界的标志性作品。",th:"活着本身就是生命的意义，以平静笔调书写命运无常中的坚韧。",ex:"人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。"},
154:{in:"《平凡的世界》是路遥代表作，描写黄土高原上普通人奋斗的人生故事。以现实主义笔法描绘改革开放初期中国农村的巨大变革，激励无数青年。",th:"在平凡中追求不平凡，普通人的奋斗精神。劳动与爱情的交织。",ex:"只有劳动才可能使人在生活中强大。"},
155:{in:"《白鹿原》是陈忠实代表作，描绘白鹿原上两个家族的恩怨与变迁。渭河平原的史诗，以魔幻现实主义手法展现近代中国的风云变幻。",th:"家族史诗中的民族命运，传统文化与现代文明的碰撞。",ex:"白嘉轩后来引以豪壮的是一生里娶过七回女人。"},
156:{in:"《红高粱家族》是莫言代表作之一，以浓烈色彩描绘高密东北乡的传奇故事。诺贝尔文学奖获奖作家的成名作，以魔幻现实主义重塑民间历史。",th:"以魔幻现实主义书写民间历史，浓烈的生命力和原始的野性美。",ex:"高密东北乡无疑是世界上最美丽最丑陋、最超脱最世俗的地方。"},
157:{in:"《蛙》是莫言诺贝尔文学奖获奖作品之一，以乡村女医生姑姑的一生反映计划生育政策。以书信体和话剧穿插的形式，深刻反思生命的意义。",th:"对生命伦理的深刻反思，计划生育政策下的人性挣扎。",ex:"以姑姑的一生为线索，展开对中国当代计划生育的深刻反思。"},
158:{in:"《三体》是中国科幻里程碑，黑暗森林法则宇宙社会学震撼全球。刘慈欣以硬科幻的方式思考宇宙文明的关系，雨果奖获奖作品。",th:"宇宙社会学的哲学思考——黑暗森林法则、技术爆炸、猜疑链。对人类文明命运的终极追问。",ex:"给岁月以文明，而不是给文明以岁月。\n弱小和无知不是生存的障碍，傲慢才是。\n失去人性，失去很多；失去兽性，失去一切。"},
159:{in:"《许三观卖血记》是余华又一力作，讲述许三观靠卖血度过人生难关。悲喜交织令人动容，以幽默笔调书写小人物的辛酸人生。",th:"小人物的生存智慧和生命韧性，在苦难中保持尊严和幽默。",ex:"血是一件好东西，想做什么就做什么。"},
160:{in:"《长恨歌》是王安忆代表作，描绘上海弄堂女人王琦瑶四十年的命运沉浮。茅盾文学奖获奖作品，以细腻笔触书写都市女性的命运。",th:"都市女性的命运书写，以一个女人的一生折射时代变迁。上海的城市记忆。",ex:"上海的弄堂是性感的，有一股肌肤之亲似的。"},
161:{in:"《城南旧事》是林海音自传体小说，以小女孩英子的视角展现20年代北京城南的生活。纯真的目光中透着淡淡的哀愁和怀旧。",th:"以童年视角书写成长与离别，在纯真中感受人生无常。",ex:"爸爸的花儿落了，我已不再是小孩子。"},
162:{in:"《北岛诗集》收录朦胧诗代表诗人北岛的诗作。卑鄙是卑鄙者的通行证高尚是高尚者的墓志铭成为时代的呐喊。",th:"朦胧诗的思想启蒙，以诗歌对抗平庸和虚伪。对自由和真理的坚守。",ex:"卑鄙是卑鄙者的通行证，高尚是高尚者的墓志铭。\n我不相信天是蓝的。"},
163:{in:"《顾城诗集》收录朦胧诗代表顾城的诗作。黑夜给了我黑色的眼睛我却用它寻找光明成为一代人的精神符号。诗风纯净如童话。",th:"以童真视角书写世界，在黑暗中寻找光明。纯粹诗学的追求。",ex:"黑夜给了我黑色的眼睛，我却用它寻找光明。\n草在结它的种子，风在摇它的叶子。我们站着，不说话，就十分美好。"},
164:{in:"《海子诗集》收录当代诗人海子的诗作。面朝大海春暖花开成为一代人的精神图腾。诗风纯粹热烈，以生命书写对理想世界的向往。",th:"以诗人的热情拥抱世界，在理想与现实之间寻找精神的栖息地。",ex:"从明天起，做一个幸福的人。喂马，劈柴，周游世界。\n面朝大海，春暖花开。"},
165:{in:"《我与地坛》是史铁生散文代表作，在地坛思考生死与命运。文字深沉而有力量，是关于生命意义的深刻思考。",th:"在残疾中思考生命的意义，对生死命运的深沉感悟。母爱与生命的力量。",ex:"死是一件无须乎着急去做的事，是一件无论怎样耽搁也不会错过的事。"},
166:{in:"《文化苦旅》是余秋雨文化散文代表作，行走中国大地的文化思考。开创文化大散文的文体，以行旅见闻书写文化感悟。",th:"以行走触发文化思考，在历史遗迹中寻找文化精神。文化大散文的开创。",ex:"我以为，中国历史上最激动人心的工程不是长城，而是都江堰。"},
167:{in:"《额尔古纳河右岸》是迟子建茅盾文学奖作品，描绘鄂温克族最后一位酋长女人的百年人生。以诗意的笔触书写一个民族的兴衰。",th:"以诗意的笔触记录一个民族的消亡，对自然文明的深切缅怀。",ex:"我是雨和雪的老熟人了，我有九十岁了。"},
168:{in:"《尘埃落定》是阿来茅盾文学奖作品，以傻子视角讲述土司制度的终结。藏族文化的史诗，以独特视角揭示历史的必然。",th:"以傻子的纯真透视权力和欲望的荒诞，历史进程中的文化冲突。",ex:"聪明的傻和傻的聪明之间，往往只有一线之隔。"},
169:{in:"《繁花》是金宇澄茅盾文学奖作品，以上海话书写上海市井生活。当代城市文学新高度，以方言重塑城市记忆。",th:"以方言书写城市记忆，在市井生活中发现文学的诗意。",ex:"上帝不响，像一切全由我定。"},
170:{in:"《黄金时代》是王小波代表作，以黑色幽默书写特殊年代的知识分子命运。独立精神的象征，以幽默对抗荒诞。",th:"以黑色幽默解构荒诞，独立自由精神的坚守。对理性和尊严的捍卫。",ex:"那一天我二十一岁，在我一生的黄金时代，我有好多奢望。"},
171:{in:"《穆斯林的葬礼》是霍达茅盾文学奖作品，讲述一个穆斯林家族六十年间的兴衰与爱情悲剧。以真挚笔触书写宗教信仰与爱情的冲突。",th:"宗教信仰与世俗爱情的冲突，一个家族的悲剧折射民族命运的沉重。",ex:"以玉器世家的兴衰为主线，展现一个穆斯林家族的悲欢离合。"},

// ===== Score system for recommendations =====
function getScore(w){
  let s=0;
  // Masterpieces get higher scores
  if([4,5,6,22,36,46,47,48,49,50,72,73,74,92,93,102,103,104,106,116,117,118,136,140,142,152,153,154,155,158].includes(w.id)) s+=3;
  // Has extended content
  if(EXT[w.id]) s+=2;
  // Not read yet
  if(!readList.includes(w.id)) s+=1;
  return s;
}

// ===== Seed-based random (for "daily" picks) =====
function seededRandom(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}
function getDailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}

// ===== Init =====
window.addEventListener('DOMContentLoaded',()=>{
  renderStats();
  renderEraNav();
  renderGenreBtns();
  renderDiscover('picks');
  renderTagCloud();
  renderView();
  bindEvents();
});

// ===== Render Stats =====
function renderStats(){
  const el=document.getElementById('statsRow');
  const span=W[W.length-1].y-W[0].y;
  el.innerHTML=`
    <div class="stat"><div class="num">${W.length}</div><div class="label">部作品</div></div>
    <div class="stat"><div class="num">${ERAS.length-1}</div><div class="label">个时代</div></div>
    <div class="stat"><div class="num">${Math.abs(Math.round(span/100))}+</div><div class="label">世纪跨度</div></div>
    <div class="stat"><div class="num">${new Set(W.flatMap(w=>w.p.split('/'))).size}</div><div class="label">个地域</div></div>
  `;
}

// ===== Discover Section =====
function renderDiscover(tab){
  curDtab=tab;
  const c=document.getElementById('discoverCards');
  let items=[];

  if(tab==='picks'){
    // Daily picks: use date seed to pick 6 diverse works
    const seed=getDailySeed();
    const scored=W.map(w=>({...w,score:getScore(w)+seededRandom(seed+w.id)*2})).sort((a,b)=>b.score-a.score);
    items=scored.slice(0,6);
  } else if(tab==='random'){
    // Random 6
    const shuffled=[...W].sort(()=>Math.random()-.5);
    items=shuffled.slice(0,6);
  } else if(tab==='bookmarks'){
    items=W.filter(w=>bookmarks.includes(w.id));
    if(!items.length){c.innerHTML='<div style="padding:20px;text-align:center;color:#999">还没有收藏，点击卡片上的 ⭐ 收藏喜欢的作品</div>';return;}
  } else if(tab==='unread'){
    items=W.filter(w=>!readList.includes(w.id));
    if(!items.length){c.innerHTML='<div style="padding:20px;text-align:center;color:#999">所有作品都已标记为已读 🎉</div>';return;}
    items=items.sort(()=>Math.random()-.5).slice(0,8);
  }

  c.innerHTML=items.map(w=>{
    const color=ERA_COLORS[w.e]||'#999';
    const icon=GENRE_ICONS[w.g]||'📄';
    return `<div class="dcard" data-id="${w.id}">
      <div class="dcard-color" style="background:${color}"></div>
      <div class="dcard-body">
        <h4>${icon} ${w.t}</h4>
        <div class="dca">${w.a} · ${fmtYear(w.y)}</div>
        <div class="dcd">${w.d}</div>
      </div>
      <div class="dcbadge" style="background:${color}">${w.e}</div>
    </div>`;
  }).join('');
}

// ===== Era Nav =====
function renderEraNav(){
  const c=document.getElementById('eraBtns');
  c.innerHTML=ERAS.map(e=>{
    const cnt=e==='全部'?W.length:W.filter(w=>w.e===e).length;
    return `<button class="era-btn${e===curEra?' active':''}" data-era="${e}">${e}<span class="count">${cnt}</span></button>`;
  }).join('');
}

function renderGenreBtns(){
  const c=document.getElementById('genreBtns');
  c.innerHTML=GENRES.map(g=>{
    return `<button class="genre-btn${g===curGenre?' active':''}" data-genre="${g}">${g}</button>`;
  }).join('');
}

// ===== Filter =====
function getFiltered(){
  let f=W;
  if(curEra!=='全部') f=f.filter(w=>w.e===curEra);
  if(curGenre!=='全部'){
    if(curGenre==='其他'){
      const main=['诗歌','小说','词','戏剧','散文','哲学','历史','辞赋','文学理论','科幻','军事','神话','地理','科技'];
      f=f.filter(w=>!main.includes(w.g));
    } else {
      f=f.filter(w=>w.g===curGenre);
    }
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    f=f.filter(w=>(w.t+w.a+w.d+w.e+w.g+w.p).toLowerCase().includes(q));
  }
  if(tagFilter){
    const chip=document.querySelector(`.tag-chip[data-tag="${tagFilter}"]`);
    if(chip){
      const ids=chip.dataset.ids.split(',').map(Number);
      f=f.filter(w=>ids.includes(w.id));
    }
  }
  if(shuffleMode) return f.sort(()=>Math.random()-.5);
  return f.sort((a,b)=>a.y-b.y);
}

// ===== Render View =====
function renderView(){
  const items=getFiltered();
  const info=document.getElementById('resultInfo');
  info.innerHTML=`共 <strong>${items.length}</strong> 部作品` + (tagFilter?` · 标签: ${tagFilter}`:'') + (shuffleMode?' · 随机排序':'');

  document.getElementById('gridView').style.display=curView==='grid'?'grid':'none';
  document.getElementById('timelineView').style.display=curView==='timeline'?'block':'none';
  const cv=document.getElementById('chartView');
  cv.classList.toggle('show',curView==='chart');

  if(curView==='grid') renderGrid(items);
  else if(curView==='timeline') renderTimeline(items);
  else renderCharts(items);
}

function renderGrid(items){
  document.getElementById('gridView').innerHTML=items.map(w=>{
    const ext=EXT[w.id]||{};
    const excerpt=ext.ex?ext.ex.split('\\n')[0]:'';
    const isBM=bookmarks.includes(w.id);
    const isRead=readList.includes(w.id);
    const icon=GENRE_ICONS[w.g]||'📄';
    return `
    <div class="card" data-id="${w.id}">
      ${isRead?'<div class="read-badge">✓ 已读</div>':''}
      <span class="card-bookmark${isBM?' bookmarked':''}" data-bid="${w.id}" title="${isBM?'取消收藏':'收藏'}">⭐</span>
      <div class="era-tag">${w.e}</div>
      <h3>${icon} ${w.t}</h3>
      <div class="author">${w.a} · ${fmtYear(w.y)}</div>
      <div class="desc">${w.d}</div>
      ${excerpt?`<div class="card-excerpt">「${excerpt}」</div>`:''}
      <div class="meta">
        <span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span>
      </div>
    </div>
  `}).join('');
}

function renderTimeline(items){
  document.getElementById('timelineView').innerHTML=items.map(w=>`
    <div class="tl-item" data-id="${w.id}">
      <div class="year">${fmtYear(w.y)} · ${w.e}</div>
      <h3>${w.t}</h3>
      <div class="author">${w.a} · ${w.g}</div>
      <div class="desc">${w.d}</div>
    </div>
  `).join('');
}

// ===== Charts =====
function renderCharts(items){
  const cv=document.getElementById('chartView');
  cv.innerHTML=`<div class="chart-grid">
    <div class="chart-card"><h3>📊 时代分布</h3><canvas id="eraChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 体裁分布</h3><canvas id="genreChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 地域分布 Top 10</h3><canvas id="regionChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 时间线密度</h3><canvas id="timeChart" class="chart"></canvas></div>
  </div>`;
  requestAnimationFrame(()=>drawCharts(items));
}

function drawCharts(items){drawEraChart(items);drawGenreChart(items);drawRegionChart(items);drawTimeChart(items)}

function drawEraChart(items){
  const c=document.getElementById('eraChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  ERAS.slice(1).forEach(e=>counts[e]=0);
  items.forEach(w=>{if(counts[w.e]!==undefined)counts[w.e]++});
  const entries=Object.entries(counts);const max=Math.max(...entries.map(e=>e[1]),1);
  const barW=W2/entries.length-8;
  entries.forEach(([era,cnt],i)=>{
    const x=i*(barW+8)+4;const h=Math.max((cnt/max)*(H-60),0);
    ctx.fillStyle=ERA_COLORS[era]||'#999';
    ctx.beginPath();roundRect(ctx,x,H-30-h,barW,h,4);ctx.fill();
    ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(era.slice(0,2),x+barW/2,H-12);
    if(cnt>0){ctx.fillStyle='#333';ctx.font='bold 11px sans-serif';ctx.fillText(cnt,x+barW/2,H-34-h)}
  });
}

function drawGenreChart(items){
  const c=document.getElementById('genreChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  items.forEach(w=>{counts[w.g]=(counts[w.g]||0)+1});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(...entries.map(e=>e[1]),1);const barH=24;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c'];
  entries.forEach(([g,cnt],i)=>{
    const y=i*(barH+6)+10;const w2=Math.max((cnt/max)*(W2-120),0);
    ctx.fillStyle=colors[i%colors.length];ctx.beginPath();roundRect(ctx,80,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(g,74,y+16);
    ctx.fillStyle='#666';ctx.textAlign='left';ctx.fillText(cnt,86+w2,y+16);
  });
}

function drawRegionChart(items){
  const c=document.getElementById('regionChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  items.forEach(w=>{w.p.split('/').forEach(p=>{counts[p]=(counts[p]||0)+1})});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const max=Math.max(...entries.map(e=>e[1]),1);const barH=22;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c','#2c3e50','#d35400'];
  entries.forEach(([p,cnt],i)=>{
    const y=i*(barH+5)+10;const w2=Math.max((cnt/max)*(W2-100),0);
    ctx.fillStyle=colors[i%colors.length];ctx.beginPath();roundRect(ctx,70,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(p,64,y+15);
    ctx.fillStyle='#666';ctx.textAlign='left';ctx.fillText(cnt,76+w2,y+15);
  });
}

function drawTimeChart(items){
  const c=document.getElementById('timeChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const sorted=[...items].sort((a,b)=>a.y-b.y);if(!sorted.length)return;
  const minY=sorted[0].y,maxY=sorted[sorted.length-1].y;const range=maxY-minY||1;
  ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,H-30);ctx.lineTo(W2-10,H-30);ctx.stroke();
  sorted.forEach((w,i)=>{
    const x=40+(w.y-minY)/range*(W2-60);
    ctx.fillStyle=ERA_COLORS[w.e]||'#999';
    ctx.beginPath();ctx.arc(x,H-30-8-Math.random()*80,3,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#999';ctx.font='10px sans-serif';ctx.textAlign='center';
  [sorted[0],sorted[Math.floor(sorted.length/2)],sorted[sorted.length-1]].forEach(w=>{
    const x=40+(w.y-minY)/range*(W2-60);ctx.fillText(fmtYear(w.y),x,H-14);
  });
}

// ===== Utility =====
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,Math.max(w,0)/2,Math.max(h,0)/2);if(w<=0||h<=0)return;
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}
function fmtYear(y){return y<0?'公元前'+Math.abs(y)+'年':y+'年'}

// ===== Related recommendations =====
function getRelated(w){
  // Same era, same genre, or related authors
  return W.filter(x=>x.id!==w.id).map(x=>{
    let score=0;
    if(x.e===w.e) score+=2;
    if(x.g===w.g) score+=3;
    if(x.a===w.a) score+=2;
    if(x.p===w.p) score+=1;
    return {...x,score};
  }).sort((a,b)=>b.score-a.score).slice(0,4);
}

// ===== Modal =====
function showModal(id){
  const w=W.find(x=>x.id===id);if(!w)return;
  const ext=EXT[id]||{};
  const isBM=bookmarks.includes(w.id);
  const isRead=readList.includes(w.id);
  const related=getRelated(w);
  const color=ERA_COLORS[w.e]||'#999';
  const introHtml=ext.in?`<div class="m-section"><div class="m-section-title">📖 作品简介</div><div class="m-intro">${ext.in}</div></div>`:'';
  const thoughtHtml=ext.th?`<div class="m-section"><div class="m-section-title">💡 主要思想</div><div class="m-thought">${ext.th}</div></div>`:'';
  const excerptHtml=ext.ex?`<div class="m-section"><div class="m-section-title">✨ 精选摘录</div><div class="m-excerpt">${ext.ex.replace(/\n/g,'<br>')}</div></div>`:'';
  const relatedHtml=related.length?`<div class="m-related"><div class="m-related-title">🔗 相关推荐</div><div class="m-related-grid">${related.map(r=>`<div class="m-related-item" data-rid="${r.id}"><h5>${r.t}</h5><div class="mri-a">${r.a}</div><div class="mri-e">${r.e} · ${r.g}</div></div>`).join('')}</div></div>`:'';

  document.getElementById('modalBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="width:4px;height:32px;background:${color};border-radius:2px"></div>
      <div><h2>${w.t}</h2><div class="m-author">${w.a} · ${fmtYear(w.y)}</div></div>
    </div>
    <div class="m-desc">${w.d}</div>
    <div class="m-tags"><span>${w.e}</span><span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span></div>
    <div class="m-actions">
      <button class="${isBM?'primary':''}" id="modalBM" data-mid="${w.id}">${isBM?'⭐ 已收藏':'☆ 收藏'}</button>
      <button class="${isRead?'primary':''}" id="modalRead" data-mid="${w.id}">${isRead?'✓ 已读':'📖 标记已读'}</button>
    </div>
    ${introHtml}${thoughtHtml}${excerptHtml}${relatedHtml}
  `;
  document.getElementById('modalOverlay').classList.add('show');

  // Bind modal bookmark
  document.getElementById('modalBM').addEventListener('click',function(){
    toggleBookmark(+this.dataset.mid);
    showModal(+this.dataset.mid); // re-render
  });
  document.getElementById('modalRead').addEventListener('click',function(){
    toggleRead(+this.dataset.mid);
    showModal(+this.dataset.mid); // re-render
  });
  // Related item click
  document.querySelectorAll('.m-related-item').forEach(el=>{
    el.addEventListener('click',()=>showModal(+el.dataset.rid));
  });
}

// ===== Bookmark & Read =====
function toggleBookmark(id){
  const i=bookmarks.indexOf(id);
  if(i>=0){bookmarks.splice(i,1);toast('已取消收藏')}
  else{bookmarks.push(id);toast('⭐ 已收藏')}
  localStorage.setItem('cl_bm',JSON.stringify(bookmarks));
  updateBookmarkBar();
  renderView();
}
function toggleRead(id){
  const i=readList.indexOf(id);
  if(i>=0){readList.splice(i,1);toast('已标记为未读')}
  else{readList.push(id);toast('📖 已标记已读')}
  localStorage.setItem('cl_read',JSON.stringify(readList));
  renderView();
}
function updateBookmarkBar(){
  const bar=document.getElementById('bookmarkBar');
  document.getElementById('bmCount').textContent=bookmarks.length;
  bar.classList.toggle('show',bookmarks.length>0);
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

// ===== Events =====
function bindEvents(){
  // Discover tabs
  document.querySelector('.discover-tabs').addEventListener('click',e=>{
    const btn=e.target.closest('.dtab');if(!btn)return;
    document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderDiscover(btn.dataset.dtab);
  });
  // Discover card click
  document.getElementById('discoverCards').addEventListener('click',e=>{
    const card=e.target.closest('.dcard');if(card) showModal(+card.dataset.id);
  });
  // Era nav
  document.getElementById('eraBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.era-btn');if(!btn)return;
    curEra=btn.dataset.era;
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // Genre
  document.getElementById('genreBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.genre-btn');if(!btn)return;
    curGenre=btn.dataset.genre;
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // View toggle
  document.querySelectorAll('.view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      curView=btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    });
  });
  // Search
  document.getElementById('searchInput').addEventListener('input',e=>{
    searchQ=e.target.value;renderView();
  });
  // Tag cloud
  document.getElementById('tagCloud').addEventListener('click',e=>{
    const chip=e.target.closest('.tag-chip');if(!chip)return;
    tagFilter=tagFilter===chip.dataset.tag?'':chip.dataset.tag;
    document.querySelectorAll('.tag-chip').forEach(c=>c.classList.toggle('active',c.dataset.tag===tagFilter));
    renderView();
  });
  // Grid card click & bookmark
  document.getElementById('gridView').addEventListener('click',e=>{
    const bm=e.target.closest('.card-bookmark');
    if(bm){e.stopPropagation();toggleBookmark(+bm.dataset.bid);return}
    const card=e.target.closest('.card');if(card) showModal(+card.dataset.id);
  });
  // Timeline click
  document.getElementById('timelineView').addEventListener('click',e=>{
    const item=e.target.closest('.tl-item');if(item) showModal(+item.dataset.id);
  });
  // Modal close
  document.getElementById('modalClose').addEventListener('click',()=>{
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalOverlay').addEventListener('click',e=>{
    if(e.target===e.currentTarget) e.currentTarget.classList.remove('show');
  });
  // Shuffle & Reset
  document.getElementById('btnShuffle').addEventListener('click',()=>{
    shuffleMode=!shuffleMode;renderView();
    toast(shuffleMode?'🔀 随机排序':'📊 时间排序');
  });
  document.getElementById('btnReset').addEventListener('click',()=>{
    curEra='全部';curGenre='全部';searchQ='';tagFilter='';shuffleMode=false;
    document.getElementById('searchInput').value='';
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.toggle('active',b.dataset.era==='全部'));
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.toggle('active',b.dataset.genre==='全部'));
    document.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('active'));
    renderView();toast('↺ 已重置筛选');
  });
  // Bookmark clear filter
  document.getElementById('bmClear').addEventListener('click',()=>{
    // Switch discover tab to bookmarks
    document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('active',b.dataset.dtab==='bookmarks'));
    renderDiscover('bookmarks');
    window.scrollTo({top:0,behavior:'smooth'});
  });
  // Scroll top
  const st=document.getElementById('scrollTop');
  window.addEventListener('scroll',()=>{
    st.classList.toggle('show',window.scrollY>400);
    document.getElementById('eraNav').classList.toggle('scrolled',window.scrollY>100);
  });
  st.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('show');
    if(e.key==='/'&&!e.ctrlKey){e.preventDefault();document.getElementById('searchInput').focus();}
  });
  // Init bookmark bar
  updateBookmarkBar();
}
</script>
</body>
