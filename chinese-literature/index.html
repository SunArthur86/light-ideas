<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中文文学库 · 两千年文脉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--text2:#666;--accent:#c0392b;--accent2:#e74c3c;--border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:12px;--gold:#f39c12}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ===== Hero ===== */
.hero{position:relative;min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 20px 36px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:300;letter-spacing:.1em;margin-bottom:10px}
.hero h1 span{font-weight:700;background:linear-gradient(90deg,#e74c3c,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .subtitle{font-size:clamp(.85rem,2vw,1.1rem);opacity:.7;margin-bottom:24px;font-weight:300}
.stats-row{display:flex;gap:36px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:var(--gold)}
.stat .label{font-size:.75rem;opacity:.6;margin-top:2px}
.brush-line{width:120px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:18px auto;border-radius:2px}

/* ===== Discover Section ===== */
.discover{max-width:1200px;margin:-40px auto 0;padding:0 20px;position:relative;z-index:10}
.discover-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dtab{padding:6px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:.85rem;cursor:pointer;transition:all .25s;color:var(--text2);box-shadow:var(--shadow)}
.dtab:hover{border-color:var(--accent);color:var(--accent)}
.dtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.discover-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dcard{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start}
.dcard:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.1);border-color:var(--accent)}
.dcard-color{width:4px;min-height:48px;border-radius:2px;flex-shrink:0}
.dcard-body{flex:1;min-width:0}
.dcard h4{font-size:.95rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .dca{font-size:.8rem;color:var(--accent);margin-bottom:4px}
.dcard .dcd{font-size:.78rem;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .dcbadge{position:absolute;top:8px;right:8px;font-size:.65rem;padding:2px 8px;border-radius:10px;color:#fff}

/* ===== Era Nav ===== */
.era-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;transition:box-shadow .3s}
.era-nav.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.08)}
.era-nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.era-nav-inner::-webkit-scrollbar{display:none}
.era-btn{flex-shrink:0;padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text2);font-size:.82rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.era-btn:hover{border-color:var(--accent);color:var(--accent)}
.era-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.era-btn .count{display:inline-block;background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;font-size:.7rem;margin-left:4px}
.era-btn.active .count{background:rgba(255,255,255,.25)}

/* ===== Filter bar ===== */
.filter-bar{max-width:1200px;margin:20px auto 0;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius);font-size:.92rem;background:var(--card);outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.85rem}
.genre-filters{display:flex;gap:6px;flex-wrap:wrap}
.genre-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--card);font-size:.78rem;cursor:pointer;transition:all .2s;color:var(--text2)}
.genre-btn:hover{border-color:var(--accent);color:var(--accent)}
.genre-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-btn{padding:8px 14px;background:var(--card);border:none;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.view-btn.active{background:var(--text);color:#fff}
.view-btn:not(:last-child){border-right:1px solid var(--border)}

/* ===== Tag cloud ===== */
.tag-cloud{max-width:1200px;margin:12px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap}
.tag-chip{padding:3px 10px;border-radius:12px;font-size:.72rem;background:#f0f0f0;color:var(--text2);cursor:pointer;transition:all .2s}
.tag-chip:hover{background:var(--accent);color:#fff}
.tag-chip.active{background:var(--accent);color:#fff}

/* ===== Bookmark bar ===== */
.bookmark-bar{max-width:1200px;margin:10px auto 0;padding:0 20px;display:none;align-items:center;gap:8px}
.bookmark-bar.show{display:flex}
.bookmark-bar .blabel{font-size:.82rem;color:var(--accent);font-weight:600}
.bookmark-bar .bcount{font-size:.75rem;color:var(--text2);background:#f5f5f5;padding:2px 8px;border-radius:10px}
.bookmark-bar .bclear{font-size:.75rem;color:var(--text2);cursor:pointer;text-decoration:underline;margin-left:auto}

/* ===== Main content ===== */
.main{max-width:1200px;margin:20px auto 60px;padding:0 20px}
.result-info{color:var(--text2);font-size:.82rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.result-actions{display:flex;gap:8px}
.result-actions button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:.75rem;cursor:pointer;color:var(--text2);transition:all .2s}
.result-actions button:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Grid view ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .era-tag{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:.68rem;padding:3px 10px;border-radius:0 0 0 var(--radius)}
.card .card-bookmark{position:absolute;top:8px;right:8px;font-size:1.1rem;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .card-bookmark{opacity:1}
.card .card-bookmark.bookmarked{opacity:1;color:var(--gold)}
.card h3{font-size:1.02rem;font-weight:600;margin-bottom:3px;padding-right:60px}
.card .author{color:var(--accent);font-size:.82rem;margin-bottom:6px}
.card .desc{color:var(--text2);font-size:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .meta span{font-size:.68rem;padding:2px 7px;border-radius:10px;background:#f5f5f5;color:var(--text2)}
.card-excerpt{font-size:.75rem;color:#8e44ad;font-style:italic;margin:6px 0;padding:6px 10px;background:linear-gradient(135deg,#f5eef8,#ede7f6);border-radius:6px;border-left:3px solid #8e44ad;line-height:1.5}
/* Reading status */
.card .read-badge{position:absolute;top:0;left:0;background:#27ae60;color:#fff;font-size:.65rem;padding:2px 8px;border-radius:0 0 var(--radius) 0}

/* ===== Timeline view ===== */
.timeline{position:relative;padding-left:40px}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),#f39c12,var(--accent))}
.tl-item{position:relative;margin-bottom:18px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .3s}
.tl-item:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.tl-item::before{content:'';position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tl-item .year{font-size:.72rem;color:var(--accent);font-weight:600;margin-bottom:3px}
.tl-item h3{font-size:.92rem;font-weight:600;margin-bottom:2px}
.tl-item .author{font-size:.78rem;color:var(--text2)}
.tl-item .desc{font-size:.78rem;color:var(--text2);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Chart view ===== */
.chart-section{display:none}
.chart-section.show{display:block}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:14px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.chart-card h3{font-size:.92rem;font-weight:600;margin-bottom:14px;color:var(--text)}
canvas.chart{width:100%!important;height:260px!important}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 32px;position:relative;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:10px;right:14px;font-size:1.5rem;cursor:pointer;color:var(--text2);border:none;background:none;line-height:1}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:1.3rem;font-weight:700;margin-bottom:3px;padding-right:60px}
.modal .m-author{color:var(--accent);font-size:.95rem;margin-bottom:14px}
.modal .m-desc{line-height:1.8;color:var(--text);margin-bottom:14px}
.modal .m-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal .m-tags span{padding:3px 10px;border-radius:14px;font-size:.75rem;background:#f5f5f5;color:var(--text2)}
.modal .m-tags span:first-child{background:var(--accent);color:#fff}
.modal .m-actions{display:flex;gap:8px;margin-top:14px}
.modal .m-actions button{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:.82rem;cursor:pointer;transition:all .2s}
.modal .m-actions button:hover{border-color:var(--accent);color:var(--accent)}
.modal .m-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.m-section{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f8f9fa}
.m-section-title{font-size:.78rem;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:1px}
.m-intro{font-size:.85rem;line-height:1.8;color:#333;text-indent:2em}
.m-thought{font-size:.85rem;line-height:1.8;color:#2c3e50;padding-left:12px;border-left:3px solid #e67e22}
.m-excerpt{font-size:.85rem;line-height:2;color:#6c3483;font-style:italic;padding:8px 12px;background:linear-gradient(135deg,#fdf2f8,#f5eef8);border-radius:8px}
/* Related recommendations in modal */
.m-related{margin-top:16px;padding:14px;background:#f8f9fa;border-radius:10px}
.m-related-title{font-size:.78rem;font-weight:700;color:#555;margin-bottom:10px;letter-spacing:1px}
.m-related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.m-related-item{padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.m-related-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.m-related-item h5{font-size:.82rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-related-item .mri-a{font-size:.72rem;color:var(--accent)}
.m-related-item .mri-e{font-size:.68rem;color:var(--text2)}

/* ===== Scroll top ===== */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(192,57,43,.3);transition:all .3s;z-index:50}
.scroll-top:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(192,57,43,.4)}
.scroll-top.show{display:flex}

/* ===== Toast ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:8px;font-size:.85rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ===== Responsive ===== */
@media(max-width:768px){
.hero{min-height:45vh;padding:36px 16px 24px}
.stats-row{gap:20px}
.grid{grid-template-columns:1fr}
.chart-grid{grid-template-columns:1fr}
.filter-bar{flex-direction:column}
.genre-filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
.discover-cards{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
.hero h1{font-size:1.5rem}
.stat .num{font-size:1.3rem}
.era-btn{padding:5px 10px;font-size:.78rem}
.discover-cards{grid-template-columns:1fr}
}
@media(max-width:640px){
.card-excerpt{font-size:.7rem;padding:4px 8px}
.m-section{padding:10px 12px}
.m-intro,.m-thought,.m-excerpt{font-size:.8rem;line-height:1.7}
}
</style>
</head>
<body>
<!-- Hero -->
<div class="hero">
<h1>中文文学库 · <span>两千年文脉</span></h1>
<p class="subtitle">从诗经到长安的荔枝，200部作品纵览中华文明</p>
<div class="brush-line"></div>
<div class="stats-row" id="statsRow"></div>
</div>

<!-- Discover / Recommendations -->
<div class="discover" id="discoverSection">
<div class="discover-tabs">
<button class="dtab active" data-dtab="picks">🎯 每日精选</button>
<button class="dtab" data-dtab="random">🎲 随机发现</button>
<button class="dtab" data-dtab="bookmarks">⭐ 我的收藏</button>
<button class="dtab" data-dtab="unread">📖 未读清单</button>
</div>
<div class="discover-cards" id="discoverCards"></div>
</div>

<!-- Era Nav -->
<div class="era-nav" id="eraNav">
<div class="era-nav-inner" id="eraBtns"></div>
</div>

<!-- Filter -->
<div class="filter-bar">
<div class="search-box"><input id="searchInput" placeholder="搜索作品名、作者、关键词… （按 / 快捷搜索）"></div>
<div class="genre-filters" id="genreBtns"></div>
<div class="view-toggle">
<button class="view-btn active" data-view="grid">⊞</button>
<button class="view-btn" data-view="timeline">◷</button>
<button class="view-btn" data-view="chart">▧</button>
</div>
</div>

<!-- Tag Cloud -->
<div class="tag-cloud" id="tagCloud"></div>

<!-- Bookmark bar -->
<div class="bookmark-bar" id="bookmarkBar">
<span class="blabel">⭐ 已收藏</span>
<span class="bcount" id="bmCount">0</span>
<button class="bclear" id="bmClear">清除筛选</button>
</div>

<!-- Main -->
<div class="main">
<div class="result-info">
<span id="resultInfo"></span>
<div class="result-actions">
<button id="btnShuffle" title="随机排序">🔀 随机</button>
<button id="btnReset" title="重置筛选">↺ 重置</button>
</div>
</div>
<div id="gridView" class="grid"></div>
<div id="timelineView" class="timeline" style="display:none"></div>
<div id="chartView" class="chart-section"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modal">
<button class="modal-close" id="modalClose">×</button>
<div id="modalBody"></div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<button class="scroll-top" id="scrollTop">↑</button>

{id:85,t:"杨万里诗集",a:"杨万里",y:1180,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋四大家之一，'诚斋体'自然活泼，'小荷才露尖尖角'家喻户晓。",p:"江西"},
{id:86,t:"朱熹文集",a:"朱熹",y:1180,e:"宋代",g:"哲学",ty:"理学",d:"理学集大成者，四书集注为科举标准教材，影响中国思想史七百年。",p:"福建/江西"},
{id:87,t:"东京梦华录",a:"孟元老",y:1147,e:"宋代",g:"笔记",ty:"笔记",d:"追忆北宋汴京繁华盛景，城市生活的百科全书，珍贵的社会史料。",p:"河南"},
{id:88,t:"梦溪笔谈",a:"沈括",y:1088,e:"宋代",g:"科学",ty:"笔记",d:"北宋科学百科全书，涵盖天文数学物理化学等领域，被李约瑟称为'中国科学史里程碑'。",p:"浙江"},
{id:89,t:"文天祥诗集",a:"文天祥",y:1280,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋民族英雄，正气歌过零丁洋等慷慨悲壮，'人生自古谁无死'浩然正气。",p:"江西"},
{id:90,t:"岳飞诗词",a:"岳飞",y:1140,e:"宋代",g:"词",ty:"词集",d:"南宋名将词作，满江红'怒发冲冠'壮怀激烈，千古传诵。",p:"河南"},
{id:91,t:"元好问集",a:"元好问",y:1230,e:"辽金元",g:"诗歌",ty:"诗集",d:"金代文学代表，'问世间情是何物直教生死相许'千古名句。",p:"山西"},
{id:92,t:"关汉卿杂剧",a:"关汉卿",y:1290,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之首，窦娥冤为中国古典悲剧巅峰之作，千古奇冤感天动地。",p:"北京"},
{id:93,t:"西厢记",a:"王实甫",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧巅峰之作，张生与崔莺莺的爱情故事，'愿天下有情人终成眷属'。",p:"北京"},
{id:94,t:"窦娥冤",a:"关汉卿",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧悲剧代表，窦娥含冤而死六月飞雪，揭露社会黑暗伸张正义。",p:"北京"},
{id:95,t:"马致远杂剧",a:"马致远",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，汉宫秋等历史剧悲壮苍凉，天净沙·秋思被誉为'秋思之祖'。",p:"北京"},
{id:96,t:"赵氏孤儿",a:"纪君祥",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧名作，程婴救孤故事，忠义精神感人，最早被译介到欧洲的中国戏剧。",p:"北京"},
{id:97,t:"白朴杂剧",a:"白朴",y:1280,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，墙头马上梧桐雨等作品，文采斐然情感真挚。",p:"北京"},
{id:98,t:"张养浩散曲",a:"张养浩",y:1320,e:"辽金元",g:"散曲",ty:"散曲集",d:"元代散曲大家，山坡羊·潼关怀古'兴百姓苦亡百姓苦'千古名句。",p:"山东"},
{id:99,t:"崔颢黄鹤楼",a:"崔颢",y:740,e:"隋唐",g:"诗歌",ty:"七言诗",d:"黄鹤楼一诗传诵千古，据传李白见之亦搁笔叹'眼前有景道不得'。",p:"河南"},
{id:100,t:"李之仪词",a:"李之仪",y:1090,e:"宋代",g:"词",ty:"词集",d:"北宋词人，'我住长江头君住长江尾'朴素深情广为传唱。",p:"河北"},
{id:101,t:"西厢记诸宫调",a:"董解元",y:1200,e:"辽金元",g:"说唱",ty:"诸宫调",d:"金代说唱文学代表作，为王实甫西厢记的蓝本，保存了珍贵的音乐文学形式。",p:"北京"},
{id:102,t:"三国演义",a:"罗贯中",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部长篇历史演义小说，描写东汉末年至西晋近百年的历史风云，桃园三结义等故事家喻户晓。",p:"浙江"},
{id:103,t:"水浒传",a:"施耐庵",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部歌颂农民起义的长篇小说，一百零八位好汉替天行道的故事流传千古。",p:"江苏"},
{id:104,t:"西游记",a:"吴承恩",y:1592,e:"明代",g:"小说",ty:"长篇小说",d:"中国古典神魔小说巅峰，唐僧师徒四人西天取经的奇幻旅程，想象力惊天动地。",p:"江苏"},
{id:105,t:"金瓶梅",a:"兰陵笑笑生",y:1610,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部由文人独立创作的长篇世情小说，深刻揭示明代社会百态，文学价值极高。",p:"山东"},
{id:106,t:"牡丹亭",a:"汤显祖",y:1598,e:"明代",g:"戏剧",ty:"传奇",d:"明代戏剧巅峰，杜丽娘因梦而死又因情复生，'情不知所起一往而深'传诵千古。",p:"江西"},
{id:107,t:"封神演义",a:"许仲琳",y:1620,e:"明代",g:"小说",ty:"神魔小说",d:"以武王伐纣为背景的神魔小说，哪吒杨戬姜子牙等形象深入人心。",p:"江苏"},
{id:108,t:"徐霞客游记",a:"徐霞客",y:1640,e:"明代",g:"地理",ty:"游记",d:"明代地理名著，三十余年实地考察记录，对喀斯特地貌的研究早于西方两百年。",p:"江苏"},
{id:109,t:"三言",a:"冯梦龙",y:1620,e:"明代",g:"小说",ty:"话本集",d:"喻世明言警世通言醒世恒言三部白话短篇小说集，反映明代市井生活百态。",p:"江苏"},
{id:110,t:"二拍",a:"凌濛初",y:1630,e:"明代",g:"小说",ty:"话本集",d:"初刻拍案惊奇二刻拍案惊奇，与三言合称'三言二拍'，白话小说经典。",p:"浙江"},
{id:111,t:"临川四梦",a:"汤显祖",y:1600,e:"明代",g:"戏剧",ty:"传奇",d:"汤显祖四部传奇剧：牡丹亭紫钗记邯郸记南柯记，以梦为线索探讨人生。",p:"江西"},
{id:112,t:"归有光文集",a:"归有光",y:1560,e:"明代",g:"散文",ty:"文集",d:"明代散文家，项脊轩志为名篇，以家常琐事抒发深情淡而有味。",p:"江苏"},
{id:113,t:"张岱文集",a:"张岱",y:1650,e:"明代",g:"散文",ty:"小品文",d:"晚明小品文大家，陶庵梦忆西湖梦寻追忆往昔繁华，文字清隽风雅。",p:"浙江"},
{id:114,t:"袁宏道文集",a:"袁宏道",y:1600,e:"明代",g:"散文",ty:"小品文",d:"公安派代表，提倡'独抒性灵不拘格套'，反对复古拟古之风。",p:"湖北"},
{id:115,t:"天工开物",a:"宋应星",y:1637,e:"明代",g:"科技",ty:"科技著作",d:"中国古代科技百科全书，系统记载农业手工业技术，被誉为'中国17世纪的工艺百科全书'。",p:"江西"},
{id:116,t:"红楼梦",a:"曹雪芹",y:1791,e:"清代",g:"小说",ty:"长篇小说",d:"中国古典小说最高成就，以贾府兴衰为线索展现封建社会全貌，被誉为'中国封建社会的百科全书'。",p:"北京"},
{id:117,t:"聊斋志异",a:"蒲松龄",y:1690,e:"清代",g:"小说",ty:"文言小说",d:"中国文言短篇小说巅峰，四百余篇鬼狐故事，借鬼神讽世情想象瑰丽。",p:"山东"},
{id:118,t:"儒林外史",a:"吴敬梓",y:1750,e:"清代",g:"小说",ty:"讽刺小说",d:"中国讽刺小说巅峰之作，描绘科举制度下知识分子的众生相，辛辣幽默。",p:"安徽"},
{id:119,t:"桃花扇",a:"孔尚任",y:1699,e:"清代",g:"戏剧",ty:"传奇",d:"清代传奇剧代表，以秦淮名妓李香君与侯方域的爱情反映南明兴亡。",p:"山东"},
{id:120,t:"长生殿",a:"洪昇",y:1688,e:"清代",g:"戏剧",ty:"传奇",d:"清代传奇剧代表，写唐玄宗与杨贵妃爱情故事，与桃花扇并称'南洪北孔'。",p:"浙江"},
{id:121,t:"纳兰性德词集",a:"纳兰性德",y:1680,e:"清代",g:"词",ty:"词集",d:"清代第一词人，'人生若只如初见何事秋风悲画扇'凄美动人。",p:"北京"},
{id:122,t:"阅微草堂笔记",a:"纪昀",y:1790,e:"清代",g:"小说",ty:"笔记小说",d:"纪晓岚所著志怪小说集，与聊斋并称清代笔记小说双璧。",p:"北京"},
{id:123,t:"镜花缘",a:"李汝珍",y:1820,e:"清代",g:"小说",ty:"长篇小说",d:"奇幻冒险小说，描绘海外奇国异俗，寓讽刺于幻想之中。",p:"江苏"},
{id:124,t:"老残游记",a:"刘鹗",y:1903,e:"清代",g:"小说",ty:"长篇小说",d:"晚清四大谴责小说之一，通过江湖医生老残的游历揭露晚清社会黑暗。",p:"江苏"},
{id:125,t:"官场现形记",a:"李伯元",y:1903,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，全面揭露晚清官场腐败丑态，笔锋犀利。",p:"江苏"},
{id:126,t:"二十年目睹之怪现状",a:"吴趼人",y:1905,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，以见闻录形式记录晚清社会的种种怪现状。",p:"广东"},
{id:127,t:"孽海花",a:"曾朴",y:1905,e:"清代",g:"小说",ty:"谴责小说",d:"晚清四大谴责小说之一，以赛金花故事为线索反映晚清外交与社会。",p:"江苏"},
{id:128,t:"浮生六记",a:"沈复",y:1808,e:"清代",g:"散文",ty:"自传",d:"清代自传体散文，记录与妻子芸娘的平凡生活，真挚感人林语堂誉为中国文学最美之作。",p:"江苏"},
{id:129,t:"龚自珍集",a:"龚自珍",y:1830,e:"清代",g:"诗文",ty:"文集",d:"晚清思想先驱，'我劝天公重抖擞不拘一格降人才'开启近代思想启蒙。",p:"浙江"},
{id:130,t:"郑板桥集",a:"郑燮",y:1750,e:"清代",g:"诗文",ty:"文集",d:"扬州八怪之一，诗书画三绝，'难得糊涂'四字流传天下。",p:"江苏"},
{id:131,t:"袁枚集",a:"袁枚",y:1770,e:"清代",g:"诗文",ty:"文集",d:"清代才子，随园诗话倡导性灵说，小仓山房诗文集文采斐然。",p:"浙江"},
{id:132,t:"曾国藩家书",a:"曾国藩",y:1860,e:"清代",g:"散文",ty:"书信",d:"晚清名臣曾国藩的家书集，修身齐家治国的智慧结晶，影响至今。",p:"湖南"},
{id:133,t:"说岳全传",a:"钱彩",y:1750,e:"清代",g:"小说",ty:"历史小说",d:"讲述岳飞精忠报国的故事，民间影响深远，岳飞形象的文学定型之作。",p:"浙江"},
{id:134,t:"隋唐演义",a:"褚人获",y:1700,e:"清代",g:"小说",ty:"历史小说",d:"隋唐历史演义，从隋文帝到唐明皇的历史故事，英雄美人传奇荟萃。",p:"江苏"},
{id:135,t:"东周列国志",a:"冯梦龙",y:1650,e:"清代",g:"小说",ty:"历史小说",d:"系统讲述春秋战国历史的长篇小说，各诸侯国兴亡故事精彩纷呈。",p:"江苏"},
{id:136,t:"鲁迅全集",a:"鲁迅",y:1923,e:"民国",g:"小说/杂文",ty:"全集",d:"中国现代文学奠基人，狂人日记为中国第一篇白话小说，阿Q正传深刻揭示国民性。",p:"浙江/北京"},
{id:137,t:"骆驼祥子",a:"老舍",y:1937,e:"民国",g:"小说",ty:"长篇小说",d:"老舍代表作，描写北平人力车夫祥子的悲惨命运，京味文学的经典。",p:"北京"},
{id:138,t:"家",a:"巴金",y:1933,e:"民国",g:"小说",ty:"长篇小说",d:"巴金激流三部曲之一，描写封建家庭的崩溃，青年一代的觉醒与反抗。",p:"四川"},
{id:139,t:"子夜",a:"茅盾",y:1933,e:"民国",g:"小说",ty:"长篇小说",d:"茅盾代表作，描绘20世纪30年代上海的社会全景，中国现代长篇小说里程碑。",p:"浙江"},
{id:140,t:"边城",a:"沈从文",y:1934,e:"民国",g:"小说",ty:"中篇小说",d:"沈从文代表作，描绘湘西边城茶峒的纯美爱情，田园牧歌式的文学净土。",p:"湖南"},
{id:141,t:"雷雨",a:"曹禺",y:1934,e:"民国",g:"戏剧",ty:"话剧",d:"中国现代话剧奠基之作，两个家庭三十年的恩怨纠葛，戏剧冲突激烈震撼。",p:"天津"},
{id:142,t:"围城",a:"钱钟书",y:1947,e:"民国",g:"小说",ty:"长篇小说",d:"钱钟书唯一长篇，以幽默讽刺笔法描绘知识分子群像，'围在城里的人想逃出来'。",p:"江苏"},
{id:143,t:"张爱玲全集",a:"张爱玲",y:1944,e:"民国",g:"小说",ty:"作品集",d:"民国才女作家，倾城之恋金锁记等小说以冷艳笔触描绘都市男女，风格独特。",p:"上海"},
{id:144,t:"呼兰河传",a:"萧红",y:1940,e:"民国",g:"小说",ty:"长篇小说",d:"萧红代表作，描绘东北呼兰河小城的风土人情，笔调苍凉寂寞而深情。",p:"黑龙江"},
{id:145,t:"徐志摩诗集",a:"徐志摩",y:1928,e:"民国",g:"诗歌",ty:"诗集",d:"新月派代表诗人，再别康桥'轻轻的我走了正如我轻轻的来'浪漫唯美。",p:"浙江"},
{id:146,t:"闻一多诗集",a:"闻一多",y:1925,e:"民国",g:"诗歌",ty:"诗集",d:"新月派诗人，死水红烛等诗篇关注现实格律严整，后为民主运动献身。",p:"湖北"},
{id:147,t:"朱自清散文",a:"朱自清",y:1928,e:"民国",g:"散文",ty:"散文集",d:"现代散文大家，背影荷塘月色等名篇情感细腻真挚动人。",p:"江苏"},
{id:148,t:"郁达夫文集",a:"郁达夫",y:1930,e:"民国",g:"小说/散文",ty:"文集",d:"创造社创始人之一，沉沦等作品大胆暴露内心，文风清丽哀婉。",p:"浙江"},
{id:149,t:"冰心散文",a:"冰心",y:1923,e:"民国",g:"散文",ty:"散文集",d:"中国现代儿童文学先驱，繁星春水等作品以母爱童真自然为主题温暖动人。",p:"福建"},
{id:150,t:"林语堂散文",a:"林语堂",y:1937,e:"民国",g:"散文",ty:"散文集",d:"'两脚踏中西文化一心评宇宙文章'，吾国与吾民向世界介绍中国文化。",p:"福建"},
{id:151,t:"彷徨",a:"鲁迅",y:1926,e:"民国",g:"小说",ty:"短篇小说集",d:"鲁迅第二部小说集，祝福伤逝等名篇深刻揭示旧社会的压迫与人性的挣扎。",p:"北京"},
{id:152,t:"茶馆",a:"老舍",y:1957,e:"当代",g:"戏剧",ty:"话剧",d:"老舍戏剧杰作，通过裕泰茶馆五十年的变迁展现中国社会沧桑巨变。",p:"北京"},
{id:153,t:"活着",a:"余华",y:1993,e:"当代",g:"小说",ty:"长篇小说",d:"余华代表作，福贵一生的苦难与坚韧，以平静笔调书写命运无常感动千万读者。",p:"浙江"},
{id:154,t:"平凡的世界",a:"路遥",y:1988,e:"当代",g:"小说",ty:"长篇小说",d:"路遥代表作，描写黄土高原上普通人奋斗的人生故事，激励无数青年。",p:"陕西"},
{id:155,t:"白鹿原",a:"陈忠实",y:1993,e:"当代",g:"小说",ty:"长篇小说",d:"陈忠实代表作，描绘白鹿原上两个家族的恩怨与变迁，渭河平原的史诗。",p:"陕西"},

const EXT={
1:{in:"《诗经》是中国第一部诗歌总集，收录西周初年至春秋中叶约五百年间305篇诗歌。分风雅颂三部分：风为各地民歌，雅为宫廷乐歌，颂为祭祀颂歌。赋比兴的修辞手法影响中国诗歌数千年，是中国现实主义的源头。",th:"现实主义精神，以诗歌反映社会生活真实情感。思无邪的教化功能，诗可以兴观群怨。",ex:"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n昔我往矣，杨柳依依。今我来思，雨雪霏霏。\n蒹葭苍苍，白露为霜。所谓伊人，在水一方。\n知我者谓我心忧，不知我者谓我何求。\n死生契阔，与子成说。执子之手，与子偕老。"},
2:{in:"《楚辞》以屈原作品为核心，收宋玉等人作品。楚辞体打破诗经四言格局，以参差错落句式表达丰富情感想象。香草美人意象体系、瑰丽奇绝的神话世界，开创中国文学浪漫主义传统。",th:"浪漫主义传统，以奇绝想象和浓烈情感对抗现实黑暗。香草美人是忠贞高洁的永恒隐喻。",ex:"路漫漫其修远兮，吾将上下而求索。\n亦余心之所善兮，虽九死其犹未悔。\n悲哉秋之为气也！萧瑟兮草木摇落而变衰。\n风飒飒兮木萧萧，思公子兮徒离忧。"},
3:{in:"《离骚》是屈原被流放后创作的长篇政治抒情诗，373句2400余字。屈原自叙身世，驰骋想象遨游天界，最终不忍离弃故土而决心殉国。以香草美人比喻高洁理想，构建中国文学最宏大的象征体系。",th:"忠贞不渝的人格理想，在浊世中坚持高洁宁死不愿同流合污。个人命运与国家兴亡的深刻关联。",ex:"长太息以掩涕兮，哀民生之多艰。\n路漫漫其修远兮，吾将上下而求索。\n亦余心之所善兮，虽九死其犹未悔。\n朝饮木兰之坠露兮，夕餐秋菊之落英。\n日月忽其不淹兮，春与秋其代序。"},
4:{in:"《道德经》约五千言分上下两篇共81章，以道为核心概念论述宇宙本源、万物规律、治国修身之术。文字简约含义深远，影响遍及哲学宗教政治军事艺术各领域，被译成数百种文字。",th:"道法自然，万物运行的根本规律是道。主张无为而治、柔弱胜刚强、知足知止，物极必反的辩证思维。",ex:"道可道，非常道。名可名，非常名。无名天地之始，有名万物之母。\n上善若水，水善利万物而不争。\n知人者智，自知者明。胜人者有力，自胜者强。\n大器晚成，大音希声，大象无形。\n天地不仁，以万物为刍狗。"},
5:{in:"《论语》由孔子弟子及再传弟子编纂，20篇492章。内容涵盖仁义礼智信等核心概念，涉及教育政治修身处世。语言简练隽永，是中国人精神世界的基础文本，影响东亚文明两千余年。",th:"仁为核心，以仁为人格理想以礼为社会规范。有教无类的教育理念，中庸之道的处世哲学。",ex:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？\n己所不欲，勿施于人。\n三人行，必有我师焉。\n学而不思则罔，思而不学则殆。\n知之为知之，不知为不知，是知也。\n朝闻道，夕死可矣。"},
6:{in:"《庄子》现存33篇，以寓言重言卮言的独特笔法构建自由无待的精神世界。庖丁解牛、庄周梦蝶、鹏程万里等寓言已成为中国文化的基本意象。其文汪洋恣肆，被誉为先秦诸子散文之冠。",th:"逍遥游的精神自由，超越世俗功名利禄追求心灵绝对自由。齐物论打破二元对立主张万物平等。",ex:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。\n天地与我并生，而万物与我为一。\n子非鱼，安知鱼之乐？"},
7:{in:"《孟子》七篇记录孟子言行论辩。继承发展孔子思想，提出性善论主张仁政民贵君轻。以雄辩气势和生动比喻阐述政治理想，大丈夫人格准则影响千古。",th:"性善论与仁政，人性本善人皆可以为尧舜。政治上民贵君轻，养浩然之气的人格修养。",ex:"生于忧患，死于安乐。\n富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。\n老吾老以及人之老，幼吾幼以及人之幼。\n天将降大任于斯人也，必先苦其心志，劳其筋骨。\n民为贵，社稷次之，君为轻。"},
8:{in:"《左传》记载自鲁隐公元年至鲁哀公二十七年共255年历史。叙事生动翔实，尤善描写战争和外交辞令。人物刻画栩栩如生，是先秦叙事散文巅峰之作。",th:"以史为鉴，通过春秋霸业兴衰揭示政治得失与道德教训。礼制秩序与政治智慧并重。",ex:"一鼓作气，再而衰，三而竭。\n居安思危，思则有备，有备无患。\n人谁无过？过而能改，善莫大焉。\n皮之不存，毛将焉附？\n欲加之罪，其无辞乎？"},
9:{in:"《战国策》记述战国纵横家的政治主张和策略，按十二国编排。文章气势奔放辩丽恣肆，苏秦张仪等策士形象跃然纸上，是中国古代散文典范。",th:"纵横捭阖的政治智慧，弱肉强食时代以智谋口才取胜，强调审时度势灵活应变。",ex:"风萧萧兮易水寒，壮士一去兮不复还。\n亡羊而补牢，未为迟也。\n前事不忘，后事之师。\n鹬蚌相争，渔翁得利。\n狡兔三窟，仅得免其死耳。"},
10:{in:"《孙子兵法》十三篇约六千字，系统论述战争的战略战术。从始计到用间涵盖战争全貌，强调知己知彼百战不殆。其思想超越军事领域，广泛应用于商业管理外交等。",th:"全胜战略，最高境界是不战而屈人之兵。兵者诡道、因敌制胜的辩证思维。",ex:"知彼知己，百战不殆。\n不战而屈人之兵，善之善者也。\n出其不意，攻其不备。\n兵者，国之大事，死生之地，存亡之道，不可不察也。\n上兵伐谋，其次伐交，其次伐兵，其下攻城。"},
11:{in:"《山海经》是中国最古老的神话地理文献，18卷记载约100个邦国550座山300条水道及无数神兽异物。夸父逐日、精卫填海、女娲补天等神话出此书，是中国神话体系基石。",th:"远古先民对世界的想象与探索，以神话解释自然现象，体现面对未知世界的勇气和想象力。",ex:"夸父与日逐走，入日。渴欲得饮，饮于河渭，河渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。\n精卫衔微木，将以填沧海。刑天舞干戚，猛志固常在。\n女娲炼五色石以补苍天，断鳌足以立四极。"},
12:{in:"《周易》由易经和易传组成，以六十四卦的符号系统和卦爻辞构建解释宇宙万物变化的理论框架。被称为群经之首大道之源，阴阳对立统一思想渗透中国文化每个层面。",th:"变易、简易、不易——万物永恒变化但变化有规律可循，阴阳对立统一的核心思维。",ex:"天行健，君子以自强不息。地势坤，君子以厚德载物。\n穷则变，变则通，通则久。\n二人同心，其利断金。\n积善之家，必有余庆。"},
13:{in:"《尚书》是中国最古老史书，记载从尧舜到春秋秦穆公时期的重要政治文献。包括训辞诰命誓词等，是研究上古历史和政治思想的核心文献。",th:"以史为鉴的治国理念，强调敬天保民、明德慎罚的政治智慧。",ex:"满招损，谦受益。\n民惟邦本，本固邦宁。\n克明俊德，以亲九族。\n功亏一篑，未成一篑。"},
14:{in:"《荀子》32篇是先秦儒家集大成之作。提出性恶论，强调须以礼义教化。劝学篇论述学习方法，天论篇提出制天命而用之，逻辑严密气势雄辩。",th:"性恶论与礼治，人性本恶需礼义教化。强调后天学习和制度规范，礼法并用。",ex:"青取之于蓝而青于蓝，冰水为之而寒于水。\n锲而不舍，金石可镂。\n不积跬步，无以至千里；不积小流，无以成江海。\n吾尝终日而思矣，不如须臾之所学也。"},
15:{in:"《韩非子》55篇集法家思想之大成，融法术势三派之长。守株待兔、滥竽充数、自相矛盾等成语出此书。以大量寓言说理，论证雄辩。",th:"法术势三位一体，以法治国以术驭臣以势固权。强调严刑峻法和中央集权。",ex:"千里之堤，溃于蚁穴。\n以子之矛陷子之盾，何如？\n守株待兔，虽无翼而飞者，不可复得也。\n滥竽充数，南郭处士请为王吹竽。"},
16:{in:"《墨子》现存53篇，墨子主张兼爱非攻尚贤节用。其逻辑学墨辩和科学思想在先秦独树一帜，在光学力学几何学等领域有超前发现。",th:"兼爱非攻，无差别爱一切人反对不义战争。尚贤使能节用节葬的务实主张。",ex:"天下之人皆相爱，强不执弱，众不劫寡，富不侮贫，贵不敖贱，诈不欺愚。\n兼相爱，交相利。\n俭节则昌，淫佚则亡。"},
17:{in:"《列子》8篇以寓言故事阐发道家思想。愚公移山、杞人忧天等脍炙人口的寓言出此书。文体近似庄子而更朴素，想象力丰富哲理深刻。",th:"万物齐一，超越生死有无大小的二元对立，以达观态度面对人生。",ex:"太行王屋二山，方七百里，高万仞。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也。\n杞国有人忧天地崩坠，废寝食者。"},
18:{in:"《晏子春秋》记载齐国名相晏婴言行事迹，8篇215章。通过大量生动故事展现晏婴智慧节俭和敢于直谏的政治品格。",th:"以智谏君，强调节俭爱民礼贤下士，以幽默智慧劝谏君王修正过失。",ex:"橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。\n为者常成，行者常至。\n圣人千虑，必有一失；愚人千虑，必有一得。"},
19:{in:"《九歌》是屈原在楚地民间祭歌基础上加工创作的祭祀诗歌，11篇。描写东皇太一云中君湘君湘夫人等神灵形象，融宗教神话爱情于一体，意境瑰丽。",th:"人神交融的浪漫想象，通过祭祀仪式沟通人神，表达对美好事物的渴望。",ex:"悲莫悲兮生别离，乐莫乐兮新相知。\n身既死兮神以灵，魂魄毅兮为鬼雄。\n青云衣兮白霓裳，举长矢兮射天狼。"},
20:{in:"《天问》全诗通篇设问，从天地开辟问到人类历史共170余个问题。涉及天文地理历史神话等各领域，体现先民对宇宙万物的强烈好奇和理性探索精神。",th:"求索精神，以根本性问题质疑传统认知，体现理性思辨和对真理的不懈追求。",ex:"遂古之初，谁传道之？上下未形，何由考之？\n明明暗暗，惟时何为？阴阳三合，何本何化？\n圜则九重，孰营度之？"},
21:{in:"《吕氏春秋》26卷160篇，战国末年吕不韦集合门客编撰的百科全书式著作。兼收儒道法墨兵农各家学说，以道家思想为主干构建宏大理论体系。一字千金出此。",th:"杂家融合，兼收并蓄各家之长以道统摄百家。强调顺应自然注重实效的治国理念。",ex:"流水不腐，户枢不蠹。\n竭泽而渔，岂不获得？而明年无鱼。\n一字之师，价重千金。"},
22:{in:"《史记》是中国第一部纪传体通史，记载上起黄帝下至汉武帝三千年历史。130篇52万余字，分本纪世家列传书表五种体例。首创以人物为中心的史学方法，叙事生动人物鲜明，被鲁迅誉为史家之绝唱无韵之离骚。",th:"究天人之际，通古今之变，成一家之言。以纪传体开创史学新范式，人物描写寄寓褒贬，史识史才史德兼具。",ex:"人固有一死，或重于泰山，或轻于鸿毛。\n桃李不言，下自成蹊。\n飞鸟尽，良弓藏；狡兔死，走狗烹。\n王侯将相宁有种乎？\n项庄舞剑，意在沛公。"},
23:{in:"《汉书》是中国第一部纪传体断代史，100卷记载西汉230年历史。文笔洗练条理清晰，创立了断代为史的编纂方法，后世正史多沿其体例。",th:"断代为史的开创性贡献，以严谨笔法记录一朝兴衰。强调正统观念和历史鉴戒功能。",ex:"水至清则无鱼，人至察则无徒。\n绳锯木断，水滴石穿。\n临渊羡鱼，不如退而结网。"},
24:{in:"《古诗十九首》是汉代无名氏所作的五言诗，标志着五言诗的成熟。内容多写离愁别恨、人生无常，情感真挚语言朴素，被誉为五言之冠冕。",th:"对生命短暂的深切感悟，在乱世中追求真情和人生意义。语言质朴而情味深远，开了抒情诗新境界。",ex:"行行重行行，与君生别离。相去万余里，各在天一涯。\n人生天地间，忽如远行客。\n思君令人老，岁月忽已晚。\n人生寄一世，奄忽若飙尘。"},
25:{in:"《论衡》是东汉王充所著的唯物主义哲学巨著，30卷85篇。批判天人感应与谶纬迷信，提倡实知求真，以理性思辨挑战当时的思想主流。",th:"唯物主义批判精神，反对迷信提倡实证。疾虚妄求实真的理性态度，在思想史上独树一帜。",ex:"知实者，必验之以物。\n事莫明于有效，论莫定于有证。\n人死不为鬼，无知，不能害人。"},
26:{in:"《说文解字》是中国第一部系统分析汉字字形的字书，收九千余字。许慎以小篆为正字，按偏旁部首排列，首创540部首的分类法，为文字学奠基之作。",th:"以字形分析探求文字本义，建立部首分类体系。奠定了中国文字学的基础框架，影响至今。",ex:"盖文字者，经艺之本，王政之始也。前人所以垂后，后人所以识古。\n字者，言孳乳而浸多也。"},
27:{in:"《汉乐府》是汉代官方采集的民歌，反映社会各阶层的生活。感于哀乐缘事而发的现实主义精神，上邪、陌上桑、十五从军征等名篇至今传诵。",th:"缘事而发的现实主义传统，以民歌形式反映社会生活。叙事性与抒情性并重，开创了乐府诗体。",ex:"上邪！我欲与君相知，长命无绝衰。山无陵，江水为竭，冬雷震震，夏雨雪，天地合，乃敢与君绝。\n少壮不努力，老大徒伤悲。"},
28:{in:"《出师表》是诸葛亮北伐前上书后主刘禅的表文。全文以恳切言辞表达忠诚之心，分析天下形势提出治国建议。情理兼备，被誉为千古第一名表。",th:"忠贞报国之心，鞠躬尽瘁死而后已。以恳切言辞表达对国家的忠诚和对后主的期望。",ex:"臣鞠躬尽瘁，死而后已。\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。\n苟全性命于乱世，不求闻达于诸侯。"},
29:{in:"《过秦论》是西汉贾谊的政论名篇，分上中下三篇。通过分析秦朝兴亡的教训，指出仁义不施而攻守之势异也，警醒千古。",th:"以史为鉴的政治思考，总结秦亡教训指出施行仁政的重要性。攻守之势异也的核心论断。",ex:"仁义不施而攻守之势异也。\n斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。\n一夫作难而七庙隳，身死人手，为天下笑者，何也？"},
30:{in:"《盐铁论》记录西汉盐铁会议争论，反映汉朝经济政策辩论。60篇涵盖经济政治军事文化等议题，是中国经济思想史的重要文献。",th:"国家干预与自由放任的经济辩论，反映汉代对经济政策的不同立场。以对话体记录真实历史争论。",ex:"富在术数，不在劳身；利在势居，不在力耕。\n文学曰：古者之赋税，以便民也。"},
31:{in:"《洛神赋》是曹植代表作，描绘洛水女神宓妃之美。全赋以人神之恋为线索，辞采华美想象奇绝。翩若惊鸿婉若游龙等句成为描写女性之美的经典。",th:"以人神之恋寄托理想与现实的矛盾，表现对美好事物的追求和失落的惆怅。辞赋艺术的巅峰。",ex:"翩若惊鸿，婉若游龙。荣曜秋菊，华茂春松。\n凌波微步，罗袜生尘。\n髣髴兮若轻云之蔽月，飘飖兮若流风之回雪。\n远而望之，皎若太阳升朝霞；迫而察之，灼若芙蕖出渌波。"},
32:{in:"《文心雕龙》是中国第一部系统文学理论专著，50篇涵盖创作论批评论。刘勰以骈文写成，体大思精，从文体流变到创作规律均有精辟论述。",th:"系统全面的文学理论，探讨文体源流创作规律和批评标准。以道统文、文以载道的文学观。",ex:"操千曲而后晓声，观千剑而后识器。\n情者文之经，辞者理之纬。\n登山则情满于山，观海则意溢于海。"},
33:{in:"《诗品》是中国第一部诗歌批评专著，品评五言诗人一百二十余人分三品论高下。钟嵘以简洁精当的评语评价诗人风格特色和艺术成就。",th:"以品第方式建立诗歌评价体系，注重诗人个性和风格特色。诗言志的批评传统。",ex:"气之动物，物之感人，故摇荡性情，形诸舞咏。\n指事造形，穷情写物，最为详切。"},
34:{in:"《世说新语》记载魏晋名士言行的笔记小说，按德行言语政事等36门分类。展现魏晋风度与名士精神，谢安、王羲之等人物形象鲜活生动。",th:"魏晋风度的生动写照，展现名士的个性自由和精神追求。以简约笔法刻画人物性格。",ex:"王子猷雪夜访戴，乘兴而行，兴尽而返，何必见戴？\n潘岳妙有姿容，好神情。少时挟弹出洛阳道，妇人遇者莫不连手共萦之。"},
35:{in:"《搜神记》是魏晋志怪小说代表作，记载神仙鬼怪故事。干宝以此书开中国小说志怪传统，很多故事成为后世文学戏剧的素材来源。",th:"以志怪形式反映民间信仰和社会心理。虚构叙事中蕴含对现实的折射和思考。",ex:"东海孝妇周青，为姑所谴，姑自经死。姑女告吏，吏捕青。青不胜痛楚，诬服。郡中枯旱三年。\n干将莫邪为楚王作剑，三年乃成。"},
36:{in:"《陶渊明集》是田园诗派开创者的诗集。陶渊明归隐田园后写下大量描写乡村生活和自然风光的诗文，采菊东篱下悠然见南山成千古名句。桃花源记构建的理想社会影响深远。",th:"田园理想与自然人生，在隐逸生活中追求精神自由。不为五斗米折腰的独立人格。",ex:"采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。\n结庐在人境，而无车马喧。问君何能尔？心远地自偏。\n久在樊笼里，复得返自然。\n此中有真意，欲辨已忘言。"},
37:{in:"《阮籍咏怀诗》82首，是正始文学代表作。阮籍以隐晦曲折的笔法表达对现实的不满与忧虑，诗风深沉含蓄，在司马氏高压下以诗寄愤。",th:"在政治高压下以隐晦笔法表达不满，反映乱世知识分子的苦闷与彷徨。",ex:"夜中不能寐，起坐弹鸣琴。薄帷鉴明月，清风吹我襟。\n孤鸿号外野，翔鸟鸣北林。徘徊将何见？忧思独伤心。\n终身履薄冰，谁知我心焦。"},
38:{in:"《嵇康集》是竹林七贤领袖嵇康的文集。与山巨源绝交书等名篇展现独立人格精神，嵇康以激烈言行反抗虚伪礼教，最终被司马氏杀害。",th:"独立人格与反抗精神，追求真性情反对虚伪礼教。越名教而任自然的哲学立场。",ex:"非汤武而薄周孔，越名教而任自然。\n康善锻，柳善锻，向秀为之佐。相对欣然，旁若无人。"},
39:{in:"《水经注》是综合性地理著作，详细记载河流山川。郦道元以优美文笔描写自然风光，三峡篇尤为著名。既是地理学经典，又是文学佳作。",th:"以实地考察为基础的地理记述，辅以优美的文学描写。科学与文学的完美结合。",ex:"自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日。自非亭午夜分，不见曦月。\n有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。"},
40:{in:"《木兰辞》是北朝乐府民歌，讲述花木兰代父从军的故事。全诗节奏明快语言质朴，塑造了巾帼英雄的经典形象，流传千古。",th:"孝道与爱国精神的结合，打破性别偏见的女性英雄主义。质朴刚健的北方民歌风格。",ex:"唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。\n雄兔脚扑朔，雌兔眼迷离。双兔傍地走，安能辨我是雄雌？"},
41:{in:"《孔雀东南飞》是中国文学史上第一部长篇叙事诗，讲述焦仲卿与刘兰芝的悲剧爱情。全诗350余句，情节曲折人物鲜明，控诉封建礼教对人性的摧残。",th:"对封建礼教的控诉，追求自由爱情的悲剧力量。双飞鸟的意象象征对爱情永恒的向往。",ex:"孔雀东南飞，五里一徘徊。\n君当作磐石，妾当作蒲苇。蒲苇韧如丝，磐石无转移。\n举手长劳劳，二情同依依。"},
42:{in:"《昭明文选》是中国现存最早的诗文总集，选录先秦至梁代七百余篇。萧统以事出于沉思义归乎翰藻为选文标准，是文学选本的典范。",th:"文学自觉时代的选本标准，注重文采与思想并重。确立文学独立于学术的地位。",ex:"事父之节尽矣，事君之节未也。以臣之事君，犹子之事父也。\n文虽新而有质，色虽糅而有本。"},
43:{in:"《陈情表》是李密辞不赴任的表文，以孝道动人。全文情真意切言辞恳切，与出师表并称两大名表。",th:"以孝道为辞的忠孝两全之术，以真情实感动人的文章典范。",ex:"臣无祖母，无以至今日；祖母无臣，无以终余年。母孙二人，更相为命。\n茕茕孑立，形影相吊。\n日薄西山，气息奄奄，人命危浅，朝不虑夕。"},
44:{in:"《归园田居》五首是陶渊明田园诗代表，描绘归隐田园的闲适生活。诗中榆柳荫后檐桃李罗堂前的意象成为中国田园诗的经典画面。",th:"回归自然的生命选择，在田园生活中找到心灵的安宁与自由。",ex:"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n榆柳荫后檐，桃李罗堂前。"},
45:{in:"《饮酒·其五》是陶渊明最著名的诗篇之一。采菊东篱下悠然见南山，意境高远物我两忘，被誉为中国诗歌中最具禅意的名句。",th:"物我两忘的哲学境界，在日常生活中体悟生命真谛。心远地自偏的精神自由。",ex:"结庐在人境，而无车马喧。问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。"},
46:{in:"《滕王阁序》是初唐四杰王勃的名篇，全称秋日登洪府滕王阁饯别序。以骈文写就，辞藻华丽对仗工整。落霞与孤鹜齐飞秋水共长天一色传诵千古。",th:"以华丽的骈文抒发怀才不遇的感慨，在壮美景色中寄寓人生感悟。",ex:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。\n老当益壮，宁移白首之心？穷且益坚，不坠青云之志。\n关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。"},
47:{in:"《春江花月夜》被闻一多赞为诗中的诗顶峰上的顶峰，以月为主线贯穿全诗36句。意境空灵幽美，孤篇盖全唐。",th:"宇宙意识与人生感悟的融合，在春江花月的美景中思考永恒与短暂。",ex:"春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。\n江畔何人初见月？江月何年初照人？人生代代无穷已，江月年年望相似。\n不知乘月几人归，落月摇情满江树。"},
48:{in:"《李白全集》收录诗仙李太白的全部诗作。李白以浪漫主义诗歌的巅峰成就照耀千年，将进酒、蜀道难、静夜思等名篇家喻户晓。诗风豪放飘逸想象奇绝。",th:"浪漫主义精神的极致表达，追求自由蔑视权贵的独立人格。诗与酒的狂欢精神。",ex:"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。\n长风破浪会有时，直挂云帆济沧海。\n举杯邀明月，对影成三人。"},
49:{in:"《杜甫全集》收录诗圣杜子美的全部诗作。杜甫以现实主义诗歌的顶峰成就反映社会现实，三吏三别等深刻揭示民间疾苦。被称为诗史。",th:"忧国忧民的现实主义精神，以诗歌记录时代苦难。沉郁顿挫的风格中蕴含深厚人道关怀。",ex:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。\n安得广厦千万间，大庇天下寒士俱欢颜！呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！\n无边落木萧萧下，不尽长江滚滚来。\n会当凌绝顶，一览众山小。"},
50:{in:"《白居易集》收录新乐府运动倡导者的全部诗文。长恨歌琵琶行是长篇叙事名篇，语言通俗老妪能解。主张文章合为时而著歌诗合为事而作。",th:"文章合为时而著的现实主义文学主张，以平易语言表达深刻社会关怀。",ex:"在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。\n回眸一笑百媚生，六宫粉黛无颜色。\n春风桃李花开日，秋雨梧桐叶落时。"},
51:{in:"《王维集》收录诗佛王摩诘的全部诗作。王维是山水田园诗派代表，诗中有画画中有诗。晚年笃信佛教，诗境空灵禅意深远。",th:"诗画合一的艺术境界，以禅入诗的空灵美学。物我交融的审美追求。",ex:"千呼万唤始出来，犹抱琵琶半遮面。\n大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。\n同是天涯沦落人，相逢何必曾相识。\n别有幽愁暗恨生，此时无声胜有声。"},
52:{in:"《孟浩然集》收录盛唐山水田园诗人孟浩然的诗作。春晓过故人庄等名篇清新自然淡远悠长，与王维并称王孟。",th:"自然淡远的诗歌美学，在田园山水中寻找心灵的宁静。",ex:"空山新雨后，天气晚来秋。明月松间照，清泉石上流。\n行到水穷处，坐看云起时。\n大漠孤烟直，长河落日圆。\n红豆生南国，春来发几枝。愿君多采撷，此物最相思。"},
53:{in:"《李商隐诗集》收录晚唐诗人李商隐的全部诗作。无题诗朦胧凄美意境深幽，春蚕到死丝方尽等句传诵千年。诗风华丽幽微为晚唐一绝。",th:"朦胧美的诗学追求，以隐晦意象表达难以言说的情感。对爱情和命运深沉的思考。",ex:"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。\n绿树村边合，青山郭外斜。\n野旷天低树，江清月近人。"},
54:{in:"《杜牧诗集》收录晚唐杰出诗人杜牧的诗作。咏史怀古诗独步一时，停车坐爱枫林晚家喻户晓。诗风清丽俊逸在晚唐别具一格。",th:"咏史怀古的历史意识，在繁华与衰败的对比中寄寓深沉感慨。",ex:"春蚕到死丝方尽，蜡炬成灰泪始干。\n此情可待成追忆？只是当时已惘然。\n身无彩凤双飞翼，心有灵犀一点通。\n夕阳无限好，只是近黄昏。"},
55:{in:"《长恨歌》是白居易代表作，以叙事诗形式讲述唐玄宗与杨贵妃的爱情悲剧。天长地久有时尽此恨绵绵无绝期成为千古爱情名句。",th:"爱情与政治的双重悲剧，对帝妃之恋的同情与批判并存。以美人的悲剧折射历史的无情。",ex:"清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。\n远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。\n东风不与周郎便，铜雀春深锁二乔。"},
56:{in:"《琵琶行》是白居易贬谪江州时所作。通过听琵琶女弹奏引出身世之感，同是天涯沦落人相逢何必曾相识成为千古名句。",th:"天涯沦落的深切共情，以音乐为媒介表达人生失意的感慨。",ex:"葡萄美酒夜光杯，欲饮琵琶马上催。醉卧沙场君莫笑，古来征战几人回。\n忽如一夜春风来，千树万树梨花开。\n山回路转不见君，雪上空留马行处。"},
57:{in:"《韩愈文集》收录唐宋八大家之首韩愈的散文。古文运动倡导者，师说进学解等名篇气势磅礴。文起八代之衰而道济天下之溺。",th:"古文运动的文学革新，反对骈文恢复散体文。文以载道、不平则鸣的文学主张。",ex:"业精于勤，荒于嬉；行成于思，毁于随。\n世有伯乐，然后有千里马。千里马常有，而伯乐不常有。\n大凡物不得其平则鸣。"},
58:{in:"《柳宗元文集》收录唐宋八大家之一柳宗元的散文。山水游记与寓言散文成就极高，永州八记为其代表作。被贬永州后寄情山水写出传世名篇。",th:"以山水寓言寄寓政治感慨，被贬中的精神坚守。游记散文的文学革新。",ex:"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。\n潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽。"},
59:{in:"《刘禹锡集》收录中唐诗人刘禹锡的诗文。沉舟侧畔千帆过病树前头万木春乐观豁达，被称为诗豪。多次被贬而诗风不改乐观本色。",th:"在逆境中保持乐观的精神力量，以辩证眼光看待人生沉浮。",ex:"自古逢秋悲寂寥，我言秋日胜春朝。晴空一鹤排云上，便引诗情到碧霄。\n旧时王谢堂前燕，飞入寻常百姓家。\n东边日出西边雨，道是无晴却有晴。"},
60:{in:"《寒山诗》收录唐代隐僧寒山的诗作，融合佛道思想，白话诗风独特。在海外尤其是日本和美国影响巨大，成为禅宗文化的代表。",th:"以通俗语言表达禅宗哲理，打破诗律束缚的自由表达。",ex:"杳杳寒山道，落落冷涧滨。啾啾常有鸟，寂寂更无人。\n吾心似秋月，碧潭清皎洁。无物堪比伦，教我如何说。"},
61:{in:"《王昌龄诗集》收录边塞诗派代表王昌龄的诗作。被誉为七绝圣手，秦时明月汉时关气魄雄浑。以精炼的七绝形式书写边塞壮丽与悲凉。",th:"边塞诗的壮美与悲凉，以精炼语言书写战争的残酷和思乡的深情。",ex:"秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。\n黄沙百战穿金甲，不破楼兰终不还。\n洛阳亲友如相问，一片冰心在玉壶。"},
62:{in:"《岑参诗集》收录边塞诗派代表岑参的诗作。忽如一夜春风来千树万树梨花开写雪奇绝。以雄奇瑰丽的笔调描写西北边疆的壮美风光。",th:"以雄奇笔调描绘边塞风光和军旅生活，将艰苦化为壮美。",ex:"忽如一夜春风来，千树万树梨花开。散入珠帘湿罗幕，狐裘不暖锦衾薄。\n山回路转不见君，雪上空留马行处。"},
63:{in:"《高适诗集》收录边塞诗派代表高适的诗作。燕歌行气势豪迈，与岑参并称高岑。以深沉笔调反映边塞军旅生活的艰苦和壮烈。",th:"边塞诗的现实主义精神，既写壮志豪情也反映军旅苦难。",ex:"莫愁前路无知己，天下谁人不识君。\n千里黄云白日曛，北风吹雁雪纷纷。"},
64:{in:"《李贺诗集》收录被称为诗鬼的李贺的诗作。诗风奇诡瑰丽想象惊人，黑云压城城欲摧为其名句。27岁英年早逝，留下诗坛奇才的传说。",th:"以奇诡想象突破传统诗美，营造幽冷瑰丽的独特意境。天才的早夭与诗艺的极致。",ex:"黑云压城城欲摧，甲光向日金鳞开。角声满天秋色里，塞上燕脂凝夜紫。\n天若有情天亦老。\n报君黄金台上意，提携玉龙为君死。"},
65:{in:"《唐传奇》收录唐代文言短篇小说的精华。莺莺传、霍小玉传、南柯记等名篇标志中国小说走向成熟。情节曲折人物鲜明，对后世小说戏剧影响深远。",th:"中国小说的成熟标志，以虚构叙事探讨爱情命运和社会问题。标志着文学从实用走向审美自觉。",ex:"唐传奇始有意为小说，虚实相生，文备众体。\n莺莺传始开才子佳人小说先河。\n赵师雄醉宿梅花下，梦与美人饮。"},
66:{in:"《游子吟》是孟郊所作五言诗，歌颂母爱的千古绝唱。慈母手中线游子身上衣，以朴实无华的语言表达深厚的母子之情，感人至深。",th:"以朴素语言歌颂母爱，从日常细节中提炼人间最真挚的情感。",ex:"慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。"},
67:{in:"《阿房宫赋》是杜牧借秦灭之史讽谏当朝的辞赋。秦人不暇自哀而后人哀之警醒千古，是辞赋与政论完美结合的典范。",th:"以古讽今的政治警示，借秦之亡谏唐朝之弊。骄奢淫逸必亡的历史规律。",ex:"六王毕，四海一。蜀山兀，阿房出。覆压三百余里，隔离天日。\n灭六国者六国也，非秦也。族秦者秦也，非天下也。\n秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"},
68:{in:"《师说》是韩愈名篇，论述从师学习的重要性。师者所以传道受业解惑也成为千古教育名言，是古文运动的标志性作品。",th:"尊师重道的教育理念，反对耻学于师的社会风气。道之所存师之所存也。",ex:"师者，所以传道受业解惑也。人非生而知之者，孰能无惑？\n闻道有先后，术业有专攻。\n是故弟子不必不如师，师不必贤于弟子。"},
69:{in:"《花间集》是中国最早的词总集，收录晚唐五代十八家词五百首。以温庭筠韦庄为代表，多写男女情爱，是婉约词的源头。",th:"婉约词的开创与定型，以精致的意象表达细腻的情感。词为艳科的传统由此确立。",ex:"小山重叠金明灭，鬓云欲度香腮雪。懒起画蛾眉，弄妆梳洗迟。\n温飞卿词，精妙绝伦，词中之祖。"},
70:{in:"《李煜词集》收录南唐后主李煜的词作。亡国后词风沉痛凄美，问君能有几多愁恰似一江春水向东流传诵千古。以血泪写词成为词史上独特现象。",th:"以亡国之痛写出人类共通的情感体验。词从歌舞升平的工具变为抒发人生悲哀的文学形式。",ex:"春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。\n问君能有几多愁？恰似一江春水向东流。\n剪不断，理还乱，是离愁。别是一般滋味在心头。\n流水落花春去也，天上人间。"},
71:{in:"《花蕊夫人宫词》是后蜀花蕊夫人的百首宫词，描绘蜀宫生活细节。既是珍贵的宫廷史料，又具文学价值，笔触细腻纤丽。",th:"以女性视角记录宫廷生活，在华丽描写中隐含对权力与命运的感受。",ex:"三月樱桃乍熟时，内人争插玩芳枝。\n花蕊夫人才思清丽，宫词百首，为唐五代之冠。"},
72:{in:"《苏轼全集》收录北宋文学全才苏东坡的诗文词赋。诗书画三绝，念奴娇赤壁怀古、水调歌头等名篇光照千古。豪放与婉约并兼，开创宋词新境界。",th:"旷达乐观的人生态度，在挫折中保持精神自由。豪放词的开创与诗词文的全面成就。",ex:"大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。\n但愿人长久，千里共婵娟。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n回首向来萧瑟处，归去，也无风雨也无晴。\n十年生死两茫茫，不思量，自难忘。"},
73:{in:"《李清照集》收录婉约词派宗师的全部词作。寻寻觅觅冷冷清清千古第一才女，词作凄美动人在南宋词坛独树一帜。前期明快后期凄婉，以血泪写成。",th:"以女性独特感受书写人生悲欢，婉约词的艺术巅峰。将个人命运与时代苦难融为一体。",ex:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。\n知否，知否？应是绿肥红瘦。\n此情无计可消除，才下眉头，却上心头。\n莫道不销魂，帘卷西风，人比黄花瘦。\n生当作人杰，死亦为鬼雄。"},
74:{in:"《辛弃疾词集》收录豪放词派代表辛弃疾的词作。醉里挑灯看剑梦回吹角连营雄浑悲壮。与苏轼并称苏辛，将词的境界推向新的高度。",th:"以词抒写报国壮志和恢复中原的理想，在豪放中寓含深沉的悲壮和愤慨。",ex:"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。\n了却君王天下事，赢得生前身后名。可怜白发生！\n想当年，金戈铁马，气吞万里如虎。"},
75:{in:"《陆游诗集》收录南宋爱国诗人陆游的九千余首诗。王师北定中原日家祭无忘告乃翁表达至死不渝的爱国之心。是中国诗歌史上存诗最多的诗人之一。",th:"至死不渝的爱国精神，以诗歌表达恢复中原的坚定信念。兼有田园诗和爱情诗的多重面貌。",ex:"驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。\n王师北定中原日，家祭无忘告乃翁。\n山重水复疑无路，柳暗花明又一村。\n纸上得来终觉浅，绝知此事要躬行。"},
76:{in:"《柳永词集》收录北宋词人柳永的词作。创制大量慢词，杨柳岸晓风残月广为传唱。凡有井水饮处即能歌柳词，是宋代最受欢迎的词人。",th:"慢词的创制与市井文化的繁荣，以通俗语言写都市生活与离愁别绪。",ex:"执手相看泪眼，竟无语凝噎。念去去，千里烟波，暮霭沉沉楚天阔。\n多情自古伤离别，更那堪，冷落清秋节！今宵酒醒何处？杨柳岸，晓风残月。\n衣带渐宽终不悔，为伊消得人憔悴。"},
77:{in:"《欧阳修文集》收录北宋文坛领袖欧阳修的散文。醉翁亭记为山水散文极品，唐宋八大家之一。领导北宋诗文革新运动影响深远。",th:"诗文革新的文学主张，文道并重。以流畅自然的散文风格反对浮华。",ex:"醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n庭院深深深几许，杨柳堆烟，帘幕无重数。\n人生自是有情痴，此恨不关风与月。"},
78:{in:"《王安石文集》收录北宋政治家兼文学家王安石的诗文。游褒禅山记等名篇传诵不衰，诗文革新运动重要人物。以政治家的眼光写诗文别有深意。",th:"改革精神贯穿文学创作，以诗文表达政治理想和人生感悟。文如其人的刚直风格。",ex:"春风又绿江南岸，明月何时照我还。\n不畏浮云遮望眼，自缘身在最高层。\n千门万户曈曈日，总把新桃换旧符。"},
79:{in:"《黄庭坚诗集》收录江西诗派开创者黄庭坚的诗作。讲究点铁成金夺胎换骨，与苏轼并称苏黄。诗风瘦硬生新自成一家。",th:"以学问为诗的创作方法，强调诗歌技法的锤炼和创新。",ex:"桃李春风一杯酒，江湖夜雨十年灯。\n落木千山天远大，澄江一道月分明。"},
80:{in:"《范仲淹文集》收录北宋名臣范仲淹的诗文。岳阳楼记为千古名篇，先天下之忧而忧后天下之乐而乐激励无数仁人志士。",th:"以天下为己任的担当精神，忧乐天下的政治理想和人格境界。",ex:"先天下之忧而忧，后天下之乐而乐。\n不以物喜，不以己悲。居庙堂之高则忧其民，处江湖之远则忧其君。\n长烟一空，皓月千里，浮光跃金，静影沉璧。渔歌互答，此乐何极！"},
81:{in:"《晏殊词集》收录北宋宰相词人晏殊的词作。无可奈何花落去似曾相识燕归来意境浑然天成，是北宋前期婉约词的代表。",th:"以宰相之身写细腻之情，在富贵气象中寓含人生哲思。",ex:"无可奈何花落去，似曾相识燕归来。小园香径独徘徊。\n一曲新词酒一杯，去年天气旧亭台。"},
82:{in:"《周邦彦词集》收录北宋词集大成者周邦彦的词作。格律精严音韵和谐，被视为词家正宗。对宋词的艺术规范做出重要贡献。",th:"词的格律化和艺术规范化，以精工典雅的风格集北宋词之大成。",ex:"叶上初阳干宿雨，水面清圆，一一风荷举。\n风老莺雏，雨肥梅子。"},
83:{in:"《姜夔词集》收录南宋格律派词人姜夔的词作。二十四桥仍在波心荡冷月无声清空骚雅。精通音律能自度曲，是宋词雅化的代表。",th:"清空骚雅的审美追求，以精纯技法营造空灵意境。词乐合一的艺术理想。",ex:"二十四桥仍在，波心荡，冷月无声。念桥边红药，年年知为谁生？\n纵豆蔻词工，青楼梦好，难赋深情。"},
84:{in:"《秦观词集》收录苏门四学士之一秦观的词作。两情若是久长时又岂在朝朝暮暮为词中名句。词风柔婉细腻情致深长。",th:"以柔婉笔触书写爱情与离愁，将情感表达推向细腻深微的境界。",ex:"两情若是久长时，又岂在朝朝暮暮。\n金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。"},
85:{in:"《杨万里诗集》收录南宋四大家之一杨万里的诗作。诚斋体自然活泼，小荷才露尖尖角家喻户晓。以通俗活泼的语言写日常生活。",th:"诚斋体的活泼自然，以浅白语言捕捉生活中的诗意。反对雕琢提倡自然天成。",ex:"接天莲叶无穷碧，映日荷花别样红。\n小荷才露尖尖角，早有蜻蜓立上头。"},
86:{in:"《朱熹文集》收录理学集大成者朱熹的诗文。四书集注为科举标准教材，影响中国思想史七百年。理学体系严密逻辑清晰。",th:"理学的集大成，以天理论为核心构建哲学体系。存天理灭人欲的道德主张影响深远。",ex:"半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。\n等闲识得东风面，万紫千红总是春。\n少年易老学难成，一寸光阴不可轻。"},
87:{in:"《东京梦华录》追忆北宋汴京繁华盛景，是城市生活的百科全书。孟元老以细腻笔触记录了北宋都城的市井风情和社会百态，是珍贵的社会史料。",th:"以追忆保存一座逝去城市的文化记忆，在繁华追忆中寄托故国之思。",ex:"暖风熏得游人醉，直把杭州作汴州。\n汴京富丽天下无，勾栏瓦舍遍地。"},
88:{in:"《梦溪笔谈》是北宋科学百科全书，涵盖天文数学物理化学等领域。沈括以其广博学识记录了当时的科技成就，被李约瑟称为中国科学史的里程碑。",th:"中国古代科学的集大成，以实证精神记录自然现象和技术发明。",ex:"活版印刷，极为精巧。\n日月星辰之运行，四时之更替，皆有常数。\n石油至多，生于地中无穷，此物后必大行于世。"},
89:{in:"《文天祥诗集》收录南宋民族英雄文天祥的诗作。正气歌过零丁洋等慷慨悲壮，人生自古谁无死留取丹心照汗青浩然正气永存。",th:"舍生取义的民族气节，以诗歌表达视死如归的坚定信念。浩然正气的人格力量。",ex:"人生自古谁无死？留取丹心照汗青。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n天地有正气，杂然赋流形。下则为河岳，上则为日星。"},
90:{in:"《岳飞诗词》收录南宋名将岳飞的诗词。满江红怒发冲冠壮怀激烈，是中华民族精神的象征。千古传诵的爱国篇章。",th:"精忠报国的爱国精神，以诗词抒写收复中原的壮志和壮志未酬的悲愤。",ex:"怒发冲冠，凭栏处、潇潇雨歇。抬望眼、仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切！\n壮志饥餐胡虏肉，笑谈渴饮匈奴血。"},
91:{in:"《元好问集》收录金代文学代表元好问的诗作。问世间情是何物直教生死相许千古名句。金亡后以诗存史被誉为一代文宗。",th:"以诗存史的文化担当，在金元易代之际以文学保存民族文化记忆。",ex:"问世间，情是何物，直教生死相许？天南地北双飞客，老翅几回寒暑。\n欢乐趣，离别苦，就中更有痴儿女。渺万里层云，千山暮雪，只影向谁去？"},
92:{in:"《关汉卿杂剧》收录元曲四大家之首关汉卿的戏剧作品。窦娥冤为中国古典悲剧巅峰之作，千古奇冤感天动地。关汉卿以杂剧反映社会黑暗伸张正义。",th:"以杂剧揭露社会黑暗，为底层人民呐喊。窦娥冤的悲剧力量震撼人心。",ex:"碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。\n地生连理枝，水出并头莲。"},
93:{in:"《西厢记》是元杂剧巅峰之作，讲述张生与崔莺莺的爱情故事。愿天下有情人终成眷属的美好愿望，打破封建礼教对爱情的束缚。文采斐然曲词优美。",th:"反对封建礼教追求自由爱情，愿天下有情人终成眷属的人文主义精神。",ex:"地也，你不分好歹何为地！天也，你错勘贤愚枉做天！哎，只落得两泪涟涟。\n六月飞雪，三年不雨，皆因冤也。\n为善的受贫穷更命短，造恶的享富贵又寿延。"},
94:{in:"《窦娥冤》是元杂剧悲剧代表，窦娥含冤而死六月飞雪。以超现实的浪漫手法控诉社会不公，是中国古典悲剧的巅峰。",th:"对社会黑暗的深刻揭露，以悲剧力量呼唤正义和天理。",ex:"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。\n百岁光阴一梦蝶，重回首往事堪嗟。"},
95:{in:"《马致远杂剧》收录元曲四大家之一马致远的作品。汉宫秋等历史剧悲壮苍凉，天净沙秋思被誉为秋思之祖。",th:"以简练语言营造深远的抒情意境。天涯沦落的孤独感与历史兴亡的苍凉感。",ex:"忠臣不怕死，怕死不忠臣。自古忠臣多死谏，从来昏主信谗言。\n赵氏孤儿，忍辱负重二十年，终报大仇。"},
96:{in:"《赵氏孤儿》是元杂剧名作，讲述程婴救孤的忠义故事。最早被译介到欧洲的中国戏剧，伏尔泰曾据此改编。忠义精神感人至深。",th:"忠义精神的极致表达，为正义牺牲自我的崇高品格。",ex:"梧桐叶上三更雨，叶叶声声是别离。\n从来好事天生俭，自古瓜儿苦后甜。"},
97:{in:"《白朴杂剧》收录元曲四大家之一白朴的作品。墙头马上梧桐雨等，文采斐然情感真挚。以清丽的曲词书写历史与爱情。",th:"以优雅笔触融合历史感与抒情性，在元杂剧中别具文人气质。",ex:"峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。\n兴亡千古繁华梦，诗眼倦天涯。"},
98:{in:"《张养浩散曲》收录元代散曲大家张养浩的作品。山坡羊潼关怀古兴百姓苦亡百姓苦千古名句。以散曲形式表达忧国忧民之思。",th:"对人民苦难的深切同情，兴亡百姓皆苦的历史洞见。",ex:"碧纱窗下，红烛影前，绣被焚香独自眠。\n梧桐叶上三更雨，叶叶声声是别离。"},
99:{in:"《崔颢黄鹤楼》是唐诗七律名篇。黄鹤一去不复返白云千载空悠悠，据传李白见之亦搁笔叹眼前有景道不得崔颢题诗在上头。",th:"以登楼远眺引发古今之思，在空间与时间的交织中表达深沉的乡愁。",ex:"昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。\n日暮乡关何处是？烟波江上使人愁。"},
100:{in:"《李之仪词》收录北宋词人李之仪的词作。我住长江头君住长江尾朴素深情广为传唱。以最简洁的语言表达最深沉的思念。",th:"以长江为媒介表达相思之情，朴素语言中蕴含深厚情感。",ex:"我住长江头，君住长江尾。日日思君不见君，共饮长江水。\n此水几时休，此恨何时已。只愿君心似我心，定不负相思意。"},
101:{in:"《西厢记诸宫调》是金代说唱文学代表作，为王实甫西厢记的蓝本。保存了珍贵的音乐文献和说唱艺术传统。",th:"说唱文学的过渡形态，从诸宫调发展为成熟杂剧的重要环节。",ex:"莺莺拜月，张生闻琴。待月西厢下，迎风户半开。隔墙花影动，疑是玉人来。\n愿天下有情人皆成眷属。"},
102:{in:"《三国演义》是中国第一部长篇历史演义小说，描写东汉末年至西晋近百年的历史风云。以刘备曹操孙权三方势力为主线，塑造了诸葛亮关羽张飞等经典形象。",th:"拥刘反曹的正统观念，忠义智勇的价值取向。天下大势分久必合合久必分的历史循环观。",ex:"滚滚长江东逝水，浪花淘尽英雄。是非成败转头空。青山依旧在，几度夕阳红。\n话说天下大势，分久必合，合久必分。\n宁教我负天下人，休教天下人负我。\n既生瑜，何生亮！"},
103:{in:"《水浒传》是中国第一部歌颂农民起义的长篇小说。一百零八位好汉替天行道的故事，塑造了武松林冲鲁智深等鲜活形象。反映官逼民反的社会现实。",th:"官逼民反的反抗精神，替天行道的正义追求。对忠义精神的复杂思考。",ex:"林冲雪夜上梁山。\n武松打虎，景阳冈上赤手空拳打死猛虎。\n逼上梁山，替天行道。\n花和尚鲁智深，拳打镇关西，倒拔垂杨柳。"},
104:{in:"《西游记》是中国古典神魔小说巅峰，讲述唐僧师徒四人西天取经的奇幻旅程。孙悟空的形象家喻户晓，想象力丰富情节曲折，是中国文学最受欢迎的作品之一。",th:"以取经之旅隐喻人生修行，降妖除魔象征战胜内心贪嗔痴。追求真理不畏艰难的精神。",ex:"俺老孙来也！\n皇帝轮流做，明年到我家。\n世上无难事，只怕有心人。\n敢问路在何方？路在脚下。"},
105:{in:"《金瓶梅》是中国第一部由文人独立创作的长篇世情小说。以西门庆家庭生活为中心，深刻揭示明代社会百态。在中国小说史上首次将视线从英雄转向普通人。",th:"对晚明社会的深刻暴露，以家庭生活折射社会黑暗。从英雄叙事转向日常叙事的文学革新。",ex:"金瓶梅为中国世情小说之冠，写尽人间百态。\n世情薄，人情恶，雨送黄昏花易落。"},
106:{in:"《牡丹亭》是明代戏剧巅峰，汤显祖代表作。杜丽娘因梦而死又因情复生，情不知所起一往而深。以浪漫手法歌颂爱情的力量超越生死。",th:"至情论——情不知所起一往而深，生者可以死死可以生。以情抗理的人文主义精神。",ex:"情不知所起，一往而深。生者可以死，死可以生。生而不可与死，死而不可复生者，皆非情之至也。\n原来姹紫嫣红开遍，似这般都付与断井颓垣。良辰美景奈何天，赏心乐事谁家院。\n不到园林，怎知春色如许？"},
107:{in:"《封神演义》以武王伐纣为背景的神魔小说。哪吒杨戬姜子牙等形象深入人心，将历史与神话巧妙融合。构建了庞大的神仙体系。",th:"以神魔之战隐喻人间正义与邪恶的较量。天命观与个人反抗的张力。",ex:"姜太公钓鱼，愿者上钩。\n哪吒闹海，脚踏风火轮，手持乾坤圈。\n封神榜上三百六十五位正神，各显神通。"},
108:{in:"《徐霞客游记》是明代地理名著，徐霞客三十余年实地考察的记录。对喀斯特地貌的研究早于西方，既是科学著作又是文学佳作。",th:"实地考察的科学精神，以亲身经历纠正古代地理记载的错误。求真务实的探索态度。",ex:"五岳归来不看山，黄山归来不看岳。\n大丈夫当朝碧海而暮苍梧。"},
109:{in:"《三言》是冯梦龙编纂的三部白话短篇小说集：喻世明言、警世通言、醒世恒言。反映明代市井生活百态，是中国古代白话小说的经典。",th:"以通俗文学教化人心，在市井故事中寓含警世劝善之意。白话小说的成熟与繁荣。",ex:"卖油郎独占花魁，千古美谈。\n杜十娘怒沉百宝箱，有眼不识荆山玉。\n话须通俗方传远，语必关风始动人。"},
110:{in:"《二拍》是凌濛初编纂的两部白话短篇小说集，与三言合称三言二拍。初刻拍案惊奇、二刻拍案惊奇，白话小说的经典之作。",th:"以新奇故事吸引读者，在通俗叙事中寄寓道德教化。市民文学的繁荣。",ex:"二拍者，初刻拍案惊奇、二刻拍案惊奇也。\n话须通俗方传远，语必关风始动人。"},
111:{in:"《临川四梦》是汤显祖四部传奇剧：牡丹亭、紫钗记、邯郸记、南柯记。以梦为线索探讨人生真谛，是明代戏剧的最高成就。",th:"以梦为镜照见人生，四部剧以不同梦境探讨功名爱情权势人生的虚幻与真实。",ex:"临川四梦——紫钗记、牡丹亭、南柯记、邯郸记。梦中之情，何必非真？\n天下女子有情，宁如杜丽娘者乎！"},
112:{in:"《归有光文集》收录明代散文家归有光的文章。项脊轩志为名篇，以家常琐事抒发深情淡而有味。唐宋派散文的代表作家。",th:"以家常琐事书写深沉情感，平淡中见真情的散文美学。",ex:"项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注。\n庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。"},
113:{in:"《张岱文集》收录晚明小品文大家张岱的文章。陶庵梦忆、西湖梦寻追忆往昔繁华，文字清隽风雅。在亡国之痛中以文字保存文化记忆。",th:"以小品文保存文化记忆，在追忆中寄托故国之思和人生感怀。",ex:"雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n张岱之文，如雪中梅花，清冷而有余香。"},
114:{in:"《袁宏道文集》收录公安派代表袁宏道的文章。提倡独抒性灵不拘格套，反对复古拟古之风。公安派的理论开创了晚明小品文的新局面。",th:"独抒性灵的文学主张，反对拟古强调个性表达。性灵说的文学革新。",ex:"独抒性灵，不拘格套。\n袁宏道提出性灵说，强调文学应表达真情实感。"},
115:{in:"《天工开物》是中国古代科技百科全书，系统记载农业手工业技术。宋应星以图文并茂的方式记录了各项生产技术，被誉为中国17世纪的工艺百科全书。",th:"实学精神——以实证方法记录生产技术，强调经世致用。",ex:"天工开物，乃粒乃服。凡稻种最多，各以其地所宜。\n此书于器物之制造，最为详备，中国十七世纪的工艺百科全书。"},
116:{in:"《红楼梦》是中国古典小说最高成就，以贾府兴衰为线索展现封建社会全貌。被誉为中国封建社会的百科全书。人物塑造性格鲜明，叙事结构宏大精密，语言优美精纯。",th:"对封建社会全面而深刻的批判，以爱情悲剧揭示社会悲剧。色空观念与人生如梦的哲学思考。",ex:"满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味？\n一个是阆苑仙葩，一个是美玉无瑕。若说没奇缘，今生偏又遇着他；若说有奇缘，如何心事终虚化？\n花谢花飞花满天，红消香断有谁怜？\n世事洞明皆学问，人情练达即文章。\n假作真时真亦假，无为有处有还无。"},
117:{in:"《聊斋志异》是中国文言短篇小说巅峰，四百余篇鬼狐故事。蒲松龄借鬼神讽世情想象瑰丽，以花妖狐魅的故事反映社会现实批判科举弊端。",th:"借鬼狐之口写人间真情，以幻写真批判社会黑暗。对科举制度和礼教束缚的深刻反思。",ex:"姑妄言之姑听之，豆棚瓜架雨如丝。料应厌作人间语，爱听秋坟鬼唱诗。\n写鬼写妖高人一等，刺贪刺虐入骨三分。\n书痴者文必工，艺痴者技必良。"},
118:{in:"《儒林外史》是中国讽刺小说巅峰之作，描绘科举制度下知识分子的众生相。吴敬梓以辛辣幽默的笔法讽刺科举制度的腐朽和知识分子的虚伪。",th:"对科举制度的深刻批判，揭示功名利禄对人性的扭曲。讽刺小说的典范。",ex:"范进中举，喜极而疯。噫！好了！我中了！\n严监生临死伸出两根手指，众人不解，赵氏明白——灯盏里两茎灯草费油。\n儒林外史，讽刺之书，写尽功名利禄之害。"},
119:{in:"《桃花扇》是清代传奇剧代表，以秦淮名妓李香君与侯方域的爱情反映南明兴亡。借离合之情写兴亡之感，是中国古典戏剧的杰作。",th:"借离合之情写兴亡之感，以个人爱情折射国家兴亡。",ex:"商女不知亡国恨，隔江犹唱后庭花。\n桃花扇底送南朝，血溅桃花扇。\n眼见他起朱楼，眼见他宴宾客，眼见他楼塌了。"},
120:{in:"《长生殿》是清代传奇剧代表，写唐玄宗与杨贵妃爱情故事。与桃花扇并称南洪北孔。以优美的曲词和宏大的结构再现盛唐爱情悲剧。",th:"爱情与政治的永恒矛盾，在盛唐悲剧中寄托兴亡之感。",ex:"七月七日长生殿，夜半无人私语时。在天愿作比翼鸟，在地愿为连理枝。\n天长地久有时尽，此恨绵绵无绝期。"},
121:{in:"《纳兰性德词集》收录清代第一词人纳兰性德的词作。人生若只如初见何事秋风悲画扇凄美动人。词风真挚自然在清初词坛独树一帜。",th:"以真挚情感书写人生无常，在富贵中对生命流逝的深切感悟。",ex:"人生若只如初见，何事秋风悲画扇。等闲变却故人心，却道故人心易变。\n我是人间惆怅客，知君何事泪纵横。断肠声里忆平生。\n山一程，水一程，身向榆关那畔行，夜深千帐灯。"},
122:{in:"《阅微草堂笔记》是纪晓岚所著的志怪小说集，与聊斋并称清代笔记小说双璧。以简洁文笔记录奇闻异事，风格不同于聊斋的华丽而趋于质朴。",th:"以笔记形式记录民间传说和奇闻异事，在朴素的叙事中寄寓人生哲理。",ex:"鬼狐有性格，笑骂成文章。纪晓岚笔下，鬼怪亦有情有义。\n天下之大，无奇不有。"},
123:{in:"《镜花缘》是清代奇幻冒险小说，描绘海外奇国异俗。李汝珍以丰富的想象力创造了各种奇异的国度，寓讽刺于幻想之中。",th:"以幻想形式讽刺现实，在海外奇国中寄托社会理想。女性才能的肯定与赞赏。",ex:"百花仙子降凡尘，各花争艳。镜花水月，终归虚幻。\n以海外奇谈写人间百态，才女之风流才情。"},
124:{in:"《老残游记》是晚清四大谴责小说之一，通过江湖医生老残的游历揭露晚清社会黑暗。刘鹗以优美的散文笔法描写山水风景，是谴责小说中文学性最高的作品。",th:"对晚清社会黑暗的全面揭露，以游记形式串联社会百态。谴责中蕴含对国家前途的忧虑。",ex:"大明湖畔，千佛山下，风景如画。\n棋局已残，吾人将老，欲不哭泣也得乎？\n天下之事，坏于奸臣者半，坏于不通世故之君子者亦半。"},
125:{in:"《官场现形记》是晚清四大谴责小说之一，全面揭露晚清官场腐败丑态。李伯元以犀利笔锋描绘官场群丑，笔锋犀利入木三分。",th:"对晚清官场的全面暴露和尖锐讽刺，揭示腐败是封建制度必然产物。",ex:"官场现形记，写尽晚清官场丑态。上自朝廷，下至州县，贪赃枉法，无官不贪。\n做官的诀窍，就是多磕头少说话。"},
126:{in:"《二十年目睹之怪现状》是晚清四大谴责小说之一，以见闻录形式记录晚清社会的种种怪现状。吴趼人以亲身经历般的笔触描绘社会的荒诞与黑暗。",th:"以见闻录形式记录社会百态，在荒诞中见真实的批判精神。",ex:"二十年间所见所闻，无非怪现状。\n九死一生，走遍天下，见尽人间丑态。"},
127:{in:"《孽海花》是晚清四大谴责小说之一，以赛金花故事为线索反映晚清外交与社会。曾朴以历史小说的笔法展现晚清的政治外交和社会风貌。",th:"以人物命运折射时代风云，在中西碰撞中展现晚清社会的复杂面貌。",ex:"孽海花以赛金花为原型，写清末风云变幻。\n曾朴笔下，政界、学界、艺界，尽收眼底。\n彩云易散琉璃脆。"},
128:{in:"《浮生六记》是清代自传体散文，记录沈复与妻子芸娘的平凡生活。真挚感人，林语堂誉为中国文学中最可爱的女人。以家常笔触写深情。",th:"以平凡生活书写真挚爱情，在琐碎日常中发现人生之美。",ex:"闺房记乐。余与芸娘，相敬如宾，举案齐眉。芸娘性柔而聪慧，余以为知己。\n情之所钟，虽死不悔。\n布衣菜饭，可乐终身，不必作远游计也。"},
129:{in:"《龚自珍集》收录晚清思想先驱龚自珍的诗文。我劝天公重抖擞不拘一格降人才开启近代思想启蒙。以诗文为武器批判时政呼吁变革。",th:"思想启蒙的先驱，以诗文呼唤社会变革。批判时政倡导改革。",ex:"九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才。\n落红不是无情物，化作春泥更护花。\n浩荡离愁白日斜，吟鞭东指即天涯。"},
130:{in:"《郑板桥集》收录扬州八怪之一郑板桥的诗文书画。难得糊涂四字流传天下，诗书画三绝。以通俗语言表达对民生的关切。",th:"难得糊涂的人生哲学，在清醒与糊涂之间寻找平衡。以诗文关怀民生疾苦。",ex:"咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。\n难得糊涂。\n删繁就简三秋树，领异标新二月花。"},
131:{in:"《袁枚集》收录清代才子袁枚的诗文。随园诗话倡导性灵说，反对格调说拟古之风。小仓山房诗文集文采斐然，是清中叶文坛的大家。",th:"性灵说的文学主张，强调诗歌应表达真实情感和个人性情。",ex:"苔花如米小，也学牡丹开。\n牧童骑黄牛，歌声振林樞。意欲捕鸣蝉，忽然闭口立。"},
132:{in:"《曾国藩家书》是晚清名臣曾国藩的家书集，记录其修身齐家治国的智慧。以家常语言谈论人生道理，影响至今被奉为处世经典。",th:"修身齐家治国的实践智慧，以家书形式传递人生经验和道德教诲。",ex:"随园食单，天下美食尽在其中。\n袁枚性灵说，独抒性灵，不拘格套。"},
133:{in:"《说岳全传》讲述岳飞精忠报国的故事，民间影响深远。岳飞形象的文学定型之作，以通俗小说形式传播岳飞的忠义精神。",th:"精忠报国的忠义精神，以小说形式塑造民族英雄的典范形象。",ex:"天下古今之庸人，皆以一惰字致败；天下古今之才人，皆以一傲字致败。\n谋当谋于未萌之初，慎当慎于已盛之时。"},
134:{in:"《隋唐演义》是隋唐历史演义，从隋文帝到唐明皇的历史故事。英雄美人传奇荟萃，以演义形式再现隋唐盛世的风云。",th:"以演义形式讲述历史，在英雄传奇中寄寓对盛世的向往。",ex:"岳飞精忠报国，千古英雄。\n莫须有三字，何以服天下？\n青山有幸埋忠骨，白铁无辜铸佞臣。"},
135:{in:"《东周列国志》系统讲述春秋战国历史的长篇小说，各诸侯国兴亡故事精彩纷呈。是了解先秦历史最通俗的文学读本。",th:"以小说形式普及历史知识，在列国争霸中展现政治智慧和人生哲理。",ex:"话说天下大势，合久必分，分久必合。东周列国，诸侯争霸，七雄并立。\n秦王扫六合，虎视何雄哉！"},
136:{in:"《鲁迅全集》收录中国现代文学奠基人的全部著作。狂人日记为中国第一篇白话小说，阿Q正传深刻揭示国民性。杂文如匕首投枪直刺黑暗。",th:"对国民性的深刻批判和对封建礼教的彻底否定。以文学为武器唤醒国民。",ex:"横眉冷对千夫指，俯首甘为孺子牛。\n其实地上本没有路，走的人多了，也便成了路。\n哀其不幸，怒其不争。\n不在沉默中爆发，就在沉默中灭亡。\n我翻开历史一查，这历史没有年代，歪歪斜斜的每页上都写着仁义道德几个字。"},
137:{in:"《骆驼祥子》是老舍代表作，描写北平人力车夫祥子的悲惨命运。以地道的京味语言描绘底层人民的挣扎与绝望，是京味文学的经典。",th:"对底层人民命运的深切关注，个人奋斗在黑暗社会中的必然失败。京味语言的艺术魅力。",ex:"祥子，一个普通的洋车夫，凭着勤劳与坚忍，想买一辆自己的车。可是，命运一次次击碎他的梦想。\n雨下给富人，也下给穷人。但是，富人在雨中笑，穷人在雨中哭。"},
138:{in:"《家》是巴金激流三部曲之一，描写封建家庭的崩溃和青年一代的觉醒反抗。以真挚笔触描绘封建家庭的窒息和青年的叛逆。",th:"反封建的青春宣言，封建家庭制度对人性的压抑和青年一代的觉醒。",ex:"家是一个牢笼，年轻的心灵渴望自由。\n青春是美丽的东西，而且对我来说它永远是鼓舞的源泉。\n我是青年，我不是畸人，我不是愚人，我要给自己把幸福争过来。"},
139:{in:"《子夜》是茅盾代表作，描绘20世纪30年代上海的社会全景。以宏大的叙事结构展现中国民族资本家的命运和都市社会的复杂面貌。",th:"对半殖民地中国社会的全景描绘，民族资本家的困境和都市社会的矛盾。",ex:"子夜的上海，霓虹闪烁，资本与欲望交织的都市丛林。\n吴荪甫，民族资本家的悲剧——在帝国主义与官僚资本的双重夹击下，英雄末路。"},
140:{in:"《边城》是沈从文代表作，描绘湘西边城茶峒的纯美爱情。田园牧歌式的文学净土，以质朴纯净的文字构建理想的人性世界。",th:"对纯真人性的讴歌，在湘西净土中寻找理想的人性之美。田园牧歌式的文学理想。",ex:"由四川过湖南去，靠东有一条官路。这官路将近湘西边境到了一个地方名为茶峒的小山城时，有一小溪，溪边有座白色小塔。\n翠翠在风日里长养着，触目为青山绿水，一对眸子清明如水晶。\n这个人也许永远不回来了，也许明天回来。"},
141:{in:"《雷雨》是中国现代话剧奠基之作，两个家庭三十年的恩怨纠葛。戏剧冲突激烈人物关系复杂，被誉为中国的俄狄浦斯王。",th:"命运悲剧与阶级压迫的双重主题，封建家庭的罪恶和人性扭曲。",ex:"雷雨之夜，周公馆的秘密一一揭开——三十年前的恩怨，终于在这一刻爆发。\n我是我的我。"},
142:{in:"《围城》是钱钟书唯一长篇，以幽默讽刺笔法描绘知识分子群像。围在城里的人想逃出来城外的人想冲进去，是对婚姻和人生的经典隐喻。",th:"围城困境——人生处处是围城，知识分子精神的困境和人生的荒诞。幽默讽刺的文学智慧。",ex:"城外的人想冲进去，城里的人想逃出来。婚姻也罢，职业也罢，人生的愿望大都如此。\n天下只有两种人，譬如一串葡萄到手，一种人挑最好的先吃，另一种人把最好的留在最后。"},
143:{in:"《张爱玲全集》收录民国才女张爱玲的小说。倾城之恋金锁记等以冷艳笔触描绘都市男女。文字精致意象丰富，在华丽中见苍凉。",th:"在华丽与苍凉之间书写都市男女的爱情与命运。人性的洞察和文字的极致。",ex:"生命是一袭华美的袍，爬满了蚤子。\n因为爱过，所以慈悲；因为懂得，所以宽容。\n于千万人之中遇见你所要遇见的人，于千万年之中，时间的无涯的荒野里，没有早一步，也没有晚一步。"},
144:{in:"《呼兰河传》是萧红代表作，描绘东北呼兰河小城的风土人情。笔调苍凉寂寞而深情，在琐碎日常中写出生命的顽强与无奈。",th:"以苍凉笔调书写故乡记忆，在寂寞中表达对生命的深情。",ex:"满天星光，满屋月亮，人生何如，为什么这么悲凉？\n花开了，就像睡醒了似的。鸟飞了，就像在天上逛似的。虫子叫了，就像虫子在说话似的。一切都活了。\n呼兰河这小城里边，以前住着我的祖父，现在埋着我的祖父。"},
145:{in:"《徐志摩诗集》收录新月派代表诗人徐志摩的诗作。再别康桥轻轻的我走了正如我轻轻的来浪漫唯美，是中国现代诗歌的经典。",th:"浪漫主义的诗学追求，以优美韵律和意象表达对自由和美的向往。",ex:"轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。那河畔的金柳，是夕阳中的新娘；波光里的艳影，在我的心头荡漾。\n悄悄的我走了，正如我悄悄的来；我挥一挥衣袖，不带走一片云彩。"},
146:{in:"《闻一多诗集》收录新月派诗人闻一多的诗作。死水红烛等诗篇关注现实格律严整，后为民主运动献身。",th:"格律严谨的诗歌形式与炽热的爱国情怀。诗歌的建筑美理论。",ex:"红烛啊！这样红的烛！诗人啊！吐出你的心来比比，可是一般颜色？\n这是一沟绝望的死水，清风吹不起半点漪沦。"},
147:{in:"《朱自清散文》收录现代散文大家朱自清的散文。背影荷塘月色等名篇情感细腻真挚动人。是中国现代散文的经典。",th:"以细腻笔触书写亲情和自然之美，真挚情感和优美文笔的完美结合。",ex:"盼望着，盼望着，东风来了，春天的脚步近了。\n燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？"},
148:{in:"《郁达夫文集》收录创造社创始人之一郁达夫的作品。沉沦等作品大胆暴露内心，文风清丽哀婉。以自传体小说开创现代文学的新风格。",th:"以暴露内心的勇气书写知识分子的苦闷，自传体小说的文学创新。",ex:"春风沉醉的晚上，我在路灯下漫步，感受着这城市的呼吸。\n曾因酒醉鞭名马，生怕情多累美人。"},
149:{in:"《冰心散文》收录中国现代儿童文学先驱冰心的散文。繁星春水等作品以母爱童真自然为主题温暖治愈。",th:"爱的哲学——以母爱童真和自然之爱构建温暖的人生观。",ex:"繁星闪烁着——深蓝的太空，何曾听得见它们对话？沉默中，微光里，它们深深的互相颂赞了。\n成功的花，人们只惊慕她现时的明艳！然而当初她的芽儿，浸透了奋斗的泪泉。\n墙角的花！你孤芳自赏时，天地便小了。"},
150:{in:"《林语堂散文》收录两脚踏中西文化的林语堂的散文。吾国与吾民向世界介绍中国文化，以幽默闲适的笔调谈人生。",th:"中西文化交融的视野，以幽默闲适的笔调介绍中国文化和人生哲学。",ex:"人生在世，还不是有时笑笑人家，有时给人家笑笑。\n享受悠闲生活当然比享受奢侈生活便宜得多。\n读书，开茅塞，除鄙见，得新知，增学问，广识见，养性灵。"},
151:{in:"《彷徨》是鲁迅第二部小说集，收录祝福伤逝等名篇。深刻揭示旧社会的压迫与人性的挣扎。",th:"在彷徨中坚持批判，以小说揭示封建社会的吃人本质。",ex:"从来如此，便对么？\n希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。"},
152:{in:"《茶馆》是老舍戏剧杰作，通过裕泰茶馆五十年的变迁展现中国社会沧桑巨变。三幕剧跨越三个时代，以小见大反映社会变迁。",th:"以小见大的历史书写，一个茶馆就是一部中国近代史。对社会变迁的深刻思考。",ex:"我爱咱们的国呀，可是谁爱我呢？\n茶馆，一个小小的茶馆，见证了五十年的风风雨雨。\n大傻杨说书：改良改良，越改越凉。"},
153:{in:"《活着》是余华代表作，讲述福贵一生的苦难与坚韧。以平静笔调书写命运无常感动全球读者，是中国当代文学走向世界的标志性作品。",th:"活着本身就是生命的意义，以平静笔调书写命运无常中的坚韧。",ex:"人是为活着本身而活着的，而不是为了活着之外的任何事物而活着。\n以笑的方式哭，在死亡的伴随下活着。\n最初我们来到这个世界，是因为不得不来；最终我们离开这个世界，是因为不得不走。"},
154:{in:"《平凡的世界》是路遥代表作，描写黄土高原上普通人奋斗的人生故事。以现实主义笔法描绘改革开放初期中国农村的巨大变革，激励无数青年。",th:"在平凡中追求不平凡，普通人的奋斗精神。劳动与爱情的交织。",ex:"只有劳动才可能使人在生活中强大。\n生活不能等待别人来安排，要自己去争取和奋斗。\n什么是人生？人生就是永不休止的奋斗！"},
155:{in:"《白鹿原》是陈忠实代表作，描绘白鹿原上两个家族的恩怨与变迁。渭河平原的史诗，以魔幻现实主义手法展现近代中国的风云变幻。",th:"家族史诗中的民族命运，传统文化与现代文明的碰撞。",ex:"白嘉轩后来引以豪壮的是一生里娶过七回女人。\n圣人能看透凡人的隐情隐秘，凡人却看不透圣人的作为。\n好饭耐不得三顿吃，好衣架不住半月穿，好书却经得起一辈子诵读。"},
156:{in:"《红高粱家族》是莫言代表作之一，以浓烈色彩描绘高密东北乡的传奇故事。诺贝尔文学奖获奖作家的成名作，以魔幻现实主义重塑民间历史。",th:"以魔幻现实主义书写民间历史，浓烈的生命力和原始的野性美。",ex:"给岁月以文明，而不是给文明以岁月。\n不要回答！不要回答！不要回答！\n弱小和无知不是生存的障碍，傲慢才是。\n失去人性，失去很多；失去兽性，失去一切。\n宇宙很大，生活更大。"},
157:{in:"《蛙》是莫言诺贝尔文学奖获奖作品之一，以乡村女医生姑姑的一生反映计划生育政策。以书信体和话剧穿插的形式，深刻反思生命的意义。",th:"对生命伦理的深刻反思，计划生育政策下的人性挣扎。",ex:"逝者如斯夫，不舍昼夜。\n物理学不存在了。"},
158:{in:"《三体》是中国科幻里程碑，黑暗森林法则宇宙社会学震撼全球。刘慈欣以硬科幻的方式思考宇宙文明的关系，雨果奖获奖作品。",th:"宇宙社会学的哲学思考——黑暗森林法则、技术爆炸、猜疑链。对人类文明命运的终极追问。",ex:"上帝不响，像一切全由我定。\n繁花似锦，不过一场大梦。沪上的繁华，终究是虚妄。\n不响——上海人最厉害的两个字。"},
159:{in:"《许三观卖血记》是余华又一力作，讲述许三观靠卖血度过人生难关。悲喜交织令人动容，以幽默笔调书写小人物的辛酸人生。",th:"小人物的生存智慧和生命韧性，在苦难中保持尊严和幽默。",ex:"那一天我二十一岁，在我一生的黄金时代，我有好多奢望。我想爱，想吃，还想在一瞬间变成天上半明半暗的云。\n我只愿蓬勃生活在此时此刻，无所谓去哪，无所谓见谁。"},
160:{in:"《长恨歌》是王安忆代表作，描绘上海弄堂女人王琦瑶四十年的命运沉浮。茅盾文学奖获奖作品，以细腻笔触书写都市女性的命运。",th:"都市女性的命运书写，以一个女人的一生折射时代变迁。上海的城市记忆。",ex:"城南旧事，童年的记忆如同冬阳下的骆驼队，缓缓走过来，又缓缓走过去。\n爸爸的花儿落了，我也不再是小孩子。\n长亭外，古道边，芳草碧连天。"},
161:{in:"《城南旧事》是林海音自传体小说，以小女孩英子的视角展现20年代北京城南的生活。纯真的目光中透着淡淡的哀愁和怀旧。",th:"以童年视角书写成长与离别，在纯真中感受人生无常。",ex:"卑鄙是卑鄙者的通行证，高尚是高尚者的墓志铭。\n那时我们有梦，关于文学，关于爱情，关于穿越世界的旅行。如今我们深夜饮酒，杯子碰到一起，都是梦破碎的声音。"},
162:{in:"《北岛诗集》收录朦胧诗代表诗人北岛的诗作。卑鄙是卑鄙者的通行证高尚是高尚者的墓志铭成为时代的呐喊。",th:"朦胧诗的思想启蒙，以诗歌对抗平庸和虚伪。对自由和真理的坚守。",ex:"黑夜给了我黑色的眼睛，我却用它寻找光明。\n你一会看我，一会看云。我觉得你看我时很远，你看云时很近。\n草在结它的种子，风在摇它的叶子。我们站着，不说话，就十分美好。"},
163:{in:"《顾城诗集》收录朦胧诗代表顾城的诗作。黑夜给了我黑色的眼睛我却用它寻找光明成为一代人的精神符号。诗风纯净如童话。",th:"以童真视角书写世界，在黑暗中寻找光明。纯粹诗学的追求。",ex:"从明天起，做一个幸福的人。喂马，劈柴，周游世界。从明天起，关心粮食和蔬菜。我有一所房子，面朝大海，春暖花开。\n天空一无所有，为何给我安慰。"},
164:{in:"《海子诗集》收录当代诗人海子的诗作。面朝大海春暖花开成为一代人的精神图腾。诗风纯粹热烈，以生命书写对理想世界的向往。",th:"以诗人的热情拥抱世界，在理想与现实之间寻找精神的栖息地。",ex:"死是一件不必急于求成的事，死是一个必然会降临的节日。\n我常觉得这中间有着宿命的味道：仿佛这古园就是为了等我，而历尽沧桑在那儿等待了四百多年。"},
165:{in:"《我与地坛》是史铁生散文代表作，在地坛思考生死与命运。文字深沉而有力量，是关于生命意义的深刻思考。",th:"在残疾中思考生命的意义，对生死命运的深沉感悟。母爱与生命的力量。",ex:"文化苦旅——从敦煌到西湖，从道士塔到天一阁。\n废墟是过程，人生就是从废墟出发，走向新的废墟。"},
166:{in:"《文化苦旅》是余秋雨文化散文代表作，行走中国大地的文化思考。开创文化大散文的文体，以行旅见闻书写文化感悟。",th:"以行走触发文化思考，在历史遗迹中寻找文化精神。文化大散文的开创。",ex:"我是雨和雪的老熟人了，我有九十岁了。雨雪看老了我，我也把它们给看老了。\n故事总要有结束的时候，但不是每个人都有尾声。\n我守着这团火，无论遇到狂风暴雨，我都不会让它熄灭。"},
167:{in:"《额尔古纳河右岸》是迟子建茅盾文学奖作品，描绘鄂温克族最后一位酋长女人的百年人生。以诗意的笔触书写一个民族的兴衰。",th:"以诗意的笔触记录一个民族的消亡，对自然文明的深切缅怀。",ex:"尘埃落定，那些曾经的喧嚣与浮华都归于沉寂。\n上天叫我看见、听见，叫我置身事外，又叫我超然物外。\n傻子看到的东西，比聪明人更多。"},
168:{in:"《尘埃落定》是阿来茅盾文学奖作品，以傻子视角讲述土司制度的终结。藏族文化的史诗，以独特视角揭示历史的必然。",th:"以傻子的纯真透视权力和欲望的荒诞，历史进程中的文化冲突。",ex:"风声雨声读书声，声声入耳；家事国事天下事，事事关心。\n在时代洪流中，每个人都是一朵浪花。"},
169:{in:"《繁花》是金宇澄茅盾文学奖作品，以上海话书写上海市井生活。当代城市文学新高度，以方言重塑城市记忆。",th:"以方言书写城市记忆，在市井生活中发现文学的诗意。",ex:"穿林海，跨雪原，气冲霄汉。\n杨子荣打虎上山，智取威虎山。\n管叫山河换新装。"},
170:{in:"《黄金时代》是王小波代表作，以黑色幽默书写特殊年代的知识分子命运。独立精神的象征，以幽默对抗荒诞。",th:"以黑色幽默解构荒诞，独立自由精神的坚守。对理性和尊严的捍卫。",ex:"何以解忧？唯有下棋。\n棋王王一生，穷得只有一副象棋，却下出了一代棋王的传奇。\n吃饭是为了活着，但活着不是为了吃饭。"},
171:{in:"《穆斯林的葬礼》是霍达茅盾文学奖作品，讲述一个穆斯林家族六十年间的兴衰与爱情悲剧。以真挚笔触书写宗教信仰与爱情的冲突。",th:"宗教信仰与世俗爱情的冲突，一个家族的悲剧折射民族命运的沉重。",ex:"我迷恋那种充满野性和生机的青春。\n阳光灿烂的日子，是关于青春与成长的记忆。\n我的故事总是发生在夏天。"},
172:{in:"《废都》是贾平凹争议之作，描绘西京城中文人的精神困境。引发广泛讨论，以大胆笔触揭示当代知识分子的精神危机。",th:"当代知识分子的精神困境，传统与现代冲突中的人性挣扎。",ex:"颂莲走进陈家花园的那一天，便已注定了悲剧的命运。\n井底望月，谁不是井底之蛙？"},
173:{in:"《秦腔》是贾平凹茅盾文学奖作品，以秦腔为线索描绘农村变革中传统文化的衰落。是对正在消逝的乡村文明的一曲挽歌。",th:"传统文化在现代化进程中的衰落，对乡村文明的深情挽歌。",ex:"一地鸡毛，说的就是生活。\n生活就是由一件一件琐碎的小事组成的。\n小林家一斤豆腐变馊了，这就是一地鸡毛的开端。"},
174:{in:"《青春之歌》描写九一八到一二九期间青年学生的觉醒与成长。是新中国文学中反映青年知识分子道路选择的代表作。",th:"青年知识分子的成长与觉醒，个人命运与国家命运的融合。",ex:"一个人的孤独不是孤独，一个人找另一个人，一句话找另一句话，才是真正的孤独。\n世上的人遍地都是，说得着的人千里难寻。"},
175:{in:"《林海雪原》讲述东北剿匪故事，杨子荣智取威虎山成为经典故事。以传奇笔法书写革命英雄主义。",th:"革命英雄主义的赞歌，以传奇故事书写军民鱼水情。",ex:"人生的路很长，但关键的只有几步。\n高加林在城乡之间徘徊，何去何从？\n生活总是这样，不能叫人处处都满意。"},
176:{in:"《棋王》是阿城代表作，以棋道写人生哲学。知青文学中的清流之作，语言简洁克制，在平淡中见深意。",th:"以棋喻人生，在物质极度匮乏中追求精神的富足。道家哲学的现代诠释。",ex:"何以解忧？唯有下棋。\n棋王用一盘棋对抗整个时代。\n吃饭是为了活着，但活着不是为了吃饭。"},
177:{in:"《动物凶猛》是王朔代表作，以北京大院少年为主角。姜文据此改编电影阳光灿烂的日子，以青春的叛逆和躁动书写一代人的成长。",th:"青春的叛逆与躁动，以率真笔法书写大院子弟的成长记忆。",ex:"我迷恋那种充满野性和生机的青春。\n记忆中的夏天，阳光永远灿烂。\n青春就是一场大汗淋漓的奔跑。"},
178:{in:"《妻妾成群》是苏童代表作，描绘旧式家庭中女性的命运。张艺谋改编为大红灯笼高高挂，以细腻笔触书写封建家庭中女性的悲惨命运。",th:"封建家庭中女性的悲剧命运，男权制度下的女性生存困境。",ex:"我是雨和雪的老熟人了。我们的驯鹿，它们晚上出去，天亮就回来了。\n故事总要有结束的时候，但不是每个人都有尾声。"},
179:{in:"《一地鸡毛》是刘震云代表作，以小公务员的日常琐碎反映生活本质。新写实主义经典，在鸡毛蒜皮中写出生活的真实重量。",th:"新写实主义的文学理念，在琐碎日常中揭示生活的本质。",ex:"世间万物皆有情，人间处处有温暖。\n大河奔流，带走了多少悲欢离合。"},
180:{in:"《一句顶一万句》是刘震云茅盾文学奖作品，描写中国人千百年的孤独感与寻找说得着的人的渴望。",th:"中国人的深层孤独，寻找心灵相通之人的永恒渴望。",ex:"活着就是一切。\n许三观卖血记，一个人用血养活了一家人。\n一盘炒猪肝，二两黄酒，黄酒给我温一温。"},
181:{in:"《人生》是路遥成名作，描写农村青年高加林的人生抉择与爱情悲剧。引发全国大讨论，是理解中国城乡二元结构的文学窗口。",th:"人生选择的艰难，在理想与现实之间的挣扎。城乡差距中的人生命运。",ex:"一条老街，一段往事。\n长恨歌——上海女子的美丽与哀愁。\n上海是一座有记忆的城市，每一条弄堂都有说不完的故事。"},
182:{in:"《暗算》是麦家谍战文学代表作，茅盾文学奖作品。揭示隐蔽战线无名英雄的故事，以悬疑笔法书写情报世界的神秘与残酷。",th:"无名英雄的牺牲与奉献，在黑暗中守护光明的信仰。",ex:"面朝大海，春暖花开——每一个人的梦想。\n海是蓝色的，天空也是蓝色的，但它们是不同的蓝。"},
183:{in:"《受活》是阎连科代表作，以荒诞手法讲述受活庄残疾人的传奇故事。魔幻现实主义的中国表达，以荒诞揭示真实。",th:"以荒诞手法揭示社会现实的荒谬，魔幻现实主义的本土化。",ex:"人世间，不过是一场悲欢离合。\n周家的故事，是中国人半个世纪的缩影。\n人间烟火气，最抚凡人心。"},
184:{in:"《格非江南三部曲》是茅盾文学奖作品，人面桃花山河入梦春尽江南。百年中国知识分子精神史的书写。",th:"百年中国知识分子的精神历程，理想与现实的永恒冲突。",ex:"北上——运河千年，故事万年。\n一条大运河，串联起千年历史与人间百态。\n水是活的，河是活的，故事也是活的。"},
185:{in:"《秋园》是八旬老人杨本芬在厨房写成的母亲传记，记录普通中国女性的一生。感动无数读者，以朴素文字书写普通人的伟大。",th:"普通中国女性的生命史诗，在苦难中保持尊严和善良。",ex:"长安的荔枝，千里送荔枝，只为博妃子一笑。\n一骑红尘妃子笑，无人知是荔枝来。\n小人物在大时代中的挣扎，不过是长安城中的一颗荔枝。"},
186:{in:"《人世间》是梁晓声茅盾文学奖作品，描绘北方城市平民社区五十年的沧桑巨变。以史诗笔法书写普通人的命运。",th:"普通人在时代洪流中的命运沉浮，人世间的温情与沧桑。",ex:"风声——谍战中的暗流涌动。\n谁是老鬼？在这座小楼里，每个人都在演戏。\n信仰不是在光明中高歌，而是在黑暗中坚守。"},
187:{in:"《北上》是徐则臣茅盾文学奖作品，沿京杭大运河展开百年中国故事。运河文明的壮丽史诗，以运河为纽带串联历史与现实。",th:"大运河的文化意义和历史记忆，以水道串联百年中国故事。",ex:"红旗谱——中国农民的百年抗争史。\n锁井镇上，两代人的恩怨情仇。"},
188:{in:"《长安的荔枝》是马伯庸历史小说，以一骑红尘妃子笑为引子。展现小人物在大时代中的挣扎与智慧，以微观史观书写宏大历史。",th:"小人物视角的大历史，以微观叙事解构宏大叙事。",ex:"创业难，守业更难。\n梁生宝带领蛤蟆滩的农民走合作化道路。\n蛤蟆滩上的春天，比别处来得更晚，却也更持久。"},
189:{in:"《风声》是麦家谍战名作，一座老宅中的密室推理与信仰抉择。改编电影获巨大成功，以紧张的情节和深刻的人性刻画著称。",th:"在极端环境中考验人性，信仰与背叛的永恒命题。",ex:"南渡——抗战烽火中知识分子的南渡北归。\n万里长征，辞却了五朝宫阙，暂驻足衡山湘水。\n千秋耻，终当雪。中兴业，须人杰。"},
190:{in:"《红旗谱》描绘冀中平原农民革命斗争的史诗。中国农民觉醒的壮丽画卷，是新中国文学的重要收获。",th:"农民革命的壮丽画卷，阶级意识的觉醒和斗争精神。",ex:"笨花村的日子，像棉花一样柔软而坚韧。\n笨花——棉花开了又谢，日子过了又来。\n铁凝笔下的冀中平原，是一个温柔而倔强的世界。"},
191:{in:"《创业史》描绘农业合作化时期关中农村的变革。柳青以现实主义笔法记录农村社会主义改造，是了解那个时代的重要文学窗口。",th:"农村变革中的新旧思想冲突，社会主义建设中的创业精神。",ex:"我必须是你近旁的一株木棉，作为树的形象和你站在一起。根，紧握在地下；叶，相触在云里。\n不仅爱你伟岸的身躯，也爱你坚持的位置，足下的土地。"},
192:{in:"《南渡记》是宗璞野葫芦引四卷本之一，描写抗战时期知识分子的南迁与坚守。以亲历者的视角记录西南联大的岁月。",th:"抗战时期知识分子的坚守与气节，文化传承的薪火相传。",ex:"九月寓言——大地上的故事，如同九月的阳光，温暖而忧伤。\n大地是有记忆的，每一寸土地都记载着故事。"},
193:{in:"《白鹿原》是陈忠实茅盾文学奖作品，描绘关中平原两个家族的百年恩怨。中国当代文学的里程碑之作。",th:"家族史诗中的民族命运，传统文化与现代文明的碰撞。",ex:"白嘉轩后来引以豪壮的是一生里娶过七回女人。\n仁义白鹿村，原上白鹿来。\n圣人能看透凡人的隐情隐秘，凡人却看不透圣人的作为。"},
194:{in:"《面朝大海春暖花开》是海子名篇，从明天起做一个幸福的人成为一代人的精神宣言。以朴素的语言表达对美好生活的向往。",th:"对理想生活的向往，在诗意中寻找幸福。",ex:"从明天起，做一个幸福的人。喂马，劈柴，周游世界。\n面朝大海，春暖花开。\n天空一无所有，为何给我安慰。"},
195:{in:"《致橡树》是朦胧诗人舒婷代表作，以橡树与木棉比喻平等的爱情观。影响深远，是当代中国最著名的爱情诗之一。",th:"平等独立的爱情观，以橡树与木棉比喻相互尊重的关系。",ex:"我如果爱你——绝不像攀援的凌霄花，借你的高枝炫耀自己。\n我必须是你近旁的一株木棉，作为树的形象和你站在一起。\n爱——不仅爱你伟岸的身躯，也爱你坚持的位置，足下的土地。"},
196:{in:"《西藏组诗》是以西藏为题材的当代诗歌代表作，神秘辽阔的高原意象震撼人心。以诗歌形式展现西藏的壮美与神圣。",th:"以高原意象表达对精神世界的探索，西藏作为心灵净土的象征。",ex:"在高原的寂静中，听见了内心的声音。\n西藏——离天最近的地方，也是离心最近的地方。"},
197:{in:"《九月寓言》是张炜长篇代表作，以寓言式叙事描绘胶东农村的变迁。充满诗意与哲思，在寓言中书写人与大地的关系。",th:"以寓言形式思考人与自然的关系，在诗意中表达对土地的深情。",ex:"大地是有记忆的，每一寸土地都记载着故事。\n九月寓言——在寓言中书写人与大地的关系。"},
198:{in:"《笨花》是铁凝长篇代表作，描绘冀中平原笨花村半个世纪的变迁。乡土中国的深情书写，以女性视角记录乡村变迁。",th:"乡土中国的深情书写，在笨花村的变迁中折射半个世纪的历史。",ex:"笨花村的日子，像棉花一样柔软而坚韧。\n铁凝笔下的女性，总是那么温柔而坚强。\n棉花开了，日子就暖了。"},
199:{in:"《湖光山色》是周大新茅盾文学奖作品，以丹江口水库为背景。描绘当代农村女性命运的起伏，在城乡变迁中书写女性的成长与挣扎。",th:"当代农村女性的命运书写，在时代变迁中寻找自我。",ex:"湖光山色间，一个女人的命运如水般起伏。\n在丹江口的水库边，故事如水般流淌。"},
200:{in:"《主角》是陈彦茅盾文学奖作品，讲述秦腔名伶忆秦娥半生的艺术人生。戏如人生人生如戏，以戏曲人的命运折射时代变迁。",th:"艺术与人生的交融，以戏曲人的命运折射时代的风云变幻。",ex:"戏演到深处，才知人生如戏，戏如人生。\n忆秦娥——一个秦腔名伶的半生，就是一部中国戏曲的当代史。\n秦腔，是黄土地上最嘹亮的声音。一声吼，便是千年的沧桑。"}

// ===== Init =====
window.addEventListener('DOMContentLoaded',()=>{
  renderStats();
  renderEraNav();
  renderGenreBtns();
  renderDiscover('picks');
  renderTagCloud();
  renderView();
  bindEvents();
});

// ===== Render Stats =====
function renderStats(){
  const el=document.getElementById('statsRow');
  const span=W[W.length-1].y-W[0].y;
  el.innerHTML=`
    <div class="stat"><div class="num">${W.length}</div><div class="label">部作品</div></div>
    <div class="stat"><div class="num">${ERAS.length-1}</div><div class="label">个时代</div></div>
    <div class="stat"><div class="num">${Math.abs(Math.round(span/100))}+</div><div class="label">世纪跨度</div></div>
    <div class="stat"><div class="num">${new Set(W.flatMap(w=>w.p.split('/'))).size}</div><div class="label">个地域</div></div>
  `;
}

// ===== Discover Section =====
function renderDiscover(tab){
  curDtab=tab;
  const c=document.getElementById('discoverCards');
  let items=[];

  if(tab==='picks'){
    // Daily picks: use date seed to pick 6 diverse works
    const seed=getDailySeed();
    const scored=W.map(w=>({...w,score:getScore(w)+seededRandom(seed+w.id)*2})).sort((a,b)=>b.score-a.score);
    items=scored.slice(0,6);
  } else if(tab==='random'){
    // Random 6
    const shuffled=[...W].sort(()=>Math.random()-.5);
    items=shuffled.slice(0,6);
  } else if(tab==='bookmarks'){
    items=W.filter(w=>bookmarks.includes(w.id));
    if(!items.length){c.innerHTML='<div style="padding:20px;text-align:center;color:#999">还没有收藏，点击卡片上的 ⭐ 收藏喜欢的作品</div>';return;}
  } else if(tab==='unread'){
    items=W.filter(w=>!readList.includes(w.id));
    if(!items.length){c.innerHTML='<div style="padding:20px;text-align:center;color:#999">所有作品都已标记为已读 🎉</div>';return;}
    items=items.sort(()=>Math.random()-.5).slice(0,8);
  }

  c.innerHTML=items.map(w=>{
    const color=ERA_COLORS[w.e]||'#999';
    const icon=GENRE_ICONS[w.g]||'📄';
    return `<div class="dcard" data-id="${w.id}">
      <div class="dcard-color" style="background:${color}"></div>
      <div class="dcard-body">
        <h4>${icon} ${w.t}</h4>
        <div class="dca">${w.a} · ${fmtYear(w.y)}</div>
        <div class="dcd">${w.d}</div>
      </div>
      <div class="dcbadge" style="background:${color}">${w.e}</div>
    </div>`;
  }).join('');
}

// ===== Era Nav =====
function renderEraNav(){
  const c=document.getElementById('eraBtns');
  c.innerHTML=ERAS.map(e=>{
    const cnt=e==='全部'?W.length:W.filter(w=>w.e===e).length;
    return `<button class="era-btn${e===curEra?' active':''}" data-era="${e}">${e}<span class="count">${cnt}</span></button>`;
  }).join('');
}

function renderGenreBtns(){
  const c=document.getElementById('genreBtns');
  c.innerHTML=GENRES.map(g=>{
    return `<button class="genre-btn${g===curGenre?' active':''}" data-genre="${g}">${g}</button>`;
  }).join('');
}

// ===== Filter =====
function getFiltered(){
  let f=W;
  if(curEra!=='全部') f=f.filter(w=>w.e===curEra);
  if(curGenre!=='全部'){
    if(curGenre==='其他'){
      const main=['诗歌','小说','词','戏剧','散文','哲学','历史','辞赋','文学理论','科幻','军事','神话','地理','科技'];
      f=f.filter(w=>!main.includes(w.g));
    } else {
      f=f.filter(w=>w.g===curGenre);
    }
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    f=f.filter(w=>(w.t+w.a+w.d+w.e+w.g+w.p).toLowerCase().includes(q));
  }
  if(tagFilter){
    const chip=document.querySelector(`.tag-chip[data-tag="${tagFilter}"]`);
    if(chip){
      const ids=chip.dataset.ids.split(',').map(Number);
      f=f.filter(w=>ids.includes(w.id));
    }
  }
  if(shuffleMode) return f.sort(()=>Math.random()-.5);
  return f.sort((a,b)=>a.y-b.y);
}

// ===== Render View =====
function renderView(){
  const items=getFiltered();
  const info=document.getElementById('resultInfo');
  info.innerHTML=`共 <strong>${items.length}</strong> 部作品` + (tagFilter?` · 标签: ${tagFilter}`:'') + (shuffleMode?' · 随机排序':'');

  document.getElementById('gridView').style.display=curView==='grid'?'grid':'none';
  document.getElementById('timelineView').style.display=curView==='timeline'?'block':'none';
  const cv=document.getElementById('chartView');
  cv.classList.toggle('show',curView==='chart');

  if(curView==='grid') renderGrid(items);
  else if(curView==='timeline') renderTimeline(items);
  else renderCharts(items);
}

function renderGrid(items){
  document.getElementById('gridView').innerHTML=items.map(w=>{
    const ext=EXT[w.id]||{};
    const excerpt=ext.ex?ext.ex.split('\\n')[0]:'';
    const isBM=bookmarks.includes(w.id);
    const isRead=readList.includes(w.id);
    const icon=GENRE_ICONS[w.g]||'📄';
    return `
    <div class="card" data-id="${w.id}">
      ${isRead?'<div class="read-badge">✓ 已读</div>':''}
      <span class="card-bookmark${isBM?' bookmarked':''}" data-bid="${w.id}" title="${isBM?'取消收藏':'收藏'}">⭐</span>
      <div class="era-tag">${w.e}</div>
      <h3>${icon} ${w.t}</h3>
      <div class="author">${w.a} · ${fmtYear(w.y)}</div>
      <div class="desc">${w.d}</div>
      ${excerpt?`<div class="card-excerpt">「${excerpt}」</div>`:''}
      <div class="meta">
        <span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span>
      </div>
    </div>
  `}).join('');
}

function renderTimeline(items){
  document.getElementById('timelineView').innerHTML=items.map(w=>`
    <div class="tl-item" data-id="${w.id}">
      <div class="year">${fmtYear(w.y)} · ${w.e}</div>
      <h3>${w.t}</h3>
      <div class="author">${w.a} · ${w.g}</div>
      <div class="desc">${w.d}</div>
    </div>
  `).join('');
}

// ===== Charts =====
function renderCharts(items){
  const cv=document.getElementById('chartView');
  cv.innerHTML=`<div class="chart-grid">
    <div class="chart-card"><h3>📊 时代分布</h3><canvas id="eraChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 体裁分布</h3><canvas id="genreChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 地域分布 Top 10</h3><canvas id="regionChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 时间线密度</h3><canvas id="timeChart" class="chart"></canvas></div>
  </div>`;
  requestAnimationFrame(()=>drawCharts(items));
}

function drawCharts(items){drawEraChart(items);drawGenreChart(items);drawRegionChart(items);drawTimeChart(items)}

function drawEraChart(items){
  const c=document.getElementById('eraChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  ERAS.slice(1).forEach(e=>counts[e]=0);
  items.forEach(w=>{if(counts[w.e]!==undefined)counts[w.e]++});
  const entries=Object.entries(counts);const max=Math.max(...entries.map(e=>e[1]),1);
  const barW=W2/entries.length-8;
  entries.forEach(([era,cnt],i)=>{
    const x=i*(barW+8)+4;const h=Math.max((cnt/max)*(H-60),0);
    ctx.fillStyle=ERA_COLORS[era]||'#999';
    ctx.beginPath();roundRect(ctx,x,H-30-h,barW,h,4);ctx.fill();
    ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(era.slice(0,2),x+barW/2,H-12);
    if(cnt>0){ctx.fillStyle='#333';ctx.font='bold 11px sans-serif';ctx.fillText(cnt,x+barW/2,H-34-h)}
  });
}

function drawGenreChart(items){
  const c=document.getElementById('genreChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  items.forEach(w=>{counts[w.g]=(counts[w.g]||0)+1});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(...entries.map(e=>e[1]),1);const barH=24;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c'];
  entries.forEach(([g,cnt],i)=>{
    const y=i*(barH+6)+10;const w2=Math.max((cnt/max)*(W2-120),0);
    ctx.fillStyle=colors[i%colors.length];ctx.beginPath();roundRect(ctx,80,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(g,74,y+16);
    ctx.fillStyle='#666';ctx.textAlign='left';ctx.fillText(cnt,86+w2,y+16);
  });
}

function drawRegionChart(items){
  const c=document.getElementById('regionChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  items.forEach(w=>{w.p.split('/').forEach(p=>{counts[p]=(counts[p]||0)+1})});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const max=Math.max(...entries.map(e=>e[1]),1);const barH=22;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c','#2c3e50','#d35400'];
  entries.forEach(([p,cnt],i)=>{
    const y=i*(barH+5)+10;const w2=Math.max((cnt/max)*(W2-100),0);
    ctx.fillStyle=colors[i%colors.length];ctx.beginPath();roundRect(ctx,70,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(p,64,y+15);
    ctx.fillStyle='#666';ctx.textAlign='left';ctx.fillText(cnt,76+w2,y+15);
  });
}

function drawTimeChart(items){
  const c=document.getElementById('timeChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const sorted=[...items].sort((a,b)=>a.y-b.y);if(!sorted.length)return;
  const minY=sorted[0].y,maxY=sorted[sorted.length-1].y;const range=maxY-minY||1;
  ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,H-30);ctx.lineTo(W2-10,H-30);ctx.stroke();
  sorted.forEach((w,i)=>{
    const x=40+(w.y-minY)/range*(W2-60);
    ctx.fillStyle=ERA_COLORS[w.e]||'#999';
    ctx.beginPath();ctx.arc(x,H-30-8-Math.random()*80,3,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#999';ctx.font='10px sans-serif';ctx.textAlign='center';
  [sorted[0],sorted[Math.floor(sorted.length/2)],sorted[sorted.length-1]].forEach(w=>{
    const x=40+(w.y-minY)/range*(W2-60);ctx.fillText(fmtYear(w.y),x,H-14);
  });
}

// ===== Utility =====
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,Math.max(w,0)/2,Math.max(h,0)/2);if(w<=0||h<=0)return;
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}
function fmtYear(y){return y<0?'公元前'+Math.abs(y)+'年':y+'年'}

// ===== Related recommendations =====
function getRelated(w){
  // Same era, same genre, or related authors
  return W.filter(x=>x.id!==w.id).map(x=>{
    let score=0;
    if(x.e===w.e) score+=2;
    if(x.g===w.g) score+=3;
    if(x.a===w.a) score+=2;
    if(x.p===w.p) score+=1;
    return {...x,score};
  }).sort((a,b)=>b.score-a.score).slice(0,4);
}

// ===== Modal =====
function showModal(id){
  const w=W.find(x=>x.id===id);if(!w)return;
  const ext=EXT[id]||{};
  const isBM=bookmarks.includes(w.id);
  const isRead=readList.includes(w.id);
  const related=getRelated(w);
  const color=ERA_COLORS[w.e]||'#999';
  const introHtml=ext.in?`<div class="m-section"><div class="m-section-title">📖 作品简介</div><div class="m-intro">${ext.in}</div></div>`:'';
  const thoughtHtml=ext.th?`<div class="m-section"><div class="m-section-title">💡 主要思想</div><div class="m-thought">${ext.th}</div></div>`:'';
  const excerptHtml=ext.ex?`<div class="m-section"><div class="m-section-title">✨ 精选摘录</div><div class="m-excerpt">${ext.ex.replace(/\n/g,'<br>')}</div></div>`:'';
  const relatedHtml=related.length?`<div class="m-related"><div class="m-related-title">🔗 相关推荐</div><div class="m-related-grid">${related.map(r=>`<div class="m-related-item" data-rid="${r.id}"><h5>${r.t}</h5><div class="mri-a">${r.a}</div><div class="mri-e">${r.e} · ${r.g}</div></div>`).join('')}</div></div>`:'';

  document.getElementById('modalBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="width:4px;height:32px;background:${color};border-radius:2px"></div>
      <div><h2>${w.t}</h2><div class="m-author">${w.a} · ${fmtYear(w.y)}</div></div>
    </div>
    <div class="m-desc">${w.d}</div>
    <div class="m-tags"><span>${w.e}</span><span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span></div>
    <div class="m-actions">
      <button class="${isBM?'primary':''}" id="modalBM" data-mid="${w.id}">${isBM?'⭐ 已收藏':'☆ 收藏'}</button>
      <button class="${isRead?'primary':''}" id="modalRead" data-mid="${w.id}">${isRead?'✓ 已读':'📖 标记已读'}</button>
    </div>
    ${introHtml}${thoughtHtml}${excerptHtml}${relatedHtml}
  `;
  document.getElementById('modalOverlay').classList.add('show');

  // Bind modal bookmark
  document.getElementById('modalBM').addEventListener('click',function(){
    toggleBookmark(+this.dataset.mid);
    showModal(+this.dataset.mid); // re-render
  });
  document.getElementById('modalRead').addEventListener('click',function(){
    toggleRead(+this.dataset.mid);
    showModal(+this.dataset.mid); // re-render
  });
  // Related item click
  document.querySelectorAll('.m-related-item').forEach(el=>{
    el.addEventListener('click',()=>showModal(+el.dataset.rid));
  });
}

// ===== Bookmark & Read =====
function toggleBookmark(id){
  const i=bookmarks.indexOf(id);
  if(i>=0){bookmarks.splice(i,1);toast('已取消收藏')}
  else{bookmarks.push(id);toast('⭐ 已收藏')}
  localStorage.setItem('cl_bm',JSON.stringify(bookmarks));
  updateBookmarkBar();
  renderView();
}
function toggleRead(id){
  const i=readList.indexOf(id);
  if(i>=0){readList.splice(i,1);toast('已标记为未读')}
  else{readList.push(id);toast('📖 已标记已读')}
  localStorage.setItem('cl_read',JSON.stringify(readList));
  renderView();
}
function updateBookmarkBar(){
  const bar=document.getElementById('bookmarkBar');
  document.getElementById('bmCount').textContent=bookmarks.length;
  bar.classList.toggle('show',bookmarks.length>0);
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

// ===== Events =====
function bindEvents(){
  // Discover tabs
  document.querySelector('.discover-tabs').addEventListener('click',e=>{
    const btn=e.target.closest('.dtab');if(!btn)return;
    document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderDiscover(btn.dataset.dtab);
  });
  // Discover card click
  document.getElementById('discoverCards').addEventListener('click',e=>{
    const card=e.target.closest('.dcard');if(card) showModal(+card.dataset.id);
  });
  // Era nav
  document.getElementById('eraBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.era-btn');if(!btn)return;
    curEra=btn.dataset.era;
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // Genre
  document.getElementById('genreBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.genre-btn');if(!btn)return;
    curGenre=btn.dataset.genre;
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // View toggle
  document.querySelectorAll('.view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      curView=btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    });
  });
  // Search
  document.getElementById('searchInput').addEventListener('input',e=>{
    searchQ=e.target.value;renderView();
  });
  // Tag cloud
  document.getElementById('tagCloud').addEventListener('click',e=>{
    const chip=e.target.closest('.tag-chip');if(!chip)return;
    tagFilter=tagFilter===chip.dataset.tag?'':chip.dataset.tag;
    document.querySelectorAll('.tag-chip').forEach(c=>c.classList.toggle('active',c.dataset.tag===tagFilter));
    renderView();
  });
  // Grid card click & bookmark
  document.getElementById('gridView').addEventListener('click',e=>{
    const bm=e.target.closest('.card-bookmark');
    if(bm){e.stopPropagation();toggleBookmark(+bm.dataset.bid);return}
    const card=e.target.closest('.card');if(card) showModal(+card.dataset.id);
  });
  // Timeline click
  document.getElementById('timelineView').addEventListener('click',e=>{
    const item=e.target.closest('.tl-item');if(item) showModal(+item.dataset.id);
  });
  // Modal close
  document.getElementById('modalClose').addEventListener('click',()=>{
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalOverlay').addEventListener('click',e=>{
    if(e.target===e.currentTarget) e.currentTarget.classList.remove('show');
  });
  // Shuffle & Reset
  document.getElementById('btnShuffle').addEventListener('click',()=>{
    shuffleMode=!shuffleMode;renderView();
    toast(shuffleMode?'🔀 随机排序':'📊 时间排序');
  });
  document.getElementById('btnReset').addEventListener('click',()=>{
    curEra='全部';curGenre='全部';searchQ='';tagFilter='';shuffleMode=false;
    document.getElementById('searchInput').value='';
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.toggle('active',b.dataset.era==='全部'));
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.toggle('active',b.dataset.genre==='全部'));
    document.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('active'));
    renderView();toast('↺ 已重置筛选');
  });
  // Bookmark clear filter
  document.getElementById('bmClear').addEventListener('click',()=>{
    // Switch discover tab to bookmarks
    document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('active',b.dataset.dtab==='bookmarks'));
    renderDiscover('bookmarks');
    window.scrollTo({top:0,behavior:'smooth'});
  });
  // Scroll top
  const st=document.getElementById('scrollTop');
  window.addEventListener('scroll',()=>{
    st.classList.toggle('show',window.scrollY>400);
    document.getElementById('eraNav').classList.toggle('scrolled',window.scrollY>100);
  });
  st.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('show');
    if(e.key==='/'&&!e.ctrlKey){e.preventDefault();document.getElementById('searchInput').focus();}
  });
  // Init bookmark bar
  updateBookmarkBar();
}
</script>
</body>
</html>
