<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中文文学库 · 两千年文脉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--text2:#666;--accent:#c0392b;--accent2:#e74c3c;--border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
/* Hero */
.hero{position:relative;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px 40px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:300;letter-spacing:.1em;margin-bottom:12px}
.hero h1 span{font-weight:700;background:linear-gradient(90deg,#e74c3c,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .subtitle{font-size:clamp(.9rem,2vw,1.2rem);opacity:.7;margin-bottom:30px;font-weight:300}
.stats-row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center}
.stat .num{font-size:2rem;font-weight:700;color:#f39c12}
.stat .label{font-size:.8rem;opacity:.6;margin-top:2px}
/* Brush stroke decoration */
.brush-line{width:120px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px auto;border-radius:2px}
/* Era Nav */
.era-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;transition:box-shadow .3s}
.era-nav.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.08)}
.era-nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.era-nav-inner::-webkit-scrollbar{display:none}
.era-btn{flex-shrink:0;padding:6px 16px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.era-btn:hover{border-color:var(--accent);color:var(--accent)}
.era-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.era-btn .count{display:inline-block;background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;font-size:.75rem;margin-left:4px}
.era-btn.active .count{background:rgba(255,255,255,.25)}
/* Filter bar */
.filter-bar{max-width:1200px;margin:24px auto 0;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius);font-size:.95rem;background:var(--card);outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.9rem}
.genre-filters{display:flex;gap:6px;flex-wrap:wrap}
.genre-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--card);font-size:.8rem;cursor:pointer;transition:all .2s;color:var(--text2)}
.genre-btn:hover{border-color:var(--accent);color:var(--accent)}
.genre-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-btn{padding:8px 14px;background:var(--card);border:none;cursor:pointer;font-size:.9rem;color:var(--text2);transition:all .2s}
.view-btn.active{background:var(--text);color:#fff}
.view-btn:not(:last-child){border-right:1px solid var(--border)}
/* Main content */
.main{max-width:1200px;margin:20px auto 60px;padding:0 20px}
.result-info{color:var(--text2);font-size:.85rem;margin-bottom:16px}
/* Grid view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .era-tag{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:.7rem;padding:3px 10px;border-radius:0 0 0 var(--radius)}
.card h3{font-size:1.05rem;font-weight:600;margin-bottom:4px;padding-right:60px}
.card .author{color:var(--accent);font-size:.85rem;margin-bottom:8px}
.card .desc{color:var(--text2);font-size:.82rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card .meta span{font-size:.7rem;padding:2px 8px;border-radius:10px;background:#f5f5f5;color:var(--text2)}
/* Timeline view */
.timeline{position:relative;padding-left:40px}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),#f39c12,var(--accent))}
.tl-item{position:relative;margin-bottom:20px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .3s}
.tl-item:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.tl-item::before{content:'';position:absolute;left:-28px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tl-item .year{font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:4px}
.tl-item h3{font-size:.95rem;font-weight:600;margin-bottom:2px}
.tl-item .author{font-size:.8rem;color:var(--text2)}
.tl-item .desc{font-size:.8rem;color:var(--text2);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Chart view */
.chart-section{display:none}
.chart-section.show{display:block}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;margin-top:16px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.chart-card h3{font-size:.95rem;font-weight:600;margin-bottom:16px;color:var(--text)}
canvas.chart{width:100%!important;height:260px!important}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;padding:32px;position:relative;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:12px;right:16px;font-size:1.5rem;cursor:pointer;color:var(--text2);border:none;background:none;line-height:1}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.modal .m-author{color:var(--accent);font-size:1rem;margin-bottom:16px}
.modal .m-desc{line-height:1.8;color:var(--text);margin-bottom:16px}
.modal .m-tags{display:flex;gap:8px;flex-wrap:wrap}
.modal .m-tags span{padding:4px 12px;border-radius:16px;font-size:.8rem;background:#f5f5f5;color:var(--text2)}
.modal .m-tags span:first-child{background:var(--accent);color:#fff}
/* Scroll to top */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(192,57,43,.3);transition:all .3s;z-index:50}
.scroll-top:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(192,57,43,.4)}
.scroll-top.show{display:flex}
/* Responsive */
@media(max-width:768px){
.hero{min-height:50vh;padding:40px 16px 30px}
.stats-row{gap:24px}
.grid{grid-template-columns:1fr}
.chart-grid{grid-template-columns:1fr}
.filter-bar{flex-direction:column}
.genre-filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
}
@media(max-width:480px){
.hero h1{font-size:1.6rem}
.stat .num{font-size:1.4rem}
.era-btn{padding:5px 10px;font-size:.8rem}
}
</style>
</head>
<body>
<!-- Hero -->
<div class="hero">
<h1>中文文学库 · <span>两千年文脉</span></h1>
<p class="subtitle">从诗经到长安的荔枝，200部作品纵览中华文明</p>
<div class="brush-line"></div>
<div class="stats-row" id="statsRow"></div>
</div>
<!-- Era Nav -->
<div class="era-nav" id="eraNav">
<div class="era-nav-inner" id="eraBtns"></div>
</div>
<!-- Filter -->
<div class="filter-bar">
<div class="search-box"><input id="searchInput" placeholder="搜索作品名、作者、关键词…"></div>
<div class="genre-filters" id="genreBtns"></div>
<div class="view-toggle">
<button class="view-btn active" data-view="grid">⊞</button>
<button class="view-btn" data-view="timeline">◷</button>
<button class="view-btn" data-view="chart">▧</button>
</div>
</div>
<!-- Main -->
<div class="main">
<div class="result-info" id="resultInfo"></div>
<div id="gridView" class="grid"></div>

<div id="chartView" class="chart-section"></div>
</div>
<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modal">
<button class="modal-close" id="modalClose">×</button>
<div id="modalBody"></div>
</div>
</div>
<button class="scroll-top" id="scrollTop">↑</button>

{id:37,t:"阮籍咏怀诗",a:"阮籍",y:260,e:"魏晋南北朝",g:"诗歌",ty:"抒情诗",d:"正始文学代表，八十二首咏怀诗隐晦曲折表达对现实的不满与忧虑。",p:"河南"},
{id:38,t:"嵇康集",a:"嵇康",y:260,e:"魏晋南北朝",g:"散文",ty:"文集",d:"竹林七贤领袖之作，与山巨源绝交书等名篇展现独立人格精神。",p:"安徽"},
{id:39,t:"水经注",a:"郦道元",y:515,e:"魏晋南北朝",g:"地理",ty:"地理志",d:"综合性地理著作，详细记载河流山川，文学描写优美，三峡篇尤为著名。",p:"河北"},
{id:40,t:"木兰辞",a:"佚名",y:550,e:"魏晋南北朝",g:"诗歌",ty:"乐府诗",d:"北朝乐府民歌，花木兰代父从军的故事，巾帼英雄形象流传千古。",p:"北方"},
{id:41,t:"孔雀东南飞",a:"佚名",y:200,e:"魏晋南北朝",g:"诗歌",ty:"叙事诗",d:"中国文学史上第一部长篇叙事诗，讲述焦仲卿与刘兰芝的悲剧爱情。",p:"安徽"},
{id:42,t:"昭明文选",a:"萧统",y:530,e:"魏晋南北朝",g:"总集",ty:"诗文选集",d:"中国现存最早的诗文总集，选录先秦至梁代七百余篇，文学选本典范。",p:"江苏"},
{id:43,t:"陈情表",a:"李密",y:280,e:"魏晋南北朝",g:"散文",ty:"表文",d:"李密辞不赴任的表文，以孝道动人，与出师表并称'两大名表'。",p:"四川"},
{id:44,t:"归园田居",a:"陶渊明",y:406,e:"魏晋南北朝",g:"诗歌",ty:"田园诗",d:"陶渊明田园诗代表，五首描绘归隐田园的闲适生活，中国田园诗的典范。",p:"江西"},
{id:45,t:"饮酒·其五",a:"陶渊明",y:416,e:"魏晋南北朝",g:"诗歌",ty:"五言诗",d:"'采菊东篱下悠然见南山'出自此组诗，意境高远物我两忘。",p:"江西"},
{id:46,t:"滕王阁序",a:"王勃",y:675,e:"隋唐",g:"散文",ty:"骈文",d:"初唐四杰王勃名篇，'落霞与孤鹜齐飞秋水共长天一色'传诵千古。",p:"江西"},
{id:47,t:"春江花月夜",a:"张若虚",y:710,e:"隋唐",g:"诗歌",ty:"七言诗",d:"'孤篇盖全唐'，以月为主线贯穿全诗，意境空灵幽美，闻一多赞为'诗中的诗'。",p:"江苏"},
{id:48,t:"李白全集",a:"李白",y:744,e:"隋唐",g:"诗歌",ty:"诗集",d:"诗仙李太白，浪漫主义诗歌巅峰，将进酒蜀道难静夜思等名篇照耀千古。",p:"四川/陕西"},
{id:49,t:"杜甫全集",a:"杜甫",y:760,e:"隋唐",g:"诗歌",ty:"诗集",d:"诗圣杜子美，现实主义诗歌顶峰，三吏三别等反映民间疾苦，被称为'诗史'。",p:"河南/四川"},
{id:50,t:"白居易集",a:"白居易",y:810,e:"隋唐",g:"诗歌",ty:"诗集",d:"新乐府运动倡导者，长恨歌琵琶行长篇叙事名篇，语言通俗老妪能解。",p:"陕西/河南"},
{id:51,t:"王维集",a:"王维",y:740,e:"隋唐",g:"诗歌",ty:"诗集",d:"诗佛王摩诘，山水田园诗派代表，诗中有画画中有诗，禅意深远。",p:"山西/陕西"},
{id:52,t:"孟浩然集",a:"孟浩然",y:730,e:"隋唐",g:"诗歌",ty:"诗集",d:"盛唐山水田园诗人，春晓过故人庄等名篇清新自然淡远悠长。",p:"湖北"},
{id:53,t:"李商隐诗集",a:"李商隐",y:850,e:"隋唐",g:"诗歌",ty:"诗集",d:"晚唐诗人，无题诗朦胧凄美意境深幽，'春蚕到死丝方尽'传诵千年。",p:"河南"},
{id:54,t:"杜牧诗集",a:"杜牧",y:840,e:"隋唐",g:"诗歌",ty:"诗集",d:"晚唐杰出诗人，咏史怀古诗独步一时，'停车坐爱枫林晚'家喻户晓。",p:"陕西"},
{id:55,t:"长恨歌",a:"白居易",y:809,e:"隋唐",g:"诗歌",ty:"叙事诗",d:"白居易代表作，讲述唐玄宗与杨贵妃爱情悲剧，'天长地久有时尽此恨绵绵无绝期'。",p:"陕西"},
{id:56,t:"琵琶行",a:"白居易",y:816,e:"隋唐",g:"诗歌",ty:"叙事诗",d:"白居易贬谪江州时作，'同是天涯沦落人相逢何必曾相识'千古名句。",p:"江西"},
{id:57,t:"韩愈文集",a:"韩愈",y:800,e:"隋唐",g:"散文",ty:"文集",d:"唐宋八大家之首，古文运动倡导者，师说进学解等名篇气势磅礴。",p:"河南"},
{id:58,t:"柳宗元文集",a:"柳宗元",y:810,e:"隋唐",g:"散文",ty:"文集",d:"唐宋八大家之一，山水游记与寓言散文成就极高，永州八记为其代表作。",p:"山西"},
{id:59,t:"刘禹锡集",a:"刘禹锡",y:810,e:"隋唐",g:"诗歌",ty:"诗集",d:"中唐诗人，'沉舟侧畔千帆过病树前头万木春'乐观豁达，被称为'诗豪'。",p:"河南"},
{id:60,t:"寒山诗",a:"寒山",y:750,e:"隋唐",g:"诗歌",ty:"诗集",d:"唐代隐僧寒山之作，融合佛道思想，白话诗风独特，在海外影响巨大。",p:"浙江"},
{id:61,t:"王昌龄诗集",a:"王昌龄",y:740,e:"隋唐",g:"诗歌",ty:"诗集",d:"边塞诗派代表，被誉为'七绝圣手'，'秦时明月汉时关'气魄雄浑。",p:"陕西"},
{id:62,t:"岑参诗集",a:"岑参",y:750,e:"隋唐",g:"诗歌",ty:"诗集",d:"边塞诗派代表，'忽如一夜春风来千树万树梨花开'写雪奇绝。",p:"河南"},
{id:63,t:"高适诗集",a:"高适",y:745,e:"隋唐",g:"诗歌",ty:"诗集",d:"边塞诗派代表，燕歌行气势豪迈，与岑参并称'高岑'。",p:"河北"},
{id:64,t:"李贺诗集",a:"李贺",y:810,e:"隋唐",g:"诗歌",ty:"诗集",d:"被称为'诗鬼'，诗风奇诡瑰丽想象惊人，'黑云压城城欲摧'为其名句。",p:"河南"},
{id:65,t:"唐传奇",a:"多人",y:800,e:"隋唐",g:"小说",ty:"传奇",d:"唐代文言短篇小说，莺莺传霍小玉传南柯记等，标志中国小说走向成熟。",p:"全国"},
{id:66,t:"游子吟",a:"孟郊",y:790,e:"隋唐",g:"诗歌",ty:"五言诗",d:"'慈母手中线游子身上衣'歌颂母爱的千古绝唱，朴实无华感人至深。",p:"浙江"},
{id:67,t:"阿房宫赋",a:"杜牧",y:825,e:"隋唐",g:"辞赋",ty:"咏史赋",d:"杜牧借秦灭之史讽谏当朝，'秦人不暇自哀而后人哀之'警醒千古。",p:"陕西"},
{id:68,t:"师说",a:"韩愈",y:802,e:"隋唐",g:"散文",ty:"论说文",d:"韩愈名篇，'师者所以传道受业解惑也'成为千古教育名言。",p:"河南"},
{id:69,t:"花间集",a:"赵崇祚 编",y:940,e:"五代十国",g:"词",ty:"词集",d:"中国最早的词总集，收录晚唐五代十八家词五百首，婉约词的源头。",p:"四川"},
{id:70,t:"李煜词集",a:"李煜",y:975,e:"五代十国",g:"词",ty:"词集",d:"南唐后主词作，亡国后词风沉痛凄美，'问君能有几多愁'传诵千古。",p:"江苏"},
{id:71,t:"花蕊夫人宫词",a:"花蕊夫人",y:950,e:"五代十国",g:"诗歌",ty:"宫词",d:"后蜀花蕊夫人的百首宫词，描绘蜀宫生活细节，史料与文学价值兼具。",p:"四川"},
{id:72,t:"苏轼全集",a:"苏轼",y:1080,e:"宋代",g:"诗词文",ty:"全集",d:"北宋文学全才，诗书画三绝，念奴娇·赤壁怀古水调歌头等名篇光照千古。",p:"四川/浙江"},
{id:73,t:"李清照集",a:"李清照",y:1125,e:"宋代",g:"词",ty:"词集",d:"婉约词派宗师，'寻寻觅觅冷冷清清'千古第一才女，词作凄美动人。",p:"山东/浙江"},
{id:74,t:"辛弃疾词集",a:"辛弃疾",y:1185,e:"宋代",g:"词",ty:"词集",d:"豪放词派代表，'醉里挑灯看剑梦回吹角连营'雄浑悲壮。",p:"山东/江西"},
{id:75,t:"陆游诗集",a:"陆游",y:1180,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋爱国诗人，存诗九千余首，'王师北定中原日家祭无忘告乃翁'感人至深。",p:"浙江"},
{id:76,t:"柳永词集",a:"柳永",y:1030,e:"宋代",g:"词",ty:"词集",d:"北宋词人，创制大量慢词，'杨柳岸晓风残月'广为传唱，凡有井水处皆歌柳词。",p:"福建"},
{id:77,t:"欧阳修文集",a:"欧阳修",y:1060,e:"宋代",g:"散文",ty:"文集",d:"北宋文坛领袖，醉翁亭记为山水散文极品，唐宋八大家之一。",p:"江西"},
{id:78,t:"王安石文集",a:"王安石",y:1070,e:"宋代",g:"诗文",ty:"文集",d:"北宋政治家兼文学家，诗文革新运动重要人物，游褒禅山记等名篇传世。",p:"江西"},
{id:79,t:"黄庭坚诗集",a:"黄庭坚",y:1090,e:"宋代",g:"诗歌",ty:"诗集",d:"江西诗派开创者，讲究'点铁成金'，与苏轼并称'苏黄'。",p:"江西"},
{id:80,t:"范仲淹文集",a:"范仲淹",y:1046,e:"宋代",g:"散文",ty:"文集",d:"岳阳楼记为千古名篇，'先天下之忧而忧后天下之乐而乐'激励无数仁人志士。",p:"江苏"},
{id:81,t:"晏殊词集",a:"晏殊",y:1020,e:"宋代",g:"词",ty:"词集",d:"北宋宰相词人，'无可奈何花落去似曾相识燕归来'意境浑然天成。",p:"江西"},
{id:82,t:"周邦彦词集",a:"周邦彦",y:1100,e:"宋代",g:"词",ty:"词集",d:"北宋词的集大成者，格律精严音韵和谐，被视为词家正宗。",p:"浙江"},
{id:83,t:"姜夔词集",a:"姜夔",y:1195,e:"宋代",g:"词",ty:"词集",d:"南宋格律派词人，'二十四桥仍在波心荡冷月无声'清空骚雅。",p:"江西"},
{id:84,t:"秦观词集",a:"秦观",y:1085,e:"宋代",g:"词",ty:"词集",d:"苏门四学士之一，'两情若是久长时又岂在朝朝暮暮'为词中名句。",p:"江苏"},
{id:85,t:"杨万里诗集",a:"杨万里",y:1180,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋四大家之一，'诚斋体'自然活泼，'小荷才露尖尖角'家喻户晓。",p:"江西"},
{id:86,t:"朱熹文集",a:"朱熹",y:1180,e:"宋代",g:"哲学",ty:"理学",d:"理学集大成者，四书集注为科举标准教材，影响中国思想史七百年。",p:"福建/江西"},
{id:87,t:"东京梦华录",a:"孟元老",y:1147,e:"宋代",g:"笔记",ty:"笔记",d:"追忆北宋汴京繁华盛景，城市生活的百科全书，珍贵的社会史料。",p:"河南"},
{id:88,t:"梦溪笔谈",a:"沈括",y:1088,e:"宋代",g:"科学",ty:"笔记",d:"北宋科学百科全书，涵盖天文数学物理化学等领域，被李约瑟称为'中国科学史里程碑'。",p:"浙江"},
{id:89,t:"文天祥诗集",a:"文天祥",y:1280,e:"宋代",g:"诗歌",ty:"诗集",d:"南宋民族英雄，正气歌过零丁洋等慷慨悲壮，'人生自古谁无死'浩然正气。",p:"江西"},
{id:90,t:"岳飞诗词",a:"岳飞",y:1140,e:"宋代",g:"词",ty:"词集",d:"南宋名将词作，满江红'怒发冲冠'壮怀激烈，千古传诵。",p:"河南"},
{id:91,t:"元好问集",a:"元好问",y:1230,e:"辽金元",g:"诗歌",ty:"诗集",d:"金代文学代表，'问世间情是何物直教生死相许'千古名句。",p:"山西"},
{id:92,t:"关汉卿杂剧",a:"关汉卿",y:1290,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之首，窦娥冤为中国古典悲剧巅峰之作，千古奇冤感天动地。",p:"北京"},
{id:93,t:"西厢记",a:"王实甫",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧巅峰之作，张生与崔莺莺的爱情故事，'愿天下有情人终成眷属'。",p:"北京"},
{id:94,t:"窦娥冤",a:"关汉卿",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧悲剧代表，窦娥含冤而死六月飞雪，揭露社会黑暗伸张正义。",p:"北京"},
{id:95,t:"马致远杂剧",a:"马致远",y:1295,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，汉宫秋等历史剧悲壮苍凉，天净沙·秋思被誉为'秋思之祖'。",p:"北京"},
{id:96,t:"赵氏孤儿",a:"纪君祥",y:1300,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元杂剧名作，程婴救孤故事，忠义精神感人，最早被译介到欧洲的中国戏剧。",p:"北京"},
{id:97,t:"白朴杂剧",a:"白朴",y:1280,e:"辽金元",g:"戏剧",ty:"杂剧",d:"元曲四大家之一，墙头马上梧桐雨等作品，文采斐然情感真挚。",p:"北京"},
{id:98,t:"张养浩散曲",a:"张养浩",y:1320,e:"辽金元",g:"散曲",ty:"散曲集",d:"元代散曲大家，山坡羊·潼关怀古'兴百姓苦亡百姓苦'千古名句。",p:"山东"},
{id:99,t:"崔颢黄鹤楼",a:"崔颢",y:740,e:"隋唐",g:"诗歌",ty:"七言诗",d:"黄鹤楼一诗传诵千古，据传李白见之亦搁笔叹'眼前有景道不得'。",p:"河南"},
{id:100,t:"李之仪词",a:"李之仪",y:1090,e:"宋代",g:"词",ty:"词集",d:"北宋词人，'我住长江头君住长江尾'朴素深情广为传唱。",p:"河北"},
{id:101,t:"西厢记诸宫调",a:"董解元",y:1200,e:"辽金元",g:"说唱",ty:"诸宫调",d:"金代说唱文学代表作，为王实甫西厢记的蓝本，保存了珍贵的音乐文学形式。",p:"北京"},
{id:102,t:"三国演义",a:"罗贯中",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部长篇历史演义小说，描写东汉末年至西晋近百年的历史风云，桃园三结义等故事家喻户晓。",p:"浙江"},
{id:103,t:"水浒传",a:"施耐庵",y:1400,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部歌颂农民起义的长篇小说，一百零八位好汉替天行道的故事流传千古。",p:"江苏"},
{id:104,t:"西游记",a:"吴承恩",y:1592,e:"明代",g:"小说",ty:"长篇小说",d:"中国古典神魔小说巅峰，唐僧师徒四人西天取经的奇幻旅程，想象力惊天动地。",p:"江苏"},
{id:105,t:"金瓶梅",a:"兰陵笑笑生",y:1610,e:"明代",g:"小说",ty:"长篇小说",d:"中国第一部由文人独立创作的长篇世情小说，深刻揭示明代社会百态，文学价值极高。",p:"山东"},
{id:106,t:"牡丹亭",a:"汤显祖",y:1598,e:"明代",g:"戏剧",ty:"传奇",d:"明代戏剧巅峰，杜丽娘因梦而死又因情复生，'情不知所起一往而深'传诵千古。",p:"江西"},

{id:198,t:"笨花",a:"铁凝",y:2006,e:"当代",g:"小说",ty:"长篇小说",d:"铁凝长篇代表作，描绘冀中平原笨花村半个世纪的变迁，乡土中国的温柔画卷。",p:"河北"},
{id:199,t:"湖光山色",a:"周大新",y:2006,e:"当代",g:"小说",ty:"长篇小说",d:"茅盾文学奖作品，以丹江口水库为背景，描绘当代农村女性命运的起伏。",p:"河南"},
{id:200,t:"主角",a:"陈彦",y:2019,e:"当代",g:"小说",ty:"长篇小说",d:"茅盾文学奖作品，讲述秦腔名伶忆秦娥半生的艺术人生，'戏如人生'的壮丽史诗。",p:"陕西"},

// === App State ===
let curEra='全部',curGenre='全部',curView='grid',searchQ='';

// === Era & Genre lists ===
const ERAS=['全部','先秦','秦汉','魏晋南北朝','隋唐','五代十国','宋代','辽金元','明代','清代','民国','当代'];
const GENRES=['全部','诗歌','小说','词','戏剧','散文','哲学','历史','辞赋','文学理论','科幻','军事','神话','地理','科技','其他'];

// === Init ===
window.addEventListener('DOMContentLoaded',()=>{
  renderStats();
  renderEraNav();
  renderGenreBtns();
  renderView();
  bindEvents();
});

function renderStats(){
  const el=document.getElementById('statsRow');
  const span=W[W.length-1].y-W[0].y;
  el.innerHTML=`
    <div class="stat"><div class="num">${W.length}</div><div class="label">部作品</div></div>
    <div class="stat"><div class="num">${ERAS.length-1}</div><div class="label">个时代</div></div>
    <div class="stat"><div class="num">${Math.abs(Math.round(span/100))}+</div><div class="label">世纪跨度</div></div>
    <div class="stat"><div class="num">${new Set(W.flatMap(w=>w.p.split('/'))).size}</div><div class="label">个地域</div></div>
  `;
}

function renderEraNav(){
  const c=document.getElementById('eraBtns');
  c.innerHTML=ERAS.map(e=>{
    const cnt=e==='全部'?W.length:W.filter(w=>w.e===e).length;
    return `<button class="era-btn${e===curEra?' active':''}" data-era="${e}">${e}<span class="count">${cnt}</span></button>`;
  }).join('');
}

function renderGenreBtns(){
  const c=document.getElementById('genreBtns');
  c.innerHTML=GENRES.map(g=>{
    return `<button class="genre-btn${g===curGenre?' active':''}" data-genre="${g}">${g}</button>`;
  }).join('');
}

function getFiltered(){
  let f=W;
  if(curEra!=='全部') f=f.filter(w=>w.e===curEra);
  if(curGenre!=='全部'){
    if(curGenre==='其他'){
      const main=['诗歌','小说','词','戏剧','散文','哲学','历史','辞赋','文学理论','科幻','军事','神话','地理','科技'];
      f=f.filter(w=>!main.includes(w.g));
    } else {
      f=f.filter(w=>w.g===curGenre);
    }
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    f=f.filter(w=>(w.t+w.a+w.d+w.e+w.g+w.p).toLowerCase().includes(q));
  }
  return f.sort((a,b)=>a.y-b.y);
}

function renderView(){
  const items=getFiltered();
  document.getElementById('resultInfo').textContent=`共 ${items.length} 部作品`;
  document.getElementById('gridView').style.display=curView==='grid'?'grid':'none';
  document.getElementById('timelineView').style.display=curView==='timeline'?'block':'none';
  const cv=document.getElementById('chartView');
  cv.classList.toggle('show',curView==='chart');
  if(curView==='grid') renderGrid(items);
  else if(curView==='timeline') renderTimeline(items);
  else renderCharts(items);
}

function renderGrid(items){
  document.getElementById('gridView').innerHTML=items.map(w=>`
    <div class="card" data-id="${w.id}">
      <div class="era-tag">${w.e}</div>
      <h3>${w.t}</h3>
      <div class="author">${w.a} · ${fmtYear(w.y)}</div>
      <div class="desc">${w.d}</div>
      <div class="meta">
        <span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span>
      </div>
    </div>
  `).join('');
}

function renderTimeline(items){
  document.getElementById('timelineView').innerHTML=items.map(w=>`
    <div class="tl-item" data-id="${w.id}">
      <div class="year">${fmtYear(w.y)} · ${w.e}</div>
      <h3>${w.t}</h3>
      <div class="author">${w.a} · ${w.g}</div>
      <div class="desc">${w.d}</div>
    </div>
  `).join('');
}

function renderCharts(items){
  const cv=document.getElementById('chartView');
  cv.innerHTML=`<div class="chart-grid">
    <div class="chart-card"><h3>时代分布</h3><canvas id="eraChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>体裁分布</h3><canvas id="genreChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>地域分布 Top 10</h3><canvas id="regionChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>时间线密度</h3><canvas id="timeChart" class="chart"></canvas></div>
  </div>`;
  requestAnimationFrame(()=>drawCharts(items));
}

function drawCharts(items){
  drawEraChart(items);
  drawGenreChart(items);
  drawRegionChart(items);
  drawTimeChart(items);
}

function drawEraChart(items){
  const c=document.getElementById('eraChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const counts={};
  ERAS.slice(1).forEach(e=>counts[e]=0);
  items.forEach(w=>{if(counts[w.e]!==undefined)counts[w.e]++});
  const entries=Object.entries(counts);
  const max=Math.max(...entries.map(e=>e[1]),1);
  const barW=W2/entries.length-8;
  const colors=['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9','#8e44ad','#1abc9c','#d35400','#2c3e50','#e74c3c','#3498db'];
  entries.forEach(([era,cnt],i)=>{
    const x=i*(barW+8)+4;
    const h=Math.max((cnt/max)*(H-60),0);
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();
    roundRect(ctx,x,H-30-h,barW,h,4);
    ctx.fill();
    ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(era.slice(0,2),x+barW/2,H-12);
    if(cnt>0){ctx.fillStyle='#333';ctx.font='bold 11px sans-serif';ctx.fillText(cnt,x+barW/2,H-34-h);}
  });
}

function drawGenreChart(items){
  const c=document.getElementById('genreChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const counts={};
  items.forEach(w=>{counts[w.g]=(counts[w.g]||0)+1});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(...entries.map(e=>e[1]),1);
  const barH=24;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c'];
  entries.forEach(([g,cnt],i)=>{
    const y=i*(barH+6)+10;
    const w2=Math.max((cnt/max)*(W2-120),0);
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();roundRect(ctx,80,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';
    ctx.fillText(g,74,y+16);
    ctx.fillStyle='#666';ctx.textAlign='left';
    ctx.fillText(cnt,86+w2,y+16);
  });
}

function drawRegionChart(items){
  const c=document.getElementById('regionChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const counts={};
  items.forEach(w=>{w.p.split('/').forEach(p=>{counts[p]=(counts[p]||0)+1})});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const max=Math.max(...entries.map(e=>e[1]),1);
  const barH=22;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c','#2c3e50','#d35400'];
  entries.forEach(([p,cnt],i)=>{
    const y=i*(barH+5)+10;
    const w2=Math.max((cnt/max)*(W2-100),0);
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();roundRect(ctx,70,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';
    ctx.fillText(p,64,y+15);
    ctx.fillStyle='#666';ctx.textAlign='left';
    ctx.fillText(cnt,76+w2,y+15);
  });
}

function drawTimeChart(items){
  const c=document.getElementById('timeChart');
  if(!c) return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const sorted=[...items].sort((a,b)=>a.y-b.y);
  if(!sorted.length) return;
  const minY=sorted[0].y,maxY=sorted[sorted.length-1].y;
  const range=maxY-minY||1;
  // Background line
  ctx.strokeStyle='#eee';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(40,H-30);ctx.lineTo(W2-10,H-30);ctx.stroke();
  // Era bands
  const eraColors={'先秦':'#c0392b','秦汉':'#e67e22','魏晋南北朝':'#f1c40f','隋唐':'#27ae60','五代十国':'#2980b9','宋代':'#8e44ad','辽金元':'#1abc9c','明代':'#d35400','清代':'#2c3e50','民国':'#e74c3c','当代':'#3498db'};
  let lastEra='';
  sorted.forEach((w,i)=>{
    const x=40+(w.y-minY)/range*(W2-60);
    const color=eraColors[w.e]||'#999';
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(x,H-30-8-Math.random()*80,3,0,Math.PI*2);ctx.fill();
  });
  // Axis labels
  ctx.fillStyle='#999';ctx.font='10px sans-serif';ctx.textAlign='center';
  [sorted[0],sorted[Math.floor(sorted.length/2)],sorted[sorted.length-1]].forEach(w=>{
    const x=40+(w.y-minY)/range*(W2-60);
    ctx.fillText(fmtYear(w.y),x,H-14);
  });
}

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,Math.max(w,0)/2,Math.max(h,0)/2);
  if(w<=0||h<=0) return;
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}

function fmtYear(y){
  if(y<0) return '公元前'+Math.abs(y)+'年';
  return y+'年';
}

function showModal(id){
  const w=W.find(x=>x.id===id);
  if(!w) return;
  document.getElementById('modalBody').innerHTML=`
    <h2>${w.t}</h2>
    <div class="m-author">${w.a} · ${fmtYear(w.y)}</div>
    <div class="m-desc">${w.d}</div>
    <div class="m-tags">
      <span>${w.e}</span><span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function bindEvents(){
  // Era nav
  document.getElementById('eraBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.era-btn');
    if(!btn) return;
    curEra=btn.dataset.era;
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // Genre
  document.getElementById('genreBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.genre-btn');
    if(!btn) return;
    curGenre=btn.dataset.genre;
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // View toggle
  document.querySelectorAll('.view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      curView=btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    });
  });
  // Search
  document.getElementById('searchInput').addEventListener('input',e=>{
    searchQ=e.target.value;
    renderView();
  });
  // Card click
  document.getElementById('gridView').addEventListener('click',e=>{
    const card=e.target.closest('.card');
    if(card) showModal(+card.dataset.id);
  });
  document.getElementById('timelineView').addEventListener('click',e=>{
    const item=e.target.closest('.tl-item');
    if(item) showModal(+item.dataset.id);
  });
  // Modal close
  document.getElementById('modalClose').addEventListener('click',()=>{
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalOverlay').addEventListener('click',e=>{
    if(e.target===e.currentTarget) e.currentTarget.classList.remove('show');
  });
  // Scroll top
  const st=document.getElementById('scrollTop');
  window.addEventListener('scroll',()=>{
    st.classList.toggle('show',window.scrollY>400);
    document.getElementById('eraNav').classList.toggle('scrolled',window.scrollY>100);
  });
  st.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('show');
    if(e.key==='/'&&!e.ctrlKey){e.preventDefault();document.getElementById('searchInput').focus();}
  });
}
</script>
</body>
</html>
