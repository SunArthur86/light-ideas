183:{in:"《受活》是阎连科长篇小说，以受活庄一群残疾人为主角，讲述他们在商品经济浪潮中的荒诞经历。以狂欢化的叙事和方言写作，展现了中国农村在现代化进程中的荒诞现实。",th:"荒诞现实中的狂欢叙事。以残疾群体的命运折射时代的荒谬与人性的复杂。",ex:"受活庄——一个聚居着各种残疾人的村庄，在茅枝婆的带领下过着与世隔绝的生活。\n\n柳县长——异想天开，要买下列宁遗体发展旅游，带领受活庄的残疾人组成绝术团巡回演出。\n\n绝术团——瞎子说书、瘸子跳舞、聋子奏乐，以残缺之身创造惊人奇迹。\n\n一场狂欢过后，一切回到原点——受活庄的人们发现，外面的世界比他们想象的更加荒诞。\n\n荒诞的不是一个村庄，而是这个时代。\n\n苦难本身就是一种修行，受活即是忍受活着。"},
184:{in:"《格非江南三部曲》包括人面桃花、山河入梦、春尽江南，以一百年的时间跨度讲述江南陆家三代人的命运。以精致的语言和复杂的叙事结构，展现了二十世纪中国知识分子的精神历程。",th:"江南百年的精神史诗。在三代人的命运中追寻理想主义的光芒与失落。",ex:"人面桃花——秀米从闺阁少女到革命者，在江南的桃花和鲜血中走向理想。\n\n山河入梦——谭功达继承了母亲的理想，在新中国建设中寻找乌托邦。\n\n春尽江南——端午在当代社会中感到一切都在凋零，诗意的消逝比死亡更令人悲伤。\n\n从清末到当代，江南的烟雨中走过三代追梦人。\n\n理想主义是一把双刃剑——它照亮了前路，也灼伤了持它的人。\n\n格非以精密如织锦的语言，编织了一部江南百年的精神史诗。"},
185:{in:"《秋园》是杨本芬创作的自传体小说，以母亲的视角讲述了中国农村女性跨越近百年的坎坷命运。以朴素真挚的文字记录了一个普通女人的坚韧一生，感动了无数读者。",th:"普通女性的百年命运。以朴素的文字记录母亲坚韧的一生，平凡中的伟大。",ex:"秋园——一个出生在1914年的中国农村女性，经历了饥荒、丧子、流离失所。\n\n她裹过小脚，上过学堂，嫁过人，逃过荒，在饥荒年代靠挖野菜养活孩子。\n\n我写母亲，不是因为她是伟人，而是因为她是一个普通人。普通人的苦难最容易被遗忘。\n\n杨本芬在厨房的矮凳上，以八十岁的高龄写下了母亲的故事。\n\n厨房里的写作——灶台边、油烟中，一个女儿为母亲立传。\n\n秋园的一生，就是无数中国女性一生的缩影。"},
186:{in:"《人世间》是梁晓声创作的长篇小说，以东北城市平民社区光字片为背景，讲述周家三兄妹在近五十年社会变迁中的命运浮沉。以厚重写实的笔触描绘了中国底层人民的坚韧与温情。",th:"中国平民的史诗。在时代变迁中展现底层人民的坚韧、善良与相互扶持。",ex:"周秉昆——周家最小的儿子，留在光字片照顾父母，过着最平凡却最踏实的生活。\n\n周秉义——大哥，从知青到高官，一生在理想与现实之间挣扎。\n\n周蓉——姐姐，为追求爱情远走他乡，经历了人生的悲欢离合。\n\n光字片——一个平民聚居区，狭窄的街巷里住着最普通的人家，却有着最真挚的邻里情。\n\n人世间最珍贵的，是那些在苦难中不离不弃的人。\n\n人间值得，因为有爱。"},
187:{in:"《北上》是徐则臣创作的长篇小说，以京杭大运河为线索，讲述从清末到当代跨越百年的运河故事。以运河为纽带串联起中外人物的命运交汇，是一部关于运河的文化史诗。",th:"大运河的百年传奇。以水为纽带串联起历史与现实，运河上的中国故事。",ex:"京杭大运河——世界上最长的人工运河，两千年来流淌着中国的经济命脉和文化记忆。\n\n谢平遥——清末的运河学者，沿河北上，记录大运河最后的辉煌。\n\n小波罗——意大利摄影师，用镜头记录了清末运河沿岸的风土人情。\n\n运河上的人家——船工、渔民、商人、官员，大运河养育了一代又一代人。\n\n水在流，人在走，历史在运河上缓缓展开。\n\n北上，是方向，也是追寻。"},
188:{in:"《长安的荔枝》是马伯庸创作的历史小说，以唐朝为背景，讲述小吏李善德如何在限定时间内将新鲜荔枝从岭南运到长安。以精密的历史考证和紧张的叙事节奏，展现了一个小人物在历史洪流中的挣扎。",th:"小人物的大历史。在精密的历史考证中展现唐代官僚体系的运作和底层公务员的辛酸。",ex:"一骑红尘妃子笑，无人知是荔枝来——为了杨贵妃能吃到新鲜荔枝，多少人付出了生命的代价。\n\n李善德——九品小吏，接下了一个不可能完成的任务：在十一天内将岭南的鲜荔枝运到长安。\n\n荔枝保鲜术——从冰块降温到竹筒密封，李善德穷尽一切方法。\n\n五千里路，十一日之限，荔枝一日色变，二日香变，三日味变。\n\n做官难，做小官更难。在庞大官僚体系中，一个小人物的挣扎与智慧。\n\n历史不是王侯将相的专利，小人物也有自己的史诗。"},
189:{in:"《风声》是麦家创作的长篇小说，以抗战时期为背景，讲述代号老鬼的共产党情报员在日军围困中传递情报的惊险故事。以密室推理的结构和紧张的谍战叙事著称。",th:"密室中的谍战传奇。在极端困境中展现信仰的力量和智慧的极限。",ex:"老鬼——一个隐藏在伪军司令部内部的共产党情报员，身份成谜。\n\n裘庄——一座被日军封锁的庄园，嫌疑人们被困其中，互相猜忌。\n\n谁能是老鬼？——吴志国、金生火、李宁玉、顾小梦，每个人都有嫌疑，每个人都有秘密。\n\n情报——一份关乎无数人生命的情报，必须在日军的眼皮底下传递出去。\n\n信仰让一个人可以在绝境中保持冷静。\n\n真相只有一个，但迷雾重重，直到最后一刻才揭晓。"},
190:{in:"《红旗谱》是梁斌创作的长篇小说，以冀中平原为背景，讲述朱老忠等农民从自发反抗到在中国共产党领导下开展革命斗争的故事。是红色经典的代表作。",th:"农民革命的史诗叙事。从自发反抗到有组织的斗争，觉醒中的中国农民。",ex:"朱老忠——冀中平原上的硬汉子，父亲被恶霸冯老兰逼死，他立誓报仇。\n\n朱老忠从闯关东到回到锁井镇，从个人复仇到参与革命，完成了一个农民的觉醒。\n\n反割头税——农民们团结起来，反抗恶霸地主的苛捐杂税。\n\n运涛和江涛——朱老忠的儿子们，在革命中成长为新的一代。\n\n红旗——革命的旗帜在冀中平原上飘扬，指引着农民们走向光明。\n\n土地是农民的命，革命是农民的出路。"},
191:{in:"《创业史》是柳青创作的长篇小说，以陕西下堡乡蛤蟆滩为背景，讲述农业合作化运动中农民的思想变化和道路选择。以深切的乡土体验和细腻的人物刻画著称。",th:"农业合作化中的乡村变革。在土地与理想之间，中国农民的艰难抉择。",ex:"梁生宝——蛤蟆滩的青年农民，响应号召组织互助组，带领大家走合作化道路。\n\n梁三老汉——梁生宝的继父，代表老一辈农民的保守与固执。\n\n蛤蟆滩——一个普通的陕西村庄，在合作化浪潮中经历着深刻的变革。\n\n柳青在长安县皇甫村住了十四年，以亲身经历写出了这部中国农村变革的史诗。\n\n创业难，守业更难。农村的社会主义改造是一场深刻的革命。"},
192:{in:"《南渡记》是宗璞创作的长篇小说，以抗日战争时期北平知识分子南迁为背景，讲述知识分子在国破家亡之际的抉择与坚守。是宗璞野葫芦引系列的第一部。",th:"战火中的知识分子群像。在民族危亡之际展现知识分子的气节与担当。",ex:"北平沦陷——1937年，北平的知识分子面临抉择：留下做亡国奴，还是南迁继续抗战。\n\n孟樾——哲学教授，带领家人南迁昆明，在西南联大继续教学。\n\n吕清非——老学者，宁死不与日伪合作，以死殉国。\n\n南渡——如同历史上晋室南渡、宋室南渡，这一次又是知识分子的大迁徙。\n\n弦歌不辍——西南联大的教授们在茅草屋中继续教书，用知识保卫文明。\n\n在战火中守护文化的火种，这就是知识分子的使命。"},
193:{in:"《白鹿原》是陈忠实创作的长篇小说，以陕西白鹿原上白嘉轩和鹿子霖两个家族的恩怨纠葛为主线。是民族的秘史，展现了从清末到建国五十年间中国农村的历史巨变。",th:"民族的秘史与土地的记忆。在家族恩怨中展现中国农村的沧桑巨变与人性挣扎。",ex:"白嘉轩后来引以豪壮的是一生里娶过七回女人。\n\n白鹿原上的白家和鹿家——两个家族半个世纪的恩怨纠葛，就是一部中国农村的近代史。\n\n白嘉轩——白家族长，一生正直刚硬，腰杆笔直，代表着传统乡土伦理。\n\n鹿子霖——鹿家族长，精明圆滑，在权力欲望中迷失自我。\n\n黑娃——长工之子，从叛逆到回归，浪子回头却被处决。\n\n朱先生——白鹿原上最后一个圣人，以其智慧看透了时代的风云。\n\n田小娥——一个被侮辱与被损害的女性，她的悲剧控诉了封建礼教。\n\n白鹿原啊白鹿原，你见证了多少悲欢离合。"},
194:{in:"《面朝大海春暖花开》是海子创作的著名诗篇，以朴素的语言描绘了一幅理想生活的美好图景。从明天起，做一个幸福的人——这简单而美好的愿望打动了无数人的心。",th:"最朴素的人生理想。在简单的文字中蕴含对幸福的渴望与对世界的祝福。",ex:"从明天起，做一个幸福的人，喂马、劈柴，周游世界。从明天起，关心粮食和蔬菜。我有一所房子，面朝大海，春暖花开。\n\n从明天起，和每一个亲人通信，告诉他们我的幸福，那幸福的闪电告诉我的，我将告诉每一个人。\n\n给每一条河每一座山取一个温暖的名字。\n\n陌生人，我也为你祝福：愿你有一个灿烂的前程，愿你有情人终成眷属，愿你在尘世获得幸福。\n\n我只愿面朝大海，春暖花开。\n\n这首诗写于1989年1月13日，两个月后海子离开了这个世界。"},
195:{in:"《致橡树》是舒婷创作的诗歌，以橡树和木棉树为意象，表达了独立平等的现代爱情观。如果爱你——绝不像攀援的凌霄花，要作为树的形象和你站在一起，成为新时期女性文学的代表作。",th:"独立平等的现代爱情观。以树的形象表达女性在爱情中的独立与尊严。",ex:"我如果爱你——绝不像攀援的凌霄花，借你的高枝炫耀自己；我如果爱你——绝不学痴情的鸟儿，为绿荫重复单调的歌曲。\n\n我必须是你近旁的一株木棉，作为树的形象和你站在一起。根，紧握在地下；叶，相触在云里。\n\n每一阵风过，我们都互相致意，但没有人，听懂我们的言语。\n\n你有你的铜枝铁干，像刀，像剑，也像戟；我有我红硕的花朵，像沉重的叹息，又像英勇的火炬。\n\n我们分担寒潮、风雷、霹雳；我们共享雾霭、流岚、虹霓。\n\n仿佛永远分离，却又终身相依。这才是伟大的爱情。"},
196:{in:"《西藏组诗》是当代诗人以西藏为主题的诗歌合集，以雪域高原的壮美和藏族文化的神秘为灵感源泉。高原的阳光、经幡、转经筒、雪山构成了一幅幅令人震撼的精神图景。",th:"雪域高原的精神图景。在壮美与苍凉中感受生命的纯净与信仰的力量。",ex:"西藏——离天空最近的地方，空气稀薄却心灵丰盈。\n\n经幡在风中猎猎作响——五种颜色代表五大元素，每一次翻飞都是一次祈祷。\n\n转经筒——藏族老人绕着大昭寺转了一圈又一圈，信仰在脚步中积累。\n\n雪山——冈仁波齐在阳光下闪耀，那是朝圣者心中的圣殿。\n\n高原的阳光直射大地，没有一丝尘埃，连影子都格外清晰。\n\n在海拔五千米的地方，人的呼吸变得困难，但思想变得清晰。\n\n西藏不是一个地方，而是一种境界。"},
197:{in:"《九月寓言》是张炜创作的长篇小说，以一个海边村庄为背景，讲述村民们在土地上生生不息的故事。以诗性的语言和寓言般的叙事，展现了中国乡村文明的深沉力量。",th:"土地上的生命寓言。在诗性叙事中歌颂乡村文明的韧劲与生命力。",ex:"九月，海边的村庄，空气里弥漫着盐和鱼腥的味道。\n\n土地——村民们世世代代在这片土地上耕作、生活、繁衍，土地就是他们的全部。\n\n大海——无垠的大海既是馈赠，也是威胁。渔民们敬畏大海，依赖大海。\n\n故事——村庄里的故事就像地里的庄稼，一茬接一茬，永远讲不完。\n\n寓言——在看似平常的乡村生活中，蕴含着关于生命、死亡、爱情和信仰的深刻寓言。\n\n张炜以诗人的笔触写出了一个村庄的精神史诗。"},
198:{in:"《笨花》是铁凝创作的长篇小说，以冀中平原笨花村为背景，讲述了从清末到抗战胜利半个世纪的故事。以细腻的笔触描绘了中国乡村在时代巨变中的日常生活与精神世界。",th:"乡村日常中的时代巨变。在细腻平实的叙事中展现中国农民的智慧与坚韧。",ex:"笨花村——冀中平原上一个普通的村庄，因种棉花而得名。\n\n向喜——笨花村的农民，从种棉花到参加抗战，一生与土地和时代纠缠。\n\n棉花——白色的棉花是笨花村的命脉，也是这片土地上人们纯朴品质的象征。\n\n铁凝以女性特有的细腻，写出了一个村庄的喜怒哀乐。\n\n笨花虽笨，却是最实在的花——就像这里的人们，朴实无华却坚韧不拔。\n\n半个世纪的风云，在笨花村的日常中缓缓展开。"},
199:{in:"《湖光山色》是周大新创作的长篇小说，以丹江湖畔的楚王庄为背景，讲述女主人公暖暖从城市回到农村创业的故事。以当代农村的现实问题为题材，展现了新农村建设中的希望与困境。",th:"新农村建设的现实叙事。在城乡之间寻找出路，当代中国农村的希望与挑战。",ex:"丹江湖——碧波万顷的丹江湖畔，楚王庄依山傍水，风景如画。\n\n暖暖——从城市打工归来的年轻女性，决心在家乡开创一番事业。\n\n楚长城遗址——古老的楚文化遗迹，既是旅游资源，也是历史的见证。\n\n新农村——年轻人回来了，带来了新的观念和新的希望。\n\n湖光山色之间，是中国农村正在经历的一场深刻变革。\n\n山水不会说话，但它们见证了一切。\n\n在家乡的土地上，每个人都能找到属于自己的位置。"},
200:{in:"《主角》是陈彦茅盾文学奖作品，讲述秦腔名伶忆秦娥半生的艺术人生。以戏曲人的命运折射时代变迁，戏如人生人生如戏。从舞台到人生，一个女性在艺术与现实之间的坚守与挣扎。",th:"戏曲人生的壮丽篇章。以一个秦腔演员的命运折射半个世纪的时代变迁。",ex:"忆秦娥——一个从农村走出来的秦腔演员，从跑龙套到成为名角，半生都在戏里戏外挣扎。\n\n秦腔——黄土地上最嘹亮的声音。一声吼，便是千年的沧桑。\n\n戏演到深处，才知人生如戏，戏如人生。\n\n舞台上的主角，走下舞台未必还是主角。\n\n忆秦娥经历了文革、改革开放、市场经济的大潮，始终没有放弃对秦腔的热爱。\n\n在秦腔的唱腔里，有黄土高原的风沙，有西北人民的坚韧。\n\n一个好演员，是把灵魂都献给舞台的人。"}
};

// ===== App State =====
let curEra='全部',curGenre='全部',curView='grid',searchQ='',curDtab='picks',tagFilter='';
let bookmarks=JSON.parse(localStorage.getItem('cl_bm')||'[]');
let readList=JSON.parse(localStorage.getItem('cl_read')||'[]');
let shuffleMode=false;

const ERAS=['全部','先秦','秦汉','魏晋南北朝','隋唐','五代十国','宋代','辽金元','明代','清代','民国','当代'];
const GENRES=['全部','诗歌','小说','词','戏剧','散文','哲学','历史','辞赋','文学理论','科幻','军事','神话','地理','科技','其他'];

// ===== Color palette by era =====
const ERA_COLORS={'先秦':'#c0392b','秦汉':'#e67e22','魏晋南北朝':'#f1c40f','隋唐':'#27ae60','五代十国':'#2980b9','宋代':'#8e44ad','辽金元':'#1abc9c','明代':'#d35400','清代':'#2c3e50','民国':'#e74c3c','当代':'#3498db'};
const GENRE_ICONS={'诗歌':'📜','小说':'📖','词':'🎵','戏剧':'🎭','散文':'✍️','哲学':'💭','历史':'🏛️','辞赋':'🖋️','文学理论':'📐','科幻':'🚀','军事':'⚔️','神话':'🐉','地理':'🗺️','科技':'⚙️'};

// ===== Score system for recommendations =====
function getScore(w){
  let s=0;
  // Masterpieces get higher scores
  if([4,5,6,22,36,46,47,48,49,50,72,73,74,92,93,102,103,104,106,116,117,118,136,140,142,152,153,154,155,158].includes(w.id)) s+=3;
  // Has extended content
  if(EXT[w.id]) s+=2;
  // Not read yet
  if(!readList.includes(w.id)) s+=1;
  return s;
}

// ===== Seed-based random (for "daily" picks) =====
function seededRandom(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}
function getDailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}

// ===== Init =====
window.addEventListener('DOMContentLoaded',()=>{
  renderStats();
  renderEraNav();
  renderGenreBtns();
  renderDiscover('picks');
  renderTagCloud();
  renderView();
  bindEvents();
});

// ===== Render Stats =====
function renderStats(){
  const el=document.getElementById('statsRow');
  const span=W[W.length-1].y-W[0].y;
  el.innerHTML=`
    <div class="stat"><div class="num">${W.length}</div><div class="label">部作品</div></div>
    <div class="stat"><div class="num">${ERAS.length-1}</div><div class="label">个时代</div></div>
    <div class="stat"><div class="num">${Math.abs(Math.round(span/100))}+</div><div class="label">世纪跨度</div></div>
    <div class="stat"><div class="num">${new Set(W.flatMap(w=>w.p.split('/'))).size}</div><div class="label">个地域</div></div>
  `;
}

// ===== Discover Section =====
function renderDiscover(tab){
  curDtab=tab;
  const c=document.getElementById('discoverCards');
  let items=[];

  if(tab==='picks'){
    // Daily picks: use date seed to pick 6 diverse works
    const seed=getDailySeed();
    const scored=W.map(w=>({...w,score:getScore(w)+seededRandom(seed+w.id)*2})).sort((a,b)=>b.score-a.score);
    items=scored.slice(0,6);
  } else if(tab==='random'){
    // Random 6
    const shuffled=[...W].sort(()=>Math.random()-.5);
    items=shuffled.slice(0,6);
  } else if(tab==='bookmarks'){
    items=W.filter(w=>bookmarks.includes(w.id));
    if(!items.length){c.innerHTML='<div style="padding:20px;text-align:center;color:#999">还没有收藏，点击卡片上的 ⭐ 收藏喜欢的作品</div>';return;}
  } else if(tab==='unread'){
    items=W.filter(w=>!readList.includes(w.id));
    if(!items.length){c.innerHTML='<div style="padding:20px;text-align:center;color:#999">所有作品都已标记为已读 🎉</div>';return;}
    items=items.sort(()=>Math.random()-.5).slice(0,8);
  }

  c.innerHTML=items.map(w=>{
    const color=ERA_COLORS[w.e]||'#999';
    const icon=GENRE_ICONS[w.g]||'📄';
    return `<div class="dcard" data-id="${w.id}">
      <div class="dcard-color" style="background:${color}"></div>
      <div class="dcard-body">
        <h4>${icon} ${w.t}</h4>
        <div class="dca">${w.a} · ${fmtYear(w.y)}</div>
        <div class="dcd">${w.d}</div>
      </div>
      <div class="dcbadge" style="background:${color}">${w.e}</div>
    </div>`;
  }).join('');
}

// ===== Tag Cloud =====
function renderTagCloud(){
  const tags=['必读经典','诗词巅峰','哲理深邃','爱情名篇','战争史诗','讽刺批判','田园隐逸','市井百态','家国情怀','奇幻想象','茅盾文学奖','先秦诸子','唐宋八大家','诺贝尔奖'];
  const tagMap={'必读经典':[4,5,6,22,36,46,48,49,50,72,102,103,104,116,136,153,158],'诗词巅峰':[1,3,47,48,49,50,53,55,56,72,73,74],'哲理深邃':[4,5,6,12,14,86,165],'爱情名篇':[31,40,41,55,56,93,106,128,140],'战争史诗':[10,22,92,102,103,142,158],'讽刺批判':[65,117,118,125,126,136,142],'田园隐逸':[36,44,45,51,52],'市井百态':[109,110,169,179],'家国情怀':[28,75,80,89,90,154],'奇幻想象':[11,104,107,123,158],'茅盾文学奖':[139,154,155,157,160,167,168,169,173,180,184,186,187,199,200],'先秦诸子':[4,5,6,7,14,15,16,17,21],'唐宋八大家':[57,58,72,77,78,80,79,62],'诺贝尔奖':[156,157,158]};
  const c=document.getElementById('tagCloud');
  c.innerHTML=tags.map(t=>{
    const cnt=tagMap[t]?tagMap[t].length:0;
    return `<span class="tag-chip${tagFilter===t?' active':''}" data-tag="${t}" data-ids="${(tagMap[t]||[]).join(',')}">${t} (${cnt})</span>`;
  }).join('');
}

// ===== Era Nav =====
function renderEraNav(){
  const c=document.getElementById('eraBtns');
  c.innerHTML=ERAS.map(e=>{
    const cnt=e==='全部'?W.length:W.filter(w=>w.e===e).length;
    return `<button class="era-btn${e===curEra?' active':''}" data-era="${e}">${e}<span class="count">${cnt}</span></button>`;
  }).join('');
}

function renderGenreBtns(){
  const c=document.getElementById('genreBtns');
  c.innerHTML=GENRES.map(g=>{
    return `<button class="genre-btn${g===curGenre?' active':''}" data-genre="${g}">${g}</button>`;
  }).join('');
}

// ===== Filter =====
function getFiltered(){
  let f=W;
  if(curEra!=='全部') f=f.filter(w=>w.e===curEra);
  if(curGenre!=='全部'){
    if(curGenre==='其他'){
      const main=['诗歌','小说','词','戏剧','散文','哲学','历史','辞赋','文学理论','科幻','军事','神话','地理','科技'];
      f=f.filter(w=>!main.includes(w.g));
    } else {
      f=f.filter(w=>w.g===curGenre);
    }
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    f=f.filter(w=>(w.t+w.a+w.d+w.e+w.g+w.p).toLowerCase().includes(q));
  }
  if(tagFilter){
    const chip=document.querySelector(`.tag-chip[data-tag="${tagFilter}"]`);
    if(chip){
      const ids=chip.dataset.ids.split(',').map(Number);
      f=f.filter(w=>ids.includes(w.id));
    }
  }
  if(shuffleMode) return f.sort(()=>Math.random()-.5);
  return f.sort((a,b)=>a.y-b.y);
}

// ===== Render View =====
function renderView(){
  const items=getFiltered();
  const info=document.getElementById('resultInfo');
  info.innerHTML=`共 <strong>${items.length}</strong> 部作品` + (tagFilter?` · 标签: ${tagFilter}`:'') + (shuffleMode?' · 随机排序':'');

  document.getElementById('gridView').style.display=curView==='grid'?'grid':'none';
  document.getElementById('timelineView').style.display=curView==='timeline'?'block':'none';
  const cv=document.getElementById('chartView');
  cv.classList.toggle('show',curView==='chart');

  if(curView==='grid') renderGrid(items);
  else if(curView==='timeline') renderTimeline(items);
  else renderCharts(items);
}

function renderGrid(items){
  document.getElementById('gridView').innerHTML=items.map(w=>{
    const ext=EXT[w.id]||{};
    const excerpt=ext.ex?ext.ex.split('\\n')[0]:'';
    const isBM=bookmarks.includes(w.id);
    const isRead=readList.includes(w.id);
    const icon=GENRE_ICONS[w.g]||'📄';
    return `
    <div class="card" data-id="${w.id}">
      ${isRead?'<div class="read-badge">✓ 已读</div>':''}
      <span class="card-bookmark${isBM?' bookmarked':''}" data-bid="${w.id}" title="${isBM?'取消收藏':'收藏'}">⭐</span>
      <div class="era-tag">${w.e}</div>
      <h3>${icon} ${w.t}</h3>
      <div class="author">${w.a} · ${fmtYear(w.y)}</div>
      <div class="desc">${w.d}</div>
      ${excerpt?`<div class="card-excerpt">「${excerpt}」</div>`:''}
      <div class="meta">
        <span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span>
      </div>
    </div>
  `}).join('');
}

function renderTimeline(items){
  document.getElementById('timelineView').innerHTML=items.map(w=>`
    <div class="tl-item" data-id="${w.id}">
      <div class="year">${fmtYear(w.y)} · ${w.e}</div>
      <h3>${w.t}</h3>
      <div class="author">${w.a} · ${w.g}</div>
      <div class="desc">${w.d}</div>
    </div>
  `).join('');
}

// ===== Charts =====
function renderCharts(items){
  const cv=document.getElementById('chartView');
  cv.innerHTML=`<div class="chart-grid">
    <div class="chart-card"><h3>📊 时代分布</h3><canvas id="eraChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 体裁分布</h3><canvas id="genreChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 地域分布 Top 10</h3><canvas id="regionChart" class="chart"></canvas></div>
    <div class="chart-card"><h3>📊 时间线密度</h3><canvas id="timeChart" class="chart"></canvas></div>
  </div>`;
  requestAnimationFrame(()=>drawCharts(items));
}

function drawCharts(items){drawEraChart(items);drawGenreChart(items);drawRegionChart(items);drawTimeChart(items)}

function drawEraChart(items){
  const c=document.getElementById('eraChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  ERAS.slice(1).forEach(e=>counts[e]=0);
  items.forEach(w=>{if(counts[w.e]!==undefined)counts[w.e]++});
  const entries=Object.entries(counts);const max=Math.max(...entries.map(e=>e[1]),1);
  const barW=W2/entries.length-8;
  entries.forEach(([era,cnt],i)=>{
    const x=i*(barW+8)+4;const h=Math.max((cnt/max)*(H-60),0);
    ctx.fillStyle=ERA_COLORS[era]||'#999';
    ctx.beginPath();roundRect(ctx,x,H-30-h,barW,h,4);ctx.fill();
    ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(era.slice(0,2),x+barW/2,H-12);
    if(cnt>0){ctx.fillStyle='#333';ctx.font='bold 11px sans-serif';ctx.fillText(cnt,x+barW/2,H-34-h)}
  });
}

function drawGenreChart(items){
  const c=document.getElementById('genreChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  items.forEach(w=>{counts[w.g]=(counts[w.g]||0)+1});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(...entries.map(e=>e[1]),1);const barH=24;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c'];
  entries.forEach(([g,cnt],i)=>{
    const y=i*(barH+6)+10;const w2=Math.max((cnt/max)*(W2-120),0);
    ctx.fillStyle=colors[i%colors.length];ctx.beginPath();roundRect(ctx,80,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(g,74,y+16);
    ctx.fillStyle='#666';ctx.textAlign='left';ctx.fillText(cnt,86+w2,y+16);
  });
}

function drawRegionChart(items){
  const c=document.getElementById('regionChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;const counts={};
  items.forEach(w=>{w.p.split('/').forEach(p=>{counts[p]=(counts[p]||0)+1})});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const max=Math.max(...entries.map(e=>e[1]),1);const barH=22;
  const colors=['#c0392b','#e74c3c','#e67e22','#f39c12','#27ae60','#2980b9','#8e44ad','#1abc9c','#2c3e50','#d35400'];
  entries.forEach(([p,cnt],i)=>{
    const y=i*(barH+5)+10;const w2=Math.max((cnt/max)*(W2-100),0);
    ctx.fillStyle=colors[i%colors.length];ctx.beginPath();roundRect(ctx,70,y,w2,barH,4);ctx.fill();
    ctx.fillStyle='#333';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(p,64,y+15);
    ctx.fillStyle='#666';ctx.textAlign='left';ctx.fillText(cnt,76+w2,y+15);
  });
}

function drawTimeChart(items){
  const c=document.getElementById('timeChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=260*dpr;ctx.scale(dpr,dpr);
  const W2=c.offsetWidth,H=260;
  const sorted=[...items].sort((a,b)=>a.y-b.y);if(!sorted.length)return;
  const minY=sorted[0].y,maxY=sorted[sorted.length-1].y;const range=maxY-minY||1;
  ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,H-30);ctx.lineTo(W2-10,H-30);ctx.stroke();
  sorted.forEach((w,i)=>{
    const x=40+(w.y-minY)/range*(W2-60);
    ctx.fillStyle=ERA_COLORS[w.e]||'#999';
    ctx.beginPath();ctx.arc(x,H-30-8-Math.random()*80,3,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#999';ctx.font='10px sans-serif';ctx.textAlign='center';
  [sorted[0],sorted[Math.floor(sorted.length/2)],sorted[sorted.length-1]].forEach(w=>{
    const x=40+(w.y-minY)/range*(W2-60);ctx.fillText(fmtYear(w.y),x,H-14);
  });
}

// ===== Utility =====
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,Math.max(w,0)/2,Math.max(h,0)/2);if(w<=0||h<=0)return;
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}
function fmtYear(y){return y<0?'公元前'+Math.abs(y)+'年':y+'年'}

// ===== Related recommendations =====
function getRelated(w){
  // Same era, same genre, or related authors
  return W.filter(x=>x.id!==w.id).map(x=>{
    let score=0;
    if(x.e===w.e) score+=2;
    if(x.g===w.g) score+=3;
    if(x.a===w.a) score+=2;
    if(x.p===w.p) score+=1;
    return {...x,score};
  }).sort((a,b)=>b.score-a.score).slice(0,4);
}

// ===== Modal =====
function showModal(id){
  const w=W.find(x=>x.id===id);if(!w)return;
  const ext=EXT[id]||{};
  const isBM=bookmarks.includes(w.id);
  const isRead=readList.includes(w.id);
  const related=getRelated(w);
  const color=ERA_COLORS[w.e]||'#999';
  const introHtml=ext.in?`<div class="m-section"><div class="m-section-title">📖 作品简介</div><div class="m-intro">${ext.in}</div></div>`:'';
  const thoughtHtml=ext.th?`<div class="m-section"><div class="m-section-title">💡 主要思想</div><div class="m-thought">${ext.th}</div></div>`:'';
  const excerptHtml=ext.ex?`<div class="m-section"><div class="m-section-title">✨ 精选摘录</div><div class="m-excerpt">${ext.ex.replace(/\n/g,'<br>')}</div></div>`:'';
  const relatedHtml=related.length?`<div class="m-related"><div class="m-related-title">🔗 相关推荐</div><div class="m-related-grid">${related.map(r=>`<div class="m-related-item" data-rid="${r.id}"><h5>${r.t}</h5><div class="mri-a">${r.a}</div><div class="mri-e">${r.e} · ${r.g}</div></div>`).join('')}</div></div>`:'';

  document.getElementById('modalBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="width:4px;height:32px;background:${color};border-radius:2px"></div>
      <div><h2>${w.t}</h2><div class="m-author">${w.a} · ${fmtYear(w.y)}</div></div>
    </div>
    <div class="m-desc">${w.d}</div>
    <div class="m-tags"><span>${w.e}</span><span>${w.g}</span><span>${w.ty}</span><span>${w.p}</span></div>
    <div class="m-actions">
      <button class="${isBM?'primary':''}" id="modalBM" data-mid="${w.id}">${isBM?'⭐ 已收藏':'☆ 收藏'}</button>
      <button class="${isRead?'primary':''}" id="modalRead" data-mid="${w.id}">${isRead?'✓ 已读':'📖 标记已读'}</button>
    </div>
    ${introHtml}${thoughtHtml}${excerptHtml}${relatedHtml}
  `;
  document.getElementById('modalOverlay').classList.add('show');

  // Bind modal bookmark
  document.getElementById('modalBM').addEventListener('click',function(){
    toggleBookmark(+this.dataset.mid);
    showModal(+this.dataset.mid); // re-render
  });
  document.getElementById('modalRead').addEventListener('click',function(){
    toggleRead(+this.dataset.mid);
    showModal(+this.dataset.mid); // re-render
  });
  // Related item click
  document.querySelectorAll('.m-related-item').forEach(el=>{
    el.addEventListener('click',()=>showModal(+el.dataset.rid));
  });
}

// ===== Bookmark & Read =====
function toggleBookmark(id){
  const i=bookmarks.indexOf(id);
  if(i>=0){bookmarks.splice(i,1);toast('已取消收藏')}
  else{bookmarks.push(id);toast('⭐ 已收藏')}
  localStorage.setItem('cl_bm',JSON.stringify(bookmarks));
  updateBookmarkBar();
  renderView();
}
function toggleRead(id){
  const i=readList.indexOf(id);
  if(i>=0){readList.splice(i,1);toast('已标记为未读')}
  else{readList.push(id);toast('📖 已标记已读')}
  localStorage.setItem('cl_read',JSON.stringify(readList));
  renderView();
}
function updateBookmarkBar(){
  const bar=document.getElementById('bookmarkBar');
  document.getElementById('bmCount').textContent=bookmarks.length;
  bar.classList.toggle('show',bookmarks.length>0);
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

// ===== Events =====
function bindEvents(){
  // Discover tabs
  document.querySelector('.discover-tabs').addEventListener('click',e=>{
    const btn=e.target.closest('.dtab');if(!btn)return;
    document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderDiscover(btn.dataset.dtab);
  });
  // Discover card click
  document.getElementById('discoverCards').addEventListener('click',e=>{
    const card=e.target.closest('.dcard');if(card) showModal(+card.dataset.id);
  });
  // Era nav
  document.getElementById('eraBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.era-btn');if(!btn)return;
    curEra=btn.dataset.era;
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // Genre
  document.getElementById('genreBtns').addEventListener('click',e=>{
    const btn=e.target.closest('.genre-btn');if(!btn)return;
    curGenre=btn.dataset.genre;
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
  // View toggle
  document.querySelectorAll('.view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      curView=btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    });
  });
  // Search
  document.getElementById('searchInput').addEventListener('input',e=>{
    searchQ=e.target.value;renderView();
  });
  // Tag cloud
  document.getElementById('tagCloud').addEventListener('click',e=>{
    const chip=e.target.closest('.tag-chip');if(!chip)return;
    tagFilter=tagFilter===chip.dataset.tag?'':chip.dataset.tag;
    document.querySelectorAll('.tag-chip').forEach(c=>c.classList.toggle('active',c.dataset.tag===tagFilter));
    renderView();
  });
  // Grid card click & bookmark
  document.getElementById('gridView').addEventListener('click',e=>{
    const bm=e.target.closest('.card-bookmark');
    if(bm){e.stopPropagation();toggleBookmark(+bm.dataset.bid);return}
    const card=e.target.closest('.card');if(card) showModal(+card.dataset.id);
  });
  // Timeline click
  document.getElementById('timelineView').addEventListener('click',e=>{
    const item=e.target.closest('.tl-item');if(item) showModal(+item.dataset.id);
  });
  // Modal close
  document.getElementById('modalClose').addEventListener('click',()=>{
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalOverlay').addEventListener('click',e=>{
    if(e.target===e.currentTarget) e.currentTarget.classList.remove('show');
  });
  // Shuffle & Reset
  document.getElementById('btnShuffle').addEventListener('click',()=>{
    shuffleMode=!shuffleMode;renderView();
    toast(shuffleMode?'🔀 随机排序':'📊 时间排序');
  });
  document.getElementById('btnReset').addEventListener('click',()=>{
    curEra='全部';curGenre='全部';searchQ='';tagFilter='';shuffleMode=false;
    document.getElementById('searchInput').value='';
    document.querySelectorAll('.era-btn').forEach(b=>b.classList.toggle('active',b.dataset.era==='全部'));
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.toggle('active',b.dataset.genre==='全部'));
    document.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('active'));
    renderView();toast('↺ 已重置筛选');
  });
  // Bookmark clear filter
  document.getElementById('bmClear').addEventListener('click',()=>{
    // Switch discover tab to bookmarks
    document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('active',b.dataset.dtab==='bookmarks'));
    renderDiscover('bookmarks');
    window.scrollTo({top:0,behavior:'smooth'});
  });
  // Scroll top
  const st=document.getElementById('scrollTop');
  window.addEventListener('scroll',()=>{
    st.classList.toggle('show',window.scrollY>400);
    document.getElementById('eraNav').classList.toggle('scrolled',window.scrollY>100);
  });
  st.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('show');
    if(e.key==='/'&&!e.ctrlKey){e.preventDefault();document.getElementById('searchInput').focus();}
  });
  // Init bookmark bar
  updateBookmarkBar();
}
</script>
