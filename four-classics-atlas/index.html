<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四梦归一 · 四大名著地理可视化</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#141414;--border:#222;--text:#ededed;--text2:#999;--text3:#555;--hlm:#c0392b;--sgy:#27ae60;--shz:#2980b9;--xyj:#d4a017;--smy:#9b59b6}
.light{--bg:#fafafa;--surface:#fff;--border:#e0e0e0;--text:#111;--text2:#666;--text3:#aaa}
html{font-size:15px}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 320px;height:100vh}
.map-wrap{position:relative;overflow:hidden;background:var(--bg)}
.map-wrap svg{width:100%;height:100%}
.sidebar{border-left:1px solid var(--border);overflow-y:auto;background:var(--surface);display:flex;flex-direction:column}
.hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10}
.hdr h1{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;letter-spacing:-.3px}
.hdr .sub{font-size:11px;color:var(--text3);font-family:'Geist Mono',monospace}
.theme-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--text2);font-size:14px}
.filters{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;background:var(--bg);color:var(--text2);user-select:none;transition:.15s}
.chip:hover{border-color:var(--border)}.chip.on{color:#fff}
.chip .d{width:6px;height:6px;border-radius:50%}
.ch-all.on{background:var(--text);color:var(--bg)}
.ch-hlm .d{background:var(--hlm)}.ch-hlm.on{background:var(--hlm)}
.ch-sgy .d{background:var(--sgy)}.ch-sgy.on{background:var(--sgy)}
.ch-shz .d{background:var(--shz)}.ch-shz.on{background:var(--shz)}
.ch-xyj .d{background:var(--xyj)}.ch-xyj.on{background:var(--xyj)}
.ch-smy .d{background:var(--smy)}.ch-smy.on{background:var(--smy)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border)}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:center}
.stat .v{font-size:18px;font-weight:600;font-family:'Geist Mono',monospace}
.stat .l{font-size:10px;color:var(--text3)}
.tab-row{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:8px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:.15s}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab:hover{color:var(--text2)}
.loc-list{flex:1;overflow-y:auto;padding:4px 0}
.loc-item{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.1s;font-size:13px}
.loc-item:hover{background:var(--bg)}
.loc-item.active{background:var(--bg);border-left:3px solid var(--text2)}
.loc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.loc-nm{flex:1;font-weight:500}
.loc-nv{font-size:10px;color:var(--text3);font-family:'Geist Mono',monospace}
.detail{border-top:1px solid var(--border);padding:14px 16px;display:none}
.detail.show{display:block}
.detail h3{font-family:'Noto Serif SC',serif;font-size:16px;margin-bottom:4px}
.detail .d-nv{font-size:11px;font-family:'Geist Mono',monospace;padding:2px 8px;border-radius:9999px;color:#fff;display:inline-block;margin-bottom:6px}
.detail .d-desc{font-size:13px;color:var(--text2);margin-bottom:8px}
.detail .d-section{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px}
.detail .d-tag{display:inline-block;font-size:11px;background:var(--bg);border-radius:4px;padding:2px 8px;margin:2px 4px 2px 0;color:var(--text2)}
.detail .d-cross{font-size:12px;color:var(--smy);margin-top:4px;font-style:italic}
.route-legend{padding:8px 16px;border-top:1px solid var(--border);display:none}
.route-legend.show{display:block}
.route-legend h4{font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.rl-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);padding:2px 0}
.rl-line{width:24px;height:3px;border-radius:2px}

/* Map marker styles via SVG */
.map-marker{cursor:pointer;transition:transform .15s}
.map-marker:hover{transform:scale(1.3)}
.map-label{font-size:9px;fill:var(--text2);pointer-events:none;font-family:'Geist Mono',monospace}
.light .map-label{fill:#666}
.province{fill:var(--surface);stroke:var(--border);stroke-width:.5;opacity:.3}
.route-line{fill:none;stroke-width:2;stroke-dasharray:6 4;opacity:.7}
.cross-line{fill:none;stroke-width:1.5;stroke-dasharray:4 4;opacity:.5}
@keyframes dash{to{stroke-dashoffset:-20}}
.route-line,.cross-line{animation:dash 2s linear infinite}

/* Relationship panel */
.rel-panel{padding:10px 16px;border-top:1px solid var(--border);display:none}
.rel-panel.show{display:block}
.rel-panel h4{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.rel-char{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px}
.rel-char .rc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rel-char .rc-nm{font-weight:500;flex:1}
.rel-char .rc-nv{font-size:10px;color:var(--text3)}

@media(max-width:768px){.app{grid-template-columns:1fr;grid-template-rows:50vh 1fr}.sidebar{border-left:none;border-top:1px solid var(--border)}}
</style>
</head>

<g id="routes"></g>

{pts:'310,170 345,165 355,185 345,215 320,210 310,190',nm:'西北'},
{pts:'345,220 375,215 385,235 380,260 355,265 340,250',nm:'江南'},
{pts:'320,240 350,235 360,260 340,285 315,275 310,255',nm:'湖广'},
{pts:'275,225 315,220 325,245 315,275 285,270 270,250',nm:'巴蜀'},
{pts:'245,245 280,240 285,270 265,300 240,290 235,265',nm:'西南'},
{pts:'360,270 395,265 410,280 400,310 370,305 355,285',nm:'东南'},
{pts:'430,160 465,155 475,175 460,195 435,190 425,175',nm:'东海'},
{pts:'195,235 250,230 260,260 240,295 200,285 190,255',nm:'西域'},
{pts:'380,190 420,185 440,200 435,220 400,225 385,210',nm:'齐鲁'}
];

/* === STATE === */
let filter='all', tab='list', selLoc=null, activeRoutes=new Set();

/* === HELPERS === */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const locById=id=>L.find(l=>l.id===id);

/* === INIT === */
function init(){
  renderFilters();
  renderProvinces();
  renderAll();
  renderStats();
  renderTabs();
}

function renderFilters(){
  const f=$('#filters');
  f.innerHTML=`
    <div class="chip ch-all on" data-f="all" onclick="setFilter(this)">全部</div>
    <div class="chip ch-hlm" data-f="hlm" onclick="setFilter(this)"><span class="d"></span>红楼梦</div>
    <div class="chip ch-sgy" data-f="sgy" onclick="setFilter(this)"><span class="d"></span>三国</div>
    <div class="chip ch-shz" data-f="shz" onclick="setFilter(this)"><span class="d"></span>水浒</div>
    <div class="chip ch-xyj" data-f="xyj" onclick="setFilter(this)"><span class="d"></span>西游</div>
    <div class="chip ch-smy" data-f="smy" onclick="setFilter(this)"><span class="d"></span>四梦归一</div>
  `;
}

function setFilter(el){
  $$('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  filter=el.dataset.f;
  renderAll();renderStats();renderLocList();
}

function setTab(el){
  $$('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  tab=el.dataset.t;
  renderTabContent();
}

function filtered(){
  if(filter==='all') return L;
  if(filter==='smy') return L; // show all but highlight connections
  return L.filter(l=>l.nv===filter);
}

/* === PROVINCES === */
function renderProvinces(){
  const g=$('#provinces');
  g.innerHTML=PROVINCES.map(p=>`<polygon points="${p.pts}" class="province"/>`).join('');
}

/* === MARKERS === */
function renderMarkers(){
  const mg=$('#markers');
  const lg=$('#labels');
  const list=filtered();
  const ids=new Set(list.map(l=>l.id));
  
  mg.innerHTML=list.map(l=>{
    const c=N[l.nv].c;
    return `<g class="map-marker" onclick="selectLoc('${l.id}')" data-id="${l.id}">
      <circle cx="${l.x}" cy="${l.y}" r="6" fill="${c}" opacity=".9"/>
      <circle cx="${l.x}" cy="${l.y}" r="3" fill="#fff" opacity=".8"/>
    </g>`;
  }).join('');
  
  lg.innerHTML=list.map(l=>{
    return `<text class="map-label" x="${l.x}" y="${l.y-10}" text-anchor="middle">${l.nm}</text>`;
  }).join('');
}

/* === ROUTES === */
function renderRoutes(){
  const g=$('#routes');
  let html='';
  R.forEach(r=>{
    const pts=r.pts.map(id=>{const l=locById(id);return l?`${l.x},${l.y}`:''}).filter(Boolean).join(' ');
    const show=activeRoutes.has(r.id);
    html+=`<polyline points="${pts}" class="route-line" stroke="${r.c}" style="display:${show?'block':'none'}"/>`;
  });
  g.innerHTML=html;
}

/* === CROSS CONNECTIONS === */
function renderCross(){
  const g=$('#cross-connections');
  if(filter!=='smy'&&filter!=='all'){g.innerHTML='';return;}
  const list=filtered();
  const ids=new Set(list.map(l=>l.id));
  
  g.innerHTML=C.filter(c=>ids.has(c.f)&&ids.has(c.t)).map(c=>{
    const f=locById(c.f),t=locById(c.t);
    if(!f||!t) return '';
    const mx=(f.x+t.x)/2, my=(f.y+t.y)/2-15;
    return `<path d="M${f.x},${f.y} Q${mx},${my} ${t.x},${t.y}" class="cross-line" stroke="#9b59b6"/>`;
  }).join('');
}

/* === RENDER ALL === */
function renderAll(){
  renderMarkers();
  renderCross();
  renderRoutes();
  renderLocList();
}

/* === STATS === */
function renderStats(){
  const list=filtered();
  const novels=new Set(list.map(l=>l.nv));
  const chars=new Set(list.flatMap(l=>l.ch));
  $('#stats').innerHTML=`
    <div class="stat"><div class="v">${list.length}</div><div class="l">显示地点</div></div>
    <div class="stat"><div class="v">${novels.size}</div><div class="l">名著</div></div>
    <div class="stat"><div class="v">${C.length}</div><div class="l">跨界连接</div></div>
    <div class="stat"><div class="v">${chars.size}</div><div class="l">关键人物</div></div>
  `;
}

/* === TABS === */
function renderTabs(){renderTabContent();}
function renderTabContent(){
  const rl=$('#routeLegend');
  const rp=$('#relPanel');
  rl.classList.remove('show');
  rp.classList.remove('show');
  
  if(tab==='list'){renderLocList();}
  else if(tab==='routes'){renderRouteLegend();}
  else if(tab==='chars'){renderCharsPanel();}
}

/* === LOC LIST === */
function renderLocList(){
  const el=$('#locList');
  const list=filtered();
  el.innerHTML=list.map(l=>`
    <div class="loc-item${selLoc===l.id?' active':''}" onclick="selectLoc('${l.id}')">
      <div class="loc-dot" style="background:${N[l.nv].c}"></div>
      <span class="loc-nm">${l.nm}</span>
      <span class="loc-nv">${N[l.nv].n}</span>
    </div>
  `).join('');
}

/* === SELECT LOCATION === */
function selectLoc(id){
  selLoc=id;
  const l=locById(id);
  if(!l) return;
  renderLocList();
  
  const d=$('#detail');
  d.classList.add('show');
  d.innerHTML=`
    <h3>${l.nm}</h3>
    <div class="d-nv" style="background:${N[l.nv].c}">${N[l.nv].n}</div>
    <div class="d-desc">${l.desc}</div>
    <div class="d-section">关键事件</div>
    ${l.ev.map(e=>`<span class="d-tag">${e}</span>`).join('')}
    <div class="d-section">相关人物</div>
    ${l.ch.map(c=>`<span class="d-tag">${c}</span>`).join('')}
    ${l.xr?`<div class="d-section">四梦归一</div><div class="d-cross">${l.xr}</div>`:''}
  `;
  
  // Highlight on map
  $$('.map-marker').forEach(m=>{
    const mid=m.dataset.id;
    m.style.opacity=mid===id?'1':'.3';
    m.style.transform=mid===id?'scale(1.5)':'';
  });
}

/* === ROUTE LEGEND === */
function renderRouteLegend(){
  const el=$('#routeLegend');
  el.classList.add('show');
  el.innerHTML=`
    <h4>路线动画</h4>
    ${R.map(r=>`
      <div class="rl-item" style="cursor:pointer" onclick="toggleRoute('${r.id}',this)">
        <div class="rl-line" style="background:${r.c}${activeRoutes.has(r.id)?'':';opacity:.3'}"></div>
        <span>${r.nm}</span>
        <span style="color:var(--text3);margin-left:auto;font-size:10px">${r.pts.length}站</span>
      </div>
      <div style="font-size:10px;color:var(--text3);padding:0 0 4px 30px">${r.desc}</div>
    `).join('')}
  `;
  $('#locList').innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">点击上方路线切换显示<br/>紫色虚线为跨界连接</div>';
}

function toggleRoute(id){
  if(activeRoutes.has(id)) activeRoutes.delete(id);
  else activeRoutes.add(id);
  renderRoutes();
  renderRouteLegend();
}

/* === CHARS PANEL === */
function renderCharsPanel(){
  const el=$('#relPanel');
  el.classList.add('show');
  el.innerHTML=`<h4>人物关系网络</h4>`+
    CHARS.map(c=>`
      <div class="rel-char" onclick="highlightChar('${c.n}')">
        <div class="rc-dot" style="background:${N[c.nv].c}"></div>
        <span class="rc-nm">${c.n}</span>
        <span class="rc-nv">${N[c.nv].n}</span>
      </div>
    `).join('');
  $('#locList').innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">点击人物查看其关联地点<br/>和相关人物关系</div>';
}

function highlightChar(name){
  const c=CHARS.find(x=>x.n===name);
  if(!c) return;
  
  // Highlight locations
  $$('.map-marker').forEach(m=>{
    const show=c.locs.includes(m.dataset.id);
    m.style.opacity=show?'1':'.15';
    m.style.transform=show?'scale(1.4)':'';
  });
  
  // Show detail
  const d=$('#detail');
  d.classList.add('show');
  d.innerHTML=`
    <h3>${c.n}</h3>
    <div class="d-nv" style="background:${N[c.nv].c}">${N[c.nv].n}</div>
    <div class="d-section">关联地点</div>
    ${c.locs.map(id=>{const l=locById(id);return l?`<span class="d-tag">${l.nm}</span>`:''}).join('')}
    <div class="d-section">关系人物</div>
    ${c.rel.map(r=>`<span class="d-tag">${r}</span>`).join('')}
  `;
}

/* === THEME === */
function toggleTheme(){document.body.classList.toggle('light');}

init();
</script>
</body>
</html>
