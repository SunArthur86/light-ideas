<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>四梦归一 · 四大名著地理可视化</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--text:#e0e0e0;--text2:#999;--text3:#555;--border:#222}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:8px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);z-index:500}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:-.5px}
.hdr .sub{font-size:10px;color:var(--text3)}
.search-box{margin-left:8px;position:relative}
.search-box input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px 4px 26px;color:var(--text);font-size:12px;width:120px;outline:none}
.search-box input:focus{border-color:var(--text3);width:180px;transition:width .3s}
.search-box .icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px}
.share-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text2);cursor:pointer;font-size:11px;margin-left:auto}
.share-btn:hover{border-color:var(--text3);color:var(--text)}
.main{display:flex;flex:1;overflow:hidden}
#map{flex:1;background:#0d1117}
.sidebar{width:300px;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:var(--bg)}
.filters{padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:10px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--text2);transition:all .15s}
.chip:hover{border-color:var(--text3)}.chip.on{color:#fff}
.ch-all.on{background:var(--text);color:var(--bg)}
.ch-hlm .d{background:#c0392b;width:6px;height:6px;border-radius:50%}.ch-hlm.on{background:#c0392b}
.ch-sgy .d{background:#27ae60;width:6px;height:6px;border-radius:50%}.ch-sgy.on{background:#27ae60}
.ch-shz .d{background:#2980b9;width:6px;height:6px;border-radius:50%}.ch-shz.on{background:#2980b9}
.ch-xyj .d{background:#d4a017;width:6px;height:6px;border-radius:50%}.ch-xyj.on{background:#d4a017}
.ch-smy .d{background:#9b59b6;width:6px;height:6px;border-radius:50%}.ch-smy.on{background:#9b59b6}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:7px 0;text-align:center;font-size:11px;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text2)}.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab-content{flex:1;overflow-y:auto;padding:10px}
.stats{padding:5px 10px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;gap:10px}
.loc-item{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11px;margin-bottom:1px;display:flex;align-items:center;gap:6px;transition:background .15s}
.loc-item:hover{background:var(--surface)}.loc-item.active{background:rgba(255,255,255,.08)}
.loc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.detail-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center}
.detail-bg.show{display:flex}
.detail{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:18px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto}
.detail h3{font-size:15px;margin-bottom:4px}.detail .tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;color:#fff;margin-bottom:8px}
.detail .desc{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6}
.detail .section{margin-bottom:10px}.detail .section h4{font-size:10px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.detail .char-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin:2px;color:var(--text2)}
.detail .quote{font-style:italic;font-size:11px;color:var(--text3);border-left:2px solid var(--border);padding-left:8px;margin:6px 0}
.detail .close-btn{float:right;cursor:pointer;font-size:18px;color:var(--text3)}.detail .close-btn:hover{color:var(--text)}
.rl-group{margin-bottom:8px}.rl-group h4{font-size:11px;margin-bottom:4px;color:var(--text2)}
.rl-item{padding:5px 8px;border-radius:5px;margin-bottom:1px;cursor:pointer;font-size:11px;transition:background .15s;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.rl-item:hover{background:rgba(255,255,255,.04)}
.route-line{display:inline-block;width:14px;height:2px;border-radius:1px;vertical-align:middle}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:10px;padding-left:10px}
.tl-item::before{content:'';position:absolute;left:-16px;top:3px;width:7px;height:7px;border-radius:50%;border:2px solid var(--text3);background:var(--bg)}
.tl-item.hlm::before{border-color:#c0392b}.tl-item.sgy::before{border-color:#27ae60}
.tl-item.shz::before{border-color:#2980b9}.tl-item.xyj::before{border-color:#d4a017}
.tl-item.smy::before{border-color:#9b59b6}
.tl-year{font-size:10px;color:var(--text3)}.tl-text{font-size:11px;color:var(--text2);margin-top:1px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;z-index:2000;display:none}
.toast.show{display:block}
.leaflet-popup-content-wrapper{background:#1a1a1a!important;color:#e0e0e0!important;border-radius:8px!important;border:1px solid #333!important}
.leaflet-popup-tip{background:#1a1a1a!important}
.leaflet-popup-content{margin:8px 12px!important;font-size:12px!important}
@media(max-width:768px){
  .sidebar{display:none;position:fixed;bottom:0;left:0;right:0;height:55vh;border-radius:16px 16px 0 0;border-left:none;border-top:1px solid var(--border);z-index:800;transform:translateY(100%);transition:transform .3s ease}
  .sidebar.open{display:flex;transform:translateY(0)}
  .mobile-toggle{display:flex !important}
  .hdr h1{font-size:13px}
  .search-box input{width:80px}
}
.mobile-toggle{display:none;position:fixed;bottom:16px;right:16px;z-index:900;width:48px;height:48px;border-radius:50%;background:var(--text);color:var(--bg);border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);align-items:center;justify-content:center}
.travel-btn{margin-left:6px;background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:1px 6px;border-radius:4px;cursor:pointer;font-size:9px}
.travel-btn:hover{border-color:var(--text3);color:var(--text)}
.travel-btn.active{background:#c0392b;border-color:#c0392b;color:#fff}
.detail-img{max-width:100%;border-radius:8px;margin:8px 0;display:block;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.travel-marker{font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.8);animation:bounce .6s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.travel-summary{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px;font-size:12px}
.travel-summary h4{margin-bottom:6px;font-size:13px}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:6px;color:var(--text);font-size:12px;cursor:pointer;transition:all .15s}
.quiz-opt:hover{border-color:var(--text3);background:rgba(255,255,255,.05)}
.quiz-opt.correct{background:#27ae60;border-color:#27ae60;color:#fff}
.quiz-opt.wrong{background:#c0392b;border-color:#c0392b;color:#fff}
.quiz-score{font-size:28px;font-weight:700;text-align:center;margin:12px 0}
.quiz-grade{font-size:36px;text-align:center;font-weight:700;margin:8px 0}
.quiz-progress{height:3px;background:var(--border);border-radius:2px;margin-bottom:12px}
.quiz-progress-bar{height:100%;background:var(--text);border-radius:2px;transition:width .3s}
</style>
</head>

function svgIcon(nv,c,nm){

}

// === THEME ===
let darkMode=true,terrainMode=false,satMode=false;
function toggleTheme(){
  // Cycle: dark → light → terrain → satellite → dark
  if(!terrainMode&&!satMode&&!darkMode){terrainMode=true}
  else if(terrainMode){terrainMode=false;satMode=true}
  else if(satMode){satMode=false;darkMode=true}
  else{darkMode=false}
  // Update CSS vars
  const light=!darkMode;
  document.body.style.setProperty('--bg',darkMode?'#0a0a0a':'#f5f5f0');
  document.body.style.setProperty('--surface',darkMode?'#141414':'#fff');
  document.body.style.setProperty('--text',darkMode?'#e0e0e0':'#222');
  document.body.style.setProperty('--text2',darkMode?'#999':'#666');
  document.body.style.setProperty('--text3',darkMode?'#555':'#aaa');
  document.body.style.setProperty('--border',darkMode?'#222':'#ddd');
  document.getElementById('map').style.background=darkMode?'#0d1117':'#e8e4df';
  // Swap tile layer
  map.removeLayer(currentTile);
  let url,maxZ=18;
  if(terrainMode)url='https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',maxZ=17;
  else if(satMode)url='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',maxZ=18;
  else url=darkMode?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  currentTile=L.tileLayer(url,{maxZoom:maxZ,minZoom:2}).addTo(map);
  document.getElementById('themeBtn').textContent=terrainMode?'⛰️':satMode?'🛰️':darkMode?'🌙':'☀️';
  document.getElementById('themeBtn').title=terrainMode?'地形模式':satMode?'卫星模式':darkMode?'暗色模式':'亮色模式';
}

// === DASHBOARD ===
function renderDashboard(){
  const counts={hlm:0,sgy:0,shz:0,xyj:0};
  LOCS.forEach(l=>{if(counts[l.nv]!==undefined)counts[l.nv]++});
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  const avgElev=Math.round(LOCS.filter(l=>l.elev).reduce((s,l)=>s+l.elev,0)/LOCS.filter(l=>l.elev).length);
  const provinces=new Set(LOCS.filter(l=>l.alt).map(l=>l.alt.split('·')[0].substring(0,2)));
  let html='<div style="padding:8px">';
  html+='<div style="font-size:13px;font-weight:700;margin-bottom:10px">📊 数据总览</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">';
  const cards=[
    {label:'地点',value:total,color:'var(--text)'},
    {label:'路线',value:R.length,color:'#27ae60'},
    {label:'人物',value:CHARS.length,color:'#2980b9'},
    {label:'连线',value:C.length,color:'#9b59b6'},
  ];
  cards.forEach(c=>{
    html+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center">
      <div style="font-size:18px;font-weight:700;color:${c.color}">${c.value}</div>
      <div style="font-size:9px;color:var(--text3)">${c.label}</div></div>`;
  });
  html+='</div>';
  // Novel breakdown
  html+='<div style="margin-bottom:12px">';
  Object.entries(NV).forEach(([k,v])=>{
    if(k==='smy')return;
    const pct=Math.round(counts[k]/total*100);
    html+=`<div style="margin-bottom:4px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:2px"><span>${v.n}</span><span>${counts[k]}地</span></div>
    <div style="height:4px;background:var(--border);border-radius:2px"><div style="height:100%;width:${pct}%;background:${v.c};border-radius:2px"></div></div></div>`;
  });
  html+='</div>';
  // Stats
  html+=`<div style="font-size:10px;color:var(--text3);line-height:1.8">
    <div>🏔️ 平均海拔：${avgElev}m</div>
    <div>📏 覆盖省份：${provinces.size}个</div>
    <div>🌍 纬度范围：${Math.min(...LOCS.map(l=>l.lat)).toFixed(1)}°N ~ ${Math.max(...LOCS.map(l=>l.lat)).toFixed(1)}°N</div>
    <div>📐 经度范围：${Math.min(...LOCS.map(l=>l.lng)).toFixed(1)}°E ~ ${Math.max(...LOCS.map(l=>l.lng)).toFixed(1)}°E</div>
  </div>`;
  html+='</div>';
  return html;
}

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function locById(id){return LOCS.find(l=>l.id===id)}

if(map)L.control.zoom({position:'topleft'}).addTo(map);
let currentTile=map?L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18,minZoom:2,errorTileUrl:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect fill="%23222" width="256" height="256"/></svg>'}).addTo(map):null;

// === MARKERS ===
function updateMarkers(){
  Object.values(markers).forEach(m=>map.removeLayer(m));markers={};
  const list=filtered();const ids=new Set(list.map(l=>l.id));
  LOCS.forEach(l=>{
    if(!ids.has(l.id))return;
    const nv=NV[l.nv];
    const icon=L.divIcon({
      className:'',iconSize:[24,24],iconAnchor:[12,12],
      html:svgIcon(l.nv,nv.c,l.nm)
    });
    const m=L.marker([l.lat,l.lng],{icon}).addTo(map);
    m.on('click',()=>showDetail(l.id));
    m.bindPopup(`<b style="color:${nv.c}">${l.nm}</b><br><span style="color:#999">${nv.n}</span>`);
    markers[l.id]=m;
  });
}

// === ROUTES ===
function updateRoutes(){
  Object.values(routeLayers).forEach(l=>map.removeLayer(l));routeLayers={};
  R.forEach(r=>{
    if(!activeRoutes.has(r.id))return;
    const coords=r.pts.map(id=>{const l=locById(id);return l?[l.lat,l.lng]:null}).filter(Boolean);
    if(coords.length<2)return;
    const isTravel=r.type!=='lit';
    const line=L.polyline(coords,{
      color:r.c,weight:isTravel?2:3,opacity:isTravel?.7:.9,
      dashArray:isTravel?'8 5':null,
      smoothFactor:1
    }).addTo(map);
    routeLayers[r.id]=line;
    // Add waypoint labels
    coords.forEach((c,i)=>{
      const loc=locById(r.pts[i]);
      if(!loc)return;
      const dot=L.circleMarker(c,{radius:isTravel?3:4,color:r.c,fillColor:r.c,fillOpacity:.8,weight:1}).addTo(map);
      routeLayers[r.id+'_dot_'+i]=dot;
    });
  });
}

// === CROSS CONNECTIONS ===
function updateCross(){
  crossLayers.forEach(l=>map.removeLayer(l));crossLayers=[];
  if(filter!=='smy'&&filter!=='all')return;
  C.forEach(c=>{
    const f=locById(c.f),t=locById(c.t);if(!f||!t)return;
    const line=L.polyline([[f.lat,f.lng],[t.lat,t.lng]],{
      color:'#9b59b6',weight:1.5,opacity:.5,dashArray:'6 4'
    }).addTo(map);
    line.bindPopup(`<b style="color:#9b59b6">${c.d}</b>`);
    crossLayers.push(line);
  });
}

// === FILTER ===
function setFilter(el){
  $$('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');
  filter=el.dataset.f;updateMarkers();updateCross();renderStats();renderTabContent();
}

function showCharRelGraph(){

  $('#tabContent').innerHTML=canvas;

function drawRelGraph(){
  const cvs=document.getElementById('relCanvas');if(!cvs)return;
  const ctx=cvs.getContext('2d');
  const W=cvs.width,H=cvs.height;
  const nodes=CHARS.map((c,i)=>({x:W/2+Math.cos(i*2.4)*80+Math.random()*40,y:H/2+Math.sin(i*2.4)*60+Math.random()*40,n:c.n,nv:c.nv,rel:c.rel,r:8}));
  const edges=[];
  nodes.forEach((a,i)=>{a.rel.forEach(rn=>{const j=nodes.findIndex(b=>b.n===rn);if(j>i)edges.push({s:i,t:j})})});
  let drag=-1;
  cvs.onmousedown=e=>{const r=cvs.getBoundingClientRect(),mx=e.offsetX*(W/r.width),my=e.offsetY*(H/r.height);drag=nodes.findIndex(n=>(n.x-mx)**2+(n.y-my)**2<(n.r*2)**2);if(drag>=0)cvs.style.cursor='grabbing'};
  cvs.onmousemove=e=>{if(drag<0)return;const r=cvs.getBoundingClientRect();nodes[drag].x=e.offsetX*(W/r.width);nodes[drag].y=e.offsetY*(H/r.height)};
  cvs.onmouseup=()=>{drag=-1;cvs.style.cursor='grab'};
  function tick(){
    // Force simulation
    nodes.forEach((a,i)=>{nodes.forEach((b,j)=>{if(i===j)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-60)*0.003;a.x-=dx/d*f;a.y-=dy/d*f})});
    edges.forEach(e=>{const a=nodes[e.s],b=nodes[e.t];let dx=b.x-a.x,dy=b.y-a.y;a.x+=dx*0.005;a.y+=dy*0.005;b.x-=dx*0.005;b.y-=dy*0.005});
    nodes.forEach(n=>{n.x=Math.max(15,Math.min(W-15,n.x));n.y=Math.max(15,Math.min(H-15,n.y));if(drag<0){n.x+=(W/2-n.x)*0.001;n.y+=(H/2-n.y)*0.001}});
    ctx.clearRect(0,0,W,H);
    edges.forEach(e=>{const a=nodes[e.s],b=nodes[e.t];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke()});
    nodes.forEach(n=>{const c=NV[n.nv]?.c||'#999';ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.font='7px sans-serif';ctx.fillStyle='var(--text,#ccc)';ctx.textAlign='center';ctx.fillText(n.n,n.x,n.y+n.r+10)});
    requestAnimationFrame(tick);
  }
  tick();
}

  Object.entries(markers).forEach(([id,m])=>{

// === CHARACTER TRAVEL ANIMATION ===
let travelInterval=null,travelMarker=null,travelLine=null,travelDots=[];

function startCharTravel(idx){
  if(travelInterval){stopCharTravel();return}
  const c=CHARS[idx];if(!c||c.locs.length<2)return;
  const nv=NV[c.nv];
  // Build coords from character's locs
  const coords=c.locs.map(id=>{const loc=locById(id);return loc?[loc.lat,loc.lng]:null}).filter(Boolean);
  if(coords.length<2)return;
  // Compute total distance in km (approx haversine)
  let totalDist=0;
  for(let i=1;i<coords.length;i++){
    totalDist+=haversine(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]);
  }
  // Draw route polyline
  travelLine=L.polyline(coords,{color:nv.c,weight:3,opacity:.8}).addTo(map);
  // Draw waypoint dots
  travelDots=coords.map((c2,i)=>{
    return L.circleMarker(c2,{radius:4,color:nv.c,fillColor:nv.c,fillOpacity:1,weight:2}).addTo(map);
  });
  // Create moving marker
  const emoji=c.nv==='xyj'?'🐒':c.nv==='sgy'?'⚔️':c.nv==='shz'?'🗡️':c.nv==='hlm'?'🌸':'✨';
  const icon=L.divIcon({className:'travel-marker',iconSize:[24,24],iconAnchor:[12,12],html:emoji});
  travelMarker=L.marker(coords[0],{icon}).addTo(map);
  // Interpolate route into small steps
  const steps=[];
  for(let i=1;i<coords.length;i++){
    const stepsPerSeg=30;
    for(let s=0;s<=stepsPerSeg;s++){
      const t=s/stepsPerSeg;
      steps.push([
        coords[i-1][0]+(coords[i][0]-coords[i-1][0])*t,
        coords[i-1][1]+(coords[i][1]-coords[i-1][1])*t
      ]);
    }
  }
  let stepIdx=0;
  const locNames=c.locs.map(id=>{const loc=locById(id);return loc?loc.nm:''}).filter(Boolean);
  let passedIdx=0;
  map.setView(coords[0],6);
  travelInterval=setInterval(()=>{
    if(stepIdx>=steps.length){
      clearInterval(travelInterval);travelInterval=null;
      // Show travel summary
      const summaryHtml=`<div class="travel-summary">
        <h4>🎉 ${c.n}的旅行结束！</h4>
        <div style="color:var(--text2);margin:6px 0">总距离：约${Math.round(totalDist)} km</div>
        <div style="color:var(--text2);margin:6px 0">经过地点：${coords.length} 个</div>
        <div style="color:var(--text3);margin:6px 0">路线：${locNames.join(' → ')}</div>
        <button onclick="stopCharTravel()" style="margin-top:8px;background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px">关闭</button>
      </div>`;
      showToast(`${c.n}到达终点！旅程约${Math.round(totalDist)}km`);
      // Show summary in sidebar if on chars tab
      if(tab==='chars'){
        const tc=$('#tabContent');
        tc.innerHTML+=summaryHtml;
      }
      return;
    }
    const pos=steps[stepIdx];
    travelMarker.setLatLng(pos);
    map.panTo(pos,{animate:false});
    // Check if passed a waypoint
    for(let wi=0;wi<coords.length;wi++){
      if(wi>passedIdx){
        const d=haversine(pos[0],pos[1],coords[wi][0],coords[wi][1]);
        if(d<20){passedIdx=wi;showToast(`📍 到达 ${locNames[wi]||'地点'}`);}
      }
    }
    stepIdx++;
  },60);
}
function stopCharTravel(){
  if(travelInterval){clearInterval(travelInterval);travelInterval=null;}
  if(travelMarker){map.removeLayer(travelMarker);travelMarker=null;}
  if(travelLine){map.removeLayer(travelLine);travelLine=null;}
  travelDots.forEach(d=>map.removeLayer(d));travelDots=[];
  if(tab==='chars')renderCharsPanel();
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function generateQuizQuestions(){
  // Pick 10 random locations with descriptions
  const pool=LOCS.filter(l=>l.desc&&l.desc.length>4);
  const shuffled=pool.sort(()=>Math.random()-0.5).slice(0,10);
  return shuffled.map(loc=>{
    // Pick 3 random wrong answers
    const wrongPool=LOCS.filter(l=>l.id!==loc.id).sort(()=>Math.random()-0.5).slice(0,3);
    const options=[loc,...wrongPool].sort(()=>Math.random()-0.5);
    return{locId:loc.id,desc:loc.desc,novel:NV[loc.nv].n,options:options.map(o=>({id:o.id,nm:o.nm}))};
  });
}

      <div class="quiz-score">${qs.score} 分</div>
      <div class="quiz-grade" style="color:${gradeColors[grade]}">${grade}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:16px">${grade==='S'?'四大名著通！':grade==='A'?'地理达人！':grade==='B'?'不错的成绩！':grade==='C'?'还需加油！':'多看看地图吧！'}</div>
      <button onclick="startQuiz()" style="background:var(--text);color:var(--bg);border:none;padding:8px 24px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:700">再来一轮</button>
      <button onclick="quizState={score:0,qIdx:0,questions:[],answered:false};renderQuiz()" style="background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;margin-left:6px">返回</button>
    </div>`;
    return;
  }
  const q=qs.questions[qs.qIdx];
  const progress=((qs.qIdx)/qs.questions.length)*100;
  let optHtml=q.options.map((o,i)=>{
    let cls='quiz-opt';
    let extra='';
    if(qs.answered){
      if(o.id===q.locId)cls='quiz-opt correct';
      else extra=`data-wrong="1"`;
    }
    return `<button class="${cls}" ${extra} onclick="answerQuiz('${o.id}','${q.locId}',this)">${String.fromCharCode(65+i)}. ${o.nm}</button>`;
  }).join('');
  $('#tabContent').innerHTML=`<div style="padding:6px 0">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px">
      <span>第 ${qs.qIdx+1}/${qs.questions.length} 题</span><span>得分: ${qs.score}</span>
    </div>
    <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${progress}%"></div></div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:4px">来自《${q.novel}》</div>
    <div style="font-size:13px;font-weight:700;margin-bottom:12px;line-height:1.5">${q.desc}</div>
    <div id="quizOptions">${optHtml}</div>
    ${qs.answered?'<button onclick="nextQuizQ()" style="margin-top:8px;background:var(--text);color:var(--bg);border:none;padding:6px 18px;border-radius:4px;font-size:12px;cursor:pointer;width:100%">下一题 →</button>':''}
  </div>`;
}
function startQuiz(){
  quizState={score:0,qIdx:0,questions:generateQuizQuestions(),answered:false};
  renderQuiz();
}
function answerQuiz(chosen,correct,btn){
  if(quizState.answered)return;
  quizState.answered=true;
  if(chosen===correct){
    quizState.score+=10;
    btn.classList.add('correct');
    showToast('✅ 答对了！+10分');
  }else{
    quizState.score=Math.max(0,quizState.score-5);
    btn.classList.add('wrong');
    // Highlight correct
    document.querySelectorAll('.quiz-opt').forEach(b=>{
      if(b.textContent.includes(locById(correct)?.nm))b.classList.add('correct');
    });
    showToast('❌ 答错了！-5分');
  }
  // Fly to the correct location
  const loc=locById(correct);
  if(loc)map.flyTo([loc.lat,loc.lng],6,{duration:1});
  // Re-render to show correct answer
  setTimeout(()=>renderQuiz(),50);
}
function nextQuizQ(){
  quizState.qIdx++;quizState.answered=false;renderQuiz();
}

// === NOVEL MAP (四梦归一联动) ===
let novelLayer=null,novelMarkers=[];
function renderNovelMap(){
  let html='<div style="padding:4px 0">';
  html+='<div style="font-size:13px;font-weight:700;margin-bottom:6px;color:#9b59b6">📖 四梦归一 · 章节地图</div>';
  html+='<div style="font-size:10px;color:var(--text3);margin-bottom:10px;line-height:1.5">120回融合小说的关键情节在地图上的位置<br>点击章节可飞到对应地点</div>';
  const arcs=['万界觉醒','暗流涌动','裂缝初通','因果交织','石兄石弟','黛玉觉醒','碎片争夺','义气之战','暗花绽放','世界重叠','万界新序','至暗时刻','石头花开','归去来兮','大结局'];
  let curArc='';
  NOVEL_CHAPTERS.forEach((nc,i)=>{
    if(nc.arc!==curArc){
      curArc=nc.arc;
      html+=`<div style="margin-top:10px;margin-bottom:4px;font-size:10px;font-weight:700;color:#9b59b6;border-bottom:1px solid var(--border);padding-bottom:3px">${curArc}</div>`;
    }
    html+=`<div class="loc-item" onclick="flyToNovelChapter(${i})" style="font-size:10px;padding:4px 6px">
      <span style="color:var(--text3);min-width:30px;display:inline-block">第${nc.ch}回</span>
      <span style="color:var(--text2)">${nc.title}</span>
    </div>`;
  });
  html+='</div>';
  $('#tabContent').innerHTML=html;
  showNovelMarkers();
}
function showNovelMarkers(){
  clearNovelLayer();
  novelLayer=L.layerGroup().addTo(map);
  NOVEL_CHAPTERS.forEach(nc=>{
    const loc=locById(nc.loc);if(!loc)return;
    const m=L.circleMarker([loc.lat,loc.lng],{
      radius:6,color:'#9b59b6',fillColor:'#9b59b6',fillOpacity:.6,weight:2
    }).addTo(novelLayer);
    m.bindPopup(`<b style="color:#9b59b6">第${nc.ch}回</b><br>${nc.title}<br><span style="font-size:10px;color:#999">${loc.nm}</span>`);
    novelMarkers.push(m);
  });
}
function clearNovelLayer(){if(novelLayer){map.removeLayer(novelLayer);novelLayer=null;novelMarkers=[];}}
function flyToNovelChapter(idx){
  const nc=NOVEL_CHAPTERS[idx];
  const loc=locById(nc.loc);if(!loc)return;
  map.flyTo([loc.lat,loc.lng],8,{duration:1.5});
  // Open popup
  if(novelMarkers[idx])novelMarkers[idx].openPopup();
  showToast(`📖 第${nc.ch}回：${nc.title} @ ${loc.nm}`);
}

// === PRINT ===
function printMap(){
  // Create printable version
  const printWin=window.open('','_blank');
  const list=filtered();
  const nvGroups={};
  list.forEach(l=>{if(!nvGroups[l.nv])nvGroups[l.nv]=[];nvGroups[l.nv].push(l)});
  let html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>四梦归一·四大名著地图</title>
<style>body{font-family:'Noto Sans SC',sans-serif;padding:20px;color:#222}
h1{font-size:18px;text-align:center;border-bottom:2px solid #333;padding-bottom:8px}
h2{font-size:14px;margin-top:16px;color:#555}
.loc{padding:4px 8px;font-size:11px;border-bottom:1px solid #eee}
.loc b{color:#333}.loc span{color:#888;margin-left:6px}
.stats{text-align:center;font-size:12px;color:#666;margin:12px 0}
@media print{body{padding:0}}</style></head><body>`;
  html+=`<h1>🗺️ 四梦归一 · 四大名著地理可视化</h1>`;
  html+=`<div class="stats">${list.length} 地点 · ${R.length} 路线 · ${CHARS.length} 人物 · ${C.length} 跨界连线</div>`;
  Object.entries(nvGroups).forEach(([nv,locs])=>{
    const n=NV[nv];
    html+=`<h2 style="color:${n.c}">${n.n}（${locs.length}个地点）</h2>`;
    locs.forEach(l=>{
      html+=`<div class="loc"><b>${l.nm}</b><span>${l.alt||''}</span><span>${l.desc||''}</span></div>`;
    });
  });
  html+=`</body></html>`;
  printWin.document.write(html);
  printWin.document.close();
  setTimeout(()=>{printWin.print()},500);
}

// === TTS (语音解说) ===
let ttsActive=false,ttsUtterance=null;
function toggleTTS(){
  ttsActive=!ttsActive;
  document.getElementById('ttsBtn').textContent=ttsActive?'🔇':'🔊';
  if(!ttsActive&&window.speechSynthesis){window.speechSynthesis.cancel();return}
  if(ttsActive)speakCurrentView();
}
function speakCurrentView(){
  if(!ttsActive)return;
  const center=map.getCenter();
  const list=filtered().filter(l=>{
    const dx=l.lng-center.lng,dy=l.lat-center.lat;
    return Math.sqrt(dx*dx+dy*dy)<5;
  });
  if(list.length===0){speakText('当前视野内没有名著地点，请移动地图');return}
  const text=list.slice(0,5).map(l=>{
    const nv=NV[l.nv];
    return `${l.nm}，${nv.n}中的地点。${l.desc||''}`;
  }).join('。');
  speakText(`当前视野内有${list.length}个地点：${text}`);
}
function speakText(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  ttsUtterance=new SpeechSynthesisUtterance(text);
  ttsUtterance.lang='zh-CN';ttsUtterance.rate=0.9;
  ttsUtterance.onend=()=>{if(ttsActive)setTimeout(()=>speakCurrentView(),3000)};
  window.speechSynthesis.speak(ttsUtterance);
}
// Update TTS on map move
map.on('moveend',()=>{if(ttsActive){window.speechSynthesis.cancel();setTimeout(()=>speakCurrentView(),1000)}});

// === SERVICE WORKER (离线缓存) ===
if('serviceWorker' in navigator){
  const swCode=`
self.addEventListener('install',e=>{self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});
self.addEventListener('fetch',e=>{
  const url=new URL(e.request.url);
  if(url.hostname==='localhost'||url.hostname==='127.0.0.1')return;
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
    if(resp.ok&&url.protocol==='https:'){
      const c=resp.clone();caches.open('atlas-v1').then(cache=>cache.put(e.request,c));
    }
    return resp;
  }).catch(()=>new Response('离线',{status:503})))});
`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
