<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四梦归一 · 四大名著地理可视化</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--text:#171717;--text2:#4d4d4d;--text3:#808080;
  --surface:#fafafa;--border:#ebebeb;
  --red:#c0392b;--green:#27ae60;--blue:#2980b9;--gold:#d4a017;--purple:#8e44ad;
  --ocean:#f0f4f8;--land:#e2e8f0;--land-stroke:#c8cdd3;
  --shadow:rgba(0,0,0,.08) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 2px;
}
[data-theme="dark"]{
  --bg:#0a0a0a;--text:#ededed;--text2:#a0a0a0;--text3:#666;
  --surface:#141414;--border:#2a2a2a;
  --ocean:#0d1117;--land:#1a1f2e;--land-stroke:#2a3040;
}
html{font-size:16px}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;transition:background .3s,color .3s}

.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(12px)}
.header h1{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;letter-spacing:-.5px}
.header .sub{font-size:13px;color:var(--text3);font-family:'Geist Mono',monospace;margin-left:12px}
.theme-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--text)}

.filters{display:flex;gap:8px;padding:14px 24px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.fl{font-size:11px;color:var(--text3);font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:1.5px solid transparent;background:var(--surface);color:var(--text2);user-select:none}
.chip:hover{border-color:var(--border)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{color:#fff}
.c-all.on{background:var(--text);color:var(--bg)}
.c-hlm .dot{background:var(--red)}.c-hlm.on{background:var(--red)}
.c-sgy .dot{background:var(--green)}.c-sgy.on{background:var(--green)}
.c-shz .dot{background:var(--blue)}.c-shz.on{background:var(--blue)}
.c-xyj .dot{background:var(--gold)}.c-xyj.on{background:var(--gold)}
.c-cross .dot{background:var(--purple)}.c-cross.on{background:var(--purple)}

.main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 105px)}
.map-box{position:relative;overflow:hidden;background:var(--ocean)}
.map-box svg{width:100%;height:100%}

.sidebar{border-left:1px solid var(--border);background:var(--bg);overflow-y:auto}
.sb-sec{padding:16px 20px;border-bottom:1px solid var(--border)}
.sb-sec h3{font-size:11px;font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat .n{font-size:22px;font-weight:600;letter-spacing:-1px}
.stat .l{font-size:10px;color:var(--text3);font-family:'Geist Mono',monospace;margin-top:2px}

.loc-list{display:flex;flex-direction:column;gap:4px}
.loc-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s}
.loc-item:hover,.loc-item.on{background:var(--surface);box-shadow:var(--shadow)}
.loc-item .md{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.loc-item .inf{flex:1}
.loc-item .nm{font-size:14px;font-weight:500}
.loc-item .tg{font-size:11px;color:var(--text3);font-family:'Geist Mono',monospace}
.loc-item .ds{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.4}

.dp h2{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;margin-bottom:4px}
.dp .badge{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:500;color:#fff;margin-bottom:10px}
.dp .ev{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.5}
.dp .ev:last-child{border-bottom:none}
.dp .ev strong{color:var(--text)}
.dp .xr{margin-top:12px;padding:10px;border-radius:8px;background:var(--surface);border:1px solid var(--border)}
.dp .xr h4{font-size:11px;font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--purple);margin-bottom:6px}
.dp .xr p{font-size:13px;color:var(--text2);line-height:1.5}

.province{fill:var(--land);stroke:var(--land-stroke);stroke-width:.5;transition:fill .2s}
.mk{cursor:pointer;transition:transform .15s}
.mk:hover{transform:scale(1.5)}
.mk circle{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
.mk text{font-family:'Geist',sans-serif;font-size:9px;fill:var(--text);pointer-events:none}
.cross-link{stroke:var(--purple);stroke-width:1.5;stroke-dasharray:6 4;fill:none;opacity:.6;animation:dash 20s linear infinite}
.cross-link-glow{stroke:var(--purple);stroke-width:4;fill:none;opacity:.12;filter:blur(3px)}
@keyframes dash{to{stroke-dashoffset:-200}}

.tooltip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow);font-size:13px;z-index:200;opacity:0;transition:opacity .15s;max-width:220px}
.tooltip.vis{opacity:1}
.tooltip .tn{font-weight:600;margin-bottom:2px}
.tooltip .tt{font-size:11px;color:var(--text3);font-family:'Geist Mono',monospace}

@media(max-width:900px){
  .main{grid-template-columns:1fr;height:auto}
  .map-box{height:55vh}
  .sidebar{border-left:none;border-top:1px solid var(--border)}
  .header .sub{display:none}
}
@media(max-width:600px){
  .filters{padding:10px 16px;gap:6px}
  .header{padding:10px 16px}
  .header h1{font-size:16px}
}
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:baseline;gap:0">
    <h1>四梦归一 · 四大名著地理可视化</h1>
    <span class="sub">Four Classics Atlas</span>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌓</button>
</header>

<nav class="filters">
  <span class="fl">筛选</span>
  <div class="chip c-all on" data-f="all" onclick="setFilter('all')">全部</div>
  <div class="chip c-hlm" data-f="hlm" onclick="setFilter('hlm')"><span class="dot"></span>红楼梦</div>
  <div class="chip c-sgy" data-f="sgy" onclick="setFilter('sgy')"><span class="dot"></span>三国演义</div>
  <div class="chip c-shz" data-f="shz" onclick="setFilter('shz')"><span class="dot"></span>水浒传</div>
  <div class="chip c-xyj" data-f="xyj" onclick="setFilter('xyj')"><span class="dot"></span>西游记</div>
  <div class="chip c-cross" data-f="cross" onclick="setFilter('cross')"><span class="dot"></span>四梦归一</div>
</nav>

<div class="main">
  <div class="map-box" id="mapBox">
    <svg id="svg" viewBox="0 0 800 650" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- China outline simplified -->
      <path class="province" d="M100,90 L180,55 L280,40 L380,32 L480,38 L560,52 L630,75 L690,110 L720,170 L735,240 L725,310 L705,370 L670,420 L625,460 L570,490 L510,510 L445,520 L380,515 L320,500 L260,470 L210,430 L175,370 L155,300 L145,230 L140,165 L135,115 Z"/>
      <!-- Yangtze hint -->
      <path d="M260,280 Q320,300 380,310 Q440,320 500,300 Q550,280 580,250" fill="none" stroke="var(--land-stroke)" stroke-width=".8" opacity=".5"/>
      <!-- Yellow River hint -->
      <path d="M200,220 Q260,240 320,230 Q380,220 440,200 Q500,180 540,170" fill="none" stroke="var(--land-stroke)" stroke-width=".8" opacity=".5"/>
      <g id="crossLinks" opacity="0">
        <!-- 荣国府↔花果山 -->
        <path class="cross-link-glow" d="M365,155 Q450,100 530,260"/>
        <path class="cross-link" d="M365,155 Q450,100 530,260"/>
        <!-- 荣国府↔梁山 -->
        <path class="cross-link-glow" d="M365,155 Q370,200 400,235"/>
        <path class="cross-link" d="M365,155 Q370,200 400,235"/>
        <!-- 荣国府↔五丈原 -->
        <path class="cross-link-glow" d="M365,155 Q340,210 330,260"/>
        <path class="cross-link" d="M365,155 Q340,210 330,260"/>
        <!-- 梁山↔五丈原 -->
        <path class="cross-link-glow" d="M400,235 Q365,245 330,260"/>
        <path class="cross-link" d="M400,235 Q365,245 330,260"/>
        <!-- 花果山↔五行山 -->
        <path class="cross-link-glow" d="M530,260 Q510,310 490,340"/>
        <path class="cross-link" d="M530,260 Q510,310 490,340"/>
      </g>
      <g id="markers"></g>
    </svg>
    <div class="tooltip" id="tip"><div class="tn"></div><div class="tt"></div></div>
  </div>

  <aside class="sidebar" id="sidebar"></aside>
</div>

<script>
const N={
  hlm:{n:'红楼梦',c:'#c0392b',f:'《红楼梦》'},
  sgy:{n:'三国演义',c:'#27ae60',f:'《三国演义》'},
  shz:{n:'水浒传',c:'#2980b9',f:'《水浒传》'},
  xyj:{n:'西游记',c:'#d4a017',f:'《西游记》'}

const L=[
  // 红楼梦

  {id:'daguan',nm:'大观园',nv:'hlm',x:378,y:145,desc:'元春省亲所建园林，众姐妹居所',ev:['黛玉葬花','宝钗扑蝶','抄检大观园'],ch:['贾宝玉','林黛玉','薛宝钗'],xr:'花瓣化蝶穿入虚空，金蝶引出界痕'},
  {id:'xiaoxiang',nm:'潇湘馆',nv:'hlm',x:385,y:148,desc:'林黛玉住所，竹林环绕',ev:['黛玉葬花吟诗','焚稿断痴情'],ch:['林黛玉'],xr:'诗稿灰烬穿越太虚与出师表合卷'},
  {id:'yihong',nm:'怡红院',nv:'hlm',x:372,y:152,desc:'贾宝玉住所',ev:['宝玉摔玉','怡红院夜宴'],ch:['贾宝玉','袭人','晴雯'],xr:'桃树随宝玉"移植"至花果山'},
  {id:'beijing',nm:'北京（都中）',nv:'hlm',x:380,y:130,desc:'贾府所在京城',ev:['元春封妃','贾府抄家'],ch:['贾政','元春'],xr:''},
  {id:'nanjing',nm:'南京（金陵）',nv:'hlm',x:405,y:242,desc:'甄士隐故乡，金陵十二钗原籍',ev:['甄士隐梦幻识通灵'],ch:['甄士隐'],xr:''},
  {id:'dahuang',nm:'大荒山',nv:'hlm',x:195,y:55,desc:'无稽崖青埂峰，通灵宝玉出处',ev:['空空道人抄录石头记'],ch:['空空道人'],xr:'空空道人从此读裂纹中的故事——即全书'},
  {id:'taixu',nm:'太虚幻境',nv:'hlm',x:305,y:215,desc:'警幻仙子所居，命运簿册所在',ev:['宝玉梦游太虚','铜镜映出花果山'],ch:['警幻仙子','贾宝玉'],xr:'铜镜首次映出灵石之界——界痕开端'},

  {id:'xudu',nm:'许都',nv:'sgy',x:348,y:215,desc:'曹操挟天子以令诸侯的都城',ev:['曹操专权','华佗欲开颅取石'],ch:['曹操','曹丕','华佗'],xr:'曹操颅中智石碎片——太虚因果钥匙之一'},
  {id:'chibi',nm:'赤壁',nv:'sgy',x:370,y:315,desc:'孙刘联军大败曹操之地',ev:['诸葛亮借东风','火烧赤壁'],ch:['诸葛亮','周瑜','曹操'],xr:'借风时无意打开太虚微缝'},

  {id:'baidi',nm:'白帝城',nv:'sgy',x:305,y:305,desc:'刘备托孤之城',ev:['刘备托孤诸葛亮'],ch:['刘备','诸葛亮'],xr:'刘备英灵托梦宋江——"别做第二个我"'},
  {id:'luoyang',nm:'洛阳',nv:'sgy',x:358,y:195,desc:'曹魏都城',ev:['曹丕称帝','凤姐亲赴取智石'],ch:['曹丕'],xr:'凤姐将计就计说服曹丕交出智石'},
  {id:'jingzhou',nm:'荆州',nv:'sgy',x:338,y:282,desc:'兵家必争之地',ev:['关羽镇守荆州','吕蒙白衣渡江'],ch:['关羽','吕蒙'],xr:''},
  {id:'maicheng',nm:'麦城',nv:'sgy',x:325,y:295,desc:'关羽败亡之地',ev:['关羽走麦城','英灵不散'],ch:['关羽'],xr:'关公英灵借偃月刀存续——穿越至梁山'},
  {id:'yiling',nm:'夷陵',nv:'sgy',x:345,y:325,desc:'刘备伐吴惨败之地',ev:['夷陵之战','陆逊火烧连营'],ch:['刘备','陆逊'],xr:'刘备以此"苦肉计"告诫宋江'},
  {id:'changan-s',nm:'长安',nv:'sgy',x:322,y:210,desc:'西汉故都',ev:['董卓之乱'],ch:['董卓','吕布'],xr:''},
  {id:'nanzheng',nm:'汉中',nv:'sgy',x:310,y:265,desc:'蜀汉北伐基地',ev:['诸葛亮北伐'],ch:['诸葛亮','魏延'],xr:''},

  // 水浒传
  {id:'liangshan',nm:'梁山泊',nv:'shz',x:400,y:235,desc:'一百零八将聚义之地',ev:['天降青石"太虚将裂"','公孙胜天罡八阵','武松骑虎穿界门'],ch:['宋江','鲁智深','武松','公孙胜','林冲'],xr:'义石出土处，界门在后山'},
  {id:'jingyang',nm:'景阳冈',nv:'shz',x:415,y:250,desc:'武松打虎之地',ev:['武松打虎','虎妖实为黄袍怪巡山虎'],ch:['武松'],xr:'所打之虎是黄袍怪的巡山虎——因果链'},

  {id:'yanggu',nm:'阳谷县',nv:'shz',x:408,y:242,desc:'武松杀嫂之地',ev:['武松杀潘金莲西门庆'],ch:['武松'],xr:''},
  {id:'jiangzhou',nm:'江州（九江）',nv:'shz',x:410,y:295,desc:'宋江题反诗之地',ev:['宋江浔阳楼题反诗','梁山劫法场'],ch:['宋江','李逵'],xr:''},
  {id:'zhujiazhuang',nm:'祝家庄',nv:'shz',x:395,y:248,desc:'梁山三次攻打之地',ev:['三打祝家庄'],ch:['宋江','孙立'],xr:''},

  // 西游记
  {id:'huaguo',nm:'花果山',nv:'xyj',x:530,y:260,desc:'孙悟空出生之地，水帘洞所在',ev:['仙石生石猴','大闹天宫地脉震动','宝玉出家至此'],ch:['孙悟空'],xr:'灵石之界核心——仙石碎裂露出铜镜'},
  {id:'wuxing',nm:'五行山',nv:'xyj',x:490,y:340,desc:'如来镇压悟空之地',ev:['悟空被压五百年','异梦见宝玉','万界归一后山裂'],ch:['孙悟空'],xr:'悟空与宝玉在梦中初次感应——石头兄弟'},
  {id:'lingtai',nm:'灵台方寸山',nv:'xyj',x:360,y:120,desc:'菩提祖师道场',ev:['悟空学艺','七十二变'],ch:['孙悟空','菩提祖师'],xr:''},
  {id:'tianting',nm:'天庭',nv:'xyj',x:450,y:80,desc:'玉帝所居凌霄宝殿',ev:['悟空大闹天宫','太上老君八卦炉'],ch:['孙悟空','玉帝','太上老君'],xr:'大闹天宫地脉震——因果传导至荣国府祖坟'},
  {id:'changan-x',nm:'长安（出发）',nv:'xyj',x:318,y:208,desc:'唐僧取经出发地',ev:['唐僧领旨西行','水陆大会'],ch:['唐僧'],xr:''},
  {id:'lingshan',nm:'灵山',nv:'xyj',x:180,y:400,desc:'如来佛祖所在，取经终点',ev:['唐僧取经到达','取得真经'],ch:['唐僧','孙悟空'],xr:''},
  {id:'boyue',nm:'波月洞',nv:'xyj',x:455,y:330,desc:'黄袍怪（奎木狼）洞府',ev:['唐僧被掳','四将出征波月洞','帛书合卷出土'],ch:['黄袍怪','唐僧'],xr:'出师表与葬花吟合卷出土于此'},
  {id:'flame',nm:'火焰山',nv:'xyj',x:230,y:340,desc:'铁扇公主芭蕉洞所在',ev:['三借芭蕉扇','悟空借扇灭火'],ch:['孙悟空','铁扇公主','牛魔王'],xr:''},
  {id:'tongtian',nm:'通天河',nv:'xyj',x:290,y:300,desc:'取经第八十一难之地',ev:['老龟翻经'],ch:['唐僧','孙悟空'],xr:''},
];

let filter='all';
let active=null;

function init(){
  renderMarkers();
  renderSidebar();
}

function renderMarkers(){
  const g=document.getElementById('markers');
  g.innerHTML='';
  const show=new Set();
  L.forEach(l=>{
    const vis=filter==='all'||filter==='cross'||l.nv===filter;
    if(vis||(filter==='cross'&&l.xr)) show.add(l.id);
  });
  L.forEach(l=>{
    const vis=show.has(l.id);
    if(!vis) return;
    const c=N[l.nv].c;
    const mk=document.createElementNS('http://www.w3.org/2000/svg','g');
    mk.classList.add('mk');
    mk.setAttribute('data-id',l.id);
    mk.setAttribute('transform',`translate(${l.x},${l.y})`);
    mk.innerHTML=`<circle r="5" fill="${c}"/><text x="8" y="4">${l.nm}</text>`;
    mk.addEventListener('mouseenter',e=>showTip(e,l));
    mk.addEventListener('mouseleave',hideTip);
    mk.addEventListener('click',()=>selectLoc(l.id));
    g.appendChild(mk);
  });
  // Cross links
  const cl=document.getElementById('crossLinks');
  cl.setAttribute('opacity',(filter==='all'||filter==='cross')?'1':'0');
}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  const vis=L.filter(l=>filter==='all'||filter==='cross'||l.nv===filter||(filter==='cross'&&l.xr));
  let html=`<div class="sb-sec"><h3>统计</h3><div class="stats">
    <div class="stat"><div class="n">${vis.length}</div><div class="l">显示地点</div></div>
    <div class="stat"><div class="n">4</div><div class="l">名著</div></div>
    <div class="stat"><div class="n">${L.filter(l=>l.xr).length}</div><div class="l">跨界连接</div></div>
    <div class="stat"><div class="n">${new Set(L.flatMap(l=>l.ch)).size}</div><div class="l">关键人物</div></div>
  </div></div>`;
  html+=`<div class="sb-sec"><h3>地点列表</h3><div class="loc-list">`;
  vis.forEach(l=>{
    html+=`<div class="loc-item${active===l.id?' on':''}" onclick="selectLoc('${l.id}')">
      <div class="md" style="background:${N[l.nv].c}"></div>
      <div class="inf"><div class="nm">${l.nm}</div><div class="tg">${N[l.nv].n}${l.xr?' · 🔗':''}</div></div>
    </div>`;
  });
  html+=`</div></div>`;
  if(active){
    const l=L.find(x=>x.id===active);
    if(l){
      html+=`<div class="sb-sec"><h3>详情</h3><div class="dp">
        <h2>${l.nm}</h2>
        <div class="badge" style="background:${N[l.nv].c}">${N[l.nv].f}</div>
        <p style="font-size:14px;color:var(--text2);margin-bottom:8px">${l.desc}</p>
        <div style="font-size:12px;color:var(--text3);font-family:'Geist Mono',monospace;margin-bottom:4px">关键人物：${l.ch.join('、')}</div>`;
      if(l.ev.length){
        html+=`<div style="margin-top:8px">`;
        l.ev.forEach(e=>html+=`<div class="ev">${e}</div>`);
        html+=`</div>`;
      }
      if(l.xr){
        html+=`<div class="xr"><h4>🔗 四梦归一</h4><p>${l.xr}</p></div>`;
      }
      html+=`</div></div>`;
    }
  }
  sb.innerHTML=html;
}

function setFilter(f){
  filter=f;
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on',c.dataset.f===f);
  });
  active=null;
  renderMarkers();
  renderSidebar();
}

function selectLoc(id){
  active=active===id?null:id;
  renderSidebar();
  // Highlight marker
  document.querySelectorAll('.mk').forEach(m=>{
    m.style.opacity=(!active||m.dataset.id===active)?'1':'0.3';
  });
}

function showTip(e,l){
  const t=document.getElementById('tip');
  t.querySelector('.tn').textContent=l.nm;
  t.querySelector('.tt').textContent=N[l.nv].n;
  const r=document.getElementById('mapBox').getBoundingClientRect();
  t.style.left=(e.clientX-r.left+12)+'px';
  t.style.top=(e.clientY-r.top-10)+'px';
  t.classList.add('vis');
}
function hideTip(){document.getElementById('tip').classList.remove('vis')}

function toggleTheme(){
  const d=document.documentElement;
  const next=d.dataset.theme==='dark'?'':'dark';
  d.dataset.theme=next;
  localStorage.setItem('theme',next);
}

// Init theme
(function(){
  const saved=localStorage.getItem('theme');
  if(saved) document.documentElement.dataset.theme=saved;
  else if(window.matchMedia('(prefers-color-scheme:dark)').matches)
    document.documentElement.dataset.theme='dark';
})();

init();
</script>
</body>
</html>
