*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f5;--card:#fff;--text:#1a1a1a;--dim:#999;--border:#e8e4df;--accent:#333}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.top{position:sticky;top:0;z-index:50;background:rgba(250,248,245,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top a{color:var(--dim);text-decoration:none;font-size:13px}
.top h1{font-size:18px;font-weight:700}
.stats{font-size:12px;color:var(--dim);margin-left:auto}
.filters{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:14px;cursor:pointer;font-size:11px;transition:all .2s;font-family:inherit}
.fbtn:hover,.fbtn.on{border-color:var(--accent);background:var(--accent);color:#fff}
.search-box{padding:12px 20px;border-bottom:1px solid var(--border)}
.search-box input{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--card);outline:none}
.search-box input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px;max-width:1200px;margin:0 auto}
.bcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.bcard:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.08)}
.bcard .flag{font-size:28px;float:right;margin:-4px -4px 0 0}
.bcard .btitle{font-size:16px;font-weight:700;margin-bottom:4px;line-height:1.4}
.bcard .bauthor{font-size:13px;color:var(--dim);margin-bottom:8px}
.bcard .bmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bcard .bmeta span{font-size:11px;background:#f5f3f0;padding:2px 8px;border-radius:4px}
.bcard .stars{color:#f0a500;font-size:13px}
.bcard .indicators{display:flex;gap:6px;margin-top:8px}
.bcard .ind{font-size:10px;padding:2px 8px;border-radius:10px}
.bcard .ind.has{background:#e8f5e9;color:#2e7d32}
.bcard .ind.no{background:#f5f5f5;color:#bbb}
.empty{text-align:center;padding:60px;color:var(--dim);font-size:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>

let curCountry='',curGenre='',curSearch='';
function render(list){
const g=document.getElementById('grid');
if(!list.length){g.innerHTML='<div class="empty">没有匹配的书籍</div>';return}
g.innerHTML=list.map(b=>`<div class="bcard">
<div class="flag">${b.flag}</div>
<div class="btitle">${b.title}</div>
<div class="bauthor">${b.author} · ${b.year}</div>
<div class="bmeta"><span>${b.country}</span>${b.genre?`<span>${b.genre}</span>`:''}
</div>
<div class="stars">${b.stars}</div>
<div class="indicators">
<span class="ind ${b.has_text?'has':'no'}">${b.has_text?'📖 原文':'无原文'}</span>
<span class="ind ${b.has_note?'has':'no'}">${b.has_note?'📝 笔记':'无笔记'}</span>
</div>
</div>`).join('');
document.getElementById('stats').textContent=`${list.length}/${B.length}本 · 25国·2700年`;
}
function filterCountry(c,btn){
curCountry=c;curGenre='';curSearch='';
document.querySelectorAll('.filters').forEach(f=>f.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on')));
btn.classList.add('on');
render(B.filter(b=>b.country===c));
}
function filterGenre(g,btn){
curGenre=g;curCountry='';curSearch='';
document.querySelectorAll('.filters').forEach(f=>f.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on')));
btn.classList.add('on');
render(B.filter(b=>b.genre===g));
}
function resetFilter(btn){
curCountry='';curGenre='';curSearch='';
document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
btn.classList.add('on');
document.getElementById('search').value='';
render(B);
}
function doSearch(){
curSearch=document.getElementById('search').value.toLowerCase();
let list=B;
if(curCountry)list=list.filter(b=>b.country===curCountry);
if(curGenre)list=list.filter(b=>b.genre===curGenre);
if(curSearch)list=list.filter(b=>b.title.toLowerCase().includes(curSearch)||b.author.toLowerCase().includes(curSearch));
render(list);
}
render(B);
</script>
