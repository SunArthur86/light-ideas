    d.innerHTML=`<div class="flag">${flag}</div><div class="zh">${b.title_zh}</div><div class="en">${b.title}</div><div class="author">${b.author_zh} · ${yr}</div><span class="tag">${b.genre}</span>${why?`<div class="why">${why}</div>`:''}`;
    grid.appendChild(d);
  });
}
render(B);
function filter(c,btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(c==='all'?B:B.filter(b=>b.country===c));
}
</script>
</body>
