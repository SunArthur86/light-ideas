<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界名著精读 · 202本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1d1d1f;--dim:#86868b;--border:#e5e5e5;--accent:#1d1d1f;--blue:#0071e3;--blue-light:rgba(0,113,227,.1)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px}
.top a{color:var(--dim);text-decoration:none;font-size:13px}
.top h1{font-size:20px;font-weight:700;flex:1}
.search{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:14px;width:200px;outline:none;transition:border .2s}
.search:focus{border-color:var(--blue)}
.tabs{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#fff}
.tab{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:none;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.tab:hover{background:#f5f5f7}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{padding:16px 24px;font-size:13px;color:var(--dim)}
.stats b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px 24px 40px}

/* Card styles with left border */
.card{
  background:var(--card);border-radius:12px;border:1px solid var(--border);
  padding:20px;transition:all .3s ease;cursor:pointer;
  border-left:4px solid #d1d1d6;
  opacity:0;transform:translateY(24px);
}
.card.visible{opacity:1;transform:translateY(0);transition:opacity .5s ease,transform .5s ease,border-left-color .3s,box-shadow .3s}
.card:hover{
  border-left-color:var(--blue);
  box-shadow:0 4px 20px rgba(0,113,227,.12);
}
.card .flag{font-size:28px;margin-bottom:8px}
.card .title{font-size:16px;font-weight:600;margin-bottom:2px}
.card .en{font-size:12px;color:var(--dim);margin-bottom:6px}
.card .meta{font-size:12px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.card .meta span{background:#f5f5f7;padding:2px 8px;border-radius:8px}

/* Star rating */
.card .stars{margin-bottom:8px;font-size:13px;letter-spacing:1px;line-height:1}
.card .stars .on{color:#f5a623}
.card .stars .off{color:#d1d1d6}

/* Progress bar */
.card .progress-wrap{margin-top:10px}
.card .progress-label{font-size:11px;color:var(--dim);margin-bottom:4px;display:flex;justify-content:space-between}
.card .progress-bar{height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.card .progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),#34c759);transition:width 1s ease .5s}

/* Modal overlay */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  justify-content:center;align-items:center;padding:24px;
  animation:fadeIn .25s ease;
}
.modal-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.modal{
  background:#fff;border-radius:16px;max-width:520px;width:100%;
  max-height:80vh;overflow-y:auto;padding:32px;
  animation:slideUp .3s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
}
.modal .m-flag{font-size:40px;margin-bottom:12px}
.modal .m-title{font-size:24px;font-weight:700;margin-bottom:4px}
.modal .m-en{font-size:14px;color:var(--dim);margin-bottom:16px;font-style:italic}
.modal .m-info{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.modal .m-info span{background:#f5f5f7;padding:4px 12px;border-radius:10px;font-size:13px;color:var(--dim)}
.modal .m-stars{font-size:16px;letter-spacing:2px;margin-bottom:16px}
.modal .m-stars .on{color:#f5a623}
.modal .m-stars .off{color:#d1d1d6}
.modal .m-progress-wrap{margin-bottom:20px}
.modal .m-progress-label{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between}
.modal .m-progress-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.modal .m-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),#34c759)}
.modal .m-section-title{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.modal .m-desc{font-size:15px;line-height:1.7;color:#333;margin-bottom:20px}
.modal .m-close{
  display:block;width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;
  background:none;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)
}
.modal .m-close:hover{background:#f5f5f7}

/* === Responsive @media === */
@media(max-width:768px){
  .top{padding:12px 16px;flex-wrap:wrap;gap:10px}
  .top h1{font-size:17px;width:100%;flex:none}
  .search{width:100%;order:3}
  .tabs{padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;gap:6px}
  .tab{flex-shrink:0;white-space:nowrap;padding:6px 12px;font-size:12px}
  .stats{padding:10px 16px;font-size:12px}
  .grid{grid-template-columns:1fr;padding:12px 16px 32px;gap:12px}
  .card{padding:16px}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;width:100%;border-radius:16px 16px 0 0;max-height:90vh;padding:24px 20px 32px}
}
@media(max-width:480px){
  .top h1{font-size:15px}
  .search{font-size:13px;padding:6px 12px}
  .tab{padding:5px 10px;font-size:11px}
  .card{padding:14px 12px}
  .card .title{font-size:15px}
  .card .en{font-size:11px}
  .modal{padding:20px 16px 28px}
  .modal .m-title{font-size:20px}
}
</style>
</head>

const cs=[...new Set(B.map(b=>b.c).filter(Boolean))].sort();
let curC='全部',curE='全部';

function init(){
  var el=document.getElementById('ctabs');
  var h='<button class="tab on" onclick="setC(this)">全部</button>';
  cs.forEach(function(c){h+='<button class="tab" onclick="setC(this)">'+(F[c]||'')+' '+c+'</button>'});
  h+='<span style="width:16px"></span>';
  var eras=['全部','古代','中世纪','1500s','1600s','1700s','1800s','1900s'];
  eras.forEach(function(e,i){h+='<button class="tab'+(i===0?' on':'')+'" onclick="setE(this)">'+e+'</button>'});
  el.innerHTML=h;
  render();
}

function setC(el){
  var txt=el.textContent.trim();
  curC=txt.replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/[\u{1F1E0}-\u{1F1FF}][\u{1F1E0}-\u{1F1FF}]/gu,'').trim();
  if(curC==='全部')curC='全部';
  el.parentNode.querySelectorAll('.tab').forEach(function(t,i){if(i<=cs.length)t.classList.remove('on')});
  el.classList.add('on');render();
}

function setE(el){
  curE=el.textContent.trim();
  var tabs=el.parentNode.querySelectorAll('.tab');
  for(var i=cs.length+2;i<tabs.length;i++)tabs[i].classList.remove('on');
  el.classList.add('on');render();
}

      if(curE==='1900s'&&y<1900)return false;

  if(!list.length){g.innerHTML='<div style="text-align:center;padding:60px;color:#86868b">没有匹配的书籍</div>';return}

  g.innerHTML=list.map(function(b,i){
    var s=stars(b.y);
    var pr=progress(B.indexOf(b));
    return '<div class="card" data-idx="'+i+'" onclick="openModal('+B.indexOf(b)+')">'+
      '<div class="flag">'+(F[b.c]||'📖')+'</div>'+
      '<div class="title">'+b.t+'</div>'+
      '<div class="en">'+b.e+'</div>'+
      starHTML(s,13)+
      '<div class="meta">'+
        (b.a?'<span>'+b.a+'</span>':'')+
        (b.c?'<span>'+b.c+'</span>':'')+
        (b.y?'<span>'+b.y+'年</span>':'')+
      '</div>'+
      '<div class="progress-wrap">'+
        '<div class="progress-label"><span>阅读进度</span><span>'+pr+'%</span></div>'+
        '<div class="progress-bar"><div class="progress-fill" style="width:0%" data-w="'+pr+'"></div></div>'+
      '</div>'+
    '</div>';
  }).join('');

  /* IntersectionObserver for staggered entrance */
  observeCards();
}

/* Staggered entrance animation with IntersectionObserver */
var cardObserver=null;
function observeCards(){
  if(cardObserver) cardObserver.disconnect();
  var cards=document.querySelectorAll('.card');
  cardObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var idx=parseInt(entry.target.getAttribute('data-idx'))||0;
        setTimeout(function(){
          entry.target.classList.add('visible');
          /* Animate progress bar */
          var fill=entry.target.querySelector('.progress-fill');
          if(fill) fill.style.width=fill.getAttribute('data-w')+'%';
        },idx*60);
        cardObserver.unobserve(entry.target);
      }
    });
  },{threshold:0.1});
  cards.forEach(function(c){cardObserver.observe(c)});
}

/* Modal */
function openModal(idx){
  var b=B[idx];
  if(!b) return;
  var s=stars(b.y);
  var pr=progress(B.indexOf(b));
  var h='<div class="m-flag">'+(F[b.c]||'📖')+'</div>'+
    '<div class="m-title">'+b.t+'</div>'+
    '<div class="m-en">'+b.e+'</div>'+
    '<div class="m-info">'+
      (b.a?'<span>✍️ '+b.a+'</span>':'')+
      (b.c?'<span>'+(F[b.c]||'🌍')+' '+b.c+'</span>':'')+
      (b.y?'<span>📅 '+b.y+'年</span>':'')+
      (b.g?'<span>📂 '+b.g+'</span>':'')+
    '</div>'+
    '<div class="m-stars">'+starHTML(s,16)+'</div>'+
    '<div class="m-progress-wrap">'+
      '<div class="m-progress-label"><span>📖 阅读进度</span><span>'+pr+'%</span></div>'+
      '<div class="m-progress-bar"><div class="m-progress-fill" style="width:'+pr+'%"></div></div>'+
    '</div>'+
    '<div class="m-section-title">📖 作品简介</div>'+
    '<div class="m-desc">'+desc(b)+'</div>'+
    '<button class="m-close" onclick="closeModal()">关闭</button>';
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e&&e.target!==e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow='';
}

/* Close on Escape */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeModal();
});

/* 随机推荐 */
function randomClassic(){
  var idx=Math.floor(Math.random()*B.length);
  openModal(B[idx]);
}

/* 阅读进度持久化 */
var wcRead=JSON.parse(localStorage.getItem('wc-read')||'[]');
function markWcRead(title){
  if(wcRead.indexOf(title)<0){wcRead.push(title);localStorage.setItem('wc-read',JSON.stringify(wcRead))}
}
var _origOM=openModal;
openModal=function(b){markWcRead(b.t||'');_origOM(b)};

init();
</script>
</body>
