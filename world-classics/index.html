  h+='<span style="width:16px"></span>';
  var eras=['全部','古代','中世纪','1500s','1600s','1700s','1800s','1900s'];
  eras.forEach(function(e,i){h+='<button class="tab'+(i===0?' on':'')+'" onclick="setE(this)">'+e+'</button>'});
  el.innerHTML=h;
  render();
}
function setC(el){
  curC=el.textContent.trim().replace(/[^国本\s]/g,'').trim()||el.textContent.trim();
  // Extract country name - remove flag emoji
  var txt=el.textContent.trim();
  curC=txt.replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/[\u{1F0FF}-\u{1F1FF}][\u{1F1E0}-\u{1F1FF}]/g,'').trim();
  if(curC==='全部')curC='全部';
  el.parentNode.querySelectorAll('.tab').forEach(function(t,i){if(i<=cs.length)t.classList.remove('on')});
  el.classList.add('on');render();
}
function setE(el){
  curE=el.textContent.trim();
  var tabs=el.parentNode.querySelectorAll('.tab');
  for(var i=cs.length+2;i<tabs.length;i++)tabs[i].classList.remove('on');
  el.classList.add('on');render();
}
function render(){
  var q=document.querySelector('.search').value.toLowerCase();
  var list=B.filter(function(b){
    if(curC!=='全部'&&b.c!==curC)return false;
    if(curE!=='全部'){
      var y=b.y;
      if(curE==='古代'&&y>500)return false;
      if(curE==='中世纪'&&(y<500||y>=1500))return false;
      if(curE==='1500s'&&(y<1500||y>=1600))return false;
      if(curE==='1600s'&&(y<1600||y>=1700))return false;
      if(curE==='1700s'&&(y<1700||y>=1800))return false;
      if(curE==='1800s'&&(y<1800||y>=1900))return false;
      if(curE==='1900s'&&y<1900)return false;
    }
    if(q&&!((b.t+b.e+b.a+b.c).toLowerCase().indexOf(q)>=0))return false;
    return true;
  });
  document.getElementById('stats').innerHTML='<b>'+list.length+'</b> 本 · <b>'+new Set(list.map(function(b){return b.c})).size+'</b> 国 · <b>'+Math.min.apply(null,list.map(function(b){return b.y}))+'-'+Math.max.apply(null,list.map(function(b){return b.y}))+'</b>';
  var g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div style="text-align:center;padding:60px;color:#86868b">没有匹配的书籍</div>';return}
  g.innerHTML=list.map(function(b){return '<div class="card"><div class="flag">'+(F[b.c]||'📖')+'</div><div class="title">'+b.t+'</div><div class="en">'+b.e+'</div><div class="meta"><span>'+b.a+'</span><span>'+b.c+'</span><span>'+(b.y?b.y+'年':'')+'</span></div></div>'}).join('');
}
init();
</script>
</body>
</html>
