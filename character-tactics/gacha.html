<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>字阵·抽卡模拟器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1a1a1a;--text:#e0e0e0;--text2:#999;--text3:#555;--border:#222;--gold:#f1c40f;--purple:#9b59b6;--bronze:#cd7f32}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.hdr{text-align:center;padding:20px 16px 10px;width:100%}
.hdr h1{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{font-size:11px;color:var(--text3);margin-top:2px}
.bar{display:flex;gap:16px;align-items:center;padding:8px 20px;background:var(--surface);border-radius:10px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.bar .coin{font-size:14px;font-weight:700;color:var(--gold)}
.bar .pity{font-size:11px;color:var(--text2)}
.bar .prog{font-size:11px;color:var(--text2)}
.bar .prog b{color:var(--text)}
.gacha-area{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-single{background:linear-gradient(135deg,#2c3e50,#34495e);color:var(--text)}
.btn-single:hover{background:linear-gradient(135deg,#34495e,#3d566e)}
.btn-ten{background:linear-gradient(135deg,var(--gold),#e67e22);color:#000}
.btn-ten:hover{box-shadow:0 0 20px rgba(241,196,15,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.result-area{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;max-width:700px;width:100%;min-height:0}
@media(max-width:600px){.result-area{grid-template-columns:repeat(3,1fr)}}
.card-wrap{perspective:600px;aspect-ratio:5/7;opacity:0;transform:scale(.5);transition:all .4s}
.card-wrap.show{opacity:1;transform:scale(1)}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s}
.card-wrap.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.card-back{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid #333}
.card-back::after{content:'字';font-size:28px;font-weight:900;color:var(--text3);opacity:.3}
.card-front{transform:rotateY(180deg);padding:6px;text-align:center}
.card-front.r-传{background:linear-gradient(135deg,#1a0a00,#2a1500);border:2px solid var(--gold);box-shadow:0 0 12px rgba(241,196,15,.3)}
.card-front.r-精{background:linear-gradient(135deg,#0a0a1a,#15152a);border:2px solid var(--purple);box-shadow:0 0 8px rgba(155,89,182,.2)}
.card-front.r-普{background:var(--surface2);border:1px solid #333}
.card-front .nm{font-size:13px;font-weight:700;margin-top:4px}
.card-front .novel{font-size:9px;padding:1px 6px;border-radius:8px;color:#fff;margin:2px 0}
.card-front .role{font-size:8px;color:var(--text3);margin-top:2px}
.card-front .stars{font-size:8px;margin-top:3px}
.card-front .new-badge{position:absolute;top:4px;right:4px;background:var(--gold);color:#000;font-size:8px;font-weight:700;padding:1px 4px;border-radius:4px}
.card-front .own-badge{position:absolute;top:4px;right:4px;background:var(--text3);color:var(--text);font-size:7px;padding:1px 4px;border-radius:4px}
.burst{position:fixed;inset:0;pointer-events:none;z-index:100}
.burst.active{animation:burst .6s ease-out}
@keyframes burst{0%{background:radial-gradient(circle,rgba(241,196,15,.4),transparent 60%)}100%{background:transparent}}
.history{width:100%;max-width:700px;padding:10px 20px}
.history h3{font-size:12px;color:var(--text3);margin-bottom:6px}
.history .h-item{display:inline-block;font-size:10px;padding:2px 6px;margin:1px;border-radius:4px}
.history .h-item.r-传{background:#2a1500;color:var(--gold)}
.history .h-item.r-精{background:#15152a;color:var(--purple)}
.history .h-item.r-普{background:var(--surface);color:var(--text2)}
.collection-toggle{text-align:center;padding:10px}
.collection-toggle button{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:6px 16px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.collection-toggle button:hover{border-color:var(--text3)}
.coll-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:10px 20px;max-width:700px;width:100%}
@media(max-width:600px){.coll-grid{grid-template-columns:repeat(8,1fr)}}
.coll-item{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:default}
.coll-item.owned{color:#fff}.coll-item.missing{background:var(--surface);color:var(--text3);opacity:.3}
</style>
</head>

    const isNew=!owned.has(c.n);
    owned.add(c.n);
    history.unshift({n:c.n,r:c.r,nv:c.nv,isNew});
  });
  if(history.length>40)history.length=40;
  updateUI();
}

function showResults(results){
  const el=document.getElementById('results');
  const hasLeg=results.some(c=>c.r==='传');
  el.innerHTML=results.map((c,i)=>{
    const nv=NV[c.nv];const isNew=!history.some(h=>h.n===c.n)||i===0;
    const total=c.s.reduce((a,b)=>a+b,0);
    const stars='★'.repeat(Math.min(Math.floor(total/7),5))+'☆'.repeat(5-Math.min(Math.floor(total/7),5));
    return `<div class="card-wrap" style="transition-delay:${i*0.1}s">
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front r-${c.r}">
          ${isNew&&!history.some((h,idx)=>idx>0&&h.n===c.n)?'<span class="new-badge">NEW</span>':'<span class="own-badge">已拥有</span>'}
          <div class="novel" style="background:${nv.c}">${nv.n}</div>
          <div class="nm" style="color:${c.r==='传'?'#f1c40f':c.r==='精'?'#9b59b6':'#ccc'}">${c.n}</div>
          <div class="role">${c.d}</div>
          <div class="stars" style="color:${c.r==='传'?'#f1c40f':c.r==='精'?'#9b59b6':'#666'}">${stars}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  // Animate: show then flip
  requestAnimationFrame(()=>{
    el.querySelectorAll('.card-wrap').forEach((w,i)=>{
      setTimeout(()=>w.classList.add('show'),i*80);
      setTimeout(()=>w.classList.add('flipped'),i*80+200);
    });
  });
  if(hasLeg){
    const b=document.getElementById('burst');
    b.classList.add('active');
    setTimeout(()=>b.classList.remove('active'),700);
  }
}

function updateUI(){
  document.getElementById('coins').textContent=coins;
  document.getElementById('pity5').textContent=pity5;
  document.getElementById('pity4').textContent=pity4;
  document.getElementById('collCount').textContent=owned.size;
  document.querySelector('.btn-single').disabled=coins<100;
  document.querySelector('.btn-ten').disabled=coins<900;
  // History
  const h=document.getElementById('historyList');
  h.innerHTML=history.slice(0,20).map(x=>`<span class="h-item r-${x.r}">${x.n}</span>`).join('');
}

function toggleCollection(){
  const el=document.getElementById('collection');
  if(el.style.display==='none'){
    el.style.display='grid';
    el.innerHTML=D.map(c=>{
      const nv=NV[c.nv];const o=owned.has(c.n);
      return `<div class="coll-item ${o?'owned':'missing'}" style="background:${o?nv.c+'33':''}" title="${c.n}(${NV[c.nv].n})">${o?c.n.charAt(0):'?'}</div>`;
    }).join('');
  }else el.style.display='none';
}

</script>
