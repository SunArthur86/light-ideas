<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字阵 · 角色卡牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f5;--card:#fff;--text:#1a1a1a;--dim:#999;--border:#e8e4df;--accent:#333}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.top{position:sticky;top:0;z-index:50;background:rgba(250,248,245,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top a{color:var(--dim);text-decoration:none;font-size:13px}
.top h1{font-size:18px;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.fbtn{background:var(--card);border:1px solid var(--border);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;transition:all .2s;font-family:inherit}
.fbtn:hover,.fbtn.on{border-color:var(--accent);background:var(--accent);color:#fff}
.stats-bar{padding:8px 20px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--border);display:flex;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:16px 12px 12px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.1)}
.card .rank-badge{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 8px;border-radius:10px;color:#fff;font-weight:700}
.card .elem{font-size:20px;text-align:center;margin:2px 0}
.card .cname{text-align:center;font-size:15px;font-weight:700;margin:4px 0 2px}
.card .cfrom{text-align:center;font-size:11px;font-weight:600}
.card .radar-mini{display:flex;justify-content:center;margin:6px auto 4px}
.card .mini-stats{display:flex;justify-content:center;gap:3px;margin-top:6px;flex-wrap:wrap}
.card .mini-stats span{font-size:10px;background:#f5f3f0;padding:1px 5px;border-radius:4px}
.card .total{text-align:center;font-size:12px;color:var(--dim);margin-top:4px}
/* Novel color accents */
.card[data-novel="hlm"]{border-left:3px solid #e74c3c}
.card[data-novel="sgy"]{border-left:3px solid #f39c12}
.card[data-novel="xyj"]{border-left:3px solid #27ae60}
.card[data-novel="shz"]{border-left:3px solid #3498db}
/* Modal */
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;overflow-y:auto;backdrop-filter:blur(4px)}
.mo.show{display:flex;justify-content:center;align-items:flex-start;padding:40px 20px}
.modal{background:#fff;border-radius:20px;max-width:520px;width:100%;padding:32px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal .close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:24px;cursor:pointer;color:#999}
.modal .mhead{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.modal .mhead h2{font-size:22px;margin:8px 0 4px}
.modal .mhead .mfrom{font-size:13px;color:var(--dim)}
.modal .radar-wrap{display:flex;justify-content:center;margin:16px 0}
.modal .detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.modal .detail-stats .st{text-align:center;padding:8px;background:#f9f7f4;border-radius:8px}
.modal .detail-stats .st .sv{font-size:20px;font-weight:700}
.modal .detail-stats .st .sl{font-size:11px;color:var(--dim)}
.modal .skills{margin-top:16px}
.modal .skills h3{font-size:14px;font-weight:700;margin-bottom:8px}
.modal .sk{font-size:13px;line-height:1.6;padding:8px 12px;background:#f9f7f4;border-radius:8px;margin-bottom:6px}
.modal .sk b{color:var(--accent)}
/* Rank colors */
.rank-传说{background:linear-gradient(135deg,#ff6b35,#ff8f5e)!important}
.rank-精英{background:linear-gradient(135deg,#8b5cf6,#a78bfa)!important}
.rank-普通{background:linear-gradient(135deg,#6b7280,#9ca3af)!important}
@media(max-width:600px){
 .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px}
 .top{padding:10px 12px}
 .modal{padding:20px;margin:10px}
}
</style>
</head>

var RC={'传说':'#ff6b35','精英':'#8b5cf6','普通':'#6b7280'};
var SL={'MAR':'武力','INT':'智力','BEN':'魅力','LOY':'忠诚','SPI':'法力','SPD':'运气'};

function render(list){
  var g=document.getElementById('grid');
  g.innerHTML='';
  document.getElementById('count').textContent='显示 '+list.length+' 张卡牌';
  var html='';
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var rc=RC[c.rank]||'#666';
    var statsHtml='';
    var sk=Object.keys(c.stats);
    for(var j=0;j<sk.length;j++){
      statsHtml+='<span>'+SL[sk[j]]+c.stats[sk[j]]+'</span>';
    }
    html+='<div class="card" data-novel="'+c.nk+'" onclick="detail('+i+')">'
      +'<div class="rank-badge rank-'+c.rank+'">'+c.rank+'</div>'
      +'<div class="elem">'+c.emoji+'</div>'
      +'<div class="cname">'+c.name+'</div>'
      +'<div class="cfrom" style="color:'+c.color+'">'+c.novel+'</div>'
      +'<div class="radar-mini">'+c.mr+'</div>'
      +'<div class="mini-stats">'+statsHtml+'</div>'
      +'<div class="total">总战力 '+c.total+'</div>'
      +'</div>';
  }
  g.innerHTML=html;
  window._list=list;
}

render(D);

function filter(t,btn){
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  if(t==='all') return render(D);
  if(['hlm','sgy','shz','xyj'].indexOf(t)>=0) return render(D.filter(function(c){return c.nk===t}));
  return render(D.filter(function(c){return c.rank===t}));
}

function detail(i){
  var c=window._list[i];
  if(!c) return;
  var rc=RC[c.rank]||'#666';
  var statsHtml='';
  var sk=Object.keys(c.stats);
  for(var j=0;j<sk.length;j++){
    statsHtml+='<div class="st"><div class="sv" style="color:'+c.color+'">'+c.stats[sk[j]]+'</div><div class="sl">'+SL[sk[j]]+'</div></div>';
  }
  document.getElementById('md').innerHTML=
    '<div class="mhead">'
    +'<span style="font-size:40px">'+c.emoji+'</span>'
    +'<h2 style="color:'+c.color+'">'+c.name+'</h2>'
    +'<div class="mfrom">'+c.novel+' · <span style="color:'+rc+'">'+c.rank+'</span> · '+c.skill+'</div>'
    +'</div>'
    +'<div class="radar-wrap">'+c.r+'</div>'
    +'<div class="detail-stats">'+statsHtml+'</div>'
    +'<div class="skills"><h3>技能</h3>'+c.sh+'</div>';
  document.getElementById('ov').classList.add('show');
  document.body.style.overflow='hidden';
}

function close_(){
  document.getElementById('ov').classList.remove('show');
  document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') close_();
});
</script>
</body>
</html>
