<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--surface:#f5f5f7;--text:#1d1d1f;--text2:#6e6e73;--accent:#ef4444;--border:#e5e5e5}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06);height:48px;display:flex;align-items:center;padding:0 20px;gap:16px}
nav .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
nav .title{font-size:15px;font-weight:600}
.filters{max-width:1200px;margin:24px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:6px 16px;border-radius:100px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s}
.filters button:hover{border-color:#aaa}
.filters button.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.stats-bar{max-width:1200px;margin:16px auto 0;padding:0 24px;font-size:13px;color:var(--text2)}
.grid{max-width:1200px;margin:16px auto 0;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:#fff;border-radius:16px;padding:20px 16px;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.card .emoji{font-size:28px;margin-bottom:8px}
.card .name{font-size:16px;font-weight:600;margin-bottom:4px}
.card .novel-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:100px;margin-bottom:8px}
.card .tier{font-size:11px;color:var(--text2);margin-bottom:8px}
.card .stat-row{display:flex;flex-wrap:wrap;gap:4px}
.card .stat{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--surface)}
.card .skill-label{font-size:11px;color:var(--text2);margin-top:8px;line-height:1.4}
footer{text-align:center;padding:40px;border-top:1px solid var(--border);color:var(--text2);font-size:13px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

];
const grid=document.getElementById('grid');
const STAT_NAMES={MAR:'武力',INT:'智力',BEN:'仁爱',LOY:'忠诚',SPI:'灵力',SPD:'速度'};
function render(list){
  grid.innerHTML='';
  list.forEach(c=>{
    const d=document.createElement('div');
    d.className='card';d.dataset.nk=c.nk;
    d.style.setProperty('--c',c.color);
    d.querySelector?.('::before')?.style;
    let stats='';
    Object.entries(c.stats).forEach(([k,v])=>{
      stats+=`<span class="stat">${STAT_NAMES[k]||k} ${v}</span>`;
    });
    d.innerHTML=`
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${c.color};border-radius:16px 16px 0 0"></div>
      <div class="emoji">${c.emoji}</div>
      <div class="name">${c.name}</div>
      <span class="novel-tag" style="background:${c.color}15;color:${c.color}">${c.novel}</span>
      <div class="tier">${c.tier}</div>
      <div class="stat-row">${stats}</div>
      <div class="skill-label">${c.skill}</div>
    `;
    grid.appendChild(d);
  });
  document.getElementById('statsBar').textContent=`共 ${list.length} 张角色卡牌`;
}
render(C);
function filter(nk,btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(nk==='all'?C:C.filter(c=>c.nk===nk));
}
</script>
