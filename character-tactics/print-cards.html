<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字阵·打印卡牌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--text:#e0e0e0;--text2:#999;--text3:#555;--border:#222;--gold:#f1c40f;--purple:#9b59b6;--bronze:#cd7f32}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px}
.hdr{text-align:center;margin-bottom:12px}
.hdr h1{font-size:20px;font-weight:900}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.ctrl button{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.ctrl button:hover,.ctrl button.on{border-color:var(--text3);color:var(--text)}
.ctrl .print-btn{background:linear-gradient(135deg,var(--gold),#e67e22);color:#000;border:none;font-weight:700}
.page{display:grid;grid-template-columns:repeat(3,63mm);grid-template-rows:repeat(3,88mm);gap:2mm;justify-content:center;margin-bottom:10px}
.card{border:1px solid #333;border-radius:6px;padding:4mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.card.r-传{border-color:var(--gold);background:linear-gradient(135deg,#1a0a00,#2a1500)}
.card.r-精{border-color:var(--purple);background:linear-gradient(135deg,#0a0a1a,#15152a)}
.card.r-普{border-color:#444;background:var(--surface)}
.card .novel-tag{font-size:2.5mm;padding:0.5mm 2mm;border-radius:2mm;color:#fff;position:absolute;top:2mm;right:2mm}
.card .name{font-size:4mm;font-weight:900;margin-top:3mm}
.card.r-传 .name{color:var(--gold)}
.card.r-精 .name{color:var(--purple)}
.card .rarity{font-size:2mm;color:var(--text3)}
.card svg{width:20mm;height:20mm;margin:1mm 0}
.card .role{font-size:2.2mm;color:var(--text2);text-align:center}
.card .footer{font-size:1.8mm;color:var(--text3);margin-top:auto;padding-top:1mm;border-top:1px solid #333;width:100%;text-align:center}
@media print{
  body{background:#fff;color:#000}
  .hdr,.ctrl{display:none}
  .page{page-break-after:always}
  .card{border-color:#ccc;background:#fff !important;color:#000}
  .card .name{color:#000 !important}
  .card .role,.card .rarity,.card .footer{color:#555}
}
</style>
</head>

let filterNV='all',filterR='all';

function init(){
  const ctrl=document.getElementById('ctrl');
  ctrl.innerHTML=`
    <button class="on" data-nv="all" onclick="setNV(this)">全部</button>
    <button data-nv="hlm" onclick="setNV(this)">红楼梦</button>
    <button data-nv="sgy" onclick="setNV(this)">三国</button>
    <button data-nv="shz" onclick="setNV(this)">水浒</button>
    <button data-nv="xyj" onclick="setNV(this)">西游</button>
    <span style="width:8px"></span>
    <button class="on" data-r="all" onclick="setR(this)">全稀有度</button>
    <button data-r="传" onclick="setR(this)">传说</button>
    <button data-r="精" onclick="setR(this)">精英</button>
    <button data-r="普" onclick="setR(this)">普通</button>
    <span style="width:8px"></span>
    <button class="print-btn" onclick="window.print()">🖨️ 打印</button>`;
  render();
}

function setNV(el){document.querySelectorAll('[data-nv]').forEach(b=>b.classList.remove('on'));el.classList.add('on');filterNV=el.dataset.nv;render()}
function setR(el){document.querySelectorAll('[data-r]').forEach(b=>b.classList.remove('on'));el.classList.add('on');filterR=el.dataset.r;render()}

function radarSVG(s,color){
  const labels=['武','智','体','速','意','技'];
  const max=10,cx=30,cy=30,r=22;
  const pts=s.map((v,i)=>{
    const a=-Math.PI/2+i*Math.PI*2/6;
    const d=v/max*r;
    return `${cx+d*Math.cos(a)},${cy+d*Math.sin(a)}`;
  });
  const grid=[1,2,3,4,5].map(l=>{
    const p=[];for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI*2/6;const d=l/5*r;p.push(`${cx+d*Math.cos(a)},${cy+d*Math.sin(a)}`)}
    return `<polygon points="${p.join(' ')}" fill="none" stroke="#333" stroke-width=".3"/>`;
  });
  const axes=[0,1,2,3,4,5].map(i=>{const a=-Math.PI/2+i*Math.PI*2/6;return`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#333" stroke-width=".3"/>`});
  const lbl=[0,1,2,3,4,5].map(i=>{const a=-Math.PI/2+i*Math.PI*2/6;const d=r+5;return`<text x="${cx+d*Math.cos(a)}" y="${cy+d*Math.sin(a)}" text-anchor="middle" dominant-baseline="middle" fill="${color}" font-size="3">${labels[i]}${s[i]}</text>`});
  return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${grid.join('')}${axes.join('')}<polygon points="${pts.join(' ')}" fill="${color}22" stroke="${color}" stroke-width=".8"/>${lbl.join('')}</svg>`;
}

function render(){
  let list=D.filter(c=>{
    if(filterNV!=='all'&&c.nv!==filterNV)return false;
    if(filterR!=='all'&&c.r!==filterR)return false;
    return true;
  });
  const pages=document.getElementById('pages');
  let html='';
  for(let i=0;i<list.length;i+=9){
    const batch=list.slice(i,i+9);
    html+=`<div class="page">${batch.map(c=>{
      const nv=NV[c.nv];
      const rn=c.r==='传'?'传说':c.r==='精'?'精英':'普通';
      return `<div class="card r-${c.r}">
        <div class="novel-tag" style="background:${nv.c}">${nv.n}</div>
        <div class="name">${c.n}</div>
        <div class="rarity">${'★'.repeat(c.r==='传'?5:c.r==='精'?3:1)} ${rn}</div>
        ${radarSVG(c.s,nv.c)}
        <div class="role">${c.d}</div>
        <div class="footer">字阵·四大名著卡牌对战</div>
      </div>`;
    }).join('')}</div>`;
  }
  pages.innerHTML=html;
}
