<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字阵 · 96角色卡牌图鉴</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#141414;--border:#222;--text:#ededed;--text2:#888;--text3:#555}
html{font-size:14px}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hdr{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.5px}.hdr .sub{font-size:12px;color:var(--text3)}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--border);align-items:center}
.search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;width:200px;outline:none}
.search:focus{border-color:var(--text3)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;background:var(--surface);color:var(--text2);user-select:none;transition:.15s}
.chip.on{color:#fff}
.chip .d{width:6px;height:6px;border-radius:50%}
.ch-all.on{background:var(--text);color:var(--bg)}
.ch-hlm .d{background:#c0392b}.ch-hlm.on{background:#c0392b}
.ch-sgy .d{background:#27ae60}.ch-sgy.on{background:#27ae60}
.ch-shz .d{background:#2980b9}.ch-shz.on{background:#2980b9}
.ch-xyj .d{background:#d4a017}.ch-xyj.on{background:#d4a017}
.ch-r{font-size:10px;padding:3px 8px}
.ch-r-chuan.on{background:#f1c40f;color:#000}
.ch-r-jing.on{background:#3498db}
.ch-r-pu.on{background:#95a5a6}
.stats{padding:8px 24px;font-size:12px;color:var(--text3);border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:var(--text3)}
.card .r-badge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;color:#000}
.card .nv-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;margin-bottom:6px}
.card .name{font-size:16px;font-weight:700;margin-bottom:4px}
.card .desc{font-size:11px;color:var(--text2);margin-bottom:8px}
.radar-wrap{width:80px;height:80px;margin:0 auto 4px}
.radar-wrap svg{width:100%;height:100%}
.stats-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-family:monospace}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .m-nv{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;color:#fff;margin-bottom:8px}
.modal .m-r{font-size:12px;color:var(--text3);margin-bottom:12px}
.modal .m-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px;text-align:center}
.modal .m-stat .v{font-size:16px;font-weight:700}.modal .m-stat .l{font-size:9px;color:var(--text3)}
.modal .close{float:right;cursor:pointer;font-size:20px;color:var(--text3)}
.modal .close:hover{color:var(--text)}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:8px}}
</style>
</head>

  const cx=40,cy=40,rad=28;
  const pts=s.map((v,i)=>{const a=-Math.PI/2+i*Math.PI/3;const d=v/10*rad;return[cx+Math.cos(a)*d,cy+Math.sin(a)*d]});
  const grid=[2,4,6,8,10].map(v=>s.map((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;const d=v/10*rad;return[cx+Math.cos(a)*d,cy+Math.sin(a)*d]}));
  let svg='<svg viewBox="0 0 80 80">';
  grid.forEach(g=>{svg+=`<polygon points="${g.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#333" stroke-width=".5"/>`});
  svg+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${RC[rar]}33" stroke="${RC[rar]}" stroke-width="1.5"/>`;
  s.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/3;const d=10/10*rad;svg+=`<text x="${cx+Math.cos(a)*d}" y="${cy+Math.sin(a)*d}" text-anchor="middle" dominant-baseline="middle" fill="#555" font-size="5">${SL[i]}</text>`});
  svg+='</svg>';
  return svg;
}

function render(){
  let list=D.filter(c=>{
    if(fNovel!=='all'&&c.nv!==fNovel) return false;
    if(!fRarity.has(c.r)) return false;
    if(fSearch&&!c.n.includes(fSearch)&&!c.d.includes(fSearch)&&!NV[c.nv].n.includes(fSearch)) return false;
    return true;
  });
  document.getElementById('stats').textContent=`显示 ${list.length} / ${D.length} 张卡牌`;
  const g=document.getElementById('grid');
  g.innerHTML=list.map((c,i)=>{
    const idx=D.indexOf(c);
    return `<div class="card" onclick="showModal(${idx})" style="border-top:3px solid ${RC[c.r]}">
      <div class="r-badge" style="background:${RC[c.r]}">${RL[c.r]}</div>
      <div class="nv-tag" style="background:${NV[c.nv].c}">${NV[c.nv].n}</div>
      <div class="name">${c.n}</div>
      <div class="desc">${c.d}</div>
      <div class="radar-wrap">${radarSVG(c.s,c.r)}</div>
      <div class="stats-row">${c.s.map((v,i)=>`<span>${SL[i]}${v}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

function setF(el){
  document.querySelectorAll('.chip:not(.ch-r)').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');fNovel=el.dataset.f;render();
}
function setR(el){
  const r=el.dataset.r;
  if(fRarity.has(r)){fRarity.delete(r);el.classList.remove('on')}else{fRarity.add(r);el.classList.add('on')}
  render();
}
function filterCards(){fSearch=document.querySelector('.search').value;render();}

function showModal(idx){
  const c=D[idx];
  const m=document.getElementById('modal');
  m.innerHTML=`
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>${c.n}</h2>
    <div class="m-nv" style="background:${NV[c.nv].c}">${NV[c.nv].n}</div>
    <div class="m-r">${RL[c.r]} · ${c.d}</div>
    <div style="width:120px;height:120px;margin:0 auto 12px">${radarSVG(c.s,c.r).replace('viewBox="0 0 80 80"','viewBox="0 0 80 80"').replace(/font-size="5"/g,'font-size="7"')}</div>
    <div class="m-stats">${c.s.map((v,i)=>`<div class="m-stat"><div class="v" style="color:${RC[c.r]}">${v}</div><div class="l">${SL[i]}</div></div>`).join('')}</div>
    <div style="font-size:12px;color:var(--text2);text-align:center">总属性点: ${c.s.reduce((a,b)=>a+b,0)}</div>
  `;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}

/* === DEPLOY MODE === */
let deployMode=false, board=Array(16).fill(null), selectedChar=null;

function toggleDeploy(){
  deployMode=!deployMode;
  document.getElementById('deployBtn').textContent=deployMode?'返回图鉴':'⚔️ 部署模拟';
  document.getElementById('grid').style.display=deployMode?'none':'grid';
  document.getElementById('deployPanel').style.display=deployMode?'flex':'none';
  if(deployMode) renderDeploy();
  else render();
}

function renderDeploy(){
  const p=document.getElementById('deployPanel');
  // Build 4x4 board
  let boardHtml='<div style="display:flex;flex-direction:column;gap:2px">';
  const terrains=['山','林','平','水','城','平','平','平','平','平','林','山','水','平','城','林'];
  const tColors={'山':'#8B6914','林':'#2d5016','平':'#333','水':'#1a5276','城':'#555','火':'#8B0000'};
  for(let r=0;r<4;r++){
    boardHtml+='<div style="display:flex;gap:2px">';
    for(let c=0;c<4;c++){
      const idx=r*4+c;
      const ch=board[idx];
      const t=terrains[idx];
      const bg=tColors[t]||'#333';
      boardHtml+=`<div class="board-cell" data-idx="${idx}" onclick="placeChar(${idx})" ondragover="event.preventDefault()" ondrop="dropChar(event,${idx})" style="width:90px;height:90px;background:${bg};border:1px solid ${ch?'#fff':'#555'};border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .2s">`;
      boardHtml+=`<div style="position:absolute;top:2px;left:4px;font-size:9px;color:#888">${t}</div>`;
      if(ch){
        const char=D.find(x=>x.n===ch);
        if(char){
          boardHtml+=`<div style="font-size:10px;font-weight:bold;color:${NV[char.nv].c}">${ch}</div>`;
          boardHtml+=`<div style="font-size:8px;color:#aaa">${char.r[0]} ${char.s.reduce((a,b)=>a+b,0)}点</div>`;
        }
      } else {
        boardHtml+=`<div style="font-size:9px;color:#555">空</div>`;
      }
      boardHtml+='</div>';
    }
    boardHtml+='</div>';
  }
  boardHtml+='</div>';

  // Character selection list
  const deployed=new Set(board.filter(Boolean));
  let listHtml='<div style="max-height:400px;overflow-y:auto;width:220px">';
  listHtml+=`<div style="padding:8px;border-bottom:1px solid #333"><input id="deploySearch" placeholder="搜索角色..." oninput="filterDeployList()" style="width:100%;background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#fff;padding:4px 8px;font-size:12px"></div>`;
  listHtml+='<div id="deployList">';
  const sorted=[...D].sort((a,b)=>b.s.reduce((x,y)=>x+y,0)-a.s.reduce((x,y)=>x+y,0));
  sorted.forEach(char=>{
    if(deployed.has(char.n)) return;
    listHtml+=`<div class="deploy-char-item" data-name="${char.n}" draggable="true" ondragstart="dragChar(event,'${char.n}')" onclick="selectForDeploy('${char.n}')" style="padding:4px 8px;cursor:pointer;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:6px;font-size:11px">`;
    listHtml+=`<div style="width:8px;height:8px;border-radius:50%;background:${NV[char.nv].c}"></div>`;
    listHtml+=`<span>${char.n}</span>`;
    listHtml+=`<span style="color:#666;font-size:9px">${char.r} ${char.s.reduce((a,b)=>a+b,0)}点</span>`;
    listHtml+='</div>';
  });
  listHtml+='</div></div>';

  // Stats
  const deployedChars=board.filter(Boolean).map(n=>D.find(x=>x.n===n)).filter(Boolean);
  let statsHtml='<div style="margin-top:12px;padding:8px;background:#1a1a1a;border-radius:6px;font-size:11px">';
  statsHtml+=`<div style="color:#888;margin-bottom:4px">已部署 ${deployedChars.length}/4</div>`;
  if(deployedChars.length>0){
    const totals=['MAR','INT','BEN','LOY','SPI','SPD'].map((s,i)=>{
      const sum=deployedChars.reduce((a,c)=>a+c.s[i],0);
      return `${s}:${sum}`;
    }).join(' ');
    statsHtml+=`<div style="color:#ccc">${totals}</div>`;
    // Check resonance
    const novels=deployedChars.map(c=>c.nv);
    const unique=new Set(novels);
    if(unique.size>=4) statsHtml+=`<div style="color:#f1c40f;margin-top:4px">✨ 四书共鸣！全属性+2</div>`;
    if(unique.size>=3) statsHtml+=`<div style="color:#2ecc71;margin-top:4px">📖 三书联合作战</div>`;
    const nvs=[...novels];
    if(nvs.length===4 && new Set(nvs).size===4) statsHtml+=`<div style="color:#9b59b6;margin-top:4px">🌟 四界归一阵！</div>`;
  }
  statsHtml+=`<button onclick="clearBoard()" style="margin-top:8px;background:#333;border:1px solid #555;color:#aaa;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px">清空棋盘</button>`;
  statsHtml+='</div>';

  p.innerHTML=`<div style="display:flex;gap:16px;align-items:flex-start">
    <div><h3 style="font-size:14px;margin-bottom:8px;color:#888">阵位部署（拖拽或点击）</h3>${boardHtml}${statsHtml}</div>
    <div><h3 style="font-size:14px;margin-bottom:8px;color:#888">选择角色</h3>${listHtml}</div>
  </div>`;
}

function selectForDeploy(name){
  selectedChar=name;
  document.querySelectorAll('.deploy-char-item').forEach(el=>{
    el.style.background=el.dataset.name===name?'#2a2a2a':'';
  });
}

function placeChar(idx){
  if(selectedChar){
    // Remove from other slots
    const otherIdx=board.indexOf(selectedChar);
    if(otherIdx>=0) board[otherIdx]=null;
    board[idx]=selectedChar;
    selectedChar=null;
    renderDeploy();
  } else if(board[idx]){
    // Remove from board
    board[idx]=null;
    renderDeploy();
  }
}

function dragChar(e,name){e.dataTransfer.setData('text',name);}
function dropChar(e,idx){
  e.preventDefault();
  const name=e.dataTransfer.getData('text');
  const otherIdx=board.indexOf(name);
  if(otherIdx>=0) board[otherIdx]=null;
  board[idx]=name;
  renderDeploy();
}

function clearBoard(){board=Array(16).fill(null);selectedChar=null;renderDeploy();}

function filterDeployList(){
  const q=document.getElementById('deploySearch').value.toLowerCase();
  document.querySelectorAll('.deploy-char-item').forEach(el=>{
    el.style.display=el.dataset.name.toLowerCase().includes(q)?'':'none';
  });
}

render();
</script>
</body>
</html>
