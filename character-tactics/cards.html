<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#141414;--border:#222;--text:#ededed;--text2:#888;--text3:#555}
html{font-size:14px}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hdr{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.5px}.hdr .sub{font-size:12px;color:var(--text3)}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--border);align-items:center}
.search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;width:200px;outline:none}
.search:focus{border-color:var(--text3)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;background:var(--surface);color:var(--text2);user-select:none;transition:.15s}
.chip.on{color:#fff}
.chip .d{width:6px;height:6px;border-radius:50%}
.ch-all.on{background:var(--text);color:var(--bg)}
.ch-hlm .d{background:#c0392b}.ch-hlm.on{background:#c0392b}
.ch-sgy .d{background:#27ae60}.ch-sgy.on{background:#27ae60}
.ch-shz .d{background:#2980b9}.ch-shz.on{background:#2980b9}
.ch-xyj .d{background:#d4a017}.ch-xyj.on{background:#d4a017}
.ch-r{font-size:10px;padding:3px 8px}
.ch-r-chuan.on{background:#f1c40f;color:#000}
.ch-r-jing.on{background:#3498db}
.ch-r-pu.on{background:#95a5a6}
.stats{padding:8px 24px;font-size:12px;color:var(--text3);border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:var(--text3)}
.card .r-badge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;color:#000}
.card .nv-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;margin-bottom:6px}
.card .name{font-size:16px;font-weight:700;margin-bottom:4px}
.card .desc{font-size:11px;color:var(--text2);margin-bottom:8px}
.radar-wrap{width:80px;height:80px;margin:0 auto 4px}
.radar-wrap svg{width:100%;height:100%}
.stats-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-family:monospace}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .m-nv{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;color:#fff;margin-bottom:8px}
.modal .m-r{font-size:12px;color:var(--text3);margin-bottom:12px}
.modal .m-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px;text-align:center}
.modal .m-stat .v{font-size:16px;font-weight:700}.modal .m-stat .l{font-size:9px;color:var(--text3)}
.modal .close{float:right;cursor:pointer;font-size:20px;color:var(--text3)}
.modal .close:hover{color:var(--text)}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:8px}}
</style>
</head>

  s.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/3;const d=10/10*rad;svg+=`<text x="${cx+Math.cos(a)*d}" y="${cy+Math.sin(a)*d}" text-anchor="middle" dominant-baseline="middle" fill="#555" font-size="5">${SL[i]}</text>`});
  svg+='</svg>';
  return svg;
}

function render(){
  let list=D.filter(c=>{
    if(fNovel!=='all'&&c.nv!==fNovel) return false;
    if(!fRarity.has(c.r)) return false;
    if(fSearch&&!c.n.includes(fSearch)&&!c.d.includes(fSearch)&&!NV[c.nv].n.includes(fSearch)) return false;
    return true;
  });
  document.getElementById('stats').textContent=`显示 ${list.length} / ${D.length} 张卡牌`;
  const g=document.getElementById('grid');
  g.innerHTML=list.map((c,i)=>{
    const idx=D.indexOf(c);
    return `<div class="card" onclick="showModal(${idx})" style="border-top:3px solid ${RC[c.r]}">
      <div class="r-badge" style="background:${RC[c.r]}">${RL[c.r]}</div>
      <div class="nv-tag" style="background:${NV[c.nv].c}">${NV[c.nv].n}</div>
      <div class="name">${c.n}</div>
      <div class="desc">${c.d}</div>
      <div class="radar-wrap">${radarSVG(c.s,c.r)}</div>
      <div class="stats-row">${c.s.map((v,i)=>`<span>${SL[i]}${v}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

function setF(el){
  document.querySelectorAll('.chip:not(.ch-r)').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');fNovel=el.dataset.f;render();
}
function setR(el){
  const r=el.dataset.r;
  if(fRarity.has(r)){fRarity.delete(r);el.classList.remove('on')}else{fRarity.add(r);el.classList.add('on')}
  render();
}
function filterCards(){fSearch=document.querySelector('.search').value;render();}

function showModal(idx){
  const c=D[idx];
  const m=document.getElementById('modal');
  m.innerHTML=`
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>${c.n}</h2>
    <div class="m-nv" style="background:${NV[c.nv].c}">${NV[c.nv].n}</div>
    <div class="m-r">${RL[c.r]} · ${c.d}</div>
    <div style="width:120px;height:120px;margin:0 auto 12px">${radarSVG(c.s,c.r).replace('viewBox="0 0 80 80"','viewBox="0 0 80 80"').replace(/font-size="5"/g,'font-size="7"')}</div>
    <div class="m-stats">${c.s.map((v,i)=>`<div class="m-stat"><div class="v" style="color:${RC[c.r]}">${v}</div><div class="l">${SL[i]}</div></div>`).join('')}</div>
    <div style="font-size:12px;color:var(--text2);text-align:center">总属性点: ${c.s.reduce((a,b)=>a+b,0)}</div>
  `;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}

render();
</script>
</body>
</html>
