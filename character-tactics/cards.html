<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字阵 · 四大名著策略卡牌</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#141414;--border:#2a2a2a;--text:#ededed;--text2:#a0a0a0;--text3:#666}
html{font-size:16px}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;letter-spacing:-.5px}
.header .sub{font-size:13px;color:var(--text3);font-family:'Geist Mono',monospace;margin-left:12px}
.count{font-size:13px;color:var(--text3);font-family:'Geist Mono',monospace}
.bar{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:14px;width:200px;outline:none;font-family:inherit}
.search::placeholder{color:var(--text3)}.search:focus{border-color:#444}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:9999px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid transparent;background:var(--surface);color:var(--text2);user-select:none}
.chip:hover{border-color:var(--border)}.chip.on{color:#fff}
.chip .d{width:7px;height:7px;border-radius:50%;display:inline-block}
.ca.on{background:var(--text);color:var(--bg)}
.ch-r .d{background:#c0392b}.ch-r.on{background:#c0392b}
.ch-g .d{background:#27ae60}.ch-g.on{background:#27ae60}
.ch-b .d{background:#2980b9}.ch-b.on{background:#2980b9}
.ch-y .d{background:#d4a017}.ch-y.on{background:#d4a017}
.ch-c .d{background:#808080}.ch-c.on{background:#555}
.ch-e .d{background:#3498db}.ch-e.on{background:#3498db}
.ch-l .d{background:#f1c40f}.ch-l.on{background:#b8960c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card.common{border-color:#444}.card.elite{border-color:#3498db66}
.card.legend{border-color:#f1c40f44;box-shadow:0 0 20px rgba(241,196,15,.08)}
.card.legend:hover{box-shadow:0 0 30px rgba(241,196,15,.15),0 8px 24px rgba(0,0,0,.4)}
.card-top{padding:16px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between}
.card-name{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700}
.card-rarity{font-size:10px;font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:9999px;color:#fff}
.card-rarity.common{background:#555}.card-rarity.elite{background:#3498db}.card-rarity.legend{background:linear-gradient(135deg,#f1c40f,#e67e22)}
.card-novel{font-size:11px;font-family:'Geist Mono',monospace;padding:2px 10px;border-radius:9999px;color:#fff;display:inline-block;margin:0 16px 8px}
.card-role{font-size:13px;color:var(--text2);padding:0 16px 12px}
.radar-wrap{display:flex;justify-content:center;padding:0 16px 12px}
.radar-wrap svg{width:120px;height:120px}
.skills{padding:8px 16px 14px;border-top:1px solid var(--border)}
.sk-item{padding:4px 0;font-size:12px;color:var(--text2);line-height:1.4}
.sk-item .sk-tag{font-size:10px;font-family:'Geist Mono',monospace;padding:1px 5px;border-radius:4px;color:#fff;margin-right:4px}
.sk-ult{background:linear-gradient(135deg,#e74c3c,#c0392b)}.sk-norm{background:#444}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;padding:28px;position:relative}
.modal .close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer}
.modal h2{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:700;margin-bottom:4px}
.modal .m-role{font-size:14px;color:var(--text2);margin-bottom:16px}
.modal .m-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.modal .m-stat{text-align:center;background:var(--surface);border-radius:8px;padding:8px 4px}
.modal .m-stat .val{font-size:20px;font-weight:600}
.modal .m-stat .lbl{font-size:10px;color:var(--text3);font-family:'Geist Mono',monospace}
.modal .m-sk{border-top:1px solid var(--border);padding:10px 0}
.modal .m-sk:first-of-type{border-top:none;padding-top:0}
.modal .m-sk-title{font-size:14px;font-weight:600;margin-bottom:4px}
.modal .m-sk-desc{font-size:13px;color:var(--text2);line-height:1.5}
.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}
@media(max-width:600px){.grid{grid-template-columns:1fr;padding:12px 16px}.header{padding:10px 16px}.bar{padding:10px 16px}.search{width:100%}}
</style>
</head>
<body>
<header class="header"><div style="display:flex;align-items:baseline;gap:0"><h1>字阵 · 卡牌图鉴</h1><span class="sub">Glyph Tactics</span></div><span class="count" id="count"></span></header>
<div class="bar">

</div>
<div class="grid" id="grid"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>const CHARS = [{"n": "贾宝玉", "v": "hlm", "vn": "红楼梦", "vc": "#c0392b", "r": "传说", "re": "legend", "a": [2, 6, 7, 4, 8, 5], "role": "灵核·因果链接者", "sk": [{"t": "必杀", "n": "万界归一", "d": "消耗 SPI×2=16 灵力，冷却 4 回合。将场上所有角色的因果线连接，友方全体回复 BEN×2=14 HP，敌方全体受到 SPI×1=8 灵力伤害。若宝玉 HP 低于 30%，效果翻倍。"}, {"t": "技能", "n": "碎玉引路", "d": "冷却 1 回合。标记一个敌方角色为\"因果焦点\"，所有友方攻击该目标时 +2 MAR。"}, {"t": "技能", "n": "石头兄弟", "d": "冷却 2 回合。与孙悟空同时在场时，双方 SPD+2（跨名著联动）。"}, {"t": "技能", "n": "通灵宝玉", "d": "冷却 2 回合。被动——每回合有 SPI×5%=40% 概率抵消一次友方受到的异常状态。"}]}, {"n": "林黛玉", "v": "hlm", "vn": "红楼梦", "vc": "#c0392b", "r": "精英", "re": "elite", "a": [1, 8, 3, 3, 9, 4], "role": "灵法·焚稿反击", "sk": [{"t": "必杀", "n": "焚稿绝唱", "d": "消耗 SPI×2=18 灵力，冷却 3 回合。牺牲自身 50% HP，对全体敌方造成 SPI×3=27 灵力伤害。HP 越低伤害越高（焚稿=极限反击）。"}, {"t": "技能", "n": "葬花", "d": "冷却 2 回合。在指定格放置\"花坟\"标记，站在花坟上的友方每回合回复 BEN×1=3 HP。花坟持续 3 回合。"}, {"t": "技能", "n": "还泪", "d": "冷却 1 回合。每回合自动回复 HP 最低的友方角色 BEN×1=3 HP。"}]}, {"n": "王熙凤", "v": "hlm", "vn": "红楼梦", "vc": "#c0392b", "r": "传说", "re": "legend", "a": [3, 9, 2, 5, 5, 7], "role": "计策·四界棋手", "sk": [{"t": "必杀", "n": "四界棋局", "d": "消耗 SPI×2=10 灵力，冷却 4 回合。操控敌方一个角色在下回合攻击其友方（将计就计）。成功率 = INT×10%=90%。"}, {"t": "技能", "n": "铁腕管家", "d": "冷却 1 回合。所有友方角色 LOY+2，持续 2 回合。"}, {"t": "技能", "n": "空城退敌", "d": "冷却 2 回合。以自身为诱饵，吸引敌方一个角色攻击自己，同时将伤害的 50% 反射给攻击者。"}, {"t": "技能", "n": "权谋之眼", "d": "冷却 2 回合。查看对手手牌中一张三十六计卡。"}]}, {"n": "薛宝钗", "v": "hlm", "vn": "红楼梦", "vc": "#c0392b", "r": "精英", "re": "elite", "a": [2, 7, 6, 6, 3, 5], "role": "辅助·冷香丸", "sk": [{"t": "必杀", "n": "冷香丸", "d": "消耗 SPI×2=6 灵力，冷却 3 回合。以冷香丸医治友方全体，回复 BEN×2=12 HP 并清除所有负面状态。若目标 HP 低于 30%，额外回复 BEN×1=6 HP。"}, {"t": "技能", "n": "金锁良缘", "d": "冷却 2 回合。指定一个友方角色，为其附加\"金锁\"护盾，可抵挡一次攻击，护盾值为 INT×2=14。"}, {"t": "技能", "n": "停机德", "d": "冷却 1 回合。被动——宝钗在场时，所有友方女性角色 BEN+2。"}]}, {"n": "贾母", "v": "hlm", "vn": "红楼梦", "vc": "#c0392b", "r": "普通", "re": "common", "a": [1, 5, 8, 7, 2, 2], "role": "辅助·家族庇护", "sk": [{"t": "必杀", "n": "贾府盛宴", "d": "消耗 SPI×2=4 灵力，冷却 3 回合。举办盛大宴席，全体友方回复 BEN×2=16 HP，并获得 LOY+1 防御加成，持续 2 function filtered(){const q=document.getElementById('search').value.trim().toLowerCase();return CHARS.filter(c=>{if(filter!=='all'){if(['hlm','sgy','shz','xyj'].includes(filter)&&c.v!==filter)return false;if(['legend','elite','common'].includes(filter)&&c.re!==filter)return false}if(q&&!c.n.toLowerCase().includes(q)&&!c.vn.toLowerCase().includes(q)&&!c.role.toLowerCase().includes(q))return false;return true})}
function radar(c){const a=c.a,cx=60,cy=60,r=45;const pts=a.map((v,i)=>{const ang=Math.PI*2*i/6-Math.PI/2;const rv=r*v/10;return`${cx+rv*Math.cos(ang)},${cy+rv*Math.sin(ang)}`});const labs=a.map((v,i)=>{const ang=Math.PI*2*i/6-Math.PI/2;const lx=cx+(r+12)*Math.cos(ang);const ly=cy+(r+12)*Math.sin(ang);return`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#888" font-size="9" font-family="Geist Mono,monospace">${v}</text>`});return`<svg viewBox="0 0 120 120"><polygon points="${pts.join(' ')}" fill="${c.vc}33" stroke="${c.vc}" stroke-width="1.5"/>${labs.join('')}</svg>`}
