<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>世界绘本馆 · World Picture Books</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf9f7;--surface:#fff;--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;--accent:#e8590c;--accent2:#f76707;--warm:#fff4e6;--border:#e5e5ea;--shadow:0 2px 16px rgba(0,0,0,.06);--radius:16px;--radius-sm:12px}
body.dark{--bg:#1a1a2e;--surface:#16213e;--text:#e8e8e8;--text2:#a0a0b0;--text3:#6a6a7a;--warm:#2a1f0e;--border:#2a2a4a;--shadow:0 2px 16px rgba(0,0,0,.3)}
body.dark nav{background:rgba(26,26,46,.9)}
body.dark .search-box,body.dark .f-btn{background:var(--surface);color:var(--text)}
body.dark .modal{background:var(--surface)}
body.dark .stat{background:var(--surface)}
body.dark .book-card{background:var(--surface)}
body.dark .chart-section{background:var(--surface)}
body.dark .tl-card{background:var(--surface)}
body.dark .modal-close{background:rgba(255,255,255,.1);color:var(--text)}
body.dark .related-item{background:var(--bg)}
body.dark .bar-track{background:#2a2a4a}
body.dark #randomBtn{background:var(--warm);border-color:var(--accent);color:var(--accent)}
.fav-btn{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);border:none;font-size:14px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(4px);padding:0}
.fav-btn:hover{transform:scale(1.2)}
.fav-btn.on{background:#ffd43b}
body.dark .fav-btn{background:rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent;min-height:100vh}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,249,247,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px}
nav .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
nav .title{font-size:15px;font-weight:600;letter-spacing:-.2px;flex:1}
nav .view-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .2s}
nav .view-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.hero{text-align:center;padding:72px 20px 32px;max-width:800px;margin:0 auto;animation:heroIn .6s ease}
.hero .emoji{font-size:3.6em;margin-bottom:8px;display:inline-block;animation:float 3s ease-in-out infinite}
.hero h1{font-size:2.2em;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#e8590c 0%,#f76707 40%,#ffd43b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:.92em;color:var(--text2);margin-top:6px}

.stats{display:flex;gap:10px;max-width:800px;margin:0 auto;padding:0 20px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat .n{font-size:1.4em;font-weight:700;color:var(--accent)}
.stat .l{font-size:.65em;color:var(--text2);margin-top:2px}

.filters{max-width:800px;margin:16px auto 0;padding:0 20px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.filter-row .label{font-size:.7em;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:6px 0;min-width:40px}
.f-btn{padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:var(--surface);font-size:.75em;cursor:pointer;transition:all .2s;color:var(--text2);white-space:nowrap}
.f-btn:hover{border-color:var(--accent)}
.f-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-box{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.88em;background:var(--surface);margin-top:4px;transition:border .2s;outline:none}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text3)}
#randomBtn:hover{background:var(--accent);color:#fff;transform:scale(1.04)}
#randomBtn:active{transform:scale(0.96)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:20px auto;padding:0 20px 60px}
.book-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .3s;position:relative;animation:fadeInUp .4s ease both}
.book-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.1)}
.book-cover{height:200px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.book-cover .cover-emoji{font-size:4em;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.book-info{padding:14px}
.book-info .title{font-size:.92em;font-weight:600;line-height:1.3;margin-bottom:3px}
.book-info .author{font-size:.75em;color:var(--text2);margin-bottom:6px}
.book-tags{display:flex;gap:4px;flex-wrap:wrap}
.book-tag{font-size:.6em;padding:2px 7px;border-radius:10px;background:var(--warm);color:var(--accent);font-weight:500}
.book-age{font-size:.6em;padding:2px 7px;border-radius:10px;background:#e7f5ff;color:#1971c2;font-weight:500}
.book-country{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);border-radius:12px;padding:2px 8px;font-size:.65em;font-weight:600;backdrop-filter:blur(4px)}

.timeline{max-width:800px;margin:20px auto;padding:0 20px 60px;position:relative}
.timeline::before{content:'';position:absolute;left:30px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),var(--accent2),#ffd43b)}
.tl-item{display:flex;gap:16px;margin-bottom:20px;animation:fadeInUp .4s ease both}
.tl-year{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;flex-shrink:0;z-index:1;box-shadow:0 2px 8px rgba(232,89,12,.3)}
.tl-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all .2s}
.tl-card:hover{box-shadow:var(--shadow);transform:translateX(4px)}
.tl-card .t{font-weight:600;font-size:.9em}
.tl-card .a{font-size:.75em;color:var(--text2)}
.tl-card .d{font-size:.72em;color:var(--text3);margin-top:4px;line-height:1.4}
.tl-card .c{font-size:.65em;color:var(--accent);font-weight:500}

.chart{max-width:900px;margin:20px auto;padding:0 20px 60px}
.chart-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.chart-section h3{font-size:.8em;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;text-align:center}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{width:80px;font-size:.72em;text-align:right;color:var(--text2);flex-shrink:0}
.bar-track{flex:1;height:24px;background:#f1f3f5;border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding-left:8px;font-size:.65em;color:#fff;font-weight:600;min-width:24px}
.bar-count{font-size:.72em;color:var(--text2);width:28px;text-align:left}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:8px;z-index:201;background:var(--surface);border-radius:20px;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.show{transform:translateY(0)}
.modal-close{position:sticky;top:12px;float:right;margin:12px 16px 0;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06);border:none;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:rgba(0,0,0,.12)}
.modal-hero{height:280px;display:flex;align-items:center;justify-content:center;position:relative;margin:-52px 0 0}
.modal-hero .m-emoji{font-size:6em;z-index:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
.modal-body{padding:0 24px 40px;max-width:640px;margin:0 auto}
.modal-body .m-title{font-size:1.6em;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.modal-body .m-orig{font-size:.85em;color:var(--text3);font-style:italic;margin-bottom:12px}
.modal-body .m-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:.82em;color:var(--text2)}
.modal-body .m-meta span{display:flex;align-items:center;gap:4px}
.modal-body .m-quote{font-size:1.1em;font-weight:500;line-height:1.6;padding:16px 20px;background:var(--warm);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;margin-bottom:16px;font-style:italic}
.modal-body .m-desc{font-size:.9em;line-height:1.7;color:var(--text2);margin-bottom:16px}
.modal-body .m-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.m-tag{padding:4px 12px;border-radius:16px;font-size:.72em;font-weight:500}
.m-tag.genre{background:#e7f5ff;color:#1971c2}
.m-tag.art{background:#fff0f6;color:#c2255c}
.m-tag.age{background:#ebfbee;color:#2f9e44}
.modal-body .m-section{margin-top:20px}
.modal-body .m-section h3{font-size:.78em;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.related-item{padding:10px;background:var(--bg);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;font-size:.82em}
.related-item:hover{background:var(--warm)}
.related-item .ri-t{font-weight:600}
.related-item .ri-a{font-size:.8em;color:var(--text2)}

.reading-mode{display:none;position:fixed;inset:0;z-index:300;background:#fff;overflow-y:auto}
.reading-mode.show{display:block;animation:fadeIn .3s ease}
.reading-close{position:fixed;top:16px;right:16px;z-index:301;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.08);border:none;font-size:20px;cursor:pointer;transition:all .2s}
.reading-close:hover{background:rgba(0,0,0,.15)}
.rm-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
.rm-emoji{font-size:8em;margin-bottom:24px;animation:float 4s ease-in-out infinite}
.rm-text{max-width:500px;font-size:1.3em;font-weight:500;line-height:1.8;color:var(--text)}
.rm-text .highlight{color:var(--accent);font-weight:700}
.rm-page-num{position:absolute;bottom:24px;font-size:.75em;color:var(--text3)}
.rm-nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:301}
.rm-nav button{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:18px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:all .2s}
.rm-nav button:hover{transform:scale(1.1);box-shadow:0 4px 20px rgba(0,0,0,.12)}
.rm-nav button:disabled{opacity:.3;cursor:default;transform:none}

.no-result{text-align:center;padding:60px 20px;color:var(--text3)}
.no-result .emoji{font-size:3em;margin-bottom:12px}

.footer{text-align:center;padding:40px 20px;color:var(--text3);font-size:.78em}

@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@media(max-width:640px){
  .hero h1{font-size:1.6em}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .book-cover{height:160px}
  .modal-hero{height:200px}
  .modal-body .m-title{font-size:1.3em}
  .stats{gap:6px}
  .stat{padding:10px 6px}
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="back">← 首页</a>
  <span class="title">📚 世界绘本馆</span>
  <button class="view-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="收藏夹">⭐<span id="favCount"></span></button>
  <button class="view-btn read-filter-btn" data-status="reading" onclick="toggleReadFilter('reading')" title="在读">📖</button>
  <button class="view-btn read-filter-btn" data-status="read" onclick="toggleReadFilter('read')" title="已读">✅</button>
  <button class="view-btn" onclick="toggleDark()" title="暗黑模式" id="darkBtn">🌙</button>
  <button class="view-btn active" data-view="grid" onclick="setView('grid')">卡片</button>
  <button class="view-btn" data-view="timeline" onclick="setView('timeline')">时间线</button>
  <button class="view-btn" data-view="chart" onclick="setView('chart')">统计</button>
</nav>

<div class="hero">
  <div class="emoji">📖</div>
  <h1>世界绘本馆</h1>
  <div class="sub" id="heroSub">收录全球100本经典绘本 · 用故事点亮童年 · 亲子共读必备</div>
</div>

<div class="stats" id="statsBar"></div>

<div class="filters">
  <div class="filter-row">
    <span class="label">年龄</span>
    <div id="ageFilters"></div>
  </div>
  <div class="filter-row">
    <span class="label">地区</span>
    <div id="regionFilters"></div>
  </div>
  <div class="filter-row">
    <span class="label">来源</span>
    <div id="sourceFilters"></div>
  </div>
  <div class="filter-row">
    <span class="label">类型</span>
    <div id="genreFilters"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <input class="search-box" type="text" placeholder="🔍 搜索书名、作者、国家..." id="searchBox" oninput="applyFilters()" style="flex:1;margin-top:0">
    <button id="randomBtn" onclick="randomPick()" style="white-space:nowrap;padding:0 16px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--warm);color:var(--accent);font-size:.82em;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px">🎲<span>今天读什么</span></button>
  </div>
</div>

<div id="content"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div id="modalContent"></div>
</div>

<div class="reading-mode" id="readingMode">
  <button class="reading-close" onclick="closeReading()">✕</button>
  <div id="readingContent"></div>
  <div class="rm-nav">
    <button onclick="readPage(-1)" id="rmPrev">◀</button>
    <button onclick="toggleAutoPlay()" id="rmAuto">⏸</button>
    <button onclick="readPage(1)" id="rmNext">▶</button>
  </div>
</div>

<div class="footer">世界绘本馆 · 收录全球经典绘本 · 用故事点亮童年 ✨</div>

<script>
var B=[
{t:"好饿的毛毛虫",o:"The Very Hungry Caterpillar",a:"艾瑞·卡尔",co:"🇺🇸美国",y:1969,g:["认知","经典"],e:"🐛",ag:"2-5",bg:"linear-gradient(135deg,#51cf66,#20c997)",d:"艾瑞·卡尔的经典之作，一只毛毛虫从蛋里孵化出来，一路吃穿苹果、梨子、蛋糕等各种食物，最终蜕变成美丽的蝴蝶。色彩斑斓的拼贴画风格，让数百万孩子爱上阅读。洞洞书设计充满互动乐趣。",q:"他不再是一条饥饿的小毛毛虫了，他是一条又胖又大的毛毛虫。",lk:"https://search.bilibili.com/all?keyword=好饿的毛毛虫+绘本"},
{t:"猜猜我有多爱你",o:"Guess How Much I Love You",a:"山姆·麦克布雷尼",co:"🇬🇧英国",y:1994,g:["亲情","经典"],e:"🐰",ag:"2-6",bg:"linear-gradient(135deg,#ff8787,#e64980)",d:"大栗色兔子和小栗色兔子比赛谁的爱更多。小兔子张开双臂说我爱你这么多，大兔子的手臂更长。我爱你一直到月亮那里——再回来。最温暖的亲子睡前故事，全球畅销超5000万册。",q:"我爱你一直到月亮那里，再从月亮上回到这里来。",lk:"https://search.bilibili.com/all?keyword=猜猜我有多爱你+绘本"},
{t:"逃家小兔",o:"The Runaway Bunny",a:"玛格丽特·怀兹·布朗",co:"🇺🇸美国",y:1942,g:["亲情","经典"],e:"🐇",ag:"2-5",bg:"linear-gradient(135deg,#ffa94d,#fd7e14)",d:"小兔子说要跑走，兔妈妈说会追上他。如果小兔子变成鱼、石头、花、鸟，妈妈就变成渔夫、登山者、园丁、树。无论孩子走多远，妈妈的爱永远追随。黑白画面中母爱如影随形。",q:"如果你变成小鸟飞走，我就变成树，让你飞回家。",lk:"https://search.bilibili.com/all?keyword=逃家小兔+绘本"},
{t:"爱心树",o:"The Giving Tree",a:"谢尔·希尔弗斯坦",co:"🇺🇸美国",y:1964,g:["哲学","经典"],e:"🌳",ag:"4+",bg:"linear-gradient(135deg,#69db7c,#2b8a3e)",d:"一棵苹果树爱一个男孩，从童年到老年。男孩要钱，树给苹果；要房子，树给树枝；要船，树给树干。最后只剩一个树桩，还能让疲惫的老人坐下休息。关于无条件之爱的寓言，令人落泪。",q:"树很快乐。",lk:"https://search.bilibili.com/all?keyword=爱心树+绘本"},
{t:"小蓝和小黄",o:"Little Blue and Little Yellow",a:"李欧·李奥尼",co:"🇮🇹意大利",y:1959,g:["友谊","艺术"],e:"🔵",ag:"2-5",bg:"linear-gradient(135deg,#74c0fc,#ffd43b)",d:"李欧·李奥尼的处女作。小蓝和小黄是好朋友，他们拥抱在一起变成了绿色，爸爸妈妈都不认识他们了。直到他们哭了变回自己。用撕纸拼贴讲述友谊与身份认同的故事，简约而深刻。",q:"他们紧紧抱在一起，结果变成了绿色！",lk:"https://search.bilibili.com/all?keyword=小蓝和小黄+绘本"},

    r[lo<3?'0-2':lo<5?'3-4':lo<7?'5-6':'7+']=(r[lo<3?'0-2':lo<5?'3-4':lo<7?'5-6':'7+']||0)+1;

  h+='<div class="stat"><div class="n">'+countries.length+'</div><div class="l">国家地区</div></div>';
  var genres=Object.keys(g).length;
  h+='<div class="stat"><div class="n">'+genres+'</div><div class="l">主题类型</div></div>';
  var years=B.filter(function(b){return b.y>0});

}

  var regions=['美国','英国','法国','日本','中国','北欧','德国','其他'];
  var genres=[];
  B.forEach(function(b){b.g.forEach(function(t){if(genres.indexOf(t)<0)genres.push(t)})});
  genres.sort();
  var ah='<button class="f-btn active" onclick="setFilter(\'age\',\'all\',this)">全部</button>';
  ages.forEach(function(a){ah+='<button class="f-btn" onclick="setFilter(\'age\',\''+a+'\',this)">'+a+'</button>'});
  document.getElementById('ageFilters').innerHTML=ah;
  var rh='<button class="f-btn active" onclick="setFilter(\'region\',\'all\',this)">全部</button>';
  regions.forEach(function(r){rh+='<button class="f-btn" onclick="setFilter(\'region\',\''+r+'\',this)">'+r+'</button>'});
  document.getElementById('regionFilters').innerHTML=rh;
  var gh='<button class="f-btn active" onclick="setFilter(\'genre\',\'all\',this)">全部</button>';
  genres.forEach(function(g){gh+='<button class="f-btn" onclick="setFilter(\'genre\',\''+g+'\',this)">'+g+'</button>'});
  document.getElementById('genreFilters').innerHTML=gh;
  var sh='<button class="f-btn active" onclick="setFilter(\'source\',\'all\',this)">全部</button>';
  sh+='<button class="f-btn" onclick="setFilter(\'source\',\'online\',this)">📺 全部可观看</button>';
  sh+='<button class="f-btn" onclick="setFilter(\'source\',\'cn\',this)">🇨🇳 中国原创</button>';
  sh+='<button class="f-btn" onclick="setFilter(\'source\',\'trans\',this)">🌍 翻译经典</button>';
  document.getElementById('sourceFilters').innerHTML=sh;
}

function setFilter(type,val,btn){
  if(type==='age')activeAge=val;
  else if(type==='region')activeRegion=val;
  else if(type==='source')activeSource=val;
  else activeGenre=val;
  var row=btn.parentNode;
  var btns=row.querySelectorAll('.f-btn');
  btns.forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  applyFilters();
}

function matchAge(b,filter){
  if(filter==='all')return true;
  var ag=b.ag.replace(/\+.*/,'');
  if(filter==='0-3')return ag==='0-3'||ag==='1-3'||ag==='2-5'||ag==='2-6'||ag==='1-4'||ag==='2-3';
  if(filter==='3-5')return ag.indexOf('3')>=0||ag.indexOf('4')>=0||ag==='2-5'||ag==='2-6';
  if(filter==='5-7')return ag.indexOf('5')>=0||ag.indexOf('6')>=0||ag.indexOf('7')>=0||ag.indexOf('+')>=0;
  if(filter==='7+')return ag.indexOf('7')>=0||ag.indexOf('+')>=0||ag.indexOf('8')>=0||ag.indexOf('9')>=0;
  return true;
}

function matchRegion(b,filter){
  if(filter==='all')return true;
  var co=b.co;
  if(filter==='美国')return co.indexOf('美国')>=0;
  if(filter==='英国')return co.indexOf('英国')>=0;
  if(filter==='法国')return co.indexOf('法国')>=0;
  if(filter==='日本')return co.indexOf('日本')>=0;
  if(filter==='中国')return co.indexOf('中国')>=0;
  if(filter==='北欧')return co.indexOf('瑞典')>=0||co.indexOf('芬兰')>=0||co.indexOf('丹麦')>=0||co.indexOf('挪威')>=0;
  if(filter==='德国')return co.indexOf('德国')>=0;
  if(filter==='其他')return co.indexOf('美国')<0&&co.indexOf('英国')<0&&co.indexOf('法国')<0&&co.indexOf('日本')<0&&co.indexOf('中国')<0&&co.indexOf('瑞典')<0&&co.indexOf('芬兰')<0&&co.indexOf('丹麦')<0&&co.indexOf('挪威')<0&&co.indexOf('德国')<0;
  return true;
}

function getFiltered(){
  var q=document.getElementById('searchBox').value.toLowerCase();
  return B.filter(function(b,idx){
    if(!matchAge(b,activeAge))return false;
    if(!matchRegion(b,activeRegion))return false;
    if(activeGenre!=='all'&&b.g.indexOf(activeGenre)<0)return false;
    if(activeSource==='online'&&!b.lk)return false;
    if(activeSource==='cn'&&b.co.indexOf('中国')<0)return false;
    if(activeSource==='trans'&&b.co.indexOf('中国')>=0)return false;
    if(showFavOnly&&favs.indexOf(idx)<0)return false;
    if(activeReadFilter&&getReadStatus(idx)!==activeReadFilter)return false;
    if(q){
      var txt=(b.t+b.a+b.co+b.o+b.g.join(' ')).toLowerCase();
      if(txt.indexOf(q)<0)return false;
    }
    return true;
  });
}

var currentView='grid';
function setView(v){
  currentView=v;
  document.querySelectorAll('.view-btn').forEach(function(btn){
    btn.classList.toggle('active',btn.getAttribute('data-view')===v);
  });
  applyFilters();
}

function applyFilters(){
  var books=getFiltered();
  var el=document.getElementById('content');
  if(books.length===0){
    el.innerHTML='<div class="no-result"><div class="emoji">📭</div><div>没有找到匹配的绘本</div></div>';
    return;
  }
  if(currentView==='grid')renderGrid(books,el);
  else if(currentView==='timeline')renderTimeline(books,el);
  else renderChart(books,el);
}

function renderGrid(books,el){
  var h='<div class="grid">';
  books.forEach(function(b,i){
    var tags='';
    b.g.slice(0,2).forEach(function(t){tags+='<span class="book-tag">'+t+'</span>'});
    tags+='<span class="book-age">'+b.ag+'岁</span>';
    var idx=B.indexOf(b);
    var isFav=favs.indexOf(idx)>=0;
    var rs=getReadStatus(idx);
    var rsIcon=rs==='read'?'✅':rs==='reading'?'📖':'';
    h+='<div class="book-card" style="animation-delay:'+(i*0.04)+'s" onclick="openDetail('+idx+')">';
    h+='<div class="book-cover" style="background:'+b.bg+'"><div class="cover-emoji">'+b.e+'</div><div class="book-country">'+b.co+'</div>'+(b.lk?'<div style="position:absolute;bottom:8px;left:8px;background:rgba(81,207,102,.9);color:#fff;border-radius:10px;padding:2px 8px;font-size:.6em;font-weight:700;backdrop-filter:blur(4px)">📺可观看</div>':'')+(rsIcon?'<div style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;backdrop-filter:blur(4px)">'+rsIcon+'</div>':'')+'<button class="fav-btn'+(isFav?' on':'')+'" onclick="event.stopPropagation();toggleFav('+idx+')" title="'+(isFav?'取消收藏':'收藏')+'">'+(isFav?'⭐':'☆')+'</button></div>';
    h+='<div class="book-info"><div class="title">'+b.t+'</div><div class="author">'+b.a+'</div><div class="book-tags">'+tags+'</div></div>';
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function renderTimeline(books,el){
  var sorted=books.slice().sort(function(a,b){return (a.y||1900)-(b.y||1900)});
  var h='<div class="timeline">';
  sorted.forEach(function(b,i){
    var yr=b.y||'传统';
    h+='<div class="tl-item" style="animation-delay:'+(i*0.05)+'s">';
    h+='<div class="tl-year">'+yr+'</div>';
    h+='<div class="tl-card" onclick="openDetail('+B.indexOf(b)+')">';
    h+='<div class="t">'+b.e+' '+b.t+'</div>';
    h+='<div class="a">'+b.a+' · '+b.co+'</div>';
    h+='<div class="d">'+b.d.substring(0,60)+'...</div>';
    h+='<div class="c">'+b.g.join(' · ')+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function renderChart(books,el){
  // Country distribution
  var cc={};
  books.forEach(function(b){var n=b.co.replace(/[^\u4e00-\u9fff]/g,'').replace(/[a-zA-Z]/g,'');cc[n]=(cc[n]||0)+1});
  var colors=['#e8590c','#f76707','#fd7e14','#ffa94d','#ffd43b','#69db7c','#40c057','#20c997','#66d9e8','#74c0fc','#748ffc','#845ef7','#e599f7','#f783ac','#ff8787'];
  var max=Math.max.apply(null,Object.values(cc));
  var h='<div class="chart">';
  h+='<div class="chart-section"><h3>🌍 国家分布</h3>';
  Object.entries(cc).sort(function(a,b){return b[1]-a[1]}).forEach(function(e,i){
    var pct=Math.round(e[1]/max*100);
    h+='<div class="bar-row"><div class="bar-label">'+e[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+colors[i%colors.length]+'">'+e[1]+'</div></div></div>';
  });
  h+='</div>';
  // Genre distribution
  var gc={};
  books.forEach(function(b){b.g.forEach(function(t){gc[t]=(gc[t]||0)+1})});
  var gmax=Math.max.apply(null,Object.values(gc));
  h+='<div class="chart-section"><h3>📚 类型分布</h3>';
  Object.entries(gc).sort(function(a,b){return b[1]-a[1]}).forEach(function(e,i){
    var pct=Math.round(e[1]/gmax*100);
    h+='<div class="bar-row"><div class="bar-label">'+e[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+colors[(i+5)%colors.length]+'">'+e[1]+'</div></div></div>';
  });
  h+='</div>';
  // Age distribution
  var ac={'0-3':0,'3-5':0,'5-7':0,'7+':0};
  books.forEach(function(b){
    var ag=b.ag;
    if(ag.indexOf('0-')>=0||ag==='1-3'||ag==='1-4')ac['0-3']++;
    if(ag.indexOf('2-')>=0||ag.indexOf('3-')>=0||ag.indexOf('4')>=0)ac['3-5']++;
    if(ag.indexOf('5')>=0||ag.indexOf('6')>=0)ac['5-7']++;
    if(ag.indexOf('7')>=0||ag.indexOf('8')>=0||ag.indexOf('+')>=0||ag.indexOf('9')>=0)ac['7+']++;
  });
  var amax=Math.max.apply(null,Object.values(ac));
  h+='<div class="chart-section"><h3>👶 年龄分布</h3>';
  Object.entries(ac).forEach(function(e,i){
    var pct=amax?Math.round(e[1]/amax*100):0;
    h+='<div class="bar-row"><div class="bar-label">'+e[0]+'岁</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+colors[(i+10)%colors.length]+'">'+e[1]+'</div></div></div>';
  });
  h+='</div></div>';
  el.innerHTML=h;
}

// Detail modal
function openDetail(idx){
  var b=B[idx];
  var h='';
  h+='<div class="modal-hero" style="background:'+b.bg+'"><div class="m-emoji">'+b.e+'</div></div>';
  h+='<div class="modal-body">';
  h+='<div class="m-title">'+b.t+'</div>';
  if(b.o)h+='<div class="m-orig">'+b.o+'</div>';
  h+='<div class="m-meta">';
  if(b.y)h+='<span>📅 '+b.y+'年</span>';
  h+='<span>✍️ '+b.a+'</span>';
  h+='<span>📍 '+b.co+'</span>';
  h+='<span>👶 '+b.ag+'岁</span>';
  h+='</div>';
  h+='<div class="m-quote">"'+b.q+'"</div>';
  h+='<div class="m-desc">'+b.d+'</div>';
  h+='<div class="m-tags">';
  b.g.forEach(function(t){h+='<span class="m-tag genre">'+t+'</span>'});
  var isFav=favs.indexOf(idx)>=0;
  h+='<span class="m-tag" style="background:'+(isFav?'#fff4e6':'#f1f3f5')+';color:'+(isFav?'#e8590c':'#6e6e73')+';cursor:pointer" onclick="toggleFav('+idx+');openDetail('+idx+')">'+(isFav?'⭐ 已收藏':'☆ 收藏')+'</span>';
  var rs=getReadStatus(idx);
  h+='<span class="m-tag" style="background:'+(rs==='read'?'#d3f9d8':rs==='reading'?'#fff3bf':'#f1f3f5')+';color:'+(rs==='read'?'#2b8a3e':rs==='reading'?'#e67700':'#6e6e73')+';cursor:pointer" onclick="cycleReadStatus('+idx+')">'+(rs==='read'?'✅ 已读':rs==='reading'?'📖 在读':'📋 标记状态')+'</span>';
  h+='</div>';
  // Related books
  var related=B.filter(function(ob,i){
    if(i===idx)return false;
    var common=0;
    ob.g.forEach(function(t){if(b.g.indexOf(t)>=0)common++});
    return common>=1;
  }).slice(0,4);
  if(related.length){
    h+='<div class="m-section"><h3>📖 你可能也喜欢</h3><div class="related-grid">';
    related.forEach(function(rb){
      h+='<div class="related-item" onclick="openDetail('+B.indexOf(rb)+')"><div class="ri-t">'+rb.e+' '+rb.t+'</div><div class="ri-a">'+rb.a+'</div></div>';
    });
    h+='</div></div>';
  }
  h+='<div style="text-align:center;margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">';
  if(b.lk){
    h+='<a href="'+b.lk+'" target="_blank" rel="noopener" style="background:linear-gradient(135deg,#51cf66,#20c997);color:#fff;border:none;padding:12px 28px;border-radius:24px;font-size:1em;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);text-decoration:none;display:inline-flex;align-items:center;gap:6px">📺 观看朗读</a>';
  }
  h+='<button onclick="startReading('+idx+')" style="background:'+b.bg+';color:#fff;border:none;padding:12px 28px;border-radius:24px;font-size:1em;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15)">📖 导读模式</button>';
  h+='</div>';
  h+='</div>';
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modal').classList.add('show');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modal').classList.remove('show');
}

// Reading mode
var readingBook=null,readingPage=0,autoPlayTimer=null;

function startReading(idx){
  closeModal();
  readingBook=B[idx];
  readingPage=0;
  // Generate 5 reading pages from book data
  var pages=[
    {e:readingBook.e,t:'<span class="highlight">'+readingBook.t+'</span><br><span style="font-size:.7em;color:var(--text2)">'+readingBook.a+' · '+readingBook.co+'</span>'},
    {e:'📖',t:'很久很久以前……<br>有一个关于<br><span class="highlight">'+readingBook.t+'</span>的故事。'},
    {e:readingBook.e,t:readingBook.d},
    {e:'💭',t:'"<span class="highlight">'+readingBook.q+'</span>"'},
    {e:'✨',t:'故事结束了。<br>你觉得'+readingBook.t+'的冒险怎么样呢？'}
  ];
  readingBook._pages=pages;
  showReadingPage();
  document.getElementById('readingMode').classList.add('show');
  document.body.style.overflow='hidden';
}

function showReadingPage(){
  var p=readingBook._pages[readingPage];
  var total=readingBook._pages.length;
  var h='<div class="rm-page"><div class="rm-emoji">'+p.e+'</div><div class="rm-text">'+p.t+'</div><div class="rm-page-num">'+(readingPage+1)+' / '+total+'</div></div>';
  document.getElementById('readingContent').innerHTML=h;
  document.getElementById('rmPrev').disabled=readingPage===0;
  document.getElementById('rmNext').disabled=readingPage===total-1;
}

function readPage(dir){
  readingPage+=dir;
  if(readingPage<0)readingPage=0;
  if(readingPage>=readingBook._pages.length)readingPage=readingBook._pages.length-1;
  showReadingPage();
}

function toggleAutoPlay(){
  var btn=document.getElementById('rmAuto');
  if(autoPlayTimer){
    clearInterval(autoPlayTimer);
    autoPlayTimer=null;
    btn.textContent='▶';
  }else{
    btn.textContent='⏸';
    autoPlayTimer=setInterval(function(){
      if(readingPage<readingBook._pages.length-1)readPage(1);
      else{clearInterval(autoPlayTimer);autoPlayTimer=null;btn.textContent='▶'}
    },3000);
  }
}

function closeReading(){
  document.getElementById('readingMode').classList.remove('show');
  document.body.style.overflow='';
  if(autoPlayTimer){clearInterval(autoPlayTimer);autoPlayTimer=null}
  document.getElementById('rmAuto').textContent='▶';
}

// Keyboard navigation
document.addEventListener('keydown',function(e){
  if(document.getElementById('readingMode').classList.contains('show')){
    if(e.key==='ArrowLeft')readPage(-1);
    else if(e.key==='ArrowRight')readPage(1);
    else if(e.key==='Escape')closeReading();
  }else if(document.getElementById('modal').classList.contains('show')){
    if(e.key==='Escape')closeModal();
  }
});

// Touch swipe for reading mode
var touchStartX=0;
document.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX});
document.addEventListener('touchend',function(e){
  if(!document.getElementById('readingMode').classList.contains('show'))return;
  var dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>50){dx<0?readPage(1):readPage(-1)}
});

// Random pick with dice animation
function randomPick(){
  var books=getFiltered();
  if(!books.length)return;
  var btn=document.getElementById('randomBtn');
  btn.disabled=true;
  btn.style.transform='scale(0.95)';
  // Dice animation: rapidly cycle through random books
  var count=0,total=12;
  var interval=setInterval(function(){
    var rb=books[Math.floor(Math.random()*books.length)];
    btn.querySelector('span').textContent=rb.e+' '+rb.t;
    count++;
    if(count>=total){
      clearInterval(interval);
      // Final pick
      var pick=books[Math.floor(Math.random()*books.length)];
      btn.querySelector('span').textContent='今天读什么';
      btn.disabled=false;
      btn.style.transform='';
      openDetail(B.indexOf(pick));
    }
  },80);
}

// Init
buildStats();
buildFilters();
updateFavBadge();
applyFilters();

</script>
