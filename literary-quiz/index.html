<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文学问答 · Literary Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--surface:#fff;--text:#1d1d1f;--text2:#6e6e73;--accent:#0071e3;--accent2:#0077ED;--correct:#34c759;--wrong:#ff3b30;--gold:#ff9500;--border:#e5e5ea;--card:#fff;--shadow:0 2px 16px rgba(0,0,0,.06);--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,250,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px}
nav .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
nav .title{font-size:15px;font-weight:600;letter-spacing:-.2px}

/* ===== HOME SCREEN ===== */
.home{padding:72px 20px 40px;max-width:640px;margin:0 auto;display:block}
.home-hero{text-align:center;padding:40px 0 32px}
.home-hero h1{font-size:2em;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#1d1d1f 0%,#0071e3 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-hero .sub{font-size:1em;color:var(--text2);margin-top:6px}
.home-hero .emoji{font-size:3em;margin-bottom:12px}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.mode-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;transition:all .2s;text-align:center}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.08);border-color:var(--accent)}
.mode-card:active{transform:scale(.97)}
.mode-card .icon{font-size:2em;margin-bottom:8px}
.mode-card .name{font-size:.95em;font-weight:600;margin-bottom:4px}
.mode-card .desc{font-size:.75em;color:var(--text2);line-height:1.4}
.mode-card.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.15)}

.settings{margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.settings h3{font-size:.85em;font-weight:600;margin-bottom:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.diff-row{display:flex;gap:8px}
.diff-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-size:.85em;font-weight:500;transition:all .2s;text-align:center;color:var(--text)}
.diff-btn:hover{border-color:var(--accent)}
.diff-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.diff-btn .stars{font-size:.7em;display:block;margin-top:2px;opacity:.7}

.start-btn{display:block;width:100%;margin-top:16px;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:1.1em;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:-.2px}
.start-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.start-btn:active{transform:scale(.98)}

.stats-bar{display:flex;gap:12px;margin-top:20px}
.stat-item{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center}
.stat-item .num{font-size:1.3em;font-weight:700;color:var(--accent)}
.stat-item .label{font-size:.7em;color:var(--text2);margin-top:2px}

/* ===== QUIZ SCREEN ===== */
.quiz{display:none;padding:68px 20px 100px;max-width:640px;margin:0 auto}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.q-progress{flex:1;height:6px;background:#e5e5ea;border-radius:3px;overflow:hidden;margin:0 12px}
.q-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#5856d6);border-radius:3px;transition:width .3s}
.q-counter{font-size:.8em;color:var(--text2);font-weight:500;white-space:nowrap}
.q-timer{font-size:.8em;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.q-timer.warning{color:var(--wrong);animation:pulse .5s ease infinite}

.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.q-type{font-size:.7em;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.q-text{font-size:1.15em;font-weight:500;line-height:1.6}
.q-hint{font-size:.85em;color:var(--text2);margin-top:8px;font-style:italic}

.q-options{display:flex;flex-direction:column;gap:10px}
.q-opt{padding:16px 20px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;transition:all .2s;font-size:.95em;line-height:1.4;position:relative}
.q-opt:hover{border-color:var(--accent);background:rgba(0,113,227,.03)}
.q-opt:active{transform:scale(.98)}
.q-opt .letter{display:inline-block;width:24px;height:24px;border-radius:50%;background:#f2f2f7;text-align:center;line-height:24px;font-size:.75em;font-weight:600;margin-right:10px;color:var(--text2);vertical-align:middle}
.q-opt.correct{border-color:var(--correct);background:rgba(52,199,89,.08);animation:correctPop .3s ease}
.q-opt.correct .letter{background:var(--correct);color:#fff}
.q-opt.wrong{border-color:var(--wrong);background:rgba(255,59,48,.06)}
.q-opt.wrong .letter{background:var(--wrong);color:#fff}
.q-opt.disabled{pointer-events:none;opacity:.6}

.q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.q-streak{font-size:.85em;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:4px}
.q-score{font-size:.85em;color:var(--text2)}
.q-score span{font-weight:700;color:var(--accent)}
.q-explain{display:none;margin-top:12px;padding:14px 16px;background:rgba(0,113,227,.04);border-radius:10px;border-left:3px solid var(--accent);font-size:.85em;color:var(--text2);line-height:1.6}
.q-explain.show{display:block;animation:fadeInUp .3s ease}
.q-next{display:none;margin-top:16px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:.95em;font-weight:600;cursor:pointer;width:100%;transition:all .2s}
.q-next:hover{background:var(--accent2)}
.q-next.show{display:block;animation:fadeInUp .3s ease}

/* ===== RESULT SCREEN ===== */
.result{display:none;padding:72px 20px 40px;max-width:640px;margin:0 auto;text-align:center}
.result-grade{font-size:4em;margin-bottom:8px}
.result-title{font-size:1.8em;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.result-subtitle{font-size:1em;color:var(--text2);margin-bottom:24px}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}
.rs-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 10px}
.rs-item .val{font-size:1.5em;font-weight:700}
.rs-item .val.green{color:var(--correct)}
.rs-item .val.gold{color:var(--gold)}
.rs-item .lab{font-size:.7em;color:var(--text2);margin-top:2px}
.result-bar{height:8px;background:#e5e5ea;border-radius:4px;overflow:hidden;margin:0 auto 20px;max-width:300px}
.result-bar-fill{height:100%;border-radius:4px;transition:width 1s ease}

.result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.r-btn{padding:12px 28px;border-radius:10px;font-size:.9em;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.r-btn:hover{transform:translateY(-1px)}
.r-btn:active{transform:scale(.97)}
.r-btn.primary{background:var(--accent);color:#fff}
.r-btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}

/* Leaderboard */
.leaderboard{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:left}
.leaderboard h3{font-size:.85em;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px;text-align:center}
.lb-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f2f2f7}
.lb-item:last-child{border:none}
.lb-rank{width:28px;font-weight:700;color:var(--gold);font-size:.9em}
.lb-info{flex:1}
.lb-mode{font-size:.8em;font-weight:500}
.lb-detail{font-size:.7em;color:var(--text2)}
.lb-score{font-weight:700;color:var(--accent);font-size:.9em}
.lb-empty{text-align:center;color:var(--text2);font-size:.85em;padding:12px 0}

/* Animations */
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

.fade-in{animation:fadeInUp .4s ease forwards}
.slide-in{animation:slideIn .35s ease forwards}

/* Responsive */
@media(max-width:640px){
  .home-hero h1{font-size:1.6em}
  .mode-grid{grid-template-columns:1fr 1fr;gap:8px}
  .mode-card{padding:14px 10px}
  .mode-card .icon{font-size:1.6em}
  .mode-card .name{font-size:.85em}
  .q-card{padding:20px 16px}
  .q-text{font-size:1.05em}
  .q-opt{padding:13px 16px;font-size:.9em}
  .result-title{font-size:1.4em}
  .result-grade{font-size:3em}
}
@media(max-width:380px){
  .mode-grid{grid-template-columns:1fr}
  .diff-row{flex-wrap:wrap}
  .stats-bar{flex-wrap:wrap}
}
</style>
</head>

      <div class="name">经典模式</div>
      <div class="desc">20题限时挑战</div>
    </div>

      <div class="icon">♾️</div>
      <div class="name">无尽模式</div>

    </div>

  </div>

  <div class="settings">

    <div class="diff-row">
      <div class="diff-btn active" data-diff="easy" onclick="selectDiff(this)">
        入门<span class="stars">⭐</span>

      <div class="diff-btn" data-diff="medium" onclick="selectDiff(this)">
        进阶<span class="stars">⭐⭐</span>
      </div>
      <div class="diff-btn" data-diff="hard" onclick="selectDiff(this)">
        大师<span class="stars">⭐⭐⭐</span>
      </div>
    </div>
  </div>

  <button class="start-btn" onclick="startQuiz()">开始挑战 →</button>

  <div class="stats-bar">
    <div class="stat-item"><div class="num" id="statGames">0</div><div class="label">总局数</div></div>
    <div class="stat-item"><div class="num" id="statBest">0</div><div class="label">最高分</div></div>
    <div class="stat-item"><div class="num" id="statStreak">0</div><div class="label">最长连击</div></div>
  </div>

  <div class="leaderboard" id="leaderboard">
    <h3>🏆 排行榜</h3>
    <div id="lbContent"><div class="lb-empty">还没有记录，开始第一局吧！</div></div>
  </div>
</div>

<!-- QUIZ -->
<div class="quiz" id="quizScreen">
  <div class="quiz-header">
    <div class="q-counter" id="qCounter">1 / 20</div>
    <div class="q-progress"><div class="q-progress-fill" id="qProgress" style="width:0%"></div></div>
    <div class="q-timer" id="qTimer">00:00</div>
  </div>
  <div class="q-card fade-in" id="qCard">
    <div class="q-type" id="qType">猜书名</div>
    <div class="q-text" id="qText">加载中...</div>
    <div class="q-hint" id="qHint"></div>
  </div>
  <div class="q-options" id="qOptions"></div>
  <div class="q-explain" id="qExplain"></div>
  <button class="q-next" id="qNext" onclick="nextQuestion()">下一题 →</button>
  <div class="q-footer">
    <div class="q-streak" id="qStreak"></div>
    <div class="q-score" id="qScore">得分: <span>0</span></div>
  </div>
</div>

<!-- RESULT -->
<div class="result" id="resultScreen">
  <div class="result-grade" id="rGrade">🎉</div>
  <div class="result-title" id="rTitle">挑战完成！</div>
  <div class="result-subtitle" id="rSubtitle">经典模式 · 进阶难度</div>
  <div class="result-bar"><div class="result-bar-fill" id="rBar" style="width:0%;background:var(--accent)"></div></div>
  <div class="result-stats">
    <div class="rs-item"><div class="val green" id="rCorrect">0</div><div class="lab">正确</div></div>
    <div class="rs-item"><div class="val" id="rTotal">0</div><div class="lab">总题数</div></div>
    <div class="rs-item"><div class="val gold" id="rMaxStreak">0</div><div class="lab">最长连击</div></div>
  </div>
  <div class="result-btns">
    <button class="r-btn primary" onclick="startQuiz()">再来一局</button>
    <button class="r-btn secondary" onclick="goHome()">返回首页</button>
  </div>
</div>

{t:"秦观词集",a:"秦观",e:"宋代",g:"词",y:1085,d:"苏门四学士之一，'两情若是久长时又岂在朝朝暮暮'为词中名句。"},
{t:"杨万里诗集",a:"杨万里",e:"宋代",g:"诗歌",y:1180,d:"南宋四大家之一，'诚斋体'自然活泼，'小荷才露尖尖角'家喻户晓。"},
{t:"朱熹文集",a:"朱熹",e:"宋代",g:"哲学",y:1180,d:"理学集大成者，四书集注为科举标准教材，影响中国思想史七百年。"},

// === QUIZ ENGINE ===
const ALL_WC = WC.filter(b => b.a && b.c);
const ALL_CL = CL.filter(b => b.a && b.d);

let mode = 'classic', diff = 'easy';
let questions = [], current = 0, score = 0, streak = 0, maxStreak = 0;
let correct = 0, timer = null, seconds = 0, timeLimit = 0;
let answered = false;

// === MODE & DIFFICULTY ===
function selectMode(el) {
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  mode = el.dataset.mode;
}
function selectDiff(el) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  diff = el.dataset.diff;
}

// === SCREENS ===
function showScreen(id) {
  document.querySelectorAll('.home,.quiz,.result').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = id === 'homeScreen' ? 'block' : '';
}
function goHome() {
  clearInterval(timer);
  showScreen('homeScreen');
  loadStats();
}

// === QUESTION GENERATORS ===
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pick(arr, n) { return shuffle(arr).slice(0, n); }
function pickWrong(pool, correct, key, n) {
  const wrongs = pool.filter(b => b[key] !== correct[key]).map(b => b[key]);
  const unique = [...new Set(wrongs)];
  return shuffle(unique).slice(0, n);
}

function genQuestions(count, pool, pool2) {
  const qs = [];
  const types = diff === 'easy' ? [1,2,5,6] : diff === 'medium' ? [1,2,3,4,5,6] : [2,3,4,5,6,7];
  const allPool = pool2 ? [...pool, ...pool2] : pool;

  for (let i = 0; i < count * 3 && qs.length < count; i++) {
    const book = pool[Math.floor(Math.random() * pool.length)];
    const type = types[Math.floor(Math.random() * types.length)];
    let q = null;

    if (type === 1 && book.w) {
      // "这本名著讲述的是..." -> 猜书名
      const wrongs = pickWrong(allPool, book, 't', 3);
      if (wrongs.length >= 3) q = { text: `"${book.w}"\n这是哪本书？`, answer: book.t, options: shuffle([book.t, ...wrongs]), type: '📖 猜书名', explain: `${book.t}——${book.a}（${book.c || book.e || ''}）` };
    }
    else if (type === 2) {
      // "xx写了哪本书？" 
      const target = pool2 ? allPool : pool;
      const b = target[Math.floor(Math.random() * target.length)];
      if (b.t && b.a) {
        const wrongs = pickWrong(target, b, 't', 3);
        if (wrongs.length >= 3) q = { text: `${b.a}写了以下哪部作品？`, answer: b.t, options: shuffle([b.t, ...wrongs]), type: '✍️ 猜作品', explain: `《${b.t}》——${b.a}` };
      }
    }
    else if (type === 3 && book.c) {
      // 猜国家
      const wrongs = pickWrong(allPool.filter(b => b.c), book, 'c', 3);
      if (wrongs.length >= 3) q = { text: `《${book.t}》是哪个国家（地区）的作品？`, answer: book.c, options: shuffle([book.c, ...wrongs]), type: '🌍 猜国家', explain: `《${book.t}》——${book.a}（${book.c}）` };
    }
    else if (type === 5) {
      // 猜作者
      const wrongs = pickWrong(allPool.filter(b => b.a), book, 'a', 3);
      if (wrongs.length >= 3) q = { text: `《${book.t}》的作者是？`, answer: book.a, options: shuffle([book.a, ...wrongs]), type: '👤 猜作者', explain: `${book.a}《${book.t}》` };
    }
    else if (type === 6 && book.g) {
      // 猜类型
      const wrongs = pickWrong(allPool.filter(b => b.g), book, 'g', 3);
      if (wrongs.length >= 3) q = { text: `《${book.t}》属于什么类型？`, answer: book.g, options: shuffle([book.g, ...wrongs]), type: '🏷️ 猜类型', explain: `《${book.t}》——${book.g}——${book.a}` };
    }
    else if (type === 7 && book.d) {
      // 中文文学：根据描述猜书名
      const wrongs = pickWrong(ALL_CL, book, 't', 3);
      if (wrongs.length >= 3) q = { text: `${book.d.slice(0, 60)}...`, answer: book.t, options: shuffle([book.t, ...wrongs]), type: '📝 猜书名', explain: `《${book.t}》——${book.a}（${book.e}）` };
    }
    else if (type === 4 && book.e) {
      // 猜时代
      const wrongs = pickWrong(ALL_CL.filter(b => b.e), book, 'e', 3);
      if (wrongs.length >= 3) q = { text: `《${book.t}》属于哪个时代？`, answer: book.e, options: shuffle([book.e, ...wrongs]), type: '⏳ 猜时代', explain: `《${book.t}》——${book.e}——${book.a}` };
    }

    if (q && !qs.some(x => x.text === q.text)) qs.push(q);
  }
  return shuffle(qs).slice(0, count);
}

// === QUIZ FLOW ===
function startQuiz() {
  current = 0; score = 0; streak = 0; maxStreak = 0; correct = 0; seconds = 0; answered = false;

  const pool = mode === 'versus' ? ALL_WC : [...ALL_WC, ...ALL_CL];
  const pool2 = mode === 'versus' ? ALL_CL : null;
  const count = mode === 'classic' ? 20 : mode === 'speed' ? 99 : 30;
  questions = genQuestions(count, pool, pool2);

  if (mode === 'speed') { timeLimit = 60; } else { timeLimit = 0; }

  showScreen('quizScreen');
  startTimer();
  showQuestion();
}

function startTimer() {
  clearInterval(timer);
  seconds = timeLimit || 0;
  updateTimerDisplay();
  timer = setInterval(() => {
    if (timeLimit) { seconds--; if (seconds <= 0) { clearInterval(timer); endQuiz(); return; } }
    else { seconds++; }
    updateTimerDisplay();
  }, 1000);
}
function updateTimerDisplay() {
  const el = document.getElementById('qTimer');
  const m = Math.floor(Math.abs(seconds) / 60);
  const s = Math.abs(seconds) % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('warning', timeLimit > 0 && seconds <= 10);
}

function showQuestion() {
  if (current >= questions.length) { endQuiz(); return; }
  answered = false;
  const q = questions[current];
  document.getElementById('qCounter').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('qProgress').style.width = `${((current) / questions.length) * 100}%`;
  document.getElementById('qType').textContent = q.type;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('qHint').textContent = '';
  document.getElementById('qExplain').className = 'q-explain';
  document.getElementById('qNext').className = 'q-next';

  const optDiv = document.getElementById('qOptions');
  optDiv.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'q-opt slide-in';
    btn.style.animationDelay = `${i * 0.06}s`;
    btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt}`;
    btn.onclick = () => handleAnswer(btn, opt, q);
    optDiv.appendChild(btn);
  });

  updateFooter();
}

function handleAnswer(btn, selected, q) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === q.answer;
  document.querySelectorAll('.q-opt').forEach(b => {
    b.classList.add('disabled');
    if (b.textContent.slice(1) === q.answer) b.classList.add('correct');
  });
  if (isCorrect) {
    btn.classList.add('correct');
    streak++;
    if (streak > maxStreak) maxStreak = streak;
    const base = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 30;
    const bonus = Math.min(streak - 1, 5) * 5;
    score += base + bonus;
    correct++;
  } else {
    btn.classList.add('wrong');
    streak = 0;
    if (mode === 'endless') { setTimeout(endQuiz, 800); return; }
  }

  document.getElementById('qExplain').textContent = q.explain;
  document.getElementById('qExplain').className = 'q-explain show';
  document.getElementById('qNext').className = 'q-next show';
  updateFooter();
}

function nextQuestion() {
  current++;
  showQuestion();
}

function updateFooter() {
  document.getElementById('qStreak').innerHTML = streak > 1 ? `🔥 ${streak} 连击！` : '';
  document.getElementById('qScore').innerHTML = `得分: <span>${score}</span>`;
}

function endQuiz() {
  clearInterval(timer);
  showScreen('resultScreen');

  const total = current + (answered ? 1 : 0);
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const grade = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : pct >= 50 ? '📚' : pct >= 30 ? '💪' : '🌱';
  const title = pct >= 90 ? '大师级！' : pct >= 70 ? '博学多才！' : pct >= 50 ? '继续加油！' : pct >= 30 ? '初露锋芒' : '文学之路刚刚开始';

  document.getElementById('rGrade').textContent = grade;
  document.getElementById('rTitle').textContent = title;
  const modeNames = { classic: '经典模式', endless: '无尽模式', speed: '闪电战', versus: '中日对决' };
  const diffNames = { easy: '入门', medium: '进阶', hard: '大师' };
  document.getElementById('rSubtitle').textContent = `${modeNames[mode]} · ${diffNames[diff]} · ${seconds >= 0 ? (timeLimit ? `${timeLimit - seconds}秒` : formatTime(seconds)) : ''}`;
  document.getElementById('rCorrect').textContent = correct;
  document.getElementById('rTotal').textContent = total;
  document.getElementById('rMaxStreak').textContent = maxStreak;

  const bar = document.getElementById('rBar');
  bar.style.width = '0%';
  bar.style.background = pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--gold)' : 'var(--wrong)';
  setTimeout(() => { bar.style.width = `${pct}%`; }, 100);

  saveRecord(mode, diff, score, correct, total, maxStreak);
  loadStats();
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  return m > 0 ? `${m}分${s % 60}秒` : `${s}秒`;
}

// === STORAGE ===
function saveRecord(mode, diff, score, correct, total, maxStreak) {
  try {
    const records = JSON.parse(localStorage.getItem('litquiz_records') || '[]');
    records.unshift({ mode, diff, score, correct, total, maxStreak, date: new Date().toLocaleDateString('zh-CN') });
    if (records.length > 50) records.length = 50;
    localStorage.setItem('litquiz_records', JSON.stringify(records));
  } catch(e) {}
}

function loadStats() {
  try {
    const records = JSON.parse(localStorage.getItem('litquiz_records') || '[]');
    document.getElementById('statGames').textContent = records.length;
    document.getElementById('statBest').textContent = records.reduce((m, r) => Math.max(m, r.score), 0);
    document.getElementById('statStreak').textContent = records.reduce((m, r) => Math.max(m, r.maxStreak), 0);

    const lb = document.getElementById('lbContent');
    if (records.length === 0) { lb.innerHTML = '<div class="lb-empty">还没有记录，开始第一局吧！</div>'; return; }
    const top = records.slice(0, 10);
    lb.innerHTML = top.map((r, i) => `
      <div class="lb-item">
        <div class="lb-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
        <div class="lb-info">
          <div class="lb-mode">${({classic:'经典',endless:'无尽',speed:'闪电战',versus:'对决'})[r.mode]} · ${{easy:'入门',medium:'进阶',hard:'大师'}[r.diff]}</div>
          <div class="lb-detail">${r.date} · ${r.correct}/${r.total}正确 · ${r.maxStreak}连击</div>
        </div>
        <div class="lb-score">${r.score}</div>
      </div>
    `).join('');
  } catch(e) {}
}

// === KEYBOARD SHORTCUTS ===
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') goHome();
  const opts = document.querySelectorAll('.q-opt:not(.disabled)');
  if (e.key >= '1' && e.key <= '4' && opts.length >= parseInt(e.key)) opts[parseInt(e.key) - 1].click();
  if (e.key === 'a' || e.key === 'A') { if (opts.length >= 1) opts[0].click(); }
  if (e.key === 'b' || e.key === 'B') { if (opts.length >= 2) opts[1].click(); }
  if (e.key === 'c' || e.key === 'C') { if (opts.length >= 3) opts[2].click(); }
  if (e.key === 'd' || e.key === 'D') { if (opts.length >= 4) opts[3].click(); }
  if (e.key === 'Enter' || e.key === ' ') { const nb = document.getElementById('qNext'); if (nb.classList.contains('show')) nextQuestion(); }
});

// === INIT ===
loadStats();

</script>
