function initNodes(){

function forceStep(iter){
  const a=1-iter/100;
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){

  });
}

function vis(){return nodes.filter(n=>n.y<=maxY&&(!searchQ||(n.tz+n.az+n.t+n.a+n.c).toLowerCase().includes(searchQ.toLowerCase())));}

function render(){
  if(view!=='star')return;
  ctx.clearRect(0,0,W,H);
  if(!render._s){render._s=[];for(let i=0;i<300;i++)render._s.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1+0.3,a:Math.random()*0.4+0.15});}
  render._s.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,200,255,${s.a*(0.6+0.4*Math.sin(Date.now()*0.001+s.x))})`;ctx.fill();});
  const v=vis(),vids=new Set(v.map(n=>n.id));
  if(showLinks)ED.forEach(e=>{
    if(!vids.has(e.s)||!vids.has(e.t))return;
    const a=nodes[e.s-1],b=nodes[e.t-1],hl=selId&&(e.s===selId||e.t===selId),hh=hovId&&(e.s===hovId||e.t===hovId);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=hl||hh?(e.type==='influence'?'rgba(167,139,250,0.5)':e.type==='response'?'rgba(251,191,36,0.5)':'rgba(52,211,153,0.4)'):'rgba(255,255,255,0.03)';
    ctx.lineWidth=hl||hh?1.5:0.4;ctx.stroke();
  });
  v.forEach(n=>{
    const isSel=n.id===selId,isHov=n.id===hovId,br=2.5+n.imp*1.6;
    const r=isSel?br*1.6:isHov?br*1.3:br;
    const al=isSel||isHov?1:(selId?0.25:0.75);
    if(isSel||isHov){const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3);g.addColorStop(0,n.col+'66');g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(n.x,n.y,r*3,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.globalAlpha=al;ctx.fillStyle=n.col;ctx.fill();
    if(n.imp>=4||isSel||isHov){ctx.font=`${isSel||isHov?'12':'10'}px "Noto Serif SC"`;ctx.fillStyle=isSel||isHov?'#fff':'#999';ctx.globalAlpha=isSel||isHov?1:0.55;ctx.textAlign='center';ctx.fillText(n.tz,n.x,n.y-r-4);}
    ctx.globalAlpha=1;
  });
  requestAnimationFrame(render);
}

// === MAP ===
function initMap(){
  if(mapReady)return;
  mapObj=L.map('map',{zoomControl:true,attributionControl:false}).setView([30,10],2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}{y}{r}.png',{maxZoom:8,minZoom:2}).addTo(mapObj);
  const v=B.filter(b=>b.y<=maxY&&(!searchQ||(b.tz+b.az+b.t+b.a+b.c).toLowerCase().includes(searchQ.toLowerCase())));
  markers.forEach(m=>mapObj.removeLayer(m));markers=[];
  // Group by city
  const cities={};
  v.forEach(b=>{
    const k=b.lat+','+b.lng;
    if(!cities[k])cities[k]=[];cities[k].push(b);
  });
  Object.values(cities).forEach(bs=>{
    const b=bs[0];
    const m=L.circleMarker([b.lat,b.lng],{
      radius:3+Math.log2(bs.length+1)*3+bs.reduce((a,x)=>a+x.imp,0)/bs.length*1.5,
      fillColor:b.col,fillOpacity:0.7,color:b.col,weight:1,opacity:0.5
    }).addTo(mapObj);
    const html=`<div style="max-width:220px">${bs.map(x=>`<div style="margin:3px 0;cursor:pointer" onclick="selectBook(${x.id})"><b style="color:${x.col}">${x.tz}</b><br><span style="color:#888;font-size:10px">${x.az} · ${x.y>0?x.y:'前'+Math.abs(x.y)} · ${x.city}</span></div>`).join('')}</div>`;
    m.bindPopup(html);
    m.on('mouseover',function(){this.openPopup();});
    markers.push(m);
  });
  mapReady=true;
}

function updateMap(){
  if(!mapObj)return;
  markers.forEach(m=>mapObj.removeLayer(m));markers=[];
  const v=B.filter(b=>b.y<=maxY&&(!searchQ||(b.tz+b.az+b.t+b.a+b.c).toLowerCase().includes(searchQ.toLowerCase())));
  const cities={};
  v.forEach(b=>{const k=b.lat+','+b.lng;if(!cities[k])cities[k]=[];cities[k].push(b);});
  Object.values(cities).forEach(bs=>{
    const b=bs[0];
    const m=L.circleMarker([b.lat,b.lng],{
      radius:3+Math.log2(bs.length+1)*3+bs.reduce((a,x)=>a+x.imp,0)/bs.length*1.5,
      fillColor:b.col,fillOpacity:0.7,color:b.col,weight:1,opacity:0.5
    }).addTo(mapObj);
    const html=`<div style="max-width:220px">${bs.map(x=>`<div style="margin:3px 0;cursor:pointer" onclick="selectBook(${x.id})"><b style="color:${x.col}">${x.tz}</b><br><span style="color:#888;font-size:10px">${x.az} · ${x.y>0?x.y:'前'+Math.abs(x.y)} · ${x.city}</span></div>`).join('')}</div>`;
    m.bindPopup(html);
    m.on('mouseover',function(){this.openPopup();});
    markers.push(m);
  });
}

function switchView(v){
  view=v;
  document.getElementById('starBtn').classList.toggle('active',v==='star');
  document.getElementById('mapBtn').classList.toggle('active',v==='map');
  document.getElementById('canvas').style.display=v==='star'?'block':'none';
  document.getElementById('map').style.display=v==='map'?'block':'none';
  if(v==='map'){
    if(!mapObj)initMap();else{mapObj.invalidateSize();updateMap();}
    document.getElementById('legend').style.display='none';
  } else {
    document.getElementById('legend').style.display='block';
  }
}

// === INTERACTION ===
cvs.addEventListener('mousemove',e=>{
  const mx=e.clientX,my=e.clientY-44,v=vis();let found=null;
  v.forEach(n=>{if(Math.hypot(n.x-mx,n.y-my)<10+n.imp*2)found=n;});
  hovId=found?found.id:null;cvs.style.cursor=found?'pointer':'crosshair';
  const tt=document.getElementById('tooltip');
  if(found){
    tt.style.display='block';tt.style.left=Math.min(mx+12,W-270)+'px';tt.style.top=Math.min(my+12,H-80)+'px';
    tt.innerHTML=`<div class="tt-t">${found.tz}</div><div class="tt-a">${found.az} · ${found.c} · ${found.y>0?found.y:'前'+Math.abs(found.y)} · ${found.city}</div><div>${found.th.map(t=>`<span class="tag theme">${TH[t]||t}</span>`).join('')}${found.ar.map(a=>`<span class="tag arch">${AR[a]||a}</span>`).join('')}</div>`;
  } else tt.style.display='none';
});

cvs.addEventListener('click',()=>{
  if(hovId)selectBook(hovId);else{selId=null;document.getElementById('sidebar').classList.remove('open');}
});

function selectBook(id){
  selId=id;const b=B.find(x=>x.id===id);if(!b)return;
  const sb=document.getElementById('sidebar');sb.classList.add('open');
  const rel=ED.filter(e=>e.s===id||e.t===id);
  const inc=rel.filter(e=>e.t===id).map(e=>({book:B.find(x=>x.id===e.s),type:e.type,note:e.note}));
  const out=rel.filter(e=>e.s===id).map(e=>({book:B.find(x=>x.id===e.t),type:e.type,note:e.note}));
  let h=`<h2>${b.tz}</h2><div class="meta">${b.az} · ${b.c} · ${b.y>0?b.y:'前'+Math.abs(b.y)} · ${b.g}<br>📍 ${b.city}</div>`;
  h+=`<div>${b.th.map(t=>`<span class="tag theme">${TH[t]}</span>`).join('')}${b.ar.map(a=>`<span class="tag arch">${AR[a]}</span>`).join('')}</div>`;
  if(inc.length){h+=`<div class="section"><h3>📥 受影响于 (${inc.length})</h3>`;inc.forEach(r=>{h+=`<div class="li" onclick="selectBook(${r.book.id})">← <b>${r.book.tz}</b> <span style="color:#666;font-size:10px">${r.note}</span></div>`;});h+=`</div>`;}
  if(out.length){h+=`<div class="section"><h3>📤 影响了 (${out.length})</h3>`;out.forEach(r=>{h+=`<div class="li" onclick="selectBook(${r.book.id})">→ <b>${r.book.tz}</b> <span style="color:#666;font-size:10px">${r.note}</span></div>`;});h+=`</div>`;}
  const same=B.filter(x=>x.id!==id&&x.ar.some(a=>b.ar.includes(a))).slice(0,6);
  if(same.length){h+=`<div class="section"><h3>🎭 同原型</h3>`;same.forEach(s=>{h+=`<div class="li" onclick="selectBook(${s.id})">${s.tz} <span style="color:#666">${s.c}</span></div>`;});h+=`</div>`;}
  // 在地图上定位
  if(mapObj){mapObj.flyTo([b.lat,b.lng],5,{duration:1});}
  document.getElementById('sb').innerHTML=h;
}

// === CONTROLS ===
function resetView(){selId=null;hovId=null;maxY=1960;searchQ='';mode='star';showLinks=true;
  document.getElementById('timeline').value=1960;document.getElementById('search').value='';document.getElementById('eraLabel').textContent='全部时代';
  document.getElementById('sidebar').classList.remove('open');
  document.querySelectorAll('.hbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('starBtn').classList.add('active');
  document.getElementById('linkBtn').classList.add('active');
  if(mapObj)mapObj.flyTo([30,10],2);
}
function toggleMode(m){
  const tb=document.getElementById('themeBtn'),ab=document.getElementById('archBtn');
  if(mode===m){mode='star';tb.classList.remove('active');ab.classList.remove('active');}
  else{mode=m;tb.classList.toggle('active',m==='theme');ab.classList.toggle('active',m==='arch');}
}
function toggleLinks(){showLinks=!showLinks;document.getElementById('linkBtn').classList.toggle('active',showLinks);}
document.getElementById('timeline').addEventListener('input',e=>{
  maxY=+e.target.value;
  const era=ERAS.find(er=>maxY>=er.y0&&maxY<=er.y1);
  document.getElementById('eraLabel').textContent=maxY>=1950?'全部时代':(era?era.name:maxY+'年');
  if(view==='map')updateMap();
});
document.getElementById('search').addEventListener('input',e=>{searchQ=e.target.value;if(view==='map')updateMap();});

// === LEGEND ===
function buildLegend(){
  const regions=[...new Set(B.map(b=>b.c))].sort();
  const rc={};
  B.forEach(b=>{if(!rc[b.c]||b.imp>(rc[b.c].imp||0))rc[b.c]=b;});
  document.getElementById('legend').innerHTML=regions.filter(r=>rc[r]).map(r=>`<div class="ri"><div class="dot" style="background:${rc[r].col}"></div>${r}</div>`).join('');
}

// === INIT ===
window.addEventListener('resize',()=>{resize();if(mapObj)mapObj.invalidateSize();});
resize();buildLegend();
document.getElementById('linkBtn').classList.add('active');
render();
</script>
