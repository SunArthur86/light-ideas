const M={};B.forEach(b=>M[b.id]=b);
let W,H,ox=0,oy=0,sc=.8,drag=false,dx,dy,hov=null,ftype='all',sq='';
const c=document.getElementById('c'),x=c.getContext('2d');

function rsz(){W=innerWidth;H=innerHeight;c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';dr()}
onresize=rsz;

function ts(wx,wy){return[(wx+ox)*sc+W/2,(wy+oy)*sc+H/2]}
function tw(sx,sy){return[(sx-W/2)/sc-ox,(sy-H/2)/sc-oy]}

function dr(){
  x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,W,H);
  x.fillStyle='#0a0a1a';x.fillRect(0,0,W,H);
  
  // Stars background
  for(let i=0;i<150;i++){
    const sx=((Math.sin(i*127.1)*43758.5)%1)*W;
    const sy=((Math.sin(i*269.5)*43758.5)%1)*H;
    x.fillStyle=`rgba(255,255,255,${Math.abs(Math.sin(i*0.3))*.3+.1})`;
    x.beginPath();x.arc(Math.abs(sx%W),Math.abs(sy%H),.5,0,6.28);x.fill();
  }

  // Links
  const fl=ftype==='all'?L:L.filter(l=>l[2]===ftype);
  fl.forEach(l=>{
    const a=M[l[0]],b=M[l[1]];if(!a||!b)return;
    if(sq&&!a.t.includes(sq)&&!a.a.includes(sq)&&!b.t.includes(sq)&&!b.a.includes(sq))return;
    const[x1,y1]=ts(a.x,a.y2);const[x2,y2]=ts(b.x,b.y2);
    const col={influence:'#4a90d9',parallel:'#50c878',response:'#e74c3c'}[l[2]]||'#4a90d9';
    x.strokeStyle=col;x.globalAlpha=.12;x.lineWidth=.5;
    x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.globalAlpha=1;
  });

  // Stars
  B.forEach(b=>{
    const dim=sq&&!b.t.includes(sq)&&!b.a.includes(sq);
    if(dim)x.globalAlpha=.1;
    const[sx,sy]=ts(b.x,b.y2);
    const r=Math.max(1.5,b.imp*1.2)*sc;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50){x.globalAlpha=1;return}
    // Glow
    const g=x.createRadialGradient(sx,sy,0,sx,sy,r*4);
    g.addColorStop(0,b.col+'66');g.addColorStop(1,'transparent');
    x.fillStyle=g;x.beginPath();x.arc(sx,sy,r*4,0,6.28);x.fill();
    // Dot
    x.fillStyle=b.col;x.beginPath();x.arc(sx,sy,r,0,6.28);x.fill();
    // Label
    if(sc>.5||b.imp>=5){x.fillStyle='rgba(255,255,255,.6)';x.font='9px sans-serif';x.textAlign='center';x.fillText(b.t,sx,sy+r+11)}
    x.globalAlpha=1;
  });

  // Hover ring
  if(hov){
    const[sx,sy]=ts(hov.x,hov.y2);const r=Math.max(1.5,hov.imp*1.2)*sc;
    x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.arc(sx,sy,r+5,0,6.28);x.stroke();

c.onmousedown=e=>{drag=true;dx=e.clientX;dy=e.clientY};
c.onmousemove=e=>{
  if(drag){ox+=(e.clientX-dx)/sc;oy+=(e.clientY-dy)/sc;dx=e.clientX;dy=e.clientY;dr();return}
  const[wx,wy]=tw(e.clientX,e.clientY);
  let best=null,bd=20/sc;
  B.forEach(b=>{const d=Math.hypot(b.x-wx,b.y2-wy);if(d<bd){bd=d;best=b}});
  if(best!==hov){hov=best;dr()}
  const tip=document.getElementById('tip');
  if(best){
    tip.classList.add('show');
    let tx=e.clientX+16,ty=e.clientY+16;
    if(tx+260>W)tx=e.clientX-270;
    if(ty+120>H)ty=e.clientY-130;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
    document.getElementById('tt').textContent=best.t;
    document.getElementById('tt').style.color=best.col;
    document.getElementById('ta').textContent=best.a+' · '+best.c+' · '+(best.y<0?'公元前'+Math.abs(best.y):best.y)+'年';
    document.getElementById('ts').textContent='★'.repeat(best.imp)+'☆'.repeat(5-best.imp);
    document.getElementById('tm').textContent=best.g;
  }else tip.classList.remove('show');
};
c.onmouseup=()=>drag=false;
