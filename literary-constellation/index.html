    const ei=ERAS.findIndex(e=>e.id===b.era);
    const angle=(ei/ERAS.length)*Math.PI*2 + idx*0.3;
    const baseR=120+ei*28;
    const r=baseR+(idx%3)*25;
    return {
      ...b,x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r,
      vx:0,vy:0,fixed:false
    };
  });
  // Run force simulation
  for(let iter=0;iter<120;iter++) forceStep(iter);
}

function forceStep(iter){
  const alpha=1-iter/120;
  // Repulsion between all nodes
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[j].x-nodes[i].x, dy=nodes[j].y-nodes[i].y;
      let d2=dx*dx+dy*dy; if(d2<1) d2=1;
      const f=800*alpha/d2;
      const dd=Math.sqrt(d2);
      nodes[i].vx-=dx/dd*f; nodes[i].vy-=dy/dd*f;
      nodes[j].vx+=dx/dd*f; nodes[j].vy+=dy/dd*f;
    }
  }
  // Attraction along links
  edges.forEach(e=>{
    const a=nodes[e.s-1],b=nodes[e.t-1];
    if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const f=(d-80)*0.02*alpha;
    a.vx+=dx/d*f; a.vy+=dy/d*f;
    b.vx-=dx/d*f; b.vy-=dy/d*f;
  });
  // Center gravity
  nodes.forEach(n=>{
    n.vx+=(cx-n.x)*0.005*alpha;
    n.vy+=(cy-n.y)*0.005*alpha;
  });
  // Apply
  nodes.forEach(n=>{
    if(n.fixed)return;
    n.vx*=0.6;n.vy*=0.6;
    n.x+=n.vx;n.y+=n.vy;
    // Keep in bounds
    n.x=Math.max(50,Math.min(W-50,n.x));
    n.y=Math.max(60,Math.min(H-60,n.y));
  });
}

// === FILTERING ===
function filtered(){
  return nodes.filter(n=>{
    if(n.y>maxYear) return false;
    if(searchQ){
      const q=searchQ.toLowerCase();
      if(!(n.tz.includes(q)||n.az.includes(q)||n.t.toLowerCase().includes(q)||n.a.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

// === RENDER ===
let animFrame;
function render(){
  ctx.clearRect(0,0,W,H);

  // Background stars
  if(!render._stars){
    render._stars=[];
    for(let i=0;i<200;i++) render._stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,a:Math.random()*0.5+0.2});
  }
  render._stars.forEach(s=>{
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a*(0.5+0.5*Math.sin(Date.now()*0.001+s.x))})`;
    ctx.fill();
  });

  const vis=filtered();
  const visIds=new Set(vis.map(n=>n.id));

  // Draw links
  if(showLinks){
    edges.forEach(e=>{
      if(!visIds.has(e.s)||!visIds.has(e.t))return;
      const a=nodes[e.s-1],b=nodes[e.t-1];
      const highlight=selectedId&&(e.s===selectedId||e.t===selectedId);
      const hoverHL=hoveredId&&(e.s===hoveredId||e.t===hoveredId);
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      if(highlight||hoverHL){
        ctx.strokeStyle=e.type==='influence'?'rgba(167,139,250,0.5)':e.type==='response'?'rgba(251,191,36,0.5)':e.type==='parallel'?'rgba(52,211,153,0.4)':'rgba(255,255,255,0.3)';
        ctx.lineWidth=1.5;
      } else {
        ctx.strokeStyle='rgba(255,255,255,0.04)';
        ctx.lineWidth=0.5;
      }
      ctx.stroke();
    });
  }

  // Draw nodes
  vis.forEach(n=>{
    const isSelected=n.id===selectedId;
    const isHovered=n.id===hoveredId;
    const baseR=3+n.imp*1.8;
    const r=isSelected?baseR*1.6:isHovered?baseR*1.3:baseR;
    const alpha=isSelected||isHovered?1:(selectedId?0.3:0.8);

    // Glow
    if(isSelected||isHovered){
      const grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3);
      grad.addColorStop(0,n.col+'66');
      grad.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(n.x,n.y,r*3,0,Math.PI*2);
      ctx.fillStyle=grad;ctx.fill();
    }

    // Star dot
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=n.col;
    ctx.fill();

    // Label for important or hovered/selected
    if(n.imp>=4||isSelected||isHovered){
      ctx.font=`${isSelected||isHovered?'12':'10'}px "Noto Serif SC",serif`;
      ctx.fillStyle=isSelected||isHovered?'#fff':'#aaa';
      ctx.globalAlpha=isSelected||isHovered?1:0.6;
      ctx.textAlign='center';
      ctx.fillText(n.tz,n.x,n.y-r-4);
    }
    ctx.globalAlpha=1;
  });

  // Mode overlay
  if(mode==='theme') drawModeOverlay('th',THEMES,'theme');
  if(mode==='arch') drawModeOverlay('ar',ARCHS,'arch');

  animFrame=requestAnimationFrame(render);
}

function drawModeOverlay(tagKey,map,cls){
  const vis=filtered();
  const groups={};
  vis.forEach(n=>{
    (n[tagKey]||[]).forEach(k=>{
      if(!groups[k])groups[k]=[];
      groups[k].push(n);
    });
  });
  // Draw convex hulls (simplified: circles)
  Object.entries(groups).forEach(([k,ns])=>{
    if(ns.length<2)return;
    let sx=0,sy=0;
    ns.forEach(n=>{sx+=n.x;sy+=n.y;});
    const mx=sx/ns.length,my=sy/ns.length;
    let maxD=0;
    ns.forEach(n=>{const d=Math.hypot(n.x-mx,n.y-my);if(d>maxD)maxD=d;});
    ctx.beginPath();ctx.arc(mx,my,maxD+20,0,Math.PI*2);
    ctx.fillStyle=ns[0].col+'0a';
    ctx.strokeStyle=ns[0].col+'33';
    ctx.lineWidth=1;
    ctx.fill();ctx.stroke();
    ctx.font='10px "Noto Serif SC"';
    ctx.fillStyle=ns[0].col+'99';
    ctx.textAlign='center';
    ctx.fillText(map[k]||k,mx,my-maxD-8);
  });
}

// === INTERACTION ===
cvs.addEventListener('mousemove',e=>{
  const mx=e.clientX,my=e.clientY;
  const vis=filtered();
  let found=null;
  vis.forEach(n=>{
    const d=Math.hypot(n.x-mx,n.y-my);
    if(d<12+n.imp*2) found=n;
  });
  hoveredId=found?found.id:null;
  cvs.style.cursor=found?'pointer':'crosshair';

  const tt=document.getElementById('tooltip');
  if(found){
    tt.style.display='block';
    tt.style.left=Math.min(mx+15,W-270)+'px';
    tt.style.top=Math.min(my+15,H-80)+'px';
    tt.innerHTML=`<div class="tt-title">${found.tz}</div><div class="tt-author">${found.az} · ${found.c} · ${found.y>0?found.y:'前'+Math.abs(found.y)}</div><div class="tt-tags">${found.th.map(t=>`<span class="tag theme">${THEMES[t]||t}</span>`).join('')}${found.ar.map(a=>`<span class="tag arch">${ARCHS[a]||a}</span>`).join('')}</div>`;
  } else {
    tt.style.display='none';
  }
});

cvs.addEventListener('click',e=>{
  if(hoveredId){
    selectBook(hoveredId);
  } else {
    selectedId=null;
    document.getElementById('sidebar').classList.remove('open');
  }
});

function selectBook(id){
  selectedId=id;
  const b=B.find(x=>x.id===id);
  if(!b)return;
  const sb=document.getElementById('sidebar');
  sb.classList.add('open');
  const relatedLinks=edges.filter(e=>e.s===id||e.t===id);
  // incoming
  const incoming=relatedLinks.filter(e=>e.t===id).map(e=>({book:B.find(x=>x.id===e.s),type:e.type,note:e.note}));
  // outgoing
  const outgoing=relatedLinks.filter(e=>e.s===id).map(e=>({book:B.find(x=>x.id===e.t),type:e.type,note:e.note}));

  let html=`<h2>${b.tz}</h2>
    <div class="meta">${b.az} · ${b.c} · ${b.y>0?b.y:'前'+Math.abs(b.y)} · ${b.g}</div>
    <div>${b.th.map(t=>`<span class="tag theme">${THEMES[t]}</span>`).join('')}${b.ar.map(a=>`<span class="tag arch">${ARCHS[a]}</span>`).join('')}</div>`;

  if(incoming.length){
    html+=`<div class="section"><h3>📥 受影响于</h3>`;
    incoming.forEach(r=>{
      html+=`<div class="link-item" onclick="selectBook(${r.book.id})">← <b>${r.book.tz}</b> <span style="color:#888">${r.type}: ${r.note.slice(0,30)}</span></div>`;
    });
    html+=`</div>`;
  }
  if(outgoing.length){
    html+=`<div class="section"><h3>📤 影响了</h3>`;
    outgoing.forEach(r=>{
      html+=`<div class="link-item" onclick="selectBook(${r.book.id})">→ <b>${r.book.tz}</b> <span style="color:#888">${r.type}: ${r.note.slice(0,30)}</span></div>`;
    });
    html+=`</div>`;
  }

  // Same archetype books
  const sameArch=B.filter(x=>x.id!==id&&x.ar.some(a=>b.ar.includes(a))).slice(0,8);
  if(sameArch.length){
    html+=`<div class="section"><h3>🎭 同原型</h3>`;
    sameArch.forEach(s=>{
      html+=`<div class="link-item" onclick="selectBook(${s.id})">${s.tz} <span style="color:#888">${s.c}</span></div>`;
    });
    html+=`</div>`;
  }

  document.getElementById('sidebar-content').innerHTML=html;
}

// === CONTROLS ===
function resetView(){
  selectedId=null;hoveredId=null;maxYear=1930;searchQ='';
  document.getElementById('timeline').value=1930;
  document.getElementById('search').value='';
  document.getElementById('eraLabel').textContent='全部时代';
  document.getElementById('sidebar').classList.remove('open');
  mode='star';
  document.getElementById('modeBtn').classList.remove('active');
  document.getElementById('archBtn').classList.remove('active');
}

function toggleMode(){
  const btn=document.getElementById('modeBtn');
  if(mode==='theme'){mode='star';btn.classList.remove('active');}
  else{mode='theme';btn.classList.add('active');document.getElementById('archBtn').classList.remove('active');}
}

function toggleArch(){
  const btn=document.getElementById('archBtn');
  if(mode==='arch'){mode='star';btn.classList.remove('active');}
  else{mode='arch';btn.classList.add('active');document.getElementById('modeBtn').classList.remove('active');}
}

function toggleLinks(){showLinks=!showLinks;}

document.getElementById('timeline').addEventListener('input',e=>{
  maxYear=+e.target.value;
  const era=ERAS.find(er=>maxYear>=er.y0&&maxYear<=er.y1);
  document.getElementById('eraLabel').textContent=maxYear>=1925?'全部时代':(era?era.name:maxYear+'年');
});

document.getElementById('search').addEventListener('input',e=>{
  searchQ=e.target.value;
});

// === LEGEND ===
function buildLegend(){
  const regions=[...new Set(B.map(b=>b.c))].sort();
  const el=document.getElementById('region-legend');
  el.innerHTML=regions.map(r=>`<div class="ri"><div class="dot" style="background:${REGION_COLORS[r]||'#95A5A6'}"></div>${r}</div>`).join('');
}

function updateStats(){
  const vis=filtered();
  document.getElementById('stats').innerHTML=`可见: ${vis.length}/100本<br>关系: ${edges.filter(e=>vis.find(v=>v.id===e.s)&&vis.find(v=>v.id===e.t)).length}条`;
}

// === INIT ===
window.addEventListener('resize',resize);
resize();
buildLegend();
render();
setInterval(updateStats,500);
</script>
</body>
