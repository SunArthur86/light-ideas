<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>四梦归一 · Four Dreams Become One</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--surface:#f5f5f7;--text:#1d1d1f;--text2:#6e6e73;--accent:#7c3aed;--border:#e5e5e5}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06);height:48px;display:flex;align-items:center;padding:0 20px;gap:16px}
nav .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
nav .title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{position:fixed;top:48px;left:0;height:2px;background:var(--accent);z-index:101;transition:width .1s}
.layout{display:flex;margin-top:48px;min-height:calc(100vh - 48px)}
.sidebar{width:280px;border-right:1px solid var(--border);overflow-y:auto;height:calc(100vh - 48px);position:sticky;top:48px;padding:12px 0}
.sidebar .search{margin:0 12px 8px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;width:calc(100% - 24px);outline:none;font-family:inherit}
.sidebar .search:focus{border-color:var(--accent)}
.sidebar .ch{display:block;padding:8px 20px;font-size:13px;color:var(--text2);text-decoration:none;transition:background .15s;cursor:pointer}
.sidebar .ch:hover{background:var(--surface)}
.sidebar .ch.active{background:rgba(124,58,237,.08);color:var(--accent);font-weight:600}
.content{flex:1;max-width:720px;margin:0 auto;padding:48px 24px 120px}
.content h1{font-family:'Noto Serif SC',Georgia,serif;font-size:28px;font-weight:700;margin-bottom:24px;line-height:1.3}
.content p,.content li{font-family:'Noto Serif SC',Georgia,serif;font-size:17px;line-height:1.85;color:#333}
.content h2{font-size:20px;margin:32px 0 16px;color:var(--text)}
.content h3{font-size:17px;margin:24px 0 12px}
.welcome{text-align:center;padding:120px 24px}
.welcome .emoji{font-size:64px;margin-bottom:24px}
.welcome h2{font-size:24px;font-weight:600;margin-bottom:8px}
.welcome p{color:var(--text2);margin-bottom:32px}
.welcome .start{display:inline-block;padding:12px 28px;background:var(--accent);color:#fff;border-radius:100px;text-decoration:none;font-weight:500;font-size:15px}
.welcome .start:hover{opacity:.9}
.nav-btns{display:flex;justify-content:space-between;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.nav-btns a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
.loading{text-align:center;padding:80px;color:var(--text2)}
@media(max-width:860px){
  .sidebar{display:none;position:fixed;top:48px;left:0;right:0;bottom:0;width:100%;z-index:99;background:#fff}
  .sidebar.open{display:block}
  .menu-btn{display:block!important}
}
.menu-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<nav>
  <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
  <a href="../index.html" class="back">← Light Ideas</a>
  <span class="title" id="navTitle">四梦归一</span>
</nav>
<div class="progress" id="prog"></div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <input class="search" placeholder="搜索回目..." oninput="filterCh(this.value)">
    <div id="chList"></div>
  </div>
  <div class="content" id="content">
    <div class="welcome">
      <div class="emoji">📖</div>
      <h2>四梦归一</h2>
      <p>120回 · 119,633字 · 四大名著融合 · 双主角</p>
      <a href="#chapter-001" class="start">开始阅读 · 第一回</a>
    </div>
  </div>
</div>
<script>
const CN=['零','一','二','三','四','五','六','七','八','九','十','百'];
function toCN(n){if(n<=10)return CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');if(n<100)return CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:'');return '一百'+(n%100?((n%100<20?'':'')+(n%100===20?'二十':toCN(n%100))):'');}
const list=document.getElementById('chList');
for(let i=1;i<=120;i++){
  const pad=String(i).padStart(3,'0');
  const a=document.createElement('a');
  a.className='ch';a.textContent='第'+toCN(i)+'回';
  a.href='#chapter-'+pad;a.dataset.idx=i;
  a.onclick=()=>{document.querySelector('.sidebar').classList.remove('open')};
  list.appendChild(a);
}
function filterCh(q){
  list.querySelectorAll('.ch').forEach(a=>{
    a.style.display=a.textContent.includes(q)?'':'none';
  });
}
const content=document.getElementById('content');
const cache={};
async function loadCh(pad){
  if(cache[pad])return cache[pad];
  const r=await fetch('chapters-v2/chapter-'+pad+'.md');
  if(!r.ok)throw new Error('Not found');
  const t=await r.text();
  cache[pad]=t;return t;
}
async function showCh(pad){
  content.innerHTML='<div class="loading">加载中...</div>';
  try{
    const md=await loadCh(pad);
    content.innerHTML=marked.parse(md);
    const idx=parseInt(pad);
    const prev=idx>1?String(idx-1).padStart(3,'0'):null;
    const next=idx<120?String(idx+1).padStart(3,'0'):null;
    let nav='<div class="nav-btns">';
    nav+=prev?'<a href="#chapter-'+prev+'">← 第'+toCN(idx-1)+'回</a>':'<span></span>';
    nav+=next?'<a href="#chapter-'+next+'">第'+toCN(idx+1)+'回 →</a>':'<span></span>';
    nav+='</div>';
    content.innerHTML+=nav;
    document.getElementById('navTitle').textContent='第'+toCN(idx)+'回';
    list.querySelectorAll('.ch').forEach(a=>a.classList.toggle('active',a.dataset.idx==idx));
    window.scrollTo(0,0);
  }catch(e){content.innerHTML='<p style="color:red;text-align:center;padding:80px">章节加载失败</p>';}
}
window.onhashchange=()=>{const h=location.hash;if(h.startsWith('#chapter-'))showCh(h.slice(9));};
if(location.hash.startsWith('#chapter-'))showCh(location.hash.slice(9));
window.addEventListener('scroll',()=>{
  const s=document.documentElement.scrollTop;
  const h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('prog').style.width=(h>0?s/h*100:0)+'%';
});
</script>
</body>
</html>
