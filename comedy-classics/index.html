<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喜剧精读 · 50本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1d1d1f;--dim:#86868b;--border:#e5e5e5;--accent:#e6a817;--accent-light:#f5c842;--glow:rgba(230,168,23,.18)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;min-height:100vh}

/* ── Top Bar ── */
.top{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px}
.top a{color:var(--dim);text-decoration:none;font-size:13px;white-space:nowrap}
.top h1{font-size:20px;font-weight:700;flex:1}
.search-wrap{position:relative;display:flex;align-items:center}
.search{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:14px;width:220px;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.search-count{position:absolute;right:12px;font-size:11px;color:var(--dim);background:var(--bg);padding:0 4px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .2s}
.search-count.show{opacity:1}

/* ── Tabs ── */
.tabs{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#fff}
.tab{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:none;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.tab:hover{background:#f5f5f7}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Stats ── */
.stats{padding:16px 24px;font-size:13px;color:var(--dim)}
.stats b{color:var(--text)}

/* ── Grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px 24px 40px}

/* ── Card ── */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px 20px 20px 24px;transition:border-color .3s,box-shadow .3s,transform .3s,opacity .4s;cursor:pointer;border-left:4px solid var(--accent);opacity:0;transform:translateY(16px)}
.card.show{opacity:1;transform:translateY(0)}
.card:hover{border-left-color:var(--accent-light);box-shadow:0 4px 20px rgba(230,168,23,.12);transform:translateY(-2px)}
.card .num{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .type-icon{font-size:15px}
.card .title{font-size:16px;font-weight:600;margin-bottom:2px;line-height:1.4}
.card .en{font-size:12px;color:var(--dim);margin-bottom:8px;font-style:italic}
.card .meta{font-size:12px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.card .meta span{background:#fef9e7;padding:2px 8px;border-radius:8px;white-space:nowrap}
.card .st-badge{display:inline-flex;align-items:center;gap:3px;background:#fff8e1!important;color:#b8860b;font-weight:500}

/* ── Modal Overlay ── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal-overlay.active{opacity:1;visibility:visible}
.modal{background:#fff;border-radius:16px;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;padding:32px;position:relative;transform:translateY(24px) scale(.97);transition:transform .3s;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:#f5f5f7;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:background .2s,color .2s}
.modal-close:hover{background:#e5e5e5;color:var(--text)}
.modal .m-icon{font-size:36px;margin-bottom:12px}
.modal .m-title{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:4px}
.modal .m-en{font-size:14px;color:var(--dim);font-style:italic;margin-bottom:16px}
.modal .m-fields{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin-bottom:16px}
.modal .m-fields .label{color:var(--dim);font-weight:500;white-space:nowrap}
.modal .m-fields .value{color:var(--text)}
.modal .m-divider{height:1px;background:var(--border);margin:16px 0}
.modal .m-summary{font-size:14px;line-height:1.7;color:#444}

/* ── Responsive ── */
@media(max-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:12px 16px}.top{padding:12px 16px}.tabs{padding:10px 16px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.tab{flex-shrink:0}}
@media(max-width:640px){
  .top{padding:12px 16px;gap:10px;flex-wrap:wrap}
  .top h1{font-size:17px}
  .search{width:100%;order:3;margin-top:4px}
  .tabs{padding:10px 16px}
  .grid{grid-template-columns:1fr;padding:12px 16px 32px;gap:12px}
  .modal{padding:20px;margin:8px;max-height:92vh;border-radius:16px}
}
@media(max-width:420px){.card{padding:14px}.card .title{font-size:15px}.modal{padding:16px;margin:4px}.search{font-size:13px}}

/* ── Scrollbar ── */
.modal::-webkit-scrollbar{width:6px}
.modal::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top">
<a href="../index.html">← 返回</a>
<h1>😂 喜剧精读</h1>
<div class="search-wrap">
<input class="search" id="searchInput" placeholder="搜索书名、作者..." oninput="render()">
<span class="search-count" id="searchCount"></span>
</div>
<button onclick="randomBook()" style="background:var(--card);border:1px solid var(--border);color:var(--accent);padding:7px 14px;border-radius:20px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap">🎲 随机一本</button>
</div>

<!-- Tabs -->
<div class="tabs" id="ttabs"></div>

<!-- Stats -->
<div class="stats" id="stats"></div>

<!-- Grid -->
<div class="grid" id="grid"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modalBody"></div>
</div>
</div>

{t:"斯卡潘的诡计",a:"莫里哀",y:1671,c:"法国",tp:"闹剧/市井",s:"狡猾的仆人斯卡潘用一系列巧计帮助两位少爷赢得爱情，同时教训了吝啬的父亲。",r:4}
];

// ── Type-to-icon mapping ──
var ICONS={
'讽刺':'🎭','荒诞':'🤪','黑色':'💀','浪漫':'💕','闹剧':'🎪',
'讽刺喜剧':'🎯','市井':'🍻','政治讽刺':'🏛️','哲理':'📖','反战':'✌️',
'身份错位':'🔄','文学讽刺':'📝','哲学讽刺':'🧠','旧喜剧':'🏺',
'流浪汉':'🚶','田园':'🌿','问题喜剧':'❓','性格':'😄','世态':'🏘️',
'喜剧':'😂','框架叙事':'📚','反骑士':'⚔️','罗马新喜剧':'🏛️',
'骑士':'🐴','风俗':'🏠','风俗喜剧':'🏡','神仙':'✨','传奇':'🌟',
'传奇剧':'🌟','悲喜剧':'🎭','传奇喜剧':'🌟','正剧':'📜',
'情节':'🎭','佳构':'🏗️','散文':'📝','诗体':'🖊️','短篇':'📖',
'小说':'📖','诗体短篇':'🖊️','道德':'⚖️','散文小说':'📝',
'反英雄':'🦸','无政府':'🌋','超现实':'🌀','荒诞派':'🌀',
'荒诞主义':'🌀','存在主义':'💭','新喜剧':'🏺','复仇':'⚔️',
'乌托邦':'🌈','中篇':'📖','哥特':'🦇','散文诗':'🌸',
'韵文':'📜','韵文传奇':'📜','诗体寓言':'寓言'
};

function getIcon(tp){
  if(!tp)return '📖';
  for(var k in ICONS){if(tp.indexOf(k)!==-1)return ICONS[k]}
  return '📖';
}

// ── Extract short type (st) from tp field ──
var typeSet={};
B.forEach(function(b){
  if(!b.tp)return;
  // Split by "/" and "（）" and "与" to get individual tags
  var tags=b.tp.replace(/（[^）]*）/g,'').split(/[\/、与]/);
  tags.forEach(function(tag){
    tag=tag.replace(/[（）\s]/g,'').trim();
    if(tag)typeSet[tag]=1;
  });
});

// ── Build type list from data's st field if present, else from tp ──
var stSet={};
B.forEach(function(b){
  if(b.st){stSet[b.st]=1;}
});
var types=Object.keys(stSet);
if(types.length<3){
  // Fallback: extract from tp
  var tpSet={};
  B.forEach(function(b){
    if(!b.tp)return;
    b.tp.replace(/（[^）]*）/g,'').split(/[\/、]/).forEach(function(s){
      s=s.replace(/[（）\s]/g,'').trim();
      if(s&&s.length<8)tpSet[s]=1;
    });
  });
  types=Object.keys(tpSet);
}

var curT='全部';

function init(){
  var el=document.getElementById('ttabs');
  var h='<button class="tab on" onclick="setT(this)">全部</button>';
  types.forEach(function(t){h+='<button class="tab" onclick="setT(this)">'+t+'</button>'});
  el.innerHTML=h;
  render();
}

function setT(el){
  curT=el.textContent.trim();
  el.parentNode.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
  el.classList.add('on');
  render();
}

function render(){
  var q=document.querySelector('.search').value.toLowerCase();
  var list=B.filter(function(b){
    if(curT!=='全部'){
      // Match against st or tp
      var matchST=b.st===curT;
      var matchTP=b.tp&&b.tp.indexOf(curT)!==-1;
      if(!matchST&&!matchTP)return false;
    }
    if(q&&!((b.t+b.e+b.a+b.c+(b.tp||'')).toLowerCase().indexOf(q)>=0))return false;
    return true;
  });

  // Stats
  document.getElementById('stats').innerHTML='共 <b>'+list.length+'</b> 本喜剧名著';

  // Search count
  var countEl=document.getElementById('searchCount');
  if(q){
    countEl.textContent=list.length+' 结果';
    countEl.classList.add('show');
  }else{
    countEl.classList.remove('show');
  }

  var g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div style="text-align:center;padding:60px;color:#86868b;grid-column:1/-1">没有匹配的书籍 😅</div>';
    return;
  }

  g.innerHTML=list.map(function(b,i){
    var icon=getIcon(b.tp||b.st||'');
    var stLabel=b.st||(b.tp?b.tp.split('/')[0].trim():'');
    var stIcon=getIcon(stLabel);
    return '<div class="card" style="transition-delay:'+(i*40)+'ms" onclick="openModal('+B.indexOf(b)+')">'
      +'<div class="num"><span>'+stIcon+' #'+(i+1)+'</span></div>'
      +'<div class="title">'+b.t+'</div>'
      +'<div class="en">'+(b.e||'')+'</div>'
      +'<div class="meta">'
        +(b.a?'<span>'+b.a+'</span>':'')
        +(b.c?'<span>'+b.c+'</span>':'')
        +(b.y?'<span>约'+b.y+'年</span>':'')
        +(stLabel?'<span class="st-badge">'+stIcon+' '+stLabel+'</span>':'')
      +'</div></div>';
  }).join('');

  // Staggered entrance animation
  requestAnimationFrame(function(){
    var cards=g.querySelectorAll('.card');
    cards.forEach(function(c,i){
      setTimeout(function(){c.classList.add('show')},i*40+10);
    });
  });
}

// ── Modal ──
function openModal(idx){
  var b=B[idx];
  if(!b)return;
  var icon=getIcon(b.tp||b.st||'');
  var stLabel=b.st||'';
  var tpFull=b.tp||'';

  var fields='';
  if(b.a)fields+='<span class="label">作者</span><span class="value">'+b.a+'</span>';
  if(b.y)fields+='<span class="label">年代</span><span class="value">约 '+b.y+' 年</span>';
  if(b.c)fields+='<span class="label">国家/地区</span><span class="value">'+b.c+'</span>';
  if(stLabel)fields+='<span class="label">类型</span><span class="value">'+getIcon(stLabel)+' '+stLabel+'</span>';
  if(tpFull&&tpFull!==stLabel)fields+='<span class="label">详细分类</span><span class="value">'+tpFull+'</span>';

  // Build summary from available data
  var summaryParts=[];
  if(b.a)summaryParts.push(b.a);
  if(b.c)summaryParts.push(b.c);
  if(b.y)summaryParts.push('约'+b.y+'年');
  var summary='本作品收录于「喜剧精读」系列，由'+(b.a||'佚名')+'创作'
    +(b.c?'，来自'+b.c:'')
    +(b.y?'，创作年代约在 '+b.y+' 年左右':'')
    +'。'
    +(tpFull?'作品类型为：'+tpFull+'。':'');

  document.getElementById('modalBody').innerHTML=
    '<div class="m-icon">'+icon+'</div>'
    +'<div class="m-title">'+b.t+'</div>'
    +'<div class="m-en">'+(b.e||'')+'</div>'
    +'<div class="m-divider"></div>'
    +'<div class="m-fields">'+fields+'</div>'
    +'<div class="m-divider"></div>'
    +'<div class="m-summary">'+summary+'</div>';

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow='';
}

// Close on Escape
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
});

// 随机推荐
function randomBook(){
  var idx=Math.floor(Math.random()*B.length);
  openModal(idx);
}

// 阅读进度 (localStorage)
var comedyRead=JSON.parse(localStorage.getItem('comedy-read')||'[]');
function markComedyRead(idx){
  if(comedyRead.indexOf(idx)<0){comedyRead.push(idx);localStorage.setItem('comedy-read',JSON.stringify(comedyRead))}
}
// 在openModal中标记已读
var _origOpen=openModal;
openModal=function(idx){markComedyRead(idx);_origOpen(idx)};

init();
</script>
