*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--card:#fff;--text:#1d1d1f;--dim:#86868b;--border:#e5e5e5;--accent:#1d1d1f}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px}
.top a{color:var(--dim);text-decoration:none;font-size:13px}
.top h1{font-size:20px;font-weight:700;flex:1}
.search{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:14px;width:200px;outline:none}
.search:focus{border-color:#e6a817}
.tabs{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#fff}
.tab{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:none;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.tab:hover{background:#f5f5f7}
.tab.on{background:#e6a817;color:#fff;border-color:#e6a817}
.stats{padding:16px 24px;font-size:13px;color:var(--dim)}
.stats b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px 24px 40px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px;transition:all .3s;cursor:pointer;border-left:4px solid #e6a817}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card .num{font-size:11px;color:#e6a817;font-weight:700;margin-bottom:4px}
.card .title{font-size:16px;font-weight:600;margin-bottom:2px}
.card .en{font-size:12px;color:var(--dim);margin-bottom:8px}
.card .meta{font-size:12px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.card .meta span{background:#fef9e7;padding:2px 8px;border-radius:8px}
</style>
</head>

var curT='全部';
function init(){
  var el=document.getElementById('ttabs');
  var h='<button class="tab on" onclick="setT(this)">全部</button>';
  types.forEach(function(t){h+='<button class="tab" onclick="setT(this)">'+t+'</button>'});
  el.innerHTML=h;render();
}
function setT(el){
  curT=el.textContent.trim();
  el.parentNode.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
  el.classList.add('on');render();
}
function render(){
  var q=document.querySelector('.search').value.toLowerCase();
  var list=B.filter(function(b){
    if(curT!=='全部'&&b.st!==curT)return false;
    if(q&&!((b.t+b.e+b.a+b.c).toLowerCase().indexOf(q)>=0))return false;
    return true;
  });
  document.getElementById('stats').innerHTML='共 <b>'+list.length+'</b> 本喜剧名著';
  var g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div style="text-align:center;padding:60px;color:#86868b">没有匹配的书籍</div>';return}
  g.innerHTML=list.map(function(b,i){return '<div class="card"><div class="num">#'+(i+1)+'</div><div class="title">'+b.t+'</div><div class="en">'+b.e+'</div><div class="meta"><span>'+b.a+'</span><span>'+b.c+'</span><span>'+(b.y?'约'+b.y+'年':'')+'</span><span>'+b.st+'</span></div></div>'}).join('');
}
