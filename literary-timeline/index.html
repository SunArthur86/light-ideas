<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⏳ 世界文学时间轴 · 4100年</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--fg:#1d1d1f;--muted:#86868b;--accent:#0071e3;--card:#fff;--border:rgba(0,0,0,.08);--shadow:0 2px 12px rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#1a1a1a;--fg:#e5e5e5;--muted:#999;--card:#2a2a2a;--border:rgba(255,255,255,.1);--shadow:0 2px 12px rgba(0,0,0,.3)}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow:hidden;height:100vh;transition:background .3s,color .3s}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,250,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;transition:background .3s}
[data-theme="dark"] .nav{background:rgba(26,26,26,.85)}
.nav a{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav h1{font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.nav .stat{font-size:11px;color:var(--muted);white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:6px;margin-left:auto}
.ctrl button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--fg);transition:all .2s;white-space:nowrap}
.ctrl button:hover{border-color:var(--accent);color:var(--accent)}
.ctrl button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sch input{width:160px;padding:6px 12px;border:1px solid var(--border);border-radius:16px;font-size:12px;font-family:inherit;outline:none;background:var(--card);color:var(--fg);transition:all .2s}
.sch input:focus{border-color:var(--accent);width:200px}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:50%}
.zoom span{font-size:10px;color:var(--muted);min-width:32px;text-align:center}
.tbtn{font-size:14px;padding:4px 8px!important}
.eras{position:fixed;top:52px;left:0;right:0;z-index:99;background:rgba(250,250,250,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:38px;display:flex;align-items:center;padding:0 16px;gap:4px;overflow-x:auto;scrollbar-width:none;transition:background .3s}
[data-theme="dark"] .eras{background:rgba(26,26,26,.92)}
.eras::-webkit-scrollbar{display:none}
.ebtn{background:transparent;border:1px solid transparent;border-radius:14px;padding:3px 12px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--muted);white-space:nowrap;transition:all .2s}
.ebtn:hover{background:rgba(0,0,0,.04);color:var(--fg)}
[data-theme="dark"] .ebtn:hover{background:rgba(255,255,255,.06)}
.ebtn.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.gfbar{position:fixed;top:90px;left:0;right:0;z-index:98;background:rgba(250,250,250,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:32px;display:none;align-items:center;padding:0 16px;gap:3px;overflow-x:auto;scrollbar-width:none;transition:background .3s}
.gfbar.show{display:flex}
[data-theme="dark"] .gfbar{background:rgba(26,26,26,.9)}
.gfbar::-webkit-scrollbar{display:none}
.gbtn{background:transparent;border:1px solid transparent;border-radius:10px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:inherit;color:var(--muted);white-space:nowrap;transition:all .15s}
.gbtn:hover{background:rgba(0,0,0,.04);color:var(--fg)}
[data-theme="dark"] .gbtn:hover{background:rgba(255,255,255,.06)}
.gbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.vp{position:fixed;top:90px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
.vp.gfbar-on{top:122px}
.vp:active{cursor:grabbing}
.tl{position:absolute;top:0;left:0;height:100%;user-select:none}
.ecol{position:absolute;top:0;bottom:0;border-right:1px solid var(--border)}
.ecol .el{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.ym{position:absolute;bottom:30px;font-size:9px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.bn{position:absolute;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;z-index:10}
.bn:hover{transform:translate(-50%,-50%) scale(2.2)!important;z-index:20;box-shadow:0 0 0 4px rgba(0,113,227,.25)}
.bn.highlighted{animation:bpulse 1s ease-in-out 3}
@keyframes bpulse{0%,100%{box-shadow:0 0 0 0 rgba(0,113,227,.4)}50%{box-shadow:0 0 0 8px rgba(0,113,227,0)}}
.bn .bl{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.bn:hover .bl{opacity:1}
.bn .bl.ab{bottom:calc(100% + 4px)}.bn .bl.be{top:calc(100% + 4px)}
.ms{position:absolute;z-index:8;pointer-events:none}
.ms-ring{width:20px;height:20px;border:2px solid rgba(0,113,227,.35);border-radius:50%;animation:msp 2s ease-in-out infinite;margin:0 auto}
.ms-line{width:1px;height:24px;background:linear-gradient(rgba(0,113,227,.25),transparent);margin:0 auto}
.ms-txt{font-size:8px;color:var(--accent);white-space:nowrap;text-align:center;margin-top:1px;max-width:70px;overflow:hidden;text-overflow:ellipsis;margin-left:-25px}
@keyframes msp{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
.tip{display:none;position:fixed;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;max-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.12);pointer-events:none}
.tip.show{display:block}
.tip h3{font-size:13px;font-weight:600;margin-bottom:2px}
.tip .ta{font-size:11px;color:var(--muted);margin-bottom:4px}
.tip .tg{display:inline-block;font-size:9px;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:6px;color:var(--muted);margin-right:3px}
[data-theme="dark"] .tip .tg{background:rgba(255,255,255,.08)}
.tip .ty{font-size:10px;color:var(--accent);margin-top:4px;font-weight:500}
.tip .desc{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;border-top:1px solid var(--border);padding-top:6px}
.mo{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
.mo.show{display:flex;align-items:center;justify-content:center}
.md{background:var(--card);border-radius:16px;padding:28px;max-width:460px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.15);position:relative;animation:mi .3s ease;max-height:85vh;overflow-y:auto}
@keyframes mi{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.md .cx{position:absolute;top:10px;right:14px;font-size:18px;cursor:pointer;color:var(--muted);background:none;border:none;line-height:1}
.md .cx:hover{color:var(--fg)}
.md h2{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.md .ma{font-size:13px;color:var(--muted);margin-bottom:10px}
.mt{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(0,113,227,.08);color:var(--accent);margin-right:4px;margin-bottom:6px;cursor:pointer;transition:background .2s}
.mt:hover{background:rgba(0,113,227,.16)}
.my{font-size:26px;font-weight:700;color:var(--accent);margin:12px 0 6px;letter-spacing:-.5px}
.my span{font-size:13px;font-weight:400;color:var(--muted)}
.md .mc{font-size:12px;line-height:1.7;color:var(--muted)}
.md .desc-box{font-size:11px;line-height:1.7;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.leg{position:fixed;bottom:60px;left:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:10px;box-shadow:var(--shadow);z-index:50;transition:background .3s;max-height:calc(100vh - 160px);overflow-y:auto}
.leg h4{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:6px}
.leg h4:first-child{margin-top:0}
.li{display:flex;align-items:center;gap:5px;margin-bottom:2px;color:var(--fg);cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .15s}
.li:hover{background:rgba(0,0,0,.04)}
[data-theme="dark"] .li:hover{background:rgba(255,255,255,.06)}
.li.on{background:rgba(0,113,227,.08);font-weight:600}
.li .dt{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mm{position:fixed;bottom:60px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:var(--shadow);z-index:50;cursor:pointer;transition:background .3s}
.mm canvas{display:block;border-radius:6px}
.sp{position:fixed;top:90px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:11px;box-shadow:var(--shadow);z-index:50;width:220px;transition:all .3s;max-height:calc(100vh - 120px);overflow-y:auto;display:none}
.sp.show{display:block}
.sp .sh{display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:8px}
.sp .sh h3{font-size:12px;font-weight:600}
.sp .sh span{font-size:14px;color:var(--muted);transition:transform .2s}
.sp .row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.sp .row .lb{width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--muted);flex-shrink:0}
.sp .row .bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.sp .row .bar div{height:100%;border-radius:3px;transition:width .4s ease}
.sp .row .ct{font-size:9px;color:var(--muted);width:18px;text-align:right;flex-shrink:0}
.rb{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px}
.rb button{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:5px 16px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--muted);box-shadow:var(--shadow);transition:all .2s}
.rb button:hover{border-color:var(--accent);color:var(--accent)}
.ld{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;transition:background .3s}
.ld h2{font-size:18px;font-weight:600}
.ld .bar{width:180px;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.ld .bar div{height:100%;background:var(--accent);border-radius:1px;animation:lb 1.2s ease-in-out infinite}
@keyframes lb{0%{width:0;margin-left:0}50%{width:60%}100%{width:0;margin-left:100%}}
.kb-hint{position:fixed;bottom:16px;right:16px;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:9px;color:var(--muted);box-shadow:var(--shadow);line-height:1.8;opacity:.7;transition:opacity .2s}
.kb-hint:hover{opacity:1}
.kb-hint kbd{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;font-family:inherit;font-size:9px}
[data-theme="dark"] .kb-hint kbd{background:rgba(255,255,255,.1)}
@media(max-width:768px){.nav{padding:0 10px;gap:6px}.nav h1{font-size:13px}.sch input{width:120px}.sch input:focus{width:150px}.ctrl button{padding:3px 6px;font-size:10px}.sp{width:180px;padding:10px 12px}.mm{bottom:50px;right:8px}.leg{bottom:50px;left:8px;padding:8px 10px}.rb{bottom:50px}.kb-hint{display:none}}
@media(max-width:640px){.nav h1{display:none}.sp{display:none!important}.leg{max-height:40vh}.eras{height:34px}.ebtn{padding:2px 8px;font-size:10px}.sch input{width:90px}.sch input:focus{width:120px}.gfbar{top:86px}.vp{top:86px}.vp.gfbar-on{top:118px}}
@media(max-width:420px){.ctrl .tbtn:not(.theme-btn):not(.random-btn){display:none}.leg{bottom:8px;left:8px;max-height:30vh;font-size:9px}.mm{display:none}.rb{bottom:8px}.gfbar{height:28px}.gbtn{font-size:9px;padding:1px 6px}}
</style>
</head>
