<title>⏳ 世界文学时间轴 · 4100年</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--fg:#1d1d1f;--muted:#86868b;--accent:#0071e3;--card:#fff;--border:rgba(0,0,0,.08);--glow:rgba(0,113,227,.12)}
[data-theme="dark"]{--bg:#0a0a1a;--fg:#e8e8f0;--muted:#888;--card:#1a1a2e;--border:rgba(255,255,255,.08);--glow:rgba(0,113,227,.2)}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow:hidden;height:100vh;transition:background .4s,color .4s}

/* ── Navigation ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,250,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;transition:background .3s}
[data-theme="dark"] .nav{background:rgba(10,10,26,.85)}
.nav a{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav h1{font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.nav .stat{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:4px;padding:2px 8px;background:var(--glow);border-radius:10px}
.ctrl{display:flex;align-items:center;gap:6px;margin-left:auto}
.ctrl input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;width:120px;outline:none;font-family:inherit;color:var(--fg);transition:border .2s}
.ctrl input:focus{border-color:var(--accent)}
.ctrl button,.nav button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--fg);transition:all .2s;white-space:nowrap}
.ctrl button:hover,.nav button:hover{background:var(--glow);border-color:var(--accent)}

/* ── Filter Bars ── */
.fbars{position:fixed;top:52px;left:0;right:0;z-index:90;background:rgba(250,250,250,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:all .3s;overflow:hidden}
[data-theme="dark"] .fbars{background:rgba(10,10,26,.8)}
.fbars.collapsed{height:0;border:none}
.frow{display:flex;align-items:center;gap:4px;padding:6px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.frow::-webkit-scrollbar{display:none}
.frow label{font-size:10px;color:var(--muted);white-space:nowrap;min-width:40px;font-weight:600}
.ebtn,.gbtn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--fg);white-space:nowrap;transition:all .2s}
.ebtn:hover,.gbtn:hover{background:rgba(0,113,227,.06);border-color:var(--accent)}
.ebtn.on,.gbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Canvas Viewport ── */
#vp{position:fixed;top:52px;left:0;right:0;bottom:0;cursor:grab}
#vp:active{cursor:grabbing}
#vp.fbars-on{top:104px}
canvas{display:block;width:100%;height:100%}

/* ── Tooltip ── */
.tip{display:none;position:fixed;z-index:200;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:12px 16px;max-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.12);pointer-events:none}
.tip.show{display:block}
.tip h3{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tip .ta{font-size:11px;color:var(--muted);margin-bottom:2px}
.tip .tg{font-size:11px;color:var(--accent);margin-bottom:2px}
.tip .ty{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tip .desc{font-size:11px;color:var(--fg);opacity:.8;margin-top:6px;line-height:1.4}
.tip .star{color:#FF5722;font-size:12px}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:28px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:mdIn .3s ease}
@keyframes mdIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal .cx{position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.modal .cx:hover{color:var(--fg)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:6px;padding-right:24px}
.modal .ma{font-size:14px;color:var(--muted);margin-bottom:10px}
.modal .mt{display:inline-block;font-size:11px;background:var(--glow);color:var(--accent);padding:3px 8px;border-radius:6px;margin:2px 4px 2px 0}
.modal .my{font-size:12px;color:var(--muted);margin:8px 0;font-variant-numeric:tabular-nums}
.modal .mc{font-size:11px;color:var(--muted);margin:6px 0;line-height:1.4;padding:8px 10px;background:rgba(0,113,227,.04);border-radius:8px;border-left:3px solid var(--accent)}
.modal .desc-box{font-size:13px;line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* ── Legend ── */
.legend{position:fixed;bottom:12px;left:12px;z-index:80;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:320px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.legend .li{display:flex;align-items:center;gap:3px;cursor:pointer;transition:opacity .2s}
.legend .li:hover{opacity:.7}
.legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Mini Map ── */
.minimap{position:fixed;bottom:12px;right:12px;z-index:80;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);cursor:pointer}
.minimap canvas{display:block}

/* ── Era Labels (floating) ── */
.era-float{position:fixed;top:52px;left:0;right:0;z-index:85;pointer-events:none;overflow:hidden;height:28px}
.era-float .ef{position:absolute;top:4px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;opacity:.6;white-space:nowrap}

/* ── Responsive ── */
@media(max-width:768px){
  .ctrl input{width:80px}
  .nav .stat{display:none}
  .legend{max-width:200px;font-size:9px;gap:4px}
  .minimap{display:none}
  .frow{padding:4px 10px}
}
@media(max-width:480px){
  .ctrl input{display:none}
  .ctrl button{padding:5px 6px;font-size:11px}
  .nav h1{font-size:14px}
}
</style>
</head>

function rsz(){
  var vp=document.getElementById('vp');
  W=vp.clientWidth; H=vp.clientHeight;
  var dpr=window.devicePixelRatio||1;
  c.width=W*dpr; c.height=H*dpr;
  c.style.width=W+'px'; c.style.height=H+'px';
  x.setTransform(dpr,0,0,dpr,0,0);
}

/* === Layout computation === */
function getLayout(){
  if(!filtered.length) return [];
  var yMin=filtered[0].y, yMax=filtered[filtered.length-1].y;
  var ySpan=Math.max(1,yMax-yMin);
  var padding=40;
  /* horizontal timeline: time → x axis, region → y lanes */
  var totalW=Math.max(W*2, ySpan*2.5);
  /* vertical lanes by region */
  var regions=[];
  var regSet={};
  filtered.forEach(function(b){if(!regSet[b.c]){regSet[b.c]=1;regions.push(b.c)}});
  var laneH=Math.max(30, (H-padding*2)/Math.min(regions.length, 16));
  /* assign lane index */
  var laneMap={};
  regions.forEach(function(r,i){laneMap[r]=i});
  /* compute bubbles */
  var items=[];
  filtered.forEach(function(b){
    var ln=laneMap[b.c]||0;
    var bx=padding+((b.y-yMin)/ySpan)*(totalW-padding*2);
    var by=padding+ln*laneH+laneH/2;
    var sz=b.imp>=5?10:b.imp>=4?7:5;
    items.push({b:b, x:bx, y:by, sz:sz, lane:ln});
  });
  return {items:items, regions:regions, laneMap:laneMap, laneH:laneH, totalW:totalW, yMin:yMin, yMax:yMax, ySpan:ySpan, padding:padding};
}

/* === Main render === */
function draw(){
  if(!W||!H){animId=requestAnimationFrame(draw);return}
  x.clearRect(0,0,W,H);
  
  /* background gradient */
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){
    var bg=x.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#0a0a1a');bg.addColorStop(1,'#0d0d2b');
    x.fillStyle=bg;x.fillRect(0,0,W,H);
    /* stars */
    particlePhase+=0.003;
    for(var i=0;i<80;i++){
      var sx=((Math.sin(i*127.1)*43758.5)%1)*W;
      var sy=((Math.sin(i*269.5)*43758.5)%1)*H;
      var fl=Math.abs(Math.sin(particlePhase+i*0.5))*.25+.05;
      x.fillStyle='rgba(255,255,255,'+fl+')';
      x.beginPath();x.arc(Math.abs(sx%W),Math.abs(sy%H),.6,0,6.28);x.fill();
    }
  } else {
    x.fillStyle='#fafafa';x.fillRect(0,0,W,H);
    /* subtle grid */
    x.strokeStyle='rgba(0,0,0,.03)';x.lineWidth=.5;
    for(var gy=0;gy<H;gy+=60){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
  }
  
  var L=getLayout();
  if(!L.items.length){animId=requestAnimationFrame(draw);return}
  
  x.save();
  x.translate(ox,0);
  x.scale(sc,1);
  
  /* era columns (horizontal bands) */
  ERAS.forEach(function(e){
    var x1=L.padding+((e.s-L.yMin)/L.ySpan)*(L.totalW-L.padding*2);
    var x2=L.padding+((e.e-L.yMin)/L.ySpan)*(L.totalW-L.padding*2);
    if(x2<-100||x1>W/sc+100) return;
    x.fillStyle=e.c+(isDark?'12':'08');
    x.fillRect(x1,0,x2-x1,H);
    /* era label */
    x.save();
    x.fillStyle=e.c+(isDark?'80':'40');
    x.font='bold 10px -apple-system,sans-serif';
    x.textAlign='center';
    x.fillText(e.name,(x1+x2)/2,18);
    x.restore();
  });
  
  /* year markers (horizontal axis) */
  var ySpan=L.ySpan;
  var step=ySpan>3000?500:ySpan>1000?200:ySpan>400?100:ySpan>100?50:20;
  x.font='9px -apple-system,sans-serif';
  x.textAlign='center';
  x.fillStyle=isDark?'rgba(255,255,255,.25)':'rgba(0,0,0,.2)';
  for(var yr=Math.ceil(L.yMin/step)*step;yr<=L.yMax;yr+=step){
    var mx2=L.padding+((yr-L.yMin)/ySpan)*(L.totalW-L.padding*2);
    x.fillText(fy(yr),mx2,H-8);
    /* vertical tick line */
    x.strokeStyle=isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.04)';
    x.lineWidth=.5;
    x.beginPath();x.moveTo(mx2,20);x.lineTo(mx2,H-14);x.stroke();
  }
  
  /* milestone markers (along x axis) */
  var mvKeys=Object.keys(MV).map(Number).sort(function(a,b){return a-b});
  mvKeys.forEach(function(mk){
    if(mk<L.yMin||mk>L.yMax) return;
    var mx2=L.padding+((mk-L.yMin)/L.ySpan)*(L.totalW-L.padding*2);
    /* diamond marker at center */
    x.save();
    x.translate(mx2,H/2);
    x.fillStyle='rgba(0,113,227,'+(isDark?'.2':'.1')+')';
    x.beginPath();x.moveTo(0,-8);x.lineTo(6,0);x.lineTo(0,8);x.lineTo(-6,0);x.closePath();x.fill();
    x.strokeStyle='rgba(0,113,227,.35)';x.lineWidth=1;x.stroke();
    /* text */
    x.fillStyle=isDark?'rgba(0,113,227,.7)':'rgba(0,113,227,.6)';
    x.font='bold 8px -apple-system,sans-serif';
    x.textAlign='center';
    var txt=MV[mk].substring(0,10);
    x.fillText(txt,0,20);
    x.restore();
  });
  
  /* connection lines between same-region works (horizontal bezier) */
  var byRegion={};
  L.items.forEach(function(it){
    if(!byRegion[it.b.c])byRegion[it.b.c]=[];
    byRegion[it.b.c].push(it);
  });
  Object.keys(byRegion).forEach(function(reg){
    var items=byRegion[reg];
    if(items.length<2) return;
    items.sort(function(a,b){return a.x-b.x});
    for(var i=0;i<items.length-1;i++){
      var a=items[i],b=items[i+1];
      if(Math.abs(b.x-a.x)>300) continue;
      x.strokeStyle=a.b.col+(isDark?'15':'08');
      x.lineWidth=.8;
      x.beginPath();
      var cp=(a.x+b.x)/2;
      x.moveTo(a.x,a.y);
      x.bezierCurveTo(cp,a.y,cp,b.y,b.x,b.y);
      x.stroke();
    }
  });
  
  /* bubbles */
  var now=Date.now();
  L.items.forEach(function(it){
    var sx=it.x, sy=it.y;
    if(sx<-50/sc||sx>W/sc+50||sy<-50||sy>H+50) return;
    
    var isHov=hov&&hov.id===it.b.id;
    var r=it.sz*(isHov?1.6:1);
    
    /* glow for important */
    if(it.b.imp>=5){
      var glowR=r*(isHov?5:3);
      var pulse=Math.sin(now*0.002+it.b.id)*0.15+0.85;
      var g=x.createRadialGradient(sx,sy,0,sx,sy,glowR*pulse);
      g.addColorStop(0,it.b.col+(isDark?'30':'18'));
      g.addColorStop(1,'transparent');
      x.fillStyle=g;
      x.beginPath();x.arc(sx,sy,glowR*pulse,0,6.28);x.fill();
    }
    
    /* main bubble */
    x.fillStyle=it.b.col;
    x.globalAlpha=isHov?1:.85;
    x.beginPath();x.arc(sx,sy,r,0,6.28);x.fill();
    x.globalAlpha=1;
    
    /* ring on hover */
    if(isHov){
      x.strokeStyle='#fff';x.lineWidth=2;
      x.beginPath();x.arc(sx,sy,r+4,0,6.28);x.stroke();
      x.strokeStyle=it.b.col;x.lineWidth=1;
      x.beginPath();x.arc(sx,sy,r+7,0,6.28);x.stroke();
    }
    
    /* label */
    var showLabel=isHov||it.b.imp>=5||sc>1.5;
    if(showLabel){
      x.fillStyle=isHov?'#fff':(isDark?'rgba(255,255,255,.6)':'rgba(0,0,0,.5)');
      x.font=(isHov?'bold ':'')+((isHov?11:9)+'px -apple-system,sans-serif');
      x.textAlign='center';
      x.fillText(it.b.t,sx,sy-r-6);
    }
  });
  
  x.restore();
  
  /* minimap */
  drawMiniMap(L);
  
  animId=requestAnimationFrame(draw);
}

/* === Mini Map === */
function drawMiniMap(L){
  if(!L) L=getLayout();
  var mw=160,mh=36;
  mx.clearRect(0,0,mw,mh);
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  mx.fillStyle=isDark?'#1a1a2e':'#f0f0f0';
  mx.fillRect(0,0,mw,mh);
  
  var nLanes=Math.max(1,Object.keys(L.laneMap).length);
  L.items.forEach(function(it){
    var px=(it.x/L.totalW)*mw;
    var py=2+it.lane*(mh-4)/nLanes;
    mx.fillStyle=it.b.col+'80';
    mx.fillRect(px,py,1.5,2);
  });
  
  /* viewport indicator */
  var vx=(-ox/sc)/L.totalW*mw;
  var vw=(W/sc)/L.totalW*mw;
  mx.strokeStyle='rgba(0,113,227,.5)';mx.lineWidth=1;
  mx.strokeRect(vx,0,vw,mh);
}

/* === Hit test === */
function hitTest(cx,cy){
  var L=getLayout();
  if(!L.items.length) return null;
  var worldX=(cx-ox)/sc;
  var best=null, bd=20;
  L.items.forEach(function(it){
    var d=Math.hypot(it.x-worldX,it.y-cy);
    if(d<bd){bd=d;best=it.b}
  });
  return best;
}

/* === Events === */
c.addEventListener('mousedown',function(e){
  if(e.button!==0) return;
  drag=true;dsx=e.clientX;dox=ox;
  c.style.cursor='grabbing';
});
window.addEventListener('mousemove',function(e){
  if(drag){ox=dox+(e.clientX-dsx);return}
  var rect=c.getBoundingClientRect();
  var cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  var b=hitTest(cx,cy);
  hov=b;
  c.style.cursor=b?'pointer':'grab';
  if(b) showTip(e,b); else hideTip();
});
window.addEventListener('mouseup',function(){
  if(drag){
    var moved=Math.abs(ox-dox)>5;
    drag=false;c.style.cursor='grab';
    if(!moved){
      var rect=c.getBoundingClientRect();
      var b=hitTest(lastMX-rect.left,lastMY-rect.top);
      if(b) showModal(b);
    }
  }
});
var lastMX=0,lastMY=0;
c.addEventListener('mousedown',function(e){lastMX=e.clientX;lastMY=e.clientY});

c.addEventListener('wheel',function(e){
  e.preventDefault();
  var factor=e.deltaY>0?.92:1.08;
  sc*=factor;
  sc=Math.max(.3,Math.min(5,sc));
},{passive:false});

/* Touch */
var tsx=0,tsox=0,touching=false;
c.addEventListener('touchstart',function(e){
  if(e.touches.length===1){
    touching=true;tsx=e.touches[0].clientX;tsox=ox;
  }
},{passive:true});
c.addEventListener('touchmove',function(e){
  if(touching&&e.touches.length===1){
    ox=tsox+(e.touches[0].clientX-tsx);
  }
},{passive:true});
c.addEventListener('touchend',function(e){
  if(touching){
    touching=false;
    if(Math.abs(ox-tsox)<5){
      var rect=c.getBoundingClientRect();
      var b=hitTest(e.changedTouches[0].clientX-rect.left,e.changedTouches[0].clientY-rect.top);
      if(b) showModal(b);
    }
  }
});

/* Tooltip */
function showTip(ev,b){
  var t=document.getElementById('tip');
  var stars=b.imp>=5?' <span class="star">★</span>':'';
  var desc=DESC[b.t]?'<div class="desc">'+DESC[b.t]+'</div>':'';
  t.innerHTML='<h3>'+stars+b.t+'</h3><div class="ta">'+b.a+' · '+b.c+'</div><div class="tg">'+b.g+'</div><div class="ty">'+fy(b.y)+'</div>'+desc;
  t.classList.add('show');
  t.style.left=Math.min(ev.clientX+14,window.innerWidth-290)+'px';
  t.style.top=Math.min(ev.clientY+14,window.innerHeight-160)+'px';
}
function hideTip(){document.getElementById('tip').classList.remove('show')}

/* Modal */
function showModal(b){
  var md=document.getElementById('md');
  var ks=Object.keys(MV).map(Number).sort(function(a,b2){return a-b2}),mv='';
  for(var i=0;i<ks.length;i++){if(b.y>=ks[i])mv=MV[ks[i]]}
  var same=B.filter(function(x){return x.c===b.c&&x.id!==b.id}).slice(0,4);
  var rel='';
  if(same.length){
    rel='<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">同地区作品</div>';
    same.forEach(function(s){rel+='<span class="mt" onclick="showModal(B.find(function(x){return x.id==='+s.id+'}))">'+s.t+'</span>'});
    rel+='</div>';
  }
  var desc=DESC[b.t]?'<div class="desc-box">'+DESC[b.t]+'</div>':'';
  md.innerHTML='<button class=cx onclick="closeModal()">×</button><h2>'+b.t+'</h2><div class="ma">'+b.a+'</div><div><span class="mt">'+b.c+'</span><span class="mt">'+b.g+'</span>'+(b.imp>=5?'<span class="mt" style="background:rgba(255,87,34,.08);color:#FF5722">★ 经典</span>':'')+'</div><div class="my">'+fy(b.y)+'</div><div class="mc">'+(mv||'')+'</div>'+desc+rel;
  document.getElementById('mo').classList.add('show');
}
function closeModal(){document.getElementById('mo').classList.remove('show')}

/* Random */
function randomBook(){
  var pool=filtered.length?filtered:B;
  var b=pool[Math.floor(Math.random()*pool.length)];
  showModal(b);
}

/* Search */
function doSearch(){
  sq=document.getElementById('sq').value.trim();
  applyFilters();
  if(sq){
    var m=B.find(function(b){return b.t.includes(sq)||b.a.includes(sq)});
    if(m) showModal(m);
  }
}

/* Filters */
function applyFilters(){
  filtered=B.slice().sort(function(a,b){return a.y-b.y});
  if(aEra){
    var er=ERAS.find(function(e){return e.name===aEra});
    if(er) filtered=filtered.filter(function(b){return b.y>=er.s&&b.y<er.e});
  }
  if(aGenre) filtered=filtered.filter(function(b){return b.g===aGenre});
  if(sq) filtered=filtered.filter(function(b){return b.t.includes(sq)||b.a.includes(sq)});
  document.getElementById('countStat').textContent=filtered.length+'部 · 4100年';
}

/* Era bar */
function buildEras(){
  var bar=document.getElementById('ebar');
  var h='<label>时代</label><button class="ebtn on" data-era="">全部</button>';
  ERAS.forEach(function(e){
    var n=B.filter(function(b){return b.y>=e.s&&b.y<e.e}).length;
    if(n>0) h+='<button class="ebtn" data-era="'+e.name+'">'+e.name+' ('+n+')</button>';
  });
  bar.innerHTML=h;
  bar.querySelectorAll('.ebtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      aEra=btn.dataset.era||null;
      bar.querySelectorAll('.ebtn').forEach(function(b){b.classList.remove('on')});
      btn.classList.add('on');
      ox=0;applyFilters();
    });
  });
}

/* Genre bar */
function buildGenreBar(){
  var genres={};
  B.forEach(function(b){genres[b.g]=(genres[b.g]||0)+1});
  var sorted=Object.keys(genres).sort(function(a,b){return genres[b]-genres[a]});
  var h='<label>类型</label><button class="gbtn on" data-genre="">全部类型</button>';
  sorted.forEach(function(g){h+='<button class="gbtn" data-genre="'+g+'">'+g+' ('+genres[g]+')</button>'});
  document.getElementById('gbar').innerHTML=h;
  document.getElementById('gbar').querySelectorAll('.gbtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      aGenre=btn.dataset.genre||null;
      document.getElementById('gbar').querySelectorAll('.gbtn').forEach(function(b){b.classList.remove('on')});
      btn.classList.add('on');
      ox=0;applyFilters();
    });
  });
}

/* Legend */
function buildLegend(){
  var cs=[...new Set(B.map(function(b){return b.c}))].sort();
  var rc={};
  B.forEach(function(b){if(!rc[b.c]||b.imp>(rc[b.c].imp||0))rc[b.c]=b});
  document.getElementById('leg').innerHTML=cs.filter(function(c2){return rc[c2]}).map(function(c2){
    return '<div class="li"><div class="dot" style="background:'+rc[c2].col+'"></div>'+c2+'</div>';
  }).join('');
}

/* Toggle bars */
function toggleEra(){
  eraVisible=!eraVisible;
  document.getElementById('eraBtn').classList.toggle('on',eraVisible);
  updateBars();
}
function toggleGenre(){
  genreVisible=!genreVisible;
  document.getElementById('genreBtn').classList.toggle('on',genreVisible);
  updateBars();
}
function updateBars(){
  var fb=document.getElementById('fbars');
  var vp=document.getElementById('vp');
  if(eraVisible||genreVisible){
    fb.classList.remove('collapsed');
    vp.classList.add('fbars-on');
  } else {
    fb.classList.add('collapsed');
    vp.classList.remove('fbars-on');
  }
  rsz();
}

/* Theme */
function toggleTheme(){
  var d=document.documentElement;
  var isDark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',isDark?'':'dark');
}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if(e.key==='/'&&document.activeElement!==document.getElementById('sq')){
    e.preventDefault();document.getElementById('sq').focus();
  }
});

/* === Init === */
buildEras();
buildGenreBar();
buildLegend();
window.addEventListener('resize',function(){rsz()});
rsz();
draw();
</script>
</body>
