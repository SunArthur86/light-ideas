var MV={"-2100":"人类最早的文学，四大文明古国的智慧结晶","-800":"荷马时代，希腊史诗诞生，西方文学的源头","-500":"轴心时代，人类思想大爆发，东西方哲学奠基","0":"古典晚期，帝国文学与宗教文本兴起","500":"中世纪黎明，宗教文学主导欧洲","800":"阿拉伯文学黄金时代，一千零一夜","1000":"东方古典巅峰，紫式部与宋词","1200":"欧洲中世纪盛期，骑士文学与史诗","1300":"文艺复兴前夜，但丁与薄伽丘","1400":"文艺复兴，人文主义觉醒","1500":"大航海时代，塞万提斯与莎士比亚","1600":"巴洛克时代，弥尔顿与戏剧黄金期","1700":"启蒙运动，理性与批判的世纪","1770":"狂飙突进，歌德引领浪漫主义","1800":"浪漫主义，想象力与自然的颂歌","1830":"现实主义兴起，社会全景的文学镜像","1850":"现实主义鼎盛，小说的黄金时代","1870":"自然主义，科学方法进入文学","1890":"世纪末美学，颓废与象征主义","1900":"现代主义先锋，意识流与文学实验","1910":"大战与文学，迷惘的一代","1920":"现代主义巅峰，乔伊斯与普鲁斯特","1930":"反乌托邦，对极权主义的预言","1940":"战后存在主义，荒诞与抉择","1950":"后殖民文学，多元世界的声音","1960":"魔幻现实主义，拉丁美洲文学爆炸","1980":"全球化文学，跨越边界的声音"};

/* === 描述数据库 === */
var DESC={"傲慢与偏见":"英国乡绅家庭的婚姻故事，伊丽莎白与达西从偏见走向理解的爱情经典","战争与和平":"拿破仑战争背景下的俄罗斯贵族社会全景，安德烈、皮埃尔、娜塔莎三条人生轨迹交织","百年孤独":"布恩迪亚家族七代人的传奇故事，马孔多小镇的百年兴衰，魔幻现实主义巅峰之作","1984":"大洋国在老大哥监控下的极权社会，温斯顿的反抗与毁灭，'战争即和平，自由即奴役'","红楼梦":"贾宝玉与林黛玉的爱情悲剧，四大家族的兴衰，中国古典文学的巅峰","神曲":"但丁游历地狱、炼狱、天堂的三界之旅，中世纪神学与文学的集大成","堂吉诃德":"痴迷骑士小说的绅士三次出征的荒诞冒险，现代小说的奠基之作","尤利西斯":"布鲁姆一天之内的都柏林漫游，意识流小说的里程碑","罪与罚":"拉斯柯尔尼科夫杀人与赎罪的心理挣扎，陀思妥耶夫斯基的深刻人性探索","变形记":"格里高尔·萨姆沙一觉醒来变成甲虫，卡夫卡对异化与存在的深刻寓言"};

/* === 状态 === */
var sc=1,px=0,py=0,dr=false,lx=0,ly=0,aEra=null,aRegions={},aGenre=null,sq="",isDark=false,statsVisible=false,genreVisible=false;
var filtered=[];

B.sort(function(a,b){return a.y-b.y});

/* === 初始化 === */
document.addEventListener("DOMContentLoaded",function(){
  var saved=localStorage.getItem('tl-theme');
  if(saved==='dark'){isDark=true;document.documentElement.setAttribute('data-theme','dark');document.getElementById('thb').textContent='☀️'}
  document.getElementById("stat").textContent=B.length+" 部 · "+fy(B[0].y)+" — "+fy(B[B.length-1].y);
  buildEras();buildGenreBar();buildLegend();applyFilters();buildMiniMap();
  document.getElementById("ld").style.display="none";
  bindEvents();
});

function fy(y){return y<0?"前"+Math.abs(y)+"年":y===0?"公元元年":y+"年"}

/* === 时代筛选 === */
function buildEras(){
  var bar=document.getElementById("ebar");
  var h='<button class="ebtn on" data-era="">全部</button>';
  ERAS.forEach(function(e){
    var n=B.filter(function(b){return b.y>=e.s&&b.y<e.e}).length;
    if(n>0) h+='<button class="ebtn" data-era="'+e.name+'">'+e.name+' ('+n+')</button>';
  });
  bar.innerHTML=h;
  bar.querySelectorAll(".ebtn").forEach(function(btn){
    btn.addEventListener("click",function(){
      aEra=btn.dataset.era||null;
      bar.querySelectorAll(".ebtn").forEach(function(b){b.classList.remove("on")});
      btn.classList.add("on");
      px=0;py=0;applyFilters();
    });
  });
}

/* === 类型筛选 === */
function buildGenreBar(){
  var genres={};
  B.forEach(function(b){genres[b.g]=(genres[b.g]||0)+1});
  var sorted=Object.keys(genres).sort(function(a,b){return genres[b]-genres[a]});
  var h='<button class="gbtn on" data-genre="">全部类型</button>';
  sorted.forEach(function(g){
    h+='<button class="gbtn" data-genre="'+g+'">'+g+' ('+genres[g]+')</button>';
  });
  document.getElementById("gbar").innerHTML=h;
  document.getElementById("gbar").querySelectorAll(".gbtn").forEach(function(btn){
    btn.addEventListener("click",function(){
      aGenre=btn.dataset.genre||null;
      document.getElementById("gbar").querySelectorAll(".gbtn").forEach(function(b){b.classList.remove("on")});
      btn.classList.add("on");
      px=0;py=0;applyFilters();
    });
  });
}

function toggleGenre(){
  genreVisible=!genreVisible;
  var gb=document.getElementById("gbar"),vp=document.getElementById("vp"),btn=document.getElementById("gb");
  if(genreVisible){gb.classList.add("show");vp.classList.add("gfbar-on");btn.classList.add("active")}
  else{gb.classList.remove("show");vp.classList.remove("gfbar-on");btn.classList.remove("active")}
}

/* === 图例+地区筛选(动态) === */
function buildLegend(){
  var cols={};
  B.forEach(function(b){if(!cols[b.c])cols[b.c]=b.col});
  var rg=Object.keys(cols).sort();
  var h='<h4>🌍 地区（点击筛选）</h4>';
  rg.forEach(function(c){
    var on=aRegions[c]?' on':'';
    h+='<div class="li'+on+'" data-region="'+c+'"><span class="dt" style="background:'+cols[c]+'"></span>'+c+'</div>';
  });
  document.getElementById("leg").innerHTML=h;
  document.getElementById("leg").querySelectorAll(".li").forEach(function(li){
    li.addEventListener("click",function(){
      var r=li.dataset.region;
      if(aRegions[r])delete aRegions[r];else aRegions[r]=true;
      li.classList.toggle("on");
      px=0;py=0;applyFilters();
    });
  });
}

/* === 筛选+渲染 === */
function applyFilters(){
  filtered=B.filter(function(b){
    if(aEra){var era=null;ERAS.forEach(function(e){if(e.name===aEra)era=e});if(era&&(b.y<era.s||b.y>=era.e))return false}
    var rKeys=Object.keys(aRegions);
    if(rKeys.length>0&&!aRegions[b.c])return false;
    if(aGenre&&b.g!==aGenre)return false;
    if(sq){var q=sq.toLowerCase();if(b.t.toLowerCase().indexOf(q)<0&&b.a.toLowerCase().indexOf(q)<0&&b.g.toLowerCase().indexOf(q)<0)return false}
    return true;
  });
  document.getElementById("stat").textContent=filtered.length+"/"+B.length+" 部 · "+fy(B[0].y)+" — "+fy(B[B.length-1].y);
  render();
  updateStats();
  drawMiniMap();
}

function render(){
  var vp=document.getElementById("vp"),tl=document.getElementById("tl");
  var W=vp.clientWidth,H=vp.clientHeight;
  if(!filtered.length){tl.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">未找到匹配作品</div>';tl.style.width="100%";return}
  var yMin=filtered[0].y,yMax=filtered[filtered.length-1].y,ySpan=Math.max(1,yMax-yMin);
  var bpx=2.5,tW=Math.max(W*2,ySpan*bpx*sc);
  tl.innerHTML="";tl.style.width=tW+"px";
  /* 时代列 */
  ERAS.forEach(function(e){
    if(e.s>yMax||e.e<yMin)return;
    var l=((e.s-yMin)/ySpan)*tW,w=((e.e-e.s)/ySpan)*tW;
    var d=document.createElement("div");d.className="ecol";
    d.style.cssText="left:"+l+"px;width:"+w+"px;background:"+e.c+"08";
    d.innerHTML='<div class="el">'+e.name+'</div>';
    tl.appendChild(d);
  });
  /* 年份标记 */
  var step=ySpan>3000?500:ySpan>1000?200:ySpan>400?100:ySpan>100?50:20;
  for(var yr=Math.ceil(yMin/step)*step;yr<=yMax;yr+=step){
    var l=((yr-yMin)/ySpan)*tW;
    var d=document.createElement("div");d.className="ym";d.style.left=l+"px";d.textContent=fy(yr);
    tl.appendChild(d);
  }
  /* 里程碑 */
  var mvKeys=Object.keys(MV).map(Number).sort(function(a,b){return a-b});
  mvKeys.forEach(function(mk){
    if(mk<yMin||mk>yMax)return;
    var l=((mk-yMin)/ySpan)*(tW-40)+20;
    var d=document.createElement("div");d.className="ms";
    d.style.cssText="left:"+l+"px;top:50%;transform:translate(-50%,-50%)";
    var txt=MV[mk].substring(0,12);
    d.innerHTML='<div class="ms-ring"></div><div class="ms-line"></div><div class="ms-txt">'+txt+'</div>';
    tl.appendChild(d);
  });
  /* 气泡 */
  var bs=Math.max(1,Math.round(ySpan/200)),bk={};
  filtered.forEach(function(b){var k=Math.round(b.y/bs)*bs;if(!bk[k])bk[k]=[];bk[k].push(b)});
  filtered.forEach(function(b){
    var l=((b.y-yMin)/ySpan)*(tW-40)+20;
    var k=Math.round(b.y/bs)*bs,idx=bk[k].indexOf(b),tot=bk[k].length;
    var mg=H*.08,us=H-mg*2,sp=Math.min(28,us/(tot+1)),t=mg+idx*sp+sp/2;
    var sz=b.imp>=5?14:b.imp>=4?10:7;
    var n=document.createElement("div");n.className="bn";
    n.setAttribute("data-id",b.id);
    n.style.cssText="left:"+l+"px;top:"+t+"px;width:"+sz+"px;height:"+sz+"px;background:"+b.col+";transform:translate(-50%,-50%)";
    if(b.imp>=5)n.style.boxShadow="0 0 0 2px "+b.col+"40";
    var lb=document.createElement("div");lb.className="bl "+(idx%2===0?"ab":"be");lb.textContent=b.t;
    n.appendChild(lb);
    n.addEventListener("mouseenter",function(ev){showTip(ev,b)});
    n.addEventListener("mouseleave",hideTip);
    n.addEventListener("click",function(){showModal(b)});
    tl.appendChild(n);
  });
  tl.style.transform="translate("+px+"px,"+py+"px)";
}

/* === Tooltip === */
function showTip(ev,b){
  var t=document.getElementById("tip");
  var stars=b.imp>=5?' <span style="color:#FF5722">★</span>':'';
  var desc=DESC[b.t]?'<div class="desc">'+DESC[b.t]+'</div>':'';
  t.innerHTML='<h3>'+b.t+stars+'</h3><div class="ta">'+b.a+' · '+b.c+'</div><div class="tg">'+b.g+'</div><div class="ty">'+fy(b.y)+'</div>'+desc;
  t.classList.add("show");
  t.style.left=Math.min(ev.clientX+12,window.innerWidth-290)+"px";
  t.style.top=Math.min(ev.clientY+12,window.innerHeight-140)+"px";
}
function hideTip(){document.getElementById("tip").classList.remove("show")}

/* === Modal === */
function showModal(b){
  var md=document.getElementById("md");
  var ks=Object.keys(MV).map(Number).sort(function(a,b){return a-b}),mv="";
  for(var i=0;i<ks.length;i++){if(b.y>=ks[i])mv=MV[ks[i]]}
  var same=B.filter(function(x){return x.c===b.c&&x.id!==b.id}).slice(0,4);
  var rel='';
  if(same.length){rel='<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">同地区作品</div>';same.forEach(function(s){rel+='<span class="mt" onclick="showModal(B.find(function(x){return x.id==='+s.id+'}))">'+s.t+'</span>'});rel+='</div>'}
  var desc=DESC[b.t]?'<div class="desc-box">'+DESC[b.t]+'</div>':'';
  md.innerHTML='<button class=cx onclick="closeModal()">×</button><h2>'+b.t+'</h2><div class="ma">'+b.a+'</div><div><span class="mt">'+b.c+'</span><span class="mt">'+b.g+'</span>'+(b.imp>=5?'<span class="mt" style="background:rgba(255,87,34,.08);color:#FF5722">★ 经典</span>':'')+'</div><div class="my">'+fy(b.y)+'</div><div class="mc">'+(mv||'')+'</div>'+desc+rel;
  document.getElementById("mo").classList.add("show");
}
function closeModal(){document.getElementById("mo").classList.remove("show")}

/* === 随机探索 === */
function randomBook(){
  var pool=filtered.length?filtered:B;
  var b=pool[Math.floor(Math.random()*pool.length)];
  /* 高亮气泡 */
  var bn=document.querySelector('.bn[data-id="'+b.id+'"]');
  if(bn){
    bn.classList.remove('highlighted');
    void bn.offsetWidth; /* 触发 reflow */
    bn.classList.add('highlighted');
    /* 滚动到可见 */
    var vp=document.getElementById("vp");
    var tl=document.getElementById("tl");
    var rect=bn.getBoundingClientRect(),vpRect=vp.getBoundingClientRect();
    if(rect.left<vpRect.left||rect.right>vpRect.right||rect.top<vpRect.top||rect.bottom>vpRect.bottom){
      var bLeft=parseFloat(bn.style.left),bTop=parseFloat(bn.style.top);
      px=-bLeft+vp.clientWidth/2;py=-bTop+vp.clientHeight/2;
      tl.style.transform="translate("+px+"px,"+py+"px)";
      drawMiniMap();
    }
    setTimeout(function(){showModal(b)},400);
  }else{
    showModal(b);
  }
}

/* === 缩放/重置 === */
function zI(){sc=Math.min(5,sc*1.3);updateZoom();applyFilters()}
function zO(){sc=Math.max(.3,sc/1.3);updateZoom();applyFilters()}
function updateZoom(){document.getElementById("zl").textContent=Math.round(sc*100)+"%"}
function resetView(){sc=1;px=0;py=0;updateZoom();applyFilters()}

/* === 暗色模式 === */
function toggleTheme(){
  isDark=!isDark;
  document.documentElement.setAttribute('data-theme',isDark?'dark':'');
  document.getElementById('thb').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('tl-theme',isDark?'dark':'light');
  applyFilters();
}

/* === 统计面板 === */
function toggleStats(){
  statsVisible=!statsVisible;
  var s=document.getElementById('sp'),btn=document.getElementById('sb2');
  if(statsVisible){s.classList.add('show');btn.classList.add('active')}
  else{s.classList.remove('show');btn.classList.remove('active')}
}
function toggleStatsBody(){var s=document.getElementById('sb'),a=document.getElementById('spA');if(s.style.display==='none'){s.style.display='';a.textContent='▼'}else{s.style.display='none';a.textContent='▶'}}
function updateStats(){
  var sb=document.getElementById('sb');
  var cols={};B.forEach(function(b){if(!cols[b.c])cols[b.c]=b.col});
  /* 地区分布 */
  var regions={};
  filtered.forEach(function(b){regions[b.c]=(regions[b.c]||0)+1});
  var rg=Object.keys(regions).sort(function(a,b){return regions[b]-regions[a]}).slice(0,10);
  var maxR=rg.length?regions[rg[0]]:1;
  var h='<h4 style="font-size:10px;color:var(--muted);margin:6px 0 4px">🌍 地区分布</h4>';
  rg.forEach(function(r){var w=Math.round(regions[r]/maxR*100);h+='<div class="row"><span class="lb">'+r+'</span><div class="bar"><div style="width:'+w+'%;background:'+(cols[r]||'var(--accent)')+'"></div></div><span class="ct">'+regions[r]+'</span></div>'});
  /* 类型TOP8 */
  var genres={};
  filtered.forEach(function(b){genres[b.g]=(genres[b.g]||0)+1});
  var gg=Object.keys(genres).sort(function(a,b){return genres[b]-genres[a]}).slice(0,8);
  var maxG=gg.length?genres[gg[0]]:1;
  h+='<h4 style="font-size:10px;color:var(--muted);margin:8px 0 4px">📚 类型 TOP8</h4>';
  gg.forEach(function(g){var w=Math.round(genres[g]/maxG*100);h+='<div class="row"><span class="lb">'+g+'</span><div class="bar"><div style="width:'+w+'%;background:var(--accent)"></div></div><span class="ct">'+genres[g]+'</span></div>'});
  /* 时代分布 */
  h+='<h4 style="font-size:10px;color:var(--muted);margin:8px 0 4px">⏳ 时代分布</h4>';
  var eMax=0;
  ERAS.forEach(function(e){var n=filtered.filter(function(b){return b.y>=e.s&&b.y<e.e}).length;if(n>eMax)eMax=n});
  ERAS.forEach(function(e){var n=filtered.filter(function(b){return b.y>=e.s&&b.y<e.e}).length;if(n>0){var w=Math.round(n/Math.max(1,eMax)*100);h+='<div class="row"><span class="lb">'+e.name+'</span><div class="bar"><div style="width:'+w+'%;background:'+e.c+'"></div></div><span class="ct">'+n+'</span></div>'}});
  sb.innerHTML=h;
}

/* === Mini-Map === */
function buildMiniMap(){
  document.getElementById('mc').addEventListener('click',function(e){
    var rect=this.getBoundingClientRect();
    var ratio=(e.clientX-rect.left)/rect.width;
    var vp=document.getElementById('vp');
    var yMin=filtered.length?filtered[0].y:B[0].y;
    var yMax=filtered.length?filtered[filtered.length-1].y:B[B.length-1].y;
    var ySpan=Math.max(1,yMax-yMin);
    var targetY=yMin+ratio*ySpan;
    var bpx=2.5,tW=Math.max(vp.clientWidth*2,ySpan*bpx*sc);
    var targetL=((targetY-yMin)/ySpan)*(tW-40)+20;
    px=-targetL+vp.clientWidth/2;py=0;
    document.getElementById('tl').style.transform="translate("+px+"px,"+py+"px)";
    drawMiniMap();
  });
}
function drawMiniMap(){
  if(!filtered.length)return;
  var yMin=filtered[0].y,yMax=filtered[filtered.length-1].y,ySpan=Math.max(1,yMax-yMin);
  var canvas=document.getElementById('mc');
  var ctx=canvas.getContext('2d');
  var cw=canvas.width,ch=canvas.height;
  ctx.clearRect(0,0,cw,ch);
  var bg=isDark?'#2a2a2a':'#f5f5f7';
  ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
  ERAS.forEach(function(e){
    if(e.s>yMax||e.e<yMin)return;
    var x=((e.s-yMin)/ySpan)*cw,w=Math.max(1,((e.e-e.s)/ySpan)*cw);
    ctx.fillStyle=e.c+'20';ctx.fillRect(x,0,w,ch);
  });
  filtered.forEach(function(b){
    var x=((b.y-yMin)/ySpan)*cw;
    var y=ch/2+(b.imp-3)*3;
    ctx.fillStyle=b.col;
    var r=b.imp>=5?2:1.5;
    ctx.beginPath();ctx.arc(Math.max(r,Math.min(cw-r,x)),Math.max(r,Math.min(ch-r,y)),r,0,Math.PI*2);ctx.fill();
  });
  var vp=document.getElementById('vp'),tl=document.getElementById('tl');
  var tW=parseInt(tl.style.width)||vp.clientWidth*2;
  var vl=(-px/tW)*cw,vw=(vp.clientWidth/tW)*cw;
  ctx.strokeStyle=isDark?'rgba(255,255,255,.5)':'rgba(0,0,0,.3)';
  ctx.lineWidth=1;ctx.strokeRect(Math.max(0,vl),1,Math.min(cw,vw),ch-2);
}

/* === 事件绑定 === */
function bindEvents(){
  var vp=document.getElementById("vp");
  vp.addEventListener("mousedown",function(e){if(e.target.closest('.bn'))return;dr=true;lx=e.clientX;ly=e.clientY});
  window.addEventListener("mousemove",function(e){if(!dr)return;px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY;document.getElementById("tl").style.transform="translate("+px+"px,"+py+"px)";drawMiniMap()});
  window.addEventListener("mouseup",function(){dr=false});
  vp.addEventListener("dblclick",function(e){if(!e.target.closest('.bn'))resetView()});
  var tid=null;
  vp.addEventListener("touchstart",function(e){if(e.touches.length===1){tid=e.touches[0].identifier;lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:true});
  vp.addEventListener("touchmove",function(e){if(e.touches.length===1&&e.touches[0].identifier===tid){var t=e.touches[0];px+=t.clientX-lx;py+=t.clientY-ly;lx=t.clientX;ly=t.clientY;document.getElementById("tl").style.transform="translate("+px+"px,"+py+"px)";drawMiniMap()}},{passive:true});
  vp.addEventListener("touchend",function(){tid=null});
  vp.addEventListener("wheel",function(e){e.preventDefault();var os=sc;if(e.deltaY<0)sc=Math.min(5,sc*1.1);else sc=Math.max(.3,sc/1.1);var r=sc/os;var rect=vp.getBoundingClientRect();var mx=e.clientX-rect.left,my=e.clientY-rect.top;px=mx-r*(mx-px);py=my-r*(my-py);updateZoom();applyFilters()},{passive:false});
  document.getElementById("sq").addEventListener("input",function(e){sq=e.target.value.trim();applyFilters()});
  window.addEventListener("keydown",function(e){
    if(e.key==="Escape")closeModal();
    if((e.key==="+"||e.key==="=")&&!e.ctrlKey)zI();
    if(e.key==="-"&&!e.ctrlKey)zO();
    if(e.key==="0"&&!e.ctrlKey)resetView();
    if(e.key==="d"&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT')toggleTheme();
    if(e.key==="r"&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT')randomBook();
    if(e.key==="g"&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT')toggleGenre();
    if(e.key==="s"&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT')toggleStats();
    if(e.key==="/"&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById("sq").focus()}
  });
  document.getElementById("mo").addEventListener("click",function(e){if(e.target.id==="mo")closeModal()});
  window.addEventListener("resize",function(){applyFilters()});
}
</script>
</body>
</html>
